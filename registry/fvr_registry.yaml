  obligation_anchor:
    source_type: clause_id
    value: "10.2.4"
    quote: "FVR_entry = {property_id, 检查程序, 静态/动态归属, 触发接线, 证据形态, 失败路由}"
    verified: true
  schema_status: schema+instances
  instance_state: "8 个 FVR 集（G-CAND-01..08，v1.1.0），39 条硬性质全覆盖"
