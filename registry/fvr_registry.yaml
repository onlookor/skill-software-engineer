  status_vocabulary_source: "0.17.2 条目状态枚举（同一词汇表，不另立）"

entry_fields:
  - {name: fvr_id, type: string, required: true, note: "FVR-<部署>-<卡片>"}
  - {name: card_id, type: string, required: true}
  - {name: file, type: string, required: true, note: 条目本体路径}
  - {name: version, type: string, required: true}
  - {name: sha256, type: string, required: true}
  - {name: properties, type: list, required: true, note: "本集接线的 property_id 全集"}
  - {name: status, type: "enum: draft|seed|active|deprecated|retired", required: true}

