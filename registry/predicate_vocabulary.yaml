vocabulary_gaps:
  # 检测谓词书写中发现的词汇缺口 → R2 提议候选（不得本地造词），与 method_registry.yaml gaps 台账联动
  - id: VG-01
    missing_need: "「必须同步部署/独立部署」的谓词形态（分布式单体检测需要）"
    workaround: "以 2.5 depends_on(M1, M2, deploy, ·) 表达部署类依赖；语义等价性由人工判断登记"
    route: "R2 提议候选（成文法谓词未登记）"
  - id: VG-02
    missing_need: "「拆分粒度过细（纳米服务）」「职责粒度过细」的可判定谓词"
    workaround: "方括号事实占位符 + M15 勘察义务"
    route: "R2 提议候选"
  - id: VG-03
    missing_need: "依赖方向控制族的方向谓词：(i) 端口方向（六边形的核心 → 端口 ← 适配器，『核心不依赖任何外部技术』的可判定形态）；(ii) 环方向（同心圆/整洁架构『依赖只能指向内层』，layer_of 只给层归属、不给层间方向序）；(iii) 模块边界方向（单体内部边界、模块化单体的模块间禁止穿透）；(iv) 拓扑方位/节点角色（边缘计算的边缘节点 vs 中心，Broker/SOA 的中介角色）。1.5 已登记 dependency_rule 与 layer_of，但四者均无法以其现有元数据表达方向违例。"
    workaround: "以 2.5 depends_on(A, B, ·, ·) 表达依赖存在性 + 方括号事实占位符标注方向约束（M15 勘察义务）；相关 anti_patterns.signal_level 暂按 P1 登记，并在行内注明『词汇补齐后按 V1 同型升 P0』（method_registry.yaml: gaps G-STY-4、manual_judgments MJ-4）"
    affected: "method_registry.yaml STY-008-AP2（@633/635）、STY-009-AP1（@711）、STY-015-AP1、STY-019-AP1"
    route: "R2 提议候选（成文法谓词未登记；补齐属 1.5 谓词表扩充 = 高影响，走 ADR + 批准）"
  - id: VG-04
    missing_need: "契约形态声明族谓词：(i) 契约版本化/兼容策略的声明态（扩展点契约是否登记 compat_policy——注意 compat_policy 在母本仅为 3.5 contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state) 的实参槽名（@1996），以实参槽名充当谓词属本地造词）；(ii) 数据 schema 的声明态（黑板写入项是否有 schema 声明——schema 在母本为契约工件名（3.2.1『schema + 语义条款』），非 x.5 登记谓词）；(iii) 管道全局错误处理的声明态（pipe 是否有全局错误处理声明、步骤失败是否有处置路径——error_handling 母本全无登记，1.2.1 管道行仅自然语言反模式名）。三者均为『声明存在性』判据，1.5 已登记的 declared(...) 族不覆盖契约形态细分。"
    workaround: "方括号事实占位符 + M15 勘察义务（unknown → 候选保留 + 勘察义务，禁沉默排除）；修正判读登记 method_registry.yaml manual_judgments MJ-12"
    affected: "method_registry.yaml STY-010-AP1、STY-011-AP1、STY-013-AP2 的 detection_predicate"
    route: "R2 提议候选（成文法谓词未登记；补齐属 1.5 谓词表扩充 = 高影响，走 ADR + 批准）"
  - id: VG-05
    missing_need: "配置治理族谓词（5.2.6 四项与 5.5 Z6 公式所需，六面均无谓词形态）：(i) `expiry`（开关到期时刻——Z6 公式 @2588 逐字「Z6: ∀ flag(G,_,behavior,_): ∃ approved(ADR(G)) ∧ declared(expiry(G)) ∧ now ≤ expiry(G) ∨ cleanup_filed」的第二、三支用之，同时是 5.5 @2567 `flag(G, scope, level, expiry)` 的第四槽名；以实参槽名充当谓词属本地造词，同 VG-04 (i) 对 compat_policy 的判读）；(ii) `cleanup_filed`（清理已立案——Z6 第四支的裸谓词，不在 predicates／formula_words／clause_defined_predicates 三表任一）；(iii) `ADR`（行为级变更的决策记录工件——Z6 首支 `approved(ADR(G))` 的实参函数；母本 0.17.6／9.2.2 有 ADR 义务而无 ADR 谓词或工件名登记）；(iv) @2505 五个登记槽名（键／值域／作用域／级别／生命周期）的「已登记」判据形态——registered(...) 族在册，但母本未给配置项的实参类型与值域表示法，registered 的对象域无从判定；(v)「（变更前后 Z 谓词）快照比对」全无谓词形态——@2506／@2508／5.5 @2572 三处明文互指（@2572 括注逐字「**配置变更触发 = 变更前后 Z 谓词快照比对**，5.2.6」），但无比对函数、无快照工件名、无一致性判据，亦无采集时点／粒度／保留期；(vi) @2507 的「审查期／到期日／僵尸开关」三名无谓词形态——僵尸开关＝expiry 超期 ∧ ¬cleanup_filed 的复合判据，9.2.3 @3616 已把它当汇聚信号源用（逐字「僵尸开关（expiry 超期）…Z6 违例 → P0（行为级开关）；其余 P2」）而无词汇支撑。六面均属「声明存在性／时刻比较」判据；在册可直接使用者仅 flag（arity 4）／registered／declared／approved／now／has／interaction_flow／orchestrator／timeout_budget／quality_impact_card（5.5 @2559-2569 与三表实测，在册名合计 **76**＝predicates 59＋formula_words 7＋clause_defined_predicates 10），不足以表达 Z6 的完整判据。"
    workaround: "方括号事实占位符 + M15 勘察义务（unknown → 候选保留 + 勘察义务登记，禁沉默排除），**绝不写调用式**（写 `expiry(G)` 即 M4 硬失败，RLP 批 4 处先例）；方括号内 snake_case／中文占位词被 outside_brackets（scripts/project.py @208）剔除，不构成 M4 违例（先例 RLP-006 @6204 `[到期时刻](G)`）；判读登记 method_registry.yaml manual_judgments MJ-26 (viii)（方括号兼承「非谓词面」与「待勘察占位」两义而 M4 不区分，含 CH-C(2) 通道号的误读陷阱），缺口面登记 gaps G-CFG-1 statement (1)(2)(5) 与 route ①（expiry 载体形态、审查期长度或到期日计算基准、快照采集时点／存放位置／粒度／保留期是否在母本侧补明文，涉母本改动 → 高影响，走 R2/ADR），勘察义务登记 survey_obligations SO-14（存量开关到期日与存量规避面）"
    affected: "method_registry.yaml CFG-001…CFG-004 四条的 anti_patterns[].detection_predicate 与 applicability 三空间（口径＝两字段内半角方括号成对匹配计数、不含嵌套，2026-10-08 以 YAML 解析实测）：detection_predicate 20 行**全部**含方括号、处数 **29**；applicability 36 项中 **24** 项含方括号、处数 **24**；合计 **53** 处，其中 [CH-C(2)] 1 处系接续通道号包裹（M4 剔除面，非词汇缺口）、余 **52** 处为待勘察／非谓词占位（[到期日] 3 处、[变更前后 Z 谓词快照不一致] 2 处、其余 47 种各 1 处）。后果：9.2.2 @3594-3595 守护规则九槽中「检测手段」与「阈值与趋势窗口参数」两槽因 (v) 快照比对面无词汇支撑而无母本据可填（G-CFG-1 statement (2)）；CFG-004 的五条 anti_patterns 只能以「无比对面」为违例形态、不能给出可执行检测手段。在册名 **76** 本批未变（不本地造词，R2 前不得扩表）。此 53 处系 VG 侧口径，与 project.py census_placeholders 的 CFG 侧 **60** 处（15／13／14／18）不同轴：后者跨全部字段（含 cost_profile.ops_cost 等）且把同一 detection_predicate 内的多个短语按 #1／#2 拆分计数，两者不得互代（0.4＋计数口径显式声明纪律）。"
    route: "R2 提议候选（成文法谓词未登记；补齐属 1.5 谓词表扩充 = 高影响，走 ADR + 批准）；G-STY-4／G-CFG-1 route ① 同型"
