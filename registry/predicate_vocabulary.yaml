#
# 性质声明：本文件**不是**规范来源。权威在母本各 x.5 形式化锚点节与
# 0.17.8 / 0.18.6 / 0.20.4 / 0.21.6 / 10.5；本文件是其逐条投影，供 project.py 校验
# applicability 谓词与 anti_patterns.detection_predicate 是否使用了未登记谓词名
# （编译规范 2.3「谓词名注册」：发现缺失 → R2 提议，不得本地造词）。
#
# 自校验：project.py 对每条 source.value 反查母本正文，指针不可查 → 报错（防幻觉）。

