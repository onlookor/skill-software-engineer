vocabulary_gaps:
  # 检测谓词书写中发现的词汇缺口 → R2 提议候选（不得本地造词），与 method_registry.yaml gaps 台账联动
  - id: VG-01
    missing_need: "「必须同步部署/独立部署」的谓词形态（分布式单体检测需要）"
    workaround: "以 2.5 depends_on(M1, M2, deploy, ·) 表达部署类依赖；语义等价性由人工判断登记"
    route: "R2 提议候选（成文法谓词未登记）"
  - id: VG-02
    missing_need: "「拆分粒度过细（纳米服务）」「职责粒度过细」的可判定谓词"
    workaround: "方括号事实占位符 + M15 勘察义务"
    route: "R2 提议候选"
  - id: VG-03
    missing_need: "依赖方向控制族的方向谓词：(i) 端口方向（六边形的核心 → 端口 ← 适配器，『核心不依赖任何外部技术』的可判定形态）；(ii) 环方向（同心圆/整洁架构『依赖只能指向内层』，layer_of 只给层归属、不给层间方向序）；(iii) 模块边界方向（单体内部边界、模块化单体的模块间禁止穿透）；(iv) 拓扑方位/节点角色（边缘计算的边缘节点 vs 中心，Broker/SOA 的中介角色）。1.5 已登记 dependency_rule 与 layer_of，但四者均无法以其现有元数据表达方向违例。"
    workaround: "以 2.5 depends_on(A, B, ·, ·) 表达依赖存在性 + 方括号事实占位符标注方向约束（M15 勘察义务）；相关 anti_patterns.signal_level 暂按 P1 登记，并在行内注明『词汇补齐后按 V1 同型升 P0』（method_registry.yaml: gaps G-STY-4、manual_judgments MJ-4）"
    affected: "method_registry.yaml STY-008-AP2（@633/635）、STY-009-AP1（@711）、STY-015-AP1、STY-019-AP1"
    route: "R2 提议候选（成文法谓词未登记；补齐属 1.5 谓词表扩充 = 高影响，走 ADR + 批准）"
  - id: VG-04
    missing_need: "契约形态声明族谓词：(i) 契约版本化/兼容策略的声明态（扩展点契约是否登记 compat_policy——注意 compat_policy 在母本仅为 3.5 contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state) 的实参槽名（@1998），以实参槽名充当谓词属本地造词）；(ii) 数据 schema 的声明态（黑板写入项是否有 schema 声明——schema 在母本为契约工件名（3.2.1『schema + 语义条款』），非 x.5 登记谓词）；(iii) 管道全局错误处理的声明态（pipe 是否有全局错误处理声明、步骤失败是否有处置路径——error_handling 母本全无登记，1.2.1 管道行仅自然语言反模式名）。三者均为『声明存在性』判据，1.5 已登记的 declared(...) 族不覆盖契约形态细分。"
    workaround: "方括号事实占位符 + M15 勘察义务（unknown → 候选保留 + 勘察义务，禁沉默排除）；修正判读登记 method_registry.yaml manual_judgments MJ-12"
    affected: "method_registry.yaml STY-010-AP1、STY-011-AP1、STY-013-AP2 的 detection_predicate"
    route: "R2 提议候选（成文法谓词未登记；补齐属 1.5 谓词表扩充 = 高影响，走 ADR + 批准）"
  - id: VG-05
