# 生产排期登记（D-16）：部署级实例
#
# 义务锚点（母本 10.2.5 判据六）：
#   「部署可行性勘察结论已登记（批准角色、P0 响应、CI）」
#   P0 响应维度的 conversion_event ＝「首次生产部署前」；到期未转 → 强制转 confirmed_absent。
#
# 性质：本文件是**部署实例登记**，不是母本条款；不改动母本。
# 落点缺口：母本未给生产排期的文件/字段规范；本文件按 registry/ 既有辅助注册表
#   （schedules.yaml / approval_registry.yaml）的 meta/entries 惯例自建，登记为 D-16。
#
# 纪律：排期事实只能由人类责任方提供。agent 不代填、不推测，不得以决策日期
#   （2026-12-31）冒充部署日期。未答字段一律 null。
# 2026-11-15：人类 user 答复六项（原话逐字见 meta.declaration_raw）。凡与 schema
#   取值域/字段语义不符处，记入 meta.pending_conflicts 并在相关字段保持 null；
#   agent 未代选解释，也未对原话做近义改写。
# 2026-11-15（15:28+08:00）：人类裁定 C-1～C-4 与三处说明缺口，按原话落实：
#   declared_by=onlookor（排期声明人，与批准人语义分离）；新增 review_at 承载复核日；
#   release_mechanism 保留原值并记 release_execution=not_executed；alert_channel=none 逐字；
#   declared_at 用完整 datetime；M-2 两段分写；M-4 补「无备份」；M-6 补原因。
# 2026-11-15（15:38+08:00）：人类裁定 C-3：无告警通道即无 ack SLA。
#   ack_sla=none 逐字落；p0_response.state 转 confirmed_absent；missing 清空。
#   pager 仍未获回答，保持 null（未填 none），缺口记入 meta.open_notes。
# 2026-11-15（续，人类裁定）：pager 亦记 none——人类的选择是「整套告警机制没有」，
#   不是「某一槽留空」。更正：alert_channel／pager／ack_sla 是三个独立字段
#   （通道／分页器／确认时限），不是互斥选项；此前把三槽平铺陈述造成「几选一」误读，
#   该误读源于本文件此前的表述，不是用户原意。三槽现均为 none，state 维持 confirmed_absent。
# 2026-11-15（续二，人类选定额 A）：9.3 缺陷保留原判与依据，按解释
#   INT-D16-9.3-SCOPE-01 在 status=not_in_scope ∧ review_at 非空时挂起效力；
#   该解释不是 Waiver、不产生豁免、不改判定，其他条目不得自动套用。

meta:
  law_file: ../软件工程元框架成文法.md
  registry_version: {major: 0, minor: 6, patch: 0}
  obligation_anchor:
