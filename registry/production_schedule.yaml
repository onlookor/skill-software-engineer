    declared_by: "onlookor"      # 排期声明人（条目字段语义；与批准注册表的批准人不同）
    declared_at: "2026-11-15"
    items:
      M-1: "本阶段不部署；复核日期 2026-12-31"
      M-2: "仅本机可达，不包含 npm 公网发布"
      M-3: "单写入者"
      M-4: "onlookor"
      M-5: "none"
      M-6: "回滚窗口 none，owner 为 onlookor"
  normalization_log:
    - {item: "M-1", field: "first_production_deployment.decision", from: "本阶段不部署", to: "not_in_scope", reason: "schema 枚举为 deploy|not_in_scope|null，无中文取值"}
    - {item: "M-2", field: "first_production_deployment.environment", from: "仅本机可达，不包含 npm 公网发布", to: "本机｜仅本机", reason: "人类裁定第 6 条：运行位置与可达范围两段分写；发布口径另见 meta.release_execution"}
    - {item: "M-3", field: "first_production_deployment.deployment_shape", from: "单写入者", to: "single_writer", reason: "schema 枚举为 single_writer|multi_writer|null，无中文取值"}
  release_execution:
    status: "not_executed"
    basis: "M-2：仅本机可达，不包含 npm 公网发布；release_mechanism 仅表示机制存在，本阶段不执行"
  resolved_conflicts:
    - {id: "C-1", ruling: "人类裁定第 2 条：新增 review_at 承载 2026-12-31；date 保持 null", applied: "entry_fields 增补 first_production_deployment.review_at；entries[0].review_at=2026-12-31"}
    - {id: "C-2", ruling: "人类裁定第 3 条：release_mechanism 保留原值，按『机制留着、本阶段不执行』记录", applied: "release_mechanism 未改；meta.release_execution.status=not_executed"}
    - {id: "C-4", ruling: "人类裁定第 5 条：declared_at 取当前时间，按 datetime 带时区写", applied: "declared_at=2026-11-15T15:28:33+08:00"}
    - {id: "C-3", ruling: "人类 2026-11-15 裁定：无告警通道即无 ack SLA；ack_sla=none，state 转 confirmed_absent，missing 清空；pager 不得代填", applied: "ack_sla=none；p0_response.state=confirmed_absent；missing=[]"}
    - {id: "C-3b", ruling: "人类 2026-11-15 续裁：pager 也记 none（整套告警机制没有，不是某一槽留空）", applied: "pager=none；三槽均 none；并更正三字段语义（独立字段，非互斥选项）"}
    - {id: "A-1", ruling: "人类 2026-11-15 选定额 A（范围限定挂起）：9.3 以部署为前提，未进入生产部署则缺陷效力挂起；同时明确该解释不是 Waiver、不产生豁免、不改缺陷判定", applied: "entries[0].deployment_feasibility_defect（disposition=suspended_by_scope_interpretation）；meta.interpretations[INT-D16-9.3-SCOPE-01]；10.2.5 判据六证据同步"}
  open_notes:
    - "M-4：按裁定第 7 条记为 onlookor（无备份）；未另设 backup 字段。"
    - "M-6：按裁定第 8 条 rollback_window=none，原因＝尚未确立机制。"
    - "字段语义更正（来源：人类 2026-11-15 续裁）：alert_channel／pager／ack_sla 是三个独立字段——通道（告警发往何处）、分页器（是否呼叫值班人）、确认时限（多久内必须确认）；三者不是互斥选项。此前本文件把三槽平铺陈述，造成「几选一」的误读，该误读来自 agent 的表述，不是用户原意。"
    - "9.3 缺陷处置（来源：人类 2026-11-15 选定额 A）：缺陷原判与全部依据保留在 entries[0].deployment_feasibility_defect；仅其效力在 status=not_in_scope ∧ review_at 非 null 时挂起。该挂起不是 Waiver、不产生豁免、不改变缺陷判定，也不得被其他条目自动套用。"
  interpretations:
    - id: "INT-D16-9.3-SCOPE-01"
      title: "9.3 部署形态可行性缺陷在未进入生产部署时的范围限定挂起"
      text: "9.3 的『部署形态可行性缺陷』以部署为前提；当 D-16 status=not_in_scope（本阶段不部署）时，该缺陷无可作用对象，判定保留但挂起其效力，待首次生产部署决策前重新适用。"
      adopted_by: "user"
      adopted_at: "2026-11-15"
      basis_clause: "母本 9.3（『无值班能力的部署，P0 响应义务不可履行 = 守护体系不可行 = 部署形态可行性缺陷，勘察结论登记』——主语是『部署』）"
      is_not:
        - "不是 Waiver（9.2.2），不产生任何豁免效力"
        - "不删除、不改写、不降低、不改变缺陷判定本身"
        - "不改变 10.2.5 判据六的 pass/fail（判据六只评声明完整性；该缺陷从未是判据六的 fail）"
        - "不是通用免责口子，不得被其他条目、其他部署实例自动援引"
      applicability:
        all_of:
          - "D-16 status == not_in_scope"
          - "存在 review_at 复核日期（非 null）"
        fallback: "缺任一条（status≠not_in_scope，或 review_at 缺失）→ 本挂起不成立，回落到缺陷原判生效"
        citation_rule: "其他条目若想援引同一解释，须另行人类裁定，不得自动套用"
      review_at_link:
        review_at: "2026-12-31"
        on_review_date: "触发一次复核；维持 not_in_scope 则挂起继续，并在下一个复核日期前重新确认"
        on_deployment_decision: "复核决定进入部署，或 status 改为非 not_in_scope → 挂起立即失效，缺陷原判生效并进入整改路径"
  recompile_note: ".12：已按人类确认完成重编译（artifact snapshot production_schedule 0.6.0 / grounding 1.21.0；.11 按 CA-03 记 stale）。"
  concurrency_gate:
    protocol: "#9（编译规范 11.4 并发协议）"
    status: "not_triggered"
    basis: "M-3 deployment_shape=single_writer（原话『单写入者』，见 declaration_raw）"
    recheck_when: "部署形态改为 multi_writer，或首次生产部署决策涉及多写入方"
    checked_at: "2026-11-15"
    note: "单写入方场景 #9 平凡满足；not_triggered 不表示 #9 已实现。"

entry_fields:
  - {name: deployment, type: string, required: true}
  - {name: first_production_deployment.date, type: "date|null", required: true, note: "null = 人类尚未给出；不得用决策日期顶替"}
  - {name: first_production_deployment.review_at, type: "date|null", required: false, note: "decision=not_in_scope 时承载复核日期；decision=deploy 时为 null"}
  - {name: first_production_deployment.decision, type: "enum: deploy|not_in_scope|null", required: true}
  - {name: first_production_deployment.environment, type: "string|null", required: true}
  - {name: first_production_deployment.deployment_shape, type: "enum: single_writer|multi_writer|null", required: true, note: "多写入方 = 编译规范 11.4 #9 的触发条件"}
  - {name: first_production_deployment.release_mechanism, type: "string", required: true}
  - {name: first_production_deployment.rollback_window, type: "string|null", required: true}
  - {name: first_production_deployment.rollback_owner, type: "string|null", required: true}
  - {name: p0_response.on_call_owner, type: "string|null", required: true}
  - {name: p0_response.alert_channel, type: "string|null", required: true, note: "告警发往何处（通道）；与 pager／ack_sla 是三个独立字段，非互斥选项"}
  - {name: p0_response.pager, type: "string|null", required: true, note: "是否呼叫值班人（分页器）；与 alert_channel／ack_sla 独立"}
  - {name: p0_response.ack_sla, type: "string|null", required: true, note: "多久内必须确认（确认时限）；与 alert_channel／pager 独立"}
  - {name: p0_response.state, type: "enum: undetermined|confirmed_present|confirmed_absent", required: true}
  - {name: declared_by, type: "string|null", required: true, note: "排期声明人，须为人类；不得写 agent；与批准人语义不同"}
  - {name: declared_at, type: "datetime|null", required: true}
  - {name: source, type: "string|null", required: true}

