    value: "10.2.5-6"
    quote: "部署可行性勘察结论已登记（批准角色、P0 响应、CI）；P0 响应 conversion_event＝首次生产部署前"
    verified: true
  schema_status: schema+instance
  instance_state: "1 个部署实例（pact-dsh）；M-1～M-6、C-1～C-4/C-3b 与 A-1 均按 2026-11-15 人类裁定落实；p0_response 三槽均为 none；9.3 缺陷原判保留、效力按 INT-D16-9.3-SCOPE-01 挂起；missing 为空"
  status_domain: [pending, confirmed_present, not_in_scope, confirmed_absent]
  status_basis: "M-1『本阶段不部署』→ not_in_scope；C-3 不改变该结论"
  note: "本文件不含任何由 agent 推测的日期、环境或责任人；未答字段一律 null。"
  declaration_raw:
