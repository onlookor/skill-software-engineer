# ── 剖面级缺口（R2 澄清候选；不静默造规则）──
gaps:
  - gap_id: KP-G1
    type: 成文法歧义（0.17.6 差异分类 c）
    statement: "0.17.3 末句承诺「每 kind 的选取算法剖面（哪些步骤必填哪些字段）在 0.18.4 实例化映射中登记」，但 0.18.4 实为 8 行「规程变体要点」，粒度是方面而非 kind（方面 4 一行覆盖 OWN/STP/CSL/DFL 四 kind，方面 5 一行覆盖 CRD/RLP/SCH/CFG 四 kind），且未覆盖 GRD/PRJ/GOV；「哪些步骤必填哪些字段」在母本中无逐 kind 明文。"
    impact: "本文件的 required/optional 划分只能以 0.17.2 schema + 0.17.4 消费映射 + 0.18.4 变体要点为依据推得，逐 kind 细分为人工判断（provenance.origin=hybrid/manual）。"
    route: R2 提议澄清候选
    status: open
  - gap_id: KP-G2
    type: 自指循环
    statement: "0.17.8 M2 = ∀E(status ≠ draft) 按 kind 剖面完备；而 kind profile 本身是注册表条目（0.17.2 元注册），其自身完备性若也按剖面判定即自指。母本未定元条目的判据。"
    impact: "本目录以 README §5 C-KP 临时约定：元条目完备性 = required_fields/optional_fields 两列表在案（物化自 common_required + 增量），不受 M2 按 kind 剖面判定；元条目 id 形态 kind_profile_{KIND} 不受 C-ID 的 {kind前缀}-{序号} 格式约束。"
    route: R2 提议澄清候选
    status: open
  - gap_id: KP-G3
    type: 适用性无据
    statement: "非 0.18 选型路径的 kind（GRD/PRJ/GOV）是否须声明 0.8 包络与 cost_profile，母本无明文；0.8 表述为「每种方法条目」，未界定「方法条目」是否含守护规则模板/投影规则/治理模板。"
    impact: "三个剖面 status=draft，undecided_fields 明列；这些 kind 的条目在缺口闭合前不得声明 status=seed（README §5 C-ST）。"
    route: R2 提议澄清候选
    status: open
  - gap_id: KP-G4
    type: 术语不一致（0.17.6 差异分类 c）
    statement: "0.17.2 举例用「projection_vocabulary 条目」，0.17.3 封闭枚举中对应 kind 前缀为 PRJ、名称为「投影词汇/规则」；两处术语未对齐。"
    impact: "本文件按 PRJ 理解该例，并将其作为唯一有明文依据的 not_applicable 判定登记。"
    route: R2 提议澄清候选
    status: open
