# kind 剖面（元注册条目）——数据侧权威
#
# 依据：母本 0.17.2「字段完备性按 kind 剖面…kind profile 本身是注册表条目（元注册），变更走 0.13」；
#       0.17.8 谓词 kind_profile(kind, required_fields, optional_fields)；0.17.3 kind 封闭枚举；
#       0.18.4 各方面实例化映射；0.8 包络声明义务。
# 条目 schema 逐字采用 0.17.2，不重定义、不扩展、不裁剪（编译规范 2.4）。
#
# 书写形态（数据侧约定，见 README §2/§5 C-KP）：
#   1. 元条目 entry_id = kind_profile_{KIND}（0.17.8 谓词以 kind 为键）；describes_kind = 被剖面的 kind。
#   2. 剖面以「通用必填 + 逐 kind 增量」书写，避免 17 份重复；scripts/project.py 物化为
#      每个 kind 的 required_fields / optional_fields 两列表（C-KP 判据），并据此执行 M2。
#      物化公式：required_fields = common_required − optional − not_applicable + required_extra
#   3. optional / not_applicable 每项必须带 reason 与 provenance（0.17.6 第四层：人工判断兜底，
#      禁默认值假充）；无母本依据者 provenance.origin = manual。
#   4. status=draft 的剖面表示其字段适用性缺母本依据，缺口已登记于 gaps，不得用于放行 seed 条目。

meta:
  law_file: ../软件工程元框架成文法.md
  registry_version: "1.0.0"
  schema_source: {source_type: clause_id, value: "0.17.2", verified: true}
  kind_enum_source: {source_type: clause_id, value: "0.17.3", verified: true}

# ── 通用必填（全 kind；来源逐条标注）──
common_required:
  identity:                       # 0.17.2 身份与状态层；S5/S6 消费 typical_reversibility（0.17.4）
    source: {source_type: clause_id, value: "0.17.2", verified: true}
    fields:
      - entry_id
      - kind
      - name
      - version
      - status
      - provenance
      - typical_reversibility
  applicability:                  # S1 候选装配 + S3 三空间过滤（0.17.4）
    source: {source_type: clause_id, value: "0.17.4", verified: true}
    fields:
      - applicability.problem_space
      - applicability.current_space
      - applicability.delivery_space
  envelope:                       # S4 包络校验（0.17.4）；0.8「每种方法条目必须声明包络」
    source: {source_type: clause_id, value: "0.8", verified: true}
    fields: [envelope]
  cost_profile:                   # S4 卡片聚合 + S5 排序 + S3 技能前提（0.17.4）
    source: {source_type: clause_id, value: "0.17.4", verified: true}
    fields:
      - cost_profile.latency_budget_delta
      - cost_profile.failure_modes
      - cost_profile.consistency_impact
      - cost_profile.observability_requires
      - cost_profile.ops_cost
      - cost_profile.skill_prerequisites
      - cost_profile.aggregation_semantics
  relations:                      # S2 约束排除（0.17.4）；1.4 施加/接收约束表；方面 9 G 规则播种
    source: {source_type: clause_id, value: "0.17.4", verified: true}
    fields:
      - compatibility
      - constraints_imposed
      - anti_patterns
      - formal_anchor
      - references
  narrative:                      # 0.17.2 人类解释层；M5 narrative_sync 抽查对象
    source: {source_type: clause_id, value: "0.17.2", verified: true}
    fields:
      - narrative.benefit_cost_analysis
      - narrative.typical_scenarios
      - narrative.common_misuse

