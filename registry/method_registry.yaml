# ---------------------------------------------------------------------------
# 六、勘察义务（注册表侧）。区分两类义务：
#   (a) 入库期义务 —— 母本未给、需人工勘察才能补全注册表字段者，登记于此（SO-x）；
#   (b) 决策期义务 —— 条目内方括号 […] 事实占位（M15：求值为 unknown 时候选保留 +
#       勘察义务登记，禁沉默排除），逐条枚举由 project.py 汇总输出
#       projections/勘察义务清单.md，本节不重复登记（避免与生成物双写）。
# ---------------------------------------------------------------------------
survey_obligations:
  - obligation_id: SO-1
    kind: 入库期
    obligation: "补录各风格条目的现状空间与交付空间适用条件事实（须过 0.4 出处门槛：现状勘察产物/既有 ADR/团队能力事实），回填 applicability.current_space / delivery_space 的空列表。"
    gap_ref: G-STY-1
    consumer: "0.18.2 S1（applicability 求值；unknown ≠ false → 候选保留）"
    trigger_rule: "M15 + FM-1（必需事实缺失且无勘察登记 = 证据缺口）"
    status: open

  - obligation_id: SO-2
    kind: 入库期
    obligation: "勘察并登记三处边界的依赖规则（单体内部边界、模块化单体的模块边界、管道-过滤器的过滤器旁路），使 V1（无违例环）可绑定；登记后按 MJ-4 判据将相关反模式由 P1 升 P0（升级 = 守护规则改级，走完整 ADR + 批准）。"
    gap_ref: G-STY-4
    consumer: "1.5 V1；0.14 守护分级；9.2.1 信号汇聚"
    trigger_rule: "M15；0.14『不许运行时即兴改级』（升级走注册表变更）"
    status: open

  - obligation_id: SO-3
    kind: 入库期
    obligation: "补勘文献来源并定 compile_usage：STY-012（MVC，书目 1/2 登记面均不覆盖）、STY-021 与 STY-024（1.2.4 元方法无行级提取面；含书目 2 登记面是否涵盖 1.2.4 的人工裁决）。补入须走母本参考文献表扩充（0.12『扩充』语义裁决 + 高影响批准）。"
    gap_ref: G-STY-3, G-STY-5
    consumer: "0.17.8 M6（references 的 compile_usage/trust_grade 声明；存疑级不得为唯一出处）"
    trigger_rule: "M6；0.17.7 门槛 6（禁以不承载主张的文献充当出处）"
    status: open

  - obligation_id: SO-4
    kind: 入库期
    obligation: "补齐谓词词汇（predicate_vocabulary.yaml: VG-01 部署类依赖谓词、VG-02 粒度可判定谓词、VG-03 依赖方向控制族方向谓词 + 模块边界方向 + 拓扑方位/节点角色、VG-04 契约形态声明族谓词〔契约兼容策略/schema/管道全局错误处理的声明态〕）。补齐前相关 detection_predicate 以 depends_on workaround 与方括号占位表达，语义等价性由人工判断登记（VG-04 的三处造词修正见 MJ-12）；补齐后按 MJ-4 复核 signal_level（STY-008-AP2、STY-009-AP1、STY-015-AP1 明记『词汇补齐后升 P0』）。"
    gap_ref: "predicate_vocabulary.yaml: vocabulary_gaps VG-01/VG-02/VG-03/VG-04"
    consumer: "0.17.8 M4（detection_predicate 词汇封闭 = 可执行）；编译规范 2.3 谓词名注册"
    trigger_rule: "M4；R2（发现词汇缺失 → 提议候选，不得本地造词）"
    status: open

  - obligation_id: SO-5
    kind: 入库期
    obligation: "补齐 6.2.1 指标族与母本包络用语的映射裁定（G-ENV-1 列出的九项用语），或扩 6.2.1 指标族。裁定前 envelope.metric 按最相近族登记并在行内注记映射理由，不得本地新增 metric 名。"
