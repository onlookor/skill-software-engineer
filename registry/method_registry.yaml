    remediation_plan: "闭合路径同前七项：(1) project.py 自检全过（本批，见 ST-DFL-01 evidence）→ (2) 编译器对 seed 条目执行『人工条目 vs 编译条目』重验证，差异按 0.17.6(3) 三分类处置 → (3) 建立 FVR 条目并为 Z2／Y1／Y2 接线，首次全量运行留证（E3 的 first_full_run has evidence）→ (4) 逐条 seed→active（diff 为空 = 低影响简记；diff 非空按三分类分别定级）。本 Waiver 在 (3) 完成时闭合。本批特有前置：(a) **接线所依赖的母本公式词面存在未登记词，须先经 R2 词汇批次核定**——实测（脚本比对 predicate_vocabulary.yaml 三节共 **76** 个已登记名：predicates 59＋formula_words 7＋clause_defined_predicates 10）：Z2 公式（@2577）所用 declared（formula_words @97）、delivery_semantics（predicates @64）、idempotency（@65）三词均已登记，惟 `idempotency_declared(consumer)` 系复合形态，MJ-12 已裁定以 `idempotency(x, ·) ∧ declared(·)` 表达、不本地造词 → **Z2 可先行接线**；Y1 公式（@2279）缺 `has_approved`（已登记形态为 has_approved_exception/3 @31，母本公式用一元 has_approved(shared_write_exception(D))）；Y2 公式（@2281）缺 `provider`（其余 access_path @48、registered @98、owner @47 均已登记）。该 **2 词**（has_approved／provider）已计入 WV-STP-E3-01 所记母本 4.5 公式侧 **7 词**缺口（MJ-22 (vi)），本项不重复计数、不另立新面；本批 detection_predicate 与 applicability 三空间剥方括号后的调用词共 **11** 个（has_approved_exception@31、dataset@46、owner@47、access_path@48、data_flow@51、data_lineage@52、delivery_semantics@64、idempotency@65、time_semantics@69、declared@97、registered@98），**全部已登记 → 本批零新增未登记候选**，累计仍 **19** 词（MJ-19 (i) 4＋MJ-20 (iii) 7＋MJ-21 (v) 8；MJ-23 (v)）。另据实记载：块头注释 @5046-5049 所列七词中，outbox_table／cdc_pipeline／freshness_clause 三词在 DFL 段**零出现**（仅注释列名，M4 不扫注释）；relay／stream／batch_window／rebuildable 四词**确落 M4 扫描面**（anti_patterns.detection_predicate 与 applicability 三空间），但一律以半角方括号占位（被 project.py 的 outside_brackets @208 剔除）或实参取值形态（`rebuildable=true`／`batch_window(D)` 非 `name(` 起始的调用式，PRED_CALL_RE @221 不匹配）出现 → 不构成未登记候选（逐词落点见 ST-DFL-01 note 与 MJ-23 (v)）。故 (3) 的接线在词汇补齐前无法对 Y1／Y2 求值（Z2 可先行），归 R2 词汇批次（s5g）一并裁决，本批不扩词、不以本 Waiver 的批准为前提，词表与词数由该批次核定，本项不预设。(b) **Z2 接线须与 CRD 批共用同一 FVR 条目**——E3 要求 ∃ fvr_entry（一个性质一个条目），Z2 的既有面为 CRD 2 实例（由 WV-CRD-E3-01 承担豁免），本项 DFL-001／DFL-002／DFL-003 的 3 个实例指向同一性质；且 Z2 的判定面是**异步交互的投递语义**，DFL-004 的批装载幂等不属该面（ST-DFL-01 note；MJ-23 (iv)）→ 接线面共享、豁免面各自计息，不得按批次重复建条目，亦不得把 DFL-004-AP1／AP4 的 P1 判据挂到 Z2。(c) **Y1／Y2 接线须与既有批共用同一 FVR 条目**——Y2 的既有面为 OWN 3＋STP 1 实例（分别由 WV-OWN-E3-01／WV-STP-E3-01 承担），本项 DFL-002／DFL-005 的 2 个 consumed_by 实例（path_kind=replica／view，4.5 @2266 的 access_path 枚举含二者）指向同一性质；Y1 的既有面为 OWN 3＋DEC 1＋CTR 1＋STP 3 实例，本项 DFL-005 的 1 个 implements 实例同型 → 接线面共享、豁免面各自计息，不按批次重复建条目。(d) **references 空集与 G-DFL-1／SO-11 不阻塞接线**——DFL-003／DFL-004／DFL-005 的 references 为空列表，其现时合法性出处为 2.3 与 0.17.7 门槛 6（禁以不承载主张的文献充当出处）＋M2 对空列表平凡满足、M6 对空集平凡为真（**非豁免**，留空不得读作『无外部文献支撑』，unknown ≠ false，0.18.6 M15）；4.2.4 行级书目面可否下探由 SO-11 裁决，与 E3 的性质接线相互独立。(e) **compatibility 面不因批准而闭合**——十行（composable 8／tension 2／requires 0／hard_conflict 0；DFL-004 为空列表并在 ST-DFL-01 condition 留痕）中两条 tension（DFL-002 → STY-014、DFL-003 → STY-014）不升 hard_conflict 的判读见 MJ-23 (vii)（1.2.5 硬冲突清单未列该两对）；两对同批镜像（DFL-002↔DFL-003、DFL-002↔DFL-005）已在本批内两侧同时登记（M9），不登记于 pending_conflict_rows（`open_rows` 保持空集，MJ-23 (x)）；**DFL-001↔RLP 的对不登记**（5.2.3 @2477 明文分工，RLP 未入库 → M9 阻却），由 RLP 批的下游侧承载（MJ-17 (iii)；块头 @5050-5053 已预置口径），不因本项批准而视为已闭合；STY-004 只 composable 不 requires（1.2.3 @1376 与术语表 @4280 均明记 CQRS『不必然绑定事件溯源』）。"
    risk_quantification: "触及面：5 条 × formal_anchor 引用的硬性质，共 3 项 6 个硬性质实例（Z2 3、Y2 2、Y1 1）。利息形态：硬性质违例的检出时机从『运行时/编译期自动检出』退化为『评审期人工核验』，检出延迟 = 一个决策周期；漏检后果按性质分级——Z2 漏检 = 异步交互的投递语义未声明、或语义非 at_most_once 而消费侧幂等未声明（@2577-2578 硬）：本批 3 个实例覆盖事务性发件箱（DFL-001 implements，至少一次投递即由其机制实现，4.2.4 第四列 @2198 明文『Z2 联动』）、CDC（DFL-002 consumed_by）与流处理（DFL-003 consumed_by），漏检的终局是**重复投递在无幂等消费侧静默放大**——发件箱 relay 与 CDC 管道均为至少一次语义，重复事件直接进入下游状态而无可观测信号；且 Z2 的判定面限于异步交互，ETL/ELT 批装载（DFL-004）不属该面 → 该面缺口由 DFL-004-AP1／AP4 的 P1 判据承担而不挂 Z2（MJ-23 (iv)），其漏检形态为『以批装载的可重跑主张冒充 Z2 的投递语义声明』。Y2 漏检 = 存在绕过所有者与契约的访问路径（@2281-2282 硬）：本批 2 个实例落在 CDC 的读侧（DFL-002，path_kind=replica）与物化视图的读侧（DFL-005，path_kind=view；4.5 @2266 的 access_path 枚举含 api|event|replica|view），漏检即**读侧路径成为事实上的第二数据出口**——副本或视图未经所有者授权与契约登记即开放读（DFL-005-AP3，P0），或与 STP-001 的 Y2 implements 面（4.2.2 首行的唯一硬闸门）脱钩而使『访问路径唯一经所有者』失去可验证内容。Y1 漏检 = 派生物被当作权威状态源（@2279-2280 硬）：本批 1 个实例落在 DFL-005 的 implements 面（4.2.4 第四列 @2202『视图是**派生物不是所有者**』），漏检即物化视图承担权威语义（DFL-005-AP1，P0）→ 同一数据集合出现多所有者，与 Y1 的『|{M : owner(D, M)}| = 1』直接冲突；该面与 STP-003 的 Y1 implements（事件日志为权威状态）互为上下游，漏检使方面 4 的两个 kind 同时失守。缓解：(i) 0.17.5 强制 ADR 附注『依据种子条目，待重验证』；(ii) 本批 22 条 anti_patterns 的 P0／P1／P2 信号级判读带 4.5／5.5 性质指针与 MJ-4 判据留痕，可逐条人工复核（实测 P0 11／P1 5／P2 6；定级依据见 MJ-23 (iv)）；(iii) compatibility 面按 MJ-9 只登记母本有明文依据的对（10 行：composable 8／tension 2／requires 0／hard_conflict 0），无明文依据者不静默造规范；(iv) project.py 的 M9／C-ST／C-ENV／M2／M3／M4／M6 静态自检覆盖 peer 存在性、状态资格、DFL 剖面 envelope 非空义务（kind_profile_DFL.entry_level_exemptions 为空集 @272 → 五条一律非空；实测 20 项 bound_expr 全为关系式，M3 全过）、pattern_id 与 target_aspect 形态、谓词词汇封闭（本批零新增候选）、references 分级七项可机器判定面（三条 references 空列表以 G-DFL-1＋SO-11 显式登记，不以本地造引充数）；(v) 累计口径——本项与前七项合计覆盖 **70** 条 seed 条目（STY 24＋OWN 4＋CSL 5＋CRD 8＋DEC 8＋CTR 12＋STP 4＋DFL 5），八项 scope 互不重叠，豁免面按批次逐项登记，不合并、不互相援引。"
