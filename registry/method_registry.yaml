# 方法注册表 · 条目本体（数据侧权威）
#
# 依据：母本 0.17.2 条目 schema（逐字采用，不重定义/不扩展/不裁剪，编译规范 2.4）；
#       0.17.3 kind 封闭枚举；0.17.4 四类消费者字段映射；0.17.5 生命周期；
#       0.17.6 人工种子通道（四层数据源）；0.17.7 准入门槛；0.17.8 M 系列；0.18.6 M10–M15；
#       0.8 质量属性包络；0.14/9.2.1 守护分级；1.2 方法空间（骨架源）；1.2.5 冲突矩阵；
#       1.4 约束接口（施加表）；1.5 形式化锚点（V1–V5）；6.2.1 指标词汇；0.12 可信度分级。
#
# 本批次：STY（架构风格）24 条 = 1.2.1（7）+ 1.2.2（6）+ 1.2.3（6）+ 1.2.4（5）。
# 编号采用分块序并锚定 STY-004（母本反例 18-A 已发布引用 STY-04 事件溯源；0.22 编号永不复用/重排）——
# 裁决留痕见 README §4 与本文件顶层 manual_judgments: MJ-1。
#
# 四层数据源标注约定（0.17.6(1)）：条目内**不得出现 0.17.2 之外的字段**（README §2），
# 故逐字段来源以行内注释标注，标签固定为四类：
#   骨架源       = 母本 x.2 表格行（row_id）+ 0.17.3 指针表
#   交叉表源     = 1.2.5 / x.4 约束接口表 / 0.14+9.2.1 分级 / x.5 形式化锚点
#   参考资料源   = 带 compile_usage 的书目条目（bib_id）
#   人工判断     = 无表格无文献支撑的字段，显式登记（禁默认值假充）
# 机器可读的源指针统一收敛于 provenance.source_pointers 与 envelope[].source / compatibility[].evidence；
# scripts/project.py 反查全部指针在母本中可查（防幻觉），并统计方括号事实占位符 → 勘察义务清单（M15）。

