        - {source_type: clause_id, value: "0.11", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}   # 包络指标族（性能/可修改性）
    typical_reversibility: bounded     # 人工判断：语言级接口重划须同步全部内部调用方（同编译/同部署单元内可一次完成），不跨部署边界、无外部消费者迁移面 → 非 costly；但 3.4 施→2 硬「已发布契约的边界冻结」在其承担跨模块契约职责时同样适用 → 不取 free
    applicability:
      problem_space:                   # 骨架源：3.2.1「适用条件」列＋3.3 问题空间驱动
        - "单体/模块化单体的模块边界；任何风格的单元内部（3.2.1 适用条件列逐字）"
        - "纯内部接口 → 契约稳定性要求可放宽（3.3 问题空间驱动第一行：非第三方开放场合；对外产品化场合不适用本形态）"
      current_space:                   # 骨架源：3.3 现状空间驱动＋0.11
        - "既有代码中的语言级接口是最强约束源：逆向勘察以静态分析提取为准，产出『现状契约清单』（3.3 现状空间驱动第一行；3.2.1 机器层天然性列『中（需静态分析提取）』）"
        - "无文档的隐式接口（消费者实际依赖了未声明的行为）以代码与调用点观测为准，文档仅作线索（3.3 现状空间驱动第二行；公理 A1 在契约域的具体化）"
      delivery_space:                  # 骨架源：3.3 交付空间驱动
        - "消费者团队数量少且同团队 → 兼容性规则严格度可放宽（3.3 交付空间驱动第一行：单消费者同团队 → backward 可接受）"
        - "[静态分析工具链能力在案（机器层天然性列为『中』：谓词面须工具提取才可得）——母本未给工具能力阈值 → 方括号占位（MJ-20 (iii) 同型）]"
    envelope:
