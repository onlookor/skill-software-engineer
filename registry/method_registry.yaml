      observability_requires: ["Saga 步骤状态与补偿动作可查（step_class / compensation 谓词在案，5.5）", "预扣记录与超时释放可观测（流程状态所有者 = 协调者单元，4.4 接收约束方面 5 行）"]
      ops_cost: "[随补偿步数与参与单元数上升；须承担补偿编排正确性的验证成本（Z3 每步有出路）]"
      skill_prerequisites: ["Saga 补偿设计（compensable/retriable/pivot 三分类与关键步排序，Z3）", "预扣/预留模式的业务建模（超时值作为契约条款）", "幂等性设计（补偿动作与重试的合取要求，Z3）"]
