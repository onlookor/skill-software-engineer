      - {peer_entry: STY-015, relation: composable, evidence: "1.2.4 @1388 过程定义『默认起点：模块化单体』＋ @1391『演进式的默认起点「模块化单体」是临时保守通道（0.10 权力条款第三条）的条件 (i) 所指的「登记默认值」之一』（镜像登记于 STY-015）"}
