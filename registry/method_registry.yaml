      source_pointers:
        - {source_type: row_id, value: "1.2.1-分层", verified: true}
        - {source_type: clause_id, value: "1.2", verified: true}
        - {source_type: clause_id, value: "1.2.1", verified: true}
        - {source_type: clause_id, value: "1.2.5", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "1", verified: true}
    typical_reversibility: costly      # 人工判断：层级归属与依赖规则决定依赖形状（V1 校验对象），重切分触达全部跨层调用点
    applicability:
      problem_space:                   # 骨架源：1.2.1「适用条件（摘要）」列（分号分隔 → 逐项列出）
        - "[关注点可按抽象级别自然切分]"
        - "[变更率层间差异大]"
      current_space: []                # 母本本行未给现状空间条件（G-STY-1）
      delivery_space: []
    envelope:                          # 骨架源：1.2.1「包络要点」列；metric 词汇取 6.2.1；转写规则见 MJ-2
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "change 限于层 L → touched_units ≤ |units(L)|（层内替换）；跨层变更 → touched_units = Σ_{L ∈ path} touched_units(L)；层间抽象泄漏时该项失去层内上界（见 STY-007-AP3）"   # 骨架源：「可修改性↑（层内替换）」＋「层间泄漏抽象是主要风险」；求和形态为人工转写
        source: {source_type: row_id, value: "1.2.1-分层", verified: true}
      - metric: "延迟分位数 P99"
        bound_expr: "P99(req) ≥ P99_core(req) + Σ_{L ∈ traversed} overhead_L（穿越层的开销：每穿越一层一项；overhead_L 由转发/校验/适配的实现形态决定，为参数）"   # 骨架源：「性能↓（穿越层的开销）」；求和形态为人工转写（MJ-2）
        source: {source_type: row_id, value: "1.2.1-分层", verified: true}
    cost_profile:
      latency_budget_delta: "每穿越一层：+ overhead_L（参数：层间转发/校验/适配的实现形态与层数）"
      failure_modes: ["层间抽象泄漏导致跨层变更放大", "万能工具层成为全局耦合点", "严格分层下为性能开洞（内层直访）而未登记松弛与权衡承认 ADR"]   # 骨架源前两项来自 1.2.1 反模式列；第三项交叉表源 1.2.5「严格分层 × 高性能内层直访 → 张力」
      consistency_impact: "无直接影响：一致性级别由方面 4 决定，本风格只约束依赖形状"   # 人工判断（母本未对本行给一致性摘要）
      observability_requires: ["layer_of 归属可查（依赖规则违例检测的前提）", "跨层调用计数与层间开销计量"]
      ops_cost: "[无独立运维面；成本落在结构治理侧（依赖规则校验工具与 CI 门禁）]"
      skill_prerequisites: ["抽象层级切分与依赖规则设计", "抽象泄漏的识别与处置"]
      aggregation_semantics: itemwise
    compatibility:
      - peer_entry: STY-008
        relation: composable
        evidence: {source_type: clause_id, value: "1.2.1", verified: true}   # 骨架源 @1344：「单体内每一层内部也可以是六边形」
      - peer_entry: STY-016
        relation: composable
        evidence: {source_type: clause_id, value: "1.2", verified: true}      # 骨架源 @1319：「外层微服务（部署结构）…整体上分层治理（抽象结构）」四子维度组合
      - peer_entry: STY-003
        relation: composable
        evidence: {source_type: clause_id, value: "1.2", verified: true}      # 骨架源 @1319：「服务间事件驱动（通信结构）」与抽象结构子维度正交
    constraints_imposed:               # 交叉表源：1.4「施加约束」表（行 2/6/10 无风格修饰 → 全风格通用；实例化措辞为人工判断）
      - {target_aspect: 2, constraint: "风格收窄分解策略可行集：分解单元须归属唯一层级（layer_of 全定义），层间依赖方向即分解允许的耦合方向", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集（layer_of/dependency_rule）；人类层：投影视图必须表达所选风格", level: hard}
    anti_patterns:                     # 骨架源：1.2.1「典型反模式」列；signal_level 交叉表源：0.14 + 9.2.1
      - pattern_id: STY-007-AP1
        description: "层跳跃调用（跨越相邻层直接依赖）"
        detection_predicate: "∃ c1, c2, L1, L2: layer_of(c1, L1) ∧ layer_of(c2, L2) ∧ depends_on(c1, c2, call, ·) ∧ dependency_rule(L1, L2, forbidden)"
        signal_level: P1               # 人工判断（MJ-4 同型）：母本区分严格/松弛分层——严格分层下该违例构成 V1 硬失败升 P0；松弛分层（「主要向下」）下为结构漂移，定 P1 限期整改
      - pattern_id: STY-007-AP2
        description: "下层反向依赖上层"
        detection_predicate: "∃ c_lo, c_hi, L_lo, L_hi: layer_of(c_lo, L_lo) ∧ layer_of(c_hi, L_hi) ∧ [L_lo 位于 L_hi 之下] ∧ depends_on(c_lo, c_hi, call, ·) ∧ dependency_rule(L_lo, L_hi, forbidden)"
        signal_level: P0               # 交叉表源：1.5 V1「依赖规则无违例环 —— 硬」；反向依赖是违例环的直接来源，检出即阻塞（0.14 P0）
      - pattern_id: STY-007-AP3
        description: "「万能工具层」（被全体上层依赖的公共层膨胀为全局耦合点）"
        detection_predicate: "∃ L: layer_of(·, L) ∧ [依赖 L 的上层组件占比 > R_max] ∧ [滚动窗口 W 内触达 L 的变更数 > C_max]"
        signal_level: P2               # 0.14 P2 双判据：阈值 R_max/C_max + 趋势窗口 W（均为待勘察参数，禁填无出处数字）
    formal_anchor:                     # 交叉表源：1.5 V1–V5
      - {property_id: V1, role: implements}     # dependency_rule(L1,L2,allowed|forbidden) 是本性质的直接登记面
      - {property_id: V3, role: triggers}       # 1.2.5「严格分层 × 高性能内层直访 → 张力」进入冲突矩阵检查
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 1, support_claim: "分层风格的词汇与定义（母本登记：1.2.1 抽象结构风格词汇表含分层、管道-过滤器、黑板、微内核、Broker）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：层内替换使变更触达面被层边界收敛，抽象级别与关注点对齐；代价：穿越层的开销进入每次请求路径，且层间抽象泄漏会让『层内替换』的上界失效。母本明示严格分层与松弛分层是两种依赖规则强度（自上而下 vs 主要向下），选择哪一种须显式登记（dependency_rule 谓词），因为它决定 AP1 的 P 级。"
      typical_scenarios: "关注点可按抽象级别自然切分的系统（表现/应用/领域/基础设施）、层间变更率差异明显的系统、需要以层为单位替换实现的演进场景。"
      common_misuse: "以分层之名允许任意跨层直访（依赖规则未登记即无 V1 可校验）；把公共工具堆进单一底层形成万能工具层；为性能开洞做内层直访而不记松弛分层与权衡承认 ADR（1.2.5 张力行）。"

