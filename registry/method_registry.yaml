      delivery_space:                  # 骨架源：2.3 交付空间驱动（S6 过滤器横切适用）
        - "团队拓扑与认知负荷过滤器横切适用：层次单元规模同样不得超过承载团队认知负荷上界（W3，2.3 交付空间驱动第一行）"
        - "[层次归属与团队技能栈的匹配（表现层/基础设施层的能力差异构成交付空间事实，须过 0.4 出处门槛）]"
    envelope:
      - metric: "可修改性：典型变更的实现成本（触达单元数、跨边界契约变更数）"
        bound_expr: "触达单元数（典型业务变更） ≥ 2 → 纯技术分层使单个业务变更纵切多层，触达单元数下界高于语义边界形态（2.2.2 语义边界判据的对比结论），单调高于 S1/S3"
