    constraints_imposed:               # 交叉表源：3.4「施加约束」表（方面 3 全体六行，CTR 十二条逐字相同）
      - {target_aspect: 2, constraint: "已发布契约的边界冻结——分解不得切割既有契约（切割需求 → 走弃用窗口 + 绞杀者迁移）", level: hard}
      - {target_aspect: 4, constraint: "数据契约的 schema 与语义条款是数据流动的唯一合法路径定义", level: hard}
      - {target_aspect: 5, constraint: "协调模式中的每条跨单元交互必须有注册契约（Z1 的契约来源）", level: hard}
      - {target_aspect: 8, constraint: "契约测试是验证计划的组成部分；微服务风格 → CDC 必备；事件驱动 → 事件 schema 演化测试必备", level: conditional}   # 级别列原文「软/硬按风格」→ 本条不绑定单一风格（适用条件为『一切跨边界数据流动』）：契约测试取硬，CDC 按 X4 分级（高风险契约必备，微服务风格下升硬），事件 schema 演化项不适用（MJ-4 同型判读；MJ-21 (x)）
      - {target_aspect: 9, constraint: "契约漂移（运行时实际流量与注册契约的偏离）是守护对象；漂移检测规则参数按 0.13 注册", level: hard}
      - {target_aspect: 10, constraint: "契约是机器层的天然工件：IDL/schema/OpenAPI 文档直接投影为白板谓词，禁止双重维护（0.9 同源生成原则在契约域最强适用）", level: hard}
    anti_patterns:
      - pattern_id: CTR-005-AP1
        description: "直连物理表/存储引擎绕过数据契约（共享数据接入的条件 4 违例）"
        detection_predicate: "∃ D: dataset(D) ∧ ∃ u: access_path(D, u, ·, ·) ∧ [该访问路径未经数据契约暴露] ∧ [路径为直连物理表/存储引擎]"
        signal_level: P0               # X6 明文「∀ shared_data_access: satisfies(3.2.3 四条件) ∧ explicitly_recorded —— 硬」；3.2.3 条件 4 明文『禁止直连物理表/存储引擎』→ P0（MJ-4 判据）
      - pattern_id: CTR-005-AP2
        description: "共享数据接入四条件的满足情况未显式记录，或四条件任一违反而未触发向方面 1 的重审提议"
        detection_predicate: "∃ a: [shared_data_access(a)] ∧ (¬[a 满足 3.2.3 四条件] ∨ ¬declared(a))"
        signal_level: P0               # X6 硬性质的后半句 explicitly_recorded（3.2.3 明文『满足情况必须显式记录』）；尾句另定『任一条件违反 → 分布式单体信号（1.2.2 反模式），触发向方面 1 的重审提议（附违反项证据）』→ P0（MJ-4 判据）
      - pattern_id: CTR-005-AP3
        description: "语义条款缺项（单位/值域/空值语义/敏感性标注/所有权声明任一缺失）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ [C 登记为数据契约] ∧ ¬[单位 ∧ 值域 ∧ 空值语义 ∧ 敏感性标注 ∧ 所有权声明五项齐备]"
        signal_level: P1               # 违反 3.2.1 定义列的构成项要求（定义性）与 3.4 施→4『唯一合法路径定义』的完整性前提，但无 X 系列硬性质直接绑定该五项 → P1（MJ-4 判据）
      - pattern_id: CTR-005-AP4
        description: "数据访问路径未经所有者单元暴露（所有权绕过的契约面投影）"
        detection_predicate: "∃ D: dataset(D) ∧ ∃ u: access_path(D, u, ·, ·) ∧ ∃ o: owner(D, o) ∧ ¬[该访问路径由 o 暴露]"
        signal_level: P0               # 3.4 接收约束方面 4 行级别列为硬，理由列明文「所有权绕过 = W4/Y1 违例的契约面投影」→ W4 为方面 4 硬性质，本行为其契约面投影 → P0（MJ-4 判据）
    formal_anchor:
      - {property_id: X6, role: implements}      # 3.2.3 条件 4 以本形态为判定载体：∀ shared_data_access: satisfies(3.2.3 四条件) ∧ explicitly_recorded → 本条是『访问路径经数据契约暴露』的登记面
      - {property_id: X1, role: implements}      # 跨边界数据流动经本形态登记 → covers(C,u1,u2) 的数据域实例（3.2.1 适用条件列『一切跨边界数据流动』）
      - {property_id: Y1, role: consumed_by}     # 3.4 接收约束方面 4 行理由列明文「所有权绕过 = W4/Y1 违例的契约面投影」
      - {property_id: W4, role: consumed_by}     # 同上：单写者/权威所有权的契约面投影（3.2.3 条件 2「只读，或全系统范围内单写者」）
    references: []                     # 母本 3.7 书目 28–34 无 3.2.1「数据契约」行的行级登记提取面（28/29 → 3.2.2 CDC 与契约测试区分；30 → 同步 API 契约机器层格式；31 → 3.2.1 事件信封；32 → API 契约设计方法；33 → 3.2.2 schema registry 与兼容性规则；34 → 3.4 绞杀者迁移）→ 按 G-CRD-1／G-DEC-1 同型纪律「表级/节级面不下探」不扩张；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）→ 登记 G-CTR-1，待人工裁决补勘后回填（SO-9）
    narrative:
      benefit_cost_analysis: "收益：语义条款五项（单位、值域、空值语义、敏感性标注、所有权声明）把数据流动的解释面从代码与口头约定收回到注册表，使 3.4 施→4『唯一合法路径定义』可判定；机器层天然性为『高』（3.2.1），schema 直接投影为白板谓词（3.4 施→10 硬）；本形态还是 X6 与方面 4 的 W4/Y1 的唯一契约面接口 → 所有权绕过与分布式单体信号由此可检测（3.2.3 尾句）。代价：禁止直连物理表使数据访问多经一层暴露路径，引入额外序列化/网络项；语义条款变更的触达面等于全部合法数据流动面（施→4 的『唯一』使触达上界不可局部化）→ 逆转成本 costly；敏感性标注与所有权声明的变更还牵动方面 4 的所有权定案与 6.2.1 安全/合规两族的度量输入，跨方面联动使变更评审面宽于其他五种形态。"
      typical_scenarios: "一切跨边界数据流动的场合（3.2.1 适用条件列）——方面 4 的入口形态；共享数据接入（批处理交接、配置分发、报表抽取类）须显式记录四条件满足情况的场合（3.2.3；X6）；数据所有权已定案、须以契约固化访问路径的场合（3.4 接收约束方面 4 行；OWN 批承载所有权模式）；含敏感性标注的受监管数据流动场合（6.2.1 安全族『敏感数据访问路径合规率』＋合规族『监管条款 → 可判定谓词的映射覆盖率』）；分布式单体信号排查中须核验访问路径是否经契约暴露的场合（3.2.3 尾句 → 1.2.2 反模式）。"
      common_misuse: "直连物理表/存储引擎（AP1，3.2.3 条件 4 明文禁止）；四条件满足情况不显式记录（AP2，X6 的 explicitly_recorded 半句）；语义条款只写 schema 不写单位/值域/空值语义/敏感性标注/所有权声明（AP3）；访问路径不经所有者单元暴露（AP4，W4/Y1 违例的契约面投影）；以数据契约承载跨单元事务语义（3.2.3 条件 3）；把数据契约的兼容性规则当作一致性定案（一致性属方面 4 的 Y 系列）；四条件违反后只修数据面而不触发向方面 1 的重审提议（3.2.3 尾句要求附违反项证据）。"

