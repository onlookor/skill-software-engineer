  - id: MJ-21
    subject: CTR 批十项判读——3.6 三处称呼映射、两表分块序、name 取表首列逐字、X 系列角色分配（31 实例）、母本公式内九词不扩词、可逆性三级分配、量化面口径与升级触发条件分源、compatibility 与镜像纪律、聚合式不本地造法、施→8 取条件级
    judgment: "(i) **3.6 三处叙述式称呼系消费字段称呼、非 entry_id**：3.6 示例一以 `CTR-gRPC`（@2035，示例正文 @2031 同现）称呼同步 API 契约行的具体实例、示例二以 `CTR.compatibility.policy`（@2049-2050）称呼兼容性字段、示例三以 `CTR.lifecycle_state`（@2064-2065）称呼生命周期状态字段，示例四（@2068）不产生新称呼。三者映射：`CTR-gRPC` → CTR-002（3.2.1「同步 API 契约」行的示例化称呼；母本叙述式书写 ≠ 注册表三位 id，等同判断见 MJ-14）；`CTR.compatibility.policy` 的 additive-only 策略值 → CTR-008（3.2.2「兼容性规则」行），而该策略**取值的枚举与登记面**属 CTR-007（「版本化策略」行），二者不得合并为一条；`CTR.lifecycle_state` → CTR-010（「契约生命周期」行）。映射登记于 profiles.yaml 的 kind_profile_CTR.entry_id_range 与 README §4.3；注册表侧**不新建 CTR-gRPC 条目**（叙述式称呼非条目身份，新建将违反 C-ID 与 MJ-14 的 id 纪律）。(ii) **两表分块序裁决**：CTR 十二条按『两表分块 + 块内行序』编号——3.2.1 契约形态表六行（@1918-1923：进程内接口／同步 API 契约／异步消息契约／事件契约／数据契约／UI-端契约）＝ CTR-001…CTR-006，3.2.2 契约治理表六行（@1931-1936：版本化策略／兼容性规则／消费者驱动契约测试（CDC）／契约生命周期／破坏性变更流程／发现与注册）＝ CTR-007…CTR-012，块序按母本小节序（3.2.1 先于 3.2.2）。采分块序而非单一混合行序的理由：两表在母本为并列的两张表（3.2.1 形态面、3.2.2 治理面），3.2.2 内容列明记『每契约登记其一』即治理维度对全部形态正交适用，混编会使『形态 → 治理』的施加关系在 id 面上不可读；块内行序即 id 序，与 STY 批 MJ-13 (iv) 的表序裁决同型。编号不重排、不复用（0.22 承诺一）。(iii) **name 一律取表首列逐字**：十二条的 name 分别为 3.2.1 首列（@1918-1923）与 3.2.2 首列（@1931-1936）的逐字文本，含母本自带括注（如「消费者驱动契约测试（CDC）」按原形登记），不采叙述式改写（如『同步接口契约』『契约注册中心』），以免与 3.6 既有称呼面失配（MJ-20 (i) 同型）。首列以外的列（定义／适用条件／内容／机器层天然性／默认值）分别落 applicability、narrative、constraints_imposed、envelope 与 compatibility，不在 name 内混合承载。(iv) **formal_anchor 角色分配（共 31 实例：硬 24／条件硬 4／软 3）**：X1（@2009 覆盖性 ∀交互对 ∃C ∈ registry: covers(C,u1,u2)）取 implements 于 CTR-002/003/004/005（四形态各自承载一类交互对的覆盖手段），consumed_by 于 CTR-001/006/012（进程内接口与端契约不构成 X1 意义的跨单元覆盖承载；发现与注册为覆盖性的查询前提）＝ 7 实例；X2（@2010）implements 于 CTR-007/008（版本化与兼容性为 X2 的直接承载），consumed_by 于 CTR-001/002/003/004/006/010 ＝ 8 实例；X3（@2011-2013 条件硬，同型说明 @2020）implements 于 CTR-011（破坏性变更流程即 X3 的执行面），consumed_by 于 CTR-002/007/008 ＝ 4 实例；X4（@2014 软，微服务风格下升硬）仅 implements 于 CTR-009（CDC 是 X4 的唯一直接操作化）＝ 1 实例；X5（@2015）implements 于 CTR-010（生命周期状态机为 X5 的承载），consumed_by 于 CTR-002/011 ＝ 3 实例；X6（@2016）implements 于 CTR-005（数据契约的语义条款即 X6 的显式化面），consumed_by 于 CTR-001 ＝ 2 实例；X7（@2017 软）implements 于 CTR-004（事件契约的漂移检测面），consumed_by 于 CTR-003 ＝ 2 实例。跨方面四项各 1 实例：W1（@1713 seam）implements 于 CTR-001（进程内接口是 seam 的契约化面）；W4（@1717 数据唯一所有者）consumed_by 于 CTR-005；Y1（@2279-2280 所有权与访问路径）consumed_by 于 CTR-005；Z1（@2575-2576 建模显式化）consumed_by 于 CTR-003。**Waiver scope 口径**：WV-CTR-E3-01 只及硬性质面 8 项 24 实例（X1 7、X2 8、X5 3、X6 2、W1 1、W4 1、Y1 1、Z1 1）＋条件硬 X3 的 4 实例，X4（软）1 实例与 X7（软）2 实例明列排除（MJ-20 (ii) 同型：软性质不计入 E3 硬检面）。3.5 谓词块（@1997-2003）的 `context_map` 本批未以调用形态出现，故不产生 formal_anchor 实例。(v) **母本 3.5 公式内九词本批不登记入 predicate_vocabulary.yaml，维持方括号占位**：contract／sla_clause／breaking_change／deprecation_window／cdc_suite／covers／interaction／shared_data_access／slowest_consumer_migration 九词逐字出现于母本 3.5 机器层谓词块（@1997-2003）与性质公式（@2006-2017），与 clause_defined_predicates 既有十项**同型**（该节已含 active 注『V3 公式内使用』、parameterized 注『M3 公式内使用』），属 R2 可提议的登记候选，非 MJ-12 意义的本地造词。另注：X6 公式内的 satisfies／explicitly_recorded 本批以中文事实占位表达、未以谓词调用形态出现 → 不计入九词，但同属该缺口面。不扩词的理由仍是**后果而非资格**（MJ-19 (i)／MJ-20 (iii) 同型）：登记将直接触发相关 anti_patterns 的 signal_level 由 P1 升 P0（信号级升级＝守护规则改级），按 0.14『不许运行时即兴改级』＋SO-2／G-STY-4 须走完整 ADR＋批准，不在数据批次内自行执行；应与 MJ-19 (i) 四词、MJ-20 (iii) 七词、SO-4 补齐动作合并为**一个独立 R2 词汇批次**统一裁决（covers 已系 MJ-19 (i) 四词之一，故本批新增候选为其余 8 词，累计 4＋7＋8 ＝ **19 词**）。**不新增 VG 编号**：九词属 VG-04『契约形态声明族谓词』已登记的处置形态，复用『方括号占位＋补齐后按 MJ-4 复核 signal_level』；VG-04 的 affected 现为 STY-010-AP1／STY-011-AP1／STY-013-AP2，是否扩及 CTR 侧列 s5g 裁决，本批不擅改。M4 面以半角方括号包裹**调用式**占位（project.py 的 PRED_CALL_RE 先经 outside_brackets 剔半角方括号，自检不误报），本批 M4 全过。(vi) **typical_reversibility 三级分配（bounded 6／costly 5／free 1）**：free 仅 CTR-009（CDC 为验证手段，撤销不改变已发布契约面）；costly 五条＝CTR-002/003/004/005/011（同步 API／异步消息／事件／数据契约一经消费者依赖即产生迁移成本，破坏性变更流程本身即 costly 面的处置出口）；bounded 六条＝CTR-001/006/007/008/010/012（进程内接口的回退界于单元内、端契约界于版本发布窗口、版本化策略与兼容性规则界于其自身声明的窗口、生命周期界于状态机可达性、发现与注册界于目录条目）。分级依据为 3.2.1 机器层天然性列与 3.2.2 默认值列的明文，不引入母本未给的度量（0.4 禁假精确）；各级的『界』以 bound_expr 参数化表达（如弃用窗口 ≥ 最慢消费者迁移时长），不写死数值。(vii) **量化面口径（envelope 28 项 bound_expr／anti_patterns 34 条：P0 15、P1 17、P2 2）与升级触发条件分源**：envelope 十二条一律非空（C-ENV：kind_profile_CTR 的 entry_level_exemptions 为空集，3.2.1／3.2.2 不在豁免条款内），28 项 bound_expr 全为关系式（M3 的 REL_OPS／REL_WORDS 面）而非带量纲具体数值——母本逐字给出的数值一律参数化引用（MJ-20 (iv) 同型），合规式目标以『= 0』『上界为 1』形态表达，避开 CONCRETE_NUM_RE。34 条 detection_predicate 的 signal_level 按 MJ-4 判据分配：P0 15 条（硬性质违反或检出即阻塞面）、P1 17 条（须人工确认或趋势判据）、P2 2 条（软性质越阈＋趋势上升双判据）。**三处 X3 相关 P1 行内注的升级触发条件须与词汇登记升级分源**：CTR-007-AP2（@4222-4225）、CTR-010-AP3（@4467-4470）、CTR-011-AP1（@4543-4546）三处均写『级别待 W3/X3 条件硬裁决口（s5h 既有）落定后复核（MJ-4 判据）』——该升级的触发条件是 **0.4 证据门槛的判定**（条件硬性质在具体风格下是否已具足够证据升为硬），与 (v) 的词汇登记升级（守护规则改级须完整 ADR＋批准）、(x) 的施→8 升级（依风格侧具体裁定）**三者不同源、不得混记**：分别归口 s5h 证据门槛、s5g 词汇批次、母本 3.4 风格澄清，任一侧先行落定都不自动带动其余两侧。(viii) **compatibility 登记纪律与镜像处置（共 25 行：composable 20、requires 3、hard_conflict 1、tension 1）**：只登记母本有明文依据的对（MJ-9），不为凑数而登记。**三条 requires**（CTR-002→STY-001、CTR-003→STY-002、CTR-004→STY-003）依据＝kind_profile_CTR.narrative.note 明定的 1.4／3.4 接收约束『方面 1 → 方面 3 硬』（3.4 接收表方面 1 行 @1973），本侧为接收端 → 方向与母本一致，不属 MJ-20 (vii) 的方向倒置情形；ENUM_RELATION 无 required_by 且对侧属**已批准**条目 → 单侧登记、不回填镜像。**一处 hard_conflict**（CTR-001→STY-016，3.4 接收表方面 1 行明文『微服务 → 跨单元禁止以进程内调用为主手段』，级别硬）：hard_conflict 为对称关系、本可镜像，但 STY-016 属已批准条目 → 不擅改，镜像回填留待人工裁决（MJ-20 (vii) 同型，登记为 s5h 裁决口）。**一处 tension**（CTR-011→DEC-005，3.6 示例三明文点名）同型单侧登记。**同批内七对已双向闭合**：CTR-002↔CTR-007、CTR-002↔CTR-008、CTR-003↔CTR-004、CTR-004↔CTR-007、CTR-004↔CTR-008、CTR-008↔CTR-011、CTR-010↔CTR-011（均系同批 seed 条目、非已批准条目 → 双向登记；其中 CTR-004 侧两条与 CTR-011 侧一条为本批入库时的镜像回填，依据与对侧同源＝3.2.2 默认值列／3.6 示例三，无新增事实主张）。合计单侧 11 处。**自检不承载镜像纪律**：project.py 的 check_m9 只查 peer 存在性、不查双向镜像，故 11 处单侧登记不触发硬失败，镜像纪律以本项与 ST-CTR-01 condition 为承载载体。CTR-006 与 CTR-012 的 compatibility 为空列表系母本无明文对（3.2.1 UI/端契约行与 3.2.2 发现与注册行均未给出与其余条目的互斥/依赖明文）。(ix) **aggregation_semantics 一律取 itemwise**：母本未给 CTR 的跨契约聚合式——3.2.1／3.2.2 均为并列行表、3.2.2 内容列明记『每契约登记其一』即逐契约独立求值、3.6 四例给的均是单契约裁决而非聚合运算，故十二条一律 itemwise，不本地造聚合语义（MJ-19 (iii)／MJ-20 (vi) 同型；0.4 禁假精确＋零新增规范命题）；ENUM_AGG 的 additive／grouped_max／weighted_avg 三值在本 kind 无母本消费路径。(x) **constraints_imposed 十二条逐字相同六行（共 72 项），其中施→8 取 conditional**：3.4『施加约束』表（@1982-1989）中方面 3 施于其余方面的六行（方面 2／4／5／8／9／10）对全部契约形态一体适用，故十二条的 constraints_imposed 为逐字相同的六行＝72 项（方面 2／4／5／9／10 各 12 项 hard ＝ 60；方面 8 各 1 项 conditional ＝ 12）。方面 8 行（施→8，@1987）的级别列原文为『软/硬按风格』——非固定级别，故按 MJ-4 同型判读取 **conditional**（ENUM_LEVEL 三值中唯一能承载『按条件定级』者；取 hard 会虚构母本未给的无条件性、取 soft 会丢失其可升硬面），其升级条件为**风格侧的具体裁定**（哪一风格下升硬），归口母本 3.4 澄清／s5h，不在注册表侧自行定级（0.4 禁假精确＋零新增规范命题）。"
