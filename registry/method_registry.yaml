    references:                        # 4.2.3 五行中有**行级**书目登记的两行之一（另一为 CSL-005 ← 书目 36）；书目 35 的登记面为表级谱系，按 G-CSL-1 纪律不充行级出处（M6 + 0.17.7 门槛 6：文献须载明所支撑主张）
      - {bib_id: 39, support_claim: "4.2.3 降级纪律（跨单元默认最终一致）的经典论证（母本登记提取面逐字对应；行级指向本行）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：无协调收敛——跨单元默认级别（4.2.3 选择条件列），可用性与分区容忍最好，异步复制与事件传播的实现面最轻，ops_cost 为五行最低。代价：窗口内可读到旧值，因此窗口时长必须是契约条款（数据契约的新鲜度字段），且级别声明必须附业务语义论证（该集合的消费者在窗口期读到旧值时业务上发生什么、是否可接受）——缺论证即 Y3 违例，也是降级纪律禁项 (ii)『最终一致万能幻觉』的形态。书目 39（Helland）为跨单元默认最终一致的经典论证，是本行的行级出处；书目 35（DDIA 第 2 版）的登记面为 4.2.3 表级谱系，按 G-CSL-1 纪律不充行级出处，故不列入本条 references。"
      typical_scenarios: "跨所有者单元的默认级别（4.2.3 选择条件列）；读侧展示类数据与可容忍窗口期旧值的统计聚合；事件传播驱动的副本同步；反例 18-A 的未检验候选（CSL-04 最终一致 × STY-04 事件溯源：读模型最终一致，与强同步查询语义构成张力，该候选在 18-A 中因 S2 未执行而被标记为教训）。"
      common_misuse: "最终一致万能幻觉（降级纪律禁项 (ii)：一切都说『最终会一致』，回避窗口期业务语义分析）；窗口时长不入新鲜度条款（消费者无从判定违约，SLO 不可计量）；以最终一致掩盖因果语义需求（应走 CSL-003）；跨单元对账/补偿缺失而声称级别已声明（0.8 的降级事实须与补偿设计同时落地）。"

