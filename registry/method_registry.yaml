        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: 47, verified: true}
    typical_reversibility: costly      # 人工判断：事件契约与补偿事件的多方订阅一经投产即形成隐式耦合网，逆转须协调全部参与者而非单方改动
    applicability:
      problem_space:                   # 骨架源：5.2.2「适用条件」列＋关键设计规则列原文
        - "步骤少（注册上限，默认 ≤4）且无需集中留痕的跨单元长流程（5.2.2 关键设计规则列原文）；否则流程隐式化不可维护"
        - "[各参与单元自治且补偿可由事件触发而非中央指令（5.2.2 适用条件列）]"
      current_space:                   # 骨架源：5.4 接收约束方面 1 行（事件驱动 → 协同默认）
        - "事件驱动（发布订阅）风格在案 → 协同式为默认承接（5.4 接收约束方面 1 行）"
        - "[各单元本地事务边界可识别且补偿事件有业务落点（4.2.3 现状勘察面，CSL-005 同源）]"
      delivery_space:                  # 骨架源：5.4 施加约束方面 8 行（事件驱动 → 回放与乱序注入必备）
        - "事件回放与乱序/重复/丢失注入的验证能力在案（5.4 施→8：事件驱动 → 必备，承接 1.4）→ 缺失即硬降权"
        - "[跨单元分布式追踪能力在案（流程隐式化的唯一观测补偿手段，CRD-002 同型）]"
    envelope:
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "步骤数（Saga） ≤ 注册上限（5.2.2 关键设计规则列，默认 ≤4） → 越阈即流程隐式化不可维护；与 Z5 registered_max_depth 同源词汇、不同谓词面（MJ-19）"
        source: {source_type: clause_id, value: "5.2.2", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "终态可达界 = ∧_{步骤} 有出路：∀ saga step: step_class ∈ {compensable, retriable, pivot} ∧ (compensable → ∃ compensation ∧ idempotent) ∧ pivot_ordering_valid（Z3 逐字界形）→ 无中央协调者，终态可达由各单元补偿事件的合取给出"
        source: {source_type: clause_id, value: "5.5", verified: true}
      - metric: "可观测性：追踪覆盖率"
        bound_expr: "追踪覆盖率（协同式 Saga） ≤ 追踪覆盖率（编排式 Saga） → 无集中留痕（5.2.2 关键设计规则列），覆盖率上界受跨单元事件链可拼接性限制"
        source: {source_type: row_id, value: "5.2.2-Saga（协同式）", verified: true}
    cost_profile:
      latency_budget_delta: "= Σ 各步骤卡片 latency_budget_delta + 补偿事件投递与消费延迟（5.2.5 明文：每个行为/协调模式条目必须携带卡片；无编排器推进开销）"
      failure_modes: ["补偿事件未声明投递语义或消费端未声明幂等（Z2 违例，补偿重复执行）", "步骤数越注册上限（流程隐式化不可维护，5.2.2 关键设计规则列）", "步骤三分类不明（Z3 违例）", "无集中留痕导致补偿链断裂时无法定位（可观测性分散的失败面）"]
      consistency_impact: "终态正确而非过程原子（4.2.3 补偿一致语义）；无中央 Saga 日志 → 5.4 施→4 的流程状态条款落在各单元本地流程状态上（所有者 = 各自单元）；跨单元一致性由 Z2（投递语义声明 ∧ 消费端幂等）与 Z3 合成，级别选择的逆转成本由 CSL-005 承载不重复计入"
      observability_requires: ["跨单元事件链可拼接（追踪覆盖率界上界的度量前提）", "各单元本地步骤状态与补偿动作可查（saga / step_class / compensation 谓词在案，5.5）", "卡片 observability_requires 不得退化（5.4 施→9）"]
      ops_cost: "[随参与单元数上升；须承担事件回放与乱序/重复/丢失注入的常态化验证成本（5.4 施→8：事件驱动 → 必备），且无集中留痕使故障定位成本高于编排式]"
      skill_prerequisites: ["步骤三分类与关键步排序纪律（5.2.2 步骤分类纪律，Z3）", "补偿事件的投递语义与消费端幂等设计（Z2）", "事件回放与乱序注入验证（5.4 施→8）"]
      aggregation_semantics: itemwise  # 无中央累加点：各单元卡片按项独立评估（5.2.2 关键设计规则列「无集中留痕」的聚合推论，CRD-002 同型）
    compatibility:
      - peer_entry: STY-003
        relation: requires
        evidence: {source_type: row_id, value: "5.2.2-Saga（协同式）", verified: true}   # 定义列以事件交换推进补偿 → 须以事件驱动（发布订阅）通信风格为前提（kind_profile_CRD.narrative.note 明文：compatibility 须登记对上游 STY 条目的 requires 关系）
      - peer_entry: CSL-005
        relation: requires
        evidence: {source_type: row_id, value: "4.2.3-补偿一致（业务级）", verified: true}   # 4.2.3 实现手段列明文「Saga（方面 5）」→ 补偿一致（业务级）的达成须以 Saga 协调形态为前提；requires 关系由 CRD 侧承载（MJ-17 (iii)），CSL-005 侧按 MJ-5 镜像纪律不重复登记
    constraints_imposed:               # 交叉表源：5.4「施加约束」表（方面 5 全体七行，CRD 八条逐字相同）
      - {target_aspect: 1, constraint: "协调需求在既定风格下不可行 → 回溯约束声明（CH-E 原型通道，阻塞式）", level: hard}
      - {target_aspect: 3, constraint: "协调模式产生的新交互 → 契约登记需求（编排者与参与者间的命令契约、事件契约）", level: hard}
      - {target_aspect: 4, constraint: "流程状态（协调者状态机、Saga 日志、预扣记录）是数据集合，受 Y1–Y8 全约束——流程状态的所有者 = 协调者单元", level: hard}
      - {target_aspect: 6, constraint: "质量影响卡片 → 行为级包络校验输入；卡片是方面 6 的强制消费项（Q 系列将引用）", level: hard}
      - {target_aspect: 8, constraint: "行为验证要求：事件回放、乱序/重复/丢失注入、补偿路径测试、超时与断路行为测试、（风格允许时）混沌注入", level: conditional}   # 5.4 级别列原文「软/硬按风格（事件驱动 → 回放与乱序注入必备，承接 1.4）」；本条目为事件驱动 → 回放、乱序注入与补偿路径测试在本条目上一律取硬（MJ-4 同型判读）
      - {target_aspect: 9, constraint: "协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化", level: hard}
      - {target_aspect: 10, constraint: "机器层：Z 谓词集；人类层：覆盖谓词子集 {Z 谓词集} 的投影视图（受众问题 = 行为与协调的时序、事件流与流程状态；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: CRD-006-AP1
        description: "以协同式承载步骤多或需集中留痕的流程（流程隐式化不可维护）"
        detection_predicate: "∃ S: saga(S, ·) ∧ ¬∃ M: orchestrator(S, M) ∧ ([S 的步骤数 > 注册上限] ∨ [S 需集中留痕（合规审计要求）])"
        signal_level: P1               # 违反 5.2.2 关键设计规则列的选择纪律（步骤少、无需集中留痕），但注册上限的步骤数界无 Z 系列硬性质直接绑定（Z5 面为链深）→ P1（MJ-4 判据）
      - pattern_id: CRD-006-AP2
        description: "补偿事件未声明投递语义，或消费端未声明幂等"
        detection_predicate: "∃ I: interaction_flow(·, ·, choreographed) ∧ saga(·, ·) ∧ (¬declared(delivery_semantics(I, ·)) ∨ [delivery_semantics(I, ·) ≠ at_most_once ∧ ¬idempotency(I, ·)])"
        signal_level: P0               # Z2 硬性质违例的直接来源（补偿重复执行 → 终态不可达）→ 检出即阻塞（MJ-4 P0 判据，CRD-002-AP1 同型）
    formal_anchor:
      - {property_id: Z3, role: implements}      # 长流程每步有出路（三分类 + 补偿 + 幂等 + 关键步排序）
      - {property_id: Z2, role: implements}      # 补偿事件的投递语义声明 ∧ 消费端幂等
      - {property_id: Z5, role: consumed_by}     # 步骤数上界与链深上界同源词汇（registered_max_depth / 注册上限）而谓词面不同（MJ-19）
      - {property_id: Z7, role: consumed_by}     # 卡片被方面 6 消费且不得违反包络
    references:
      - {bib_id: 47, support_claim: "Saga 模式的原始文献面（协同式补偿与事件驱动推进，母本登记提取面）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：各单元自治推进补偿、无中央协调者单点，可用性界由各单元合取给出；事件驱动风格下为 Saga 的默认承接形态（5.4 接收约束方面 1 行），无需引入编排器运行时与集中 Saga 日志。代价：仅适合步骤少（注册上限，默认 ≤4）且无需集中留痕的流程，越阈即流程隐式化不可维护（5.2.2 关键设计规则列原文）；追踪覆盖率上界低于编排式，无分布式追踪能力时补偿链断裂无法定位；每条补偿事件必须声明投递语义且消费端声明幂等（Z2 硬），否则补偿重复执行使终态不可达；常态化承担事件回放与乱序/重复/丢失注入验证（5.4 施→8：事件驱动 → 必备）；事件契约多方订阅使逆转须协调全部参与者（costly）。"
      typical_scenarios: "步骤少（≤ 注册上限）的跨单元补偿流程（5.2.2 关键设计规则列）；事件驱动（发布订阅）风格已定案且各单元自治演进；无需集中留痕的开放域（合规域应走编排式，CRD-005）；参与单元少而补偿语义清晰的场合。"
      common_misuse: "以协同式承载步骤多或需集中留痕的流程（AP1，5.2.2 关键设计规则列明文禁止）；补偿事件不声明投递语义或消费端不声明幂等（AP2，Z2 违例）；步骤三分类不明（Z3 违例，CRD-005-AP1 同型）；无分布式追踪能力即上线（流程隐式化无观测补偿）；以隐式事件时序假设替代显式建模（Z1 违例，5.4 施→9 守护对象）；把「无编排器」误读为「无流程状态」（各单元本地流程状态仍受 5.4 施→4 全约束）。"

