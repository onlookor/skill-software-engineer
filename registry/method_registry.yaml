      current_space:                   # 骨架源：3.3 现状空间驱动＋0.11＋3.6 示例一
        - "既有 API 契约是最强约束源：逆向勘察（从代码/流量/文档提取实际契约）产出『现状契约清单』，新契约设计必须与之对齐或声明迁移路径（3.3 现状空间驱动第一行；迁移声明 = 重审提议级材料）"
        - "强加决策不泛化：公司 API 网关标准文义仅覆盖南北向流量时，东西向不在强加范围内（3.6 示例一；0.3 强加范围解包＋0.6 CH-A 第 2 步内部完整分析）"
      delivery_space:                  # 骨架源：3.3 交付空间驱动
        - "消费者团队数量与变更节奏 → 兼容性规则严格度（消费者多且异构 → full；单消费者同团队 → backward 可接受）（3.3 交付空间驱动第一行）"
        - "契约测试基础设施能力（CI 成熟度）→ CDC 的可行集；能力不足时 CDC 降为软约束 + 保守假设 ADR（可推翻指标 = CI 能力建立）（3.3 交付空间驱动第二行）"
    envelope:
      - metric: "性能：延迟分位数（P50/P99，P99 = 延迟分布第 99 百分位数）"
        bound_expr: "契约 SLA 条款登记的 P99 上界 ≤ 方面 6 目标值（3.4 接收约束方面 6 行：延迟/可用性目标 → 契约 SLA 条款 P99、错误预算）；端到端 P99 随调用链深度单调不减（每次交互引入一次网络往返 + 编解码项）→ 不可达即须换形态或重审风格（3.6 示例一：延迟预算量化证据）"
        source: {source_type: clause_id, value: "3.4", verified: true}
      - metric: "可用性/可靠性：可用性目标（SLO）、错误预算〔error budget：1 − SLO〕"
        bound_expr: "错误预算 = 1 − SLO（6.2.1 定义式）；对外 API 场合错误预算 上界由合同 SLA 或监管条文给定（3.3 问题空间驱动第一行：第三方开放 → 对外 SLA 条款）→ 四类合法出处之外不得填值（6.2.1 量化纪律＋0.4 证据门槛）"
        source: {source_type: clause_id, value: "6.2.1", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数、跨边界契约变更数）"
        bound_expr: "破坏性变更触达的消费者数 上界 = consumer_set 基数；弃用窗口时长 ≥ 最慢消费者迁移时长（X3，条件硬）→ 窗口短于该下界即越界，估计无出处时按 0.4 降级为软＋保守假设 ADR"
        source: {source_type: clause_id, value: "3.5", verified: true}
    cost_profile:
      latency_budget_delta: "每次请求-响应交互引入一次网络往返 + 编解码项（3.2.1 适用条件列『需要即时结果』的代价面）；调用链深度上的延迟预算须逐项累加 → 3.6 示例一：东西向高频服务间交互的延迟预算在 REST+JSON 下不可达时，gRPC 契约作为正常决策走完整 ADR（包络校验提供量化证据）"
      failure_modes: ["把强加决策过度泛化到东西向（3.6 示例一幻觉之一『强加覆盖一切』→ 延迟预算不可达仍强行 REST+JSON）", "以『强加不合理』为由绕开南北向标准（3.6 示例一幻觉之二『过度反抗』→ 接受约束 ADR 缺失）", "对外 API 未登记 full 兼容与弃用窗口（3.2.2 兼容性规则默认值列；X3 违例）", "SLA 条款缺失即以延迟/可用性目标结案（3.4 接收约束方面 6 行；校验失败升硬）", "发布态契约缺 version 或 compat_policy（X2 硬）"]
      consistency_impact: "请求-响应风格下调用方等待即时结果 → 跨单元事务语义易被隐式引入（3.2.3 条件 3 明文禁止『读写方之间无必须同时成功的要求』被违反）；一致性级别由方面 4 的 Y 系列判定（CSL 批承载），SLA 条款只登记延迟/可用性面（3.4 接收约束方面 6 行），不得以 SLA 条款替代一致性定案"
      observability_requires: ["契约版本与兼容策略在注册表可查（X2；3.2.2 版本化策略/兼容性规则）", "SLA 条款的 metric 与 bound_expr 可查（3.5 sla_clause 谓词面，未登记 → 方括号占位）", "南北向/东西向流量归属在案（3.6 示例一：强加范围解包的登记面，0.3）", "生产观测与负载测试数据可查（6.2.1 性能族度量方式）"]
      ops_cost: "[API 网关（南北向）与服务目录（内部检索）的注册与运维面（3.2.2 发现与注册）→ 运维项随对外 API 数上升；母本未给单位运维成本 → 方括号占位（MJ-20 (iii) 同型）]"
      skill_prerequisites: ["REST 资源语义 + HTTP 动词 + 状态码约定，或 gRPC 的 IDL/protobuf 定义（3.2.1 定义列）", "OpenAPI 文档作为机器层谓词源的编写与校验（3.2.1 机器层天然性列『高（IDL/OpenAPI 文档本身即谓词）』；书目 30）", "API 契约设计方法（书目 32）", "兼容性规则与弃用窗口的登记与治理（3.2.2；书目 33）", "强加决策的范围解包（0.3＋0.6 CH-A 第 2 步；3.6 示例一）"]
      aggregation_semantics: itemwise  # 母本未给 CTR 的跨契约聚合式（MJ-19 (iii) 同型）→ SLA 与延迟项按契约逐项登记（MJ-21 (ix)）
    compatibility:
      - peer_entry: STY-001
        relation: requires
        evidence: {source_type: row_id, value: "3.2.1-同步 API 契约", verified: true}   # 适用条件列明文「请求-响应风格；需要即时结果」＝STY-001 同步请求-响应。母本方向为风格 → 契约形态可行集（3.4 接收约束方面 1 行），本侧登记 requires 读作『同步 API 契约以请求-响应风格在场为前提』，与母本方向一致（接收端）→ 不属 MJ-20 (vii) 的方向倒置情形；ENUM_RELATION 无 required_by 且 STY-001 属已批准条目 → 对侧不回填（MJ-21 (viii)）
      - peer_entry: CTR-007
        relation: composable
        evidence: {source_type: row_id, value: "3.2.2-版本化策略", verified: true}   # 默认值列明文「同步 API：URI 版本」（镜像登记于 CTR-007）
      - peer_entry: CTR-008
        relation: composable
        evidence: {source_type: row_id, value: "3.2.2-兼容性规则", verified: true}   # 默认值列明文「内部 API：full；对外 API：full + 弃用窗口」（镜像登记于 CTR-008）
    constraints_imposed:               # 交叉表源：3.4「施加约束」表（方面 3 全体六行，CTR 十二条逐字相同）
      - {target_aspect: 2, constraint: "已发布契约的边界冻结——分解不得切割既有契约（切割需求 → 走弃用窗口 + 绞杀者迁移）", level: hard}
      - {target_aspect: 4, constraint: "数据契约的 schema 与语义条款是数据流动的唯一合法路径定义", level: hard}
      - {target_aspect: 5, constraint: "协调模式中的每条跨单元交互必须有注册契约（Z1 的契约来源）", level: hard}
      - {target_aspect: 8, constraint: "契约测试是验证计划的组成部分；微服务风格 → CDC 必备；事件驱动 → 事件 schema 演化测试必备", level: conditional}   # 级别列原文「软/硬按风格」→ 本条为跨单元请求-响应形态：契约测试取硬，微服务风格下 CDC 升硬（X4 明文），事件 schema 演化项不适用（MJ-4 同型判读；MJ-21 (x)）
      - {target_aspect: 9, constraint: "契约漂移（运行时实际流量与注册契约的偏离）是守护对象；漂移检测规则参数按 0.13 注册", level: hard}
      - {target_aspect: 10, constraint: "契约是机器层的天然工件：IDL/schema/OpenAPI 文档直接投影为白板谓词，禁止双重维护（0.9 同源生成原则在契约域最强适用）", level: hard}
    anti_patterns:
      - pattern_id: CTR-002-AP1
        description: "把强加决策过度泛化（南北向标准被套用到东西向），致延迟预算不可达仍强行沿用"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ imposed_by(C, ·) ∧ [imposed_scope = 南北向] ∧ [sla_clause(C, latency, bound)] ∧ ¬[bound 在 inter_service.latency_budget 内可达] ∧ ¬[东西向另立完整 ADR]"
        signal_level: P0               # 3.6 示例一：包络校验给出量化证据后仍沿用 → 0.8 包络硬校验失败面；且强加范围解包属 0.3 登记义务、CH-A 第 2 步为 0.6 强制步骤 → P0（MJ-4 判据）
      - pattern_id: CTR-002-AP2
        description: "对外 API 未登记 full 兼容与弃用窗口即以 published 发布"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ [consumer_set 含第三方] ∧ ¬has(compat_policy) ∧ ¬[deprecation_window(C,v1,until)]"
        signal_level: P0               # 直接违反 X2（硬：发布态须 has(version) ∧ has(compat_policy)）与 X3（对外 API 默认值列明文 full + 弃用窗口）→ P0（MJ-4 判据）
    formal_anchor:
      - {property_id: X1, role: implements}      # 本形态是 covers(C,u1,u2) 的合法承载者之一：跨单元请求-响应交互经本契约登记后 X1 得证
      - {property_id: X2, role: consumed_by}     # 发布态须 has(version) ∧ has(compat_policy)；版本化默认值＝URI 版本（3.2.2）
      - {property_id: X3, role: consumed_by}     # breaking_change → deprecation_window ∧ 窗口 ≥ 最慢消费者迁移时长（条件硬；对外 API 默认 full + 弃用窗口）
      - {property_id: X5, role: consumed_by}     # lifecycle_state ∈ {published, deprecated} → ∃[approved(ADR(C))]（3.3 双使用者条款：契约发布属高影响决策，一律走批准路径）
    references:
      - {bib_id: 30, support_claim: "同步 API 契约的机器层格式（母本 3.7 书目 30 行级登记提取面逐字对应；提取以本地副本《Henry Andrews - OpenAPI Specification v3.2.1.epub》为准，dc:title 与正文版本号一致，结尾参考文献完整至 RFC 9535）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 32, support_claim: "API 契约设计方法（母本 3.7 书目 32 行级登记提取面逐字对应；第 1 版 2019、ISBN 978-1-617-29510-2 依 AGENTS.MD 更新版本规则由第 2 版取代）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：机器层天然性为『高』——IDL/OpenAPI 文档本身即谓词（3.2.1 定义列/机器层天然性列），0.9 同源生成在契约域最强适用（3.4 施→10 硬），禁止双重维护；即时结果语义使调用方无需引入异步补偿面；对外产品化场合的稳定性要求有明确默认值（full + 弃用窗口，3.2.2）。代价：每次交互引入一次网络往返 + 编解码项，调用链深度上的延迟预算逐项累加，东西向高频交互可能不可达（3.6 示例一给出量化证据面）；对外发布后逆转成本为 costly（须弃用窗口＋迁移支持）；强加决策须做范围解包，否则落入『强加覆盖一切』或『过度反抗』两种幻觉（3.6 示例一）；SLA 条款目标值只能取四类合法出处（6.2.1 量化纪律），无出处即须留空并登记勘察义务。"
      typical_scenarios: "请求-响应风格且需要即时结果的跨单元交互（3.2.1 适用条件列）；南北向流量受公司 API 网关标准强加的场合（3.6 示例一：接受约束 ADR，无备选，内部一致性检查通过）；东西向高频服务间交互在 REST+JSON 下延迟预算不可达、须以 gRPC 契约走完整 ADR 的场合（同示例）；对外 API 开放给第三方、须 full 兼容＋长弃用窗口＋对外 SLA 条款的场合（3.3 问题空间驱动第一行）；合规/监管强制 API 标准（如开放银行类）→ 外部强加决策走 CH-A 并登记 0.5 批准注册表类目（3.3 问题空间驱动第二行）。"
      common_misuse: "把南北向强加标准泛化到东西向（AP1；0.3 强加范围解包缺失）；以『强加不合理』绕开标准而不记接受约束 ADR（3.6 示例一幻觉之二）；对外 API 不登记 full 兼容与弃用窗口即发布（AP2，X2/X3 违例）；以 SLA 条款替代一致性定案（一致性属方面 4 的 Y 系列）；用文档二次维护契约面（3.4 施→10 硬：禁止双重维护）；把 gRPC 当作独立契约形态登记（3.2.1 定义列已将 gRPC 归入本形态，判读见 MJ-21 (i)）。"

  - entry_id: CTR-003
    kind: CTR
    name: "异步消息契约"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-CTR-01）
    provenance:
      origin: hybrid                   # 骨架=3.2.1 表行（定义列含消息元数据约定四项）＋3.2.1 表后判别规则＋谓词转写（manual）
      source_pointers:
        - {source_type: row_id, value: "3.2.1-异步消息契约", verified: true}
