    constraints_imposed:               # 交叉表源：3.4「施加约束」表（方面 3 全体六行，CTR 十二条逐字相同）
      - {target_aspect: 2, constraint: "已发布契约的边界冻结——分解不得切割既有契约（切割需求 → 走弃用窗口 + 绞杀者迁移）", level: hard}
      - {target_aspect: 4, constraint: "数据契约的 schema 与语义条款是数据流动的唯一合法路径定义", level: hard}
      - {target_aspect: 5, constraint: "协调模式中的每条跨单元交互必须有注册契约（Z1 的契约来源）", level: hard}
      - {target_aspect: 8, constraint: "契约测试是验证计划的组成部分；微服务风格 → CDC 必备；事件驱动 → 事件 schema 演化测试必备", level: conditional}   # 级别列原文「软/硬按风格」→ 兼容性规则的可验证性依赖 CI 中的兼容性检查：契约测试项取硬，CDC 按 X4 分级（微服务风格下升硬），事件 schema 演化测试项在事件契约取 backward/full 时为必备（MJ-4 同型判读；MJ-21 (x)）
      - {target_aspect: 9, constraint: "契约漂移（运行时实际流量与注册契约的偏离）是守护对象；漂移检测规则参数按 0.13 注册", level: hard}
      - {target_aspect: 10, constraint: "契约是机器层的天然工件：IDL/schema/OpenAPI 文档直接投影为白板谓词，禁止双重维护（0.9 同源生成原则在契约域最强适用）", level: hard}
    anti_patterns:
      - pattern_id: CTR-008-AP1
        description: "published 态契约未登记兼容性规则（缺 compat_policy）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ [lifecycle_state = published] ∧ ¬has(compat_policy)"
        signal_level: P0               # X2 明文「∀C(lifecycle_state=published): has(version) ∧ has(compat_policy) —— 硬」；3.2.2 内容列「每契约登记其一」→ P0（MJ-4 判据）
      - pattern_id: CTR-008-AP2
        description: "对外 API 按内部 API 放宽兼容性（未取 full + 弃用窗口）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, ·, ·, compat_policy, ·)] ∧ [consumer_set 含第三方开放消费者] ∧ ¬(compat_policy = full ∧ [弃用窗口已登记])"
        signal_level: P1               # 3.2.2 默认值列对三类分别给值＋3.3 问题空间驱动第一行「第三方开放 → full 兼容 + 长弃用窗口 + 对外 SLA 条款」；母本未将『分级错配』单列 X 系列性质 → P1；该放宽若已发布即构成破坏性变更 → 按 X3（条件硬）复核（MJ-4 判据）
      - pattern_id: CTR-008-AP3
        description: "多契约共用一条全局兼容性声明（未每契约登记其一）"
        detection_predicate: "∃ C1, C2: [contract(C1, ·, ·, ·, ·, compat_policy, ·)] ∧ [contract(C2, ·, ·, ·, ·, compat_policy, ·)] ∧ ¬[compat_policy 按 C1、C2 各自登记] ∧ [两者援引同一条全局声明]"
        signal_level: P1               # 3.2.2 内容列明文「每契约登记其一」；X2 为逐契约量词（∀C）→ 全局声明使 has(compat_policy) 无法逐契约判定，但母本未将『全局声明』单列硬性质 → P1，与 published 态并存时按 X2 升 P0（MJ-4 判据）
    formal_anchor:
      - {property_id: X2, role: implements}      # 兼容性规则是 has(compat_policy) 的登记来源：四取值给出 compat_policy 字段的合法取值域（3.2.2 内容列）
      - {property_id: X3, role: consumed_by}     # 放宽既有兼容性规则构成 breaking_change(C,v1,v2) → X3 要求 deprecation_window(C,v1,t) ∧ t ≥ slowest_consumer_migration(C)；对外 API 默认值「full + 弃用窗口」即本项与 X3 的接合点
    references:
      - {bib_id: 33, support_claim: "3.2.2 schema registry 与兼容性规则的工程参照（母本 3.7 书目 33 行级登记提取面逐字对应；兼容性规则字段的提取源以本地专页级存档《Confluent - Schema Evolution and Compatibility for Schema Registry.epub》为准——含 BACKWARD／BACKWARD_TRANSITIVE／FORWARD／FORWARD_TRANSITIVE／FULL／FULL_TRANSITIVE／NONE 七类定义、Avro/Protobuf/JSON Schema 三格式兼容性汇总表、transitive 语义、客户端升级次序、per-subject 兼容性配置与 API 示例，Platform current＝8.3；母本同行明记『3.2.2 兼容性规则字段的提取源已完备，编译规范 4.1 暂停解除（附录一第 19/20 行）』）", compile_usage: metadata_extraction, trust_grade: "[已核验（在线在位：2026-09-18 复核，Platform 8.3 当前文档可获取）]"}
    narrative:
      benefit_cost_analysis: "收益：兼容性规则把『谁能读谁』从口头承诺变成逐契约登记的可判定字段，使 X2 的 has(compat_policy) 有确定取值域（backward / forward / full / none）；默认值列按事件契约、内部 API、对外 API 三类给出起点，降低逐案裁量面；3.6 示例二显示规则本身可作为参数化项推迟决定（backward 起步、以最后负责时刻触发收紧裁决），且切换成本有界。代价：full 规则实质要求变更只走 additive 演化 → 契约面设计自由度下降，与版本化策略强耦合；对外 API 的 full + 弃用窗口把最慢消费者的迁移时长变成己方约束，估计须有出处否则按 0.4 降级处置；规则的可验证性依赖 CI 中的兼容性检查，CI 成熟度不足时只能降软并记保守假设 ADR（3.3 交付空间驱动第二行）；四取值中 none 在第三方开放与合规/监管场合不可用，选型面窄于表面。"
      typical_scenarios: "新契约发布前须选定兼容性规则的场合（3.2.2 内容列四取值，每契约登记其一）；对外 API 与内部 API 须分级登记的场合（同表默认值列；3.3 问题空间驱动第一行）；消费者集合未知、须以 backward 起步并设定最后负责时刻的场合（3.6 示例二，CH-B 推迟）；消费者由单一同团队变为多且异构、须从 backward 收紧为 full 的场合（3.3 交付空间驱动第一行）；既有规则须放宽、因而走破坏性变更流程的场合（3.2.2 破坏性变更流程行；CTR-011）；契约漂移排查中须确认实际流量是否仍满足登记规则的场合（3.4 施→9）。"
      common_misuse: "published 态缺 compat_policy（AP1，X2 硬违例）；对外 API 按内部 API 放宽（AP2）；一条全局声明覆盖多契约（AP3，3.2.2 内容列『每契约登记其一』）；已发布后放宽规则而不走破坏性变更流程（3.4 施→2 硬）；取 full 却无 CI 兼容性检查能力且不记保守假设 ADR（3.3 交付空间驱动第二行）；把 backward/forward 的可读性承诺读作跨版本数据一致性承诺（一致性属方面 4 的 Y 系列）；以默认值列三类之外的契约类型径行套用默认规则而无 ADR（3.2.2 表头）；为『最慢消费者迁移时长』填无出处数字（0.4 证据门槛；X3 尾注：防 Agent 编造假精确数字绕过弃用窗口）。"

  - entry_id: CTR-009
    kind: CTR
    name: "消费者驱动契约测试（CDC）"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-CTR-01）
    provenance:
      origin: hybrid                   # 骨架=3.2.2 表行「消费者驱动契约测试（CDC）」（内容列机制与幻觉；默认值列『高风险契约必备（见 X4）』）＋谓词转写（manual）；name 逐字承表行首列（含括号缩写）
      source_pointers:
        - {source_type: row_id, value: "3.2.2-消费者驱动契约测试（CDC）", verified: true}
        - {source_type: clause_id, value: "3.2.2", verified: true}
        - {source_type: clause_id, value: "3.3", verified: true}     # 交付空间驱动第二行（CI 成熟度 → CDC 可行集；能力不足降软 + 保守假设 ADR）＋双使用者条款（CDC 套件脚手架生成属 Agent 自主项）
        - {source_type: clause_id, value: "3.4", verified: true}     # 施→8（微服务风格 → CDC 必备；事件驱动 → 事件 schema 演化测试必备）
        - {source_type: clause_id, value: "3.5", verified: true}     # X4（∀C ∈ high_risk: cdc_suite(C) —— 软，微服务风格下升硬）
        - {source_type: clause_id, value: "0.18.4", verified: true}  # kind_profile_CTR：CDC 要求按 X4 分级写入 cost_profile
        - {source_type: clause_id, value: "0.4", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}   # 可修改性族（变更前置时间）＋可观测性族（覆盖率）
        - {source_type: bib_id, value: 28, verified: true}
        - {source_type: bib_id, value: 29, verified: true}
    typical_reversibility: free        # 人工判断：CDC 套件是验证工件而非契约面——增删套件不改变契约的 version/compat_policy/lifecycle_state，亦不影响既有消费者 → 可自由撤回；母本未给本行的逆转成本（3.2.2 默认值列仅『高风险契约必备（见 X4）』）→ 不推定为 bounded
    applicability:
      problem_space:                   # 骨架源：3.2.2「内容」列＋「默认值」列
        - "消费者定义期望 → 提供者 CI 中验证；防止『提供者自认为兼容』的幻觉（3.2.2 内容列逐字）"
        - "高风险契约必备（见 X4）（3.2.2 默认值列逐字）→ 适用面由风险分级界定，非全契约强制"
      current_space:                   # 骨架源：3.3 现状空间驱动
        - "现状契约清单中无文档的隐式契约是 CDC 的首要对象：期望须以流量观测 + 消费者代码分析为准（3.3 现状空间驱动第二行；公理 A1）→ 消费者实际读取的字段集即期望来源"
        - "既有 CDC 覆盖状态须逆向登记：未在提供者 CI 中执行的人工验证不计入 cdc_suite（3.2.2 内容列『CI 中验证』）"
      delivery_space:                  # 骨架源：3.3 交付空间驱动第二行＋双使用者条款
        - "CI 成熟度 → CDC 可行集；能力不足降软 + 保守假设 ADR，可推翻指标 = CI 能力建立（3.3 交付空间驱动第二行逐字）→ 本治理维度的可行性直接由交付空间决定"
        - "CDC 套件脚手架生成属 Agent 自主项，无需批准（3.3 双使用者条款）；但契约发布（published 迁移）与破坏性变更批准一律走批准路径（同条款）→ 脚手架可自动生成，发布不可"
    envelope:
      - metric: "可修改性：典型变更的实现成本（触达单元数、跨边界契约变更数）"
        bound_expr: "高风险契约的 CDC 覆盖率 = 已建 cdc_suite 的高风险契约数 / 高风险契约总数 上界为 1（X4：∀C ∈ high_risk: cdc_suite(C)）→ 缺口 = 未覆盖者数；变更前置时间随 CDC 在提供者 CI 中的执行时长 单调不减，母本未给该时长数值（0.4 证据门槛 → 不填）"
        source: {source_type: clause_id, value: "3.5", verified: true}
      - metric: "可观测性：卡片 observability_requires（5.2.5）满足率、追踪覆盖率"
        bound_expr: "『提供者自认为兼容』幻觉的检出率 = CDC 在提供者 CI 中拦截的兼容性回归数 / 兼容性回归总数 上界为 1；未纳入 CI 的契约其检出率 下界为 0（3.2.2 内容列：消费者定义期望 → 提供者 CI 中验证）"
        source: {source_type: clause_id, value: "3.2.2", verified: true}
    cost_profile:
      latency_budget_delta: "CDC 在提供者 CI 中执行 → 不进入运行时调用路径，运行时延迟预算增量为 0；成本落在变更前置时间（6.2.1 可修改性族）与 CI 资源；母本未给执行时长与资源占用数值 → 不填（0.4 证据门槛）"
      failure_modes: ["高风险契约无 CDC 套件（X4：软，微服务风格下升硬；3.4 施→8：微服务风格 → CDC 必备）", "期望由提供者单方编写而非消费者定义（3.2.2 内容列 → 期望来源倒置即重演『提供者自认为兼容』的幻觉）", "CDC 未纳入提供者 CI 而只在本地或人工执行（同列『CI 中验证』）", "以 CDC 替代事件 schema 演化测试（3.4 施→8 将两者按风格分列为不同必备项）", "CI 成熟度不足时径行降软而不记保守假设 ADR 与可推翻指标（3.3 交付空间驱动第二行）", "把脚手架自动生成读作可自动发布契约（3.3 双使用者条款：published 迁移属高影响决策，一律走批准路径）"]
      consistency_impact: "CDC 验证的是消费者期望与提供者实现的一致，不承载跨单元事务语义；一致性级别由方面 4 的 Y 系列判定（CSL 批承载）；CDC 全绿不构成数据一致性定案，亦不替代方面 8 验证计划的其他验证项（3.4 施→8：契约测试是验证计划的**组成部分**）"
      observability_requires: ["高风险契约清单与其 CDC 覆盖状态在注册表可查（X4 判定所需；3.4 施→5）", "CDC 在提供者 CI 中的执行结果与失败项留痕（3.2.2 内容列）", "消费者期望工件的来源与版本可追溯（同列『消费者定义期望』→ 期望须可归属到 consumer_set 成员）", "CI 成熟度评估结论与降软的保守假设 ADR 在案（3.3 交付空间驱动第二行）", "契约漂移检测规则参数已按 0.13 注册（3.4 施→9 硬）"]
      ops_cost: "[CDC 套件在提供者 CI 中的执行与维护面＋消费者期望工件的存放与同步面（3.2.2 内容列）→ 运维项随高风险契约数与 consumer_set 基数上升；母本未给单位运维成本 → 方括号占位（MJ-20 (iii) 同型）]"
      skill_prerequisites: ["消费者期望的定义与工件化（3.2.2 内容列）", "在提供者 CI 中挂载 CDC 验证（同列；3.3 交付空间驱动第二行 CI 成熟度）", "高风险契约的分级判定（3.2.2 默认值列『高风险契约必备（见 X4）』→ 分级依据须登记）", "CDC 与单元测试、事件 schema 演化测试的区分（书目 28/29 的行级登记提取面；3.4 施→8）"]
      aggregation_semantics: itemwise  # X4 为逐契约量词（∀C ∈ high_risk）→ 覆盖率按契约逐项评估、无跨契约聚合式（MJ-19 (iii) 同型；MJ-21 (ix)）
    compatibility:
      - peer_entry: STY-016
        relation: composable
        evidence: {source_type: clause_id, value: "3.4", verified: true}   # 施→8 明文「微服务风格 → CDC 必备」＋X4「软（微服务风格下升硬）」→ 微服务风格是 CDC 升硬的条件；母本方向为风格 → 治理维度，ENUM_RELATION 无 required_by 且 STY-016 属已批准条目 → 只登记 composable（MJ-20 (vii) 同型；MJ-21 (viii)：镜像不回填已批准条目）
      - peer_entry: STY-003
        relation: composable
        evidence: {source_type: clause_id, value: "3.4", verified: true}   # 施→8 明文「事件驱动 → 事件 schema 演化测试必备」→ 事件驱动风格下本治理维度以事件 schema 演化测试为对应必备项；同为风格 → 治理维度方向 → 只登记 composable（MJ-20 (vii) 同型）
    constraints_imposed:               # 交叉表源：3.4「施加约束」表（方面 3 全体六行，CTR 十二条逐字相同）
      - {target_aspect: 2, constraint: "已发布契约的边界冻结——分解不得切割既有契约（切割需求 → 走弃用窗口 + 绞杀者迁移）", level: hard}
      - {target_aspect: 4, constraint: "数据契约的 schema 与语义条款是数据流动的唯一合法路径定义", level: hard}
      - {target_aspect: 5, constraint: "协调模式中的每条跨单元交互必须有注册契约（Z1 的契约来源）", level: hard}
      - {target_aspect: 8, constraint: "契约测试是验证计划的组成部分；微服务风格 → CDC 必备；事件驱动 → 事件 schema 演化测试必备", level: conditional}   # 级别列原文「软/硬按风格」→ 本条即该行的主承载条目：X4 为软、微服务风格下升硬，事件驱动下事件 schema 演化测试为必备（3.4 施→8＋3.5 X4 双源同型判读；MJ-21 (x)）
      - {target_aspect: 9, constraint: "契约漂移（运行时实际流量与注册契约的偏离）是守护对象；漂移检测规则参数按 0.13 注册", level: hard}
      - {target_aspect: 10, constraint: "契约是机器层的天然工件：IDL/schema/OpenAPI 文档直接投影为白板谓词，禁止双重维护（0.9 同源生成原则在契约域最强适用）", level: hard}
    anti_patterns:
      - pattern_id: CTR-009-AP1
        description: "高风险契约无 CDC 套件"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ [C ∈ high_risk] ∧ ¬[cdc_suite(C)]"
        signal_level: P1               # X4 明文「∀C ∈ high_risk: cdc_suite(C) —— 软（微服务风格下升硬）」→ 默认 P1；微服务风格（STY-016）在场时升 P0（3.4 施→8 同旨：微服务风格 → CDC 必备）（MJ-4 判据）
      - pattern_id: CTR-009-AP2
        description: "消费者期望由提供者单方定义（期望来源倒置）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, ·, ·, ·, ·)] ∧ [cdc_suite(C)] ∧ ¬[期望工件的来源 ∈ consumer_set] ∧ [期望由 provider 单方编写]"
        signal_level: P1               # 3.2.2 内容列明文「消费者定义期望 → 提供者 CI 中验证；防止『提供者自认为兼容』的幻觉」→ 来源倒置即重演该幻觉，使本治理维度失效；母本未将其单列 X 系列性质 → P1（MJ-4 判据）
      - pattern_id: CTR-009-AP3
        description: "CDC 未纳入提供者 CI（仅本地或人工执行）"
        detection_predicate: "∃ C: [contract(C, provider, ·, ·, ·, ·, ·)] ∧ [cdc_suite(C)] ∧ ¬[cdc_suite 在 provider 的 CI 中自动执行]"
        signal_level: P1               # 3.2.2 内容列『提供者 CI 中验证』；3.3 交付空间驱动第二行以 CI 成熟度界定可行集 → CI 能力不足应走降软 + 保守假设 ADR（可推翻指标 = CI 能力建立）而非静默移出 CI；母本未列 X 系列 → P1（MJ-4 判据）
    formal_anchor:
      - {property_id: X4, role: implements}      # cdc_suite(C) 的登记载体：X4「∀C ∈ high_risk: cdc_suite(C) —— 软（微服务风格下升硬）」以本治理维度为判定对象（3.2.2 默认值列明文『高风险契约必备（见 X4）』）
    references:
      - {bib_id: 28, support_claim: "3.2.2 CDC 机制源头（母本 3.7 书目 28 行级登记提取面逐字对应；提取以本地存档《Ian Robinson - Consumer-Driven Contracts_ A Service Evolution__Pattern.epub》原文全文为准，含 martinfowler.com 原始章节 'Evolving a Service'，2026-09-15 归档并内容核验；书目 4《Building Microservices》第 2 版契约测试章节为本地展开参照）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 29, support_claim: "契约测试与单元测试的区分（母本 3.7 书目 29 行级登记提取面逐字对应；提取以本地存档《Martin Fowler - bliki_ Contract Test.epub》原文全文为准，2026-09-15 归档并内容核验；该区分另由书目 4 同章节本地承载）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：CDC 把兼容性承诺的验证权交给消费者——期望由消费者定义、在提供者 CI 中验证，直接消除 3.2.2 内容列点名的『提供者自认为兼容』幻觉；X4 将其限定在高风险契约，避免全契约铺开；3.3 双使用者条款把 CDC 套件脚手架生成列为 Agent 自主项 → 生成成本可自动化。代价：可行性完全由交付空间决定——CI 成熟度不足时只能降软并记保守假设 ADR（3.3 交付空间驱动第二行），本治理维度在低成熟度场合实质不可用；期望工件须可归属到 consumer_set 成员，消费者集合未知时（3.6 示例二）期望来源缺失；CDC 覆盖变更前置时间与 CI 资源，母本未给量化数值 → 成本面只能定性登记；事件驱动风格下必备项是事件 schema 演化测试而非 CDC（3.4 施→8），两者不可互换。"
      typical_scenarios: "高风险契约发布前须建立 CDC 套件的场合（3.2.2 默认值列；X4）；微服务风格下 CDC 由软升硬、须纳入验证计划的场合（3.4 施→8；X4 括注）；既有隐式契约无文档、须以消费者实际读取字段集为期望来源的场合（3.3 现状空间驱动第二行）；提供者声称兼容而消费者频繁失配、须以 CDC 拦截兼容性回归的场合（3.2.2 内容列）；CI 成熟度不足、须降软并登记保守假设 ADR 与可推翻指标的场合（3.3 交付空间驱动第二行）；由 Agent 生成 CDC 脚手架但发布仍须走批准路径的场合（3.3 双使用者条款）。"
      common_misuse: "高风险契约无 CDC 套件（AP1，X4；微服务风格下升硬）；期望由提供者单方编写（AP2，3.2.2 内容列的来源倒置）；CDC 只在本地或人工执行而不进 CI（AP3）；以 CDC 替代事件 schema 演化测试（3.4 施→8 分列两项）；CI 能力不足即静默降软而不记保守假设 ADR 与可推翻指标（3.3 交付空间驱动第二行）；把 CDC 全绿读作数据一致性定案（一致性属方面 4 的 Y 系列）；把脚手架自动生成读作可自动发布契约（3.3 双使用者条款：published 迁移走批准路径）；为 CDC 执行时长或覆盖率目标填无出处数值（0.4 证据门槛＋6.2.1 量化纪律）。"

