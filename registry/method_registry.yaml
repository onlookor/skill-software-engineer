      current_space: []                # 4.3 现状空间驱动无本行专属条件（G-STY-1 同型，M15：留空 ≠ 不适用）
      delivery_space: []               # 同上（G-STY-1 同型）
    envelope:
      - metric: "延迟分位数 P99"
        bound_expr: "P99_replica(D) ≤ P99_direct(D)：授权读副本为读负载分流 → 读路径延迟不劣于直读所有者"
        source: {source_type: row_id, value: "4.2.1-所有者 + 授权读副本", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "freshness_window ≤ Δ_read：副本新鲜度窗口写入数据契约（4.2.1 备注）→ 消费方按声明窗口容忍旧值"
        source: {source_type: row_id, value: "4.2.1-所有者 + 授权读副本", verified: true}
      - metric: "可修改性：变更前置时间"
        bound_expr: "read_load_owner ↓：引入副本后所有者单元读负载单调不增 → 变更排期不受读峰值挤压"
        source: {source_type: row_id, value: "4.2.1-所有者 + 授权读副本", verified: true}
    cost_profile:
      latency_budget_delta: "不适用（kind_profile_OWN.optional：同 OWN-001；副本引入的读延迟界由 envelope 承载，不重复计入本字段）"
      failure_modes: ["写权旁落：副本/物化视图侧出现直写流量（Y1/Y2 硬违例的直接来源）", "新鲜度条款缺失：副本窗口未写入数据契约 → 消费方读到不可预期旧值", "副本重建能力未登记：派生读模型不可重建 = 隐式权威（Y7 漂移信号）"]
      consistency_impact: "写路径仍单点（无跨单元协调）；读侧一致性 = 副本新鲜度语义，级别声明归 CSL 条目（Y3），本条目只承载新鲜度条款义务"
      observability_requires: ["副本新鲜度计量（实测窗口对照契约条款）", "授权关系可查（access_path 的 path_kind ∈ {replica, view}）"]
      ops_cost: "[较单一所有者增加副本同步与新鲜度监控运维项；写权仍单点故无跨单元协调项]"   # 18-B S5 保守界比较对象（ops_cost(OWN-01) < ops_cost(OWN-02)）
      skill_prerequisites: ["数据契约新鲜度条款设计（4.2.1 备注）", "副本/物化视图的重建演练（Y7 可重建性登记项）"]
      aggregation_semantics: itemwise
    compatibility: []                  # 同 OWN-001 行内注（MJ-5 表内互斥不枚举 / MJ-9 跨 kind 无明文不登记）
    constraints_imposed:               # 交叉表源：4.4「施加约束」表七行（同 OWN-001）
      - {target_aspect: 2, constraint: "数据归属现状回馈分解：现状数据不可干净归属时，S4 策略受约束、拆分序列须按数据迁移可行性排序", level: soft}
      - {target_aspect: 3, constraint: "数据契约的 schema 与语义条款（单位/值域/空值/敏感性/新鲜度）由本方面供给", level: hard}
      - {target_aspect: 5, constraint: "一致性模型 → 协调模式可行集：跨所有者强一致需求 → Saga + 业务补偿，或回溯方面 1 重审部署风格（Y6 的下游消费路径）", level: hard}
      - {target_aspect: 6, constraint: "一致性级别声明与新鲜度条款 → 质量判定的代价计入项", level: soft}
      - {target_aspect: 8, constraint: "不变式 → 对账验证项；血缘 → 派生数据可重建性测试；边界校验 → 契约测试的数据面", level: soft}
      - {target_aspect: 9, constraint: "数据漂移守护对象：schema 漂移（实际 schema 偏离注册契约）、所有权违例（绕过所有者的直写流量）、共享写例外超期", level: hard}
      - {target_aspect: 10, constraint: "机器层：Y 谓词集 + 血缘图；人类层：覆盖谓词子集 {Y 谓词集、血缘} 的投影视图（受众问题 = 数据所有权与流动；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: OWN-002-AP1
        description: "写权旁落：经授权读副本/物化视图的直写流量"
        detection_predicate: "∃ D, c: access_path(D, c, replica, ·) ∧ [该访问路径存在写流量]"
        signal_level: P0               # Y1/Y2 硬性质违例的直接来源（MJ-4 P0 判据；4.5 触发条件含 access_path 谓词变更）
    formal_anchor:
      - {property_id: Y1, role: implements}     # 写权仍单一
      - {property_id: Y2, role: implements}     # 副本读路径亦须契约化（access_path 登记 path_kind）
      - {property_id: Y7, role: triggers}       # 副本为派生物 → 可重建性登记义务（软性质，P2）
      - {property_id: W4, role: consumed_by}
    references: []                     # G-OWN-1 同型（书目 41 登记面不含本行）
    narrative:
      benefit_cost_analysis: "收益：读负载分流而写权仍单点——一致性协调成本不增，只增副本新鲜度一项契约条款；是 OWN-001 在读扩展受限时的唯一合法演进步（4.2.1 行 1 备注「读可扩展（副本/视图），写不可共享」）。代价：副本是派生物，重建能力（Y7）与新鲜度窗口都必须登记，否则退化为隐式权威；新鲜度不可核验时 S4 只能标 unknown + 勘察义务（18-B S4 推荐侧即此形态）。"
      typical_scenarios: "读负载高且消费方可容忍副本延迟（4.2.1 适用条件列）；18-B 正例 S4/S5 中与 OWN-001 加权得分不可区分的对照候选（落选于 CH-B 保守界）。"
      common_misuse: "把副本当第二权威（直写）；新鲜度窗口口头承诺不入数据契约；以「读副本」名义掩盖共享写例外（应走 OWN-004 并附退出计划）。"

