    envelope:                          # 骨架源：1.2.2「包络要点」列（进程内调用／无独立伸缩／一次故障全局倒）；metric 词汇取 6.2.1；转写规则见 MJ-2
      - metric: "延迟分位数 P99"
        bound_expr: "P99(req) = Σ 单元内调用开销，跨单元网络跳数 = 0（母本：进程内调用，延迟最低）；与 STY-016 的 0.8 下界（跨单元调用约为同进程调用的 10–100 倍）构成对照项；参数：单元内调用路径长度、共享资源竞争"
        source: {source_type: row_id, value: "1.2.2-单体", verified: true}
      - metric: "可伸缩性：单位资源增量带来的容量增量"
        bound_expr: "capacity(r + Δr) − capacity(r) 的实现粒度 = 整个部署单元（母本：无独立伸缩）——不存在按单元子集伸缩的容量增量通道；参数：单元副本数、单副本容量、负载分布"
        source: {source_type: row_id, value: "1.2.2-单体", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "单个单元级故障的影响面比例 = 1（母本：一次故障全局倒）；SLO 提升通道限于单元级冗余，不含单元内隔离通道；参数：副本数 n、故障域分布、恢复策略（MTTR）"
        source: {source_type: row_id, value: "1.2.2-单体", verified: true}
    cost_profile:
      latency_budget_delta: "无跨单元网络项（进程内调用）；延迟预算落在单元内调用路径与共享资源竞争（参数：单元内组件数、连接池/锁竞争）"
      failure_modes: ["单体内部无模块化（大泥球）→ 变更触达面失去边界收敛", "单元级故障影响面 = 全部流量（一次故障全局倒）", "整体发布 → 变更前置时间与发布风险随单元规模增长"]   # 前两项骨架源 1.2.2 反模式列/包络要点列；第三项人工判断（单一部署单元的直接后果）
      consistency_impact: "ACID 事务可用（母本包络要点）：本地事务即可满足强一致，无需分布式协调——方面 4/5 的最简可行侧"
      observability_requires: ["单元内组件级调用与错误可观测（无部署边界天然分区，须以模块/组件维度切分）", "共享资源（连接池/锁/存储）竞争计量"]
      ops_cost: "[单一制品、单一发布通道 → 运维面最小；成本随单元规模上升而在发布编排与故障隔离侧增长]"
      skill_prerequisites: ["单元内模块化纪律（边界声明与穿透门禁）", "共享数据与本地事务边界治理"]
      aggregation_semantics: itemwise
    compatibility:                     # 对侧已登记的行不重复（MJ-5/MJ-9）：STY-006（@1.2.3-共享数据行）、STY-008、STY-009 均已登记本条目为 peer
      - peer_entry: STY-007
        relation: composable
        evidence: {source_type: clause_id, value: "1.2.1", verified: true}   # 骨架源 @1344：「单体内每一层内部也可以是六边形」——措辞以单体与分层并存为前提（人工判断：语义蕴含，非逐字叠加声明）
      - peer_entry: STY-015
        relation: composable
        evidence: {source_type: row_id, value: "1.2.2-模块化单体", verified: true}   # 骨架源：模块化单体定义 =「单部署单元 + 内部强制模块边界」→ 本风格的部署形态可与模块边界叠加（镜像行见 STY-015；relation 判读见块头 MJ-8）
    constraints_imposed:               # 交叉表源：1.4「施加约束」表（单体行 + 无修饰的通用行 6/10）
      - {target_aspect: 2, constraint: "分解可纯逻辑边界（1.4 施→2 单体行）：分解单元不必映射部署单元", level: hard}
      - {target_aspect: 3, constraint: "进程内调用可用（1.4 施→3 单体行）：跨单元契约规则不适用于本风格内部", level: soft}   # 表标「硬/软按条」：许可性条款判读为软（MJ-4）
      - {target_aspect: 4, constraint: "共享数据库可用（1.4 施→4 单体行）：本地事务与 ACID 为默认一致性手段", level: soft}   # 同上（MJ-4）
      - {target_aspect: 5, constraint: "进程内编排、本地事务可用（1.4 施→5 单体行）：不触发分布式协调必答项", level: soft}   # 同上（MJ-4）
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）；可用性上界尤其约束高可用目标（1.3：高可用 → 无单点故障要求 → 排除部分单体形态）", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集（style/deployed_on，单元数 = 1）；人类层：投影视图必须表达所选风格", level: hard}
    anti_patterns:                     # 骨架源：1.2.2「典型反模式」列（本行一项，不增补）
      - pattern_id: STY-014-AP1
        description: "单体内部无模块化（大泥球）"
        detection_predicate: "∃ u, c1, c2: unit(u) ∧ [c1, c2 属 u] ∧ depends_on(c1, c2, call, ·) ∧ ¬declared(boundary_type(c1, ·)) ∧ ¬declared(boundary_type(c2, ·))"
        signal_level: P1               # 人工判断（MJ-4）：1.2.5 无涉本风格的冲突行、1.5 V 系列无对应硬性质 → 不满足 P0 判据；结构漂移限期整改。若内部边界经 boundary_type + dependency_rule 登记，则穿透构成 V1 违例直接来源，升 P0（登记义务见 gaps: G-STY-4）
    formal_anchor:                     # 交叉表源：1.5 V1–V5
      - {property_id: V2, role: implements}     # connects(u1,u2,p) 面在单元数 = 1 时最小（进程内调用），协议自洽检查退化为端点契约检查
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 3, support_claim: "1.2.2 部署风格权衡的元方法（母本登记提取面：1.2.2/1.2.3 分布式风格权衡的元方法——子维度级，本行属其覆盖面；单体为权衡的基线侧）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 2, support_claim: "风格对比与架构决策方法（母本登记提取面为子维度级，未限定行）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：进程内调用使延迟项最小、ACID 本地事务可用（一致性成本最低），单一制品使运维面与发布通道最小；代价：容量增量只能以整个单元为粒度获得（无独立伸缩），且单元级故障影响面为全部流量（一次故障全局倒）。母本把本行列为演进式元方法的起点侧语境（1.2.4 默认起点为模块化单体，见 STY-015/STY-023 与 bib 23），即本风格的可逆性优势是其被选为起点的主要理由。"
      typical_scenarios: "小团队与领域尚未充分理解的系统（方面 2 输入不足）、延迟敏感与强一致要求的系统、负载无独立伸缩需求的系统、初创期以最小运维面换取迭代速度的场景。"
      common_misuse: "在无模块边界的单元内长期堆积职责（AP1 大泥球），使后续拆分失去可行集；以单体承载需要独立伸缩的异构负载（伸缩粒度错配）；在多团队组织内坚持单体（1.3 交付空间过滤器的反向误用：团队数与单元数错配 → 变更排队与认知负荷超载）。"

