      consistency_impact: "本形态是一致性判定的输入面而非判定者：3.2.3 条件 2（只读或全系统单写者）与条件 3（不承载跨单元事务语义）直接对应方面 4 的 W4 单写者与 Y 系列一致性级别（CSL 批承载）；数据契约登记 schema 与语义条款，一致性级别由 access_path 与 consistency_level 谓词承载（4.5）→ 不得以数据契约的兼容性规则替代一致性定案"
      observability_requires: ["语义条款五项（单位、值域、空值语义、敏感性标注、所有权声明）在契约注册表可查（3.2.1 定义列）", "访问路径的 owner 与 path_kind 可查（4.5 access_path 谓词面；3.4 接收约束方面 4 行）", "共享数据四条件的满足情况显式记录在案（3.2.3 明文＋X6 explicitly_recorded）", "敏感数据访问路径合规率可度量（6.2.1 安全族度量方式）", "契约漂移检测规则参数已按 0.13 注册（3.4 施→9 硬）"]
      ops_cost: "[服务目录（内部检索）与数据契约注册面的运维项（3.2.2 发现与注册）→ 运维项随数据集数与消费方数上升；母本未给单位运维成本 → 方括号占位（MJ-20 (iii) 同型）]"
      skill_prerequisites: ["schema 设计与语义条款编写（单位、值域、空值语义、敏感性标注、所有权声明）（3.2.1 定义列）", "共享数据接入四条件的判定与显式记录（3.2.3；X6）", "数据所有权与访问路径建模（方面 4 的 owner/access_path 谓词面；OWN 批承载）", "契约测试设计（3.4 施→8；CDC 按 X4 分级）"]
      aggregation_semantics: itemwise  # 母本未给 CTR 的跨契约聚合式（MJ-19 (iii) 同型）→ 触达面与合规率按数据契约逐项评估（MJ-21 (ix)）
