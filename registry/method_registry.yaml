      - bib_id: "37"                   # Martin Fowler. "Event Sourcing." martinfowler.com, 2005 —— 4.7 书目 37 的登记面逐字为「4.2.2 事件日志权威状态」（行级登记，本批已核验：本地 resources/se 在库，在线 URL 在位，年份与著录一致）
        support_claim: "事件日志作为权威状态、应用状态由事件序列重放派生的基本机制（4.2.2 第二列「状态以事件日志为准，物化视图为派生」的外部文献支撑面）"
        compile_usage: metadata_extraction   # 4.7 表内该条 compile_usage 列原文；提取以原文存档为准，不以本注册表转述替代
        trust_grade: "[已核验]"
    narrative:
      benefit_cost_analysis: "收益：权威状态即完整变更历史，审计与时间旅行调试由存储形态直接提供而无需附加设施（1.2.3 适用条件列）；读模型可自由优化而不触碰权威数据（1.2.3 包络列「读模型自由优化」），读写负载特征悬殊时收益最大；派生视图可重建（Y7）使读侧故障的恢复路径确定、其 SLO 承诺可低于日志侧；事件序列同时是决策与行为的可追溯工件，与 0.7 共享白板历史同构。代价：1.2.3 包络列明记「完整历史↑、复杂度↑↑、事件 schema 演化难」——事件 schema 变更的触达单元数下界是全部已持久化版本，治理成本随历史长度单调上升；读侧相对权威日志存在投影延迟窗口，强同步查询语义不可得（1.2.5 张力行）；事件基础设施属 1.3 交付空间驱动明列的重运维风格，低运维能力场景直接排除；运维面为四行最高。1.2.3 反模式列警示「把 CQRS 当作默认选择用在不需要的场景」——本拓扑的选用须由审计/时间旅行/读写悬殊三类需求之一驱动，不得由技术偏好驱动。"
      typical_scenarios: "事件溯源风格定案后的存储形态（4.2.2 第三列；1.2.3 定义列）；审计要求或时间旅行调试需求驱动的选型（1.2.3 适用条件列）；读写负载特征悬殊、读侧需独立优化的场景（同行）；既有事务日志可经 CDC 提取为事件流的棕地场景（4.2.4 CDC 行；4.3 现状空间驱动）；CQRS 读侧的派生视图承载（4.2.4 物化视图行）；跨单元查询聚合以派生读模型替代共享库的场景（同前行）。"
      common_misuse: "向物化视图直写或把视图当权威源（AP1，Y1 违例）；派生数据无血缘登记却声称可重建（AP2，Y7 软违例）；事件 schema 无版本治理即演化（AP3）；把 CQRS/事件溯源当默认选择用在不需要的场景（1.2.3 反模式列明文）；以「最终一致」回避窗口期业务语义分析（4.2.3 降级纪律幻觉 (ii)）；在低运维能力交付空间选用复杂事件基础设施（1.3 交付空间驱动排除项）；为投影延迟填无出处数值（0.4＋6.2.1 量化纪律）。"

