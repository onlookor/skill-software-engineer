      observability_requires: ["排除记录逐条可查：被排除候选 + 理由 + 依据指针（约束 ID + 条目字段指针）", "硬约束清单及其出处可查（0.4；含外部强加登记与生效守护规则集）", "软约束降权记录可查（降权值入 S5）", "全排除 → FM-4/CH-D 升级声明留痕（排除性约束清单 + 裁决选项空间）"]
      ops_cost: "[无独立运维面；成本落在硬约束清单的维护、出处核验与外部强加决策的登记跟踪]"
      skill_prerequisites: ["硬/软约束分级判读（1.4 两表 + 0.18.2 S2；『硬/软按条』行须逐条判读 → MJ-4）", "排除依据指针登记（约束 ID + 条目字段指针）", "全排除时的升级处置（FM-4 → CH-D：修订目标/放宽强加/追加投入/注册表扩充）"]
      aggregation_semantics: itemwise
    compatibility:
      - {peer_entry: STY-020, relation: composable, evidence: "1.2.4 @1391 典型链『约束排除 → 质量属性驱动』：本条为链中前驱（镜像登记于 STY-020）"}
    constraints_imposed:
      - {target_aspect: 1, constraint: "排除以硬约束为限；软约束失败 = 降权记录不排除（0.18.2 S2），降权值入 S5——本方法不得被用作『以软约束淘汰候选』的正当化", level: hard}
      - {target_aspect: 9, constraint: "守护规则（P0/P1）属硬约束来源（1.4 接收表方面 9 行，级别硬）→ 排除检验必须消费生效守护规则集；演化观测数据为软（仅作风格重审提议的事实源）", level: hard}
      - {target_aspect: 10, constraint: "机器层：排除记录入 selection_log（step_log + exclusion_record 谓词）；人类层：ADR 被拒候选节须引用排除记录（0.5 必备节）", level: hard}
    anti_patterns: []                # 母本 1.2.4 表无「典型反模式」列（块头通用说明一）
    formal_anchor:
      - {property_id: V3, role: implements}   # 人工判断：S2(ii)「检验候选集内部及候选×已定条目的 compatibility(hard_conflict) 对」是 V3（不存在未被批准例外覆盖的硬冲突）在选型期的执行形态
      - {property_id: V5, role: triggers}
    references: []                   # 母本未给本行登记提取面：书目 12/13 的登记面分别限定于「质量属性驱动的风格选择元方法（1.2.4）」与「演进式元方法（1.2.4）」，不含约束排除法。候选书目 2 的登记面为「风格对比与架构决策方法」（未限定行），但母本未将其指向 1.2.4 → 不擅自扩张解释面（M6 禁止以不承载该主张的文献充当出处）；登记为文献缺口待人工裁决 → gaps: G-STY-5
    narrative:
      benefit_cost_analysis: "收益：在硬约束密集的场景下最省认知成本——不必先量化全部质量属性，只需把合规、现状平台、团队能力三类硬约束逐条过筛，剩余即候选；排除记录天然是 ADR 被拒候选节的素材，且每条排除都带约束 ID 与字段指针，可核验性强。代价：本方法只保证『不违反硬约束』，不保证『质量目标可达』——它不产出可达性判定，须由 S4 包络校验（STY-020 的落点）补齐；硬约束清单的完备性是单点风险，漏一条外部强加决策就会放行不可行方案；过度排除（把软约束当硬约束）会直接触发 FM-4。"
      typical_scenarios: "棕地项目改造（既有平台与技术栈锁定）、强合规行业（金融/医疗/政务的辖区与审计约束）、外部强加决策在案（『必须上某云/必须用某框架』）、团队能力短板明确、作为 @1391 典型链的第一步（先用硬约束收缩候选集，再做属性求交与排序）。"
      common_misuse: "把软约束（如 1.4 施→8 验证策略适配）当硬约束直接排除候选；排除不附依据指针（被拒候选节沦为叙事）；漏装外部强加决策或对强加决策免检（母本明示『强加不等于免检』，须走 CH-A 完整分析）；排除后即用剩余集定案（跳过 S4 包络校验与纪律二批准）；全排除时自行放宽约束而不升级（母本要求 FM-4 → CH-D，枚举排除性约束清单 + 裁决选项空间）。"

  - entry_id: STY-022
    kind: STY
    name: 领域驱动（风格选择元方法）
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.4-领域驱动", verified: true}
        - {source_type: clause_id, value: "1.2.4", verified: true}
        - {source_type: clause_id, value: "1.2.2", verified: true}   # 部署切分线判定规则（@1359–1364）
        - {source_type: clause_id, value: "1.4", verified: true}       # 接收表方面 2 行（软）＋施加表通用行
        - {source_type: clause_id, value: "1.5", verified: true}       # V5
        - {source_type: bib_id, value: "7", verified: true}
    typical_reversibility: free      # 人工判断：方法可换（重跑选择过程）；但其产出绑定方面 2 的分解边界，若分解已定案则重跑受上游已定决策约束（0.18.2 S0 血缘查询）
    applicability:
      problem_space:                 # 骨架源：1.2.4「适用条件」列
        - "[领域复杂]"
        - "[方面 2 输入充分（领域分解边界／限界上下文已在案）]"
      current_space: []              # 母本本行未给现状空间条件（G-STY-1）
      delivery_space: []
    envelope: []                     # 剖面豁免：kind_profile_STY.entry_level_exemptions（STY-020…STY-024，check C-ENV）
    cost_profile:
      latency_budget_delta: "不适用（元方法不进入运行时路径，无延迟项）；跨上下文交互的延迟面由产出的 1.2.2/1.2.3 风格条目承载"   # MJ-11
      failure_modes: ["方面 2 输入不足即执行：领域分解边界未定 → 限界上下文候选沦为主观划界（本方法的唯一输入面失守）", "把『候选一个部署单元』读作强制一一映射：母本用词为『候选』，强制映射等价于以领域边界替代 1.2.2 部署切分线判定规则", "跨上下文的通信结构未导出（只导出部署单元、不导出交互形态）→ 方面 3 输入缺口", "领域边界模糊时仍推分布式风格（1.4 接收表方面 2 行：领域边界模糊 → 分布式风格降权）"]   # 四项人工判断（第一/二项源自过程定义用词，第三项源自『部署与通信结构』双产出，第四项源自 1.4 接收表）
      consistency_impact: "不适用（无运行时一致性面）；上下文间的一致性形态由产出的通信风格决定（1.2.3），属方面 4 输入"   # MJ-11
      observability_requires: ["限界上下文 → 部署单元候选映射表可查（含偏离项及其理由）", "跨上下文交互的通信结构导出依据可查（落 1.2.3 取值）", "方面 2 输入的版本与出处可查（分解边界定案指针）"]
      ops_cost: "[无独立运维面；成本落在领域分解边界的维护与上下文映射的复核（方面 2 变更须触发本方法产出重审）]"
      skill_prerequisites: ["限界上下文识别（方面 2 的 S1 领域驱动分解）", "语义边界判据（2.2.2）", "上下文映射 → 部署/通信结构导出（1.2.2 切分线规则 + 1.2.3 取值）"]
      aggregation_semantics: itemwise
    compatibility: []                # @1391 典型链未含本方法，母本亦未登记本方法与链内各方法的组合实例 → 不登记（块头通用说明四，禁造规范）。注：本方法产出的组合仍须过 1.2.5 冲突矩阵（constraints 施→1）
    constraints_imposed:
      - {target_aspect: 2, constraint: "部署与通信结构从方面 2 的领域分解边界导出；每个限界上下文『候选』一个部署单元——候选 ≠ 强制，偏离须留痕（母本用词为『候选』→ 软，MJ-4 判读：许可性/候选性条款 → 软）", level: soft}
      - {target_aspect: 1, constraint: "部署切分线仍按 1.2.2 判定规则（决策改变部署单元数量/单元边界/单元到节点映射/网络边界/协议端点拓扑 → 归方面 1）；领域边界不自动等于部署边界，产出的组合须过 1.2.5 冲突矩阵（V3）并走批准（纪律二 → V5）", level: hard}
      - {target_aspect: 10, constraint: "机器层：上下文 → 部署单元候选映射与导出依据入 selection_log；人类层：投影视图必须表达所选风格（1.4 施→10 通用行，经产出风格传导）", level: hard}
    anti_patterns: []                # 母本 1.2.4 表无「典型反模式」列（块头通用说明一）
    formal_anchor:
      - {property_id: V5, role: triggers}     # 风格定案属高影响决策（纪律二）；V3 的登记位见块头通用说明七
    references:
      - {bib_id: 7, support_claim: "母本登记提取面为「S1 领域驱动分解；2.2.2 语义边界判据」——本行过程定义直接消费该两面（『从方面 2 的领域分解边界导出』『限界上下文＝统一领域模型适用的语义边界』）；母本未给本行 1.2.4 行级提取面，故本条为登记面的下游应用而非行级逐字对应（如实标注，不夸大）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：当领域复杂且方面 2 已给出可信的分解边界时，本方法把风格选择锚定在语义边界上——部署单元与限界上下文对齐可避免跨单元协调成本爆炸（1.4 接收表方面 2 行的理由），且通信结构随上下文映射自然导出，方面 1/2/3 的输入输出链最短。代价：强依赖方面 2 的输入质量，分解未定案时本方法无从执行；母本用词是『候选一个部署单元』而非『必须』——领域边界只是部署切分的输入之一，1.2.2 的切分线判定规则（团队、伸缩、故障隔离、数据主权）仍须独立过一遍；领域边界模糊时按 1.4 应给分布式风格降权，此时强行使用本方法会产出过度分布化的方案。"
      typical_scenarios: "领域复杂且已有事件风暴/领域建模产出的系统（方面 2 输入充分）、业务子域之间交互形态清晰、需要在多个限界上下文间决定部署粒度与通信结构、DDD 语境下的架构定型与上下文映射（含防腐层/共享内核等关系）落地。"
      common_misuse: "在方面 2 未定案时先用本方法『倒推』分解边界（输入输出倒置）；把『候选一个部署单元』执行成强制一一映射（忽略团队认知负荷与伸缩粒度，等价于绕过 1.2.2 切分线规则）；只导出部署单元不导出通信结构（方面 3 缺口）；领域边界模糊时仍推微服务（1.4 明示应降权）；以领域名词直接充当部署单元名而不做切分线判定（投影上看似对齐，运行时跨单元协调成本失控）。"

