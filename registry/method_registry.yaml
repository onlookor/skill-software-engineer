        - "CI 成熟度决定 CDC 可行集；能力不足时 CDC 降为软约束 + 保守假设 ADR（可推翻指标 = CI 能力建立）（3.3 交付空间驱动第二行）"
    envelope:
      - metric: "可修改性：典型变更的实现成本（触达单元数、跨边界契约变更数）"
        bound_expr: "additive-only 下既有字段的改动数 = 0 且新增字段均为可选（3.2.2 版本化策略内容列明文）→ 改动数 > 0 即为破坏性变更，须走 X3 弃用窗口；schema 变更触达的消费者数 = consumer_set 基数，一对多消费者使该基数 单调不减"
        source: {source_type: row_id, value: "3.2.2-版本化策略", verified: true}
      - metric: "可观测性：卡片 observability_requires（5.2.5）满足率、追踪覆盖率"
        bound_expr: "事件信封元数据规范覆盖率 上界为 1；追踪覆盖率 单调不减 → 信封缺项即跨消费方因果链断裂，覆盖率 < 1 时为可观测性缺口而非可接受状态（3.2.1 定义列将事件信封列为构成项；6.2.1 可观测性族）"
        source: {source_type: clause_id, value: "6.2.1", verified: true}
      - metric: "可用性/可靠性：可用性目标（SLO）、错误预算〔error budget：1 − SLO〕"
        bound_expr: "错误预算 = 1 − SLO（6.2.1 定义式）；一对多扇出使单事件的投递失败影响面 ≥ 单个消费方 → 错误预算消耗速率 随 consumer_set 基数单调不减；目标值只能取四类合法出处（6.2.1 量化纪律＋0.4 证据门槛）"
        source: {source_type: clause_id, value: "3.4", verified: true}
    cost_profile:
      latency_budget_delta: "扇出使单跳延迟预算由『一次投递』改为『一次投递 + N 路消费』；发布方不等待任何消费方 → 发布侧预算与消费侧解耦，但端到端业务延迟随最慢消费者上升；本形态不承诺即时结果（3.2.1 适用条件列『多方响应同一业务事实』的反面）"
      failure_modes: ["事件契约以祈使语义命名或只有一对一消费者（3.2.1 判别规则违例，X7 可捕获）", "已发布事件做非 additive-only 变更而未走破坏性变更流程（3.2.2 版本化策略＋破坏性变更流程；X3 违例）", "事件信封元数据规范缺项（3.2.1 定义列构成项缺失 → 跨消费方因果追踪断裂）", "演化策略未登记即发布（3.2.1 定义列构成项；X2 发布态须 has(version) ∧ has(compat_policy)）", "协调模式产生的事件契约未登记（3.4 接收约束方面 5 行硬 → X1 违例）", "事件驱动风格下异步消息/事件契约两者皆未取（3.4 接收约束方面 1 行『必选其一』为硬）"]
      consistency_impact: "发布-订阅解耦使发布方与消费方不再『必须同时成功』→ 与 3.2.3 条件 3 相容；多方响应同一业务事实时的跨消费方一致性由方面 4 的 Y 系列判定（CSL 批承载）、补偿语义由方面 5 的 Saga/补偿谓词承载（CRD 批）；backward 兼容默认值只保证旧消费者可读新数据，不构成一致性承诺，不得以兼容性规则替代一致性定案"
      observability_requires: ["事件信封元数据在事件本体内可查（3.2.1 定义列；CloudEvents 类规范，书目 31）", "演化策略与兼容性规则在 schema registry 可查（3.2.2 版本化策略默认值列『additive-only + schema registry』）", "消费者集合（consumer_set）基数可观测——X7 的命名语义 × 消费者数交叉验证以此为输入（3.2.1 判别规则）", "追踪覆盖率可观测（6.2.1 可观测性族度量方式：基础设施勘察）", "契约漂移检测规则参数已按 0.13 注册（3.4 施→9 硬）"]
      ops_cost: "[schema registry（事件/消息）与事件总线的运维面（3.2.2 发现与注册）→ 运维项随事件类型数与订阅方数上升；母本未给单位运维成本 → 方括号占位（MJ-20 (iii) 同型）]"
      skill_prerequisites: ["领域事件建模与过去时态命名（3.2.1 定义列＋判别规则）", "事件信封元数据规范（CloudEvents 类，书目 31）", "additive-only 演化策略与兼容性规则选型（3.2.2 版本化策略/兼容性规则；书目 33）", "事件 schema 演化测试设计（3.4 施→8：事件驱动 → 事件 schema 演化测试必备）", "CDC 套件脚手架生成（3.3 双使用者条款：Agent 自主项）"]
      aggregation_semantics: itemwise  # 母本未给 CTR 的跨契约聚合式（MJ-19 (iii) 同型）→ 演化成本与错误预算按事件契约逐项评估（MJ-21 (ix)）
    compatibility:
      - peer_entry: STY-003
        relation: requires
        evidence: {source_type: row_id, value: "3.2.1-事件契约", verified: true}   # 适用条件列明文「事件驱动风格；多方响应同一业务事实」＝STY-003 事件驱动（发布订阅）。母本方向为风格 → 契约形态可行集（3.4 接收约束方面 1 行），本侧登记 requires 读作『事件契约以事件驱动风格在场为前提』，与母本方向一致（接收端）→ 不属 MJ-20 (vii) 的方向倒置情形；ENUM_RELATION 无 required_by 且 STY-003 属已批准条目，对侧不回填（MJ-21 (viii)）
      - peer_entry: CTR-003
        relation: composable
        evidence: {source_type: clause_id, value: "3.4", verified: true}   # 接收约束方面 1 行「事件驱动 → 异步消息/事件契约必选其一」→ 两形态可在同一系统内并存；同一条交互仍只能归属其一（3.2.1 判别规则：事实语义 → 事件走本条，祈使语义 → 命令走 CTR-003）→ composable 指系统层面并存、非同一交互叠用（本行回填 CTR-003 侧已声明的镜像）
      - peer_entry: CTR-007
        relation: composable
        evidence: {source_type: row_id, value: "3.2.2-版本化策略", verified: true}   # 默认值列明文「事件：additive-only + schema registry」→ 事件契约的默认版本载体与演化策略由版本化策略维度指派（本行回填 CTR-007 侧已登记的镜像，与 CTR-002↔CTR-007 同源同型；同批 seed 条目 → 双向登记，MJ-21 (viii)）
      - peer_entry: CTR-008
        relation: composable
        evidence: {source_type: row_id, value: "3.2.2-兼容性规则", verified: true}   # 默认值列明文「事件契约：backward」→ 事件契约的默认兼容性规则由兼容性规则维度指派（本行回填 CTR-008 侧已登记的镜像；同批 seed 条目 → 双向登记，MJ-21 (viii)）
    constraints_imposed:               # 交叉表源：3.4「施加约束」表（方面 3 全体六行，CTR 十二条逐字相同）
      - {target_aspect: 2, constraint: "已发布契约的边界冻结——分解不得切割既有契约（切割需求 → 走弃用窗口 + 绞杀者迁移）", level: hard}
      - {target_aspect: 4, constraint: "数据契约的 schema 与语义条款是数据流动的唯一合法路径定义", level: hard}
      - {target_aspect: 5, constraint: "协调模式中的每条跨单元交互必须有注册契约（Z1 的契约来源）", level: hard}
      - {target_aspect: 8, constraint: "契约测试是验证计划的组成部分；微服务风格 → CDC 必备；事件驱动 → 事件 schema 演化测试必备", level: conditional}   # 级别列原文「软/硬按风格」→ 本条为事件形态：3.4 施→8 后半句明文『事件驱动 → 事件 schema 演化测试必备』→ 该项取硬；CDC 按 X4 分级（软，微服务风格下升硬）（MJ-4 同型判读；MJ-21 (x)）
      - {target_aspect: 9, constraint: "契约漂移（运行时实际流量与注册契约的偏离）是守护对象；漂移检测规则参数按 0.13 注册", level: hard}
      - {target_aspect: 10, constraint: "契约是机器层的天然工件：IDL/schema/OpenAPI 文档直接投影为白板谓词，禁止双重维护（0.9 同源生成原则在契约域最强适用）", level: hard}
    anti_patterns:
      - pattern_id: CTR-004-AP1
        description: "事件契约以祈使语义命名，或消费者数为一对一（『PleaseDoX 事件』反模式的事件侧）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ [C 登记为事件契约] ∧ ([C 的命名含祈使语义] ∨ [consumer_set 基数 = 1])"
        signal_level: P2               # X7 明文「事件契约命名语义 × 消费者数交叉一致（3.2.1 判别规则）—— 软（P2 漂移信号）」→ 直接取 P2（MJ-4 判据；与 CTR-003-AP1 的命令侧同级）
      - pattern_id: CTR-004-AP2
        description: "事件契约以 published 发布而缺 version 或 compat_policy（演化策略未登记）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ [C 登记为事件契约] ∧ [lifecycle_state = published] ∧ ¬(has(version) ∧ has(compat_policy))"
        signal_level: P0               # X2 明文「∀C(lifecycle_state=published): has(version) ∧ has(compat_policy) —— 硬」；3.2.1 定义列将演化策略列为构成项 → P0（MJ-4 判据）
      - pattern_id: CTR-004-AP3
        description: "已发布事件契约做非 additive-only 变更而未走破坏性变更流程（无弃用窗口）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ [C 登记为事件契约] ∧ [breaking_change(C, v1, v2)] ∧ ¬[deprecation_window(C, v1, until)]"
        signal_level: P1               # X3 为条件硬（硬化与否由 0.4 证据门槛统一判定，3.5 尾注：与方面 2 的 W3 同型）→ 未按 P0 登记；级别待 W3/X3 条件硬裁决口（s5h 既有）落定后复核（MJ-4 判据）
    formal_anchor:
      - {property_id: X1, role: implements}      # 编舞式协调的事件契约经本形态登记 → ∀ interaction ∈ connects: ∃C: [covers(C,u1,u2)] 得证（3.4 接收约束方面 5 行：X1 的协调域实例）
      - {property_id: X7, role: implements}      # 事件契约命名语义 × 消费者数交叉一致（3.2.1 判别规则的事件侧：事实语义 → 一对多消费者）→ 本条是 X7 的判定对象载体
      - {property_id: X2, role: consumed_by}     # 发布态须 has(version) ∧ has(compat_policy)；版本化默认值＝additive-only + schema registry（3.2.2）
    references:
      - {bib_id: 31, support_claim: "3.2.1 事件信封元数据规范（母本 3.7 书目 31 行级登记提取面逐字对应；提取以本地副本《CloudEvents Specification v1.0.2 (CNCF, 2022)》PDF+EPUB 为准，由官方仓库 tag v1.0.2 的 cloudevents/spec.md 转换生成，Apache-2.0，发布日期据包内 misc/RELEASE_NOTES 并与 GitHub tag 交叉确认）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：一方发布、多方响应 → 发布方与消费方在时间与拓扑上双重解耦，新增消费方无需发布方改动（additive-only 下新增可选字段即可扩展）；机器层天然性为『高』（3.2.1），schema 与事件信封直接投影为白板谓词（3.4 施→10 硬）；版本化与兼容性均有注册表默认值（additive-only + schema registry／backward），选型不必逐项重议（3.2.2 表头『默认值（注册表登记，可覆盖需 ADR）』）。代价：一对多消费者使 schema 变更触达面等于 consumer_set 基数且随订阅方增加单调不减；破坏性变更被 3.2.2 明定为高影响决策（完整 ADR + 批准 + 弃用窗口 + 迁移支持）→ 逆转成本 costly；事件信封与演化策略任一缺项即使跨消费方因果追踪与兼容性判定同时失效；命名语义与消费者数的错配只能靠 X7 的交叉验证捕获，且母本将其定为 P2 漂移信号而非硬性质 → 守护面须常驻；事件 schema 演化测试在事件驱动风格下为必备（3.4 施→8），验证成本先于收益发生。"
      typical_scenarios: "事件驱动风格下多方响应同一业务事实的场合（3.2.1 适用条件列）；命名含事实语义、消费者为一对多的场合（同节判别规则：OrderCreated 型）；事件驱动风格下『异步消息/事件契约必选其一』取事件侧的场合（3.4 接收约束方面 1 行）；编舞式协调（choreographed）中参与者以事件而非命令衔接的场合（3.4 接收约束方面 5 行；CRD 批承载协调形态）；需以 additive-only 长期演化、消费者异构且变更节奏不一的场合（3.2.2 版本化策略＋3.3 交付空间驱动第一行）。"
      common_misuse: "以祈使语义命名事件或把一对一消费者的命令登记为事件（AP1，X7 漂移信号；命令侧归属 CTR-003）；未登记演化策略与兼容策略即发布（AP2，X2 硬违例）；对已发布事件删改既有字段而不走弃用窗口（AP3，X3 条件硬）；以 backward 兼容默认值冒充一致性承诺（一致性属方面 4 的 Y 系列）；事件信封缺项即上线（3.2.1 定义列构成项）；把事件信封规范当作可自选的私有格式（书目 31 的 CloudEvents 类规范是 3.2.1 定义列的提取源，改用私有格式须 ADR 覆盖默认值）；用文档二次维护事件 schema（3.4 施→10 硬：禁止双重维护）。"

  - entry_id: CTR-005
    kind: CTR
    name: "数据契约"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-CTR-01）
    provenance:
      origin: hybrid                   # 骨架=3.2.1 表行（定义列五项语义条款）＋3.2.3 共享数据四条件（X6 的判定面）＋谓词转写（manual）
