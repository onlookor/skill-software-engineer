    applicability:
      problem_space:                   # 骨架源：3.2.1「适用条件」列＋3.2.1 判别规则
        - "事件驱动风格；多方响应同一业务事实（3.2.1 适用条件列逐字）"
        - "命名含事实语义（OrderCreated）→ 事件，一对多消费者，走事件契约（3.2.1 判别规则逐字；防『PleaseDoX 事件』反模式，呼应 1.2.3）"
        - "领域事件 = 已发生业务事实的陈述（过去时态命名）（3.2.1 定义列逐字）→ 尚未发生意图的交互不属本形态问题空间"
      current_space:                   # 骨架源：3.3 现状空间驱动
        - "既有事件流与已发布 schema 是最强约束源：逆向勘察以流量观测 + 消费者代码分析为准，文档仅作线索（3.3 现状空间驱动第二行；公理 A1 在契约域的具体化）"
        - "现状契约清单须包含演化策略的登记态与事件信封的实际取值面——演化策略未登记即为隐式契约（3.2.1 定义列将『演化策略』与『事件信封』并列为构成项）"
      delivery_space:                  # 骨架源：3.3 交付空间驱动＋3.2.2 默认值列
