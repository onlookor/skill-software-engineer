      consistency_impact: "共享知识库为多写者：知识源并发写入的隔离级别与冲突消解不由本风格默认提供，须由方面 4 显式决定"   # 人工判断
      observability_requires: ["黑板状态变迁历史可回放（非确定控制流的唯一可诊断面）", "知识源触发条件与其写入项可关联追踪"]
      ops_cost: "[无独立运维面；成本落在状态回放设施与触发条件治理]"
      skill_prerequisites: ["黑板 schema 设计（结构化约束）", "机会主义控制的调试方法（状态回放与触发条件推理）"]
      aggregation_semantics: itemwise
    compatibility: []                  # 母本对本行无叠加声明、1.2.5 无涉本风格的冲突行；@1342 附注是自我对应限定措辞（框架自身用黑板 ≠ 目标系统绑定黑板），属叙事层而非条目间关系 → 不登记为 compatibility（MJ-6）
    constraints_imposed:
      - {target_aspect: 2, constraint: "风格收窄分解策略可行集：分解单元为知识源，其职责须以黑板 schema 的读写项表达（不得以隐式协议表达）", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）；追踪覆盖率上界受非确定控制流约束，方面 6 目标须落在该上界内", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集；人类层：投影视图必须表达所选风格（黑板/知识源/控制三区须可辨，控制流非确定性须显式标注）", level: hard}
    anti_patterns:                     # 骨架源：1.2.1「典型反模式」列（本行两项，不增补）
      - pattern_id: STY-011-AP1
        description: "黑板变成无结构的垃圾场（写入项无 schema 声明）"
        detection_predicate: "∃ bb, w: [bb 为已声明黑板] ∧ [w 为对 bb 的写入项] ∧ [w 无 schema 声明]"
        signal_level: P1               # 结构漂移限期整改（0.14 P1）：schema 缺失使「新增知识源 touched_units(既有)=0」的上界失效
        # M4 修正（MJ-12）：原书写 ¬declared(schema(w))。schema 在母本为契约工件名（3.2.1「schema + 语义条款」等），
        # 非 x.5 登记谓词名 → 本地造词，改方括号事实占位，缺口登记 VG-04。
      - pattern_id: STY-011-AP2
        description: "知识源间隐式协议（未经黑板 schema 声明的相互假设）"
        detection_predicate: "∃ ks1, ks2: [ks1, ks2 为知识源] ∧ [ks2 的触发条件或读取语义假设 ks1 的写入内容] ∧ ¬declared(该假设于黑板 schema) ∧ depends_on(ks2, ks1, data, ·)"
        signal_level: P1               # 人工判断（MJ-6）：1.2.5 无黑板冲突行、1.5 V 系列无对应硬性质 → 不满足 MJ-4 的 P0 判据；定 P1 限期整改（隐式协议使知识源不再可独立增删）
    formal_anchor:
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 1, support_claim: "黑板风格的词汇与定义（母本登记：1.2.1 抽象结构风格词汇表含分层、管道-过滤器、黑板、微内核、Broker）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：知识源可机会主义增删而无需改动既有知识源（灵活性↑ 的落点 = 变更触达面收敛到 1 个单元 + schema 登记）；代价：控制流由黑板状态驱动而非确定序列，可预测性与可调试性同时下降，追踪覆盖率存在结构性上界，缺陷复现依赖状态回放设施。母本据此把黑板限定在『无确定解法序列』的问题域。"
      typical_scenarios: "启发式求解（语音识别、图像理解、规划搜索类）、多专家协同且专家贡献顺序不可预先固定、多 Agent 协同系统（母本明示为当代实例）。"
      common_misuse: "以框架自身使用黑板（0.7 共享白板）为由跳过方面 1 候选分析与批准——母本附注明示**结构等价不构成实现绑定**，且 0.7 的三层区分（设计时存储／框架运行层协同／目标系统运行时架构）不得混用；把黑板当无 schema 的共享内存倾倒数据（AP1）；知识源之间私下约定字段语义（AP2）；在解法序列确定的系统使用黑板（非确定控制流的代价无对应收益）。"

  - entry_id: STY-012
    kind: STY
    name: MVC 及变体（MVP/MVVM）
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.1-MVC 及变体（MVP/MVVM）", verified: true}
        - {source_type: clause_id, value: "1.2.1", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
    typical_reversibility: bounded     # 人工判断：三分结构的重排限于表现侧（领域层不被触达），可在界面层内增量执行；AP1 成立时退化为 costly
    applicability:
      problem_space:                   # 骨架源：1.2.1「适用条件（摘要）」列
        - "[存在交互式界面]"
        - "[表现逻辑与领域逻辑的变更率不同]"
      current_space: []                # 母本本行未给现状空间条件（G-STY-1）
      delivery_space: []
    envelope:                          # 骨架源：「表现层可替换性↑」
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "表现层替换 → touched_units = |表现层单元|，且 touched_units(领域) = 0（表现-领域-交互三分 + 单向数据流）；领域逻辑渗入控制器/视图时该上界失效（见 STY-012-AP1）"
        source: {source_type: row_id, value: "1.2.1-MVC 及变体（MVP/MVVM）", verified: true}
    cost_profile:
      latency_budget_delta: "+ 每次交互一次表现↔领域转发（控制器/Presenter/ViewModel 分派）；参数：交互事件数与绑定机制（直接调用/数据绑定）"
      failure_modes: ["领域逻辑渗入控制器/视图（三分边界失守）", "变体（MVC/MVP/MVVM）混用导致数据流方向不一致（单向数据流约束失守）"]   # 第一项骨架源 1.2.1 反模式列；第二项人工判断（母本将三变体并列于同一行且定义含「单向数据流」）
      consistency_impact: "无直接影响：一致性级别由方面 4 决定；本风格只约束表现-领域-交互的职责与数据流方向"   # 人工判断
      observability_requires: ["表现↔领域调用可追踪（区分表现层缺陷与领域缺陷）"]
      ops_cost: "[无独立运维面；成本落在表现层构建与前端交付管道]"
      skill_prerequisites: ["表现-领域边界划分", "所选变体（MVC/MVP/MVVM）的数据流约定"]
      aggregation_semantics: itemwise
    compatibility: []                  # 母本对本行无叠加声明、1.2.5 无涉本风格的冲突行；MJ-5/MJ-9 同 STY-010
    constraints_imposed:
      - {target_aspect: 2, constraint: "风格收窄分解策略可行集：表现/领域/交互为三类分解单元，领域规则不得以表现单元为承载", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集；人类层：投影视图必须表达所选风格（须标明采用的变体与数据流方向）", level: hard}
    anti_patterns:                     # 骨架源：1.2.1「典型反模式」列（本行一项，不增补）
      - pattern_id: STY-012-AP1
        description: "领域逻辑渗入控制器/视图"
        detection_predicate: "∃ c, d: ([c 为控制器单元] ∨ [c 为视图单元] ∨ [c 为 ViewModel/Presenter 单元]) ∧ responsibility(c, d) ∧ [d 为领域规则]"
        signal_level: P1               # 结构漂移限期整改（0.14 P1）：使「表现层替换 → touched_units(领域)=0」的上界失效
    formal_anchor:
      - {property_id: V1, role: implements}     # 人工判断：「单向数据流」即依赖方向约束，可经 layer_of（表现/领域/交互三区）+ dependency_rule 登记 → V1 校验面
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references: []                     # 无合法提取源：书目 1 的登记提取面为 1.2.1 词汇表（分层、管道-过滤器、黑板、微内核、Broker），不含 MVC；书目 2 的登记提取面为「风格对比与架构决策方法」，未登记 MVC 章节。M6 禁止以不承载该主张的文献充当出处 → 留空并登记勘察义务（gaps: G-STY-3）
    narrative:
      benefit_cost_analysis: "收益：表现层可替换（触达面收敛到表现单元，领域零触达），交互式界面与领域逻辑的变更率差异被结构吸收；代价：三分带来每次交互一次转发，且变体（MVC/MVP/MVVM）的数据流约定不同——混用即失去『单向数据流』这一使上界成立的前提。母本把三个变体登记在同一行，故选用哪一个变体须显式记录（约束 10 的投影要求）。"
      typical_scenarios: "交互式界面系统（Web/桌面/移动前端）、表现逻辑与领域逻辑变更率差异明显的系统、需要以表现层为单位替换技术栈（如框架升级）的场景。"
      common_misuse: "在控制器/视图内直接实现领域规则（AP1）；同一系统混用 MVC 与 MVVM 而不声明数据流方向；把 MVC 当作分层（STY-007）的同义词——三分是交互职责结构，分层是抽象层级结构，二者可并存但不可互替（人工判断）。"

  - entry_id: STY-013
    kind: STY
    name: 管道-过滤器
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.1-管道-过滤器", verified: true}
        - {source_type: clause_id, value: "1.2.1", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "1", verified: true}
    typical_reversibility: costly      # 人工判断：改用其他结构须重排管道拓扑与全部过滤器间数据契约（过滤器接口即契约面）
    applicability:
      problem_space:                   # 骨架源：1.2.1「适用条件（摘要）」列 +「包络要点」列的不适用声明（否定式登记）
        - "[批处理、流处理、ETL（抽取-变换-装载）或编译器类系统]"
        - "[各步可独立变换]"
        - "¬[交互式响应为必需]（母本明示：不适合交互式系统）"
        - "¬[强共享状态为必需]（母本明示：不适合强共享状态系统）"
      current_space: []                # 母本本行未给现状空间条件（G-STY-1）
      delivery_space: []
    envelope:                          # 骨架源：「可重用性↑、可并行↑」；「可重用性」映射可修改性族、「可并行」映射可伸缩性族（G-ENV-1）
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "单步变换替换 → touched_units = 1（该过滤器），且 touched_units(其余过滤器) = 0（过滤器无状态、仅经声明的数据流交互）；前提：过滤器间无隐式共享状态——AP1 成立时该上界失效"
        source: {source_type: row_id, value: "1.2.1-管道-过滤器", verified: true}
      - metric: "可伸缩性：单位资源增量带来的容量增量"
        bound_expr: "capacity(r + Δr) − capacity(r) ∝ |可并行的过滤器段|（「可并行↑」的参数化形态：并行度上界 = 管道图中可并行段数）；串行依赖段不随 Δr 增长"
        source: {source_type: row_id, value: "1.2.1-管道-过滤器", verified: true}
    cost_profile:
      latency_budget_delta: "P99 = Σ_{f ∈ 串行段} latency(f) + Σ 缓冲/传输项；并行段取 max_{f ∈ 段} latency(f) 而非 Σ（参数：过滤器数、并行度、缓冲策略）"
      failure_modes: ["过滤器间隐式共享状态（无状态假设失守 → 可替换性与并行度两个上界同时失效）", "管道内全局错误处理缺失（单步失败无统一处置路径）", "批处理边界处的部分失败与重跑语义未定义"]   # 前两项骨架源 1.2.1 反模式列；第三项人工判断
      consistency_impact: "无共享状态为默认；跨步骤的数据一致性由管道的事务/重跑边界决定，属方面 4 输入"   # 人工判断
      observability_requires: ["各过滤器输入/输出可采样（定位失败步骤的前提）", "步骤级错误、重试与丢弃量可观测"]
      ops_cost: "[无独立运维面；成本落在管道调度与批/流作业治理（重跑、补数、背压）]"
      skill_prerequisites: ["过滤器间数据契约设计（schema 与流式语义）", "管道级错误处理与重跑语义设计"]
      aggregation_semantics: itemwise
    compatibility: []                  # 母本对本行无叠加声明、1.2.5 无涉本风格的冲突行；MJ-5/MJ-9 同 STY-010。注：1.2.3 共享数据行「仅限批处理交接」与本行适用域相邻，但母本未登记为风格对 → 不入 compatibility（禁造规范）
    constraints_imposed:
      - {target_aspect: 2, constraint: "风格收窄分解策略可行集：分解单元为过滤器，须无状态且以数据契约（而非共享存储）交互", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）；并行度上界即伸缩性目标的可达性界", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集；人类层：投影视图必须表达所选风格（管道拓扑与过滤器边界须可辨）", level: hard}
    anti_patterns:                     # 骨架源：1.2.1「典型反模式」列（本行两项，不增补）
      - pattern_id: STY-013-AP1
        description: "过滤器间隐式共享状态"
        detection_predicate: "∃ f1, f2: [f1, f2 为管道内过滤器] ∧ depends_on(f1, f2, data, ·) ∧ ¬[该数据经声明的管道数据流传递]"
        signal_level: P1               # 人工判断：违反「无状态变换单元」的定义性约束；1.2.5 无本风格冲突行 → 不满足 MJ-4 的 P0 判据。若在 dependency_rule 登记「过滤器间禁止旁路数据依赖」，则构成 V1 违例直接来源，升 P0（登记义务见 gaps: G-STY-4）
      - pattern_id: STY-013-AP2
        description: "管道内全局错误处理缺失"
        detection_predicate: "∃ pipe: [pipe 为已声明管道] ∧ [pipe 无全局错误处理声明] ∧ ∃ f: [f ∈ pipe] ∧ [f 的失败无处置路径（重试/跳过/中止/死信）]"
        signal_level: P1               # 结构漂移限期整改（0.14 P1）：缺失处置路径直接影响可用性族指标（MTTR）
        # M4 修正（MJ-12）：原书写 ¬declared(error_handling(pipe))。error_handling 非 x.5 登记谓词名（母本 1.2.1
        # 管道-过滤器行仅以自然语言给出「管道内全局错误处理缺失」这一反模式名）→ 本地造词，改方括号事实占位，VG-04。
    formal_anchor:
      - {property_id: V1, role: implements}     # 过滤器间依赖规则可经 dependency_rule 登记（条件性，见 STY-013-AP1 注）
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 1, support_claim: "管道-过滤器风格的词汇与定义（母本登记：1.2.1 抽象结构风格词汇表含分层、管道-过滤器、黑板、微内核、Broker）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：过滤器可独立替换与重用（变更触达面收敛到单个过滤器），无状态假设使可并行段的容量随资源增量线性增长；代价：母本明示不适合交互式与强共享状态系统——批处理/流处理形态下延迟为各串行段之和，且管道级错误处理与重跑语义是必须显式设计的额外面。"
      typical_scenarios: "ETL（抽取-变换-装载）与批处理作业、流处理管道、编译器与代码转换类系统、各步可独立变换且步间以数据契约交互的处理链。"
      common_misuse: "在交互式请求路径上使用管道-过滤器（母本明示不适用）；过滤器经全局变量/共享表传递中间结果（AP1，同时摧毁可替换性与并行度）；只做步骤串接而不设计管道级错误处置（AP2）；以共享数据库作为步间交接手段而未走方面 3 的共享数据适用条件（1.2.3 共享数据行）。"

  # ══════════ 子维度二：部署/运行单元风格（1.2.2）→ STY-014…STY-019 ══════════
  # 通用说明一：1.2.2 表列名为「适用条件（摘要）」，未区分三空间；除微服务行自带
  #   「多团队（交付空间硬过滤器，见 1.3）」标注外，其余行按 1.3 三空间定义归类（归类为人工判断），
  #   无据者留空（禁臆造）→ gaps: G-STY-1 勘察义务。
  # 通用说明二：1.2.2 表无「施加约束」列 → 本块 constraints_imposed 经 1.4 施加表提取；
  #   1.4 表未给本风格实例的行只登记通用行（6/10），实例化措辞为人工判断 → gaps: G-STY-2。
  # 通用说明三：子维度内取值互斥（一个 scope 在 1.2.2 表内至多取一行）→ 不逐对登记互斥（MJ-5）。
