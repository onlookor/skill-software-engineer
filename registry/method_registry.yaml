        source: {source_type: clause_id, value: "6.2.1", verified: true}
      - metric: "性能：延迟分位数（P50/P99，P99 = 延迟分布第 99 百分位数）"
        bound_expr: "端到端延迟增量 = 网络往返 + broker 驻留 + 编解码 → 随队列深度单调不减；本形态不承诺即时结果（3.2.1 适用条件列的反面）→ 需即时结果的交互不得以本形态承载，P99 上界须由方面 6 目标值给定（3.4 接收约束方面 6 行）"
        source: {source_type: clause_id, value: "3.4", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数、跨边界契约变更数）"
        bound_expr: "schema 变更触达的消费者数 上界 = consumer_set 基数（命令类交互默认 = 1，3.2.1 判别规则）；> 1 即本形态被当作事件契约使用 → X7 交叉一致性检查可捕获（命名模式 × 消费者数）"
        source: {source_type: clause_id, value: "3.5", verified: true}
    cost_profile:
      latency_budget_delta: "引入 broker 驻留项（异步解耦的代价）：调用方不等待结果 → 单跳延迟预算由『往返』改为『投递 + 驻留 + 消费』三段；需即时结果的场合本项不可接受（3.2.1 适用条件列）"
      failure_modes: ["命令类交互以事件契约承载（祈使语义命名 + 一对多消费者 → 3.2.1 判别规则违例，X7 可捕获）", "消息元数据约定缺项（无消息 ID/时间戳/关联 ID/投递语义声明 → 3.2.1 定义列构成项缺失，幂等与因果追踪无从判定）", "投递语义未声明即假定恰好一次（3.2.1 定义列明文要求『投递语义声明』；方面 5 的 delivery_semantics/idempotency 谓词失去输入）", "协调模式产生的命令契约未登记（3.4 接收约束方面 5 行硬 → X1 违例，Z1 的契约来源缺失）"]
      consistency_impact: "异步解耦使读写方不再『必须同时成功』→ 与 3.2.3 条件 3 相容；一致性级别由方面 4 的 Y 系列判定（CSL 批承载），补偿语义由方面 5 的 Saga/补偿谓词承载（CRD 批）；本条只登记消息元数据与投递语义声明面，不重复登记一致性代价项"
      observability_requires: ["消息 ID 与关联 ID 在消息元数据中可查（3.2.1 定义列）", "投递语义声明在契约注册表可查（同列；方面 5 的 delivery_semantics 输入）", "追踪覆盖率可观测（6.2.1 可观测性族度量方式：基础设施勘察）", "契约漂移检测规则参数已按 0.13 注册（3.4 施→9 硬）"]
      ops_cost: "[broker 与 schema registry（事件/消息）的运维面（3.2.2 发现与注册）→ 运维项随消息主题数上升；母本未给单位运维成本 → 方括号占位（MJ-20 (iii) 同型）]"
      skill_prerequisites: ["消息 schema 设计与元数据约定（3.2.1 定义列）", "命令/事件判别与命名语义（3.2.1 判别规则；呼应 1.2.3）", "投递语义与幂等设计（方面 5 的 delivery_semantics/idempotency 谓词面）", "CDC 套件脚手架生成（3.3 双使用者条款：Agent 自主项）"]
      aggregation_semantics: itemwise  # 母本未给 CTR 的跨契约聚合式（MJ-19 (iii) 同型）→ 代价按消息契约逐项评估（MJ-21 (ix)）
    compatibility:
      - peer_entry: STY-002
        relation: requires
        evidence: {source_type: row_id, value: "3.2.1-异步消息契约", verified: true}   # 适用条件列明文「异步消息风格；命令类交互」＝STY-002 异步消息；本侧登记 requires 与母本方向一致（3.4 接收约束方面 1 行的接收端）→ ENUM_RELATION 无 required_by 且 STY-002 属已批准条目，对侧不回填（MJ-21 (viii)）
      - peer_entry: STY-003
        relation: composable
        evidence: {source_type: clause_id, value: "3.4", verified: true}   # 接收约束方面 1 行明文「事件驱动 → 异步消息/事件契约必选其一」（析取要求：系统层面至少取其一，可并存）
      - peer_entry: CTR-004
        relation: composable
        evidence: {source_type: clause_id, value: "3.4", verified: true}   # 同一行「必选其一」→ 两形态可在同一系统内并存；但同一条交互只能归属其一（3.2.1 判别规则：祈使语义 → 命令走本条，事实语义 → 事件走 CTR-004）→ composable 指系统层面并存、非同一交互叠用（镜像登记于 CTR-004）
    constraints_imposed:               # 交叉表源：3.4「施加约束」表（方面 3 全体六行，CTR 十二条逐字相同）
      - {target_aspect: 2, constraint: "已发布契约的边界冻结——分解不得切割既有契约（切割需求 → 走弃用窗口 + 绞杀者迁移）", level: hard}
      - {target_aspect: 4, constraint: "数据契约的 schema 与语义条款是数据流动的唯一合法路径定义", level: hard}
      - {target_aspect: 5, constraint: "协调模式中的每条跨单元交互必须有注册契约（Z1 的契约来源）", level: hard}
      - {target_aspect: 8, constraint: "契约测试是验证计划的组成部分；微服务风格 → CDC 必备；事件驱动 → 事件 schema 演化测试必备", level: conditional}   # 级别列原文「软/硬按风格」→ 本条为命令类异步形态：契约测试取硬，微服务风格下 CDC 升硬（X4）；事件 schema 演化项属 CTR-004 面（MJ-4 同型判读；MJ-21 (x)）
      - {target_aspect: 9, constraint: "契约漂移（运行时实际流量与注册契约的偏离）是守护对象；漂移检测规则参数按 0.13 注册", level: hard}
      - {target_aspect: 10, constraint: "契约是机器层的天然工件：IDL/schema/OpenAPI 文档直接投影为白板谓词，禁止双重维护（0.9 同源生成原则在契约域最强适用）", level: hard}
    anti_patterns:
      - pattern_id: CTR-003-AP1
        description: "命令类交互以事件契约承载（『PleaseDoX 事件』反模式）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ [C 的命名含祈使语义] ∧ [consumer_set 基数 = 1] ∧ ¬[C 登记为异步消息契约]"
        signal_level: P2               # X7 明文「事件契约命名语义 × 消费者数交叉一致 —— 软（P2 漂移信号）」；3.2.1 判别规则明示『判别错误属登记违例，一致性回归检查可捕获』→ P2（MJ-4 判据）
      - pattern_id: CTR-003-AP2
        description: "消息元数据约定缺项（消息 ID/时间戳/关联 ID/投递语义声明任一缺失）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ [C 登记为异步消息契约] ∧ ¬[消息 ID ∧ 时间戳 ∧ 关联 ID ∧ 投递语义声明四项齐备]"
        signal_level: P1               # 违反 3.2.1 定义列的构成项要求（定义性），致方面 5 的 delivery_semantics/idempotency 谓词失去输入，但无 X 系列硬性质直接绑定 → P1（MJ-4 判据）
    formal_anchor:
