      benefit_cost_analysis: "收益：单元边界直接使用业务语言（2.2.1 定义列「比 S1 更贴业务语言」），与业务方书面目标（6.2.1 四类合法出处之一）天然对齐，目标值出处门槛易过；粒度可粗可细使其能适配不同成熟度的能力地图。代价：定义列的「粒度可粗可细」同时是最大风险源——无内建收敛机制，只能靠 2.2.3 停止准则（W2 硬 / W3 条件硬 / W6 软）兜住，粒度失当时 W6 只给 tech_debt_flag（软）而不阻塞；能力项不是数据所有权边界，与 W4 的冲突须以 S4 复核（2.6 示例四）；能力项间的包含关系不能替代显式编排，否则违 2.4 施→5 与 Z1（硬）；能力项归属在 2.5 的 boundary_type 实参取值面未枚举，机器层表达须方括号占位（MJ-20 (iii)）。"
      typical_scenarios: "领域复杂度高且需与业务方语言对齐的分解（2.3 问题空间驱动第一行：S1/S3 主导）；业务能力地图已在案的场合；与 S1 组合时须显式声明能力项与限界上下文的映射（2.6 示例四）；与 S4 组合处理数据归属冲突（2.6 示例四）；粒度争议须以 2.2.3 准则三裁决的场合。"
      common_misuse: "以能力项包含关系替代能力编排（AP1，Z1 违例）；粒度不一致即切分而不跑 2.2.3 停止准则（AP2，W1 违例）；把能力项当作数据所有者（W4 违例，2.4 施→4）；以能力语言绕过 2.2.2 语义边界判据（判据横切所有策略）；能力项与限界上下文的映射不显式（与 S1 组合时产出双重边界，2.6 示例四）。"

