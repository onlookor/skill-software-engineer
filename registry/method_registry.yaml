    typical_reversibility: costly      # 人工判断：引擎更换须数据迁移 + 访问层改写；4.6 示例三的 CH-B 保守界「repository 参数化存储访问」正是为压低此项而设（参数化后降为 bounded，未参数化则趋近 irreversible）
    applicability:
      problem_space:                   # 骨架源：4.2.2 第三列「无负载证据时不得选用（见 4.6 示例三）」的许可形态
        - "[存在负载与访问模式证据（4.2.2 第三列「无负载证据时不得选用」；4.6 示例三可推翻指标「任一类查询的实测 P99 超过注册表登记阈值，且访问模式勘察证实关系模型错配」）]"
      current_space:                   # 交叉表源：4.3 现状空间驱动「存储引擎锁定」
        - "[所选引擎的运维知识在组织内既有（4.3 现状空间驱动：存储引擎锁定 → 迁移与集成可行性）]"
      delivery_space:                  # 交叉表源：4.2.2 第三列「交付空间运维能力是硬过滤器（同 1.3 逻辑）」＋4.6 示例三消费字段
        - "每种引擎的运维能力已在交付空间登记（4.2.2 第三列：每增加一种引擎 = 运维面扩大；硬过滤器）"
        - "[专职 DBA 或等价能力在案（4.6 示例三消费字段 candidate.applicability.delivery_space[DBA]＝假 → 硬过滤器违例；拒绝理由：多语运维面对无专职 DBA 的交付空间是硬过滤器违例）]"
    envelope:                          # 骨架源：4.2.2 第二列「按访问模式选存储引擎（关系/文档/KV/图/时序）」＋第三列「每增加一种引擎 = 运维面扩大」
      - metric: "延迟分位数 P99"
        bound_expr: "∀ q ∈ query_classes: P99_measured(q) ≤ P99_registered(q)：逐查询类的实测分位数不得超过注册表登记阈值（4.6 示例三消费字段「STP/R 阈值注册表（P99）」；越界即可推翻指标的触发面）"
        source: {source_type: row_id, value: "4.2.2-多语言持久化", verified: true}
      - metric: "性能：资源占用"
        bound_expr: "运维面(engine_set) 随 |engine_set| 单调不减：每增加一种引擎 = 运维面扩大（4.2.2 第三列原文）→ 资源占用与治理成本的下界随引擎数上升"
        source: {source_type: row_id, value: "4.2.2-多语言持久化", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "触达单元数(Δ 存储引擎) ≤ |{u : u 直依该引擎原生接口}|：访问层参数化（4.6 示例三 CH-B 保守界「repository 参数化存储访问」）把上界压到抽象层内；未参数化时上界为全部直依单元"
        source: {source_type: row_id, value: "4.2.2-多语言持久化", verified: true}
    cost_profile:
      latency_budget_delta: "Δlatency(逐查询类) 的符号按访问模式匹配度而定：引擎与访问模式匹配 → ≤ 0（相对通用关系库的节约）；错配 → ≥ 0。母本未给数值、且符号方向依赖实例实测 → 只登记判定面（逐查询类实测 P99 对照注册表阈值）与符号的条件性，不填无出处数字（0.4；4.6 示例三可推翻指标同旨）"
      failure_modes: ["无负载证据的引擎选型（4.2.2 第三列「不得选用」；4.6 示例三定性为公理 A2 违例）", "引擎数超出交付空间运维能力 → 硬过滤器违例（同 4.6 示例三拒绝理由）", "存储访问未参数化 → 引擎固化进业务代码，回退成本趋近不可逆", "跨引擎事务无本地事务可得 → 一致性协调成本外溢到方面 5", "多引擎的监控、备份、升级与容量治理面各自独立 → 运维成本随引擎数线性累积", "访问模式勘察缺口未登记即选型（4.6 示例三消费字段「访问模式勘察缺口登记」）"]
      consistency_impact: "各引擎的一致性能力不同 → 一致性级别不可全局默认，须逐数据集合显式声明（4.2.3 开头句；Y3「未声明 = 违例」）；跨引擎写无本地事务可得 → 一律下沉为补偿一致（4.2.3 末行；Y6），且 4.2.4 尾注的 Y4 自洽性检查在本拓扑下最易触发（引擎组合与风格不匹配 = 过度工程信号，软性标记评审）"
      observability_requires: ["逐查询类的实测 P99 可采集并对照注册表阈值（4.6 示例三消费字段）", "引擎集合清单与各引擎运维责任方可查", "跨引擎数据流血缘可追（4.2.5 数据血缘；Y7 重建面）"]
      ops_cost: "[随引擎数线性累积且为四行中最高之一：每种引擎独立的备份、升级、容量、监控与专家知识（4.2.2 第三列「每增加一种引擎 = 运维面扩大」）；4.6 示例三据此把交付空间运维能力列为硬过滤器]"   # 18-B S5 保守界消费字段
      skill_prerequisites: ["访问模式勘察与查询类划分（4.6 示例三可推翻指标的前提）", "repository 抽象层的参数化设计（4.6 示例三 CH-B 保守界）", "逐引擎的一致性能力评估与级别声明（4.2.3；Y3）", "P99 阈值注册表的建立与维护（4.6 示例三消费字段）"]
      aggregation_semantics: itemwise
    compatibility: []                  # 4.2.2 本行第三列只给「同 1.3 逻辑」的交付空间硬过滤器与「见 4.6 示例三」的证据门槛，未给任何风格对；1.2.5 硬冲突清单无本 kind 行；4.2.2 表内取值互斥不枚举 → 按 MJ-5／MJ-9 不登记（跨 kind 无母本明文依据不扩张）
    constraints_imposed:               # 交叉表源：4.4「施加约束」表（方面 4 全体七行，与 OWN/CSL 批逐字相同）
      - {target_aspect: 2, constraint: "数据归属现状回馈分解：现状数据不可干净归属时，S4 策略受约束、拆分序列须按数据迁移可行性排序", level: soft}
      - {target_aspect: 3, constraint: "数据契约的 schema 与语义条款（单位/值域/空值/敏感性/新鲜度）由本方面供给", level: hard}
      - {target_aspect: 5, constraint: "一致性模型 → 协调模式可行集：跨所有者强一致需求 → Saga + 业务补偿，或回溯方面 1 重审部署风格（Y6 的下游消费路径）", level: hard}
      - {target_aspect: 6, constraint: "一致性级别声明与新鲜度条款 → 质量判定的代价计入项", level: soft}
      - {target_aspect: 8, constraint: "不变式 → 对账验证项；血缘 → 派生数据可重建性测试；边界校验 → 契约测试的数据面", level: soft}
      - {target_aspect: 9, constraint: "数据漂移守护对象：schema 漂移（实际 schema 偏离注册契约）、所有权违例（绕过所有者的直写流量）、共享写例外超期", level: hard}
      - {target_aspect: 10, constraint: "机器层：Y 谓词集 + 血缘图；人类层：覆盖谓词子集 {Y 谓词集、血缘} 的投影视图（受众问题 = 数据所有权与流动；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: STP-004-AP1
        description: "无负载证据的多语选型（以技术偏好替代访问模式勘察）"
        detection_predicate: "∃ E: [E 为本实例选用的存储引擎] ∧ ¬[存在 E 对应查询类的实测负载证据] ∧ ¬has_approved_exception(·, ·, ·)"
        signal_level: P0               # 4.2.2 第三列明文「无负载证据时不得选用（见 4.6 示例三）」→ MJ-4「不得」= hard；示例三拒绝理由定性为公理 A2 违例（决策无实测依据）→ P0
      - pattern_id: STP-004-AP2
        description: "引擎集合超出交付空间登记的运维能力"
        detection_predicate: "∃ S: [S 为本实例的存储引擎集合] ∧ [|S| 超出交付空间登记的运维能力面] ∧ ¬has_approved_exception(·, ·, ·)"
        signal_level: P0               # 4.2.2 第三列「交付空间运维能力是硬过滤器（同 1.3 逻辑）」＋4.6 示例三拒绝理由（多语运维面对无专职 DBA 的交付空间是硬过滤器违例）→ 硬过滤器违例即阻塞，P0（MJ-4 判据）
      - pattern_id: STP-004-AP3
        description: "存储访问层未参数化（引擎选择固化进业务代码）"
        detection_predicate: "∃ u, E: [u 为部署单元] ∧ [u 直依 E 的原生查询接口] ∧ ¬[存储访问经 repository 抽象参数化]"
        signal_level: P2               # 4.6 示例三 CH-B 保守界「repository 参数化存储访问」是压低回退成本的手段，其缺失不构成 4.5 性质违例，而是可替换性下降的结构线索（须以直依单元数阈值 + 版本趋势双判据核定）→ P2（MJ-4 判据）
    formal_anchor:                     # 交叉表源：4.5 可验证性质 / 2.5 W 系列
      - {property_id: Y3, role: consumed_by}    # 各引擎一致性能力不同 → 级别不可全局默认，Y3「未声明 = 违例」在本拓扑最强适用（4.2.3 开头句）
      - {property_id: Y4, role: consumed_by}    # 引擎组合与风格/流动机制的自洽性由 Y4 检查（4.2.4 尾注；4.5 级别列为软 → 软性标记评审）
      - {property_id: Y6, role: consumed_by}    # 跨引擎写无本地事务可得 → 跨所有者强一致冲突信号在本拓扑最易显形
    references:
      - bib_id: "38"                   # Martin Fowler. "Polyglot Persistence." martinfowler.com bliki, 2011 —— 4.7 书目 38 的登记面逐字为「4.2.2 多语言持久化及其适用纪律」（行级登记；本批启动前强制核查：本地 resources/se 在库、在线 URL 在位、年份与著录一致）
        support_claim: "按访问模式选择存储引擎（关系/文档/KV/图/时序）的多语言持久化原则及其适用纪律（4.2.2 第二列与第三列『无负载证据时不得选用』的外部文献支撑面）"
        compile_usage: metadata_extraction   # 4.7 表内该条 compile_usage 列原文；提取以原文存档为准，不以本注册表转述替代
        trust_grade: "[已核验]"
    narrative:
      benefit_cost_analysis: "收益：访问模式与存储引擎匹配时，单类查询的延迟/吞吐可显著优于通用关系库（4.2.2 第二列）；4.6 示例三给出的可推翻指标使『何时该多语』有可判定门槛而非技术偏好。代价：4.2.2 第三列明记『每增加一种引擎 = 运维面扩大』，运维成本随引擎数线性累积且为四行中最高之一；各引擎一致性能力不同 → 级别不可全局默认（Y3）；跨引擎写无本地事务可得 → 协调成本外溢到方面 5（Y6）；4.2.4 尾注的 Y4 自洽性检查在本拓扑最易触发（引擎组合与风格不匹配 = 过度工程信号）；引擎更换回退成本高，4.6 示例三因此把 repository 参数化列为 CH-B 保守界。无负载证据即选用被示例三定性为公理 A2 违例。"
      typical_scenarios: "存在实测负载与访问模式证据、证实关系模型错配的场合（4.2.2 第三列；4.6 示例三可推翻指标）；某类查询的实测 P99 超过注册表登记阈值后的引擎补选（同示例三消费字段『STP/R 阈值注册表（P99）』）；图/时序/KV 类访问模式与关系模型结构性不匹配的场合（4.2.2 第二列括号内五类）；交付空间已登记每种引擎运维能力与专职 DBA 的场合（4.6 示例三消费字段）；CH-B 保守界下先以单一关系库 + repository 参数化落地、待证据充分再增引擎的渐进场合（4.6 示例三）。"
      common_misuse: "无负载证据的多语选型（AP1，4.2.2 第三列『不得选用』；A2 违例）；引擎数超出交付空间运维能力而无批准例外（AP2，硬过滤器违例）；存储访问层未参数化即引入多引擎（AP3，回退成本趋近不可逆）；以『多语更先进』替代访问模式勘察（4.6 示例三拒绝理由）；跨引擎写仍假设本地事务可得（Y6）；不做逐数据集合的一致性级别声明（Y3『未声明 = 违例』）；访问模式勘察缺口不登记（4.6 示例三消费字段）；为逐查询类延迟增量填无出处数值（0.4 证据门槛＋6.2.1 量化纪律）。"

