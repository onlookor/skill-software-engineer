-28、人类裁决日 2026-10-04）的口径，按防扩宽条款 (ii) 不随本批外延至 RLP 七条；RLP 七条的豁免范围由本项独立承担，九项 scope 互不重叠。**专项口径**（全库实测计数；本项只覆盖 RLP 侧实例，既有引用面由各自批次的 Waiver 承担，不互相援引、不重复计息）：X1 全库 **15** 实例（CRD consumed_by 3＋CTR consumed_by 3/implements 4＋DEC consumed_by 3＋本项 RLP consumed_by 2）；Y1 全库 **10** 实例（OWN 3＋DEC 1＋CTR 1＋STP 3＋DFL implements 1＋本项 RLP consumed_by 1）；Z1 全库 **7** 实例（CRD implements 4＋DEC 1＋CTR 1＋本项 RLP 1）；Z2 全库 **8** 实例（CRD implements 2＋DFL 3＋本项 RLP implements 3）；Z3 全库 **6** 实例（CRD implements 4＋CSL 1＋本项 RLP 1）；Z4 全库 **7** 实例（CRD consumed_by 3＋本项 RLP implements 1/consumed_by 3，两批均按条件硬纳入各自 scope）。**Z5／Z7 专项口径据实记载**：Z5 全库 **3** 实例（CRD 2＋本项 RLP 1，两批均明列排除、从未被任何 Waiver 承担）；Z7 全库 **15** 实例（CRD consumed_by 8＋本项 RLP consumed_by 7，两批均明列排除、从未被任何 Waiver 承担）——此非遗漏，而系软性质与升级型性质不产生 E3 义务（WV-STP-E3-01 的 scope 已首次把该口径写明），本项延续该口径并把 Z5 1 实例与 Z7 7 实例一并明列排除，以免后续批次误读为『前批已覆盖』。"
