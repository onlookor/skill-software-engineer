    remediation_plan: "闭合路径同前六项：(1) project.py 自检全过（本批，见 ST-STP-01 evidence）→ (2) 编译器对 seed 条目执行『人工条目 vs 编译条目』重验证，差异按 0.17.6(3) 三分类处置 → (3) 建立 FVR 条目并为 W4／Y1／Y2／Y3／Y6 接线，首次全量运行留证（E3 的 first_full_run has evidence）→ (4) 逐条 seed→active（diff 为空 = 低影响简记；diff 非空按三分类分别定级）。本 Waiver 在 (3) 完成时闭合。本批特有前置：(a) **接线所依赖的母本 4.5 公式词面存在未登记词，须先经 R2 词汇批次核定**——实测（脚本比对 predicate_vocabulary.yaml 三节共 **76** 个已登记名：predicates 59＋formula_words 7＋clause_defined_predicates 10）：W4 公式只用 owned_by（@1717，已登记）→ 可机器求值；Y1 缺 has_approved（@2279；已登记形态为 has_approved_exception/3，母本公式用一元 has_approved(shared_write_exception(D))）；Y2 缺 provider（@2281）；Y3 缺 aspect6_target（@2284；同行的 level 系 consistency_level 的实参槽名 @2267，以槽名充当谓词属本地造词，VG-04 同型纪律）；Y6 整条公式无一登记谓词，缺 cross_owner_strong_consistency_requirement／conflict_signal／saga_candidate／reopen 四词（@2290；saga 已登记于 5.5，saga_candidate 未登记）。合计 **7 词**。**该 7 词系母本 4.5 公式自身的词汇缺口，与本批 detection_predicate 无关**：M4 只扫条目的 applicability 三空间与 anti_patterns.detection_predicate，不扫母本公式；而本批 detection_predicate 剥方括号后的调用词只有 access_path／data_lineage／dataset／has_approved_exception／owner／shared_write_exception 六词（全部已登记）→ 本批**零新增候选**，累计仍 19 词（MJ-19 (i) 4＋MJ-20 (iii) 7＋MJ-21 (v) 8）。故该 7 词不计入 19 词，但 (3) 的接线在词汇补齐前无法对 Y1／Y2／Y3／Y6 求值（W4 可先行）→ 归 R2 词汇批次（s5g）一并裁决，本批不扩词、不以本 Waiver 的批准为前提，词表与词数由该批次核定，本项不预设。(b) **Y3 接线须与 CSL 批共用同一 FVR 条目**——E3 要求 ∃ fvr_entry（一个性质一个条目），Y3 的既有面为 CSL 5 实例＋OWN 1 实例（分别由 WV-CSL-E3-01／WV-OWN-E3-01 承担豁免），本项 STP-003／STP-004 的 2 个 consumed_by 实例指向同一性质；且 STP-001 的 cost_profile.consistency_impact 明文『级别声明归方面 4 的 CSL 条目，本条目不重复声明级别』（注册表 @4707）、STP-003 同型（@4885）、STP-004 明文『一致性级别不可全局默认，须逐数据集合显式声明』（@4973）→ 接线面共享、豁免面各自计息，不得按批次重复建条目。(c) **references 空集与 G-STP-1／SO-10 不阻塞接线**——STP-001／STP-002 的 references 为空列表，其现时合法性出处为 2.3 与 0.17.7 门槛 6（禁以不承载主张的文献充当出处）＋M2 对空列表平凡满足、M6 对空集平凡为真（**非豁免**，留空不得读作『无外部文献支撑』，unknown ≠ false，0.18.6 M15）；4.2.2 行级书目面可否下探由 SO-10 裁决，与 E3 的性质接线相互独立。(d) **compatibility 面不因批准而闭合**——两条 tension（STP-002 → STY-006／STY-016）不升 hard_conflict 的判读见 MJ-22 (iii)（1.2.5 硬冲突清单未列该两对），本项不预设其接线后果；两条 requires（STP-001 → OWN-001、STP-003 → STY-004）由下游侧单侧承载（MJ-17 (iii)：ENUM_RELATION 无 required_by），对侧属已批准条目 → 镜像回填与否属注册表变更，留人工裁决，不因本项批准而视为已闭合。"
    risk_quantification: "触及面：4 条 × formal_anchor 引用的硬性质，共 5 项 11 个硬性质实例（Y1 3、Y6 3、W4 2、Y3 2、Y2 1）。利息形态：硬性质违例的检出时机从『运行时/编译期自动检出』退化为『评审期人工核验』，检出延迟 = 一个决策周期；漏检后果按性质分级——W4／Y1 漏检 = 数据集合出现多所有者或无已批准共享写例外（2.4 施→4 硬、4.5 @2279-2280 硬）：本批 5 个实例（W4 2＋Y1 3）覆盖四种拓扑，其中**共享数据库形态（STP-002）是 Y1 的最高风险载体**——单一存储实例＋schema 级隔离使所有权边界退化为约定而非物理隔离，而 4.2.2 只给首行第三列的判据句（『判据是访问路径是否唯一经所有者』），本行无对应硬闸门，漏检即分布式单体在数据面静默成形（与 STP-002 → STY-006 的 tension 同源）；Y2 漏检 = 存在绕过所有者与契约的访问路径（@2281-2282 硬），本批 1 个实例落在 STP-001 的 implements 面，即 4.2.2 首行的**唯一硬闸门**（该行第三列明文以访问路径唯一性为判据），漏检则私有 schema 与私有实例两种形态不可区分，『每服务自有数据库』的声明失去可验证内容；Y3 漏检 = 一致性级别未显式声明／无论证／与方面 6 目标不相容（@2283-2285 硬），本批 2 个实例（STP-003 事件日志为权威状态、STP-004 多语言持久化）均为 consumed_by 面，漏检使拓扑选型与 CSL 批的级别声明脱钩——尤其 STP-004 各引擎一致性能力不同（条目正文 @4973 引 4.2.3 开头句『一致性级别不可全局默认，须逐数据集合显式声明』），脱钩即『以引擎默认值充当级别声明』；Y6 漏检 = 跨所有者强一致需求未被识别为冲突信号（@2290-2291 硬，对应 1.2.5 硬冲突行），本批 3 个实例覆盖 STP-001／STP-002／STP-004，漏检的终局是滑向『跨单元 2PC 作为默认一致性手段』（1.2.5 明列硬冲突），或应回溯方面 1 重审部署风格而未回溯（CH-E 通道失效；STP-002 正文 @4792 已记该形态为 CH-E 高频触发源）。缓解：(i) 0.17.5 强制 ADR 附注『依据种子条目，待重验证』；(ii) 本批 12 条 anti_patterns 的 P0／P1／P2 信号级判读带 4.5 性质指针与 MJ-4 判据留痕，可逐条人工复核（实测 P0 7／P1 2／P2 3）；(iii) compatibility 面按 MJ-9 只登记母本有明文依据的对（7 行：composable 3／requires 2／tension 2；STP-004 为空列表并在 ST-STP-01 condition 留痕），无明文依据者不静默造规范；(iv) project.py 的 M9／C-ST／C-ENV／M2／M3／M4／M6 静态自检覆盖 peer 存在性、状态资格、STP 剖面 envelope 非空义务（kind_profile_STP.entry_level_exemptions 为空集 → 四条一律非空；实测 12 项 bound_expr 全为关系式，M3 全过）、pattern_id 与 target_aspect 形态、谓词词汇封闭（本批零新增候选）、references 分级七项可机器判定面（两条 references 空列表以 G-STP-1＋SO-10 显式登记，不以本地造引充数）；(v) 累计口径——本项与前六项合计覆盖 **65** 条 seed 条目（STY 24＋OWN 4＋CSL 5＋CRD 8＋DEC 8＋CTR 12＋STP 4），七项 scope 互不重叠，豁免面按批次逐项登记，不合并、不互相援引。"
