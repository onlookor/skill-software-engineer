    narrative:
      benefit_cost_analysis: "收益：唯一以风险画像为主导驱动的策略（2.2.1 主导驱动空间列），高风险/高保障子系统获得独立验证面与更强验证（2.3 问题空间驱动第三行明文「S8 强制隔离 + 强化验证（与方面 8 联动）」）；包络指标有明确出处族（6.2.1 安全族与合规族），且合规目标值可落在四类合法出处中的『监管条文』（6.2.1 量化纪律），出处门槛易过；隔离边界与 Y5 联动使敏感数据访问路径可判定；boundary_type 的实参 risk 为 2.5 已枚举取值，机器层表达无需占位。代价：隔离单元带来独立验证、独立发布与独立运维面，单元数增长与团队容量的联合可行性须先校验（2.6 示例三：团队容量 × 单元数 × 运维负荷模型），不可行时走 CH-A5 同型阻塞声明 → CH-D 由人类责任方在增团队/合并上下文/豁免物理隔离中裁决，框架不自动回溯修改任一方决策（0.10）；监管条款 → 可判定谓词的映射是持续治理项，覆盖率不得以豁免降低；母本 5.7 书目无本行的行级登记提取面 → references 留空并登记 G-DEC-1（SO-8）；2.6 示例五明示注册表现有 DEC 条目全部预设单一法人账套边界——跨法人账套物理隔离形态属注册表缺口（FM-3 面），不得在本条目内扩张。"
      typical_scenarios: "安全关键或合规关键子系统在案的场合（2.2.1 定义列：安全关键、合规关键）；监管条文可直接映射为可判定谓词的场合（6.2.1 合规族指标；量化纪律四类合法出处之『监管条文』）；须对高风险子系统施加更强验证并与方面 8 联动的场合（2.3 问题空间驱动第三行；8.2.1 验证计划生成）；与 S1/S6 联合可行性须裁决的场合（2.6 示例三：合规目标要求物理隔离）。"
      common_misuse: "高风险/合规关键子系统未隔离成独立单元，致更强验证无独立执行面（AP1，W2 违例）；隔离但未施加更强验证（2.2.1 定义列后半段丢失，与方面 8 联动断裂）；合规条款未映射为可判定谓词即以『已合规』结案（AP2；6.2.1 合规族指标面）；豁免物理隔离不经人类责任方裁决（2.6 示例三裁决选项之一；0.10 框架不自动回溯）；以风险隔离替代数据所有权定案（W4 仍横切适用，2.4 施→4）；把跨法人账套物理隔离形态当作本条目已覆盖（2.6 示例五：注册表缺口 → FM-3 → 0.13 缺口声明＋CH-D）。"

