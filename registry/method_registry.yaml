    envelope: []                     # 剖面豁免：kind_profile_STY.entry_level_exemptions（STY-020…STY-024，check C-ENV）；元方法不改变质量属性包络，而是产生包络判定的输入 → 无 0.8 意义上的可参数化界可声明，强行填写即假精确（0.17.7 门槛 2）
