        - {source_type: clause_id, value: "3.4", verified: true}     # 接收约束六行＋施加约束六行
        - {source_type: clause_id, value: "3.5", verified: true}     # 机器层谓词七项＋X1–X7
        - {source_type: clause_id, value: "2.5", verified: true}     # seam 谓词（定义列明文「方面 2 的 seam 是其可验证投影」）
        - {source_type: clause_id, value: "0.8", verified: true}
