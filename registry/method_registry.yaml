      - {bib_id: 3, support_claim: "1.2.2 部署风格权衡的元方法（母本登记提取面为子维度级：1.2.2/1.2.3 分布式风格权衡的元方法）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 2, support_claim: "风格对比与架构决策方法（母本登记提取面为子维度级，未限定行）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 23, support_claim: "1.2.4 演进式元方法的默认起点论证；0.10 临时保守通道条件 (i) 的登记默认值来源（母本登记提取面逐字对应：默认起点即模块化单体，@1388/@1391）", compile_usage: narrative_only, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：以单体的性能/事务优势（网络跳数 = 0、ACID 可用）换取接近微服务的可修改性（变更触达面被模块边界收敛），并保留未来拆分选项（迁移成本上界 = 边界契约面）；代价：模块边界必须被工具门禁强制，否则退化为大泥球（AP1），且单元级故障影响面仍为全部流量。母本把本风格登记为演进式元方法的默认起点（1.2.4）与 0.10 临时保守通道的登记默认值之一——即『不确定时先取本风格』是有出处的默认，不是缺省填充。"
      typical_scenarios: "中小团队需要结构纪律但无分布式必要的系统、领域边界尚在收敛但需保留拆分选项的系统、强一致与低延迟要求排除分布式形态的系统、演进式落地（STY-023）的默认起点。"
      common_misuse: "只画模块图不建门禁（AP1）；以模块名为由引入跨模块共享表直访（削弱拆分选项）；在组织已多团队、负载需独立伸缩时仍停留在本风格（1.3 交付空间/问题空间过滤器未复核）；把「模块化单体」当作微服务的等价替代而不登记 envelope 差异（伸缩粒度与故障影响面两项上界不同）。"

  - entry_id: STY-016
    kind: STY
    name: 微服务
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.2-微服务", verified: true}
        - {source_type: clause_id, value: "1.2.2", verified: true}
        - {source_type: clause_id, value: "1.2.5", verified: true}
        - {source_type: clause_id, value: "1.3", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "3", verified: true}
        - {source_type: bib_id, value: "4", verified: true}
        - {source_type: bib_id, value: "5", verified: true}
        - {source_type: bib_id, value: "9", verified: true}
        - {source_type: bib_id, value: "17", verified: true}
        - {source_type: bib_id, value: "19", verified: true}
    typical_reversibility: costly      # 人工判断：合并已拆分服务须重建共享数据与事务边界（1.4 施→4「每服务自有数据库为默认」的逆操作），且组织侧运维结构与团队归属已随之调整（Conway 反向锁定）
    applicability:
      problem_space:                   # 骨架源：1.2.2「适用条件（摘要）」列
        - "[领域边界清晰]（方面 2 输入充分；1.4 接收约束行：限界上下文清晰且团队多 → 微服务可行）"
      current_space: []                # 母本本行未给现状空间条件（G-STY-1）
      delivery_space:                  # 骨架源：本行自带空间标注「多团队（交付空间硬过滤器，见 1.3）」
        - "[多团队]（1.3 交付空间硬过滤器：团队规模与认知负荷；假设不满足时本风格不可选，无论技术上多先进）"
        - "[组织具备独立运维能力]（1.3：每种部署风格隐含组织假设——微服务假设多团队、独立运维、成熟基础设施）"
    envelope:                          # 骨架源：0.8 @198 的微服务包络示例（前两项逐字对应）+ 1.2.2「包络要点」列「独立伸缩/部署↑」
      - metric: "延迟分位数 P99"
        bound_expr: "P99(req) ≥ P99_inproc(req) + Σ_{hops ∈ 跨单元路径} network_hop，其中跨单元调用引入的网络延迟项下界约为同进程调用的 10–100 倍（0.8 唯一给定的参数化数值）；参数：调用链跳数、协议、序列化形态"
        source: {source_type: clause_id, value: "0.8", verified: true}
      - metric: "可伸缩性：单位资源增量带来的容量增量"
        bound_expr: "capacity(r + Δr) − capacity(r) 的实现粒度 = 单个服务（0.8：单元可独立伸缩，增益项）；上界 ∝ |可独立伸缩的服务数|；前提：服务间无共享伸缩约束（共享数据库/共享配额时该上界退化为整体粒度）"
        source: {source_type: clause_id, value: "0.8", verified: true}
      - metric: "可修改性：变更前置时间"
        bound_expr: "lead_time(服务内变更) ≤ verify(svc) + deploy(svc)，与其他服务的发布解耦（「独立伸缩/部署↑」的部署侧落点）；跨服务契约变更 → lead_time = Σ_{受影响服务} (verify + deploy)；参数：契约扇出数、消费者驱动契约测试覆盖"
        source: {source_type: row_id, value: "1.2.2-微服务", verified: true}
    cost_profile:
      latency_budget_delta: "+ 每次跨单元调用一项网络延迟（下界约为同进程调用的 10–100 倍，0.8）；参数：调用链跳数、协议与序列化形态"
      failure_modes: ["分布式单体（服务间强耦合必须同步部署）→ 独立部署/独立伸缩两个上界同时失效", "纳米服务（拆分过细）→ 跨单元跳数与运维面同时膨胀", "跨单元最终一致下的对账/补偿缺失", "部分失败与重试放大（级联失败）"]   # 前两项骨架源 1.2.2 反模式列；第三项交叉表源 0.8「跨单元一致性降级为最终一致」+ 1.2.5 微服务×2PC 冲突行；第四项人工判断
      consistency_impact: "跨单元一致性降级为最终一致（0.8）；需强一致 → 引入分布式事务且代价单列；「跨单元 2PC 作为默认一致性手段」是 1.2.5 硬冲突行（应改用 Saga 类或重审部署风格）→ 已双向登记于本条目 compatibility（peer CSL-001）与顶层 pending_conflict_rows.closed_in_entries"
      observability_requires: ["跨单元调用链追踪（分布式 trace 与关联 ID）", "服务级 SLO 与错误预算计量", "部署单元 ↔ 团队归属可查（owned_by，分布式单体检测的前提）"]
      ops_cost: "[运维复杂度↑↑（母本原文）：每服务独立发布通道、容量治理、故障演练与基础设施自动化；成本随服务数上升，且 1.3 预算条为分布式基础设施与可观测性成本上限]"
      skill_prerequisites: ["服务边界切分（对齐限界上下文）", "分布式协调设计（Saga 类补偿、幂等、超时预算）", "消费者驱动契约测试", "分布式可观测性建设"]
      aggregation_semantics: itemwise
    compatibility:
      - peer_entry: CSL-001
        relation: hard_conflict
        evidence: {source_type: clause_id, value: "1.2.5", verified: true}   # 1.2.5「微服务 × 跨单元 2PC 作为默认一致性手段 → 冲突（应改用 Saga 类，或重审部署风格），硬」。STY 批入库时其 peer（一致性/协调类条目）未建，M9 要求 peer 存在 → 当时登记于顶层 pending_conflict_rows（PCR-2）；CSL 批入库后 peer = CSL-001 已建 → 本批同提交双向回填（对侧镜像见 CSL-001.compatibility），PCR-2 移入 closed_in_entries，peer 判读见 MJ-17。其余对侧已登记本条目为 peer 的行不重复（MJ-5/MJ-9）：STY-003（@1.4 语境）、STY-006（tension，@1.2.3-共享数据行）、STY-007（@1319）、STY-008、STY-009（@1344）
    constraints_imposed:               # 交叉表源：1.4「施加约束」表（微服务行 2/3/4/5/8 + 通用行 6/10）
      - {target_aspect: 2, constraint: "分解单元必须一一映射部署单元（1.4 施→2 微服务行）", level: hard}
      - {target_aspect: 3, constraint: "跨单元禁止以进程内调用为主手段（1.4 施→3 微服务行）", level: hard}
      - {target_aspect: 4, constraint: "每服务自有数据库为默认（1.4 施→4 微服务行）；偏离须显式记录并满足 1.2.3 共享数据行的适用条件（STY-006）", level: hard}   # 表标「硬/软按条」：本条为默认值 + 偏离须记录 → 判读为硬（MJ-4）
      - {target_aspect: 5, constraint: "分布式协调是必答题（1.4 施→5 微服务行）：协调机制须显式选型（编排/协同/Saga 类）并登记", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）；延迟下界与最终一致项尤其约束强一致/低延迟目标（1.3：强一致 → 收缩分布范围，微服务降权）", level: hard}
      - {target_aspect: 8, constraint: "消费者驱动契约测试必备（1.4 施→8 微服务行）", level: soft}   # 1.4 表标本行为软
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集（style/deployed_on/connects 全面启用）；人类层：投影视图必须表达所选风格（部署单元边界与网络交互须可辨）", level: hard}
    anti_patterns:                     # 骨架源：1.2.2「典型反模式」列（本行两项，不增补）
      - pattern_id: STY-016-AP1
        description: "分布式单体（服务间强耦合必须同步部署）"
        detection_predicate: "∃ u1, u2: unit(u1) ∧ unit(u2) ∧ [u1, u2 属不同服务] ∧ depends_on(u1, u2, deploy, ·)"
        signal_level: P1               # 人工判断（MJ-4）：使 envelope 的独立部署/独立伸缩两项上界失效 → 结构漂移限期整改；1.2.5 未将本反模式登记为冲突行、1.5 无「必须同步部署」谓词（VG-01 workaround：以 depends_on(·,·,deploy,·) 表达）→ 不满足 P0 判据
      - pattern_id: STY-016-AP2
        description: "纳米服务（拆分过细）"
        detection_predicate: "∃ u: unit(u) ∧ [u 的职责粒度低于团队可独立运维的阈值] ∧ [u 的拆分未带来独立变更或独立伸缩收益]"
        signal_level: P1               # 人工判断（MJ-4）：无 V 系列硬绑定与 1.2.5 冲突行 → 非 P0；方括号内两项为待勘察事实（VG-02：粒度谓词缺失 → 占位符 + M15 勘察义务，禁填无出处阈值）
    formal_anchor:
      - {property_id: V2, role: implements}     # connects(u1,u2,p) 与 allowed_protocols(S) 的自洽检查在本风格全面启用
      - {property_id: V3, role: triggers}       # 1.2.5「微服务 × 跨单元 2PC 作为默认一致性手段 → 冲突」进入冲突矩阵检查（peer = CSL-001 已于 CSL 批建条目，对侧登记 V3/consumed_by，双向回填见 compatibility 与 MJ-17）
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 4, support_claim: "微服务适用/不适用条件；1.3 组织假设过滤器（母本登记提取面逐字对应）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 3, support_claim: "1.2.2 部署风格权衡的元方法（母本登记提取面：1.2.2/1.2.3 分布式风格权衡的元方法）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 5, support_claim: "部署 × 通信组合模式（Saga、CQRS、事件驱动）——本风格与通信/一致性方法组合的模式来源（母本登记提取面逐字对应）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 9, support_claim: "S6 团队认知负荷；1.3 交付空间硬过滤器（母本登记提取面逐字对应，支撑 delivery_space 的多团队硬过滤器）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 19, support_claim: "微服务采纳的实证约束（母本登记提取面逐字对应；驱动因素与障碍的从业者调查）", compile_usage: case_study, trust_grade: "[已核验]"}
      - {bib_id: 17, support_claim: "Conway 定律；1.3 交付空间过滤器（母本登记为 narrative_only：概念性引用，不作 envelope/detection_predicate 出处）", compile_usage: narrative_only, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：单元可独立伸缩与独立部署（容量增量粒度 = 单服务，变更前置时间与其他服务解耦）；代价：跨单元调用引入网络延迟项（0.8 给定下界约为同进程调用的 10–100 倍）、跨单元一致性降级为最终一致、运维复杂度↑↑。母本把本风格的可选性交给交付空间硬过滤器：组织假设（多团队、独立运维、成熟基础设施）不满足时本风格不可选，无论技术上多先进（1.3，Conway 定律反向用作可行性判据）。"
      typical_scenarios: "多团队且领域边界清晰的系统、需要按服务独立伸缩的异构负载、需要独立部署以缩短变更前置时间的组织、具备成熟基础设施与独立运维能力的组织。"
      common_misuse: "在单团队/低运维能力组织内采用本风格（1.3 硬过滤器未过 → 假设不成立）；服务间共享数据库或必须同步部署（AP1 分布式单体，同时摧毁两项上界）；拆分粒度过细而无独立变更收益（AP2 纳米服务）；以跨单元 2PC 作为默认一致性手段（1.2.5 硬冲突行，须改用 Saga 类或重审部署风格）；先拆服务后建可观测性与契约测试（1.4 施→8 的软约束被当作可选项）。"

  - entry_id: STY-017
    kind: STY
    name: SOA
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.2-SOA", verified: true}
        - {source_type: clause_id, value: "1.2.2", verified: true}
        - {source_type: clause_id, value: "1.2.3", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "2", verified: true}
        - {source_type: bib_id, value: "3", verified: true}
    typical_reversibility: costly      # 人工判断：中介承载的路由/转换/治理策略与全部参与方契约绑定，去中介化须重建点对点契约面
    applicability:
      problem_space:                   # 骨架源：1.2.2「适用条件（摘要）」列
        - "[企业级异构系统集成]（与 1.2.3 Broker 中介行「异构集成、需要集中策略点」同源语境）"
      current_space:
        - "[既有异构系统存量与既定中间件/平台]（1.3 现状空间：既有中间件/平台限定通信风格候选；归类为人工判断，母本列未标空间）"
      delivery_space: []               # 母本本行未给交付空间条件（G-STY-1）
    envelope:                          # 骨架源：「互操作性↑；中介成为瓶颈/单点」；「互操作性」无 6.2.1 属性族 → 映射可修改性族（G-ENV-1）
      - metric: "可修改性：典型变更的实现成本（跨边界契约变更数）"
        bound_expr: "新增/替换参与方 → 跨边界契约变更数 ≤ 1（中介侧路由/转换策略）+ |该参与方自身契约面|，既有参与方内部变更数 = 0（「互操作性↑」的参数化落点：集成点集中于中介）；参数：参与方数、中介路由/转换规则数"
        source: {source_type: row_id, value: "1.2.2-SOA", verified: true}
      - metric: "吞吐量"
        bound_expr: "throughput(system) ≤ throughput(中介集群)（「中介成为瓶颈」：集中式消息路由/转换使全局吞吐上界由中介容量决定）；参数：中介节点数、消息体量、路由/转换规则复杂度"
        source: {source_type: row_id, value: "1.2.2-SOA", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "中介单点故障的影响面比例 = 经中介的流量占比（「中介成为单点」）；SLO 提升通道 = 中介集群冗余与故障域分布；参数：中介冗余配置、参与方降级路径"
        source: {source_type: row_id, value: "1.2.2-SOA", verified: true}
    cost_profile:
      latency_budget_delta: "+ 每交互一次中介跳（路由/转换开销）；参数：消息体量、路由规则数、转换复杂度"
      failure_modes: ["中介单点故障（经中介流量全局不可用）", "中介成为吞吐瓶颈", "ESB 承载业务逻辑 → 中介变更频繁且高风险（AP1）"]   # 三项均骨架源：1.2.2 包络要点列 + 反模式列
      consistency_impact: "中介不改变一致性级别；若中介承载状态转换/业务规则则引入新的一致性边界（应视为 AP1）"   # 人工判断（与 STY-005 同型）
      observability_requires: ["中介级流量/延迟/错误计量", "路由与转换策略变更审计", "参与方到中介的连接健康度"]
      ops_cost: "[中介集群高可用运维 + 集中策略点治理；集中式 → 单点运维压力高（与 STY-005 同型）]"
      skill_prerequisites: ["中介产品运维（ESB 平台）", "路由/转换策略设计", "集中策略点的权限与变更治理"]
      aggregation_semantics: itemwise
    compatibility:
      - peer_entry: STY-005
        relation: composable
        evidence: {source_type: row_id, value: "1.2.3-Broker 中介", verified: true}   # 骨架源：本行定义含「ESB（企业服务总线：集中式消息路由/转换/治理中介）」→ ESB 为 Broker 中介的实例形态；对侧 STY-005 已登记同一事实（镜像行，非新增命题），relation 取 composable（人工判断：母本未声明必选）
    constraints_imposed:               # 交叉表源：1.4 施加表（通用行 6/10）；1.4 表无 SOA 实例 → 按本行定义人工实例化（G-STY-2）
      - {target_aspect: 2, constraint: "分解单元为服务，服务间交互经中介路由（本行定义「服务化 + ESB/中介治理」的实例化）", level: hard}   # 人工实例化（1.4 施→2 未给 SOA 行）
      - {target_aspect: 3, constraint: "跨单元契约须与中介的路由/转换能力自洽（V2 消费面）", level: hard}   # 人工实例化（1.4 施→3 未给 SOA 行）
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）；中介吞吐/单点两项上界尤其约束高吞吐与高可用目标", level: hard}
      - {target_aspect: 9, constraint: "ESB 承载业务逻辑属守护对象（反模式 → G 规则播种）", level: soft}   # 交叉表源：本行反模式列 + STY-005 同型登记
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集（connects 须含中介端点）；人类层：投影视图必须表达所选风格（中介与参与方的星型拓扑须可辨）", level: hard}
    anti_patterns:                     # 骨架源：1.2.2「典型反模式」列（本行一项，不增补）
      - pattern_id: STY-017-AP1
        description: "ESB 承载业务逻辑"
        detection_predicate: "∃ b, d: [b 为 ESB/中介单元] ∧ unit(b) ∧ responsibility(b, d) ∧ [d 为业务规则（非路由/转换/策略）]"
        signal_level: P1               # 人工判断（MJ-4）：与 STY-005-AP1 同型（业务逻辑沉积在中介里）；1.2.5 无涉本风格的冲突行、1.5 无对应硬性质 → 不满足 P0 判据；结构漂移限期整改（使中介吞吐/可用性两项上界随业务变更频繁失效）
    formal_anchor:
      - {property_id: V2, role: implements}     # 参与方 ↔ 中介的协议须属 allowed_protocols(S)
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 3, support_claim: "1.2.2 部署风格权衡的元方法（母本登记提取面为子维度级：1.2.2/1.2.3 分布式风格权衡的元方法——本行与 1.2.3 Broker 行的权衡同属其覆盖面）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 2, support_claim: "风格对比与架构决策方法（母本登记提取面为子维度级，未限定行）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：异构系统集成的契约转换集中于中介，新增参与方的跨边界契约变更数被收敛（互操作性↑）；代价：全局吞吐上界由中介容量决定、中介单点故障影响面为经中介的全部流量，且中介成为集中策略点后其变更风险与治理成本上升。母本将 ESB 明确定义为「集中式消息路由/转换/治理中介」，故本风格与 1.2.3 的 Broker 中介（STY-005）共享同一组包络代价与反模式。"
      typical_scenarios: "企业级异构系统集成（多套既有系统、多协议/多数据格式）、需要集中策略点（安全/路由/审计）的集成场景、既有中间件平台限定通信风格候选的棕地项目（1.3 现状空间）。"
      common_misuse: "把业务规则写进 ESB 的路由/转换脚本（AP1）；以中介单点承载全部关键流量而不建集群冗余与降级路径；在绿地小团队场景选用本风格（适用条件为企业级异构集成，不匹配时中介成本无对应收益）；把 SOA 与微服务混为一谈而不登记 envelope 差异（本风格的吞吐上界由中介决定，微服务的伸缩粒度为单服务）。"

  - entry_id: STY-018
    kind: STY
    name: Serverless / FaaS
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.2-Serverless / FaaS", verified: true}
        - {source_type: clause_id, value: "1.2.2", verified: true}
        - {source_type: clause_id, value: "1.2.5", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "3", verified: true}
    typical_reversibility: costly      # 人工判断：函数粒度 + 平台托管伸缩 + 状态外置三者共同绑定平台编程模型与托管设施，迁出须重建运行时与状态层
    applicability:
      problem_space:                   # 骨架源：1.2.2「适用条件（摘要）」列
        - "[突发/稀疏负载]（负载形态：闲置期占比高）"
        - "[事件驱动天然契合]（工作负载以事件触发为自然形态）"
      current_space:
        - "[平台托管能力可用且被组织接受]（人工判断归类：母本定义含「平台托管伸缩」，其可用性属现状/制度事实；1.3 现状锁定规则 0.11 在此高频适用）"
      delivery_space: []               # 母本本行未给交付空间条件（G-STY-1）；1.3「无人值守/低运维能力 → 排除重运维风格」是否涵盖本行母本未明示 → 不臆造
    envelope:                          # 骨架源：「零闲置成本、自动伸缩；冷启动延迟、执行时长限制、状态外置强制」；metric 词汇取 6.2.1
      - metric: "可伸缩性：单位资源增量带来的容量增量"
        bound_expr: "capacity 增量由平台自动伸缩承担（无需预留容量）；上界 ∝ 平台伸缩速率与并发配额，伸缩操作时长由平台决定而非本地决策；参数：请求到达率、并发配额、冷启动时长"
        source: {source_type: row_id, value: "1.2.2-Serverless / FaaS", verified: true}
      - metric: "延迟分位数 P99"
        bound_expr: "P99 ≥ P99_warm + P(cold_start) × cold_start_latency（「冷启动延迟」进入尾延迟）；参数：调用稀疏度、平台预热策略、运行时初始化量"
        source: {source_type: row_id, value: "1.2.2-Serverless / FaaS", verified: true}
      - metric: "性能：资源占用"
        bound_expr: "闲置期资源占用 = 0（「零闲置成本」的参数化形态）；单次执行时长 ≤ [平台执行时长上界]、并发 ≤ [平台并发配额]（方括号为待勘察平台参数，VG-02/M15）；超限流程不可承载 → 1.2.5 硬冲突（STY-018-AP1）"
        source: {source_type: row_id, value: "1.2.2-Serverless / FaaS", verified: true}
    cost_profile:
      latency_budget_delta: "+ 冷启动项（稀疏调用下进入 P99）；参数：运行时初始化量、平台预热策略、调用频率"
      failure_modes: ["长时运行有状态流程（1.2.5 硬冲突行，AP1）", "冷启动导致的尾延迟抖动", "状态外置强制下的托管存储依赖与一致性/延迟代价", "平台配额与执行时长限制造成的静默截断"]   # 第一项骨架源 1.2.2 反模式列 + 1.2.5；第二/三项源自包络要点列；第四项人工判断
      consistency_impact: "状态外置强制 → 函数实例不得承载跨调用状态，一致性由托管存储与事件重放语义决定（方面 4/5 输入）；重复投递须以幂等应对（联动 5.5 idempotent）"   # 骨架源「状态外置强制」+ 人工判断
      observability_requires: ["函数级调用、冷启动与执行时长计量", "跨函数/跨事件的调用链追踪（平台侧 trace 与关联 ID）", "配额触顶与截断事件可观测"]
      ops_cost: "[基础设施运维由平台托管（无集群运维面）；成本转移到配额治理、冷启动优化、平台锁定评估与账单侧可观测性]"
      skill_prerequisites: ["函数粒度切分与事件触发建模", "状态外置设计（托管存储/事件日志）", "幂等与重复投递处置", "平台配额与冷启动的性能治理"]
      aggregation_semantics: itemwise
    compatibility:
      - peer_entry: STY-003
        relation: composable
        evidence: {source_type: row_id, value: "1.2.2-Serverless / FaaS", verified: true}   # 骨架源：本行适用条件「事件驱动天然契合」+ 定义「事件触发」→ 部署风格与通信/协调风格（事件驱动，发布订阅）的适配声明；relation 取 composable（人工判断：母本措辞为「契合」而非「必选」，不构成 requires）
      - peer_entry: CRD-007
        relation: hard_conflict
        evidence: {source_type: clause_id, value: "1.2.5", verified: true}   # CRD 批回填（PCR-1 双向闭合，MJ-17 (ii)）：1.2.5 冲突矩阵行「Serverless × 长时运行有状态流程 → 冲突（执行时长限制），硬」；对侧为 CRD-007（流程管理器，长时运行有状态流程的协调形态）。原 PCR-1 判定「对侧不是风格条目而是问题空间事实 → 无 peer_entry 可指」，CRD-007 入库后该判断被推翻 → PCR-1 移入 closed_in_entries，对侧同步登记（MJ-18 留痕）。例外覆盖须走 1.2.5 机制（完整 ADR + 可推翻指标，登记为 has_approved_exception）
    constraints_imposed:               # 交叉表源：1.4 施加表（通用行 6/10）；本风格实例源自本行定义与包络要点列（G-STY-2）
      - {target_aspect: 2, constraint: "分解单元为函数粒度、以事件触发为入口（本行定义「函数粒度、事件触发」的实例化）", level: hard}   # 人工实例化（1.4 施→2 未给本风格行）
      - {target_aspect: 4, constraint: "状态外置强制：函数实例不得承载跨调用状态，状态须外置到托管存储/事件日志", level: hard}   # 骨架源：包络要点列「状态外置强制」
      - {target_aspect: 5, constraint: "长时运行有状态流程不可由本风格承载（1.2.5 硬冲突行）→ 须改用其他部署风格或经批准例外覆盖（has_approved_exception）", level: hard}   # 交叉表源 1.2.5
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）；执行时长/并发配额与冷启动项尤其约束低延迟与长流程目标", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集（style/deployed_on，节点侧为平台托管）；人类层：投影视图必须表达所选风格（触发器 → 函数 → 托管状态的路径须可辨）", level: hard}
    anti_patterns:                     # 骨架源：1.2.2「典型反模式」列（本行一项，母本自带「硬冲突，见 1.2.5」标注）
      - pattern_id: STY-018-AP1
        description: "长时运行有状态流程"
        detection_predicate: "∃ f, p: unit(f) ∧ [f 为函数粒度的平台托管单元] ∧ responsibility(f, p) ∧ [p 为长时运行且需跨调用保持状态的流程] ∧ ([p 的单次执行时长 > 平台执行时长上界] ∨ [p 的状态无法外置]) ∧ ¬has_approved_exception(·, ·, ·)"
        signal_level: P0               # 交叉表源（MJ-4 判据）：1.2.5 硬冲突行「Serverless × 长时运行有状态流程 → 冲突（执行时长限制）」+ 未批准例外 → V3 硬失败 → 0.14 P0 检出即阻塞。例外覆盖须走 1.2.5 机制（完整 ADR + 可推翻指标，登记为 has_approved_exception）；无出处的覆盖 = 纪律一违例
    formal_anchor:
      - {property_id: V2, role: implements}     # 触发器/协议端点须属 allowed_protocols(S)
      - {property_id: V3, role: implements}     # 1.2.5 硬冲突行的条目化落点即 AP1（conflict_matrix(hard) ∧ active ∧ ¬has_approved_exception）
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 3, support_claim: "1.2.2 部署风格权衡的元方法（母本登记提取面为子维度级：1.2.2/1.2.3 分布式风格权衡的元方法——执行时长/状态外置类权衡属其覆盖面）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：闲置期资源占用为零、容量增量由平台自动伸缩承担（无需预留与集群运维），事件触发形态与事件驱动通信天然契合；代价：冷启动项进入尾延迟、执行时长与并发配额构成硬上界、状态外置强制把一致性责任推给托管存储与幂等设计。母本把「长时运行有状态流程」登记为硬冲突（1.2.5）而非一般反模式——即本风格的适用边界是可机器判定的阻塞项，不是权衡建议。"
      typical_scenarios: "突发/稀疏负载（流量峰谷差大、闲置期长）、事件驱动的处理管道（对象存储/消息/流触发）、无需长时状态的短时任务（Webhook、异步作业、定时任务）、以最小运维面换取按量成本的场景。"
      common_misuse: "把长时运行有状态流程塞进函数（AP1，P0 阻塞项）；以函数内全局变量/临时目录承载跨调用状态（违反状态外置强制）；忽略冷启动对 P99 的影响而在延迟敏感路径使用；未登记配额与执行时长上界即宣称弹性无上限（envelope 第三项被当作无条件收益）。"

  - entry_id: STY-019
    kind: STY
    name: 边缘-中心混合
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.2-边缘-中心混合", verified: true}
        - {source_type: clause_id, value: "1.2.2", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "3", verified: true}
    typical_reversibility: costly      # 人工判断：计算放置与数据主权约束共同决定单元到节点映射，回迁须重建数据放置与同步链路
    applicability:
      problem_space:                   # 骨架源：1.2.2「适用条件（摘要）」列
        - "[物联网]（大量分布式采集端与带宽约束）"
        - "[低延迟交互]（响应路径不可经中心往返）"
        - "[数据主权约束]（合规要求数据不出辖区；母本定义亦含「按…合规要求…分布」）"
      current_space:
        - "[存在边缘节点基础设施且运维可达]（人工判断归类：母本包络要点列「边缘运维可达性差」的反面即现状前提；1.3 现状空间）"
      delivery_space: []               # 母本本行未给交付空间条件（G-STY-1）
    envelope:                          # 骨架源：「延迟↓、带宽↓；一致性管理复杂度↑」；metric 词汇取 6.2.1（带宽 → 性能族资源占用；一致性无属性族 → 归 cost_profile，G-ENV-1）
      - metric: "延迟分位数 P99"
        bound_expr: "边缘承载的请求：P99 ≥ P99_edge 且不含回源网络项；需回源的请求：P99 ≥ P99_edge + network_hop(edge→center)；整体上界由回源比例决定（「延迟↓」的参数化落点）；参数：边缘节点覆盖、回源比例、边缘侧处理能力"
        source: {source_type: row_id, value: "1.2.2-边缘-中心混合", verified: true}
      - metric: "性能：资源占用"
        bound_expr: "回源带宽 = 总流量 × 回源比例（「带宽↓」的参数化落点：边缘处理/聚合把带宽消耗压到回源侧）；参数：边缘聚合率、数据新鲜度要求、缓存策略"
        source: {source_type: row_id, value: "1.2.2-边缘-中心混合", verified: true}
    cost_profile:
      latency_budget_delta: "边缘路径：无回源项；回源路径：+ 一次 edge→center 网络跳（参数：回源比例、链路质量）"
      failure_modes: ["边缘节点承担需要全局视图的决策（AP1）→ 决策基于不完整状态", "一致性管理复杂度↑：边缘与中心的状态收敛依赖同步策略（部分失败/乱序/重放）", "边缘运维可达性差 → 故障检测与恢复时长（MTTR）显著高于中心侧", "数据主权约束下的放置错误（合规风险）"]   # 第一/二/三项骨架源 1.2.2 反模式列 + 包络要点列；第四项人工判断（源自适用条件「数据主权约束」）
      consistency_impact: "一致性管理复杂度↑（母本原文）：边缘与中心间为最终一致形态，收敛时长由同步策略决定（参数：边缘节点数、同步频率、冲突解决规则）；6.2.1 无一致性属性族 → 该代价归本字段而非 envelope（G-ENV-1）"
      observability_requires: ["边缘节点健康度与可达性观测（运维可达性差的前提补偿）", "边缘 ↔ 中心同步滞后与冲突计量", "数据放置与辖区归属可查（合规校验面）"]
      ops_cost: "[边缘运维可达性差（母本原文）：节点分散、物理可达性低、更新与故障恢复须远程批量执行；成本随边缘节点数上升]"
      skill_prerequisites: ["计算放置决策（按延迟/带宽/合规切分）", "边缘-中心数据同步与冲突解决设计", "远程批量运维与可观测性建设"]
      aggregation_semantics: itemwise
    compatibility: []                  # 母本对本行无叠加声明、1.2.5 无涉本风格的冲突行；MJ-5/MJ-9 同 STY-013。注：本风格与通信/协调风格（如事件驱动）的组合在实践中常见，但母本未登记 → 不入本字段（禁造规范）
    constraints_imposed:               # 交叉表源：1.4 施加表（通用行 6/10）；本风格实例源自本行定义与 1.2.2 部署切分线判定规则（G-STY-2）
      - {target_aspect: 2, constraint: "单元到节点映射属本子维度决策面（1.2.2 切分线规则：决策改变部署单元数量/单元边界/单元到节点映射/网络边界/协议端点拓扑 → 归方面 1）；计算放置按延迟/带宽/合规要求切分", level: hard}
      - {target_aspect: 4, constraint: "数据放置须满足合规/数据主权要求（本行定义「按…合规要求…分布」+ 适用条件「数据主权约束」）：辖区归属为硬约束，不得以性能理由覆盖", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）；回源比例同时决定延迟与带宽两项上界", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集（deployed_on 为核心登记面，节点角色须可辨）；人类层：投影视图必须表达所选风格（边缘/中心两区与同步链路须可辨）", level: hard}
    anti_patterns:                     # 骨架源：1.2.2「典型反模式」列（本行一项，不增补）
      - pattern_id: STY-019-AP1
        description: "边缘节点承担需要全局视图的决策"
        detection_predicate: "∃ u, n, d: unit(u) ∧ deployed_on(u, n) ∧ [n 为边缘节点] ∧ responsibility(u, d) ∧ [d 为需要全局状态视图的决策]"
        signal_level: P1               # 人工判断（MJ-4）：1.2.5 无涉本风格的冲突行、1.5 无对应硬性质 → 不满足 P0 判据；结构漂移限期整改（决策基于不完整状态，直接影响正确性与一致性收敛）。节点角色（边缘/中心）谓词缺失 → 方括号占位 + VG-03/M15
    formal_anchor:
      - {property_id: V2, role: implements}     # 边缘 ↔ 中心的 connects(u1,u2,p) 须属 allowed_protocols(S)（弱链路下协议选择是校验面）
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 3, support_claim: "1.2.2 部署风格权衡的元方法（母本登记提取面为子维度级：1.2.2/1.2.3 分布式风格权衡的元方法——计算放置与一致性代价的权衡属其覆盖面）；母本未给本行专属提取面 → 不追加其他书目（M6 禁止以不承载该主张的文献充当出处）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：把响应路径与数据聚合压到边缘，延迟上界不含回源项、回源带宽按回源比例收敛，并满足数据主权类合规要求；代价：一致性管理复杂度↑（边缘与中心为最终一致，收敛时长由同步策略决定）、边缘运维可达性差使 MTTR 显著高于中心侧。母本把「边缘节点承担需要全局视图的决策」列为本风格的典型反模式——即放置决策的判据是『该决策需要多大范围的状态视图』，而非『哪一侧算力更近』。"
      typical_scenarios: "物联网与大规模采集端场景、低延迟交互（工业控制、实时媒体、就近接入）、数据主权/辖区合规约束下的数据放置、带宽受限或链路不稳定环境。"
      common_misuse: "在边缘节点做需要全局视图的调度/定价/风控决策（AP1）；以性能理由覆盖数据辖区约束（constraints 施→4 为硬）；未建边缘可观测性即上线（运维可达性差 → 故障不可诊断）；把边缘-中心混合当作单纯 CDN 缓存（忽略状态同步与一致性收敛的设计责任）。"

  # ══════════ 子维度四：风格选择元方法（1.2.4）→ STY-020…STY-024 ══════════
  # 通用说明一（无包络/无反模式骨架源）：1.2.4 表仅三列（元方法｜过程定义｜适用条件），
  #   **无「包络要点」列、无「典型反模式」列** → 本块 envelope 与 anti_patterns 均无骨架源。
  #   envelope: [] 依 kind_profile_STY 的 entry_level_exemptions（STY-020…STY-024 豁免 C-ENV）
  #   ＋ README §5 的 C-ENV 范围（仅源行属 1.2.1/1.2.2/1.2.3 的条目）双保险；
  #   anti_patterns: [] 因母本未给反模式列（禁造规范），过程性误用一律落 narrative.common_misuse
  #   ——0.17.7 门槛 3：不可在白板谓词上求值的反模式即叙事，降为 narrative 内容。
  # 通用说明二（cost_profile 的「不适用」登记）：七字段为 kind 剖面必填（M2 fields_complete），
  #   元方法不进入运行时路径 → latency_budget_delta / consistency_impact 显式登记「不适用」
  #   而非留空（留空 = 字段缺失，M2 不放行；填运行时数值 = 假精确，0.17.7 门槛 2 拒绝），
  #   过程性代价落 failure_modes / observability_requires / ops_cost / skill_prerequisites → MJ-11。
  # 通用说明三（与 0.18.2 S 步骤的对应为人工判断）：STY-021 ↔ S2 约束排除（同名同操作）、
  #   STY-020 ↔ S4 包络校验、STY-024 ↔ S1 applicability 求值 + S5 排序、STY-023 ↔ S5 分支二
  #   （CH-B 推迟）——名称与操作同构，母本未显式登记该映射 → MJ-10。仅用作 provenance 指针
  #   与注释论证，不据此新增任何规范命题。
  # 通用说明四（compatibility 只登记 @1391 典型链的相邻对）：母本原文「元方法可组合
  #   （典型：约束排除 → 质量属性驱动 → 模式匹配排序 → 演进式落地）」→ 登记链内相邻对
  #   021↔020、020↔024、024↔023（双向镜像闭合，M9 peer 全部在本批入库）；
  #   链外各对（含 STY-022 与任何条目）母本未实例化 → 不登记（禁造规范）。
  # 通用说明五（1.4 施加表的风格实例行不在本块重复登记）：施→2/3/4/5/8 的实例措辞
  #   均以具体风格为主语（单体 →…／微服务 →…／事件驱动 →…），经本方法**产出的**风格条目
  #   传导，元方法条目只登记过程性约束（施→1）、质量属性输入面（施→6，仅 STY-020）、
  #   守护规则消费面（施→9，仅 STY-021）与通用行（施→10）。
  # 通用说明六（适用条件列未区分三空间）：按 1.3 三空间定义归类（人工判断）——
  #   「新系统／棕地项目」归现状空间，「初创团队」「团队能力」归交付空间，其余归问题空间；
  #   「作为以上各方法的子步骤统一执行」是执行位序而非三空间条件 → 落 constraints_imposed。
  # 通用说明七（V3 的登记位）：1.2.5 冲突矩阵是四子维度组合的强制元数据，任何元方法的产出
  #   都须过 V3；本块只在 STY-021（其 S2(ii) 硬冲突对检验是 V3 在选型期的执行形态）登记
  #   role: implements，其余四条登记 V5 triggers（风格定案属高影响，纪律二）。

  - entry_id: STY-020
    kind: STY
    name: 质量属性驱动（风格选择元方法）
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.4-质量属性驱动", verified: true}
        - {source_type: clause_id, value: "1.2.4", verified: true}
