    violation_fact: "CTR 批 12 条条目（CTR-001…CTR-012；3.2.1 契约形态表六行＋3.2.2 契约治理表六行，分块序见 MJ-21 (ii)）经 ST-CTR-01 迁移为 seed（人工种子通道，0.17.6(1)），其 formal_anchor 引用的硬性质（3.5 的 X1 无未登记跨单元交互、X2 版本与兼容策略齐备、X5 发布即批准、X6 共享数据条件化；2.5 的 W1 每单元有 seam、W4 数据单一所有者；4.5 的 Y1 单一所有者或已批准共享写例外；5.5 的 Z1 显式建模＋契约在册）尚无 FVR 条目与检查程序接线：本目录的 scripts/project.py 只做注册表静态自检（M2/M3/M4/M6/M9 + C 系列），不是 FVR 运行器，也不产生 first_full_run 证据 → 『引用 seed 条目的性质』不满足 E3 的 wired ∧ first_full_run has evidence。合法性出处：0.17.6(2)（母本明文规定 seed 期本项按 Waiver 机制登记限期豁免）。本项系 WV-STY-E3-01 防扩宽条款 (ii) 要求的**单独申请**（同通道，五要素齐备＋批准），不沿用前五项、不自动生效。"
    scope: "精确范围：method_registry.yaml 中 status=seed 的 CTR-001…CTR-012 十二条的 formal_anchor 所引用的硬性质实例，共 8 项 24 个实例——X1 无未登记跨单元交互（CTR-002/003/004/005 implements，CTR-001/006/012 consumed_by，7 个）、X2 版本与兼容策略齐备（CTR-007/008 implements，CTR-001/002/003/004/006/010 consumed_by，8 个）、X5 发布即批准（CTR-010 implements，CTR-002/011 consumed_by，3 个）、X6 共享数据条件化（CTR-005 implements，CTR-001 consumed_by，2 个）、W1 每单元有 seam（CTR-001 implements，1 个）、W4 数据单一所有者（CTR-005 consumed_by，1 个）、Y1 单一所有者或已批准共享写例外（CTR-005 consumed_by，1 个）、Z1 显式建模＋契约在册（CTR-003 consumed_by，1 个）；级别依据＝母本各性质行明文标注（X1 @2009『无未登记跨单元交互 —— 硬』、X2 @2010『版本与兼容策略齐备 —— 硬』、X5 @2015『发布即批准 —— 硬』、X6 @2016『共享数据条件化 —— 硬』、W1 @1713『可测试性硬约束（0.15 冻结项，来自方面6）—— 硬』、W4 @1717『数据单一所有者 —— 硬』、Y1 @2279-2280『硬』、Z1 @2575-2576『硬』）。另 **X3 迁移窗口闭合为条件硬**（3.5 @2011-2013 明文：breaking_change(C,v1,v2) → deprecation_window(C,v1,t) ∧ t ≥ slowest_consumer_migration(C)，『迁移时长估计满足 0.4 证据门槛时为硬；否则降软 + 保守假设 ADR，保守默认窗口取注册表登记上限』；@2020 附同型说明『X3 的条件硬结构与方面 2 的 W3 同型：硬化与否由 0.4 证据门槛统一判定，防止 Agent 编造「消费者迁移时长」假精确数字绕过弃用窗口』），其 4 个实例（CTR-011 implements，CTR-002/007/008 consumed_by）按条件硬一并纳入本项 scope，级别最终由 0.4 证据门槛判定而非本 Waiver 预设。**不在本项 scope 内**：X4 高风险契约 CDC（3.5 @2014 明定『软（微服务风格下升硬）』；CTR-009 implements，1 个实例）与 X7 事件/命令不混用（@2017 明定『软（P2 漂移信号）』；CTR-004 implements、CTR-003 consumed_by，2 个实例）——E3 只约束 property(hard)，软性质不产生 E3 义务，故不计入豁免面（明列排除共 3 个实例）；X4 的『微服务风格下升硬』条件**不被本项预先涵盖**：若日后风格条件成立致 X4 升硬，属新的事实面，须另申请（防扩宽条款 (i)/(ii)），不静默扩宽。不含 active 条目、不含 STY 批（WV-STY-E3-01 承担）、不含 OWN 批（WV-OWN-E3-01 承担）、不含 CSL 批（WV-CSL-E3-01 承担）、不含 CRD 批（WV-CRD-E3-01 承担）、不含 DEC 批（WV-DEC-E3-01 承担）、不含其余 11 个 kind 批次（各批另单独申请）、不含 E3 以外的编译规范性质（E1/E2/E4 不在本 Waiver 范围）。口径注：前五项 scope 均为其各自批准时点（2026-09-18 seed 仅 STY 24 条；2026-09-22 seed 为 STY＋OWN 28 条；2026-09-24 seed 为 STY＋OWN＋CSL 33 条；2026-09-26 seed 为 STY＋OWN＋CSL＋CRD 41 条；同日 DEC 批准后为 49 条）的口径，按防扩宽条款 (ii) 不随本批外延至 CTR 十二条；CTR 十二条的豁免范围由本项独立承担，六项 scope 互不重叠。**X2/X3/X4/X5/X6/X7 专项口径**：该六面系方面 3 本方面性质（3.5），前五批无任何条目引用，本项为其**首次登记**，无前批引用面可援引。**X1/W1/W4/Y1/Z1 专项口径**：本项只覆盖 CTR 侧实例，既有引用面由各自批次的 Waiver 承担，不互相援引、不重复计息——X1 的既有面为 CRD 3 实例＋DEC 3 实例（本项覆盖 CTR 侧 7 实例）；W1 的既有面为 DEC 8 实例（本项覆盖 CTR-001 的 implements 1 实例）；W4 的既有面为 OWN 3＋CSL 1＋DEC 2 实例（本项覆盖 CTR-005 的 consumed_by 1 实例）；Y1 的既有面为 OWN 3＋DEC 1 实例（本项覆盖 CTR-005 的 consumed_by 1 实例）；Z1 的既有面为 CRD 4＋DEC 1 实例（本项覆盖 CTR-003 的 consumed_by 1 实例）。**差异留痕（不改写已批准登记）**：WV-DEC-E3-01 的 scope 内『X1 已由 WV-STY-E3-01（STY 批引用面）…覆盖』一句与本批实测不符——STY 批 24 条的 formal_anchor 无任何 X1 引用（X1 的既有面实测为 CRD 3＋DEC 3）；按 0.22 承诺一不改写已批准 Waiver 的登记文本，该表述差异登记为待人工裁决口（s5h），本项不复述该表述、只按实测计数承担 CTR 侧实例。"
