      failure_modes: ["例外常态化：过渡期结束后共享写延续（= 分布式单体信号）", "例外超期：deadline 到期未迁移且未升级裁决（Y8 违例 → 自动升 P0 + CH-C(2)）", "退出计划缺失：设立共享写时无最后负责时刻（CH-B 推迟模式要件不满足）"]
      consistency_impact: "多单元写同一存储 → 一致性协调成本最高形态（4.2.1 定义）；仅过渡期容忍，级别声明仍归 CSL 条目（Y3），本条目不重复声明级别"
      observability_requires: ["shared_write_exception 登记可查（退出计划 + deadline）", "到期告警接入升级裁决通道（CH-C(2)）", "过渡期交叉表清单在案（4.6 示例一：例外仅覆盖过渡期交叉表）"]
      ops_cost: "[随共享写单元数与过渡期时长上升；含升级裁决通道与到期告警维护]"
      skill_prerequisites: ["退出计划与迁移里程碑管理（CH-B 参数化切换点 + LRM）", "过渡期双写/对账的临时工程能力（4.2.5 对账验证）"]
      aggregation_semantics: itemwise
    compatibility: []                  # 同 OWN-001 行内注（MJ-5/MJ-9）。CRD 批已闭合留痕（不静默丢弃）：反例 18-B S2 的对侧 CRD-002（协同（choreography），即母本已发布叙述中的「CRD-02 事件协同」，MJ-14）已入库，检验结果为「**无冲突对**」——「无关系」按 MJ-5/MJ-9（禁造规范）不登记任何 compatibility 项，CRD-002 侧亦不列 OWN-004；原「待 CRD 批入库后按 M9 回填」的义务于本批履行完毕，M9 无待检项
    constraints_imposed:               # 交叉表源：4.4「施加约束」表七行（同 OWN-001）
      - {target_aspect: 2, constraint: "数据归属现状回馈分解：现状数据不可干净归属时，S4 策略受约束、拆分序列须按数据迁移可行性排序", level: soft}
      - {target_aspect: 3, constraint: "数据契约的 schema 与语义条款（单位/值域/空值/敏感性/新鲜度）由本方面供给", level: hard}
      - {target_aspect: 5, constraint: "一致性模型 → 协调模式可行集：跨所有者强一致需求 → Saga + 业务补偿，或回溯方面 1 重审部署风格（Y6 的下游消费路径）", level: hard}
      - {target_aspect: 6, constraint: "一致性级别声明与新鲜度条款 → 质量判定的代价计入项", level: soft}
      - {target_aspect: 8, constraint: "不变式 → 对账验证项；血缘 → 派生数据可重建性测试；边界校验 → 契约测试的数据面", level: soft}
      - {target_aspect: 9, constraint: "数据漂移守护对象：schema 漂移（实际 schema 偏离注册契约）、所有权违例（绕过所有者的直写流量）、共享写例外超期", level: hard}
      - {target_aspect: 10, constraint: "机器层：Y 谓词集 + 血缘图；人类层：覆盖谓词子集 {Y 谓词集、血缘} 的投影视图（受众问题 = 数据所有权与流动；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: OWN-004-AP1
        description: "常态化共享写：过渡期外的多单元写同一存储"
        detection_predicate: "∃ D, M1, M2: dataset(D) ∧ owner(D, M1) ∧ owner(D, M2) ∧ ¬(M1 = M2) ∧ ¬shared_write_exception(D, ·, ·)"
        signal_level: P0               # Y1 硬性质违例的直接来源（MJ-4 P0 判据；4.5 Y1 例外须批准 + 退出计划）
      - pattern_id: OWN-004-AP2
        description: "共享写例外超期：到期未迁移且未升级裁决"
        detection_predicate: "∃ D: shared_write_exception(D, ·, deadline) ∧ ¬(now ≤ deadline) ∧ ¬escalation(D, ·)"
        signal_level: P0               # Y8 硬（超期自动升级裁决，CH-C(2)）；escalation 谓词属 6.5 登记词汇
    formal_anchor:
      - {property_id: Y1, role: consumed_by}    # 本条目是 Y1 的批准例外形态（has_approved(shared_write_exception(D))）
      - {property_id: Y8, role: implements}     # 共享写例外不超期
      - {property_id: W4, role: consumed_by}
    references: []                     # G-OWN-1 同型（书目 41 登记面不含本行）
    narrative:
      benefit_cost_analysis: "收益：遗留迁移过渡期内唯一合法的多写形态，为物理迁移换取时间（0.11 现状锁定 + 4.6 示例一：逻辑所有权先行、物理迁移推迟）；例外登记使 Y1 在过渡期仍可判定而非静默失效。代价：必须附退出计划 + 最后负责时刻（CH-B 推迟模式），到期未迁移即自动升级裁决（Y8）；一致性协调成本为四行最高；常态化共享写是分布式单体信号，不属本方法。"
      typical_scenarios: "遗留共享库迁移过渡期（4.6 示例一的过渡期交叉表）；18-B 正例中因 problem_space 谓词「遗留迁移过渡期」= 真（K-17）而保留、并作为过渡期辅助形态并行登记（LRM = CRM 迁移里程碑）的候选。"
      common_misuse: "以「过渡」名义设立无退出计划/无最后负责时刻的共享写；过渡期结束后不回收（例外常态化）；以共享写规避所有权定案（应先走 OWN-001 逻辑所有权先行）。"

  # ══════════ 种子批次三：一致性模型（4.2.3）→ CSL-001…CSL-005 ══════════
  # 编号＝4.2.3 表行序（强一致／会话一致／因果一致／最终一致／补偿一致（业务级）），
  # 与母本反例 18-A 已发布引用一致：@646 现行文本为「CSL-04（最终一致）× STY-04（事件溯源）」
  # （MJ-15 缺陷一的 R2 修订结果，最终一致 = CSL-004），本批母本零改动（MJ-13 (ii)）。
  # 18-A 的「未检验候选」行不构成消费字段索引（无 [i] 指称），故本批不受 MJ-16 (i) 顺序纪律约束，
  # 但列表项顺序仍按「骨架源列序」固定，不得调换（同型纪律沿用）。

  - entry_id: CSL-001
    kind: CSL
    name: 强一致
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-CSL-01）
    provenance:
      origin: hybrid                   # 骨架=4.2.3 表行（compiled 视图）＋界形参数化与谓词转写（manual，MJ-2 同型）
      source_pointers:
        - {source_type: row_id, value: "4.2.3-强一致", verified: true}
        - {source_type: clause_id, value: "4.2.3", verified: true}
        - {source_type: clause_id, value: "4.3", verified: true}
        - {source_type: clause_id, value: "4.4", verified: true}
        - {source_type: clause_id, value: "4.5", verified: true}
        - {source_type: clause_id, value: "1.2.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
    typical_reversibility: costly      # 人工判断：级别声明本身可逆，但跨单元协调拓扑（参与者、锁与超时预算）既成后逆转触达多单元；降级须重走业务语义论证并改数据契约语义条款（4.2.3 降级纪律）
    applicability:
      problem_space:                   # 骨架源：4.2.3「选择条件」列原文
        - "所有者单元内部默认；跨单元强一致 = 冲突信号（Y6，对应 1.2.5 硬冲突：微服务 × 2PC）"
      current_space:                   # 骨架源：4.2.3「实现手段」列（单存储本地事务）＋交叉表源 4.3 现状空间驱动（存储引擎与副本形态限定可达性）
        - "[写路径落在同一存储的同一事务边界内（单存储本地事务可用，4.2.3 实现手段列）]"
      delivery_space: []               # 4.2.3 本行无交付空间条件（4.3 交付空间驱动的 DBA 能力项指向版本向量/因果序类复杂机制，非本行）；留空不读作「该维不适用」（G-STY-1 同型，M15）
    envelope:                          # 骨架源：4.2.3 行「语义/实现手段/选择条件」；metric 取 6.2.1 封闭词汇既有书写形态（G-ENV-1 四族内，不新增 metric 名）；界形参数化＝人工判断（MJ-2 同型，无具体数值）
      - metric: "可修改性：变更前置时间"
        bound_expr: "lead_time(跨单元强一致需求) ≥ lead_time(saga_candidate) ∨ lead_time(reopen(aspect1))：Y6 冲突信号的两条处置路径（Saga + 业务补偿，或回溯方面 1 重审部署风格）→ 变更前置时间以两路径较长者为下界，不设默认协调轮次"
        source: {source_type: row_id, value: "4.2.3-强一致", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "declared(consistency_level(D)) ∧ declared(consistency_rationale(D)) → SLO 判定面完整：级别与业务语义论证写入数据契约语义条款（4.2.3 降级纪律）→ 一致性目标可计量可校验（Y3 三合取项的落点）"
        source: {source_type: row_id, value: "4.2.3-强一致", verified: true}
    cost_profile:
      latency_budget_delta: "不适用（kind_profile_CSL.optional 为空：级别选择的延迟界由 envelope 承载，本字段不重复计入，防 S4 ledger 双计）"
      failure_modes: ["跨单元协调失败（参与者超时/网络分区 → 全局阻塞，1.3『强一致 → 收缩分布范围』的失效形态）", "以跨单元 2PC 为默认一致性手段（1.2.5 硬冲突行，V3 检出对象）", "级别声明缺业务语义论证（Y3 未声明/未论证 = 违例）"]
      consistency_impact: "本条目即一致性级别声明的取值之一（4.2.3 表首行）：写后读保证在所有者单元内部由单存储本地事务承载；跨所有者单元即触发 Y6 冲突信号 → 处置路径为 Saga + 业务补偿（CSL-005）或回溯方面 1 重审部署风格，二者必择其一（4.4 施→5 硬）"
      observability_requires: ["级别声明与业务语义论证可查（consistency_level / consistency_rationale 谓词写入共享白板，4.5）", "跨单元强一致需求的冲突信号可观测（Y6 触发记录与所选处置路径留痕）"]
      ops_cost: "[随参与协调的单元数上升；跨单元形态为五行中最高——Y6 冲突信号即其代价的形式化表达]"
      skill_prerequisites: ["本地事务边界识别（写路径是否落在同一存储的同一事务内）", "冲突信号处置能力（Saga 补偿设计或部署风格重审，4.4 施→5 的两条出路）"]
      aggregation_semantics: itemwise
    compatibility:
      - {peer_entry: STY-016, relation: hard_conflict, evidence: {source_type: clause_id, value: "1.2.5", verified: true}}   # 1.2.5「微服务 × 跨单元 2PC 作为默认一致性手段 → 冲突（应改用 Saga 类，或重审部署风格），硬」；对侧 STY-016 同提交镜像回填（PCR-2 闭合；peer 判读见 MJ-17，双向登记纪律见 MJ-5）
    constraints_imposed:               # 交叉表源：4.4「施加约束」表（方面 4 全体七行，本 kind 各条目逐条适用；级别取表内「级别」列）
      - {target_aspect: 2, constraint: "数据归属现状回馈分解：现状数据不可干净归属时，S4 策略受约束、拆分序列须按数据迁移可行性排序", level: soft}
      - {target_aspect: 3, constraint: "数据契约的 schema 与语义条款（单位/值域/空值/敏感性/新鲜度）由本方面供给", level: hard}
      - {target_aspect: 5, constraint: "一致性模型 → 协调模式可行集：跨所有者强一致需求 → Saga + 业务补偿，或回溯方面 1 重审部署风格（Y6 的下游消费路径）", level: hard}
      - {target_aspect: 6, constraint: "一致性级别声明与新鲜度条款 → 质量判定的代价计入项", level: soft}
      - {target_aspect: 8, constraint: "不变式 → 对账验证项；血缘 → 派生数据可重建性测试；边界校验 → 契约测试的数据面", level: soft}
      - {target_aspect: 9, constraint: "数据漂移守护对象：schema 漂移（实际 schema 偏离注册契约）、所有权违例（绕过所有者的直写流量）、共享写例外超期", level: hard}
      - {target_aspect: 10, constraint: "机器层：Y 谓词集 + 血缘图；人类层：覆盖谓词子集 {Y 谓词集、血缘} 的投影视图（受众问题 = 数据所有权与流动；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: CSL-001-AP1
        description: "跨单元强一致作为默认一致性手段（4.2.3 降级纪律禁项 (i) 全局强一致幻觉）"
        detection_predicate: "∃ D1, D2, M1, M2: dataset(D1) ∧ dataset(D2) ∧ owner(D1, M1) ∧ owner(D2, M2) ∧ ¬(M1 = M2) ∧ [跨 D1、D2 的强一致协调为默认手段（2PC 类）]"
        signal_level: P0               # Y6 硬性质违例的直接来源 ＋ 1.2.5 硬冲突行登记（MJ-4 P0 判据：硬性质 + 冲突矩阵双据）；方括号内为待勘察事实（协调形态，M15 勘察义务）
    formal_anchor:                     # 交叉表源：4.5 可验证性质 / 2.5 W 系列 / 1.5 V 系列
      - {property_id: Y3, role: implements}     # 级别显式声明 + 业务语义论证 + 与方面 6 目标相容（三合取项）
      - {property_id: Y6, role: triggers}       # cross_owner_strong_consistency_requirement → conflict_signal(saga_candidate ∨ reopen(aspect1))
      - {property_id: V3, role: consumed_by}    # 1.2.5 硬冲突行经 compatibility 登记后由 V3 消费（对侧 STY-016 为 triggers）
      - {property_id: W4, role: consumed_by}    # 「所有者单元内部默认」的判定以数据单一所有者为前提（W4 的数据域投影 = owner）
    references: []                     # G-CSL-1：书目 35 的登记面为「4.2.3 一致性模型谱系」（表级），未指向本行；不得扩张至行级（M6 + 0.17.7 门槛 6）
    narrative:
      benefit_cost_analysis: "收益：语义最强——线性化与写后读保证使并发推理退化为顺序推理，业务硬规则可在存储层直接成立（4.6 示例二：预扣使超卖在存储层不可能）；在所有者单元内部由单存储本地事务承载，无额外协调代价。代价：跨所有者单元时本级别从『保证』变为『冲突信号』（Y6）——2PC 类协调同时推高可用性风险、变更前置时间与故障面，1.2.5 已将『微服务 × 跨单元 2PC 作为默认一致性手段』登记为硬冲突行；母本只给两条出路：Saga + 业务补偿（CSL-005），或回溯方面 1 重审部署风格。1.3 的预算侧结论同向：强一致需求 → 收缩分布范围，微服务降权。"
      typical_scenarios: "所有者单元内部的默认级别（4.2.3 选择条件列）；业务硬规则要求存储层不可能性的场合（4.6 示例二的预扣模式）；单存储本地事务边界内的写后读保证；Y6 触发前的基线形态（尚未跨所有者单元）。"
      common_misuse: "把强一致当全局默认（降级纪律禁项 (i)：一切都要 ACID，跨单元时引爆 2PC）；以跨单元 2PC 规避所有权定案或部署风格重审（Y6 两条出路都不走）；把级别声明当形式而不附业务语义论证（Y3 违例；未声明同为违例，4.2.3 节首）；以本级别承载跨单元长流程（应走 CSL-005 补偿一致）。"

