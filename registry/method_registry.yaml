        - {source_type: row_id, value: "1.2.3-共享数据", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "3", verified: true}
    typical_reversibility: costly      # 人工判断：隐式契约一旦扩散，解除共享须重建显式接口
    applicability:
      problem_space:
        - "[场景限于批处理交接或配置分发等弱耦合] ∨ has_approved_exception(STY-006, ·, ·)"   # 骨架源：「仅限：批处理交接、配置分发等弱耦合场景」；例外覆盖机制见 1.2.5
