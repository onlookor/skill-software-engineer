      - {bib_id: 20, support_claim: "端口-适配器（六边形）风格的源头定义与端口/适配器职责划分（母本登记：1.2.1 端口-适配器源头；本地提取以 2025 专著为准，2005 文章仅作历史出处标注）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：核心可脱离适配器单测（可测试性↑↑）、外部技术可替换（可替换性↑），替换的触达单元数被端口边界收敛；代价：间接层成本（每个端口一次分派与一层契约维护），且端口若退化为框架接口转发，收益即归零。母本将本风格与整洁/洋葱并列为『依赖方向控制族』，并明示该族与任何顶层风格可叠加。"
      typical_scenarios: "外部技术栈易变或多样（存储/消息/第三方 API 可替换）、核心业务规则值得长期保护、需要以测试替身驱动核心验证的场景。"
      common_misuse: "把端口当作框架接口的别名（无语义翻译）；在核心中直接引用适配器类型或其异常；为小型/短生命周期系统引入全量端口-适配器间接层（间接层成本无对应收益）。"

