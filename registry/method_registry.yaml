      failure_modes: ["易变性评估缺失仍按 S5 切分（2.2.1 主导驱动空间列明文「该输入缺失时 S5 不可用」→ FM-1 事实缺失面）", "把 unknown 静默读作 false 而排除本候选（M15 违例；正例 20-1 级联记录明示：若静默排除本应触发 FM-3 并丢失 DEC-05 的合法评估）", "按流程步骤而非『什么会变』封装（2.2.2 信息隐藏判据违例）", "推迟分支未在最后负责时刻前兑现参数化隔离（2.6 示例二：LRM 一过逆转成本转 costly）", "可推翻指标未接入方面 9 演化观测（2.6 示例二消费字段「volatility 数据源=方面 9 演化观测（G9）」）"]
      consistency_impact: "本策略不改变数据所有权与一致性边界：分解边界 = 数据所有权边界（2.4 施→4 硬，即 W4）仍由 S4 承载；易变性分离若横跨数据写路径，须以 S4 复核归属后再定一致性形态（方面 4 的 Y 系列判定，CSL/CRD 批承载），本条目不重复登记"
      observability_requires: ["变更频率观测在案且接入方面 9 演化观测（G9，2.6 示例二消费字段）", "可推翻指标的假设值与 N 参数注册可查（2.6 示例二：某区域实际变更频率 > 假设值 N 倍，N 默认 3）", "重审提议的立案记录可查（G8 自动重审触发面；正例 20-1 消费字段『CA-11.可推翻指标 → G8 自动重审』）"]
      ops_cost: "[易变性分离的运维成本主要是可推翻指标的持续治理：注册假设值、按窗口观测漂移、越阈即立案重审（2.6 示例二）；母本未给成本量化式 → 方括号占位并按单元逐项计（MJ-19 (iii) 同型）]"
      skill_prerequisites: ["需求易变性评估（2.3 问题空间驱动第二行；S5 可用性的唯一门控输入）", "信息隐藏判据应用（2.2.2：按『什么会变』封装）", "保守界处置与可推翻指标登记（CH-B1，2.2.3 准则二同型：保守假设 ADR + 可推翻指标，不阻塞）", "演化观测数据接入（G9，方面 9）"]
      aggregation_semantics: itemwise  # 母本未给 DEC 的跨单元聚合式（MJ-19 (iii) 同型：不本地造法）→ 代价按易变区域逐项评估（MJ-20 (vi)）
    compatibility: []                  # 母本无本策略与他策略的明文组合冲突对；2.6 示例二推迟分支的「先按稳定判据（S1/S2）切，高频区域参数化隔离」是同一次分解内的处置次序而非策略兼容性对，不得读作与 DEC-001/DEC-002 的 composable 登记（MJ-9：只登记母本有明文依据的对；判读见 MJ-20 (vii)）→ 互斥不枚举，见 MJ-5/MJ-9
    constraints_imposed:               # 交叉表源：2.4「施加约束」表（方面 2 全体七行，DEC 八条逐字相同）
      - {target_aspect: 1, constraint: "分解边界候选 → 部署单元风格可行集（对偶回馈：语义边界不清晰时分布式风格降权）", level: soft}
      - {target_aspect: 3, constraint: "分解边界 = 契约边界；按业务领域分解时，限界上下文间契约必须显式建模（上下文映射）", level: hard}
      - {target_aspect: 4, constraint: "分解边界 = 数据所有权边界（每个数据集合有且仅有一个所有者单元，即 W4）", level: hard}
      - {target_aspect: 5, constraint: "单元内编排自由；跨单元协调必须显式建模（禁止隐式跨单元时序假设）", level: hard}
      - {target_aspect: 6, constraint: "分解粒度 → 一致性/性能/可修改性包络（跨单元事务代价项随跨边界交互数增长）", level: soft}
      - {target_aspect: 8, constraint: "每个分解单元必须是一个可独立验证的单元；否则粒度停止准则违反 → 发回溯约束声明（CH-E）", level: hard}
      - {target_aspect: 10, constraint: "机器层：2.5 边界谓词集；人类层：覆盖谓词子集 {2.5 边界谓词集} 的投影视图（记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: DEC-005-AP1
        description: "易变性评估缺失或无出处仍按 S5 切分（把 unknown 当作 false）"
        detection_predicate: "∃ M, D: unit(M) ∧ hides(M, D) ∧ volatility(D, [rate 无出处]) ∧ ¬sourced([需求易变性评估])"
        signal_level: P1               # 违反 2.2.1 主导驱动空间列的定义性门控（「该输入缺失时 S5 不可用」）但无 W/X/Y/Z 硬性质可绑定（W1/W2/W4 判的都不是易变性输入）→ P1（MJ-4 判据）。另触 FM-1 与 M15 静默排除面：正例 20-1 级联记录明示静默排除本应触发 FM-3 并丢失 DEC-05 的合法评估——该两面由 0.20/0.18.6 承载，不在此重复计级
      - pattern_id: DEC-005-AP2
        description: "保守界假设被实测推翻但未立案重审（可推翻指标失效）"
        detection_predicate: "∃ M, D: unit(M) ∧ hides(M, D) ∧ volatility(D, rate) ∧ [实测变更频率 > 假设值 × N（N 为注册参数，母本默认 3；接入方面 9 演化观测 G9）] ∧ ¬[重审提议已立案]"
        signal_level: P2               # 阈值 + 趋势窗口双判据（2.2.4 告警治理同型：绝对值越阈且连续 N 个窗口同向漂移才告警，单点越阈只记录不告警）；母本逐字数值「N 默认 3」按 MJ-19 (ii) 参数化引用，不得写死为唯一界（MJ-20 (iv)）
    formal_anchor:
      - {property_id: W1, role: consumed_by}     # ∀M: seam(M)（2.5）
      - {property_id: W2, role: consumed_by}     # 2.4 施→8：每个分解单元必须是一个可独立验证的单元
      - {property_id: W3, role: consumed_by}     # 2.3 交付空间驱动：S6 过滤器横切适用（条件硬）
      - {property_id: W7, role: consumed_by}     # 2.3 双使用者条款：主策略选择走批准路径；保守界假设另须记保守假设 ADR（2.2.3 准则二同型）
      # 不锚 W6：2.5 的 W6 公式面为 interface_cost(M) > cohesion_gain(M) → tech_debt_flag(M)（接口/实现比劣化），
      # 与本策略的 volatility 面不同源；7.x 走查文本中的「W6.volatility 硬绑定」属方面 7 的绑定形态而非 2.5 的公式面
      # → 不得据走查文本反向扩张 formal_anchor（判读见 MJ-20 (ii)）
    references:
      - {bib_id: 15, support_claim: "为变化而设计；S5 的理论依据（母本 5.7 书目 15 行级登记提取面逐字对应，本条为该行级面的直接承载者）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 14, support_claim: "2.2.2 信息隐藏判据；2.5 谓词 hides/volatility 的理论源头（母本 5.7 书目 14 行级登记提取面逐字对应）——本条引用依据为 2.2.2 信息隐藏行明文「S5 正是此判据的操作化」：判据的行级面经母本明文点名本策略，不属表级面下探（判读见 MJ-20 (v)）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：八策略中唯一以『什么会变』为主驱动的策略（2.2.2 信息隐藏行明文「S5 正是此判据的操作化」），高频变更的触达单元数上界为 1，稳定单元免于易变性波及；主输入缺失时有明文出路（2.6 示例二两分支：保守界 或 推迟＋参数化预留提取点），不因证据不足而阻塞。代价：主输入（需求易变性评估）须过 0.4 门槛，缺失即本策略不可用（2.2.1 主导驱动空间列明文），是八策略中输入门控最严的一条；保守界分支须持续治理可推翻指标（注册假设值、按窗口观测漂移、越阈即立案重审），治理成本随观测期累积；易变性边界不是数据所有权边界，横跨数据写路径时仍须以 S4 复核（2.4 施→4 硬，即 W4）；过最后负责时刻（第一个大版本发布前）后逆转成本由 bounded 转 costly。"
      typical_scenarios: "需求易变性评估在案、且版本库演化观测可提供变更频率事实的场合（2.3 问题空间驱动第二行；2.6 示例二）；易变点集中且与稳定核分界明显的系统；棕地系统中已观测到某区域高频改动的场合（volatility 数据源＝方面 9 演化观测 G9）；须为『尚不知道哪里会变』预留提取点的推迟分支场合（2.6 示例二：先按稳定判据切，高频区域参数化隔离，最后负责时刻 = 第一个大版本发布前）。"
      common_misuse: "易变性评估缺失或无出处仍按 S5 切分（AP1；2.2.1 明文该输入缺失时 S5 不可用）；把 unknown 静默读作 false 而排除本候选（M15 违例，正例 20-1 级联记录明示其后果）；按流程步骤而非『什么会变』封装（2.2.2 信息隐藏判据违例）；把母本示例的「N 默认 3」写死为唯一界而不注册为参数（MJ-19 (ii)：母本逐字数值可引但须参数化）；保守界假设被实测推翻却不立案重审（AP2）；以易变性分离替代数据归属定案（W4 仍横切适用，2.4 施→4）。"

