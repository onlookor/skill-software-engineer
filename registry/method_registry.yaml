      - {target_aspect: 5, constraint: "一致性模型 → 协调模式可行集：跨所有者强一致需求 → Saga + 业务补偿，或回溯方面 1 重审部署风格（Y6 的下游消费路径）", level: hard}
      - {target_aspect: 6, constraint: "一致性级别声明与新鲜度条款 → 质量判定的代价计入项", level: soft}
      - {target_aspect: 8, constraint: "不变式 → 对账验证项；血缘 → 派生数据可重建性测试；边界校验 → 契约测试的数据面", level: soft}
      - {target_aspect: 9, constraint: "数据漂移守护对象：schema 漂移（实际 schema 偏离注册契约）、所有权违例（绕过所有者的直写流量）、共享写例外超期", level: hard}
      - {target_aspect: 10, constraint: "机器层：Y 谓词集 + 血缘图；人类层：覆盖谓词子集 {Y 谓词集、血缘} 的投影视图（受众问题 = 数据所有权与流动；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: STP-002-AP1
        description: "以共享数据库实现服务间集成（分布式单体信号）"
        detection_predicate: "∃ u1, u2, D: dataset(D) ∧ access_path(D, u1, ·, ·) ∧ access_path(D, u2, ·, ·) ∧ [u1 与 u2 为独立部署单元] ∧ [二者的集成语义经 D 的读写实现]"
        signal_level: P0               # 1.2.3 共享数据行反模式列明文「以共享数据库实现服务间集成（分布式单体信号）」；同时构成 Y1（单一所有者，4.5 硬）违例的直接来源 → P0（MJ-4 判据）
      - pattern_id: STP-002-AP2
        description: "schema 级隔离缺失或穿透（多模块直访同一 schema）"
        detection_predicate: "∃ D, u1, u2: dataset(D) ∧ access_path(D, u1, ·, ·) ∧ access_path(D, u2, ·, ·) ∧ ¬[u1 与 u2 属同一模块] ∧ ¬[存在 schema 级隔离声明]"
        signal_level: P1               # 违 1.2.2 模块化单体行的定义性约束「内部强制模块边界」与 4.2.2 第三列「推荐 schema 级隔离」，但 4.5 Y 系列无对应性质可绑定 → P1，限期整改，超期升 P0（MJ-4 判据）
      - pattern_id: STP-002-AP3
        description: "拆分缝逐版本固化：跨 schema 依赖上升而无收敛计划"
        detection_predicate: "∃ D1, D2: dataset(D1) ∧ dataset(D2) ∧ [D1 与 D2 分属不同隔离 schema] ∧ [跨 schema 依赖数随版本单调不减] ∧ ¬[存在收敛计划与最后负责时刻]"
        signal_level: P2               # 需阈值 + 趋势窗口双判据的结构漂移线索（MJ-4）：4.2.2 第三列「为未来拆分保留缝」的失效非即时性质违例，其代价在拆分时显形；「最后负责时刻」取 4.2.1 共享写行的既有登记项，不新造命题
    formal_anchor:                     # 交叉表源：4.5 可验证性质 / 2.5 W 系列
      - {property_id: Y1, role: consumed_by}    # 单一实例下所有权以 schema 隔离域为粒度声明，Y1 的 |{M : owner(D, M)}| = 1 检查在该粒度求值
      - {property_id: Y6, role: consumed_by}    # 本地事务可得性掩盖跨单元强一致需求 → Y6 冲突信号检查须以隔离域为单位求值，否则漏检
      - {property_id: W4, role: consumed_by}    # 分解层数据单一所有者检查（4.4 接收约束：方面 2 软）
    references: []                     # G-STP-1：4.7 书目 35–43 无 4.2.2「共享数据库」行的行级登记提取面（35/36/39 → 4.2.3 一致性模型；37/38 → 本表另两行；40 → Y7 可重建性〔节级〕；41 → 4.2.1 数据产品；42/43 → 4.2.4）→ 按「表级/节级面不下探」纪律不扩张；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）
    narrative:
      benefit_cost_analysis: "收益：运维面最小（单一实例）、访问路径无网络跳、本地事务使强一致在技术上可得，是单体风格的自然存储形态；schema 级隔离使模块化单体的模块边界在存储面有可检出的落点，并为未来拆分保留缝（4.2.2 第三列）——这是本行相对「单一 schema 混用」的关键价值。代价：单一实例即全局故障域（1.2.2 单体行「一次故障全局倒」）；1.2.3 共享数据行把「时间耦合与隐式契约」列为默认代价，隔离一旦穿透，隐式契约无登记面、变更即破坏；本地事务的可得性会掩盖跨单元强一致需求，使 Y6 冲突信号推迟到拆分期才显形（CH-E 回溯成本最高的一类）；升级/容量变更须全体访问单元同时停机。适用面须严守 1.2.3 共享数据行的「仅限：批处理交接、配置分发等弱耦合场景」——以共享库做服务间集成是明文反模式。"
      typical_scenarios: "单体风格的存储形态（4.2.2 第三列「可用」）；模块化单体以 schema 级隔离承载模块边界并保留拆分缝（同行「推荐」；1.2.2 模块化单体行）；棕地遗留系统数据无法干净归属时的现状锁定形态（0.11 接受约束 ADR；4.3 现状空间驱动）；遗留迁移过渡期的共享写例外（4.2.1 共享写行：退出计划 + 最后负责时刻）；批处理交接与配置分发等弱耦合集成场景（1.2.3 共享数据行适用条件列）。"
      common_misuse: "以共享数据库实现服务间集成（AP1，1.2.3 反模式明文）；把「模块化单体推荐」读作无需可检出的隔离声明（AP2）；允许跨 schema 外键/存储过程而无收敛计划（AP3，拆分缝固化）；共享写常态化而不登记例外与最后负责时刻（4.2.1 共享写行）；把本地事务可得性当作「无跨单元一致性问题」的证据（Y6 漏检）；以「运维面最低」为选型理由而不计入变更协调与拆分难度代价；为负向延迟节约填具体数值当作收益（0.4＋6.2.1 量化纪律）。"

