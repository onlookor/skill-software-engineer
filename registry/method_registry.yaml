        - "[外部技术栈易变或多样]"
        - "[核心逻辑值得长期保护]"
      current_space: []                # 母本本行未给现状空间条件（G-STY-1）
      delivery_space: []
    envelope:
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "外部技术替换 → touched_units = |adapters(port)| 且 touched_units(core) = 0（核心不依赖任何外部技术）；成本项 = +|ports| 的接口定义与维护量（间接层成本）"   # 骨架源：「可替换性↑；间接层成本」
        source: {source_type: row_id, value: "1.2.1-六边形（端口-适配器）", verified: true}
