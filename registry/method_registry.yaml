    formal_anchor:
      - {property_id: Z3, role: implements}      # 每步有出路（确认/释放两条出路 + 超时自动释放）
      - {property_id: Y6, role: consumed_by}     # 跨所有者强一致冲突的出路之一（5.4 接收约束方面 4 行：Saga/预扣）
      - {property_id: Z4, role: consumed_by}     # 超时预算闭合界消费预扣超时值
      - {property_id: Z7, role: consumed_by}     # 卡片被方面 6 消费且不得违反包络
    references: []                     # 书目 36 的登记面为 4.2.3 表行（CSL-005 已承载），按 G-CSL-1 同型纪律「表级面不下探」不扩张至 5.2.2 行；书目 47 的登记面为 Saga 两行，不含预扣/预留行 → 本条留空并登记 G-CRD-1，待人工裁决补勘文献来源后回填（SO-7）
    narrative:
      benefit_cost_analysis: "收益：在存储层排除超卖而不需跨单元原子提交（4.6 示例二的下限合法性来源：预扣使超卖在存储层不可能 ∧ 可见性损失有界），延迟界为两次本地原子操作之和，优于分布式提交形态；与 Saga 并列为跨所有者强一致需求（Y6 冲突信号）的正向出路（5.4 接收约束方面 4 行）；逆转成本有界（预扣语义以契约条款为界，改动面限于本单元与资源所有者单元）。代价：窗口期内被预扣资源对展示层不可用（4.6 示例二的牺牲），须论证可见性损失有界；预扣必须有超时自动释放（5.2.2 关键设计规则列「防泄漏」，Z3 每步有出路），否则资源泄漏；超时值是契约条款而非实现细节（变更须触及资源消费方，跨边界契约变更数 ≥ 1）；预扣记录受 Y1–Y8 全约束且所有者 = 资源所有者单元（5.4 施→4），须承担泄漏巡检与对账运维。"
      typical_scenarios: "资源竞争需在存储层排除超卖（4.6 示例二：库存单元预扣 + 订单单元确认/释放）；Y6 冲突信号触发后与 Saga 并列的处置路径（5.4 接收约束方面 4 行）；全局原子性不可得而业务硬规则要求终态正确的场合；可见性损失可接受且有界的资源预留场景。"
      common_misuse: "预扣无超时自动释放（AP1，资源泄漏 → Z3 违例）；超时值留在实现里而不入契约条款（AP2，可见性损失失去有界性依据）；确认/释放路径缺失导致预扣永久占用（Z3 违例）；以预扣替代所有权定案或部署风格重审（跨单元原子性需求应先经 Y6 审查，CSL-005 同型）；把预扣记录当作绕过所有者的直写通道（违 5.4 施→4：所有者 = 资源所有者单元）。"

