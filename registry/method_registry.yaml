      skill_prerequisites: ["按「访问路径是否唯一经所有者」判定形态合规（4.2.2 第三列判据句）", "私有 schema 与私有实例两形态的取舍（同行原文：均可）", "跨单元一致性的补偿建模（4.2.3 补偿一致行；方面 5 Saga）"]
      aggregation_semantics: itemwise
    compatibility:
      - peer_entry: STY-016            # 方向：风格 → 存储拓扑（1.4 施→4 微服务行「每服务自有数据库为默认」）。ENUM_RELATION 无 required_by → 在被施侧以 composable 登记；「默认 + 偏离须显式记录」不是构成性必需（第三列「私有 schema 或私有实例均可」），故不取 requires。STY-016 已发布且其 constraints_imposed 已含本行明文 → 按 MJ-5 镜像纪律不回填（0.22 承诺一）
