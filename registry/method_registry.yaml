      - {target_aspect: 1, constraint: "匹配度排序不得替代规程其余步骤：不得增步、跳步、改序、在步骤内引入规程外判据（0.18.3 纪律 1，规程偏离 = FM-14）；排序结果仍须过 S4 包络校验、S5 不可区分处置与纪律二批准", level: hard}
      - {target_aspect: 10, constraint: "机器层：逐候选求值记录与得分入 selection_log / step_log（偏离检测 = 步骤序列 vs 规程 schema 静态比对）；人类层：排序表与被拒候选须可投影（ADR 被拒候选节引用）", level: hard}
    anti_patterns: []                # 母本 1.2.4 表无「典型反模式」列（块头通用说明一）；纪律一违例（开放生成）为规程级守护对象，不在本条目重复登记（禁造规范）
    formal_anchor:
      - {property_id: V5, role: triggers}     # 风格定案属高影响决策（纪律二）；V3 的登记位见块头通用说明七
    references: []                   # 母本未给本行登记提取面：书目 12/13 的登记面分别限定于「质量属性驱动的风格选择元方法（1.2.4）」与「演进式元方法（1.2.4）」；书目 1 的登记面为 1.2.1 词汇表；均不含模式匹配。候选书目 2（登记面「风格对比与架构决策方法」，未限定行）母本未指向 1.2.4 → 不擅自扩张解释面（M6）；与 STY-021 同登记为文献缺口 → gaps: G-STY-5
    narrative:
      benefit_cost_analysis: "收益：把风格选择变成可机器执行的匹配问题——问题特征向量 × 各风格条目的适用条件谓词 → 匹配度排序，使『候选从何而来』有唯一合法答案（注册表条目），从而封死 Agent 凭训练语料流行度自由提案的路径；这也是纪律一（防幻觉第一守卫）在方法层的执行形态。作为其他四个元方法的子步骤统一执行，它让约束排除、质量属性驱动、领域驱动、演进式的候选筛选共用同一套求值与留痕机制。代价：结论质量完全取决于两个输入面——特征向量的事实必须过出处门槛，适用条件谓词必须可求值；谓词所需事实缺失时只能标 unknown（候选保留 + 勘察义务），因此本方法常产出『待定』而非『定案』；匹配度排序不是可达性判定，包络校验（S4）与批准（纪律二）一步都省不掉；权重带不确定区间，得分接近时禁止按名义分择一。"
      typical_scenarios: "任何风格选型决策点（0.18.1 全覆盖）的候选装配与排序、Agent 执行的选型（强制步骤）、作为 @1391 典型链的第三步（属性求交后的匹配度排序）、需要为 ADR 被拒候选节提供逐候选求值记录的场合、注册表条目扩充后的候选面复核（0.17.6 种子重验证联动）。"
      common_misuse: "开放生成候选或引入注册表外风格（纪律一违例）；把 unknown 当 false 处理造成沉默排除（S1 明示『未知 ≠ 假』）；特征向量混入无出处事实（FM-1）；以匹配度最高即定案（跳过 S4/S5 与纪律二批准）；得分差在传导不确定区间内仍按名义分择一（假精确，须走 CH-B 三择）；在步骤内引入规程外判据或改序（FM-14）。"

