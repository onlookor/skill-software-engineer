  - obligation_id: SO-6
    kind: 决策期（汇总义务）
    obligation: "条目内全部方括号事实占位（三空间条件、平台参数、粒度阈值等）在选型时逐条求值：真/假/未知三值记录入 selection_log；未知者候选保留并登记勘察任务（M15），禁沉默排除；无出处阈值禁填（0.17.7 门槛 2）。逐占位符枚举与计数由 project.py 生成 projections/勘察义务清单.md，本节只登记汇总义务本身。"
    gap_ref: "README §3.3 事实占位符约定；VG-02"
    consumer: "0.18.2 S1/S4；0.18.6 M15；0.20.2 FM-1"
    trigger_rule: "M15（unknown → 候选保留 ∧ 勘察义务登记）"
    status: open
