    applicability:
      problem_space:                   # 骨架源：4.2.2 第三列「与风格的关系」原文
        - "事件溯源风格的存储形态（4.2.2 第三列；1.2.3 定义列「状态以事件日志为准（溯源）」）"
        - "审计/时间旅行需求的主要候选（4.2.2 第三列；1.2.3 适用条件列「审计要求、时间旅行调试、读写负载特征悬殊」；4.3 问题空间驱动同旨）"
      current_space:                   # 交叉表源：4.3 现状空间驱动「存储引擎锁定 → CDC 可行性」
        - "[既有事务日志或事件日志可作为权威源（4.2.4 CDC 行「日志格式耦合存储引擎」＝现状空间勘察项；4.3 现状空间驱动）]"
      delivery_space:                  # 交叉表源：1.3 交付空间驱动「运维能力」行明文
        - "[运维能力覆盖事件基础设施（1.3 交付空间驱动明文：无人值守/低运维能力 → 排除重运维风格〔自建服务网格、复杂事件基础设施〕）]"
    envelope:                          # 骨架源：4.2.2 第二列「状态以事件日志为准，物化视图为派生」＋1.2.3 包络列「完整历史↑、读模型自由优化；复杂度↑↑、事件 schema 演化难」
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
