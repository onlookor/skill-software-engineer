        evidence: {source_type: row_id, value: "5.2.1-混合（宏观编排 + 微观协同）", verified: true}   # 定义列「域内响应用事件协同」→ 微观侧须以事件驱动（发布订阅）为前提；MJ-14：母本叙述中的「事件协同」即 5.2.1 表的「协同（choreography）」
    constraints_imposed:               # 交叉表源：5.4「施加约束」表（方面 5 全体七行，CRD 八条逐字相同）
      - {target_aspect: 1, constraint: "协调需求在既定风格下不可行 → 回溯约束声明（CH-E 原型通道，阻塞式）", level: hard}
      - {target_aspect: 3, constraint: "协调模式产生的新交互 → 契约登记需求（编排者与参与者间的命令契约、事件契约）", level: hard}
      - {target_aspect: 4, constraint: "流程状态（协调者状态机、Saga 日志、预扣记录）是数据集合，受 Y1–Y8 全约束——流程状态的所有者 = 协调者单元", level: hard}
      - {target_aspect: 6, constraint: "质量影响卡片 → 行为级包络校验输入；卡片是方面 6 的强制消费项（Q 系列将引用）", level: hard}
      - {target_aspect: 8, constraint: "行为验证要求：事件回放、乱序/重复/丢失注入、补偿路径测试、超时与断路行为测试、（风格允许时）混沌注入", level: conditional}   # 5.4 级别列原文「软/硬按风格（事件驱动 → 回放与乱序注入必备，承接 1.4）」；本条目微观侧为事件驱动 → 回放与乱序注入在本条目上取硬（MJ-4 同型判读）
      - {target_aspect: 9, constraint: "协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化", level: hard}
      - {target_aspect: 10, constraint: "机器层：Z 谓词集；人类层：覆盖谓词子集 {Z 谓词集} 的投影视图（受众问题 = 行为与协调的时序、事件流与流程状态；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: CRD-004-AP1
        description: "跨域主流程未集中留痕（合规域落在微观协同侧）"
        detection_predicate: "∃ F: interaction_flow(F, ·, hybrid) ∧ [F 含合规域子流程] ∧ ¬∃ M: orchestrator(F, M)"
        signal_level: P0               # Z1（跨单元交互显式建模）＋ 5.4 接收约束外部强加行（合规流程要求如支付类强制审计轨迹，硬）双据 → 检出即阻塞（MJ-4 P0 判据）
      - pattern_id: CRD-004-AP2
        description: "边界处契约密度不足（隐式跨域时序假设）"
        detection_predicate: "∃ F, u1, u2: interaction_flow(F, ·, hybrid) ∧ unit(u1) ∧ unit(u2) ∧ depends_on(u1, u2, ·, ·) ∧ ¬[u1、u2 间的边界交互有注册契约]"
        signal_level: P1               # X1 硬性质的 covers 谓词未登记（predicate_vocabulary VG 系列同型）→ 词汇补齐前无法机器求值，按 MJ-12 取 P1 并留占位；补齐后升 P0
    formal_anchor:
      - {property_id: Z1, role: implements}      # 跨单元交互显式建模（宏观侧集中留痕的落点）
      - {property_id: Z8, role: implements}      # 宏观编排者状态持久化 ∧ 可恢复
      - {property_id: X1, role: consumed_by}     # 5.4 施→3：命令契约与事件契约同时进入契约注册
      - {property_id: Z7, role: consumed_by}     # 两种卡片的并集被方面 6 消费
    references:
      - {bib_id: 44, support_claim: "编排与事件驱动协作并存的分类面（混合形态的两侧实现手段来源）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：合规域的集中留痕与开放域的单元自治可同时满足（5.2.1 适用条件列），避免为全域统一形态而在某一侧付出过高代价；宏观流程有单一集中观测点，微观域内响应无需经中央中转，延迟与可用性界在两侧各取其优。代价：追踪覆盖率按 min（两侧） + 边界项给出，由较弱一侧决定，观测口径必须统一否则并集不可拼接；边界划分新增契约登记面（5.4 施→3 命令契约与事件契约并存），跨边界契约变更数不低于宏观侧与边界处之和；运维成本为两种形态之和并加边界治理成本（编排者高可用 Z8 + 事件回放验证 5.4 施→8）；边界划分一经定案即决定契约密度分布，逆转须重划域边界（costly）。"
      typical_scenarios: "同一系统内并存合规域（支付/审计类，5.4 外部强加行）与开放域（各单元自治演进）；宏观流程需集中监控而域内响应用事件协同即可（5.2.1 定义列）；既有编排器运行时与事件基础设施并存（0.11 现状锁定）；单元自治要求与审计要求同时成立且不可归一的场合。"
      common_misuse: "把合规域放进微观协同侧（无集中留痕，AP1 → 5.4 外部强加行硬违例）；边界处不登记契约而依赖隐式时序假设（AP2，5.4 施→9 守护对象）；两侧观测口径不一致导致追踪并集不可拼接（覆盖率界失效）；以混合形态回避域边界定案（边界划分是本条目的前提而非产物）；宏观编排者状态只存内存（Z8 违例）。"

  - entry_id: CRD-005
    kind: CRD
    name: "Saga（编排式）"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-CRD-01）
    provenance:
      origin: hybrid                   # 骨架=5.2.2 表行＋界形参数化与谓词转写（manual，MJ-2 同型）
      source_pointers:
        - {source_type: row_id, value: "5.2.2-Saga（编排式）", verified: true}
        - {source_type: clause_id, value: "5.2.2", verified: true}   # 步骤三分类纪律（compensable/retriable/pivot）＋关键设计规则列
        - {source_type: clause_id, value: "5.2.5", verified: true}
        - {source_type: clause_id, value: "5.3", verified: true}
        - {source_type: clause_id, value: "5.4", verified: true}
        - {source_type: clause_id, value: "5.5", verified: true}     # Z3/Z7/Z8 与 saga/step_class/compensation/idempotent 谓词来源
        - {source_type: clause_id, value: "4.2.3", verified: true}   # 补偿一致（业务级）→ CSL-005 的 requires 对侧（MJ-17 (iii)）
        - {source_type: clause_id, value: "4.6", verified: true}     # 示例二：扣库存 + 建订单
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: 47, verified: true}
    typical_reversibility: costly      # 人工判断：步骤三分类与补偿动作一经流程消费即形成业务依赖（对账、补偿编排、Saga 日志均以此为前提），逆转须重设流程而非仅改协调实现
    applicability:
      problem_space:                   # 骨架源：5.2.2「适用条件」列原文
        - "跨单元长流程且各步可在业务上定义补偿动作（5.2.2 适用条件列）；全局原子性不可得而终态正确必须达成（Y6 冲突信号的正向出路，4.2.3）"
        - "[步骤数多或需集中留痕 → 编排式而非协同式（5.2.2 关键设计规则列的对偶判据）]"
      current_space:                   # 骨架源：5.2.2「实现手段」列（编排器 + Saga 日志）
        - "[编排器运行时与 Saga 日志存储在案（协调者状态持久化的现状前提，Z8）]"
        - "[各参与单元的本地事务边界可识别且补偿动作有业务落点（4.2.3 现状勘察面，CSL-005 同源）]"
      delivery_space:                  # 骨架源：5.4 施加约束方面 8 行（补偿路径测试）
        - "[补偿路径测试与超时/断路行为测试能力在案（5.4 施→8 行为验证要求）]"
        - "[Saga 日志的运维值班与对账能力在案（流程状态所有者 = 协调者单元，5.4 施→4）]"
    envelope:
      - metric: "可用性目标（SLO）"
        bound_expr: "终态可达界 = ∧_{步骤} 有出路：∀ saga step: step_class ∈ {compensable, retriable, pivot} ∧ (compensable → ∃ compensation ∧ idempotent) ∧ pivot_ordering_valid（Z3 逐字界形）→ 长流程终态正确的服务质量界"
        source: {source_type: clause_id, value: "5.5", verified: true}
      - metric: "延迟分位数 P99"
        bound_expr: "P99（Saga） = Σ 各步骤卡片 latency_budget_delta + 步骤自身业务耗时 + 逆序补偿上界（∃ 失败时按 pivot 逆序逐步补偿）→ 补偿路径的延迟不劣于正向路径（5.2.5 Σ 消费路径）"
        source: {source_type: clause_id, value: "5.2.5", verified: true}
      - metric: "可修改性：变更前置时间"
        bound_expr: "lead_time（流程变更） ≥ lead_time（需重判步骤的重分类） → 步骤三分类一经定案即约束补偿动作与关键步排序（Z3），变更前置时间以需重判步骤数为下界"
        source: {source_type: row_id, value: "5.2.2-Saga（编排式）", verified: true}
    cost_profile:
      latency_budget_delta: "= Σ 各步骤卡片 latency_budget_delta + 编排器推进开销 + 逆序补偿上界（5.2.5 明文：每个行为/协调模式条目必须携带卡片；补偿路径按 Σ 聚合）"
      failure_modes: ["步骤三分类不明即上线（5.2.2 步骤分类纪律：分类不明 = Z3 违例 = 阻塞）", "可补偿步缺补偿动作或补偿动作非幂等（Z3 违例，重试放大）", "关键步（pivot）之前留有不可补偿步骤（pivot_ordering_valid 失效）", "编排器状态或 Saga 日志未持久化（Z8 违例，崩溃即流程丢失）"]
      consistency_impact: "终态正确而非过程原子（4.2.3 补偿一致语义）；Saga 日志是数据集合，受 Y1–Y8 全约束，其所有者 = 编排器单元（5.4 施→4 硬）；本条目是 CSL-005（补偿一致，业务级）在方面 5 的协调形态实现，级别选择的逆转成本由 CSL-005 承载，本条目不重复计入"
      observability_requires: ["Saga 步骤状态、step_class 与补偿动作可查（saga / step_class / compensation 谓词在案，5.5）", "Saga 日志持久化且可回放（Z8 + 5.4 施→8 补偿路径测试）", "卡片 observability_requires 不得退化（5.4 施→9）"]
      ops_cost: "[随步骤数与补偿分支数上升；须承担补偿编排正确性的验证成本与 Saga 日志的对账运维（Z3 每步有出路）]"
      skill_prerequisites: ["步骤三分类（compensable/retriable/pivot）与关键步排序纪律（5.2.2 步骤分类纪律，Z3）", "补偿动作的幂等设计（Z3 合取要求）", "编排器状态与 Saga 日志的持久化与崩溃恢复（Z8）"]
      aggregation_semantics: additive  # 5.2.5 Σ 消费路径：步骤卡片延迟按加和聚合（补偿路径同为 Σ）
    compatibility:
      - peer_entry: CSL-005
        relation: requires
        evidence: {source_type: row_id, value: "4.2.3-补偿一致（业务级）", verified: true}   # 4.2.3 实现手段列明文「Saga（方面 5）」→ 补偿一致（业务级）的达成须以本条目为协调形态；requires 关系由 CRD 侧承载（MJ-17 (iii)），CSL-005 侧按 MJ-5 镜像纪律不重复登记
    constraints_imposed:               # 交叉表源：5.4「施加约束」表（方面 5 全体七行，CRD 八条逐字相同）
      - {target_aspect: 1, constraint: "协调需求在既定风格下不可行 → 回溯约束声明（CH-E 原型通道，阻塞式）", level: hard}
      - {target_aspect: 3, constraint: "协调模式产生的新交互 → 契约登记需求（编排者与参与者间的命令契约、事件契约）", level: hard}
      - {target_aspect: 4, constraint: "流程状态（协调者状态机、Saga 日志、预扣记录）是数据集合，受 Y1–Y8 全约束——流程状态的所有者 = 协调者单元", level: hard}
      - {target_aspect: 6, constraint: "质量影响卡片 → 行为级包络校验输入；卡片是方面 6 的强制消费项（Q 系列将引用）", level: hard}
      - {target_aspect: 8, constraint: "行为验证要求：事件回放、乱序/重复/丢失注入、补偿路径测试、超时与断路行为测试、（风格允许时）混沌注入", level: conditional}   # 5.4 级别列原文「软/硬按风格（事件驱动 → 回放与乱序注入必备，承接 1.4）」；本条目为编排式 → 补偿路径测试与超时/断路行为测试取硬，事件回放项按通信风格定（MJ-4 同型判读）
      - {target_aspect: 9, constraint: "协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化", level: hard}
      - {target_aspect: 10, constraint: "机器层：Z 谓词集；人类层：覆盖谓词子集 {Z 谓词集} 的投影视图（受众问题 = 行为与协调的时序、事件流与流程状态；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: CRD-005-AP1
        description: "步骤三分类不明即上线（compensable/retriable/pivot 未声明）"
        detection_predicate: "∃ S, st: saga(S, ·) ∧ st ∈ S ∧ ¬declared(step_class(st, ·))"
        signal_level: P0               # 5.2.2 步骤分类纪律明文「分类不明 = Z3 违例 = 阻塞」→ Z3 硬性质违例的直接来源，检出即阻塞（MJ-4 P0 判据）
      - pattern_id: CRD-005-AP2
        description: "可补偿步缺补偿动作，或补偿动作非幂等"
        detection_predicate: "∃ S, st, c: saga(S, ·) ∧ step_class(st, compensable) ∧ (¬compensation(st, c) ∨ ¬idempotent(c))"
        signal_level: P0               # Z3 硬性质（compensable → ∃ compensation ∧ idempotent）违例的直接来源 → 检出即阻塞（MJ-4 P0 判据）
      - pattern_id: CRD-005-AP3
        description: "编排器状态或 Saga 日志未持久化"
        detection_predicate: "∃ S, M: saga(S, ·) ∧ orchestrator(S, M) ∧ ¬[M 的协调者状态持久化 ∧ 崩溃可恢复]"
        signal_level: P0               # Z8 硬性质 ＋ 5.2.2 关键设计规则列（编排式须有持久化的协调者状态）双据 → 检出即阻塞（MJ-4 P0 判据）
    formal_anchor:
      - {property_id: Z3, role: implements}      # 长流程每步有出路（三分类 + 补偿 + 幂等 + 关键步排序）
      - {property_id: Z8, role: implements}      # 编排式流程的协调者状态持久化 ∧ 可恢复
      - {property_id: Y6, role: consumed_by}     # 跨所有者强一致冲突的 saga_candidate 出路消费本条目
      - {property_id: Z7, role: consumed_by}     # 卡片被方面 6 消费且不得违反包络
    references:
      - {bib_id: 47, support_claim: "Saga 模式的原始文献面（长流程补偿与编排式协调，母本登记提取面）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：跨单元长流程在全局原子性不可得时达成终态正确（4.2.3 定义列），是 Y6 冲突信号的正向出路（saga_candidate）；编排式提供集中留痕与集中的补偿编排落点，步骤多或需审计的场合优于协同式（5.2.2 关键设计规则列的对偶判据）；Z3 与 Z8 同时闭合使失败面从「不可恢复」降为「按 pivot 逆序补偿」。代价：每个可补偿步须有补偿动作且幂等（Z3 硬），步骤三分类一经定案即约束后续变更（前置时间以需重判步骤数为下界）；Saga 日志是受 Y1–Y8 全约束的数据集合且所有者 = 编排器单元（5.4 施→4），须承担持久化、崩溃恢复与对账运维；补偿语义一经流程消费即形成业务依赖，逆转成本高；延迟按 Σ 步骤卡片加逆序补偿上界累积（5.2.5）。"
      typical_scenarios: "跨所有者单元的长流程（4.2.3 选择条件列，见 4.6 示例二扣库存 + 建订单）；Y6 冲突信号触发后的处置路径之一；步骤数多或需集中留痕/审计的补偿型流程（编排式而非协同式，5.2.2 关键设计规则列）；业务硬规则要求终态正确而存储层原子性不可得的场合。"
      common_misuse: "步骤三分类不明即上线（AP1，5.2.2 明文「分类不明 = Z3 违例 = 阻塞」）；可补偿步无补偿动作或补偿动作非幂等（AP2，重试放大）；关键步之前留有不可补偿步骤（pivot_ordering_valid 失效）；编排器状态或 Saga 日志只存内存（AP3，Z8 违例）；以 Saga 替代所有权定案或部署风格重审（跨单元原子性需求应先经 Y6 审查，两条出路都不走即为违例，CSL-005 同型）；把 Saga 日志当作绕过所有者的直写通道（违 5.4 施→4）。"

