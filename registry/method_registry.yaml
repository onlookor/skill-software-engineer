      consistency_impact: "兼容性规则约束的是 schema 与语义条款的演化面，不承载跨单元事务语义；一致性级别由方面 4 的 Y 系列判定（CSL 批承载）；backward/forward 的可读性承诺不得被读作跨版本的数据一致性承诺，两者分属不同判定面"
      observability_requires: ["每份 published 契约的 compat_policy 取值在注册表可查（X2 硬；3.2.2 内容列『每契约登记其一』）", "对外/对内分级及其弃用窗口在案（3.2.2 默认值列；3.3 问题空间驱动第一行）", "兼容性检查在提供者 CI 中的执行结果留痕（3.3 交付空间驱动第二行）", "契约漂移检测规则参数已按 0.13 注册（3.4 施→9 硬）——漂移是规则实际未被遵守的信号"]
      ops_cost: "[兼容性检查在 CI 中的执行面与 schema registry 的 per-subject 兼容性配置面（3.2.2 发现与注册行；书目 33 专页存档）→ 运维项随契约数上升；母本未给单位运维成本 → 方括号占位（MJ-20 (iii) 同型）]"
      skill_prerequisites: ["backward / forward / full / none 四取值的语义辨析（3.2.2 内容列：新消费者可读旧数据 / 旧消费者可读新数据）", "对外与对内 API 的分级判定与弃用窗口登记（同表默认值列；3.3 问题空间驱动第一行）", "兼容性规则的参数化推迟与最后负责时刻设定（3.6 示例二；0.6 CH-B）", "兼容性规则与版本化策略的联动登记（3.2.2 相邻两行）"]
