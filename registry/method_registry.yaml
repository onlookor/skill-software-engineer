        - {source_type: clause_id, value: "1.2.2", verified: true}   # 3.2.3 尾句「任一条件违反 → 分布式单体信号（1.2.2 反模式）」
        - {source_type: clause_id, value: "1.2.3", verified: true}   # 3.2.3 标题明文「被 1.2.3 引用的权威定义」
        - {source_type: clause_id, value: "4.5", verified: true}     # access_path(D, consumer, path_kind, contract_C) 的第四实参即数据契约
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}   # 安全族（敏感数据访问路径合规率）＋合规族（监管条款 → 可判定谓词的映射覆盖率）
    typical_reversibility: costly      # 人工判断：3.4 施→4 明文『数据契约的 schema 与语义条款是数据流动的唯一合法路径定义』→ 语义条款（单位、值域、空值语义）变更须同时迁移全部访问路径与既有消费方的解读；敏感性标注与所有权声明的变更还牵动方面 4 的所有权定案 → 非 bounded
    applicability:
      problem_space:                   # 骨架源：3.2.1「适用条件」列＋3.2.3
        - "一切跨边界数据流动（方面 4 的入口）（3.2.1 适用条件列逐字）→ 本形态的适用面不按风格收窄，而按『是否跨边界』收窄"
        - "共享数据作为集成手段仅限同时满足 3.2.3 四条件，且满足情况必须显式记录（X6 检查）：弱耦合场景（批处理交接、配置分发、报表抽取类）；数据对消费方只读或全系统范围内单写者；不承载跨单元事务语义；访问路径经数据契约暴露、禁止直连物理表/存储引擎（3.2.3 逐字）"
      current_space:                   # 骨架源：3.3 现状空间驱动＋4.5 access_path 谓词面
        - "既有数据访问路径是最强约束源：逆向勘察以流量观测 + 消费者代码分析为准，文档仅作线索（3.3 现状空间驱动第二行）；实际存在的直连物理表路径即为隐式契约，须登记为现状而非视为不存在"
        - "访问路径的契约必须经所有者单元暴露（3.4 接收约束方面 4 行）→ 现状勘察须同时提取 owner 与 access_path 两面（4.5），二者不一致即所有权绕过的契约面投影（W4/Y1 违例）"
      delivery_space:                  # 骨架源：3.3 交付空间驱动
        - "消费者团队数量与变更节奏 → 兼容性规则严格度（消费者多且异构 → full；单消费者同团队 → backward 可接受）（3.3 交付空间驱动第一行）"
        - "CI 成熟度决定 CDC 可行集；能力不足时 CDC 降为软约束 + 保守假设 ADR（可推翻指标 = CI 能力建立）（3.3 交付空间驱动第二行）"
    envelope:
      - metric: "安全：攻击面清单闭合率、漏洞修复时限、敏感数据访问路径合规率"
        bound_expr: "敏感数据访问路径合规率 上界为 1（3.2.1 定义列将『敏感性标注』列为语义条款构成项；6.2.1 安全族）→ 存在未经数据契约暴露的敏感数据访问路径即 < 1，为越界而非可接受状态"
        source: {source_type: clause_id, value: "6.2.1", verified: true}
      - metric: "合规：监管条款 → 可判定谓词的映射覆盖率"
        bound_expr: "监管条款 → 可判定谓词的映射覆盖率 单调不减；语义条款中的敏感性标注与所有权声明是映射的输入面 → 缺项即覆盖率上界受限于缺项数（6.2.1 合规族；3.2.1 定义列）"
        source: {source_type: clause_id, value: "6.2.1", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数、跨边界契约变更数）"
