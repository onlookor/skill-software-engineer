      - {target_aspect: 3, constraint: "协调模式产生的新交互 → 契约登记需求（编排者与参与者间的命令契约、事件契约）", level: hard}
      - {target_aspect: 4, constraint: "流程状态（协调者状态机、Saga 日志、预扣记录）是数据集合，受 Y1–Y8 全约束——流程状态的所有者 = 协调者单元", level: hard}
      - {target_aspect: 6, constraint: "质量影响卡片 → 行为级包络校验输入；卡片是方面 6 的强制消费项（Q 系列将引用）", level: hard}
      - {target_aspect: 8, constraint: "行为验证要求：事件回放、乱序/重复/丢失注入、补偿路径测试、超时与断路行为测试、（风格允许时）混沌注入", level: conditional}   # 5.4 级别列原文「软/硬按风格（事件驱动 → 回放与乱序注入必备，承接 1.4）」；本条目 → 超时与断路行为测试取硬（人工步骤超时是主导项），事件回放与补偿路径项按所依赖的协调形态定（MJ-4 同型判读）
      - {target_aspect: 9, constraint: "协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化", level: hard}
      - {target_aspect: 10, constraint: "机器层：Z 谓词集；人类层：覆盖谓词子集 {Z 谓词集} 的投影视图（受众问题 = 行为与协调的时序、事件流与流程状态；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: CRD-007-AP1
        description: "长时运行有状态流程落在函数粒度的平台托管单元（STY-018-AP1 的方面 5 镜像）"
        detection_predicate: "∃ f, F: unit(f) ∧ [f 为函数粒度的平台托管单元] ∧ interaction_flow(F, ·, orchestrated) ∧ orchestrator(F, f) ∧ ([F 的单次执行时长 > 平台执行时长上界] ∨ [F 的状态无法外置]) ∧ ¬has_approved_exception(·, ·, ·)"
        signal_level: P0               # 交叉表源（MJ-4 判据）：1.2.5 硬冲突行「Serverless × 长时运行有状态流程 → 冲突（执行时长限制）」+ 未批准例外 → V3 硬失败 → 0.14 P0 检出即阻塞；与 STY-018-AP1 双向镜像（MJ-17 (ii)）
      - pattern_id: CRD-007-AP2
        description: "人工步骤无超时值与代理规则（流程无限期挂起）"
        detection_predicate: "∃ F, s: interaction_flow(F, ·, orchestrated) ∧ [s 为 F 的人工步骤] ∧ ¬declared(timeout_budget(s, ·)) ∧ ¬[s 有代理规则]"
        signal_level: P1               # 违反 5.2.2 关键设计规则列（人工步骤须有超时与代理规则）；Z4 为条件硬性质（有 SLA 声明时生效）→ 无无条件硬性质来源，取 P1（MJ-4 判据，CRD-003-AP2 同型）
      - pattern_id: CRD-007-AP3
        description: "状态机未显式建模即承载分支/并行流程"
        detection_predicate: "∃ F: interaction_flow(F, ·, orchestrated) ∧ [F 含分支或并行路径] ∧ ¬[F 的状态机显式建模]"
        signal_level: P1               # Z1 的 explicitly_modeled 谓词未登记（predicate_vocabulary VG 系列同型）→ 词汇补齐前无法机器求值，按 MJ-12 取 P1 并留占位；补齐后按 Z1 硬性质升 P0
    formal_anchor:
      - {property_id: Z3, role: implements}      # 长流程每步有出路（继承编排式 Saga 的三分类纪律）
      - {property_id: Z8, role: implements}      # 流程管理器状态与在途实例持久化 ∧ 可恢复
      - {property_id: Z4, role: consumed_by}     # 超时预算闭合界消费人工步骤超时值
      - {property_id: V3, role: consumed_by}     # 1.2.5 冲突矩阵的部署风格一致性性质消费本条目的长时运行有状态特征
      - {property_id: Z7, role: consumed_by}     # 卡片被方面 6 消费且不得违反包络
    references: []                     # 书目 47 的登记面为 5.2.2 表的 Saga 两行，不含本行；书目 44 的登记面为 5.2.1/5.2.3；书目 50 的 compile_usage 为 narrative_only，不得充作决策性出处（M6）→ 本条留空并登记 G-CRD-1，待人工裁决补勘文献来源后回填（SO-7）
    narrative:
      benefit_cost_analysis: "收益：编排式 Saga 的泛化（5.2.2 定义列），把人工步骤、分支与并行纳入同一状态机，流程状态集中且可验证（Z1 显式建模的落点）；人工步骤的超时值进入延迟预算使 P99 可预算（Z4）；状态机显式化使变更触达面可数（前置时间以状态数为下界）。代价：长时运行有状态特征与 Serverless / FaaS 部署风格硬冲突（1.2.5，V3 硬失败），部署风格须先核验；人工步骤超时值构成延迟预算主导项，无超时与代理规则即流程无限期挂起；在途实例使版本升级与逆转成本高于 CRD-001（状态机变更须迁移在途实例）；并行分支的卡片聚合式母本未给（5.2.5 只给 Σ 语义），本条目不本地补充（MJ-19）→ 并行分支的延迟界在词汇与规范补齐前不可机器求值。"
      typical_scenarios: "含人工审批/人工操作步骤的跨单元长流程（5.2.2 适用条件列）；含分支与并行路径且需集中管理流程状态的场合；编排式 Saga 需扩展至人工步骤时（定义列的泛化关系）；合规域要求可审计轨迹且流程状态须长期留存的场合（5.4 外部强加行）。"
      common_misuse: "在 Serverless / FaaS 部署风格下承载本条目（1.2.5 硬冲突，AP1 → V3 硬失败；例外须走 1.2.5 机制登记 has_approved_exception）；人工步骤不设超时值与代理规则（AP2，流程无限期挂起）；以隐式约定替代状态机显式建模（AP3，Z1 违例）；流程管理器状态只存内存（Z8 违例，在途实例丢失）；把在途实例当作可丢弃数据（版本升级前未迁移）；本地补充并行分支的卡片聚合式（母本未给，MJ-19 禁造规范）。"

  - entry_id: CRD-008
    kind: CRD
    name: "预扣/预留（reservation）"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-CRD-01）
    provenance:
      origin: hybrid                   # 骨架=5.2.2 表行＋界形参数化与谓词转写（manual，MJ-2 同型）
      source_pointers:
        - {source_type: row_id, value: "5.2.2-预扣/预留（reservation）", verified: true}
        - {source_type: clause_id, value: "5.2.2", verified: true}   # 关键设计规则列（预扣须有超时自动释放，防泄漏）
        - {source_type: clause_id, value: "5.2.5", verified: true}
        - {source_type: clause_id, value: "5.3", verified: true}
        - {source_type: clause_id, value: "5.4", verified: true}     # 接收约束方面 4 行「跨所有者强一致 → Saga/预扣或回溯方面 1」
        - {source_type: clause_id, value: "5.5", verified: true}     # Z3/Z4/Z7 与 saga/timeout_budget 谓词来源
        - {source_type: clause_id, value: "4.2.3", verified: true}
        - {source_type: clause_id, value: "4.6", verified: true}     # 示例二：预扣使超卖在存储层不可能 + 可见性损失有界
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
    typical_reversibility: bounded     # 人工判断：预扣语义以契约条款（超时值、释放规则）为界，改动面限于本单元与资源所有者单元的契约条款，不须重设业务流程；一致性级别选择的逆转成本（costly）由 CSL-005 另计，本条目不重复承载（防双计）
    applicability:
      problem_space:                   # 骨架源：5.2.2「适用条件」列原文
        - "资源竞争需在存储层排除超卖而全局原子性不可得（5.2.2 适用条件列；4.6 示例二的下限合法性来源）"
        - "[可见性损失可接受且有界（窗口期内被预扣资源对展示层不可用，4.6 示例二的牺牲）]"
      current_space:                   # 骨架源：5.2.2「实现手段」列（预扣记录 + 超时释放）
        - "[资源所有者单元的本地事务边界可识别且预扣记录可在本地事务内落盘（4.2.3 现状勘察面，CSL-005 同源）]"
        - "[超时自动释放的定时能力在案（5.2.2 关键设计规则列「防泄漏」的现状前提）]"
      delivery_space:                  # 骨架源：5.4 接收约束方面 6 行（延迟预算、错误预算）
