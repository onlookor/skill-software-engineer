        - {source_type: clause_id, value: "3.5", verified: true}     # X1/X2/X7
        - {source_type: clause_id, value: "1.2.3", verified: true}   # 判别规则明文「呼应 1.2.3」
        - {source_type: clause_id, value: "5.4", verified: true}     # 方面 5 施加项的接收端（协调模式产生的新交互 → 契约登记）
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}   # 可观测性族（追踪覆盖率）
    typical_reversibility: costly      # 人工判断：schema 与消息元数据约定一经多方消费者接入，变更须走弃用窗口＋迁移支持（3.2.2 破坏性变更流程）；broker 侧留存消息使旧 schema 在窗口内持续在场 → 非 bounded
    applicability:
      problem_space:                   # 骨架源：3.2.1「适用条件」列＋3.2.1 判别规则
        - "异步消息风格；命令类交互（3.2.1 适用条件列逐字）"
        - "命名含祈使语义（CreateOrder）→ 命令，一对一消费者，走异步消息契约（3.2.1 判别规则逐字；防『PleaseDoX 事件』反模式，呼应 1.2.3）"
      current_space:                   # 骨架源：3.3 现状空间驱动
        - "既有消息 schema 与 broker 上的在途消息是最强约束源：逆向勘察须以流量观测 + 消费者代码分析为准，文档仅作线索（3.3 现状空间驱动第二行；公理 A1 在契约域的具体化）"
        - "现状契约清单须包含消息元数据约定的实际取值面（消息 ID、时间戳、关联 ID、投递语义声明）——缺项即为隐式契约（3.2.1 定义列）"
      delivery_space:                  # 骨架源：3.3 交付空间驱动
        - "消费者团队数量与变更节奏 → 兼容性规则严格度（3.3 交付空间驱动第一行）；命令类交互的默认消费者数为一对一（3.2.1 判别规则）→ 严格度可低于事件契约，但登记义务不减"
        - "CI 成熟度决定 CDC 可行集；能力不足时 CDC 降为软约束 + 保守假设 ADR（可推翻指标 = CI 能力建立）（3.3 交付空间驱动第二行）"
    envelope:
      - metric: "可观测性：卡片 observability_requires（5.2.5）满足率、追踪覆盖率"
