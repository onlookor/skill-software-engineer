entries:

  # ══════════ 子维度三：通信/协调风格（1.2.3）→ STY-001…STY-006 ══════════
  # 块序在前的理由：使「事件溯源 + CQRS」= STY-004，与母本反例 18-A 既有引用 STY-04 一致（MJ-1）。

  - entry_id: STY-001
    kind: STY
    name: 同步请求-响应
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions
    provenance:
      origin: hybrid                   # 骨架=表格行（compiled 视图）＋谓词人工转写（manual）
      source_pointers:
        - {source_type: row_id, value: "1.2.3-同步请求-响应", verified: true}
        - {source_type: clause_id, value: "1.2.5", verified: true}
        - {source_type: clause_id, value: "1.3", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "3", verified: true}
        - {source_type: bib_id, value: "5", verified: true}
    typical_reversibility: costly      # 人工判断：通信风格变更牵动契约形态与协调方式（1.4 施→3/5），非自由逆转
    applicability:
      problem_space:                   # 骨架源：1.2.3「适用条件」列
        - "[需要即时结果]"
        - "[调用链短]"
      current_space:                   # 交叉表源：1.3「既有中间件/平台限定通信风格候选」
        - "[既有平台/中间件提供同步端点能力]"
      delivery_space: []
    envelope:                          # 骨架源：1.2.3「包络要点」列；metric 词汇取 6.2.1；转写规则见 MJ-2
      - metric: "延迟分位数 P99"
        bound_expr: "P99(path) = Σ_{i ∈ path} latency_i；depth(path) ↑ → P99(path) 单调不减"   # 人工判断：链式求和为标准转写，母本仅给方向（调用链长时级联失败风险）；无具体数字
        source: {source_type: row_id, value: "1.2.3-同步请求-响应", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "availability(path) ≤ Π_{i ∈ path} availability_i（串联上界）；depth(path) ↑ → 可达 SLO 上界单调不增"   # 人工判断：串联可靠性乘积式；母本依据为「级联失败风险」方向性摘要
        source: {source_type: row_id, value: "1.2.3-同步请求-响应", verified: true}
      - metric: "可修改性：变更前置时间"
        bound_expr: "lead_time(change) ≥ max_{i ∈ path} lead_time_i（时间耦合：链上单元须协同发布）"   # 人工判断：母本依据为「时间耦合」
        source: {source_type: row_id, value: "1.2.3-同步请求-响应", verified: true}
    cost_profile:
      latency_budget_delta: "请求路径每增一跳同步调用：+ latency_hop（网络/序列化/排队）；depth(path) 为参数"   # 骨架源 1.2.3 包络要点
      failure_modes: ["调用链级联失败（上游超时随深度累积）", "时间耦合导致的协同发布失败", "阻塞等待造成的线程/连接资源耗尽"]   # 骨架源：前两项来自 1.2.3；第三项人工判断（阻塞语义直接后果）
      consistency_impact: "无额外降级：同步语义下调用方读到的是被调方当前状态；跨单元场景的一致性级别仍由方面 4 决定"   # 人工判断（母本未对该行给一致性摘要）
      observability_requires: ["调用链追踪（depth 与每跳延迟可观测）", "超时预算（timeout_budget）登记与计量"]
      ops_cost: "[随同步链深度与端点数量上升；无独立中介运维项]"
      skill_prerequisites: ["超时/重试/熔断的失败语义设计", "调用链延迟预算分解"]
      aggregation_semantics: itemwise   # 默认（0.17.2）：逐项并列，不稀释极端值
    compatibility:
      - peer_entry: STY-004
        relation: tension
        evidence: {source_type: clause_id, value: "1.2.5", verified: true}   # 交叉表源：「事件溯源 × 强同步查询语义 → 张力（读模型最终一致）」；「强同步查询语义」映射到本条目为人工判断（MJ-3）
    constraints_imposed:               # 交叉表源：1.4「施加约束」表
      - {target_aspect: 2, constraint: "风格收窄分解策略可行集：同步链上的单元边界即调用契约边界", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集（connects/style）；人类层：投影视图必须表达所选风格", level: hard}
    anti_patterns:                     # 骨架源：1.2.3「反模式」列；signal_level 交叉表源：0.14 + 9.2.1
      - pattern_id: STY-001-AP1
        description: "深层同步调用链（链深超出超时预算可容纳层级）"
        detection_predicate: "∃ path: interaction_flow(path, sync_chain) ∧ timeout_budget(path, ·) ∧ [depth(path) 超过 timeout_budget 可容纳的层级数]"
        signal_level: P1               # 结构性漂移须限期整改（0.14 P1）；未直接构成 V1/V3 硬违例
      - pattern_id: STY-001-AP2
        description: "同步链上的跨团队耦合部署"
        detection_predicate: "∃ u1, u2, t1, t2: connects(u1, u2, ·) ∧ owned_by(u1, t1) ∧ owned_by(u2, t2) ∧ team(t1) ∧ team(t2) ∧ ¬(t1 = t2) ∧ depends_on(u1, u2, deploy, ·)"
        signal_level: P1
    formal_anchor:                     # 交叉表源：1.5 V1–V5
      - {property_id: V2, role: implements}     # 通信协议与风格自洽
      - {property_id: V4, role: consumed_by}    # envelope → 目标可达性
      - {property_id: V5, role: implements}     # 风格定案走批准路径（纪律二）
    references:
      - {bib_id: 3, support_claim: "同步/异步通信风格的分布式权衡定位（1.2.3 行权衡摘要的元方法来源）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 5, support_claim: "部署 × 通信组合模式中同步请求-响应的位置", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：语义简单、易推理、无需处理乱序与重复投递；代价：时间耦合（调用方阻塞）与级联失败风险随链深上升，可用性上界为链上各单元可用性的乘积。"
      typical_scenarios: "查询类交互、需要即时结果的命令、调用链短（1–2 跳）的内部协作。"
      common_misuse: "以深层同步链串接多团队单元（分布式单体的通信面征兆）；在需要削峰/时间解耦的负载上坚持同步语义。"

  - entry_id: STY-002
    kind: STY
    name: 异步消息
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.3-异步消息", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "3", verified: true}
        - {source_type: bib_id, value: "5", verified: true}
    typical_reversibility: costly      # 人工判断：改为同步语义须重设计契约与失败处置
    applicability:
      problem_space:
        - "[需要削峰]"
        - "[需要时间解耦]"
        - "[存在可靠投递要求]"
      current_space:
        - "[存在可用消息中间件]"
      delivery_space:
        - "[具备顺序/幂等/重复投递的处置能力]"
    envelope:
      - metric: "延迟分位数 P99"
        bound_expr: "P99(e2e) ≥ P99_sync_equivalent + queue_delay(load)；queue_delay 随到达率/处理率之比 ↑"   # 人工判断：母本依据「时间解耦↑」（不保证即时性）
        source: {source_type: row_id, value: "1.2.3-异步消息", verified: true}
      - metric: "可伸缩性：单位资源容量增量"
        bound_expr: "capacity(consumers) 随消费者实例数单调不减（削峰：突发由队列吸收，处理速率由消费者规模决定）"   # 人工判断：母本依据「削峰」
        source: {source_type: row_id, value: "1.2.3-异步消息", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "delivery_guarantee ∈ {at-most-once, at-least-once, exactly-once}；选 at-least-once → 消费侧必须 idempotency(·, ·) 成立方可保证业务级 SLO"   # 交叉表源：5.5 谓词 delivery_semantics/idempotency；母本依据「顺序/幂等/重复投递成为必答题」
        source: {source_type: row_id, value: "1.2.3-异步消息", verified: true}
    cost_profile:
      latency_budget_delta: "+ queue_delay（参数：到达率、消费者处理率、队列深度）；即时性不再有上界保证"
      failure_modes: ["重复投递（消费侧非幂等 → 业务状态错乱）", "乱序到达（顺序语义缺失）", "队列积压/毒消息导致消费停滞", "中间件自身可用性成为新单点"]   # 前两项骨架源 1.2.3；后两项人工判断
      consistency_impact: "最终一致为默认；强一致需额外的事务性发件箱/对账机制（代价单列，归方面 4）"
      observability_requires: ["队列深度与滞留时长计量", "消息级追踪（因果关联）", "重复/乱序事件的可观测计数"]
      ops_cost: "[消息中间件集群运维 + 积压告警值守；随吞吐与分区数上升]"
      skill_prerequisites: ["幂等消费者设计", "投递语义（at-least-once 等）与业务语义对齐", "积压/毒消息处置规程"]
      aggregation_semantics: itemwise
    compatibility: []                  # 1.2.5 未登记本条目相关的风格对；不臆造关系（0.17.6 第四层）
    constraints_imposed:
      - {target_aspect: 3, constraint: "契约须表达投递语义与消息 schema（异步端点不得以进程内调用契约替代）", level: hard}   # 人工判断：由 1.4 施→3「事件驱动 → 异步消息/事件流必选其一」同族推得，本行为异步消息侧的对应义务
      - {target_aspect: 5, constraint: "协调须处置重复/乱序/补偿（分布式协调成为必答题）", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集；人类层：投影视图必须表达所选风格", level: hard}
    anti_patterns:
      - pattern_id: STY-002-AP1
        description: "用异步消息实现需要同步语义的查询"
        detection_predicate: "∃ u1, u2: depends_on(u1, u2, event, ·) ∧ [该交互的业务语义为查询且调用方需要即时结果] ∧ ¬interaction_flow(u1, sync_chain)"
        signal_level: P1
    formal_anchor:
      - {property_id: V2, role: implements}
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 3, support_claim: "异步通信的分布式权衡（时间解耦收益 vs 投递语义代价）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 5, support_claim: "异步消息模式与幂等/投递语义的工程处置", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：时间解耦、削峰、消费者可独立伸缩；代价：顺序/幂等/重复投递从可选变为必答题，可调试性与因果追踪成本上升，中间件成为新的可用性依赖。"
      typical_scenarios: "突发流量吸收、跨团队解耦通知、批处理交接、需要重试与补偿的长流程起点。"
      common_misuse: "以异步消息伪装同步查询（用轮询/回调补齐即时语义）；消费侧不做幂等却假设 exactly-once。"

  - entry_id: STY-003
    kind: STY
    name: 事件驱动（发布订阅）
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.3-事件驱动（发布订阅）", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "3", verified: true}
        - {source_type: bib_id, value: "5", verified: true}
    typical_reversibility: costly      # 人工判断：事件契约一经多方订阅即成隐式公共接口
    applicability:
      problem_space:
        - "[多方需要响应同一业务事实]"
        - "[扩展新消费者不应改动生产者]"
      current_space:
        - "[存在事件基础设施（消息中介或事件流平台）]"
      delivery_space:
        - "[具备事件 schema 版本治理能力]"
        - "[具备因果链追踪能力]"
    envelope:
      - metric: "可修改性：跨边界契约变更数"
        bound_expr: "新增消费者时 touched_contracts(change) = 0（生产者不改）；变更事件 schema 时 touched_contracts = |subscribers(event)|"   # 人工判断：母本依据「扩展性↑↑」与「事件契约无版本治理」反模式
        source: {source_type: row_id, value: "1.2.3-事件驱动（发布订阅）", verified: true}
      - metric: "可伸缩性：单位资源容量增量"
        bound_expr: "capacity 随消费者组数单调不减；生产者吞吐与消费者数解耦"
        source: {source_type: row_id, value: "1.2.3-事件驱动（发布订阅）", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "consistency_default = eventual；对强一致目标的可达性 = 不可达（除非引入额外协调，代价单列）"   # 骨架源：「最终一致为默认」
        source: {source_type: row_id, value: "1.2.3-事件驱动（发布订阅）", verified: true}
      - metric: "可观测性：追踪覆盖率"
        bound_expr: "causal_trace_coverage ≤ 1 − implicit_hops/total_hops；因果链追踪难度随订阅方数 ↑（母本：因果链追踪难）"   # 人工判断
        source: {source_type: row_id, value: "1.2.3-事件驱动（发布订阅）", verified: true}
    cost_profile:
      latency_budget_delta: "+ 事件传播与消费延迟（参数：订阅方数、消费者处理率）；无即时性上界"
      failure_modes: ["事件丢失/重复（投递语义）", "因果链断裂导致不可复现的故障", "事件 schema 漂移使消费者静默失败", "隐式 RPC 化造成的时序耦合回流"]
      consistency_impact: "最终一致为默认；跨聚合的强一致须显式引入协调机制（方面 4/5）"
      observability_requires: ["事件级追踪与关联 ID", "订阅方清单与事件契约版本可查", "死信/重试队列计量"]
      ops_cost: "[事件基础设施运维 + 契约治理流程；随订阅方数上升]"
      skill_prerequisites: ["领域事件建模（事件 vs 命令的语义区分）", "事件 schema 演化与版本治理", "最终一致下的业务对账设计"]
      aggregation_semantics: itemwise
    compatibility:
      - peer_entry: STY-016
        relation: composable
        evidence: {source_type: clause_id, value: "1.4", verified: true}   # 交叉表源：施→3「事件驱动 → 异步消息/事件流必选其一」、施→5「事件驱动 → 协同式为默认」均以多单元部署为前提语境
      - peer_entry: STY-004
        relation: composable
        evidence: {source_type: row_id, value: "1.2.3-事件溯源 + CQRS", verified: true}   # 骨架源：事件溯源以事件日志为准，与发布订阅同族可组合（人工判断：可组合而非互相要求）
    constraints_imposed:
      - {target_aspect: 3, constraint: "异步消息/事件流必选其一（跨单元契约不得以进程内调用为主手段）", level: hard}   # 交叉表源 1.4 施→3
      - {target_aspect: 4, constraint: "事件日志为一等数据模型", level: soft}   # 交叉表源 1.4 施→4（表标「硬/软按条」，判读见 MJ-4）
      - {target_aspect: 5, constraint: "协同式（choreography）行为为默认", level: soft}   # 交叉表源 1.4 施→5
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界", level: hard}
      - {target_aspect: 8, constraint: "事件回放/乱序注入验证必备", level: soft}   # 交叉表源 1.4 施→8
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集；人类层：投影视图必须表达所选风格", level: hard}
    anti_patterns:
      - pattern_id: STY-003-AP1
        description: "事件变成隐式 RPC（PleaseDoX 事件：命令语义伪装为领域事件）"
        detection_predicate: "∃ e: [e 为已登记领域事件] ∧ [e 的命名或载荷表达命令语义（要求特定接收方执行动作）] ∧ [e 的订阅方数 = 1]"
        signal_level: P1
      - pattern_id: STY-003-AP2
        description: "事件契约无版本治理"
        detection_predicate: "∃ e: [e 为已登记领域事件] ∧ ¬[e 的 schema 携带版本且变更经方面 3 契约治理登记]"
        signal_level: P1               # 9.2.1 将 schema 漂移列为 P2 典型源；此处针对「治理缺失」这一结构事实定 P1，漂移趋势监测归 P2（见 STY-003-AP3）
      - pattern_id: STY-003-AP3
        description: "事件 schema 漂移趋势（消费者兼容性劣化）"
        detection_predicate: "∃ e: [e 为已登记领域事件] ∧ [滚动窗口 W 内 e 的不兼容 schema 变更次数 > C_max]"
        signal_level: P2               # 0.14 P2 双判据：阈值 C_max + 趋势窗口 W（均为待勘察参数，禁填无出处数字）
    formal_anchor:
      - {property_id: V2, role: implements}
      - {property_id: V3, role: triggers}     # 与 STY-016/STY-004 的组合进入冲突矩阵检查
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 5, support_claim: "事件驱动与发布订阅的部署 × 通信组合模式", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 3, support_claim: "事件驱动架构的分布式权衡分析", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：新消费者零改动接入、时间解耦、可扩展性最高；代价：因果链难以追踪、最终一致成为默认语义、事件契约事实上成为公共接口（治理成本随订阅方数上升）。"
      typical_scenarios: "多方响应同一业务事实（下单后触发库存/通知/分析）、跨团队解耦、需要审计与回放的领域事件流。"
      common_misuse: "以事件之名行命令之实（隐式 RPC）；不做 schema 版本治理即让多方订阅；在需要强同步语义处使用（与 STY-004 组合时尤为常见）。"

  - entry_id: STY-004
    kind: STY
    name: 事件溯源 + CQRS
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.3-事件溯源 + CQRS", verified: true}
        - {source_type: clause_id, value: "1.2.5", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "5", verified: true}
        - {source_type: bib_id, value: "3", verified: true}
    typical_reversibility: costly      # 人工判断：事件日志成为权威数据模型后回退需重建状态存储（非严格 irreversible：日志可弃用，但历史与读模型重建代价高）
    applicability:
      problem_space:                   # 骨架源：1.2.3「适用条件」列（三项为析取）
        - "[存在审计留痕要求] ∨ [需要时间旅行调试] ∨ [读写负载特征悬殊]"
      current_space:
        - "[事件日志可持久化且可重放]"
      delivery_space:
        - "[具备事件 schema 演化治理能力]"
        - "[具备读模型重建与对账能力]"
    envelope:
      - metric: "可修改性：变更前置时间"
        bound_expr: "history_completeness = 全量（自溯源起点）；读模型可独立优化 → read_latency 上界由读模型存储决定，与写路径解耦"   # 骨架源：「完整历史↑、读模型自由优化」
        source: {source_type: row_id, value: "1.2.3-事件溯源 + CQRS", verified: true}
      - metric: "延迟分位数 P99"
        bound_expr: "read_consistency_lag ≥ 0 且无零上界保证（读模型最终一致）；对强同步查询语义目标：不可达"   # 交叉表源：1.2.5「事件溯源 × 强同步查询语义 → 张力（读模型最终一致）」
        source: {source_type: clause_id, value: "1.2.5", verified: true}
      - metric: "可修改性：跨边界契约变更数"
        bound_expr: "event_schema_evolution_cost 随已发布事件版本数单调不减（母本：事件 schema 演化难、复杂度↑↑）"   # 人工判断
        source: {source_type: row_id, value: "1.2.3-事件溯源 + CQRS", verified: true}
    cost_profile:
      latency_budget_delta: "写路径：+ 事件追加与投影触发；读路径：+ 投影滞后（read_consistency_lag，参数：投影吞吐/事件到达率）"
      failure_modes: ["事件 schema 不兼容演化导致重放失败", "读模型投影停滞/漂移（与写模型不一致）", "事件日志膨胀导致重放时长不可接受", "把 CQRS 用于不需要读写分离的场景带来的无谓复杂度"]
      consistency_impact: "写侧：事件日志为权威（可重建状态）；读侧：最终一致为默认，强同步查询语义不可达（1.2.5 张力行）"
      observability_requires: ["投影滞后计量（lag）", "事件重放可执行性与时长可观测", "读写模型对账差异计数"]
      ops_cost: "[事件存储 + 投影管道 + 读模型存储三套运维面；复杂度↑↑（骨架源）]"
      skill_prerequisites: ["事件建模与版本演化", "投影/读模型设计与重建", "最终一致下的业务语义论证（方面 4 Y3 联动）"]
      aggregation_semantics: itemwise
    compatibility:
      - peer_entry: STY-001
        relation: tension
        evidence: {source_type: clause_id, value: "1.2.5", verified: true}   # 交叉表源：「事件溯源 × 强同步查询语义 → 张力（读模型最终一致）」
      - peer_entry: STY-003
        relation: composable
        evidence: {source_type: row_id, value: "1.2.3-事件溯源 + CQRS", verified: true}
    constraints_imposed:
      - {target_aspect: 4, constraint: "事件日志为一等数据模型；状态存储降为投影产物", level: hard}   # 交叉表源 1.4 施→4（事件驱动行），本条目为该行的强化形态
      - {target_aspect: 3, constraint: "事件契约必须版本化（读写两侧独立演化）", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界；强同步查询目标 → V4 失败须升级裁决", level: hard}
      - {target_aspect: 8, constraint: "事件回放验证必备（重放即回归手段）", level: soft}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集；人类层：投影视图必须表达所选风格", level: hard}
    anti_patterns:
      - pattern_id: STY-004-AP1
        description: "把 CQRS 当作默认选择用在不需要的场景（无审计要求、读写负载特征相近）"
        detection_predicate: "∃ M: style(M, STY-004) ∧ ¬([存在审计留痕要求] ∨ [需要时间旅行调试] ∨ [读写负载特征悬殊])"
        signal_level: P1
      - pattern_id: STY-004-AP2
        description: "在事件溯源读模型上提供强同步查询语义而未登记批准例外"
        detection_predicate: "∃ M, q: style(M, STY-004) ∧ [q 为对读模型的查询且业务要求写后立即可读] ∧ ¬has_approved_exception(STY-004, STY-001, ·)"
        signal_level: P0               # 交叉表源：1.2.5 张力行 + 0.14 P0；未批准例外的硬冲突对构成 V3 违例
    formal_anchor:
      - {property_id: V3, role: triggers}     # 1.2.5 张力/冲突行进入矩阵检查
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 5, support_claim: "CQRS 与事件溯源的组合模式（母本登记：部署 × 通信组合模式含 Saga、CQRS、事件驱动）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 3, support_claim: "事件溯源的一致性/复杂度权衡分析", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：完整历史（审计、时间旅行调试）、读写模型各自自由优化；代价：复杂度↑↑、事件 schema 演化难、读侧最终一致。母本明示 CQRS **不必然**绑定事件溯源——两者可分别采用，本条目登记的是二者组合形态。"
      typical_scenarios: "金融/合规审计场景、需要重放与回溯的领域、读写负载特征悬殊（写少读多或读需异构视图）。"
      common_misuse: "作为默认架构使用（无审计与负载悬殊依据）；在最终一致读模型上承诺强同步语义而不登记例外；把 CQRS 与事件溯源当作不可分割的整体。"

  - entry_id: STY-005
    kind: STY
    name: Broker 中介
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.3-Broker 中介", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "1", verified: true}
        - {source_type: bib_id, value: "3", verified: true}
    typical_reversibility: bounded     # 人工判断：中介可在保留端点契约的前提下替换/退化为直连，代价集中于路由与策略迁移
    applicability:
      problem_space:
        - "[异构系统集成]"
        - "[需要集中策略点]"
      current_space:
        - "[中介组件可用]"
      delivery_space:
        - "[具备中介高可用运维能力]"
    envelope:
      - metric: "可修改性：跨边界契约变更数"
        bound_expr: "新增/替换参与方时 touched_contracts = 1（仅对中介）；集中治理 → 策略变更触达单元数 = 1"   # 骨架源：「集中治理↑」
        source: {source_type: row_id, value: "1.2.3-Broker 中介", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "availability(system) ≤ availability(broker)（中介为单点时系统可用性以其为上界）"   # 骨架源：「中介单点/瓶颈」；人工判断：单点上界式
        source: {source_type: row_id, value: "1.2.3-Broker 中介", verified: true}
      - metric: "吞吐量"
        bound_expr: "throughput(system) ≤ throughput(broker)（瓶颈上界）"
        source: {source_type: row_id, value: "1.2.3-Broker 中介", verified: true}
    cost_profile:
      latency_budget_delta: "+ 中介转发跳（每交互固定增加 1 跳路由/转换开销）"
      failure_modes: ["中介单点故障（全局不可用）", "中介成为吞吐瓶颈", "业务逻辑沉积导致中介变更频繁且高风险"]
      consistency_impact: "中介不改变一致性级别；若中介承载状态转换则引入新的一致性边界（应视为反模式 STY-005-AP1）"
      observability_requires: ["中介级流量/延迟/错误计量", "路由与策略变更审计", "参与方到中介的连接健康度"]
      ops_cost: "[中介集群高可用运维 + 策略治理；集中式 → 单点运维压力高]"
      skill_prerequisites: ["中介产品运维", "路由/转换策略设计", "集中策略点的权限与变更治理"]
      aggregation_semantics: itemwise
    compatibility:
      - peer_entry: STY-017
        relation: composable
        evidence: {source_type: row_id, value: "1.2.2-SOA", verified: true}   # 骨架源：SOA 定义含「ESB（集中式消息路由/转换/治理中介）」——ESB 为 Broker 的实例形态（人工判断：可组合而非要求）
    constraints_imposed:
      - {target_aspect: 3, constraint: "跨中介契约须与中介路由/转换能力自洽（V2）", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（中介单点上界尤其约束可用性目标）", level: hard}
      - {target_aspect: 9, constraint: "中介承载业务逻辑属守护对象（反模式 → G 规则播种）", level: soft}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集；人类层：投影视图必须表达所选风格", level: hard}
    anti_patterns:
      - pattern_id: STY-005-AP1
        description: "业务逻辑沉积在中介里"
        detection_predicate: "∃ b: [b 为已登记的中介单元] ∧ responsibility(b, ·) ∧ [b 承载的职责中存在业务规则（非路由/转换/策略）]"
        signal_level: P1
    formal_anchor:
      - {property_id: V2, role: implements}
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 1, support_claim: "Broker 模式的词汇与定义（母本登记：1.2.1 抽象结构风格词汇表含 Broker）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 3, support_claim: "中介化集成的分布式权衡", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：异构集成、集中策略点、参与方解耦（契约变更只触达中介）；代价：中介成为单点与瓶颈，系统可用性/吞吐以中介为上界，且中介易沉积业务逻辑。"
      typical_scenarios: "企业内异构系统互联、需要统一策略执行点（认证/限流/转换）的集成场景。"
      common_misuse: "把中介当作业务编排引擎（逻辑沉积）；未做中介高可用却承诺系统级 SLO。"

  - entry_id: STY-006
    kind: STY
    name: 共享数据
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.3-共享数据", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "3", verified: true}
    typical_reversibility: costly      # 人工判断：隐式契约一旦扩散，解除共享须重建显式接口
    applicability:
      problem_space:
        - "[场景限于批处理交接或配置分发等弱耦合] ∨ has_approved_exception(STY-006, ·, ·)"   # 骨架源：「仅限：批处理交接、配置分发等弱耦合场景」；例外覆盖机制见 1.2.5
      current_space:
        - "[共享存储已存在且访问受控]"
      delivery_space:
        - "[方面 3 已定结论中的适用条件满足且显式记录]"   # 骨架源：「使用须满足方面 3 已定结论中的适用条件并显式记录」
    envelope:
      - metric: "延迟分位数 P99"
        bound_expr: "P99 以共享存储访问延迟为下界项；无中介跳，延迟低于跨单元 RPC 形态"   # 骨架源：「简单」
        source: {source_type: row_id, value: "1.2.3-共享数据", verified: true}
      - metric: "可修改性：跨边界契约变更数"
        bound_expr: "touched_contracts(schema_change) = |readers(store)| ∪ |writers(store)|（隐式契约：schema 变更触达全部共享方）"   # 骨架源：「时间耦合与隐式契约是默认代价」
        source: {source_type: row_id, value: "1.2.3-共享数据", verified: true}
      - metric: "可修改性：变更前置时间"
        bound_expr: "lead_time(change) ≥ max_{p ∈ sharers} lead_time_p（时间耦合：须与全部共享方协同）"
        source: {source_type: row_id, value: "1.2.3-共享数据", verified: true}
    cost_profile:
      latency_budget_delta: "共享存储访问项（参数：读写方数、存储引擎延迟特征）；无网络中介跳"
      failure_modes: ["隐式契约破坏（schema 变更未通知共享方）", "写冲突/锁争用", "共享存储成为耦合单点", "以共享库实现服务间集成 → 分布式单体"]
      consistency_impact: "可达强一致（同一存储的事务边界内）；跨共享方的语义一致性仍须显式约定"
      observability_requires: ["共享存储的读写方清单可查", "schema 变更影响面分析", "锁争用/冲突计量"]
      ops_cost: "[共享存储运维 + 跨方变更协调成本（随共享方数上升）]"
      skill_prerequisites: ["数据建模与 schema 演化治理", "并发/锁语义", "隐式契约的显式化能力"]
      aggregation_semantics: itemwise
    compatibility:
      - peer_entry: STY-016
        relation: tension
        evidence: {source_type: row_id, value: "1.2.3-共享数据", verified: true}   # 骨架源：反模式「以共享数据库实现服务间集成（分布式单体信号）」；对侧为微服务（独立数据）
      - peer_entry: STY-014
        relation: composable
        evidence: {source_type: row_id, value: "1.2.2-单体", verified: true}   # 骨架源：单体行「ACID 事务可用」；1.4 施→4「单体 → 共享数据库可用」；分块序映射见 manual_judgments.MJ-1（单体=STY-014）
    constraints_imposed:
      - {target_aspect: 3, constraint: "共享数据的适用条件须由方面 3 已定结论确认并显式记录", level: hard}   # 骨架源：1.2.3 该行「使用须满足…」
      - {target_aspect: 4, constraint: "共享存储的写方与所有权须明确（否则违反数据单一所有者，W4 联动）", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集；人类层：投影视图必须表达所选风格", level: hard}
    anti_patterns:
      - pattern_id: STY-006-AP1
        description: "以共享数据库实现服务间集成（分布式单体信号）"
        detection_predicate: "∃ u1, u2, s: unit(u1) ∧ unit(u2) ∧ depends_on(u1, s, data, ·) ∧ depends_on(u2, s, data, ·) ∧ [u1 与 u2 属不同部署单元] ∧ ¬([该共享属批处理交接场景] ∨ [该共享属配置分发场景])"
        signal_level: P1               # 交叉表源：0.14 P1（分布式单体的数据面征兆，须限期整改）；未直接构成 V1/V3 硬违例
    formal_anchor:
