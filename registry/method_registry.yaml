        - {source_type: clause_id, value: "3.3", verified: true}
        - {source_type: clause_id, value: "3.4", verified: true}     # 接收约束方面 1 行「事件驱动 → 异步消息/事件契约必选其一」＋方面 5 行（事件契约登记）＋施→8「事件驱动 → 事件 schema 演化测试必备」
        - {source_type: clause_id, value: "3.5", verified: true}     # X1/X2/X7
        - {source_type: clause_id, value: "1.2.3", verified: true}   # 判别规则明文「呼应 1.2.3」
