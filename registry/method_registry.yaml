    references:
      - {bib_id: 46, support_claim: "5.2.3 断路器、舱壁、超时预算等稳定性模式（重试落在登记面的『等稳定性模式』概括项——书目 46 登记面未逐字明列『重试』，据实登记不改写，判读入 MJ-24）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-10-04 在线复核：官方 PDF 抽取页记 ISBN-13 978-1-68050-239-8／Book version P1.0—January 2018／作者 Michael T. Nygard，数字串与母本著录 978-1-680-50239-8 相同而连字符分组位置不同；书商页数两说 350 vs 376。差异据实登记入 MJ-24，不改写母本）"}
