      consistency_impact: "宏观侧流程状态（编排者状态机）受 5.4 施→4 全约束、所有者 = 编排者单元；微观侧无中央状态、由 Z2 闭合；跨域一致性由边界处的契约条款衔接，两侧一致性级别声明仍归 CSL 批不重复承载"
      observability_requires: ["宏观侧流程实例状态可查（orchestrator / step_class 谓词在案，5.5）", "微观侧事件流与订阅关系可查（interaction_flow / delivery_semantics 谓词在案）", "两侧追踪口径统一且边界可拼接（min + 边界项界的度量前提）", "卡片 observability_requires 不得退化（5.4 施→9）"]
      ops_cost: "[为两种形态运维成本之和并加边界治理成本；须同时承担编排者高可用（Z8）与事件回放/乱序注入验证（5.4 施→8）]"
