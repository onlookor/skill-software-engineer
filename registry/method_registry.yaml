    subject: DFL 批十一项判读——四列源表的字段归类、CDC 双义的出处隔离、latency_budget_delta 的剖面差异、22 条 signal_level 的定级依据、七词与 M4 扫描面的精确事实、formal_anchor 12 实例的角色分配、compatibility 十行与 RLP 批的重叠处置、6.6 示例四 800ms 的处置边界、书目 44 的 ISBN 观察项、同批镜像与 pending_conflict_rows 口径、可逆性三级定位
    judgment: "(i) **4.2.4 源表有四列 → 字段归类判读**：母本 4.2.4『数据流动与集成机制』（heading @2194）的表头 @2196 为『机制｜定义｜适用条件｜质量影响要点』四列、五行 @2198-2202、尾注 @2204。与 4.2.2 的三列形态（MJ-22 (i)）、3.2.1／3.2.2 的六列形态（MJ-21 (ii)）皆不同：本表无『机器层天然性』『默认值』『主导驱动空间』列 → 各字段无法一对一取自本表，须按下列归类取源（每项登记均指回具体列或交叉表源，0.17.7 门槛 2）：name 取第一列逐字、去粗体标记（DFL-004 原形即含斜杠，MJ-21 (iii)）；applicability.problem_space 取第三列『适用条件』的问题空间面；applicability.current_space 取第二列『定义』的机制事实＋kind_profile_DFL.narrative.note（@274）对 CDC／事件流类条目的显式要求（delivery_semantics 与 idempotency 前提）；applicability.solution_space 取第三列的风格与场景限定；envelope.bound_expr 取第二列定义内的界形与第四列要点中的量化面（一律关系式，不发散数值，M3）；anti_patterns 取第四列『质量影响要点』的违例形态＋4.5／5.5 的性质违例；formal_anchor 只取母本明文挂钩者（第四列括注『Z2 联动』『Y 系列检查』、尾注 @2204 的 Y4、5.5 的 Z2）；compatibility 取尾注的组合示例＋6.6 示例四的建议重审范围②＋1.2.3／4.2.2 的明文交叉（本表未列任何风格对 → 不升 hard_conflict）；metric 限 G-ENV-1 已登记的四族。**第四列名为『质量影响要点』而非可验证判据** → 其中的定性词（『必须显式』『是登记项』『at-least-once → 消费者幂等』）只作 anti_patterns 与 formal_anchor 的依据，不直接充当 envelope 的界，否则＝以要点文字冒充量化界（违 0.4）。(ii) **CDC 一词在母本双义 → 出处隔离**：术语表 @4277『CDC（数据域）｜Change Data Capture，变更数据捕获｜从事务日志提取数据变更外发为事件流｜出处 4.2.4』与 @4278『CDC（契约域）｜Consumer-Driven Contract (testing)｜出处 3.2.2』为两个独立词条。DFL-002 的 name／applicability／narrative 一律指数据域；契约域由 CTR-009 承载，其全库出现处（母本 @589／@999／@1933／@1964／@1966／@1988／@2014／@2102／@3327／@3394／@3439，块头注释 @5042-5045 已列清单）不得充当 DFL-002 的出处，反向亦然（0.17.7 门槛 6）。母本 @303 已就同类歧义（『把 CQRS 读成必须配事件溯源』）明文警示 → 双义隔离系母本既有纪律的适用，非本批新增命题（0.22 承诺一）。(iii) **latency_budget_delta 的剖面差异 → 填实但理由不平移**：kind_profile_STP 载有『不降级为选填』的明文要求（MJ-22 (ii)），而 kind_profile_DFL（@250-274）**无同型明文**——其 narrative.note（@274）只要求 delivery_semantics 与 idempotency 前提在 applicability.current_space 表达。处置：五条一律填实（界形＋符号＋单调性），但理由引各行第二／四列的母本明文界形与本条判读，**不得平移 STP 批措辞**（MJ-22 (ii) 同型纪律：剖面未声明者，不得以他 kind 的剖面措辞充当依据）；填实值＝发件箱以中继投递间隔为下界且随堆积深度单调不减、CDC 为 Δcapture + Δrelay 且随日志位点滞后单调不减、流处理为 Δwindow + Δstate_emit（事件时间语义下另加水位线滞后项）、批以 [batch_window] 为下界且为窗口粒度而非连续、物化视图为 Δrefresh 且随刷新链路滞后单调不减。若人工裁决要求 kind_profile_DFL 补同型明文，属 profiles.yaml 的剖面改动（高影响，走 R2／ADR），不在本批范围。(iv) **22 条 signal_level 的定级依据**：实测 P0 11／P1 5／P2 6。**P0（11 条）**＝有 4.5／5.5 硬性质可绑定，或属母本的定义性判据：DFL-001-AP1（第二列『同一本地事务』是 outbox 的定义性判据，缺此即非该机制）、DFL-001-AP2（5.2.3 @2479『未声明 = Z2 违例』＋Z2 硬 @2577-2578）、DFL-001-AP3（第四列 at-least-once → 消费者幂等，Z2 硬）、DFL-002-AP1（4.3 现状空间驱动把 CDC 可行性定为勘察必答项，缺答＝公理 A2 违例）、DFL-002-AP2（Y2 硬 @2281-2282）、DFL-002-AP3（Z2 硬＋kind_profile_DFL.narrative.note）、DFL-003-AP2（Z2 硬）、DFL-004-AP2（4.4 施→3 硬＋第四列『批窗口 = 新鲜度条款』）、DFL-004-AP3（Y2 硬）、DFL-005-AP1（Y1 硬 @2279-2280＋第四列『派生物不是所有者』）、DFL-005-AP3（Y2 硬＋access_path 的 path_kind 枚举含 view @2266）。**P1（5 条）**＝母本明文强制但 4.5／5.5 无可绑定的硬性质：DFL-003-AP1（第四列『事件时间 vs 处理时间语义必须显式』＋5.2.4 @2483『显式选择』为母本明文强制，但 Z2 管投递语义、Y3 管 declared(consistency_level) 与 compatible(level, aspect6_target)（@2283-2285，4.2.3 表）→ 二者皆非该主张的性质面）、DFL-003-AP3（5.2.4『乱序容忍度以水位线表达』，无 Y／Z 硬性质）、DFL-004-AP1（第三列明文限定『分析域、报表；对新鲜度要求低的场景』，越界＝选型漂移，而 Y4 在 4.5 的级别列为软 @2286-2287 → 不升 P0）、DFL-004-AP4（装载幂等：Z2 的判定面是 async interaction 的投递语义 @2577，批装载不属该面 → 无硬性质）、DFL-005-AP4（0.4 禁假精确＋6.6 示例四 @2965『出处=现状基线』的出处要求，无 V／Y／Z 硬性质）。**P2（6 条）**＝不构成 4.5／5.5 性质违例，而是资源占用或新鲜度／陈旧窗口的漂移信号，须以阈值＋趋势双判据核定：DFL-001-AP4／DFL-002-AP4／DFL-003-AP4／DFL-004-AP5／DFL-005-AP2（随 Y7 软 P2 @2292-2293 取级，与 STP-003-AP2 同级）／DFL-005-AP5。P1 → P0 的改级只能由 s5g 词汇批次（补登母本 4.5 公式侧 7 词，缺口载于 MJ-22 (vi)）触发，本批不自行升级（0.22 承诺一）。(v) **七词与 M4 扫描面的精确事实**：M4 的扫描面＝anti_patterns.detection_predicate 与 applicability 三空间（project.py @225 以 PRED_CALL_RE.findall(outside_brackets(s)) 提取；PRED_CALL_RE @221 只匹配 name( 起始的调用式；outside_brackets @208 先剔半角方括号内文），**不扫**块头注释、signal_level 说明、cost_profile／narrative／provenance 的行内注。4.2.4 侧七词逐词实测：outbox_table／cdc_pipeline／freshness_clause 三词在 DFL 段零出现（仅块头注释 @5046 的列名）→ 不在扫描面；relay 1 处（@5083 applicability.problem_space 方括号内）、stream 4 处（@5177／@5277／@5278 applicability 方括号内、@5322 detection_predicate 内作 data_flow(·, ·, ·, [stream]) 的实参）、batch_window 3 处（@5377 envelope.bound_expr、@5389 latency_budget_delta、@5408 detection_predicate 内作 [D 的消费方新鲜度要求 < batch_window(D)] 的方括号占位）、rebuildable 6 处（@5358／@5446 provenance 行内注、@5460 applicability 方括号内、@5515 detection_predicate 内作 ¬data_lineage(V, ·, rebuildable=true) 的实参取值、@5516 signal_level 行内注、@5532 formal_anchor 行内注）→ 后四词**确落扫描面**，但一律以半角方括号占位（被 outside_brackets 剔除）或实参取值形态（非 name( 起始，PRED_CALL_RE 不匹配）出现 → 不构成未登记候选。detection_predicate 剥方括号后的调用词只有 11 词，全部已登记：has_approved_exception @31（1.5）、dataset @46／owner @47／access_path @48／data_flow @51／data_lineage @52（4.5）、delivery_semantics @64／idempotency @65／time_semantics @69（5.5）、declared @97／registered @98（formula_words，编译规范 2.3）。两个未登记概念按既有合规替代处置：provider 以方括号事实 [C 的提供方 = owner(D, ·)] 表达（先例 @4730）、idempotency_declared 以 idempotency(x, ·) ∧ declared(·) 表达（M4＋MJ-12）。故累计未登记词汇候选仍为 **19 词**（MJ-19 (i) 4＋MJ-20 (iii) 7＋MJ-21 (v) 8），归 s5g 独立 R2 词汇批次。块头注释 @5046-5049 的措辞按 0.22 承诺一不改写，精确事实以 ST-DFL-01.note 与本条为准。(vi) **formal_anchor 12 实例的角色分配**：Z2 三实例——DFL-001 取 implements（第四列 @2198 明文『Z2 联动』＋第二列『异步中继投递事件』→ 本机制是 Z2 的生产侧实现面；行为面消费由 RLP 批承载，见 (vii)），DFL-002／DFL-003 取 consumed_by（两行第四列未明文『Z2 联动』，其外发／消费的事件流为 async interaction → 受 Z2 检查而非实现 Z2 本身，role 取被检查方）。Y2 两实例均 consumed_by（DFL-002 的副本同步以 path_kind=replica、DFL-005 的读侧以 path_kind=view 登记，access_path @2266 的枚举含二者 → 受 Y2『无绕过所有者与契约的访问路径』@2281-2282 检查）。Y1 一实例 implements（DFL-005：第四列 @2202『视图是派生物不是所有者』＝Y1『单一所有者』@2279-2280 在派生面的机制侧落实，与 STP-003 的 Y1 implements 同型）。Y7 一实例 implements（DFL-005：第四列『重建能力是登记项（Y 系列检查）』→ Y7 @2292-2293 的机制侧落实，与 STP-003 同型）。Y4 五实例一律 consumed_by（尾注 @2204『由 Y4 检查』→ 五条为被检查方，非实现方）。**不登记者及理由**：Y3（其判定面为 declared(consistency_level) ∧ declared(consistency_rationale) ∧ compatible(level, aspect6_target) @2283-2285；DFL-003 的时间语义属 5.2.4 面，母本未把 time_semantics 挂到 Y3 → 无明文挂钩不扩张）；Y5／Y6／Y8（敏感数据合规闭环、跨所有者强一致＝冲突信号、共享写例外不超期，4.2.4 五行均未触其判定面）；Z1／Z3–Z8（4.2.4 未明文联动，Z2 系第四列唯一被点名的 Z 性质）。软性质 Y4 5 实例＋Y7 1 实例明列排除于 WV-DFL-E3-01.scope（该 Waiver 只及硬性质面 3 项 6 实例）。(vii) **compatibility 十行与 RLP 批的重叠处置**：实测 10 行＝composable 8／tension 2／requires 0／hard_conflict 0。同批镜像两对在本批内两侧同时登记（M9 要求 peer 存在）：DFL-002↔DFL-003（依尾注 @2204 把『CDC + Kafka 类流平台』并举为同一组合）、DFL-002↔DFL-005（依 6.6 示例四 @2956 的建议重审范围②把二者并列为候选）；跨 kind 单侧六行（DFL-001→STY-003、DFL-002→STY-014、DFL-003→STY-014、DFL-005→STP-003／STP-001／STY-004）按 MJ-5 镜像纪律**不回填**已发布条目（0.22 承诺一）；两条 tension 不升 hard_conflict（1.2.5 冲突矩阵未列该二对 → 级别按母本明文，软性标记评审由 Y4 承担，MJ-22 (iii) 同型）；DFL-004 为空集（第三／四列未给任何风格对或机制对，尾注点名的是 CDC＋流平台，由 DFL-002／DFL-003 承载）。**STY-004 只声明 composable 不声明 requires**：1.2.3『事件溯源 + CQRS』行（@1376）与术语表 CQRS 条（@4280）均明记『不必然绑定事件溯源』→ requires 无母本明文支撑。**DFL-001↔RLP 的发件箱对不登记**：5.2.3 @2477 明文『发件箱（outbox）（生产侧，4.2.4 已定义，行为面消费其投递语义）』→ 定义面由 DFL-001 承载、行为面由 RLP 批承载；RLP kind 未入库 → M9 要求 peer_entry 存在，故本批不登记该对，由 RLP 批的下游侧承载（MJ-17 (iii) 同型），块头注释 @5050-5053 已预置该口径。(viii) **M3 假精确与 6.6 示例四 800ms 的处置边界**：五条 20 项 bound_expr 全为关系式（CONCRETE_NUM_RE @92 不命中）。6.6 示例四给出的『投影读模型刷新延迟 P99 界=800ms（出处=现状基线）』（正文 @2956、形式化注释 @2965）系**某一既有实例的现状测量值**，属该示例的问题空间事实，非 4.2.4 表给出的机制级界 → 不得写入 DFL-005 的 bound_expr 或 latency_budget_delta（否则＝以单一现状基线冒充机制级界，违 0.4）；本批只登记界形（Δrefresh）、符号、单调性与出处要求（DFL-005-AP4，P1）。示例四对本批的另一作用：其结论链（两界均不覆盖联合目标 → V4 失败 → Q3 不可达 → 0.19.4 诊断序 D1 → CH-E → 建议重审范围②『追加 CDC 或物化视图投资并补刷新延迟出处』）是 DFL-002↔DFL-005 composable 的唯一母本明文依据（见 (vii)），亦为 DFL-005 出处要求的实例佐证。(ix) **书目 44 的 ISBN 观察项**：母本 5.7 书目 44（@2750，Hohpe & Woolf, Enterprise Integration Patterns, 2003）著录 ISBN 978-0-321-20068-6，而本地 EPUB 的内容核验值为 isbn13=9780133065091 → 二者不同。母本于书目 46（@2752）已就同类现象明文标注『内容核验 ISBN 9781680502398，与著录一致』→ 说明著录与内容核验的 ISBN 对齐是母本既有纪律，而书目 44 未作此标注。处置：据实记载入 G-DFL-1.impact 的观察项，**不改写母本着录**（0.22 承诺一＋母本零改动前提），裁决口归 s5h。书目 44 的登记面为『5.2.1/5.2.3 消息与协调模式词汇表』（方面五节级）→ 非 4.2.4 的行级面，DFL-003／004／005 不得引为出处（0.17.7 门槛 6；MJ-22 (v) 同型定性）。同理：书目 40（Helland, Immutability）登记面为『Y7 可重建性理论基础』＝性质级面、书目 35（DDIA 2nd ed.）为『4.2.3 一致性模型谱系；复制/分区机制的权威内联来源』＝节级面、书目 5 为方面一节级面 → 一律不下探（五处具体裁定见 G-DFL-1.impact）。(x) **同批镜像与 pending_conflict_rows 的口径**：两对同批镜像在同一提交内两侧写入（M9），relation 一律 composable；因 1.2.5 冲突矩阵未列该二对、且 relation 非 tension／hard_conflict → 不登记于 pending_conflict_rows，open_rows 保持空集（该节键名为已发布接口，不因内容清空而重命名）。(xi) **typical_reversibility 五条一律 bounded 的三级定位**：机制可停用而派生物随之停更、不落权威数据 → 非 costly；但已建成的下游消费面与幂等约定、时间语义选择、新鲜度条款属既有事实（停用后消费方须改造）→ 非 free。定位高于 CSL 类声明性条目的 free、低于 STP-001（存储引擎绑定）的 costly（MJ-21 (vi) 的三级分配同型）。aggregation_semantics 五条一律 itemwise（母本未给 DFL 的跨机制聚合式，4.2.4 为五种可并存机制的登记面 → 不本地造法，MJ-21 (ix)）。constraints_imposed 五条逐字相同七行（4.4『施加约束』表的方面 4 全体 @2251-2257，与 OWN／CSL／STP 批同源），级别分布 hard 20／soft 15（每条：施→3／施→5／施→9／施→10 取硬，施→2／施→6／施→8 取软；MJ-4 判读＋MJ-22 (iv) 同型）。"
