  - entry_id: DFL-001
    kind: DFL
    name: "事务性发件箱（outbox）"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-DFL-01）
    provenance:
      origin: hybrid                   # 骨架=4.2.4 表行（compiled 视图）＋谓词转写与界形参数化（manual，MJ-2 同型）
      source_pointers:
        - {source_type: row_id, value: "4.2.4-事务性发件箱（outbox）", verified: true}
        - {source_type: clause_id, value: "4.2.4", verified: true}
        - {source_type: clause_id, value: "4.3", verified: true}
        - {source_type: clause_id, value: "4.4", verified: true}
        - {source_type: clause_id, value: "4.5", verified: true}
        - {source_type: clause_id, value: "4.6", verified: true}     # 示例一：逻辑所有权先行、物理拆分推迟（首批 CDC 稳定为最后负责时刻）
        - {source_type: clause_id, value: "5.2.3", verified: true}   # 可靠性模式行明文「发件箱（outbox）（生产侧，4.2.4 已定义，行为面消费其投递语义）」＋投递语义登记纪律
        - {source_type: clause_id, value: "5.5", verified: true}     # Z2 投递语义与幂等必答（硬）
        - {source_type: clause_id, value: "1.2.3", verified: true}   # 事件驱动（发布订阅）行：多方订阅同一业务事实、扩展新消费者不改生产者
        - {source_type: clause_id, value: "1.4", verified: true}     # 施加表施→4 事件驱动行「事件日志为一等数据模型」
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: clause_id, value: "0.18.7", verified: true}  # S5 保守界消费 ops_cost 与 typical_reversibility
    typical_reversibility: bounded     # 人工判断：发件箱表与中继作业可停用并回退为直接发布（无数据搬迁），但已按 at-least-once 语义建成的消费者幂等面与堆积清理策略属既有事实 → 取 bounded（高于 CSL 类声明性条目的 free，低于 STP-001 存储绑定的 costly）。18-B S5 消费字段
    applicability:
      problem_space:                   # 骨架源：4.2.4 第三列「适用条件」原文
        - "事件驱动风格下『业务成功但事件丢失』问题的标准解（4.2.4 第三列原文）"
        - "多方需要响应同一业务事实、且扩展新消费者不改生产者（1.2.3 事件驱动行适用条件列）；1.4 施→4 事件驱动行『事件日志为一等数据模型』的生产侧落地机制"
      current_space:                   # 交叉表源：4.3 现状空间驱动＋0.17.2 schema 注（current_space 例）＋kind_profile_DFL.narrative.note（5.5 谓词词汇）
        - "[业务写与发件箱写可由同一本地事务覆盖：发件箱表与业务表同库同存储实例（4.2.4 第二列定义面前提；不成立即退化为应用双写）]"
        - "[异步中继（relay）可部署且其堆积可观测；投递语义与消费者幂等前提已按 5.5 谓词词汇登记：delivery_semantics(interaction, at_least_once) ∧ idempotency(consumer, mechanism)（kind_profile_DFL.narrative.note 要求；未声明 = Z2 违例，5.2.3 投递语义登记纪律）]"
      delivery_space: []               # 4.2.4 本行第三列无交付空间条件、4.3 交付空间驱动不含本项；留空不读作「该维不适用」（G-STY-1 同型，M15）
    envelope:                          # 骨架源：4.2.4 第二列「定义」＋第四列「质量影响要点」；metric 取 6.2.1 既有书写形态；界形参数化＝人工判断（MJ-2 同型，无具体数值）
      - metric: "延迟分位数 P99"
        bound_expr: "P99_event_visible(consumer) ≥ P99_business_commit + Δrelay：业务写在本地事务提交即持久（本机制不劣化写路径），事件对消费者可见须经异步中继 → 可见延迟不小于中继投递间隔；且随中继堆积深度单调不减"
        source: {source_type: row_id, value: "4.2.4-事务性发件箱（outbox）", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "业务写可用性 ⊥ 消息中间件可用性（发件箱表与业务表同事务 → 中间件故障期业务写不受阻）；事件投递可用性 = 中继可用性 ∧ 中间件可用性，且故障期事件只累积不丢失（at-least-once 的可用性收益面）"
        source: {source_type: row_id, value: "4.2.4-事务性发件箱（outbox）", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "触达单元数(新增消费者) = 0（生产者侧）：1.2.3 事件驱动行『扩展新消费者不改生产者』的生产侧前提；触达单元数(Δ 事件 schema) ≤ 生产者单元 + 中继"
        source: {source_type: clause_id, value: "1.2.3", verified: true}
      - metric: "性能：资源占用"
        bound_expr: "资源占用(发布点) = 业务表 + 1 张发件箱表 + 1 个常驻中继作业（轮询或日志读取）→ 存储与调度资源随发布数据集合数同阶增长；发件箱表深度上界由清理策略给出（未登记清理策略即无上界）"
        source: {source_type: row_id, value: "4.2.4-事务性发件箱（outbox）", verified: true}
    cost_profile:
      latency_budget_delta: "Δlatency(事件可见) = P99_event_visible(consumer) − P99_business_commit ≥ 0，且随中继投递间隔与堆积深度单调不减（4.2.4 第二列『异步中继投递事件』的界形）。具体数值母本未给 → 只登记界形、符号与单调性，不填无出处数字（0.4）。kind_profile_DFL 未作 STP 剖面同型的『不降级为选填』要求，本字段据实按本行明文界形填写（判读见 MJ-23）"
      failure_modes: ["中继作业停摆 → 发件箱表堆积，事件可见延迟无上界（业务写不受影响，故障被静默推迟到消费侧）", "at-least-once 重复投递未被消费者幂等吸收 → 业务效果重复（Z2 违例）", "发件箱表与业务表不同库/不同事务 → 机制前提消失，退化为应用双写", "投递语义未显式声明即上线 → 5.2.3『未声明 = Z2 违例』", "发件箱表清理策略缺失 → 存储无界增长（性能：资源占用族）"]
      consistency_impact: "写侧一致性由本地事务保证（业务表 + 发件箱表原子提交）；跨单元一致性不因本机制升格 → 消费者侧仍为最终一致（1.2.3 事件驱动行『最终一致为默认』）；级别声明归方面 4 的 CSL 条目，本条目不重复声明级别；重复投递的效果等价性由消费者幂等承担（5.5 Z2），跨所有者强一致需求仍为 Y6 冲突信号"
      observability_requires: ["发件箱表堆积深度与最旧未投递记录时龄可观测（中继健康度的判据面）", "投递语义（at_least_once）与消费者幂等机制在注册表登记可查（Z2 的机器判定面）", "中继投递速率、失败与重试可观测（事件可见延迟的来源分解）"]
      ops_cost: "[随发布数据集合数同阶上升：每处发件箱表 + 一个常驻中继作业的部署、监控、堆积告警与清理治理；高于纯同步发布（多一类常驻作业与一张表），低于 CDC 管道（不耦合存储引擎日志格式）]"   # 18-B S5 保守界消费字段
      skill_prerequisites: ["以本地事务边界判定机制前提是否成立（业务表与发件箱表是否同库同实例）", "at-least-once 语义下消费者幂等的设计（5.2.3 幂等模式：幂等键 + 去重表/去重窗口；行为面由 RLP 批承载）", "中继形态取舍（轮询发布 vs 事务日志读取）与堆积/清理治理"]
      aggregation_semantics: itemwise
    compatibility:
      - peer_entry: STY-003            # 方向：风格 → 流动机制（4.2.4 第三列明文「事件驱动风格下…的标准解」；1.4 施→4 事件驱动行）。ENUM_RELATION 无 required_by → 在被施侧以 composable 登记（MJ-22 (iii) 同型）；STY-003 已发布 → 按 MJ-5 镜像纪律不回填（0.22 承诺一）
        relation: composable
        evidence: {source_type: row_id, value: "4.2.4-事务性发件箱（outbox）", verified: true}
    constraints_imposed:               # 交叉表源：4.4「施加约束」表（方面 4 全体七行，与 OWN/CSL/STP 批逐字相同）
      - {target_aspect: 2, constraint: "数据归属现状回馈分解：现状数据不可干净归属时，S4 策略受约束、拆分序列须按数据迁移可行性排序", level: soft}
      - {target_aspect: 3, constraint: "数据契约的 schema 与语义条款（单位/值域/空值/敏感性/新鲜度）由本方面供给", level: hard}
      - {target_aspect: 5, constraint: "一致性模型 → 协调模式可行集：跨所有者强一致需求 → Saga + 业务补偿，或回溯方面 1 重审部署风格（Y6 的下游消费路径）", level: hard}
      - {target_aspect: 6, constraint: "一致性级别声明与新鲜度条款 → 质量判定的代价计入项", level: soft}
      - {target_aspect: 8, constraint: "不变式 → 对账验证项；血缘 → 派生数据可重建性测试；边界校验 → 契约测试的数据面", level: soft}
      - {target_aspect: 9, constraint: "数据漂移守护对象：schema 漂移（实际 schema 偏离注册契约）、所有权违例（绕过所有者的直写流量）、共享写例外超期", level: hard}
      - {target_aspect: 10, constraint: "机器层：Y 谓词集 + 血缘图；人类层：覆盖谓词子集 {Y 谓词集、血缘} 的投影视图（受众问题 = 数据所有权与流动；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: DFL-001-AP1
        description: "业务写与事件发布分离为两次写（应用层双写），以重试替代同一本地事务的原子性"
        detection_predicate: "∃ D: data_flow(D, ·, ·, [outbox]) ∧ ¬[业务写与发件箱写在同一本地事务内提交] ∧ ¬has_approved_exception(·, ·, ·)"
        signal_level: P0               # 4.2.4 第二列把「同一本地事务」写进定义 → 定义性判据缺失即机制不成立，其后果正是第三列所述「业务成功但事件丢失」→ P0（MJ-4 判据）
      - pattern_id: DFL-001-AP2
        description: "投递语义未显式声明即上线（假设中间件提供恰好一次）"
        detection_predicate: "∃ I: [I 为经发件箱投递的异步交互] ∧ ¬declared(delivery_semantics(I))"
        signal_level: P0               # 5.2.3 投递语义登记纪律明文「未声明 = Z2 违例」＋5.5 Z2 列为硬 → P0（MJ-4 判据）
      - pattern_id: DFL-001-AP3
        description: "消费者未声明幂等机制而依赖 at-least-once 投递"
        detection_predicate: "∃ I, c: delivery_semantics(I, at_least_once) ∧ [c 为 I 的消费者] ∧ ¬idempotency(c, ·)"
        signal_level: P0               # 4.2.4 第四列明文「投递语义 at-least-once → 消费者幂等（Z2 联动）」；5.5 Z2 硬（semantics ≠ at_most_once → idempotency_declared(consumer)）→ P0
      - pattern_id: DFL-001-AP4
        description: "发件箱表无清理策略与堆积告警（表深度与最旧记录时龄不可观测）"
        detection_predicate: "∃ D: data_flow(D, ·, ·, [outbox]) ∧ ¬[发件箱表清理策略已登记] ∧ ¬[堆积深度/最旧记录时龄可观测]"
        signal_level: P2               # 不构成 4.5/5.5 性质违例，而是「性能：资源占用」族的漂移信号（须以表深度阈值 + 趋势双判据核定）→ P2（MJ-4 判据）
    formal_anchor:                     # 交叉表源：4.5 可验证性质 / 5.5 Z 系列
      - {property_id: Z2, role: implements}     # 4.2.4 第四列明文「投递语义 at-least-once → 消费者幂等（Z2 联动）」＋5.5 Z2 硬＋5.2.3 投递语义登记纪律 → 本机制是 Z2 的生产侧实现面（行为面消费由 RLP 批承载）
      - {property_id: Y4, role: consumed_by}    # 流动机制与风格的自洽性由 Y4 检查（4.2.4 尾注；4.5 级别列为软 → 软性标记评审）
    references:
      - bib_id: "42"                   # Chris Richardson. "Transactional Outbox pattern." microservices.io —— 4.7 书目 42 的登记面逐字为「4.2.4 发件箱模式」（行级登记；本批启动前强制核查：本地 resources/se《Chris Richardson - Pattern_ Transactional outbox.epub》在库、在线 URL 在位；模式页无定年 → 无版本漂移判定面）
        support_claim: "事务性发件箱模式的机制定义与投递语义（业务写与事件写同本地事务、异步中继投递、可能重复发布 → 消费者须幂等）＝4.2.4 第一行第二列与第四列的外部文献支撑面"
        compile_usage: metadata_extraction   # 4.7 表内该条 compile_usage 列原文；提取以原文存档为准，不以本注册表转述替代
        trust_grade: "[已核验]"
    narrative:
      benefit_cost_analysis: "收益：4.2.4 第三列把本机制定性为事件驱动风格下『业务成功但事件丢失』问题的**标准解**——业务写与事件发布在同一本地事务内原子提交，把双写不一致消解为单库事务问题；投递语义 at-least-once 使中继故障期只累积不丢失，业务写可用性不依赖消息中间件可用性；1.2.3 事件驱动行『扩展新消费者不改生产者』的扩展性收益以本机制为生产侧前提。代价：每处发布点增一张发件箱表 + 一个常驻中继作业（性能：资源占用族），堆积深度与最旧记录时龄成为新的运维观测面；事件可见延迟不小于中继投递间隔，母本未给量化增量（0.4 → 只登记界形）；at-least-once 把幂等义务推给全部消费者（Z2 硬），未声明即违例；发件箱表清理与事件 schema 演化是长期治理项。行为面（幂等模式、重试与去重窗口、质量影响卡片）由 5.2.3 承载，本条目只登记定义面（5.2.3 明文『4.2.4 已定义，行为面消费其投递语义』）。"
      typical_scenarios: "事件驱动风格定案后的生产侧可靠发布（1.4 施→4 事件驱动行『事件日志为一等数据模型』；4.2.4 第三列）；棕地过渡期以本地事务保住业务写与事件发布的原子性、物理拆分推迟的场合（4.6 示例一：逻辑所有权先行，最后负责时刻绑定『存储过程规则文档化完成 + 第一批 CDC 管道稳定运行后』）；多方订阅同一业务事实且不容许事件丢失的场合（1.2.3 事件驱动行）；消费者侧以幂等键 + 去重表吸收重复投递的配套场合（5.2.3 幂等/收件箱模式的行为面）。"
      common_misuse: "以应用层双写 + 重试替代同一本地事务（AP1，机制定义面缺失）；未声明投递语义即上线（AP2，5.2.3『未声明 = Z2 违例』）；假设中间件提供 exactly-once 而免除消费者幂等（AP3；5.2.3 明文『后者仅指**有效恰好一次**——幂等消费达成的效果等价，非中间件魔法』）；发件箱表无清理与堆积告警（AP4，资源占用漂移）；把发件箱当作跨单元强一致手段（Y6 冲突信号不因本机制消解，级别声明归 CSL 条目）；在单体风格下引入发件箱 + 流平台（4.2.4 尾注 Y4 过度工程信号，软性标记评审）；为中继投递延迟填无出处数值（0.4＋6.2.1 量化纪律）。"

  - entry_id: DFL-002
    kind: DFL
    name: "变更数据捕获（CDC）"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-DFL-01）
    provenance:
      origin: hybrid                   # 骨架=4.2.4 表行（compiled 视图）＋谓词转写与界形参数化（manual，MJ-2 同型）
      source_pointers:
        - {source_type: row_id, value: "4.2.4-变更数据捕获（CDC）", verified: true}
        - {source_type: clause_id, value: "4.2.4", verified: true}
        - {source_type: clause_id, value: "4.3", verified: true}     # 现状空间驱动「存储引擎锁定 → CDC 可行性（事务日志可访问性）成为勘察必答项」
        - {source_type: clause_id, value: "4.4", verified: true}
        - {source_type: clause_id, value: "4.5", verified: true}     # access_path 的 path_kind 含 replica（副本同步面）；Y2 硬
        - {source_type: clause_id, value: "4.6", verified: true}     # 示例一：最后负责时刻绑定「第一批 CDC 管道稳定运行后」
        - {source_type: clause_id, value: "6.6", verified: true}     # 示例四：建议重审范围含「追加 CDC 或物化视图投资并补刷新延迟出处」
        - {source_type: clause_id, value: "0.17.2", verified: true}  # schema 注 current_space 例「事务日志可访问 → CDC 可行」
        - {source_type: clause_id, value: "5.5", verified: true}     # 事件流为异步交互 → delivery_semantics 与 idempotency 前提（Z2）
        - {source_type: clause_id, value: "0.11", verified: true}    # 现状锁定（遗留库不可改造应用代码）
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: clause_id, value: "0.18.7", verified: true}  # S5 保守界消费 ops_cost 与 typical_reversibility
    typical_reversibility: bounded     # 人工判断：CDC 管道可停用（读侧派生物随之停更，不落权威数据），但已按捕获事件流建成的下游消费面与副本同步关系属既有事实；日志格式耦合存储引擎 → 引擎更换时管道须重建（4.2.4 第四列）→ 取 bounded。18-B S5 消费字段
    applicability:
      problem_space:                   # 骨架源：4.2.4 第三列「适用条件」原文
        - "遗留库集成：无法改造应用代码时的唯一非侵入路径（4.2.4 第三列原文）"
        - "副本同步（同行原文）；4.6 示例一把「第一批 CDC 管道稳定运行后」列为物理拆分推迟的最后负责时刻"
      current_space:                   # 交叉表源：4.3 现状空间驱动（CDC 可行性为勘察必答项）＋0.17.2 schema 注＋kind_profile_DFL.narrative.note
        - "[事务日志可访问性已勘察且结论为可访问（4.3 现状空间驱动明文『存储引擎锁定 → CDC 可行性（事务日志可访问性）成为勘察必答项』；0.17.2 schema 注 current_space 例同旨）——本项为**必答**，缺失即勘察不完备]"
        - "[存储引擎与其日志格式已登记：日志格式耦合存储引擎（4.2.4 第四列原文），引擎更换 = 管道重建]"
        - "[外发事件流的投递语义与消费者幂等前提已按 5.5 谓词词汇登记：delivery_semantics(stream, ·) ∧ idempotency(consumer, mechanism)（kind_profile_DFL.narrative.note 对『CDC/事件流类条目』的显式要求；未声明 = Z2 违例，5.2.3）]"
      delivery_space:                  # 交叉表源：4.3 交付空间驱动（运维能力／DBA 能力）
        - "[交付空间具备 CDC 管道的运维能力（连接器部署、日志位点管理、schema 变更跟随）；4.3 交付空间驱动『运维能力 → …硬过滤器』同型适用——本行第三列未直给交付空间条件，此处按 4.3 方向性事实登记，不细化为母本未给的判据（M15）]"
    envelope:                          # 骨架源：4.2.4 第二列「定义」＋第四列「质量影响要点」；metric 取 6.2.1 既有书写形态；界形参数化（MJ-2 同型，无具体数值）
      - metric: "延迟分位数 P99"
        bound_expr: "P99_change_visible(下游) ≥ P99_commit(源库) + Δcapture + Δrelay：变更须先落源库事务日志、再由捕获器读取并外发 → 可见延迟严格大于源库提交延迟；且随日志位点滞后（lag）单调不减。6.6 示例四要求此类刷新延迟界必须**补出处**（现状基线测量），不得编造精确值"
        source: {source_type: row_id, value: "4.2.4-变更数据捕获（CDC）", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "触达单元数(Δ 源库 schema) ≥ 捕获管道 + 全体下游消费者：日志格式与表结构耦合 → schema 变更沿事件流传播（4.2.4 第四列『日志格式耦合存储引擎』的可修改性下界）；触达单元数(Δ 存储引擎) ≥ 1 管道重建（引擎更换即重建）"
        source: {source_type: row_id, value: "4.2.4-变更数据捕获（CDC）", verified: true}
      - metric: "性能：资源占用"
        bound_expr: "资源占用(源库) ≥ 日志读取连接 + 位点存储：捕获为常驻读取负载，源库侧新增连接与 I/O 面；非侵入路径的代价是把负载从应用代码移到数据库层"
        source: {source_type: row_id, value: "4.2.4-变更数据捕获（CDC）", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "下游派生数据的可用性上界 = min(源库可用性, 捕获器可用性, 事件流可用性)：任一环节故障期下游只陈旧不丢失（日志位点可续读），但陈旧窗口无上界除非位点滞后已登记告警阈值"
        source: {source_type: row_id, value: "4.2.4-变更数据捕获（CDC）", verified: true}
    cost_profile:
      latency_budget_delta: "Δlatency(变更可见) = P99_change_visible − P99_commit ≥ Δcapture + Δrelay > 0，且随日志位点滞后单调不减（4.2.4 第二列『从数据库事务日志提取变更并外发为事件流』的界形）。具体数值母本未给，且 6.6 示例四明记此类界须『补刷新延迟出处』（现状基线测量）→ 只登记界形、符号与单调性，不填无出处数字（0.4）"
      failure_modes: ["事务日志不可访问（引擎配置、权限或托管形态限制）→ 机制前提不成立，勘察必答项未答（4.3）", "日志位点丢失或滞后无告警 → 下游陈旧窗口无上界且不可观测", "源库 schema 变更未跟随 → 捕获中断或静默错位（4.4 施→9 schema 漂移守护对象）", "外发事件流未声明投递语义 → Z2 违例（5.2.3 投递语义登记纪律）", "存储引擎更换 → 日志格式耦合使管道整体重建（4.2.4 第四列）", "以 CDC 绕过所有者契约直取他者数据 → Y2 违例（非侵入不等于免契约）"]
      consistency_impact: "捕获为异步外发 → 下游一致性不优于最终一致（1.2.3 事件驱动行『最终一致为默认』）；源库本地事务语义不被本机制改变（非侵入读取）；副本同步形态下的读一致性归方面 4 的 CSL 条目声明（access_path 的 path_kind=replica，4.5）；跨所有者强一致需求仍为 Y6 冲突信号，CDC 不构成其解"
      observability_requires: ["日志位点滞后（lag）与最旧未消费变更时龄可观测（陈旧窗口的判据面）", "捕获器的 schema 变更跟随状态可查（4.4 施→9 schema 漂移守护）", "外发事件流的投递语义与消费者幂等机制在注册表登记可查（Z2 的机器判定面）", "源库侧捕获连接与读取负载可观测（性能：资源占用族）"]
      ops_cost: "[随捕获源库数同阶上升：每源一套连接器部署、日志位点管理、schema 跟随与滞后告警；高于发件箱（耦合存储引擎日志格式、引擎更换即重建），四行中运维面最重之一（与流处理、多语言持久化同阶）]"   # 18-B S5 保守界消费字段
      skill_prerequisites: ["事务日志可访问性的勘察能力（4.3 现状空间驱动的必答项）", "存储引擎日志格式与版本耦合面的评估（引擎更换的重建成本）", "捕获事件流的投递语义与下游幂等设计（5.5 Z2；行为面由 RLP 批承载）"]
      aggregation_semantics: itemwise
    compatibility:
      - peer_entry: STY-014            # 4.2.4 尾注明文「单体风格下选用 CDC + Kafka 类流平台 = 过度工程信号」→ 与单体风格构成张力；1.2.5 冲突矩阵未列该对 → 不升 hard_conflict（MJ-22 (iii) 同型：级别按母本明文，软性标记评审由 Y4 承担）
        relation: tension
        evidence: {source_type: clause_id, value: "4.2.4", verified: true}
      - peer_entry: DFL-005            # 6.6 示例四把「追加 CDC 或物化视图投资并补刷新延迟出处」并列为同一建议重审范围的两个候选 → 二者为可替换的派生读模型供给路径（composable；同批条目，镜像在本批内同时登记）
        relation: composable
        evidence: {source_type: clause_id, value: "6.6", verified: true}
      - peer_entry: DFL-003            # 4.2.4 尾注把「CDC + Kafka 类流平台」并举为同一组合（其被检查的对象是风格自洽性；在事件驱动风格下该组合成立）→ 遗留库变更外发 + 连续变换/聚合构成实时派生链路（composable；DFL-003 侧已登记，本行为同批镜像登记）
        relation: composable
        evidence: {source_type: clause_id, value: "4.2.4", verified: true}
    constraints_imposed:               # 交叉表源：4.4「施加约束」表（方面 4 全体七行，与 OWN/CSL/STP 批逐字相同）
      - {target_aspect: 2, constraint: "数据归属现状回馈分解：现状数据不可干净归属时，S4 策略受约束、拆分序列须按数据迁移可行性排序", level: soft}
      - {target_aspect: 3, constraint: "数据契约的 schema 与语义条款（单位/值域/空值/敏感性/新鲜度）由本方面供给", level: hard}
      - {target_aspect: 5, constraint: "一致性模型 → 协调模式可行集：跨所有者强一致需求 → Saga + 业务补偿，或回溯方面 1 重审部署风格（Y6 的下游消费路径）", level: hard}
      - {target_aspect: 6, constraint: "一致性级别声明与新鲜度条款 → 质量判定的代价计入项", level: soft}
      - {target_aspect: 8, constraint: "不变式 → 对账验证项；血缘 → 派生数据可重建性测试；边界校验 → 契约测试的数据面", level: soft}
      - {target_aspect: 9, constraint: "数据漂移守护对象：schema 漂移（实际 schema 偏离注册契约）、所有权违例（绕过所有者的直写流量）、共享写例外超期", level: hard}
      - {target_aspect: 10, constraint: "机器层：Y 谓词集 + 血缘图；人类层：覆盖谓词子集 {Y 谓词集、血缘} 的投影视图（受众问题 = 数据所有权与流动；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: DFL-002-AP1
        description: "事务日志可访问性未勘察即把 CDC 列入候选（勘察必答项缺答）"
        detection_predicate: "∃ D: data_flow(D, ·, ·, [cdc]) ∧ ¬[事务日志可访问性已勘察并登记结论] ∧ ¬has_approved_exception(·, ·, ·)"
        signal_level: P0               # 4.3 现状空间驱动明文把 CDC 可行性（事务日志可访问性）定为「勘察必答项」；缺答即公理 A2 可追溯性违例（决策无现状依据，同 4.6 示例三 A2 定性）→ P0（MJ-4 判据）
      - pattern_id: DFL-002-AP2
        description: "以 CDC 非侵入为名绕过所有者契约直取他者数据"
        detection_predicate: "∃ D, c, C: dataset(D) ∧ owner(D, ·) ∧ access_path(D, c, replica, C) ∧ ¬(registered(C) ∧ [C 的提供方 = owner(D, ·)])"
        signal_level: P0               # 4.5 Y2 硬（无绕过所有者与契约的访问路径；path_kind 含 replica）→ P0
      - pattern_id: DFL-002-AP3
        description: "外发事件流未声明投递语义与消费者幂等"
        detection_predicate: "∃ I: [I 为 CDC 外发的事件流交互] ∧ (¬declared(delivery_semantics(I, ·)) ∨ [delivery_semantics(I, ·) ≠ at_most_once ∧ ¬idempotency([I 的消费者], ·)])"
        signal_level: P0               # 5.5 Z2 硬＋5.2.3『未声明 = Z2 违例』；kind_profile_DFL.narrative.note 对 CDC/事件流类条目显式要求该前提 → P0
      - pattern_id: DFL-002-AP4
        description: "日志位点滞后无告警阈值（下游陈旧窗口不可观测）"
        detection_predicate: "∃ D: data_flow(D, ·, ·, [cdc]) ∧ ¬[日志位点滞后阈值与告警已登记]"
        signal_level: P2               # 不构成 4.5/5.5 性质违例，而是新鲜度/陈旧窗口的漂移信号（须以滞后阈值 + 趋势双判据核定）→ P2（MJ-4 判据）
    formal_anchor:                     # 交叉表源：4.5 可验证性质 / 5.5 Z 系列
      - {property_id: Z2, role: consumed_by}    # 外发的事件流为异步交互 → 投递语义与消费者幂等受 Z2 检查（5.5 硬；5.2.3『未声明 = Z2 违例』；kind_profile_DFL.narrative.note 对 CDC/事件流类条目的显式要求）→ AP3 的性质面。role 取 consumed_by：4.2.4 本行第四列未如发件箱行那样明文「Z2 联动」，本机制是 Z2 的被检查面而非其实现面（判读入 MJ-23）
      - {property_id: Y2, role: consumed_by}    # 副本同步形态的访问路径以 path_kind=replica 登记（4.5 access_path），须满足 Y2「无绕过所有者与契约的访问路径」（硬）→ AP2 的性质面
      - {property_id: Y4, role: consumed_by}    # 流动机制与风格的自洽性由 Y4 检查（4.2.4 尾注举的正是「单体风格下选用 CDC + Kafka 类流平台 = 过度工程信号」；4.5 级别列为软）
    references:
      - bib_id: "43"                   # Debezium 项目文档. https://debezium.io/ —— 4.7 书目 43 的登记面逐字为「4.2.4 CDC 的工程参照」（行级登记；本批启动前强制核查：文档本地无存档〔与著录一致〕、在线站点在位〔Latest stable 3.6／Development 3.7〕、母本未标版本 → 无版本漂移判定面）
        support_claim: "CDC 的工程参照面（连接器形态与事务日志读取实现的存在性）；母本明记 compile_usage=narrative_only 且「CDC 机制概念由书目 5/44 承载」→ 按 G-DEC-1 内书目 17（Conway）先例，本项只作叙述性支撑，**不充当 envelope/applicability 的决策性出处**（0.12 分级／M6）"
        compile_usage: narrative_only        # 4.7 表内该条 compile_usage 列原文（编译时跳过知识提取）
        trust_grade: "[已核验（工具存在）]"
    narrative:
      benefit_cost_analysis: "收益：4.2.4 第三列把本机制定性为遗留库集成中「无法改造应用代码时的**唯一非侵入路径**」——不改一行业务代码即可把既有库的变更外发为事件流，是 4.6 示例一棕地过渡（逻辑所有权先行、物理拆分推迟）的关键使能项，其最后负责时刻正是绑定「第一批 CDC 管道稳定运行后」；副本同步形态为读侧提供 path_kind=replica 的合法访问路径。代价：4.2.4 第四列明记「日志格式耦合存储引擎」→ 引擎更换即管道重建，且该耦合面被列为**现状空间勘察项**（4.3 更升格为『必答项』）；变更可见延迟严格大于源库提交延迟，母本未给量化界，6.6 示例四因此要求『补刷新延迟出处』（现状基线测量，非编造精确值）；源库侧新增常驻读取负载与位点管理；schema 变更沿事件流传播，触达面扩大到全体下游消费者；外发事件流仍受 Z2 约束（投递语义与消费者幂等必答）；非侵入不等于免契约——绕过所有者直取即 Y2 违例。"
      typical_scenarios: "遗留共享库集成、应用代码不可改造的场合（4.2.4 第三列；0.11 现状锁定）；棕地「逻辑所有权先行 + 物理拆分推迟」的过渡期变更外发（4.6 示例一，最后负责时刻绑定首批 CDC 管道稳定）；副本同步以供给读侧 replica 访问路径的场合（4.5 access_path 的 path_kind=replica）；6.6 示例四质量目标不可达时的建议重审范围之一（「追加 CDC 或物化视图投资并补刷新延迟出处」）；存储引擎锁定但事务日志可访问的场合（4.3 现状空间驱动必答项）。"
      common_misuse: "事务日志可访问性未勘察即选型（AP1，勘察必答项缺答 = A2 违例）；以「非侵入」为名绕过所有者契约直取他者数据（AP2，Y2 硬违例）；外发事件流未声明投递语义与消费者幂等（AP3，Z2 硬违例；剖面 note 显式要求）；日志位点滞后无阈值告警（AP4，陈旧窗口不可观测）；把 CDC 当作跨所有者强一致的解（Y6 冲突信号不消解）；在单体风格下引入 CDC + 流平台（4.2.4 尾注 Y4 过度工程信号，软性标记评审）；为刷新延迟填无出处数值（0.4＋6.2.1 量化纪律；6.6 示例四要求补出处）；以 narrative_only 的书目 43 充当决策性出处（0.12 分级／M6）。"

  - entry_id: DFL-003
    kind: DFL
    name: "流处理"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-DFL-01）
    provenance:
      origin: hybrid                   # 骨架=4.2.4 表行（compiled 视图）＋谓词转写与界形参数化（manual，MJ-2 同型）
      source_pointers:
        - {source_type: row_id, value: "4.2.4-流处理", verified: true}
        - {source_type: clause_id, value: "4.2.4", verified: true}
        - {source_type: clause_id, value: "5.2.4", verified: true}   # 第四列明文的联动对象：事件时间 vs 处理时间的显式选择＋水位线〔watermark〕释义
        - {source_type: clause_id, value: "5.5", verified: true}     # time_semantics／delivery_semantics／idempotency 谓词词汇与 Z2 硬
        - {source_type: clause_id, value: "5.2.3", verified: true}   # 投递语义登记纪律（未声明 = Z2 违例）
        - {source_type: clause_id, value: "4.5", verified: true}     # data_flow(D, from, to, mechanism) 的 mechanism ∈ 4.2.4 表；Y4 软
        - {source_type: clause_id, value: "1.2.1", verified: true}   # 管道-过滤器风格行适用条件含「批处理、流处理、ETL（抽取-变换-装载）」
        - {source_type: clause_id, value: "1.2.3", verified: true}   # 事件驱动（发布订阅）行「最终一致为默认」「扩展新消费者不改生产者」
        - {source_type: clause_id, value: "4.3", verified: true}     # 交付空间驱动「运维能力 → 硬过滤器」方向性事实
        - {source_type: clause_id, value: "4.4", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: clause_id, value: "0.18.7", verified: true}  # S5 保守界消费 ops_cost 与 typical_reversibility
    typical_reversibility: bounded     # 人工判断：流作业可停用（派生视图/指标随之停更，不落权威数据），但已按流结果建成的下游消费面属既有事实，且时间语义一经对外供给即成既有事实（事件时间↔处理时间切换改变结果时基）→ 取 bounded。18-B S5 消费字段
    applicability:
      problem_space:                   # 骨架源：4.2.4 第三列「适用条件」原文
        - "实时派生视图、监控指标（4.2.4 第三列原文）"
        - "对无界事件流做连续变换/聚合的场合（同行第二列定义面）；1.2.1 管道-过滤器风格行把「流处理」列为其适用条件之一（数据流经一串无状态变换单元）"
      current_space:                   # 交叉表源：5.2.4 时间语义＋5.5 谓词词汇＋kind_profile_DFL.narrative.note（事件流类条目）
        - "[事件时间 vs 处理时间的选择已显式登记、乱序容忍度以水位线〔watermark〕表达（4.2.4 第四列『事件时间 vs 处理时间语义必须显式（方面 5 的 5.2.4 联动）』；5.2.4 明文『流处理与事件驱动分析的语义分岔点』）——5.5 谓词形态 time_semantics(stream, event_time|processing_time, watermark_policy)]"
        - "[上游事件流的投递语义与本作业的消费幂等前提已按 5.5 谓词词汇登记：delivery_semantics(stream, ·) ∧ idempotency(·, mechanism)（kind_profile_DFL.narrative.note 对『CDC/事件流类条目』的显式要求；未声明 = Z2 违例，5.2.3）]"
        - "[存在可消费的无界事件流（上游为发件箱中继外发、CDC 外发等事件源）；无此前提则本机制不适用——4.2.4 第三列把适用面限定为『实时派生视图、监控指标』]"
      delivery_space:                  # 交叉表源：4.3 交付空间驱动（运维能力）
        - "[交付空间具备流作业与状态后端的运维能力（作业重启与回放、状态后端容量治理、水位线滞后监控）；4.3 交付空间驱动『运维能力 → …硬过滤器』同型适用——本行第三列未直给交付空间条件，此处按 4.3 方向性事实登记，不细化为母本未给的判据（M15）]"
    envelope:                          # 骨架源：4.2.4 第二列「定义」＋第四列「质量影响要点」；metric 取 6.2.1 既有书写形态；界形参数化（MJ-2 同型，无具体数值）
      - metric: "延迟分位数 P99"
        bound_expr: "P99_derived_visible ≥ P99_event_arrival + Δwindow + Δstate_emit：派生结果的可见延迟受窗口/水位线推进节奏的下界约束；事件时间语义下随水位线滞后（乱序容忍度）单调不减，处理时间语义下随链路处理耗时单调不减（5.2.4 语义分岔点的界形后果）。具体数值母本未给（0.4）"
        source: {source_type: row_id, value: "4.2.4-流处理", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "触达单元数(Δ 变换/聚合逻辑) ≤ 1 流作业 + 其结果的消费者：连续变换/聚合收敛于流作业内，不改上游生产者（4.2.4 第二列；1.2.3 事件驱动行『扩展新消费者不改生产者』）；触达单元数(Δ 时间语义) ≥ 1 流作业 + 全体依赖其结果时基的下游（事件时间↔处理时间切换改变结果语义，非局部改动）"
        source: {source_type: row_id, value: "4.2.4-流处理", verified: true}
      - metric: "性能：资源占用"
        bound_expr: "资源占用 ≥ 常驻计算 + 状态后端存储，且状态后端占用随键基数与窗口长度单调增长（无界流的连续聚合须持有中间状态）；4.2.4 未给量化界 → 只登记构成项与单调方向（0.4）"
        source: {source_type: row_id, value: "4.2.4-流处理", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "派生结果的可用性上界 = min(上游事件流可用性, 流作业可用性, 状态后端可用性)；作业重启期须回放，回放完成前派生结果不满足新鲜度界（水位线须重新推进，5.2.4）"
        source: {source_type: row_id, value: "4.2.4-流处理", verified: true}
    cost_profile:
      latency_budget_delta: "Δlatency(派生可见) = P99_derived_visible − P99_event_arrival ≥ Δwindow + Δstate_emit > 0；事件时间语义下另加水位线滞后项（乱序容忍度），处理时间语义下该项为零但结果时基随处理抖动漂移（5.2.4）。数值母本未给 → 只登记界形、符号与单调性（0.4）"
      failure_modes: ["时间语义未显式选择 → 结果时基不可解释，乱序与迟到事件的处置无据（4.2.4 第四列『必须显式』；5.2.4）", "水位线策略缺失或过紧 → 迟到事件被静默丢弃，派生结果偏低且不可观测", "状态后端无界增长（键基数或窗口长度失控）→ 作业退化或崩溃", "作业重启后回放未完成即对外供给 → 派生结果不满足新鲜度界", "上游事件流未声明投递语义或本作业消费非幂等 → Z2 违例（5.2.3 投递语义登记纪律）", "以流处理承载对新鲜度要求低的批式分析 → 常驻成本无对应收益（4.2.4 尾注 Y4 过度工程信号同型）"]
      consistency_impact: "派生视图/指标为异步连续计算结果 → 一致性不优于最终一致（1.2.3 事件驱动行『最终一致为默认』）；本机制不改变上游权威数据的一致性级别声明（Y3 归其所有者）；以流处理承载跨所有者强一致 = Y6 冲突信号，本机制不构成其解；派生结果的可重建性归 Y7 判定面（4.2.4 物化视图行承载登记项，见 DFL-005）"
      observability_requires: ["水位线进度与滞后（事件时间 vs 处理时间之差）可观测（新鲜度界的判据面，5.2.4）", "作业重启与回放状态可查（回放完成前不得视为达标）", "状态后端容量、键基数与检查点耗时可观测（性能：资源占用族）", "上游事件流的投递语义与本作业的幂等机制在注册表登记可查（Z2 的机器判定面）"]
      ops_cost: "[随流作业数与状态后端规模上升：常驻计算集群、状态后端容量与快照/恢复、水位线与滞后告警；高于批式 ETL（常驻 vs 周期），与 CDC 管道同阶（4.3 交付空间驱动的运维能力方向）]"   # 18-B S5 保守界消费字段
      skill_prerequisites: ["事件时间/处理时间语义与水位线策略设计（5.2.4 语义分岔点）", "状态后端容量治理与检查点/恢复演练（作业重启回放）", "上游事件流的投递语义与幂等消费设计（5.5 Z2；行为面由 RLP 批承载）"]
      aggregation_semantics: itemwise
    compatibility:
      - peer_entry: STY-014            # 4.2.4 尾注明文「单体风格下选用 CDC + Kafka 类流平台 = 过度工程信号」——本行即该尾注点名的「流平台」侧；1.2.5 冲突矩阵未列该对 → 不升 hard_conflict（MJ-22 (iii) 同型：级别按母本明文，软性标记评审由 Y4 承担）
        relation: tension
        evidence: {source_type: clause_id, value: "4.2.4", verified: true}
      - peer_entry: DFL-002            # 同尾注把「CDC + Kafka 类流平台」并举为同一组合（其被检查的对象是风格自洽性；在事件驱动风格下该组合成立）→ 遗留库变更外发 + 连续变换/聚合构成实时派生链路（composable；同批条目，镜像在 DFL-002 侧同批登记）
        relation: composable
        evidence: {source_type: clause_id, value: "4.2.4", verified: true}
      # 与 STY-003（事件驱动）不成对登记：4.2.4 未把本行与任何风格明文成对，风格自洽性由 Y4 承担（检查面而非条目间关系）→ 按 MJ-9 不扩张（跨 kind 无母本明文依据不登记）
    constraints_imposed:               # 交叉表源：4.4「施加约束」表（方面 4 全体七行，与 OWN/CSL/STP 批逐字相同）
      - {target_aspect: 2, constraint: "数据归属现状回馈分解：现状数据不可干净归属时，S4 策略受约束、拆分序列须按数据迁移可行性排序", level: soft}
      - {target_aspect: 3, constraint: "数据契约的 schema 与语义条款（单位/值域/空值/敏感性/新鲜度）由本方面供给", level: hard}
      - {target_aspect: 5, constraint: "一致性模型 → 协调模式可行集：跨所有者强一致需求 → Saga + 业务补偿，或回溯方面 1 重审部署风格（Y6 的下游消费路径）", level: hard}
      - {target_aspect: 6, constraint: "一致性级别声明与新鲜度条款 → 质量判定的代价计入项", level: soft}
      - {target_aspect: 8, constraint: "不变式 → 对账验证项；血缘 → 派生数据可重建性测试；边界校验 → 契约测试的数据面", level: soft}
      - {target_aspect: 9, constraint: "数据漂移守护对象：schema 漂移（实际 schema 偏离注册契约）、所有权违例（绕过所有者的直写流量）、共享写例外超期", level: hard}
      - {target_aspect: 10, constraint: "机器层：Y 谓词集 + 血缘图；人类层：覆盖谓词子集 {Y 谓词集、血缘} 的投影视图（受众问题 = 数据所有权与流动；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: DFL-003-AP1
        description: "事件时间 vs 处理时间语义未显式选择（或乱序容忍度未以水位线表达）"
        detection_predicate: "∃ s: [s 为无界事件流] ∧ data_flow(·, ·, ·, [stream]) ∧ ¬declared(time_semantics(s, ·, ·))"
        signal_level: P1               # 人工判断（MJ-4 同型）：4.2.4 第四列「必须显式」＋5.2.4「显式选择」为母本明文强制，但 4.5 Y 系列／5.5 Z 系列无直接可绑定的硬性质（Z2 管投递语义、Y3 管一致性级别）→ 不满足 P0 判据，定 P1 限期整改
      - pattern_id: DFL-003-AP2
        description: "上游事件流未声明投递语义，或流作业消费非幂等"
        detection_predicate: "∃ I: [I 为流入本作业的事件流交互] ∧ (¬declared(delivery_semantics(I, ·)) ∨ [delivery_semantics(I, ·) ≠ at_most_once ∧ ¬idempotency([本作业], ·)])"
        signal_level: P0               # 5.5 Z2 硬＋5.2.3『未声明 = Z2 违例』；kind_profile_DFL.narrative.note 对『CDC/事件流类条目』显式要求该前提 → P0（MJ-4 判据）
      - pattern_id: DFL-003-AP3
        description: "水位线策略缺失或过紧（迟到事件被静默丢弃）"
        detection_predicate: "∃ s: time_semantics(s, event_time, ·) ∧ ¬[水位线策略与迟到事件处置已登记]"
        signal_level: P1               # 人工判断（MJ-4 同型）：5.2.4 明文「乱序容忍度以水位线〔watermark…〕表达」→ 缺登记使结果正确性不可解释；无 Y/Z 硬性质可绑定 → P1 限期整改
      - pattern_id: DFL-003-AP4
        description: "状态后端无界增长（键基数或窗口长度失控，无容量阈值告警）"
        detection_predicate: "∃ j: [j 为流作业] ∧ ¬[状态后端容量阈值与告警已登记]"
        signal_level: P2               # 不构成 4.5/5.5 性质违例，而是资源占用的漂移信号（须以阈值 + 趋势双判据核定）→ P2（MJ-4 判据）
    formal_anchor:                     # 交叉表源：4.5 可验证性质 / 5.5 Z 系列
      - {property_id: Z2, role: consumed_by}    # 本机制消费的无界事件流为异步交互 → 投递语义与消费幂等受 Z2 检查（5.5 硬；5.2.3 投递语义登记纪律；kind_profile_DFL.narrative.note 对事件流类条目的显式要求）→ AP2 的性质面。role 取 consumed_by：本行第四列未如发件箱行那样明文「Z2 联动」，本机制是 Z2 的被检查面而非其实现面（判读入 MJ-23）
      - {property_id: Y4, role: consumed_by}    # 流动机制与风格的自洽性由 Y4 检查（4.2.4 尾注；4.5 级别列为软 → 偏离标记评审，过度工程信号）
      # Y7（派生数据可重建，软 P2）虽以 ∀ D_derived 覆盖实时派生视图，但本行第四列未明文挂钩 Y 系列（对照物化视图行「重建能力是登记项（Y 系列检查）」）→ 按「表级/节级面不下探」纪律不登记；该取舍的判读入 MJ-23 待裁决
    references: []                     # G-DFL-1：4.7 书目 44（EIP）的登记面逐字为「5.2.1/5.2.3 消息与协调模式词汇表」、书目 35 为「4.2.3 一致性模型谱系；复制/分区机制的权威内联来源」→ 均非 4.2.4「流处理」行的行级登记面，按「表级/节级面不下探」纪律不扩张；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）
    narrative:
      benefit_cost_analysis: "收益：4.2.4 第三列把本机制的适用面定为「实时派生视图、监控指标」——对无界事件流做连续变换/聚合，使派生结果随事实到达即更新，而不必等批窗口闭合；变换/聚合逻辑收敛于流作业内，改聚合口径不触上游生产者（1.2.3 事件驱动行「扩展新消费者不改生产者」），可修改性面优于把同等逻辑散落到各消费者。代价：4.2.4 第四列明记「事件时间 vs 处理时间语义必须显式（方面 5 的 5.2.4 联动）」——语义分岔点一旦选错或未选，派生结果的时基即不可解释，且切换语义会改变全体下游依赖的结果时基（触达面扩大到消费侧）；连续聚合须持有中间状态 → 状态后端随键基数与窗口长度单调增长，作业重启须回放、回放完成前不满足新鲜度界；常驻计算与状态治理使其运维面高于批式 ETL（4.3 交付空间驱动的运维能力硬过滤器同型适用）；派生结果一致性不优于最终一致（1.2.3）；母本未给任何量化界（延迟、状态容量、回放时长）→ 只登记界形与单调方向（0.4）。"
      typical_scenarios: "实时派生视图与监控指标的连续计算（4.2.4 第三列原文）；CDC 外发事件流的下游连续变换/聚合（4.2.4 尾注并举的「CDC + Kafka 类流平台」组合，在事件驱动风格下成立）；发件箱中继外发事件的实时聚合（同 DFL-001 的下游面）；管道-过滤器风格的批处理/流处理类系统（1.2.1 该行适用条件明文含「流处理」）；事件驱动分析中须显式选择事件时间语义的场合（5.2.4）。"
      common_misuse: "时间语义未显式选择即以流结果对外供给（AP1，结果时基不可解释）；上游投递语义或本作业幂等未声明（AP2，Z2 硬违例）；水位线策略缺失或过紧致迟到事件静默丢弃（AP3）；状态后端无容量阈值告警（AP4，资源占用漂移）；以流处理承载对新鲜度要求低的批式分析（4.2.4 第三列适用面之外；尾注 Y4 过度工程信号同型）；作业重启回放未完成即视为达标（新鲜度界失效）；在单体风格下引入流平台（4.2.4 尾注 Y4 过度工程信号，软性标记评审）；为派生延迟、状态容量或回放时长填无出处数值（0.4＋6.2.1 量化纪律）。"

  - entry_id: DFL-004
    kind: DFL
    name: "ETL/ELT 批"                  # 母本 4.2.4 首列原形即含斜杠 → 按 MJ-21 (iii) 原形登记，不改写为「ETL-ELT 批」
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-DFL-01）
    provenance:
      origin: hybrid                   # 骨架=4.2.4 表行（compiled 视图）＋谓词转写与界形参数化（manual，MJ-2 同型）
      source_pointers:
        - {source_type: row_id, value: "4.2.4-ETL/ELT 批", verified: true}
        - {source_type: clause_id, value: "4.2.4", verified: true}
        - {source_type: clause_id, value: "1.2.1", verified: true}   # 管道-过滤器风格行适用条件含「批处理、流处理、ETL（抽取-变换-装载）」；术语表 ETL/ELT 条的出处列为 1.2.1／4.2.4
        - {source_type: clause_id, value: "5.2.4", verified: true}   # 「定时器/截止期/cron 的登记」＝批周期的登记面
        - {source_type: clause_id, value: "4.5", verified: true}     # Y4 软；data_lineage(D_derived, source_set, rebuildable) 词汇
        - {source_type: clause_id, value: "4.4", verified: true}     # 施→3 新鲜度为数据契约语义条款（硬）；施→6 新鲜度条款 → 质量代价计入项（软）
        - {source_type: clause_id, value: "4.3", verified: true}     # 交付空间驱动「运维能力」「数据团队形态 → 数据产品前提」方向性事实
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: clause_id, value: "0.18.7", verified: true}  # S5 保守界消费 ops_cost 与 typical_reversibility
    typical_reversibility: bounded     # 人工判断：批作业可停用，ELT 形态下变换可在目标端重跑（先装载后变换），但已装载并对外供给报表的历史分区属既有事实 → 取 bounded。18-B S5 消费字段
    applicability:
      problem_space:                   # 骨架源：4.2.4 第三列「适用条件」原文
        - "分析域、报表；对新鲜度要求低的场景（4.2.4 第三列原文）"
        - "周期性抽取-变换-装载的场合（同行第二列定义面；ELT = 先装载后在目标端变换）；1.2.1 管道-过滤器风格行把「批处理…ETL（抽取-变换-装载）」列为其适用条件"
      current_space:                   # 交叉表源：4.2.4 第二/四列＋4.3 现状空间驱动＋4.4 施→3
        - "[源端存在可周期性抽取的批量读取通道，且该通道按 4.5 access_path 登记（抽取不等于免契约：绕过所有者直取即 Y2 违例）；4.3 现状空间驱动方向性事实——本行第四列未给现状条件，不细化为母本未给的判据（M15）]"
        - "[目标端可承载装载，且（ELT 形态下）具备在目标端执行变换的能力（4.2.4 第二列原文『ELT = 先装载后在目标端变换』）]"
        - "[新鲜度要求已按批窗口量化并写入数据契约：第四列『批窗口 = 新鲜度条款』→ 该条款属 4.4 施→3 明列的数据契约语义条款（单位/值域/空值/敏感性/新鲜度），不得只留在调度配置里]"
      delivery_space:                  # 交叉表源：4.3 交付空间驱动（运维能力／数据团队形态）
        - "[交付空间具备批作业的调度与重跑运维能力（调度窗口、失败重跑、装载幂等）；分析域形态另受 4.3 交付空间驱动『数据团队形态 → 数据产品前提』方向性事实约束——本行第三列未直给交付空间条件，按 4.3 方向性事实登记，不细化为母本未给的判据（M15）]"
    envelope:                          # 骨架源：4.2.4 第二列「定义」＋第四列「质量影响要点」；metric 取 6.2.1 既有书写形态；界形参数化（MJ-2 同型，无具体数值）
      - metric: "延迟分位数 P99"
        bound_expr: "P99_data_visible ≥ [batch_window]：变更在窗口闭合并完成抽取-变换-装载前不可见 → 可见延迟以批窗口长度为下界（4.2.4 第四列『批窗口 = 新鲜度条款』的界形）；供给为批式而非连续 → 窗口内延迟分布不连续，不适用流式的单调滞后表述。窗口长度母本未给（0.4）"
        source: {source_type: row_id, value: "4.2.4-ETL/ELT 批", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "触达单元数(Δ 变换逻辑) ≤ 1 批作业（ELT 形态下收敛于目标端变换，不改源端）；触达单元数(Δ 源端 schema) ≥ 1 抽取通道 + 1 变换 + 目标端结构（4.4 施→9 schema 漂移守护对象）"
        source: {source_type: row_id, value: "4.2.4-ETL/ELT 批", verified: true}
      - metric: "性能：资源占用"
        bound_expr: "资源占用呈周期性峰值（窗口内集中抽取/变换/装载）而非常驻占用；峰值随抽取数据量与窗口内并发变换单调上升；4.2.4 未给量化界 → 只登记形态与单调方向（0.4）"
        source: {source_type: row_id, value: "4.2.4-ETL/ELT 批", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "目标端数据的可用性上界 = min(源端可读性, 调度器可用性, 目标端可用性)；单个窗口失败即令新鲜度条款违约一个窗口长度 → SLO 承诺须以窗口数为单位表述（4.2.4 第四列）"
        source: {source_type: row_id, value: "4.2.4-ETL/ELT 批", verified: true}
    cost_profile:
      latency_budget_delta: "Δlatency(数据可见) ≥ [batch_window] > 0：批式供给使可见延迟以窗口长度为下界，并随窗口长度上升；第三列『对新鲜度要求低的场景』即该下界的适用前提（新鲜度要求高 → 本机制不适用，见 AP1）。窗口长度母本未给 → 只登记界形与符号（0.4）"
      failure_modes: ["窗口失败未重跑且无告警 → 新鲜度条款违约，下游静默读到陈旧数据", "批窗口与业务新鲜度要求不匹配（第三列限定『对新鲜度要求低的场景』）→ 以批承载实时需求（Y4 同型选型漂移）", "抽取绕过所有者契约直取源库 → Y2 违例（非侵入不等于免契约）", "装载非幂等 → 重跑产生重复数据，正确性依赖人工干预", "新鲜度条款未写入数据契约（4.4 施→3）→ 消费方读到不可预期旧值", "ELT 形态下变换逻辑散落目标端且无版本治理 → schema 漂移（4.4 施→9）"]
      consistency_impact: "批式装载 → 目标端一致性以窗口为粒度收敛，窗口内为上次成功装载的快照；不改变源端的一致性级别声明（Y3 归其所有者）；分析域目标数据集为派生物 → 其可重建性归 Y7 判定面（本行第四列未明文挂钩，登记面由 DFL-005 承载）；跨所有者强一致需求仍为 Y6 冲突信号，批式装载不构成其解"
      observability_requires: ["窗口执行状态（成功/失败/重跑）与完成时刻可观测（新鲜度条款的判据面）", "最后成功窗口的时龄可查（陈旧窗口的漂移判据）", "抽取数据量与窗口耗时的趋势可观测（性能：资源占用族）", "装载幂等性与重跑记录可查（重复数据的判定面）"]
      ops_cost: "[随批作业数与目标端规模上升：调度器与窗口监控、失败重跑与幂等装载、目标端容量与结构治理；无常驻计算面（周期性执行）→ 常驻成本低于流处理与 CDC 管道，但重跑与迟到数据处置的人工面不低（4.3 交付空间驱动的运维能力方向）]"   # 18-B S5 保守界消费字段
      skill_prerequisites: ["批窗口长度与业务新鲜度要求的匹配论证（4.2.4 第四列『批窗口 = 新鲜度条款』；4.4 施→3 契约条款）", "调度、失败重跑与幂等装载设计（5.2.4 cron 登记面）", "抽取-变换-装载的血缘登记与目标端结构治理（ELT 形态下的变换版本管理）"]
      aggregation_semantics: itemwise
    compatibility: []                  # 4.2.4 本行第三/四列未给任何风格对或机制对；尾注的过度工程示例点名的是「CDC + Kafka 类流平台」（DFL-002／DFL-003 承载）→ 按 MJ-5／MJ-9 不登记（表内取值互斥不枚举、跨 kind 无母本明文依据不扩张）
    constraints_imposed:               # 交叉表源：4.4「施加约束」表（方面 4 全体七行，与 OWN/CSL/STP 批逐字相同）
      - {target_aspect: 2, constraint: "数据归属现状回馈分解：现状数据不可干净归属时，S4 策略受约束、拆分序列须按数据迁移可行性排序", level: soft}
      - {target_aspect: 3, constraint: "数据契约的 schema 与语义条款（单位/值域/空值/敏感性/新鲜度）由本方面供给", level: hard}
      - {target_aspect: 5, constraint: "一致性模型 → 协调模式可行集：跨所有者强一致需求 → Saga + 业务补偿，或回溯方面 1 重审部署风格（Y6 的下游消费路径）", level: hard}
      - {target_aspect: 6, constraint: "一致性级别声明与新鲜度条款 → 质量判定的代价计入项", level: soft}
      - {target_aspect: 8, constraint: "不变式 → 对账验证项；血缘 → 派生数据可重建性测试；边界校验 → 契约测试的数据面", level: soft}
      - {target_aspect: 9, constraint: "数据漂移守护对象：schema 漂移（实际 schema 偏离注册契约）、所有权违例（绕过所有者的直写流量）、共享写例外超期", level: hard}
      - {target_aspect: 10, constraint: "机器层：Y 谓词集 + 血缘图；人类层：覆盖谓词子集 {Y 谓词集、血缘} 的投影视图（受众问题 = 数据所有权与流动；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: DFL-004-AP1
        description: "以批式 ETL 承载实时/高新鲜度需求（批窗口下界与业务新鲜度要求不匹配）"
        detection_predicate: "∃ D: data_flow(D, ·, ·, [batch]) ∧ [D 的消费方新鲜度要求 < batch_window(D)] ∧ ¬has_approved_exception(·, ·, ·)"
        signal_level: P1               # 人工判断（MJ-4 同型）：4.2.4 第三列把适用面明文限定为『分析域、报表；对新鲜度要求低的场景』→ 违反即选型漂移；Y4 在 4.5 级别列为软（偏离标记评审）→ 不升 P0，定 P1 限期整改
      - pattern_id: DFL-004-AP2
        description: "新鲜度条款未写入数据契约（批窗口只存在于调度配置里）"
        detection_predicate: "∃ D, C: data_flow(D, ·, ·, [batch]) ∧ access_path(D, ·, ·, C) ∧ ¬[C 的语义条款含新鲜度/批窗口]"
        signal_level: P0               # 4.4 施→3 为硬（『数据契约的 schema 与语义条款（单位/值域/空值/敏感性/新鲜度）由本方面供给』）＋4.2.4 第四列『批窗口 = 新鲜度条款』→ 缺条款即硬约束违例（MJ-4 判据）
      - pattern_id: DFL-004-AP3
        description: "抽取绕过所有者契约直取源库"
        detection_predicate: "∃ D, c, C: dataset(D) ∧ owner(D, ·) ∧ access_path(D, c, ·, C) ∧ ¬(registered(C) ∧ [C 的提供方 = owner(D, ·)])"
        signal_level: P0               # 4.5 Y2 硬（无绕过所有者与契约的访问路径）→ P0（与 DFL-002-AP2 同型）
      - pattern_id: DFL-004-AP4
        description: "装载非幂等（窗口重跑产生重复数据）"
        detection_predicate: "∃ D: data_flow(D, ·, ·, [batch]) ∧ ¬[装载幂等机制（去重键或全量替换）已登记]"
        signal_level: P1               # 人工判断（MJ-4 同型）：重跑是批机制的既有事实（5.2.4 调度面），非幂等使正确性依赖人工干预；5.5 Z2 的判定面是异步交互的投递语义，批装载不属该面 → 无硬性质可绑定，定 P1 限期整改
      - pattern_id: DFL-004-AP5
        description: "窗口失败未重跑且无告警（下游静默读到陈旧数据）"
        detection_predicate: "∃ D: data_flow(D, ·, ·, [batch]) ∧ ¬[窗口失败告警与最后成功窗口时龄阈值已登记]"
        signal_level: P2               # 不构成 4.5/5.5 性质违例，而是新鲜度/陈旧窗口的漂移信号（须以阈值 + 趋势双判据核定）→ P2（MJ-4 判据）
    formal_anchor:                     # 交叉表源：4.5 可验证性质
      - {property_id: Y4, role: consumed_by}    # 流动机制与风格的自洽性由 Y4 检查（4.2.4 尾注；4.5 级别列为软 → 偏离标记评审）
      # Y7（派生数据可重建，软 P2）不以 ∀ D_derived 的覆盖面下探登记：本行第四列只给「批窗口 = 新鲜度条款」，未明文挂钩 Y 系列（对照物化视图行「重建能力是登记项（Y 系列检查）」）→ 按「表级/节级面不下探」纪律不登记；该取舍与 DFL-003 同口，判读入 MJ-23 待裁决
    references: []                     # G-DFL-1：4.7 书目 35–44 无 4.2.4「ETL/ELT 批」行的行级登记面（35 → 4.2.3 谱系与复制/分区；40 → Y7 可重建性理论基础〔节级〕；42/43 → 发件箱与 CDC；44 → 5.2.1/5.2.3 消息与协调模式词汇表）→ 按「表级/节级面不下探」纪律不扩张；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）
    narrative:
      benefit_cost_analysis: "收益：4.2.4 第三列把本机制的适用面定为「分析域、报表；对新鲜度要求低的场景」——以周期性批量供给换取无常驻计算面：资源占用呈窗口内峰值而非全程常驻，运维形态与既有调度设施同构；ELT 形态（第二列「先装载后在目标端变换」）把变换逻辑放到目标端，改口径不动源端，可修改性触达面收敛到 1 批作业。代价：4.2.4 第四列明记「批窗口 = 新鲜度条款」——可见延迟以窗口长度为下界，且该下界不是实现细节而是**契约条款**（4.4 施→3 把新鲜度列为数据契约语义条款，硬），缺条款即消费方读到不可预期旧值；单个窗口失败即违约一个窗口长度，SLO 只能以窗口数为单位表述；抽取通道仍受 Y2 约束（绕过所有者直取即违例）；装载须幂等，否则重跑产生重复数据；源端 schema 变更沿抽取-变换-目标端结构传播（4.4 施→9 守护对象）；母本未给窗口长度、峰值资源或重跑时长的量化界 → 只登记界形（0.4）。"
      typical_scenarios: "分析域与报表的周期性供给（4.2.4 第三列原文）；对新鲜度要求低、以窗口为粒度即可的场景（同行）；ELT 形态下变换须在目标端执行的场合（同行第二列）；管道-过滤器风格的批处理系统（1.2.1 该行适用条件明文含「批处理…ETL（抽取-变换-装载）」）；批周期须按 cron 登记的场合（5.2.4「定时器/截止期/cron 的登记」）。"
      common_misuse: "以批式 ETL 承载实时/高新鲜度需求（AP1，第三列适用面之外）；批窗口只写在调度配置里而不入数据契约（AP2，4.4 施→3 硬违例）；抽取绕过所有者契约直取源库（AP3，Y2 硬违例）；装载非幂等致重跑产生重复数据（AP4）；窗口失败无告警致下游静默陈旧（AP5）；把 ELT 的「目标端变换」当作无需版本治理的散落脚本（4.4 施→9 schema 漂移）；为批窗口长度或峰值资源填无出处数值（0.4＋6.2.1 量化纪律）。"

