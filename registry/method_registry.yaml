    applicability:
      problem_space:                   # 骨架源：本行适用条件为「同上；强调领域模型在中心」——「同上」指 STY-008 行（人工判断，MJ-7）
        - "[外部技术栈易变或多样]"
        - "[核心逻辑值得长期保护]"
        - "[存在可置于中心的稳定领域模型]"
      current_space: []
      delivery_space: []
    envelope:                          # 骨架源：本行包络要点为「同六边形」→ 界形态与 STY-008 同型（人工转写，MJ-2）
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "外层技术替换 → touched_units = |外层环上的实现单元| 且 touched_units(内层) = 0（依赖只能指向内层，内层不知道外层）；成本项 = +|环间接口| 的契约维护量"
        source: {source_type: row_id, value: "1.2.1-整洁/洋葱架构", verified: true}
      - metric: "可修改性：变更前置时间"
        bound_expr: "lead_time(领域模型变更) ≤ verify(内层) + regression(外层环)，且 verify(内层) 可脱离外层设施执行（同六边形：核心可独立验证）"
        source: {source_type: row_id, value: "1.2.1-整洁/洋葱架构", verified: true}
    cost_profile:
      latency_budget_delta: "+ 每穿越一环一次间接跳；参数：环数与环间接口形态（同 STY-008 的间接层成本）"
      failure_modes: ["外层设施语义泄漏进内层（数据库/框架类型出现在领域模型中）", "环划分沦为目录结构而无依赖规则校验", "间接层膨胀导致调用路径难以追踪"]   # 前两项为骨架源「同六边形」反模式的同族实例；第三项人工判断
      consistency_impact: "无直接影响：一致性级别由方面 4 决定；数据库外置于环结构不改变事务语义"   # 人工判断（书目 22 的「数据库外置论」为 narrative_only 级线索，不作机器层出处）
      observability_requires: ["环归属与依赖方向可查（layer_of/dependency_rule 或等价登记）", "领域层失败与外层设施失败可区分"]
      ops_cost: "[无独立运维面；成本落在环间契约维护与依赖方向门禁]"
      skill_prerequisites: ["领域建模能力（中心模型的稳定性判断）", "依赖方向规则的自动化校验"]
      aggregation_semantics: itemwise
    compatibility:                     # 骨架源 @1344：依赖方向控制族（六边形/整洁/洋葱）与任何顶层风格可叠加
      - peer_entry: STY-016
        relation: composable
        evidence: {source_type: clause_id, value: "1.2.1", verified: true}
      - peer_entry: STY-014
        relation: composable
        evidence: {source_type: clause_id, value: "1.2.1", verified: true}
      - peer_entry: STY-015
        relation: composable
        evidence: {source_type: clause_id, value: "1.2.1", verified: true}
      - peer_entry: STY-007
        relation: composable
        evidence: {source_type: clause_id, value: "1.2.1", verified: true}
    constraints_imposed:
      - {target_aspect: 2, constraint: "风格收窄分解策略可行集：环边界即分解单元边界候选，依赖方向为单向向内（分解不得产生向外的语义依赖）", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集；人类层：投影视图必须表达所选风格（环序与依赖方向须可辨）", level: hard}
    anti_patterns:                     # 骨架源：本行反模式列为「同六边形」→ 与 STY-008-AP1/AP2 同型（措辞按环结构转写）
      - pattern_id: STY-009-AP1
        description: "环间接口退化为外层框架接口的转发（内层接口未承担语义翻译）"
        detection_predicate: "∃ p, a: [p 为内层声明的接口] ∧ [a 为外层环上的实现] ∧ [a 的实现仅转发至框架接口且不含语义翻译] ∧ [p 的签名同构于框架接口签名]"
        signal_level: P1
      - pattern_id: STY-009-AP2
        description: "外层泄漏进内层（内层依赖外层技术类型/设施）"
        detection_predicate: "∃ c_in, c_out: [c_in 属内层] ∧ [c_out 属外层] ∧ depends_on(c_in, c_out, call, ·)"
        signal_level: P1               # 人工判断：违反「依赖只能指向内层」的定义性约束；1.5 未登记环方向谓词（VG-03）→ 无 V1 可绑定，定 P1
    formal_anchor:
      - {property_id: V1, role: implements}
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 6, support_claim: "依赖方向控制的机制内容（母本登记：1.2.1 依赖方向控制；第 12–14 章组件化对 Parnas 判据的现代重述）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 21, support_claim: "整洁架构的原始博文出处（母本登记：依赖方向控制，本地提取以书目 6 为准，本条不单独承载提取）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 22, support_claim: "洋葱架构的环结构与依赖方向命题（母本登记：核心命题「all coupling is toward the center」、数据库外置论与 DIP 依据；本地 epub 全文存档）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：与六边形同族的依赖方向控制收益（内层可独立验证、外层可替换），并以领域模型为中心组织环序；代价：间接层成本与环划分的治理成本。母本明示本行『包络要点/反模式同六边形』，故本条目的界形态与反模式均按同族同型登记，差异仅在措辞（端口/适配器 vs 环）。"
      typical_scenarios: "领域模型稳定且复杂的系统、需要长期保护核心语义的系统、外部技术栈易变或多样的系统。"
      common_misuse: "把环结构当作目录约定而不登记依赖规则（无 V1 可校验）；在领域层引用数据库/框架类型（外层泄漏）；与六边形在同一 scope 内并列声明为两种风格（同族取值互斥，见 MJ-5）。"

  - entry_id: STY-010
    kind: STY
    name: 微内核-插件
    version: {major: 1, minor: 0, patch: 0}
    status: seed
    provenance:
      origin: hybrid
      source_pointers:
        - {source_type: row_id, value: "1.2.1-微内核-插件", verified: true}
        - {source_type: clause_id, value: "1.2.1", verified: true}
        - {source_type: clause_id, value: "1.4", verified: true}
        - {source_type: clause_id, value: "1.5", verified: true}
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: "1", verified: true}
    typical_reversibility: costly      # 人工判断：扩展点契约是全部插件的共同依赖面，重设计的影响面 = 已注册插件全集（母本「契约不稳定导致插件全灭」即该量级的证据）
    applicability:
      problem_space:                   # 骨架源：1.2.1「适用条件（摘要）」列
        - "[需求变化集中在「扩展」方向]"
        - "[存在第三方定制或多租户定制需求]"
      current_space: []                # 母本本行未给现状空间条件（G-STY-1）
      delivery_space: []
    envelope:                          # 骨架源：「可扩展性↑↑；核心稳定性取决于扩展点契约质量」；「可扩展性」映射 6.2.1 可修改性族（G-ENV-1）
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "新增扩展 → touched_units = |新增插件单元| + |注册点|，且 touched_units(core) = 0（最小核心不因扩展而变更）；前提：扩展点契约不变——契约变更时该上界失效，改由下一项承载"
        source: {source_type: row_id, value: "1.2.1-微内核-插件", verified: true}
      - metric: "可修改性：典型变更的实现成本（跨边界契约变更数）"
        bound_expr: "扩展点契约变更 e → contract_changes(e) 的波及面 = |registered_plugins(e)|（「插件全灭」的参数化形态）；核心稳定性 ⇒ contract_changes(extension_point) 须受版本化/兼容策略约束，无策略声明时波及面无上界"
        source: {source_type: row_id, value: "1.2.1-微内核-插件", verified: true}
    cost_profile:
      latency_budget_delta: "+ 每次扩展点分派一次注册表查找与间接调用；参数：扩展点数、命中插件数与分派机制（注册表查找/动态加载）"
      failure_modes: ["扩展点契约不稳定导致已注册插件全量失效", "核心膨胀吞并插件职责（「最小核心」约束失守）", "插件间经核心或共享设施形成未声明耦合"]   # 前两项骨架源 1.2.1 反模式列；第三项人工判断（注册式扩展的常见旁路）
      consistency_impact: "无直接影响：插件注册与加载不改变数据一致性级别；插件自有状态的一致性归方面 4"   # 人工判断
      observability_requires: ["扩展点↔已注册插件映射可查", "插件加载/卸载与分派失败可观测（区分核心失败与插件失败）"]
      ops_cost: "[无独立运维面；成本落在扩展点契约的版本治理与插件兼容性回归]"
      skill_prerequisites: ["扩展点契约设计（最小核心的职责边界）", "插件注册/发现机制与版本兼容策略"]
      aggregation_semantics: itemwise
    compatibility: []                  # 母本对本行无叠加声明、1.2.5 无涉本风格的冲突行；子维度内取值互斥不逐对登记（MJ-5），跨子维度正交性不构成条目级 composable 声明（MJ-9），组合自洽性由 1.2.5 冲突矩阵校验（V3）
    constraints_imposed:               # 交叉表源：1.4「施加约束」表行 2/6/10（无风格修饰 → 全风格通用；实例化措辞为人工判断）
      - {target_aspect: 2, constraint: "风格收窄分解策略可行集：核心与插件为两类分解单元，插件职责不得回流核心（seam = 扩展点）", level: hard}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集；人类层：投影视图必须表达所选风格（核心/扩展点/插件三区须可辨）", level: hard}
    anti_patterns:                     # 骨架源：1.2.1「典型反模式」列（本行两项，不增补）
      - pattern_id: STY-010-AP1
        description: "扩展点契约不稳定导致插件全灭（契约破坏性变更无版本化/兼容策略）"
        detection_predicate: "∃ ep: [ep 为已声明扩展点] ∧ [ep 的契约未登记版本化/兼容策略] ∧ [滚动窗口 W 内 ep 契约的破坏性变更数 > N_max]"
        signal_level: P2               # 0.14 P2 双判据：阈值 N_max + 趋势窗口 W（均为待勘察参数，禁填无出处数字）
        # M4 修正（MJ-12）：原书写 ¬declared(compat_policy(ep))。compat_policy 是母本 3.5 `contract(C, provider,
        # consumer_set, kind, version, compat_policy, lifecycle_state)` 的**实参槽**，不是独立谓词名；以其实参槽名
        # 充当谓词属本地造词（README §3.1 / 编译规范 2.3「谓词名注册」禁）→ 改为方括号事实占位，缺口登记 VG-04。
      - pattern_id: STY-010-AP2
        description: "核心膨胀吞并插件职责"
        detection_predicate: "∃ core, pl, r: unit(core) ∧ unit(pl) ∧ [pl 为已注册插件] ∧ responsibility(core, r) ∧ responsibility(pl, r)"
        signal_level: P2               # 0.14 P2 双判据：阈值（双重承载的职责数 > D_max）+ 趋势窗口（W 内核心单元变更数 > C_max）；均为待勘察参数
    formal_anchor:                     # 交叉表源：1.5 V1–V5
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 1, support_claim: "微内核风格的词汇与定义（母本登记：1.2.1 抽象结构风格词汇表含分层、管道-过滤器、黑板、微内核、Broker）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：扩展方向的变更被注册机制收敛为『新增插件 + 注册』，核心不动，故 touched_units(core)=0；代价：核心稳定性完全取决于扩展点契约质量——契约一旦破坏性变更，波及面是已注册插件全集（母本直言『插件全灭』），因此契约的版本化与兼容策略不是可选项而是本风格的前置投资。"
      typical_scenarios: "需求变化集中在扩展方向的系统（多租户定制、第三方生态、规则/算法可插拔）、核心语义稳定而外围形态多样的系统。"
      common_misuse: "把扩展点当作函数回调别名而无契约治理（AP1 直接成立）；核心逐步吸收插件逻辑形成膨胀核心（AP2）；在需求变化不集中于扩展方向的系统引入插件机制（注册/加载/兼容成本无对应收益）。"

