  - id: MJ-16
    subject: OWN 批三项形式面对齐裁决——18-B 消费字段的 0 基索引、简记 scope 全集口径、索引产物文案与非 STY 卡片投影覆盖的处置
    judgment: "(i) **18-B 消费字段按 0 基索引对齐**：母本正例 18-B 的消费字段清单（@640-641）以 `OWN-03.applicability.delivery_space[1]; OWN-01.cost_profile.ops_cost; OWN-01/02.typical_reversibility; OWN-04.applicability.problem_space[1]` 形式发布，索引为 0 基（脚本求值口径）。本批逐一对齐——OWN-003.delivery_space 的第 2 项（[1]）为平台团队存在性事实（∃ platform_team）、OWN-004.problem_space 的第 2 项（[1]）为遗留迁移过渡期占位、OWN-001.cost_profile.ops_cost 为『四行中最低』的保守界、OWN-001/OWN-002.typical_reversibility 同为 free（S5 排序消费面）。纪律：清单以索引指称，故**列表项顺序不得调换**（调换即改指称对象）；后续批次若需重排某条目列表项，须同步核对全部已发布消费字段并留痕。(ii) **简记 scope 全集口径**：check_ledgers 对每条状态迁移简记独立要求 scope 与『全部 status=to 条目集』双向相等（project.py @1032-1044），故 ST-STY-01 的 scope 由 24 条扩至 28 条、ST-OWN-01 同口径登记全集。此为检查器口径的形式面，不改变迁移事实：STY 24 条的迁移事实与日期仍由 ST-STY-01 承载、OWN 四条由 ST-OWN-01 承载，两条 note 分别注明本批实际迁移对象；scope 字段随注册表全集演进而同步，不构成对既有简记历史记录的重写（编号与已发布引用不动，0.22 承诺一）。(iii) **索引产物陈旧文案与卡片投影覆盖不在本批改**：projections/索引.md 产物表的『STY 24 条』为 project.py @1473 硬编码字面量；另 `render_sty` 只渲 1.2.x 子维度，故 OWN 四条在人类层只以 索引.md 条目清单行与 自检报告.md 逐条矩阵呈现，**无 STY.md 同型的卡片视图**（0.9/E2 的人类层同源投影对非 STY kind 尚缺卡片级产物）。两项均属投影器（脚本）侧改动，须与后续批次合并为独立的脚本改动批次（含注入测试重跑），本批不动脚本。条目数的权威载体 = method_registry.yaml meta.entry_count（check_meta 与实际条目数强校验），读者不应以该文案为计数权威。"
    basis: "母本正例 18-B（@621-641，消费字段 @640-641）；project.py check_ledgers（@1032-1044）、render_index 产物表（@1473）、check_meta entry_count 强校验（@910-961）；0.22 承诺一（编号与已发布引用不复用/不重排）；README §2（注册表级信息一律入顶层台账节，不进条目）"
    affected: "OWN-001…OWN-004 的 typical_reversibility 与 applicability/cost_profile 列表项顺序；ST-STY-01 与 ST-OWN-01 的 scope；projections/索引.md 产物表文案（留待脚本改动批次）"
    provenance: manual

  - id: MJ-17
    subject: PCR-2 的 peer 判读（1.2.5「微服务 × 跨单元 2PC」行的一致性侧对偶条目认定）与 CSL-005 compatibility 留空的处置
    judgment: "(i) **peer = CSL-001（强一致）**。四路溯源同指一行：① 4.2.3 强一致行的行内明文『跨单元强一致 = 冲突信号（Y6，对应 1.2.5 硬冲突：微服务 × 2PC）』（母本 @2186）——源表已把该冲突行挂到强一致行，而非最终一致/补偿一致行；② 1.2.5 矩阵行原文『微服务 × 跨单元 2PC 作为默认一致性手段 → 冲突（应改用 Saga 类，或重审部署风格），硬』（@1401）的冲突面是**默认协调手段**（2PC＝强一致的实现形态），处置建议（改用 Saga 类）是**出路**而非冲突对偶本体；③ 4.4 施加表『一致性模型选择 → 5（长流程须可补偿）』（@2253）表明 CSL→CRD 的施加方向，与 1.2.5 的 STY×CSL 冲突面互不混淆；④ Y6 `cross_owner_strong_consistency_requirement → conflict_signal(saga_candidate ∨ reopen(aspect1))`（@2289-2290）的触发前提即跨所有者单元的**强一致**需求。故 PCR-2 在 CSL 侧的对偶条目唯一确定为 CSL-001，回填形态＝STY-016 compatibility 增 hard_conflict 行 ＋ CSL-001 对侧镜像（同提交，M9），PCR-2 移入 closed_in_entries。(ii) **V3 角色分配**：1.2.5 冲突行由风格侧条目 STY-016 登记（既有），故 STY-016 formal_anchor 保持 `V3: triggers`；CSL-001 作为被消费的对偶方登记 `V3: consumed_by`（V3 谓词面 `¬∃ (S1,S2) ∈ conflict_matrix(hard) ∧ active(S1) ∧ active(S2) ∧ ¬has_approved_exception(S1,S2)`（@1478）在 compatibility 双向登记后方可求值）。(iii) **CSL-005 compatibility 留空**：补偿一致行的『Saga（方面 5）』指向 CRD kind 条目，属 **requires**（依赖/施加）关系而非 1.2.5 冲突矩阵行，故不写入 compatibility（该字段的 evidence 口径为 clause_id ∈ 冲突矩阵行）、亦不入 pending_conflict_rows（该台账范围限 1.2.5 四行）；CSL-005 与 CRD-Saga 的关系待 CRD 批入库后由 CRD 侧条目承载，本批留空＋行内注登记，不静默丢弃。"
    basis: "母本 4.2.3（@2182-2192，强一致行 @2186）、1.2.5（@1399-1404，冲突行 @1401）、4.4 施加表（@2251-2257）、4.5 性质 Y6（@2289-2290）、1.5 性质 V3（@1478）；0.17.2 compatibility 字段 schema（evidence.source_type = clause_id）；M9（peer_entry 须存在且双向登记，见 MJ-5）；README §2（注册表级信息入顶层台账节）"
    affected: "STY-016 compatibility 与 formal_anchor（V3 triggers 注）；CSL-001 compatibility 与 formal_anchor（V3 consumed_by）；CSL-005 compatibility（留空）；pending_conflict_rows（PCR-2 → closed_in_entries）"
    provenance: manual

  - id: MJ-18
    subject: PCR-1 的 peer 判读推翻与双向闭合（1.2.5「Serverless × 长时运行有状态流程」行）＋母本对 CRD 的已发布指称形态
    judgment: "(i) **peer = CRD-007（流程管理器）**。1.2.5 该行原文『Serverless × 长时运行有状态流程 → 冲突（执行时长限制），硬』的对侧『长时运行有状态流程』在 CRD kind 入库后已有条目承载：CRD-007 的 applicability.problem_space 明记长时运行有状态流程特征（状态机推进＋在途实例持久化），其 Z8（协调者可恢复）与 5.2.2 定义列（『编排式 Saga 的泛化』）共同构成该工作负载特征的条目化落点。故回填形态＝STY-018 compatibility 增 hard_conflict 行（peer CRD-007）＋ CRD-007 对侧镜像（同提交，M9），PCR-1 移入 closed_in_entries，open_rows 为空集 → 1.2.5 四行全部在条目层闭合。(ii) **原 peer_status 判读被推翻，以新增登记留痕而不改写历史**：原 PCR-1 记『对侧不是风格条目，而是问题空间事实（工作负载特征）→ 无 peer_entry 可指』，该结论成立于 CRD kind 未入库的时点（彼时确无条目可指），并非判读错误；CRD-007 入库使其失效。按 0.22 承诺一（已发布编号与引用不复用、不重排）与台账历史不重写纪律，处置＝在 closed_in_entries 的 disposition 中显式注明『原 peer_status 判读经 CRD 批推翻，见 MJ-18』，不删除、不改写原 open_rows 文本的判读内容。(iii) **母本对 CRD 的已发布指称有两类形态，均不产生 MJ-16 (i) 的数值索引顺序锁定义务**：① entry_id 叙述式仅一处（母本 @625 反例 18-B S2『已定条目 CRD-02（事件协同）』），映射为 CRD-002（母本两位书写＝注册表三位书写，同一 entry_id，MJ-14 同型；『事件协同』＝5.2.1『协同（choreography）』行），检验结果为无冲突对（OWN-004 侧留痕已闭合）；② kind 级消费字段七处（@2328 CRD-Saga 步骤注册表、@2610 CRD-Saga 注册表 pivot/compensable 标记、@2626 CRD.applicability.problem_space[域驱动来源]、@2642 CRD.kind 条目.cost_profile.ops_cost、@2670 CRD 协调卡片条目{condition_predicate, hard_directive, else_directive}、@2743 CRD 协调风格条目.cost_profile、@2952 CRD/编排器.quality_impact_card.latency_budget_delta），指称对象为 kind 而非单一条目，故不锁定任何条目的列表项位次。其中 @2626 的 `problem_space[域驱动来源]` 与 @2643 的 `delivery_space[引擎运维能力]=unknown` 为**符号下标**（非 0 基数值索引），语义是存在性要求而非位次要求：CRD 八条凡被该消费面引用者，须在对应空间中保留承载该事实的项（以方括号占位表达 unknown，M15），重排其余项不破坏该指称。纪律：后续批次若母本出现 `CRD-00x.field[i]` 形态的数值索引消费字段，仍按 MJ-16 (i) 锁定列表项顺序。"
    basis: "母本 1.2.5（@1399-1404，Serverless 行 @1402）、5.2.2（流程管理器行）、5.5 Z8、反例 18-B（@621-641，S2 @625）、5.6 示例二/示例三消费字段（@2626、@2642-2643）、方面 5/6/9 消费字段（@2328、@2610、@2670、@2743、@2952）；0.17.2 compatibility（peer_entry 须存在，M9 双向）；0.22 承诺一（编号与已发布引用不复用/不重排）；MJ-14（母本两位书写＝注册表三位书写）；MJ-16 (i)（数值索引消费字段锁定列表项顺序）"
    affected: "STY-018 compatibility（增 CRD-007 hard_conflict 行）；CRD-007 compatibility（对侧镜像）；CRD-002（18-B S2 无冲突对留痕）；pending_conflict_rows（PCR-1 → closed_in_entries，open_rows 空集）；CRD 八条的 applicability 三空间列表项顺序（不受锁定，除符号下标项须保留）"
    provenance: manual

  - id: MJ-19
    subject: CRD 批三项判读——四个母本公式内谓词的登记裁决、「注册上限」与 Z5 registered_max_depth 的同源异面、并行分支聚合式不本地造法
    judgment: "(i) **covers／explicitly_modeled／sla_bound／registered_max_depth 四词本批不登记入 predicate_vocabulary.yaml，维持方括号占位**。事实认定：四词均逐字出现于母本 x.5 的性质公式内——covers 于 X1（@2009『∃C ∈ registry: covers(C,u1,u2)』）与 Z1（@2575）、explicitly_modeled 于 Z1（@2575）、sla_bound 于 Z4（@2583）、registered_max_depth 于 Z5（@2586），与 clause_defined_predicates 既有十项（如 active 注『V3 公式内使用』、parameterized 注『M3 公式内使用』）**同型**，属 R2 可提议的登记候选，而非 MJ-12 意义的本地造词。裁决不扩词的理由是**后果而非资格**：登记该四词将直接触发 CRD-004-AP2（covers 面）与 CRD-007-AP3（explicitly_modeled 面）的 signal_level 由 P1 升 P0（两条行内注已明记『补齐后升 P0』），信号级升级＝守护规则改级，按 0.14『不许运行时即兴改级』＋ SO-2／G-STY-4 同型纪律须走完整 ADR＋批准，不在数据批次内自行执行；且词汇表扩充会波及既有 STY 批的 VG-01…VG-04 处置口径，应与 SO-4 的补齐动作合并为一个独立的词汇批次统一裁决。留痕不静默丢弃：本项即留痕载体，四词的候选身份、母本行指针与升级路径在此登记，M4 面以半角方括号包裹（outside_brackets 剔除，自检不误报），M6 面不受影响。**不新增 VG 编号**：VG-01…VG-04 已覆盖『谓词缺失 → 方括号占位＋补齐后按 MJ-4 复核 signal_level』的处置形态，本批四词复用该形态；若人工裁决认为需独立 VG 项，走 R2 提议。(ii) **「注册上限（默认 ≤4）」与 Z5 的 registered_max_depth 同源词汇、不同谓词面，不得合并实例**：Z5 公式为 `sync_chain_depth(F) ≤ registered_max_depth`（@2586），谓词面是**调用链深度**；5.2.2 关键设计规则列的『仅适合步骤少（注册上限，默认 ≤4）』谓词面是**Saga 步骤数**。二者共用『注册上限』词汇但约束对象不同，故 CRD-003（同步调用链）取 `Z5: implements`（链深面的直接承载），CRD-006（协同式 Saga）取 `Z5: consumed_by`（步骤数面消费同一上界词汇），不得因同名而将 CRD-006 升为 implements、亦不得据 CRD-003 推断步骤数面已被 Z5 硬约束。信号级：CRD-006-AP2 取 P1（步骤数界无 Z 系列硬性质直接绑定，Z5 面为链深且 5.5 明定为软），CRD-003-AP1 取 P2（Z5 软性质 → 越阈＋趋势上升双判据方告警，MJ-4 P2 判据）。『默认 ≤4』为母本逐字给出的具体数值，故 bound_expr 引之合法（0.17.7 门槛 2 只禁无出处数值），但仍以参数化形态表达（『≤ 注册上限』＋括注默认值），不将 4 写死为唯一界。(iii) **并行分支的卡片聚合式母本未给 → 不本地造法**：5.2.5 只给 Σ（加和）语义，未给并行分支的聚合规则（max／关键路径／期望值等均无母本依据）。CRD-007 的 envelope bound_expr、cost_profile.latency_budget_delta 与 aggregation_semantics 三处显式声明该缺口（『并行分支的聚合式母本未给，不本地补充』），aggregation_semantics 取 additive 仅覆盖 5.2.5 明文的 Σ 消费路径；补法须走 R2／母本 5.2.5 扩充（高影响，走 ADR），不在注册表侧自造聚合语义（0.4 禁假精确＋零新增规范命题）。同型处置：CRD-007 的 envelope 不因缺口而留空（C-ENV 对 5.2.1/5.2.2 要求非空），而以已给语义的界形登记＋缺口注记。"
    basis: "母本 1.5 X1（@2009）、5.5 Z1/Z4/Z5（@2575、@2583、@2586）、5.2.2 关键设计规则列（注册上限，默认 ≤4）、5.2.5（卡片 Σ 语义）；predicate_vocabulary.yaml（clause_defined_predicates 十项＋meta.note『新增谓词名 = R2 提议，不得在本文件本地扩词』＋vocabulary_gaps VG-01…VG-04）；project.py M4（outside_brackets 只剔半角方括号）、build_vocab（predicates ∪ formula_words ∪ clause_defined_predicates）；MJ-4（信号级判据）、MJ-12（本地造词 → 方括号占位＋VG 登记）、SO-2／SO-4／G-STY-4（升级属注册表变更，走完整 ADR＋批准）；0.14（不许运行时即兴改级）；0.4（禁假精确）；profiles.yaml C-ENV"
    affected: "CRD-003/CRD-006 的 formal_anchor（Z5 角色分配）与 envelope（registered_max_depth／注册上限界形）；CRD-004-AP2 与 CRD-007-AP3 的 signal_level（P1，补齐后升 P0）；CRD-003-AP1 的 signal_level（P2）；CRD-007 的 envelope／cost_profile.latency_budget_delta／aggregation_semantics；predicate_vocabulary.yaml（本批不变，四词候选身份登记于此项）"
    provenance: manual

