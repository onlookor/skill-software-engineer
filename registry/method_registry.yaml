    remediation_plan: "闭合路径同前八项：(1) project.py 自检全过（本批，见 ST-RLP-01 evidence）→ (2) 编译器对 seed 条目执行『人工条目 vs 编译条目』重验证，差异按 0.17.6(3) 三分类处置 → (3) 建立 FVR 条目并为 X1／Y1／Z1／Z2／Z3／Z4 接线，首次全量运行留证（E3 的 first_full_run has evidence）→ (4) 逐条 seed→active（diff 为空 = 低影响简记；diff 非空按三分类分别定级）。本 Waiver 在 (3) 完成时闭合。本批特有前置：(a) **接线所依赖的母本公式词面存在未登记词，须先经 R2 词汇批次核定**——实测（脚本比对 predicate_vocabulary.yaml 三节共 **76** 个已登记名：predicates 59＋formula_words 7＋clause_defined_predicates 10；判词形态按 PRED_CALL_RE @221 的调用式，即 `name(` 起始）：Z2 公式（@2577）所用 declared（formula_words @97）、delivery_semantics（predicates @64）、idempotency（@65）三词均已登记，惟 `idempotency_declared(consumer)` 系复合形态、MJ-12 已裁定以 `idempotency(x, ·) ∧ declared(·)` 表达、不本地造词 → **Z2 可先行接线**；Z3 公式（@2579-2582）所用 step_class、compensation 均已登记（5.5），compensable／retriable／pivot 系 step_class 的枚举取值而非谓词，pivot_ordering_valid 为裸词（非调用式）→ **调用式零缺词，Z3 可接线**；Z4 公式（@2583）所用 timeout_budget 已登记（5.5），惟缺 `sla_bound`、且 `propagation` 为裸词 → **阻于 sla_bound**；X1 公式（@2009）缺 `covers`／`interaction`，Z1 公式（@2575）缺 `covers`／`explicitly_modeled`（inter_unit_interaction 系量词域名）→ **二者同阻于 covers**；Y1 公式（@2279）所用 owner（@47）、shared_write_exception 均已登记，惟缺 `has_approved`（已登记形态为 has_approved_exception/3 @31）→ **阻于 has_approved**，该词已计入 WV-STP-E3-01 所记母本 4.5 公式侧 **7 词**缺口（MJ-22 (vi)），本项不重复计数、不另立新面。本批 detection_predicate 与 applicability 三空间剥方括号后的调用词**全部已登记 → 本批 M4 面零新增未登记候选**（初稿曾用 idempotency_declared／sla_bound／propagation／expiry 四词致 4 处 hard 失败，已按『不本地扩词汇表』改写六行，扫描处数复算逐条 10/9/9/12/13/12/12 合计 77 全过，见 ST-RLP-01 note）。另据实记载：本批新增半角方括号 snake_case 占位词 **10** 个共 **28** 处（backoff 3／bulkhead 4／circuit_breaker 5／dedup_table 1／dedup_window 1／fallback 5／half_open 1／inbox 3／jitter 2／retry 3；被 outside_brackets @208 剔除故不构成 M4 违例，属未登记词汇候选）→ 累计未登记词汇候选＝前八批 **19** 词（MJ-19 (i) 4＋MJ-20 (iii) 7＋MJ-21 (v) 8）＋本批占位 **10** 词＋本批改写四词中属新候选的 **2** 词（propagation／expiry）＝**31** 词——sla_bound 已在 MJ-19 (i) 四词内、不重复计数，idempotency_declared 经 MJ-12 以复合式表达故不入候选（MJ-23 (v) 同型口径）；宜与母本 4.5／5.5 公式侧 7 词缺口合并为独立 R2 词汇批次（s5g）一并裁决，本批不扩词、不以本 Waiver 的批准为前提，词表与词数由该批次核定，本项不预设。故 (3) 的接线在词汇补齐前只对 Z2／Z3 可行，X1／Z1／Y1／Z4 无法求值。(b) **接线面共享、豁免面各自计息**——E3 要求 ∃ fvr_entry（一个性质一个条目），不按批次重复建条目：Z2 与 CRD（implements 2）／DFL（3）共用，本项 RLP implements 3 指向同一性质；Z1 与 CRD（implements 4）／DEC（1）／CTR（1）共用；X1 与 CRD（3）／CTR（7）／DEC（3）共用；Z3 与 CRD（implements 4）／CSL（1）共用；Z4 与 CRD（consumed_by 3）共用；Y1 与 OWN（3）／DEC（1）／CTR（1）／STP（3）／DFL（implements 1）共用。且各性质的判定面不因批次而扩宽：Z2 的判定面是**异步交互的投递语义**（5.2.3 @2479 逐字『每条异步交互显式声明 at-most-once / at-least-once / exactly-once（后者仅指**有效恰好一次**——幂等消费达成的效果等价，非中间件魔法）；未声明 = Z2 违例』），Z3 的判定面是 **saga 步骤三分类**（5.2.2 @2473 逐字『分类不明 = Z3 违例 = 阻塞』），Z4 的判定面是**路径级超时预算分配**（@2477 超时预算项逐字『下游超时 < 上游超时 − 传播开销，全链预算 ≤ SLA 上界，Z4』）→ 不得把 RLP 侧的反例判据挂到判定面之外的性质上。(c) **Z4 的条件硬门槛不构成分期豁免**——4 个实例全数在豁免面内待接线；若 0.4 证据门槛未过而降软（保守界：超时取注册表保守默认，可推翻指标 = 实测传播延迟），属母本级别判定的事实面变化，本项不预设其结果、亦不据以缩减或延后豁免面（承 WV-CRD-E3-01 先例）；本批 5 条 P1 判据以该条件硬为定级依据（RLP-004-AP3／RLP-005-AP2／RLP-005-AP3／RLP-007-AP2〔初稿误记 AP3，与 MJ-24 (xiii) 更正后口径统一，2026-10-06 批准落盘时同批更正〕／RLP-002-AP3），门槛过后其 signal_level 是否改级属守护规则改级，按 0.14＋SO-2／G-STY-4 另走批准，不由本 Waiver 预设。(d) **references 面无空集且不阻塞接线**——七条 references 各 2 行、合计 **14** 行（书目 44×3＝RLP-001／002／003、46×4＝RLP-004／005／006／007、51×7），compile_usage 一律 metadata_extraction、信任级一律逐字承 5.7 登记面；G-RLP-1／SO-12 的六个裁决口（5.2.3 是否改为表格形态以提供 row_id 维度、书目 46 的「等」可否据书目 51 行内文确认覆盖重试与幂等/收件箱、@2719 六项与 @2730 五项对 @2477 七项的枚举差异、书目 46 的 ISBN 连字符分组差异与页数两说、书目 51 目录面不充当 compatibility／references 行级依据之边界、RLP-003 envelope 三族是否需在剖面侧补明文）与 E3 的性质接线**相互独立**，其裁决结果不增减本项豁免面。(e) **compatibility 面不因批准而闭合**——**32** 行（composable 30／requires 2／tension 0／hard_conflict 0；逐条 5/4/4/6/5/4/4）：requires 两行＝**RLP-003 → DFL-001**（兑现 WV-DFL-E3-01 的 remediation_plan (e) 与 ruling 明记的『DFL-001↔RLP 的对不登记…由 RLP 批的下游侧承载』；主指令裁定『定义面归 DFL、行为面归 RLP』，5.2.3 @2477 发件箱项逐字『生产侧，4.2.4 已定义，行为面消费其投递语义』，镜像由本侧单向承载）与 **RLP-004 → RLP-001**（5.2.2 @2473 retriable 逐字『幂等 + 暂时性失败假设成立』→ 幂等是重试的明文前提）；ENUM_RELATION = {hard_conflict, tension, composable, requires} **无 required_by** → RLP-001 → RLP-004 记 composable 而反向记 requires，累计第三例方向不对称（是否补 required_by 归 s5h）；同批镜像 **10** 对全部双侧登记（M9 缺 0；其中 RLP-004／RLP-005 → RLP-007 两处系本批数据复算纠正的缺登）；跨 kind 单向 **12** 行（目标 CRD-003×4、STY-003×3、CRD-005×2、DFL-001×2、CRD-008×1），其对侧一律为已发布批次 → 按 MJ-5／MJ-21 (viii) 与 0.22 承诺一不回填镜像；本批未登记 tension／hard_conflict（5.2.3 与 1.2.5 硬冲突清单均未给出可靠性模式之间的冲突对 → 按 MJ-9 不升不造）；`pending_conflict_rows.open_rows` 保持空集。"
    risk_quantification: "触及面：7 条 × formal_anchor 引用的性质，共 6 项 12 个实例（硬 5 项 8 个：Z2 3、X1 2、Z1 1、Z3 1、Y1 1；条件硬 1 项 4 个：Z4）。利息形态：性质违例的检出时机从『运行时/编译期自动检出』退化为『评审期人工核验』，检出延迟 = 一个决策周期；漏检后果按性质分级——**Z2 漏检**（3 实例，RLP-001／002／003 implements）＝投递语义未声明、或以中间件 exactly-once 配置替代声明（RLP-001-AP1／RLP-003-AP2，P0），而 5.2.3 @2479 明文『exactly-once 仅指**有效恰好一次**——幂等消费达成的效果等价，非中间件魔法』→ 终局是**重复投递在无幂等消费侧静默放大**：发件箱中继与收件箱去重均为至少一次语义下的补偿机制，机制缺位时重复事件直接进入下游状态而无可观测信号；且收件箱表与业务写跨事务却声称有效恰好一次（RLP-002-AP1，P0）会使去重判定失效于崩溃窗口。**X1 漏检**（2 实例，RLP-001／RLP-003 consumed_by）＝去重表与发件箱表成为未登记的跨单元交互面 → 事实接口绕过契约册（X1 @2009『无未登记跨单元交互』），中继进程对表的读写未经所有者与契约登记即成为跨单元依赖。**Z1 漏检**（1 实例，RLP-007 consumed_by）＝舱壁的池划分未显式建模且契约不在册 → 隔离面不成立（RLP-007-AP1，P0：以逻辑命名区分消费者而物理共享同一线程/连接池），单点故障经共享池拖垮全局，与 @2477 舱壁项逐字『线程/连接池按消费者隔离，防单点拖垮全局』直接相反。**Z3 漏检**（1 实例，RLP-004 consumed_by）＝对未声明幂等的操作或关键步（pivot）重试（RLP-004-AP1，P0）→ 补偿失效与终局操作重复执行；5.2.2 @2473 明文『分类不明 = Z3 违例 = 阻塞』，漏检即该阻塞闸门失去可验证内容。**Y1 漏检**（1 实例，RLP-002 consumed_by）＝收件箱表被当作权威状态源 → 同一数据集合出现多所有者，与 Y1 @2279『|{M : owner(D, M)}| = 1 ∨ has_approved(shared_write_exception(D))』直接冲突；该面与 DFL-005 的 Y1 implements（派生物不是所有者）互为上下游，漏检使方面 4／5 的两个 kind 同时失守。**Z4 漏检**（4 实例，条件硬）＝Σ timeout_budget(path) > sla_bound(path)（RLP-005-AP2，P1）或下游超时 ≥ 上游超时 − 传播开销（RLP-005-AP1，P0）→ 级联超时与预算不闭合：上游先行超时使下游工作成为无人接收的孤儿，最坏重试时长未纳入上游预算（RLP-004-AP3，P1）与池内排队无界（RLP-007-AP2／AP3，P1）均使 Σ 无法闭合；门槛未过则降软＋保守界，其漏检形态为『以便利常数充当传播开销与 SLA 上界』（RLP-005-AP3，P1，直接触发降软分支）。缓解：(i) 0.17.5 强制 ADR 附注『依据种子条目，待重验证』；(ii) 本批 **32** 条 anti_patterns 的 P0／P1／P2 信号级判读带 3.5／4.5／5.5 性质指针与 MJ-4 判据留痕，可逐条人工复核（实测 P0 **11**／P1 **13**／P2 **8**；逐条 4/4/4/5/5/5/5；其中 5 条 P1 以 Z4 条件硬为定级依据，见 remediation_plan (c)）；(iii) compatibility 面按 MJ-9 只登记母本有明文依据的对（32 行；requires 2 行分别有 @2477 与 @2473 明文），无明文依据者不静默造规范；(iv) project.py 的 M9／C-ST／C-ENV／M2／M3／M4／M6 静态自检覆盖 peer 存在性、状态资格、RLP 剖面 envelope 非空义务（kind_profile_RLP.entry_level_exemptions 为空集 @326 → 七条一律非空；实测 **27** 项 bound_expr 全为关系式，逐条 4/4/3/4/4/4/4，M3 全过）、pattern_id 与 target_aspect 形态、谓词词汇封闭（本批 M4 面零新增候选）、references 分级七项可机器判定面（**14** 行无空集，M2／M6 非平凡满足）；(v) 累计口径——本项与前八项合计覆盖 **77** 条 seed 条目（STY 24＋OWN 4＋CSL 5＋CRD 8＋DEC 8＋CTR 12＋STP 4＋DFL 5＋RLP 7），九项 scope 互不重叠，豁免面按批次逐项登记，不合并、不互相援引。"
