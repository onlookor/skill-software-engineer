        - {source_type: clause_id, value: "0.7", verified: true}     # 状态机的契约投影（3.2.2 内容列明文援引）
        - {source_type: clause_id, value: "6.2.1", verified: true}   # 可观测性族（覆盖率）＋可修改性族
    typical_reversibility: bounded     # 人工判断：published→deprecated 可经 ADR 修订与契约 v2 回退（3.6 示例三：制定契约 v2＋弃用窗口＋绞杀者迁移序列）→ 非 costly 亦非 free（X5 发布即批准，无声撤回违例）；retired 态母本未给回退路径 → 该态的逆转性属人工判断项，本条按整行取 bounded 并如实登记该缺口
    applicability:
      problem_space:                   # 骨架源：3.2.2「内容」列
        - "draft → review → published → deprecated → retired 五态链（3.2.2 内容列逐字，原文以行内代码体给出）"
        - "状态字段写入共享白板决策记录（0.7 状态机的契约投影）（同列逐字）→ 生命周期状态不是文档属性而是白板谓词 lifecycle_state 的取值"
      current_space:                   # 骨架源：3.3 现状空间驱动
        - "现状契约清单须逐契约登记当前态：无文档隐式契约以流量观测 + 消费者代码分析为准（3.3 现状空间驱动第二行；公理 A1）→ 在网有流量的契约不得登记为 draft"
        - "已发布契约的边界冻结（3.4 施→2 硬）→ 现状态只能沿五态链前进或走契约 v2 新建，不得以状态回退的方式收回已发布契约"
      delivery_space:                  # 骨架源：3.3 双使用者条款＋交付空间驱动
        - "契约发布（published 迁移）与破坏性变更批准属高影响决策，一律走批准路径；Agent 自主项限于契约提取、schema 起草、兼容性规则检查、CDC 套件脚手架生成、X 系列性质校验（3.3 双使用者条款逐字）→ draft→review 的准备工作可自主，review→published 不可"
        - "CI 成熟度 → CDC 可行集（3.3 交付空间驱动第二行）→ review 态的准入证据（契约测试是否可执行）由交付空间决定；能力不足降软 + 保守假设 ADR"
    envelope:
      - metric: "可观测性：卡片 observability_requires（5.2.5）满足率、追踪覆盖率"
        bound_expr: "lifecycle_state 已写入共享白板决策记录的契约数 / 契约总数 上界为 1（3.2.2 内容列：状态字段写入共享白板决策记录）→ 缺口 = 未写入者数，随契约总数增加 单调不减"
        source: {source_type: clause_id, value: "3.2.2", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数、跨边界契约变更数）"
        bound_expr: "published 与 deprecated 并存版本数 上界 = 弃用窗口内允许并存数；迁移完成度 = 已迁移消费者数 / consumer_set 基数 上界为 1 → 随窗口推进 单调不减（3.2.2 破坏性变更流程默认值列：弃用窗口 ≥ 最慢消费者的迁移时长估计）"
        source: {source_type: clause_id, value: "3.2.2", verified: true}
    cost_profile:
      latency_budget_delta: "生命周期状态机本身不进入运行时调用路径 → 延迟预算增量为 0；deprecated 与 published 并存期的路由分支与序列化面增量由版本化策略承载（CTR-007），母本未给量化数值 → 由方面 6 目标值经 3.4 接收约束方面 6 行下发（6.2.1 量化纪律＋0.4 证据门槛）"
      failure_modes: ["契约跳过 review 直接 published 而无已批准 ADR（X5 硬违例）", "状态字段未写入共享白板决策记录，仅存于文档或代码注释（3.2.2 内容列；3.4 施→10 禁止双重维护）", "迁入 deprecated 而未登记弃用窗口终点 until（X3 违例面；3.2.2 破坏性变更流程默认值列）", "在网有流量的契约登记为 draft（3.3 现状空间驱动第二行：以流量观测为准）", "以状态回退（published→draft）的方式收回已发布契约（3.4 施→2 硬：边界冻结）", "Agent 自主执行 published 迁移（3.3 双使用者条款：一律走批准路径）"]
      consistency_impact: "生命周期状态不承载跨单元事务语义；一致性级别由方面 4 的 Y 系列判定（CSL 批承载）；deprecated 态不等于数据不再可读——并存期的一致性定案仍属方面 4/5，不得以状态字段替代一致性级别登记"
      observability_requires: ["每份契约的 lifecycle_state 在共享白板决策记录可查（3.2.2 内容列；X5 判定所需）", "published 与 deprecated 迁移各自的批准 ADR 可追溯（X5 硬）", "deprecated 契约的弃用窗口终点 until 与其消费者迁移进度可度量（X3；3.6 示例三消费字段 deprecation_window）", "retired 迁移的判定依据（consumer_set 已清空）在案", "契约漂移检测规则参数已按 0.13 注册（3.4 施→9 硬）"]
      ops_cost: "[五态链的状态流转管理面＋白板决策记录的写入与查询面（3.2.2 内容列）→ 运维项随契约数与并存版本数上升；母本未给单位运维成本（默认值列为「—」）→ 方括号占位（MJ-20 (iii) 同型）]"
      skill_prerequisites: ["五态链的语义与准入证据（draft → review → published → deprecated → retired）（3.2.2 内容列）", "状态字段向共享白板决策记录的投影写法（同列；0.7 状态机）", "发布与破坏性变更的批准路径识别（3.3 双使用者条款；X5）", "弃用窗口终点与迁移进度的联动登记（3.2.2 破坏性变更流程行；X3）"]
      aggregation_semantics: itemwise  # lifecycle_state 为逐契约字段（X2/X5 均为逐契约量词 ∀C）→ 无跨契约聚合式（MJ-19 (iii) 同型；MJ-21 (ix)）
    compatibility:
      - peer_entry: CTR-011
        relation: composable
        evidence: {source_type: clause_id, value: "3.6", verified: true}   # 示例三明文「contract C: published→deprecated（弃用窗口＋绞杀者迁移序列, 完整 ADR 批准）; contract C1/C2: →published（拆分后两条）」→ 生命周期状态迁移是破坏性变更流程的执行载体，两者共用弃用窗口与批准 ADR；3.2.2 相邻两行同旨（deprecated 态 + 弃用窗口 ≥ 最慢消费者迁移时长估计）
    constraints_imposed:               # 交叉表源：3.4「施加约束」表（方面 3 全体六行，CTR 十二条逐字相同）
      - {target_aspect: 2, constraint: "已发布契约的边界冻结——分解不得切割既有契约（切割需求 → 走弃用窗口 + 绞杀者迁移）", level: hard}
      - {target_aspect: 4, constraint: "数据契约的 schema 与语义条款是数据流动的唯一合法路径定义", level: hard}
      - {target_aspect: 5, constraint: "协调模式中的每条跨单元交互必须有注册契约（Z1 的契约来源）", level: hard}
      - {target_aspect: 8, constraint: "契约测试是验证计划的组成部分；微服务风格 → CDC 必备；事件驱动 → 事件 schema 演化测试必备", level: conditional}   # 级别列原文「软/硬按风格」→ 生命周期不绑定单一风格：review 态的准入证据含契约测试（取硬），CDC 按 X4 分级（微服务风格下升硬），事件 schema 演化测试项按风格适用（MJ-4 同型判读；MJ-21 (x)）
      - {target_aspect: 9, constraint: "契约漂移（运行时实际流量与注册契约的偏离）是守护对象；漂移检测规则参数按 0.13 注册", level: hard}
      - {target_aspect: 10, constraint: "契约是机器层的天然工件：IDL/schema/OpenAPI 文档直接投影为白板谓词，禁止双重维护（0.9 同源生成原则在契约域最强适用）", level: hard}
    anti_patterns:
      - pattern_id: CTR-010-AP1
        description: "契约未经批准即迁入 published（或已迁入 deprecated 而无批准 ADR）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ [lifecycle_state ∈ {published, deprecated}] ∧ ¬∃ a: approved(a) ∧ [a 为 C 的状态迁移 ADR]"
        signal_level: P0               # X5 明文「lifecycle_state(C) ∈ {published, deprecated} → ∃ approved(ADR(C)) —— 发布即批准 —— 硬」；3.3 双使用者条款同旨（published 迁移一律走批准路径）→ P0（MJ-4 判据）
      - pattern_id: CTR-010-AP2
        description: "状态字段未写入共享白板决策记录（生命周期状态只存于文档或代码）"
        detection_predicate: "∃ C: [contract(C, ·, ·, ·, ·, ·, lifecycle_state)] ∧ ¬[lifecycle_state 已写入共享白板决策记录]"
        signal_level: P1               # 3.2.2 内容列明文「状态字段写入共享白板决策记录（0.7 状态机的契约投影）」＋3.4 施→10 硬（禁止双重维护）；但母本未将『状态未上白板』单列 X 系列性质（X5 只约束批准存在性）→ P1，与 X5 判定不可达并存时按其升 P0（MJ-4 判据）
      - pattern_id: CTR-010-AP3
        description: "契约迁入 deprecated 而未登记弃用窗口终点（until 缺失）"
        detection_predicate: "∃ C, v1: [contract(C, ·, ·, ·, version, ·, lifecycle_state)] ∧ [lifecycle_state = deprecated] ∧ ¬∃ t: [deprecation_window(C, v1, t)]"
        signal_level: P1               # X3「∀C, breaking_change(C,v1,v2) → deprecation_window(C,v1,t) ∧ t ≥ slowest_consumer_migration(C) —— 条件硬」（迁移时长估计满足 0.4 证据门槛时为硬；否则降软 + 保守假设 ADR，保守默认窗口取注册表登记上限）；deprecated 态不必然伴随 breaking_change → 未按 P0 登记；级别待 W3/X3 条件硬裁决口（s5h 既有）落定后复核（MJ-4 判据）
    formal_anchor:
      - {property_id: X5, role: implements}      # lifecycle_state 是 X5 的判定字段：「lifecycle_state(C) ∈ {published, deprecated} → ∃ approved(ADR(C))」以本治理维度登记的五态链为取值域（3.2.2 内容列；3.6 示例三消费字段 CTR.lifecycle_state）
      - {property_id: X2, role: consumed_by}     # X2 的量词范围由 lifecycle_state 界定（∀C(lifecycle_state=published)）→ 状态未登记使 X2 不可判定
    references: []                     # 母本 3.7 书目 28–34 无 3.2.2「契约生命周期」行的行级登记提取面（28/29 → CDC 与契约测试区分；30 → 同步 API 契约机器层格式；31 → 3.2.1 事件信封；32 → API 契约设计方法；33 → schema registry 与兼容性规则；34 → 3.4 绞杀者迁移）；尾注「条目 4《Building Microservices》第 2 版的契约测试章节同样支撑 3.2.2，不重复著录」的支撑面限于契约测试（CDC 行），不扩及本行 → 按 G-CRD-1／G-DEC-1 同型纪律「表级/节级面不下探」不扩张；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）→ 登记 G-CTR-1，待人工裁决补勘后回填（SO-9）
    narrative:
      benefit_cost_analysis: "收益：五态链把契约的存在状态从口头共识变成白板谓词 lifecycle_state，使 X5『发布即批准』与 X2『发布态版本与兼容策略齐备』都有确定的量词范围；状态字段上白板（0.7 状态机的契约投影）令 3.4 施→10 的禁止双重维护在生命周期面可执行；3.6 示例三显示状态迁移是冲突消解的落点——CH-E 回溯通道最终产出 published→deprecated 与两条新契约 →published 的显式状态变化，两个方面决策都未被静默修改。代价：默认值列为「—」→ 母本未给任何默认态或默认窗口，逐案登记面最宽且无起点可依；retired 态无母本回退路径，本条按整行取 bounded 属人工判断（已如实登记该缺口）；review 态的准入证据依赖 CI 成熟度（3.3 交付空间驱动第二行），低成熟度场合状态机实质退化为 draft→published 两态而违背 X5；状态上白板与文档并存时最易发生双重维护（AP2）。"
      typical_scenarios: "新契约从起草到发布须逐态登记并各附准入证据的场合（3.2.2 内容列五态链）；契约须弃用、迁移到 deprecated 并登记窗口终点的场合（同列；X3）；方面 2 拆分诉求与已发布契约冻结冲突、经 CH-E 产出契约 v2 与状态迁移的场合（3.6 示例三）；既有契约无文档、须以流量观测确定当前态的场合（3.3 现状空间驱动第二行）；Agent 完成契约提取与 schema 起草但发布须交批准路径的场合（3.3 双使用者条款）；消费者已全部迁移、须判定 retired 的场合（3.2.2 内容列末态）。"
      common_misuse: "未经批准迁入 published 或 deprecated（AP1，X5 硬违例）；状态只存文档或代码而不上白板（AP2，3.2.2 内容列＋3.4 施→10）；deprecated 无弃用窗口终点（AP3，X3 违例面）；在网有流量的契约登记为 draft（3.3 现状空间驱动第二行）；以状态回退收回已发布契约（3.4 施→2 硬）；Agent 自主执行 published 迁移（3.3 双使用者条款）；把 deprecated 读作数据不再可读而以状态字段替代一致性级别登记（一致性属方面 4 的 Y 系列）；因默认值列为「—」即推定一个默认态或默认窗口（0.4 禁假精确）。"

  - entry_id: CTR-011
    kind: CTR
    name: "破坏性变更流程"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-CTR-01）
    provenance:
      origin: hybrid                   # 骨架=3.2.2 表行「破坏性变更流程」（内容列高影响决策四要件；默认值列弃用窗口下界）＋谓词转写（manual）；name 逐字承表行首列
      source_pointers:
        - {source_type: row_id, value: "3.2.2-破坏性变更流程", verified: true}
        - {source_type: clause_id, value: "3.2.2", verified: true}
        - {source_type: clause_id, value: "3.3", verified: true}     # 问题空间驱动第一行（第三方开放 → 长弃用窗口）＋双使用者条款（破坏性变更批准一律走批准路径）
        - {source_type: clause_id, value: "3.4", verified: true}     # 施→2（切割需求 → 走弃用窗口 + 绞杀者迁移）＋接收约束方面 6 行
        - {source_type: clause_id, value: "3.5", verified: true}     # X3（迁移窗口闭合，条件硬）／X5（发布即批准）
        - {source_type: clause_id, value: "3.6", verified: true}     # 示例三（CH-E：契约 v2＋弃用窗口＋绞杀者迁移序列，完整 ADR 走批准路径）＋示例四（FM-1 证据缺口：无出处承诺剔除→重诊→保守界）
        - {source_type: clause_id, value: "0.4", verified: true}     # 迁移时长估计须有出处，否则按证据门槛降级处置（3.2.2 默认值列明文援引）
        - {source_type: clause_id, value: "0.6", verified: true}     # CH-E 回溯约束声明（示例三触发条款）
        - {source_type: clause_id, value: "0.20.2", verified: true}  # FM-1（示例四：无出处事实剔除→重诊→保守假设 ADR＋可推翻指标）
        - {source_type: clause_id, value: "6.2.1", verified: true}   # 可修改性族（触达单元数、跨边界契约变更数）＋可用性可靠性族（错误预算）
        - {source_type: bib_id, value: 34, verified: true}
    typical_reversibility: costly      # 3.2.2 内容列明文「破坏性变更 = 高影响决策（影响全部消费者 + 难逆转）」→ 非 bounded；但迁移支持 + 绞杀者迁移序列（3.4 施→2；书目 34）提供出路 → 非 irreversible
    applicability:
      problem_space:                   # 骨架源：3.2.2「内容」列＋3.3 问题空间驱动
        - "破坏性变更 = 高影响决策（影响全部消费者 + 难逆转）：完整 ADR + 批准 + 弃用窗口 + 迁移支持（3.2.2 内容列逐字，四要件）"
        - "第三方开放 → full 兼容 + 长弃用窗口 + 对外 SLA 条款（3.3 问题空间驱动第一行）；合规/监管接口 → 走 CH-A＋0.5 必登类目（同节第二行）→ 两类场合的窗口与批准面均加严"
      current_space:                   # 骨架源：3.3 现状空间驱动＋3.6 示例四
        - "最慢消费者的迁移时长是现状事实，须有出处：无出处的消费者承诺（如口头转述的迁移时间）按 0.4 门槛不获任何权重 → 剔除后重诊，缺口记录入案｛缺失事实、援引条款＝X3、勘察任务｝（3.6 示例四；FM-1）"
        - "现状契约清单须标出横跨拟拆分线的已发布契约（3.6 示例三：方面 2 按 S5 变更频率拆分 × 已发布契约横跨拆分线 → 触发 X 系列施加给方面 2 的硬约束『不得切割既有契约』）"
      delivery_space:                  # 骨架源：3.3 交付空间驱动＋双使用者条款
        - "消费者多且异构 → full；单消费者同团队 → backward 可接受（3.3 交付空间驱动第一行）→ 迁移支持的工程量随 consumer_set 基数与异构度上升"
        - "破坏性变更批准属高影响决策，一律走批准路径；Agent 不得自主批准（3.3 双使用者条款逐字）→ 交付空间的自动化能力只覆盖 ADR 起草与 X 系列性质校验，不覆盖批准"
    envelope:
      - metric: "可修改性：典型变更的实现成本（触达单元数、跨边界契约变更数）"
        bound_expr: "迁移支持成本 上界 = consumer_set 基数 × 单消费者迁移项数（3.2.2 内容列：影响全部消费者）→ 随 consumer_set 基数 单调不减；触达单元数含拆分后新建契约数（3.6 示例三：契约 v2 = 拆分后的两条新契约）"
        source: {source_type: clause_id, value: "3.2.2", verified: true}
      - metric: "可用性可靠性：SLO、错误预算〔1 − SLO〕、MTTR、RPO/RTO"
        bound_expr: "弃用窗口 t ≥ slowest_consumer_migration(C)（X3）→ 窗口内旧版本须持续可用，并存版本所占错误预算份额（错误预算 = 1 − SLO）上界为 1；窗口缩短使未按期迁移的消费者失配概率 单调不减，母本未给该概率数值（0.4 证据门槛 → 不填）"
        source: {source_type: clause_id, value: "3.5", verified: true}
    cost_profile:
      latency_budget_delta: "破坏性变更流程本身不改变调用路径 → 运行时延迟预算增量为 0；弃用窗口内新旧版本并存引入的路由分支与序列化项由版本化策略承载（CTR-007）；母本未给量化增量 → 由方面 6 目标值经 3.4 接收约束方面 6 行下发（6.2.1 量化纪律＋0.4 证据门槛）"
      failure_modes: ["破坏性变更无完整 ADR 或未经批准即执行（3.2.2 内容列四要件缺项；X5 硬）", "无弃用窗口或窗口短于最慢消费者迁移时长（X3；3.2.2 默认值列）", "迁移时长估计无出处而径行作为窗口依据（3.2.2 默认值列明文『估计须有出处，否则按 0.4 证据门槛降级处置』；3.6 示例四 FM-1）", "已剔除的无出处事实仍被下游 ADR 引用（3.6 示例四：FM-8 断链面）", "缺迁移支持而只发弃用公告（3.2.2 内容列四要件之末项；3.4 施→2 绞杀者迁移）", "切割已发布契约而不走本流程（3.4 施→2 硬）", "Agent 自主批准破坏性变更（3.3 双使用者条款：一律走批准路径）"]
      consistency_impact: "弃用窗口内新旧版本并存 → 跨版本读写的一致性级别由方面 4 的 Y 系列判定（CSL 批承载），本流程只定义迁移序列不定义一致性；绞杀者迁移期间新旧路径并存的双写/单写定案属方面 4 的 shared_write_exception 面，不得以迁移序列替代一致性定案"
      observability_requires: ["破坏性变更的完整 ADR 与批准记录可追溯（3.2.2 内容列；X5 硬）", "弃用窗口终点 until 与其出处（最慢消费者迁移时长估计）在案（X3；3.2.2 默认值列）", "消费者迁移进度可度量（已迁移数 / consumer_set 基数）——窗口闭合判定所需", "剔除的无出处事实与缺口记录｛缺失事实、援引条款、勘察任务 ID 或保守假设 ADR#｝在案（3.6 示例四；FM-1 工件）", "契约漂移检测规则参数已按 0.13 注册（3.4 施→9 硬）"]
      ops_cost: "[弃用窗口内新旧版本并存的运维面＋迁移支持的工程面＋绞杀者迁移序列的切换运维面（3.2.2 内容列；3.4 施→2；书目 34）→ 运维项随 consumer_set 基数与窗口长度上升；母本未给单位运维成本 → 方括号占位（MJ-20 (iii) 同型）]"
      skill_prerequisites: ["破坏性变更的识别（何为改/删既有字段与放宽兼容性规则）（3.2.2 兼容性规则行；CTR-008）", "完整 ADR 与批准路径的运作（3.2.2 内容列；3.3 双使用者条款；X5）", "弃用窗口的定界与出处核验（3.2.2 默认值列；X3；0.4 证据门槛）", "绞杀者迁移序列的设计（3.4 施→2；书目 34 的行级登记提取面）", "无出处事实的剔除→重诊→保守界处置（3.6 示例四；FM-1）"]
      aggregation_semantics: itemwise  # X3 为逐契约量词（∀C, breaking_change(C,v1,v2) → …）→ 弃用窗口按契约逐项定界、无跨契约聚合式（MJ-19 (iii) 同型；MJ-21 (ix)）
    compatibility:
      - peer_entry: CTR-010
        relation: composable
        evidence: {source_type: clause_id, value: "3.6", verified: true}   # 示例三明文「contract C: published→deprecated（弃用窗口＋绞杀者迁移序列, 完整 ADR 批准）」→ 本流程的执行结果落在生命周期的状态迁移上；**回填 CTR-010 侧已声明的镜像**（同批 seed 条目 → 双向登记，MJ-21 (viii)）
      - peer_entry: CTR-008
        relation: composable
        evidence: {source_type: row_id, value: "3.2.2-兼容性规则", verified: true}   # 默认值列对外 API 一项为「full + 弃用窗口」→ 兼容性规则与本流程共用弃用窗口这一参数，放宽既有规则属破坏性变更须走本流程（本行回填 CTR-008 侧已登记的镜像；同批 seed 条目 → 双向登记，MJ-21 (viii)）
      - peer_entry: DEC-005
        relation: tension
        evidence: {source_type: clause_id, value: "3.6", verified: true}   # 示例三明文「方面 2 判定某单元应按 S5（变更频率）拆分，但一条已发布契约横跨拟拆分线（X 系列施加给方面 2 的硬约束『不得切割既有契约』被触发）」→ 本条施加给方面 2 的边界冻结（3.4 施→2 硬）与 S5 按变更频率拆分构成张力，经 CH-E 回溯约束声明消解（不可行性证据 = 拆分收益量化 × 契约冻结冲突、涉及约束边 = 方面3→方面2、建议重审范围 = 该契约的弃用计划）；DEC-005 属已批准条目 → 只登记本侧，不回填镜像（MJ-21 (viii)）
    constraints_imposed:               # 交叉表源：3.4「施加约束」表（方面 3 全体六行，CTR 十二条逐字相同）
      - {target_aspect: 2, constraint: "已发布契约的边界冻结——分解不得切割既有契约（切割需求 → 走弃用窗口 + 绞杀者迁移）", level: hard}
      - {target_aspect: 4, constraint: "数据契约的 schema 与语义条款是数据流动的唯一合法路径定义", level: hard}
      - {target_aspect: 5, constraint: "协调模式中的每条跨单元交互必须有注册契约（Z1 的契约来源）", level: hard}
      - {target_aspect: 8, constraint: "契约测试是验证计划的组成部分；微服务风格 → CDC 必备；事件驱动 → 事件 schema 演化测试必备", level: conditional}   # 级别列原文「软/硬按风格」→ 破坏性变更流程不绑定单一风格：契约测试项取硬（迁移支持须以契约测试验证新旧两侧），CDC 按 X4 分级（微服务风格下升硬），事件 schema 演化测试项在事件契约破坏性变更时为必备（MJ-4 同型判读；MJ-21 (x)）
      - {target_aspect: 9, constraint: "契约漂移（运行时实际流量与注册契约的偏离）是守护对象；漂移检测规则参数按 0.13 注册", level: hard}
      - {target_aspect: 10, constraint: "契约是机器层的天然工件：IDL/schema/OpenAPI 文档直接投影为白板谓词，禁止双重维护（0.9 同源生成原则在契约域最强适用）", level: hard}
    anti_patterns:
      - pattern_id: CTR-011-AP1
        description: "破坏性变更无弃用窗口，或窗口短于最慢消费者迁移时长"
        detection_predicate: "∃ C, v1, v2: [contract(C, ·, ·, ·, version, ·, ·)] ∧ [breaking_change(C, v1, v2)] ∧ ¬(∃ t: [deprecation_window(C, v1, t)] ∧ t ≥ [slowest_consumer_migration(C)])"
        signal_level: P1               # X3 明文为条件硬：「迁移时长估计满足 0.4 证据门槛时为硬；否则降软 + 保守假设 ADR，保守默认窗口取注册表登记上限」＋3.5 尾注「X3 的条件硬结构与方面 2 的 W3 同型：硬化与否由 0.4 证据门槛统一判定，防止 Agent 编造『消费者迁移时长』假精确数字绕过弃用窗口」→ 未按 P0 登记；级别待 W3/X3 条件硬裁决口（s5h 既有）落定后复核（MJ-4 判据）
      - pattern_id: CTR-011-AP2
        description: "破坏性变更缺完整 ADR 或未经批准即执行"
        detection_predicate: "∃ C, v1, v2: [contract(C, ·, ·, ·, ·, ·, lifecycle_state)] ∧ [breaking_change(C, v1, v2)] ∧ ¬(∃ a: approved(a) ∧ [a 为完整 ADR 且覆盖本次变更])"
        signal_level: P0               # 3.2.2 内容列明文四要件（完整 ADR + 批准 + 弃用窗口 + 迁移支持）＋X5「lifecycle_state(C) ∈ {published, deprecated} → ∃ approved(ADR(C)) —— 发布即批准 —— 硬」＋3.3 双使用者条款（破坏性变更批准一律走批准路径）→ P0（MJ-4 判据）
      - pattern_id: CTR-011-AP3
        description: "以无出处的消费者迁移承诺作为弃用窗口依据（未剔除即使用）"
        detection_predicate: "∃ f ∈ evidence_set: ¬sourced(f) ∧ [f 被用作 deprecation_window 的定界依据]"
        signal_level: P0               # 3.2.2 默认值列明文「弃用窗口 ≥ 最慢消费者的迁移时长估计（估计须有出处，否则按 0.4 证据门槛降级处置）」＋3.6 示例四「S0 判定谓词 facts_sourced(F) 失败 → FM-1 当场触发：f2 从 evidence_set 剔除（不是标记存疑后继续使用——无出处事实不获得任何权重）」＋0.4「不存在『口头可信』豁免」→ P0（MJ-4 判据）
      - pattern_id: CTR-011-AP4
        description: "切割已发布契约而不走本流程（分解直接跨越契约边界）"
        detection_predicate: "∃ C, u1, u2: [contract(C, ·, ·, ·, ·, ·, lifecycle_state)] ∧ [lifecycle_state = published] ∧ unit(u1) ∧ unit(u2) ∧ [covers(C, u1, u2)] ∧ [u1 与 u2 被拆分到不同新单元] ∧ ¬[breaking_change(C, ·, ·) 已登记]"
        signal_level: P0               # 3.4 施→2 级别列为硬「已发布契约的边界冻结——分解不得切割既有契约（切割需求 → 走弃用窗口 + 绞杀者迁移）」＋X1 的 covers 谓词面 → P0；3.6 示例三给出唯一合法出路（CH-E → 契约 v2＋弃用窗口＋绞杀者迁移序列）（MJ-4 判据）
    formal_anchor:
      - {property_id: X3, role: implements}      # deprecation_window(C,v1,t) ∧ t ≥ slowest_consumer_migration(C) 的登记载体：本治理维度给出四要件与窗口下界（3.2.2 内容列＋默认值列）
      - {property_id: X5, role: consumed_by}     # 破坏性变更以状态迁移（published→deprecated）为落点 → X5 要求 ∃ approved(ADR(C))；3.6 示例三消费字段 X5.approval_route
    references:
      - {bib_id: 34, support_claim: "3.4 绞杀者迁移模式（施加给方面 2 的契约冻结的演化出路）（母本 3.7 书目 34 行级登记提取面逐字对应；提取以本地存档《Monolith to Microservices》PDF+EPUB 为准，版权页另印 978-1-492-07554-7 印刷变体，2026-09-15 年份更正见附录一第 16 行）", compile_usage: metadata_extraction, trust_grade: "[已核验（2026-09-15 年份更正，见附录一第 16 行）]"}
    narrative:
      benefit_cost_analysis: "收益：把破坏性变更从『改了就发』收回到四要件流程（完整 ADR + 批准 + 弃用窗口 + 迁移支持），使 X3『迁移窗口闭合』与 X5『发布即批准』在契约域可判定；默认值列给出窗口的下界定义（≥ 最慢消费者的迁移时长估计）并绑定 0.4 出处门槛，直接封堵以假精确数字绕过弃用窗口的路径；3.6 示例三显示本流程是方面 2 拆分诉求的唯一合法出路——不静默放弃拆分、不强行切割，而经 CH-E 产出契约 v2＋窗口＋绞杀者迁移序列；3.6 示例四显示窗口定界本身受证据卫生约束（无出处承诺剔除→重诊→保守界 6 周＋可推翻指标）。代价：影响全部消费者且难逆转（3.2.2 内容列）→ 迁移支持成本随 consumer_set 基数放大；窗口内新旧版本并存推高运维面与错误预算占用；批准一律走人工路径（3.3 双使用者条款）→ 自动化只能覆盖 ADR 起草；窗口下界依赖『最慢消费者迁移时长』这一现状事实，取证成本高且常缺出处（示例四即为此设）。"
      typical_scenarios: "已发布契约须改/删既有字段或放宽兼容性规则的场合（3.2.2 内容列；CTR-007/CTR-008）；方面 2 按 S5 变更频率拆分而契约横跨拟拆分线的场合（3.6 示例三，CH-E）；第三方开放接口须给长弃用窗口的场合（3.3 问题空间驱动第一行）；最慢消费者迁移时长有官方生命周期公告可援引的场合（3.6 示例四 f1）；消费者迁移承诺仅口头转述、须剔除并按保守界登记的场合（3.6 示例四 f2，FM-1）；须以绞杀者迁移序列逐步替换旧路径的场合（3.4 施→2；书目 34）；Agent 起草完整 ADR 但批准须交人工的场合（3.3 双使用者条款）。"
      common_misuse: "无弃用窗口或窗口短于最慢消费者迁移时长（AP1，X3 条件硬）；缺完整 ADR 或未经批准即执行（AP2，X5 硬）；以无出处的迁移承诺定窗口而不剔除（AP3，0.4＋FM-1）；已剔除事实仍被下游 ADR 引用（3.6 示例四 FM-8 断链面）；切割已发布契约而不走本流程（AP4，3.4 施→2 硬）；只发弃用公告而无迁移支持（3.2.2 内容列四要件之末项）；Agent 自主批准破坏性变更（3.3 双使用者条款）；把缩短窗口当作可豁免项（3.6 示例四：FM-1 人工介入列明示『作为硬目标豁免依据时须裁决』，0.4 门槛不存在口头可信豁免）；为迁移时长填无出处数字（X3 尾注：防假精确绕过弃用窗口）。"

  - entry_id: CTR-012
    kind: CTR
    name: "发现与注册"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-CTR-01）
    provenance:
      origin: hybrid                   # 骨架=3.2.2 表行「发现与注册」（内容列三类注册面；默认值列『按方面 1 风格选择』）＋谓词转写（manual）；name 逐字承表行首列
      source_pointers:
        - {source_type: row_id, value: "3.2.2-发现与注册", verified: true}
        - {source_type: clause_id, value: "3.2.2", verified: true}
        - {source_type: clause_id, value: "3.3", verified: true}     # 现状空间驱动第一行（现状契约清单）＋第二行（无文档隐式契约以流量观测为准）＋问题空间驱动第一行（第三方开放 → 对外 SLA 条款）
        - {source_type: clause_id, value: "3.4", verified: true}     # 接收约束方面 1 行（风格决定契约形态）＋方面 6 行＋施→5/9/10
        - {source_type: clause_id, value: "3.5", verified: true}     # X1（∃C ∈ registry: covers(C,u1,u2)）
        - {source_type: clause_id, value: "3.6", verified: true}     # 示例一（网关标准文义仅覆盖南北向流量 → 强加范围解包）
        - {source_type: clause_id, value: "0.3", verified: true}     # 强加范围解包（示例一援引）
        - {source_type: clause_id, value: "0.13", verified: true}    # 漂移检测规则参数注册（3.4 施→9）
        - {source_type: clause_id, value: "6.2.1", verified: true}   # 性能族（延迟分位数）＋可观测性族（追踪覆盖率）
    typical_reversibility: bounded     # 人工判断：注册面切换（API 网关 ↔ schema registry ↔ 服务目录）不改变契约语义与 version/compat_policy，但已登记工件与消费者查询路径须同步迁移 → 非 free；母本未给本行的逆转成本（默认值列仅『按方面 1 风格选择』）→ 不推定为 costly
    applicability:
      problem_space:                   # 骨架源：3.2.2「内容」列
        - "API 网关（南北向）、schema registry（事件/消息）、服务目录（内部检索）三类注册面（3.2.2 内容列逐字，按流向分列）"
        - "按方面 1 风格选择（3.2.2 默认值列逐字）→ 注册面选型由通信/协调风格决定，不由契约形态单方决定"
      current_space:                   # 骨架源：3.3 现状空间驱动
        - "现状契约清单是注册面的输入：既有契约须先逆向登记到对应注册面（3.3 现状空间驱动第一行）；无文档隐式契约以流量观测 + 消费者代码分析为准，文档仅作线索（同节第二行；公理 A1）"
        - "既有网关标准的文义范围须逐案解包：公司 API 网关标准强制所有服务接口 REST+JSON 的强加范围仅覆盖南北向流量（外部→系统），东西向不在其内（3.6 示例一；0.3）→ 注册面选型不得被泛化的强加决策替代"
      delivery_space:                  # 骨架源：3.3 交付空间驱动＋问题空间驱动第一行
        - "CI 成熟度 → CDC 可行集（3.3 交付空间驱动第二行）→ schema registry 作为注册面时其兼容性检查须能在 CI 中执行；能力不足降软 + 保守假设 ADR，可推翻指标 = CI 能力建立"
        - "第三方开放 → full 兼容 + 长弃用窗口 + 对外 SLA 条款（3.3 问题空间驱动第一行）→ 南北向注册面须承载对外 SLA 条款的可查性"
    envelope:
      - metric: "可观测性：卡片 observability_requires（5.2.5）满足率、追踪覆盖率"
        bound_expr: "注册面覆盖率 = 已登记于 API 网关 ∨ schema registry ∨ 服务目录 三者之一的契约数 / 契约总数 上界为 1（3.2.2 内容列；X1：∀ interaction(u1,u2) ∈ connects: ∃C ∈ registry: covers(C,u1,u2)）→ 缺口 = 未登记者数，随契约总数增加 单调不减"
        source: {source_type: clause_id, value: "3.5", verified: true}
      - metric: "性能：延迟分位数（P50/P99，P99 = 延迟分布第 99 百分位数）"
        bound_expr: "API 网关（南北向）作为注册与发现面引入额外一跳 → 外部可见延迟 随网关串联跳数 单调不减；P99 上界须由方面 6 目标值给定（3.4 接收约束方面 6 行：延迟/可用性目标 → 契约 SLA 条款）→ 四类合法出处之外不得填值（6.2.1 量化纪律＋0.4 证据门槛）"
        source: {source_type: clause_id, value: "3.4", verified: true}
    cost_profile:
      latency_budget_delta: "南北向经 API 网关引入额外一跳、schema registry 在事件/消息路径引入解析项；服务目录用于内部检索、不在运行时调用路径上 → 该项增量为 0；母本未给任一注册面的量化延迟增量 → 由方面 6 目标值经 3.4 接收约束方面 6 行下发（6.2.1 量化纪律＋0.4 证据门槛）"
      failure_modes: ["契约未在任何注册面登记（X1 硬违例：无未登记跨单元交互）", "注册面选择与方面 1 风格不符——事件/消息契约仅登记于南北向 API 网关而无 schema registry（3.2.2 默认值列『按方面 1 风格选择』＋内容列按流向分列）", "同一契约在两个注册面各持一份不同步的登记（3.4 施→10 硬：禁止双重维护）", "把南北向网关标准泛化套用到东西向服务间交互（3.6 示例一幻觉之一『强加覆盖一切』；0.3 强加范围解包）", "以注册面存在替代契约内容登记——已上网关但 version/compat_policy 缺失（X2 硬）", "隐式契约未逆向登记（3.3 现状空间驱动第二行：以流量观测 + 消费者代码分析为准）"]
      consistency_impact: "注册面承载的是契约的可发现性与登记态，不承载跨单元事务语义；一致性级别由方面 4 的 Y 系列判定（CSL 批承载）；schema registry 的 subject 划分不得被读作数据所有权定案（所有权属方面 4 的 OWN 批）"
      observability_requires: ["三类注册面各自的契约清单可查且可交叉核对（3.2.2 内容列；X1 的 registry 可判定性所系）", "南北向与东西向流量的注册面归属可区分（3.6 示例一：强加范围解包所需）", "契约漂移检测规则参数已按 0.13 注册（3.4 施→9 硬）——注册面与实际流量的偏离即漂移", "对外 SLA 条款在南北向注册面可查（3.3 问题空间驱动第一行；3.4 接收约束方面 6 行）", "schema registry 的兼容性检查结果在提供者 CI 中留痕（3.3 交付空间驱动第二行）"]
      ops_cost: "[API 网关（南北向）＋schema registry（事件/消息）＋服务目录（内部检索）三类注册面的部署与运维项（3.2.2 内容列）→ 运维项随契约数与注册面数上升；母本未给单位运维成本 → 方括号占位（MJ-20 (iii) 同型）]"
      skill_prerequisites: ["三类注册面的流向辨析（南北向 / 事件·消息 / 内部检索）（3.2.2 内容列）", "按方面 1 风格选择注册面（同表默认值列；3.4 接收约束方面 1 行）", "强加决策的范围解包（0.3＋0.6 CH-A 第 2 步；3.6 示例一）", "隐式契约的逆向登记（流量观测 + 消费者代码分析）（3.3 现状空间驱动第二行）"]
      aggregation_semantics: itemwise  # 覆盖率按契约逐项评估、注册面按契约逐个选定（3.2.2 默认值列『按方面 1 风格选择』为逐契约判据）→ 无跨契约聚合式（MJ-19 (iii) 同型；MJ-21 (ix)）
    compatibility: []                  # 3.2.2 默认值列「按方面 1 风格选择」指向方面 1 全体而非单一风格条目：内容列三类注册面分别对应南北向流量、事件/消息、内部检索三种流向，无任一 STY 条目可单独作为 peer_entry（STY-001…006 为通信/协调风格、STY-014…016 为部署形态，均不等同于流向划分）；3.4 接收约束方面 1 行的三处明文（微服务/事件驱动/单体）约束的是契约形态而非注册面 → 无母本明文依据不登记（MJ-9 判据；MJ-17 (iii) 同型），互斥不枚举（MJ-5）
    constraints_imposed:               # 交叉表源：3.4「施加约束」表（方面 3 全体六行，CTR 十二条逐字相同）
      - {target_aspect: 2, constraint: "已发布契约的边界冻结——分解不得切割既有契约（切割需求 → 走弃用窗口 + 绞杀者迁移）", level: hard}
      - {target_aspect: 4, constraint: "数据契约的 schema 与语义条款是数据流动的唯一合法路径定义", level: hard}
      - {target_aspect: 5, constraint: "协调模式中的每条跨单元交互必须有注册契约（Z1 的契约来源）", level: hard}
      - {target_aspect: 8, constraint: "契约测试是验证计划的组成部分；微服务风格 → CDC 必备；事件驱动 → 事件 schema 演化测试必备", level: conditional}   # 级别列原文「软/硬按风格」→ 本条即『按风格』判据的注册面载体：微服务风格下 CDC 升硬（X4）且注册面含服务目录，事件驱动下事件 schema 演化测试为必备且注册面含 schema registry（3.4 施→8＋3.2.2 默认值列同型判读；MJ-21 (x)）
      - {target_aspect: 9, constraint: "契约漂移（运行时实际流量与注册契约的偏离）是守护对象；漂移检测规则参数按 0.13 注册", level: hard}
      - {target_aspect: 10, constraint: "契约是机器层的天然工件：IDL/schema/OpenAPI 文档直接投影为白板谓词，禁止双重维护（0.9 同源生成原则在契约域最强适用）", level: hard}
    anti_patterns:
      - pattern_id: CTR-012-AP1
        description: "契约未在任何注册面登记（网关、schema registry、服务目录三者皆无）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ ¬[C 登记于 API 网关 ∨ schema registry ∨ 服务目录 三者之一]"
        signal_level: P0               # X1 明文「∀ interaction(u1,u2) ∈ connects: ∃C ∈ registry: covers(C,u1,u2) —— 无未登记跨单元交互 —— 硬」→ 注册面缺失使 ∃C ∈ registry 不可判定；3.4 施→5 同旨（每条跨单元交互必须有注册契约）→ P0（MJ-4 判据）
      - pattern_id: CTR-012-AP2
        description: "注册面选择与方面 1 风格不符（事件/消息契约仅登记于南北向 API 网关）"
        detection_predicate: "∃ C: [contract(C, ·, ·, kind, ·, ·, ·)] ∧ [kind 为事件或消息类] ∧ [C 登记于 API 网关（南北向）] ∧ ¬[C 登记于 schema registry]"
        signal_level: P1               # 3.2.2 默认值列明文「按方面 1 风格选择」＋内容列将三类注册面按流向分列（南北向 / 事件·消息 / 内部检索）；母本未将『注册面错配』列入 X 系列性质 → P1（MJ-4 判据）
      - pattern_id: CTR-012-AP3
        description: "同一契约在两个注册面各持一份不同步的登记（注册面双重维护）"
        detection_predicate: "∃ C: [contract(C, ·, ·, ·, ·, ·, ·)] ∧ [C 同时登记于两个及以上注册面] ∧ ¬[各注册面的登记由同一工件同源生成]"
        signal_level: P1               # 3.4 施→10 级别列为硬（禁止双重维护，0.9 同源生成原则在契约域最强适用）；机器层天然性对同步 API/异步消息/事件/数据契约均为『高』（3.2.1）→ 同源生成可行时应升硬；母本未将其列入 X 系列 → P1（MJ-4 判据）
    formal_anchor:
      - {property_id: X1, role: consumed_by}     # 三类注册面是 X1 中 registry 的具体承载：∃C ∈ registry: covers(C,u1,u2) 的可判定性取决于契约已登记于 API 网关 / schema registry / 服务目录之一（3.2.2 内容列；3.4 施→5）
    references: []                     # 母本 3.7 书目 28–34 无 3.2.2「发现与注册」行的行级登记提取面（28/29 → CDC 与契约测试区分；30 → 同步 API 契约机器层格式；31 → 3.2.1 事件信封；32 → API 契约设计方法；33 → schema registry 与兼容性规则〔其提取面为兼容性字段与 registry 角色概念，非本行的注册面选型〕；34 → 3.4 绞杀者迁移）；尾注「条目 4《Building Microservices》第 2 版的契约测试章节同样支撑 3.2.2，不重复著录」的支撑面限于契约测试（CDC 行），不扩及本行 → 按 G-CRD-1／G-DEC-1 同型纪律「表级/节级面不下探」不扩张；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）→ 登记 G-CTR-1，待人工裁决补勘后回填（SO-9）
    narrative:
      benefit_cost_analysis: "收益：三类注册面把 X1 中的抽象 registry 落成可运维工件——南北向经 API 网关、事件/消息经 schema registry、内部检索经服务目录，使『无未登记跨单元交互』有确定的查证入口；默认值列『按方面 1 风格选择』把注册面选型与风格选择绑定，避免逐案自由裁量；3.6 示例一显示注册面同时是强加范围解包的判据面——网关标准的文义只覆盖南北向，东西向不在其内。代价：三类注册面并存使同一契约可能被多处登记，施→10 的禁止双重维护在本行最易违例（AP3）；南北向网关引入额外一跳，外部可见延迟随串联跳数上升，而母本未给量化增量；schema registry 作为注册面时其兼容性检查依赖 CI 成熟度（3.3 交付空间驱动第二行）；隐式契约的逆向登记成本高（须流量观测 + 消费者代码分析）；注册面存在不等于契约内容齐备——上网关而缺 version/compat_policy 仍违 X2。"
      typical_scenarios: "新契约须选定注册面的场合（3.2.2 内容列三类；默认值列按方面 1 风格选择）；事件/消息契约须登记到 schema registry 的场合（同列流向分列）；既有隐式契约须以流量观测逆向登记到注册面的场合（3.3 现状空间驱动第二行）；公司网关标准强加南北向、而东西向注册面须单独选型的场合（3.6 示例一；0.3）；第三方开放须使对外 SLA 条款在南北向注册面可查的场合（3.3 问题空间驱动第一行）；契约漂移排查须以注册面清单对照实际流量的场合（3.4 施→9；0.13）；分布式单体排查须确认跨单元交互是否已登记的场合（X1；3.4 施→5）。"
      common_misuse: "契约未在任何注册面登记（AP1，X1 硬违例）；事件/消息契约只上南北向网关而无 schema registry（AP2，3.2.2 默认值列）；同一契约在多个注册面各持一份不同步登记（AP3，3.4 施→10）；把南北向网关标准泛化到东西向（3.6 示例一幻觉之一；0.3）；以注册面存在替代契约内容登记（X2 硬）；隐式契约不做逆向登记（3.3 现状空间驱动第二行）；把 schema registry 的 subject 划分读作数据所有权定案（所有权属方面 4 的 OWN 批）；为网关注入的延迟增量填无出处数值（0.4 证据门槛＋6.2.1 量化纪律）。"

