    anti_patterns:
      - pattern_id: RLP-003-AP1
        description: "生产侧采用发件箱而消费侧未声明幂等机制（行为面义务缺失）"
        detection_predicate: "∃ I, c: delivery_semantics(I, at_least_once) ∧ [I 经发件箱投递] ∧ [c 为 I 的消费者] ∧ ¬idempotency(c, ·)"
        signal_level: P0               # 5.5 Z2 硬＋@2477『行为面消费其投递语义』＋4.2.4 第四列 Z2 联动 → P0（MJ-4 判据；与 DFL-001-AP3 同型，本条登记行为面侧）
      - pattern_id: RLP-003-AP2
        description: "投递语义未显式声明即上线，或以中间件 exactly-once 声称替代声明"
        detection_predicate: "∃ I: [I 为经发件箱投递的异步交互] ∧ (¬declared(delivery_semantics(I)) ∨ [声明依据为中间件 exactly-once 声称])"
        signal_level: P0               # @2479 明文『未声明 = Z2 违例』『非中间件魔法』＋5.5 Z2 硬 → P0（MJ-4 判据）
      - pattern_id: RLP-003-AP3
        description: "行为面与定义面分裂登记（卡片缺项，方面 6 无从校验）"
        detection_predicate: "∃ p: [p 为发件箱模式实例] ∧ (¬quality_impact_card(p, ·) ∨ ¬[卡片被 aspect6 消费])"
        signal_level: P1               # 5.5 Z7 为升级型（『失败汇入 0.15 升级路径，同 V4』）而非硬性质 → 不满足 MJ-4 的 P0 判据；但 5.2.5 明记缺卡片即『质量预算旁路』盲区 → P1 限期整改
      - pattern_id: RLP-003-AP4
        description: "把发件箱的投递语义读作跨单元一致性保证（以 outbox 承担强一致）"
        detection_predicate: "∃ I: delivery_semantics(I, ·) ∧ [以 I 承担跨所有者强一致需求] ∧ ¬has_approved_exception(·, ·, ·)"
        signal_level: P1               # 4.5 Y6 为冲突信号面（跨所有者强一致 → Saga/预扣或回溯方面 1）而非可直接判定的硬违例；5.4 接收约束方面 4 行为硬 → 综合定 P1（MJ-4 判据）
    formal_anchor:
      - {property_id: Z2, role: implements}     # 5.5 Z2『投递语义与幂等必答』（硬）→ 本条目承载 Z2 的行为面（声明义务与消费侧幂等前提）；定义面实现见 DFL-001
      - {property_id: Z7, role: consumed_by}    # @2477『每条带质量影响卡片』＋5.5 Z7『card consumed_by(aspect6) ∧ ¬envelope_violation』→ 卡片交方面 6
      - {property_id: X1, role: consumed_by}    # 5.4 接收约束方面 3 行『投递语义是契约条款』＋施加约束方面 3 行『协调模式产生的新交互 → 契约登记需求』→ 行为面的投递语义声明进入契约注册（X1）被方面 3 消费
    references:
      - {bib_id: 44, support_claim: "5.2.3 消息与协调模式词汇表（发件箱/发布订阅的生产侧原始分类面；5.7 书目 44 登记面逐字明列 5.2.3）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-10-04 在线复核：作者官网记 ISBN 0321200683〔ISBN-10 形态〕，数字串与母本著录一致；本地 EPUB 自述 isbn13 9780133065091 的差异仍归 G-DFL-1.route 裁决口④／SO-11，开放，本批不裁决）"}
