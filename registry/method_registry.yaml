        - {source_type: clause_id, value: "1.4", verified: true}       # 接收表方面 6 行（软→硬）＋施加表通用行
        - {source_type: clause_id, value: "1.5", verified: true}       # V4/V5
        - {source_type: clause_id, value: "6.2.1", verified: true}     # 属性族与指标封闭词汇
        - {source_type: bib_id, value: "12", verified: true}
    typical_reversibility: free      # 人工判断：元方法不落地结构，改选 = 重跑选择过程；free 指无结构性回退代价，非指无留痕义务（0.18.3 纪律 3：禁止静默重跑，重跑须推进版本向量并留痕）
    applicability:
      problem_space:                 # 骨架源：1.2.4「适用条件」列（归类依 1.3，人工判断，见块头通用说明六）
        - "[质量属性已量化（方面 6 输入充分：六要素场景在案）]"
      current_space:
        - "[新系统（无既有结构锁定，0.11 现状空间锁定集为空）]"
      delivery_space: []             # 母本本行未给交付空间条件（G-STY-1）
    envelope: []                     # 剖面豁免：kind_profile_STY.entry_level_exemptions（STY-020…STY-024，check C-ENV）；元方法不改变质量属性包络，而是产生包络判定的输入 → 无 0.8 意义上的可参数化界可声明，强行填写即假精确（0.17.7 门槛 2）
    cost_profile:
      latency_budget_delta: "不适用（元方法不进入运行时路径，无延迟项）；运行时延迟面由本方法产出的风格条目（STY-001…STY-019）的 latency_budget_delta 承载"   # MJ-11
      failure_modes: ["适用条件不满足即执行：质量属性未量化 → 属性到风格特征的映射退化为主观判断，产出无出处（0.4 门槛失败 → FM-1）", "属性间冲突未求交即取单属性最优 → 可行集偏窄或为空（FM-4 全候选排除）", "以属性优先级替代包络判定：跳过 bound_expr 代入场景参数 → 目标可达性无据，V4 不可校验（假精确）"]   # 三项人工判断（源自过程定义的三个操作环节：映射、求交、可达性判定）
      consistency_impact: "不适用（无运行时一致性面）；产出的部署/通信风格决定一致性形态，属方面 4 输入"   # MJ-11
      observability_requires: ["属性 → 风格特征映射表逐条可查且带出处（0.4）", "求交过程留痕：可行集、被排除的属性/候选及依据（0.18.3 纪律 2 步骤日志）", "逐候选三值判定（reachable / reachable_with_cost / unreachable）与 cost_ledger 可查（S4 输出）"]
      ops_cost: "[无独立运维面；成本落在属性量化（6.2 六要素场景编写）与映射表的维护/复核]"
      skill_prerequisites: ["质量属性场景量化（6.2 六要素）", "属性 → 风格特征映射的判据能力（须用 6.2.1 封闭指标词汇，禁自造属性族）", "包络判定与三值裁决（0.18.2 S4）＋不可达时的升级处置（FM-5 → CH-D）"]
      aggregation_semantics: itemwise
    compatibility:                   # 骨架源：1.2.4 @1391「元方法可组合（典型：约束排除 → 质量属性驱动 → 模式匹配排序 → 演进式落地）」；只登记链内相邻对（块头通用说明四）
      - {peer_entry: STY-021, relation: composable, evidence: "1.2.4 @1391 典型链『约束排除 → 质量属性驱动』：本条为链中后继（镜像登记于 STY-021）"}
      - {peer_entry: STY-024, relation: composable, evidence: "1.2.4 @1391 典型链『质量属性驱动 → 模式匹配排序』：本条为链中前驱（镜像登记于 STY-024）"}
    constraints_imposed:
      - {target_aspect: 6, constraint: "属性映射与求交结果构成 S4 包络校验的候选集输入；目标须落在候选风格包络内，全部候选包络均不含目标 → 升级裁决（1.4 接收表方面 6 行：软→硬），**禁止自动降目标或假装可达**（S4 失败分支）", level: hard}
      - {target_aspect: 1, constraint: "产出的四子维度组合须经 1.2.5 冲突矩阵自洽性检查（V3）并走批准路径（纪律二 → V5）；元方法不豁免任一检查", level: hard}
      - {target_aspect: 10, constraint: "机器层：映射、求交与 verdict 表入 selection_log / step_log（0.18.2 S4 输出）；人类层：投影视图必须表达所选风格（1.4 施→10 通用行，经产出风格传导）", level: hard}
    anti_patterns: []                # 母本 1.2.4 表无「典型反模式」列 → 无骨架源（块头通用说明一）；过程性误用见 narrative.common_misuse
    formal_anchor:
      - {property_id: V4, role: triggers}     # 求交得可行集 = candidate_styles → 触发 ∀ quality_goal g: g ∈ ⋃ envelope(candidate_styles)
      - {property_id: V5, role: triggers}     # 风格定案属高影响决策（纪律二）→ ∃ approved(ADR(S))
    references:
      - {bib_id: 12, support_claim: "质量属性驱动的风格选择元方法（1.2.4）——母本登记提取面与本行逐字对应（行级提取面，非子维度级推定）", compile_usage: metadata_extraction, trust_grade: "[已核验（联网核验时间 2026-09-13，Pearson 官方页面）]"}   # 母本另登记中文影印/翻译版（机械工业出版社 2023，ISBN 978-7-111-71680-8 `[已核验]`）为替代锚点
    narrative:
      benefit_cost_analysis: "收益：把风格选择从『流行度驱动』转为『目标可达性驱动』——每个质量属性映射到使其可达/受损的风格特征后求交，可行集的每个成员都有属性层面的辩护理由，且产出直接供给 S4 包络校验与 V4。代价：前提是质量属性已量化（方面 6 输入充分），量化本身是本方法最贵的一环；属性数量上升时求交易得空集（FM-4），须回退到约束排除或升级裁决；母本把适用域限定为『新系统』——棕地场景下既有结构锁定会吞掉大部分候选，此时约束排除法（STY-021）是更合适的入口。"
      typical_scenarios: "新系统（greenfield）的风格定型、质量属性目标已写成六要素场景且彼此有明确优先级的场合、需要在多个候选风格间给出可辩护取舍的项目、作为 @1391 典型链中约束排除之后的第二步（在硬约束过滤后的幸存集上做属性求交）。"
      common_misuse: "在质量属性未量化时执行（映射退化为主观偏好，产出无出处）；只做单属性最优而不求交（忽略属性间冲突，可行集偏窄）；以属性优先级排序替代 bound_expr 代入判定（跳过 S4 → 目标可达性无据）；求交得空集时自行放宽属性目标（母本明示禁止自动降目标，须走 FM-5 → CH-D 升级）；在棕地项目上以本方法为唯一入口（现状空间锁定未消费）。"

