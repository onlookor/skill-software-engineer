      aggregation_semantics: itemwise
    compatibility:                   # 骨架源：1.2.4 @1391「元方法可组合（典型：约束排除 → 质量属性驱动 → 模式匹配排序 → 演进式落地）」；只登记链内相邻对（块头通用说明四）
      - {peer_entry: STY-021, relation: composable, evidence: "1.2.4 @1391 典型链『约束排除 → 质量属性驱动』：本条为链中后继（镜像登记于 STY-021）"}
      - {peer_entry: STY-024, relation: composable, evidence: "1.2.4 @1391 典型链『质量属性驱动 → 模式匹配排序』：本条为链中前驱（镜像登记于 STY-024）"}
