      latency_budget_delta: "= Σ 各步骤卡片 latency_budget_delta + 编排者中转开销（5.2.5 明文：每个行为/协调模式条目必须携带卡片；流程延迟预算按 Σ 聚合）"
      failure_modes: ["编排者状态未持久化（崩溃即流程丢失 → Z8 违例）", "编排者成为可用性单点（可用性界收紧）", "参与者契约随编排者版本联动变更（5.4 施→3 契约登记需求的变更放大面）", "以编排承载步骤少而稳定的流程（无谓引入中央组件，MJ-4 P1）"]
      consistency_impact: "流程状态（协调者状态机）是数据集合，受 Y1–Y8 全约束，其所有者 = 编排者单元（5.4 施→4 硬）；跨单元一致性由编排者按序推进达成，不改变各单元本地一致性级别声明（CSL 批不重复承载）"
      observability_requires: ["编排者流程实例状态与步骤进度可查（orchestrator / step_class 谓词在案，5.5）", "卡片 observability_requires 不得退化（5.4 施→9 协调漂移守护对象）", "跨单元追踪链贯通（追踪覆盖率界的度量前提）"]
      ops_cost: "[随编排者实例数与流程步骤数上升；须承担编排者单点的高可用部署与状态持久化运维成本（Z8）]"
      skill_prerequisites: ["流程建模（状态机与步骤分类，5.2.2 三分类纪律）", "编排者-参与者命令契约设计（5.4 施→3）", "流程状态持久化与崩溃恢复（Z8）"]
      aggregation_semantics: additive  # 5.2.5 Σ 消费路径：步骤卡片延迟按加和聚合
    compatibility:
      - peer_entry: STY-014
