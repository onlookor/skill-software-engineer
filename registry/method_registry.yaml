    narrative:
      benefit_cost_analysis: "收益：全局原子性不可得时唯一能达成终态正确的形态（4.2.3 定义列）——以 Saga（方面 5）与预扣/预留模式把原子性从存储层移到业务层，同时是 Y6 冲突信号的正向出路（saga_candidate）。4.6 示例二给出完整形态：库存单元在本地事务内预扣、订单单元成功后确认失败后释放；牺牲＝窗口期内被预扣库存对展示层不可用，下限合法性来源＝预扣使超卖在存储层不可能（硬规则满足）且可见性损失有界（预扣超时自动释放，超时值为契约条款），Z3 与 Y6 同时闭合。代价：每个可补偿步须有补偿动作且幂等（Z3 硬），补偿语义一经流程消费即形成业务依赖（逆转成本高），失败面从『事务回滚』变为『补偿编排正确性』。"
      typical_scenarios: "跨所有者单元的长流程（4.2.3 选择条件列，见 4.6 示例二扣库存 + 建订单）；Y6 冲突信号触发后的处置路径之一；业务硬规则要求终态正确而存储层原子性不可得的场合（预扣/预留模式）。"
      common_misuse: "以补偿替代所有权定案或部署风格重审（跨单元原子性需求应先经 Y6 审查，两条出路都不走即为违例）；补偿步无幂等设计（Z3 违例，重试放大）；关键步之前留有不可补偿步骤（pivot_ordering_valid 失效）；预扣超时值留在实现里而不入契约条款（可见性损失失去有界性依据）。"

