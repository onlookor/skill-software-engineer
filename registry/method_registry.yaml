    narrative:
      benefit_cost_analysis: "收益：把暂时性失败从『交互失败』转化为『延迟增加』——5.2.2 @2473 的 retriable 类因此有执行手段，关键步之后的步骤全部可重试（Z3 的 pivot_ordering_valid）才有落地形态；可用性在暂时性失败假设成立时随尝试次数单调不减。代价按母本明文有两处硬约束：其一，前提是幂等（5.2.2 逐字），故本模式不可脱离 RLP-001／RLP-002 单独选用，否则 at-least-once 的重复被放大为重复业务效果（Z2 硬）；其二，最坏重试时长直接进入 Z4 的 Σ——5.6 示例一逐字以『SLA 要求的用户等待上界 < 捕获重试的最坏时长』为预算不闭合的成因，即重试的收益以延迟预算为对价，不是免费项。此外指数退避与抖动被母本写入模式名（@2477）而非作为可选优化：无退避即重试风暴、无抖动即多实例同步化尖峰，二者都使资源占用失去上界。母本未给任何参数与量化增量（次数、基数、上限时长均未给）→ 一律只登记界形、符号与单调性，参数须按实例经 0.4 证据门槛核定后登记（0.4＋6.2.1）。"
      typical_scenarios: "暂时性失败占主导的跨单元调用与消息投递（网络抖动、限流、下游短时过载）；含 retriable 步骤的编排式或协同式 Saga（5.2.2；CRD-005／CRD-006）；关键步（pivot）之后的全部步骤（5.2.2 @2473 逐字）；at-least-once 投递且消费侧已具备幂等面的异步交互（Z2 联动，5.6 示例七 @2710 与幂等键＋inbox/outbox 成套落地）；需要以实测最坏重试时长复核 Z4 路径预算的场合（5.5 Z4 括注『可推翻指标 = 实测传播延迟』同型）。"
      common_misuse: "对非幂等操作或关键步重试（AP1，Z2／Z3 硬违例）；无上限次数、无退避或固定间隔紧密重试（AP2，@2477 机制名缺失）；最坏重试时长不纳入上游超时预算（AP3，Z4 不闭合 → 冲突信号走 CH-C，5.6 示例一）；失败原因不可分类即一律重试（AP4，暂时性假设未经核验）；退避无抖动（AP5，重试尖峰）；把重试当作可用性不足的替代整改（真正的处置面可能是 RLP-006 断路或 RLP-007 舱壁隔离）；为重试次数与退避基数填无出处数值（0.4＋6.2.1 量化纪律）。"

