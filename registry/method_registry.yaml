        signal_level: P0               # Y1 硬性质违例的直接来源（MJ-4 P0 判据；4.5 Y1 例外须批准 + 退出计划）
      - pattern_id: OWN-004-AP2
        description: "共享写例外超期：到期未迁移且未升级裁决"
        detection_predicate: "∃ D: shared_write_exception(D, ·, deadline) ∧ ¬(now ≤ deadline) ∧ ¬escalation(D, ·)"
        signal_level: P0               # Y8 硬（超期自动升级裁决，CH-C(2)）；escalation 谓词属 6.5 登记词汇
    formal_anchor:
      - {property_id: Y1, role: consumed_by}    # 本条目是 Y1 的批准例外形态（has_approved(shared_write_exception(D))）
      - {property_id: Y8, role: implements}     # 共享写例外不超期
      - {property_id: W4, role: consumed_by}
    references: []                     # G-OWN-1 同型（书目 41 登记面不含本行）
    narrative:
      benefit_cost_analysis: "收益：遗留迁移过渡期内唯一合法的多写形态，为物理迁移换取时间（0.11 现状锁定 + 4.6 示例一：逻辑所有权先行、物理迁移推迟）；例外登记使 Y1 在过渡期仍可判定而非静默失效。代价：必须附退出计划 + 最后负责时刻（CH-B 推迟模式），到期未迁移即自动升级裁决（Y8）；一致性协调成本为四行最高；常态化共享写是分布式单体信号，不属本方法。"
      typical_scenarios: "遗留共享库迁移过渡期（4.6 示例一的过渡期交叉表）；18-B 正例中因 problem_space 谓词「遗留迁移过渡期」= 真（K-17）而保留、并作为过渡期辅助形态并行登记（LRM = CRM 迁移里程碑）的候选。"
      common_misuse: "以「过渡」名义设立无退出计划/无最后负责时刻的共享写；过渡期结束后不回收（例外常态化）；以共享写规避所有权定案（应先走 OWN-001 逻辑所有权先行）。"

