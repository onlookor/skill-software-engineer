manual_judgments:
  - id: MJ-1
    subject: STY 批编号裁决（分块序）
    judgment: "母本反例 18-A 已发布引用 STY-04（事件溯源）。按 0.22 承诺一（编号一经发布永不复用、不重排），STY 批不按母本表序连续编号，而采分块序：子维度三（1.2.3）= STY-001…006，使『事件溯源 + CQRS』= STY-004；子维度一（1.2.1）= STY-007…013；子维度二（1.2.2）= STY-014…019；子维度四（1.2.4）= STY-020…024。书写统一为三位数字，母本 STY-04 与 STY-004 为同一 entry_id 的两种书写形态，母本零改动。"
    basis: "0.22 承诺一；README §4 裁决表；用户裁决（AskUserQuestion，选项『分块序，锚定 STY-004』）"
    affected: "全部 24 条的 entry_id"
    provenance: manual

  - id: MJ-2
    subject: 方向性摘要 → 参数化界的转写规则
    judgment: "母本包络要点列只有方向（↑/↓/↑↑）与代价描述，无参数化公式。转写规则：(i) metric 取 6.2.1 封闭词汇（映射见 G-ENV-1）；(ii) bound_expr 写成含参数的不等式或等式，参数名显式（如 overhead_L、N、freshness_window），禁填无出处的具体数值（0.17.7 门槛 2：无出处的性能宣称 = 假精确，拒绝准入）；(iii) 母本一句多分句时拆为多项界（如 STY-015 三分句 → 三项）；(iv) source 指向母本行（row_id）+ 条款（clause_id），文献佐证按各条 references 登记面。"
    basis: "0.8 包络定义；0.17.7 门槛 2；6.2.1 指标封闭词汇；0.17.6(1) 骨架源限定（『包络只有 ↑/↓ 方向、无参数化公式』）"
    affected: "STY-001…STY-019 的 envelope（子维度四条目豁免，见 profiles.yaml entry_level_exemptions）"
    provenance: manual

  - id: MJ-3
    subject: 1.2.5 冲突行术语 → 条目的映射
    judgment: "1.2.5『事件溯源 × 强同步查询语义 → 张力（读模型最终一致）』的对侧『强同步查询语义』不是 1.2.1–1.2.3 表中的风格行名，而是问题空间要求。映射：在本批内以 STY-001（请求-响应/同步调用风格）为 peer 登记 tension，evidence 引 1.2.5 原行并注明映射为人工判断。1.2.5『严格分层 × 高性能内层直访』的对侧『高性能内层直访』同型处理（登记于 STY-007，peer 指向其自身松弛分层变体的处置措辞）。"
    basis: "1.2.5 四行原文（@1399-1402）；0.17.2 compatibility.peer_entry 须为条目（M9 要求 peer 存在）"
    affected: "STY-004、STY-001、STY-007"
    provenance: manual

  - id: MJ-4
    subject: 硬/软级别与 signal_level 的逐条判读规则
    judgment: "1.4 两表多行标『硬/软按条』，母本未逐条给出。判读规则：禁止性条款（『不得』『禁止』『必须』）→ hard；默认值 + 偏离须显式记录 → hard；许可性/可用性条款（『可用』『可享有』）→ soft；候选性条款（『候选一个部署单元』）→ soft。anti_patterns.signal_level 判读：P0 = 该反模式是 1.2.5 未批准例外的冲突行，或 1.5 V 系列硬性质违例的直接来源；P1 = 违反风格定义性约束但无 V 系列可绑定（限期整改，超期升 P0）；P2 = 需阈值 + 趋势窗口双判据的结构漂移线索。"
    basis: "0.14 守护分级（P0 即阻塞／P1 限期／P2 双判据）；1.4 两表『硬/软按条』标注；1.2.5；1.5 V1–V5"
    affected: "全部条目的 constraints_imposed.level 与 anti_patterns.signal_level"
    provenance: manual

  - id: MJ-5
    subject: 子维度内取值互斥的登记方式
    judgment: "同一子维度表内的风格行是同一 scope 上的互斥取值（一个 scope 在 1.2.1 表内至多取一行），母本未将其登记为 compatibility 的 hard_conflict 对。判读：取值互斥属类型系统性质，不逐对登记（否则 1.2.1 七行需 21 对、1.2.2 六行需 15 对，且无 1.2.5 依据 = 造规范）。互斥性在 S1 由 applicability 求值与 scope 唯一性保证。另：compatibility 采镜像登记闭合——对侧条目已登记本条为 peer 的行不在本条重复登记（行内注明对侧位置），M9 只要求 peer 存在，不要求双向冗余。"
    basis: "1.2.1/1.2.2/1.2.3 表的『一个 scope 取一行』语义；1.2.5 只登记跨子维度冲突对；0.17.8 M9；禁造规范（0.4/纪律一）"
    affected: "STY-010、STY-011、STY-012、STY-013、STY-014、STY-016 等的 compatibility: []"
    provenance: manual

  - id: MJ-6
    subject: 黑板风格 @1342 附注的性质与 P 级判读
    judgment: "母本 1.2.1 黑板行的附注（框架自身使用黑板 ≠ 目标系统绑定黑板，自我对应限定措辞）属叙事层说明，不是条目间关系 → 不登记为 compatibility。黑板隐式协议反模式（STY-011-AP2）的信号级：1.2.5 四冲突行均不涉黑板、1.5 V 系列无对应硬性质 → 不满足 MJ-4 的 P0 判据，定 P1。**本项含一处对前序设计稿的改判：原稿记 P0，复核后改判 P1，改判理由即上述判据缺失；按 0.14『不许运行时即兴改级』，此次改级发生在条目首次入库前（尚非注册表变更），留痕于此。**"
    basis: "1.2.1 黑板行附注；1.2.5；1.5；0.14 分级纪律"
    affected: "STY-011"
    provenance: manual

  - id: MJ-7
    subject: 『同上』类省略措辞的展开
    judgment: "母本表内『同上』『同六边形』等省略措辞按表内上一有效行展开：STY-009（同心圆/整洁架构）的适用条件『同上；强调领域模型在中心』展开为 STY-008（六边形）行的适用条件 + 本行增量；包络要点『同六边形』展开为与 STY-008 同型的界形态（参数按本行术语重写）。展开结果在行内注明指向的源行。"
    basis: "1.2.1 表 STY-009 行原文；0.4（展开不得引入源行以外的事实）"
    affected: "STY-009"
    provenance: manual

  - id: MJ-8
    subject: 1.2.2 部署风格间的关系登记边界
    judgment: "(i) 1.2.2 表内互斥不枚举（同 MJ-5）。(ii) 母本『单体 → 模块化单体』的演进关系（0.10 临时保守通道条件 (i) 的登记默认值 + 书目 23 MonolithFirst）不登记为 compatibility 的 composable/requires：演进是时间序列上的决策路径，不是同一时刻的组合关系；登记为 STY-015 的 narrative 与 STY-023 的 compatibility（元方法 ↔ 默认起点风格）已足够表达。(iii) STY-014 与 STY-015 之间登记 composable，依据是模块化单体的定义本身（单部署单元 + 内部强制模块边界），evidence 引 1.2.2 行。"
    basis: "1.2.2 表；0.10 临时保守通道；书目 23 登记提取面；0.17.2 compatibility 语义（组合同存，非时序）"
    affected: "STY-014、STY-015、STY-023"
    provenance: manual

  - id: MJ-9
    subject: 跨子维度正交性与 composable 的界线
    judgment: "母本 @1319 明示四子维度正交（外层微服务 + 内部六边形 + 服务间事件驱动 + 整体分层治理）。判读：正交性 = 组合合法性的一般前提，不构成条目级 composable 声明；否则任意跨子维度条目对都需登记（24 条 → 数百对），且母本只对具体组合给了依据（@1344 六边形/同心圆 × 微服务、1.2.3 共享数据行 × 单体）。故只登记母本有明文依据的对，其余留空并在行内注明依据（组合自洽性由 1.2.5 冲突矩阵经 V3 校验，不依赖 composable 声明的完备性）。"
    basis: "@1319 正交性原文；@1344；1.2.3 共享数据行；1.5 V3"
    affected: "STY-010、STY-011、STY-013、STY-016、STY-017、STY-019 等的 compatibility"
    provenance: manual

  - id: MJ-10
    subject: 1.2.4 元方法与 0.18.2 S 步骤的同构对应
    judgment: "母本未显式登记该映射。判读为同构对应（仅作 provenance 指针与注释论证，不改变任何字段语义）：STY-021 约束排除法 ↔ S2（约束过滤，含『软约束失败 = 降权记录不排除』与外部强加走 CH-A）；STY-020 质量属性驱动 ↔ S4（消费包络做可达性判定，V4 联动）；STY-024 模式匹配 ↔ S1（applicability 求值，unknown ≠ false）+ S5（排序与不可区分处置）；STY-023 演进式 ↔ S5 分支二（CH-B 推迟处置，附参数化切换点 + LRM + 可推翻指标）。用途：解释元方法条目为何以规程步骤为 source_pointer；不得被读作『执行元方法即等于执行规程』（0.18.3 纪律 1：不得增步、跳步、改序）。"
    basis: "1.2.4 表 + @1391 组合链；0.18.2 S0–S6；0.18.3 规程纪律；0.18.4 风格选型变体要点"
    affected: "STY-020、STY-021、STY-022、STY-023、STY-024 的 provenance.source_pointers 与 narrative"
    provenance: manual

  - id: MJ-11
    subject: 元方法条目 cost_profile 的『不适用』登记模式
    judgment: "cost_profile 七字段按剖面为必填（M2）。子维度四元方法不进入运行时路径，latency_budget_delta 与 consistency_impact 无 0.8 意义上的可声明量。判读：显式登记字符串『不适用（理由）』+ 指明该面的实际承载者（被产出/被匹配的风格条目），而非留空（留空 = M2 缺失）或填运行时数值（= 假精确，0.17.7 门槛 2）。过程性代价落其余五字段（failure_modes / observability_requires / ops_cost / skill_prerequisites / aggregation_semantics=itemwise）。"
    basis: "0.17.2 cost_profile 七字段；profiles.yaml kind_profile_STY 与 entry_level_exemptions；0.17.7 门槛 2"
    affected: "STY-020…STY-024 的 cost_profile"
    provenance: manual

  - id: MJ-12
    subject: M4 自检暴露的本地造词修正（compat_policy / schema / error_handling）
    judgment: "投影脚本规格预检（M4 词汇封闭自检）暴露三处 detection_predicate 使用了母本 x.5 谓词表未登记的谓词形态，属本地造词（README §3.1 / 编译规范 2.3 封闭集纪律明令禁止）。逐个溯源：(i) compat_policy 在母本仅为 3.5 contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state) 的实参槽名（@1996），以实参槽名充当谓词不成立；(ii) schema 在母本为契约工件名（3.2.1『schema + 语义条款』），非谓词；(iii) error_handling 母本全无登记（1.2.1 管道行仅自然语言反模式名）。处置：三处 ¬declared(X(y)) 形态统一改为方括号事实占位符（如 [ep 的契约未登记版本化/兼容策略]），语义按 M15 转勘察义务（unknown → 候选保留 + 勘察义务，禁沉默排除）；词汇缺口登记 VG-04，走 R2 提议候选。"
