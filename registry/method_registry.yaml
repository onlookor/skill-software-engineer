        evidence: {source_type: row_id, value: "4.2.2-每服务自有数据库", verified: true}
    constraints_imposed:               # 交叉表源：4.4「施加约束」表（方面 4 全体七行，与 OWN/CSL 批逐字相同）
      - {target_aspect: 2, constraint: "数据归属现状回馈分解：现状数据不可干净归属时，S4 策略受约束、拆分序列须按数据迁移可行性排序", level: soft}
      - {target_aspect: 3, constraint: "数据契约的 schema 与语义条款（单位/值域/空值/敏感性/新鲜度）由本方面供给", level: hard}
      - {target_aspect: 5, constraint: "一致性模型 → 协调模式可行集：跨所有者强一致需求 → Saga + 业务补偿，或回溯方面 1 重审部署风格（Y6 的下游消费路径）", level: hard}
      - {target_aspect: 6, constraint: "一致性级别声明与新鲜度条款 → 质量判定的代价计入项", level: soft}
      - {target_aspect: 8, constraint: "不变式 → 对账验证项；血缘 → 派生数据可重建性测试；边界校验 → 契约测试的数据面", level: soft}
      - {target_aspect: 9, constraint: "数据漂移守护对象：schema 漂移（实际 schema 偏离注册契约）、所有权违例（绕过所有者的直写流量）、共享写例外超期", level: hard}
      - {target_aspect: 10, constraint: "机器层：Y 谓词集 + 血缘图；人类层：覆盖谓词子集 {Y 谓词集、血缘} 的投影视图（受众问题 = 数据所有权与流动；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: STP-001-AP1
        description: "名义上每服务自有数据库，实际访问路径不经所有者（跨单元直访他者存储）"
        detection_predicate: "∃ D, u, C: dataset(D) ∧ owner(D, ·) ∧ access_path(D, u, ·, C) ∧ ¬[C 的提供方 = owner(D, ·)]"
        signal_level: P0               # 4.2.2 第三列判据句「访问路径是否唯一经所有者」是本拓扑的定义性判据；违例直接构成 Y2（他者经所有者契约访问，4.5 硬）的违例来源 → P0（MJ-4 判据）
      - pattern_id: STP-001-AP2
        description: "私有 schema 形态退化为多单元共写同一数据集合（无共享写例外登记）"
        detection_predicate: "∃ D, M1, M2: dataset(D) ∧ owner(D, M1) ∧ owner(D, M2) ∧ ¬(M1 = M2) ∧ ¬shared_write_exception(D, ·, ·)"
        signal_level: P0               # Y1（每数据集合单一所有者，4.5 硬）违例的直接来源；4.2.1 共享写行限定「仅限遗留迁移过渡期 + 退出计划 + 最后负责时刻」→ 无例外登记即常态化共享写 = 分布式单体信号
      - pattern_id: STP-001-AP3
        description: "以跨单元 2PC 作为默认一致性手段"
        detection_predicate: "∃ D1, D2, T: dataset(D1) ∧ dataset(D2) ∧ [T 为跨 D1/D2 的分布式事务] ∧ [D1/D2 绑定于不同存储实例] ∧ ¬[T 以 Saga + 业务补偿实现]"
        signal_level: P0               # 1.2.5 硬冲突示例第二条明文「微服务 × 跨单元 2PC 作为默认一致性手段 → 冲突」；Y6（跨所有者强一致 = 冲突信号，4.5 硬）→ P0（MJ-4：P0 = 1.2.5 未批准例外的冲突行）
    formal_anchor:                     # 交叉表源：4.5 可验证性质 / 2.5 W 系列
      - {property_id: Y1, role: implements}     # 一一绑定使「每数据集合单一所有者」有确定的物理承载（|{M : owner(D, M)}| = 1）
      - {property_id: Y2, role: implements}     # 他者经所有者契约访问：跨单元访问路径唯一化
      - {property_id: Y6, role: consumed_by}    # 跨所有者强一致需求的冲突信号在本拓扑下显形（1.2.5 硬冲突行）
      - {property_id: W4, role: consumed_by}    # 分解层数据单一所有者检查消费本拓扑（4.4 接收约束：方面 2 软）
    references: []                     # G-STP-1：4.7 书目 35–43 无 4.2.2「每服务自有数据库」行的行级登记提取面（35/39 → 4.2.3 谱系与降级纪律；36 → 补偿一致；37 → 事件日志权威状态行；38 → 多语言持久化行；40 → Y7 可重建性理论基础〔节级〕；41 → 4.2.1 数据产品；42/43 → 4.2.4 发件箱与 CDC）→ 按「表级/节级面不下探」纪律不扩张；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）
    narrative:
      benefit_cost_analysis: "收益：微服务风格的存储面默认形态，把「独立部署、独立数据」（1.2.2 微服务行定义列）落到存储实例层——变更影响面收敛到所有者单元、故障域不互相外溢、跨单元强一致需求在选型期即显形为 Y6 冲突信号而不被本地事务掩盖；判据句「访问路径是否唯一经所有者」使合规性可机器判定，且私有 schema 与私有实例两形态并存，允许按运维能力渐进。代价：存储实例数随部署单元数同阶增长，备份/升级/容量/连接治理的运维面显著扩大；跨单元访问引入网络跳，延迟下界劣于单元内直访且母本未给量化增量（0.4 → 只登记界形）；跨单元业务不变式不能再靠本地事务保证，须转补偿一致 + 对账验证（4.4 施→8）；棕地场景下物理绑定是高成本决策，4.6 示例一因此要求「逻辑所有权先行、物理拆分推迟 + 显式切换点」。"
      typical_scenarios: "微服务风格定案后的存储选型（1.4 施→4 微服务行；4.2.2 第三列）；棕地「逻辑所有权先行 + 物理迁移推迟」的过渡形态（4.6 示例一）；私有 schema 形态作为拆分缝保留期的低成本落点（同示例一）；跨单元查询聚合需求出现时以派生读模型替代共享库（4.2.4 物化视图行）；分布式单体排查须确认数据是否已按单元独立的场合（X1；1.2.2 微服务行反模式）。"
      common_misuse: "以「私有 schema」为名保留多单元共写（AP2，Y1 硬违例）；跨单元直访他者存储而不经所有者契约（AP1，Y2 硬违例）；以跨单元 2PC 保「一致性」（AP3，1.2.5 硬冲突行）；把「默认」读作无需显式记录偏离（1.4 施→4 要求偏离显式记录）；把一一绑定等同于逻辑所有权已登记（4.6 示例一的逆序）；以物理拆分不可行为由跳过后馈方面 2 的分解重审（4.4 施→2）；为本拓扑的跨单元延迟增量填无出处数值（0.4＋6.2.1 量化纪律）。"

