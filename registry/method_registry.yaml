      latency_budget_delta: "无直接项——分解策略的延迟影响经由部署/通信风格间接产生，跨单元调用延迟项属 STY 包络（0.8），本条目不重复计入（kind_profile_DEC.optional 理由）"
      failure_modes: ["以技术分层为唯一主策略而领域复杂度高（AP1，纵切变更放大）", "层间边界未即契约边界（AP2 → X1 违例，2.4 接收约束方面 3 行硬）", "层次切分使多层读写同一数据集合（W4 违例：所有者单元须唯一）", "风格为微服务时层次单元与部署单元错位（2.4 接收约束方面 1 行：微服务 → S7 强制）"]
      consistency_impact: "层次不是数据所有权边界（2.4 施→4 硬）：同一数据集合的所有者单元须唯一（W4），纯分层切分若使多层读写同一数据集合即须以 S4 复核归属，一致性级别声明仍由方面 4 承载"
      observability_requires: ["层次归属可查（boundary_type 谓词实参取 layer，2.5）", "层间依赖方向可查（depends_on 的 kind=call；dependency_rule / layer_of 谓词为方面 1 消费项）", "层间契约在契约注册表可查（X1）"]
      ops_cost: "[风格为单体时 S7 退化、分解可纯逻辑（2.4 接收约束方面 1 行）→ 层次单元通常合并于同一部署单元，运维单元数增量低于按部署边界切分的策略]"
      skill_prerequisites: ["层间依赖规则与依赖方向控制（2.5 谓词 dependency_rule / layer_of，方面 1 子维度消费）", "层间契约显式建模（2.4 施→3 硬：分解边界 = 契约边界）", "关注点分离判据应用（2.2.2）", "粒度停止准则应用（2.2.3）"]   # 本字段为正例 20-1（0.20.5）明文消费字段「DEC-02.cost_profile.skill_prerequisites」（母本两位书写 = 注册表三位书写，MJ-14）；该正例中 DEC-05 被有出处地排除后选定 DEC-02，本字段须在案可消费（MJ-16 (i)）
      aggregation_semantics: itemwise  # 母本未给 DEC 的跨单元聚合式（MJ-19 (iii) 同型）→ 按单元逐项评估（MJ-20 (vi)）
    compatibility:
      - peer_entry: DEC-001
        relation: tension
        evidence: {source_type: clause_id, value: "2.2.2", verified: true}   # 语义边界判据：分解跟随领域语义而非纯技术分层；镜像登记于 DEC-001
    constraints_imposed:               # 交叉表源：2.4「施加约束」表（方面 2 全体七行，DEC 八条逐字相同）
      - {target_aspect: 1, constraint: "分解边界候选 → 部署单元风格可行集（对偶回馈：语义边界不清晰时分布式风格降权）", level: soft}
      - {target_aspect: 3, constraint: "分解边界 = 契约边界；按业务领域分解时，限界上下文间契约必须显式建模（上下文映射）", level: hard}
      - {target_aspect: 4, constraint: "分解边界 = 数据所有权边界（每个数据集合有且仅有一个所有者单元，即 W4）", level: hard}
      - {target_aspect: 5, constraint: "单元内编排自由；跨单元协调必须显式建模（禁止隐式跨单元时序假设）", level: hard}
      - {target_aspect: 6, constraint: "分解粒度 → 一致性/性能/可修改性包络（跨单元事务代价项随跨边界交互数增长）", level: soft}
      - {target_aspect: 8, constraint: "每个分解单元必须是一个可独立验证的单元；否则粒度停止准则违反 → 发回溯约束声明（CH-E）", level: hard}
      - {target_aspect: 10, constraint: "机器层：2.5 边界谓词集；人类层：覆盖谓词子集 {2.5 边界谓词集} 的投影视图（记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: DEC-002-AP1
        description: "领域复杂度高时以技术分层为唯一主策略（纵切变更放大）"
        detection_predicate: "∃ M: unit(M) ∧ boundary_type(M, layer) ∧ [领域复杂度与概念丰富度高] ∧ ¬[存在跨层内聚的领域语义单元]"
        signal_level: P1               # 违反 2.2.2 语义边界判据与 2.3 问题空间驱动第一行（复杂度高 → S1/S3 主导），但无硬性质可绑定 → P1（MJ-4 判据）
      - pattern_id: DEC-002-AP2
        description: "层间边界未即契约边界（切割既有契约）"
        detection_predicate: "∃ M1, M2: unit(M1) ∧ unit(M2) ∧ boundary_type(M1, layer) ∧ depends_on(M1, M2, call, ·) ∧ ¬registered([M1 与 M2 间的契约])"
        signal_level: P0               # 2.4 接收约束方面 3 行为硬 ＋ X1 为硬性质（1.5）→ 违例的直接来源，检出即阻塞（MJ-4 P0 判据）
    formal_anchor:
      - {property_id: W1, role: consumed_by}     # ∀M: seam(M)——量化域覆盖任一策略产出的单元（2.5）
      - {property_id: W2, role: consumed_by}     # 2.4 施→8：每个分解单元必须是一个可独立验证的单元
      - {property_id: W3, role: consumed_by}     # 2.3 交付空间驱动：S6 过滤器横切适用（条件硬）
      - {property_id: W7, role: consumed_by}     # 2.3 双使用者条款：主策略选择走批准路径
      - {property_id: X1, role: consumed_by}     # 2.4 接收约束方面 3 行「限界上下文/层间边界即契约边界」明文点名层次边界
    references: []                     # 母本 5.7 书目无 2.2.1 S2 行的行级登记提取面；书目 6（Martin《Clean Architecture》）的登记面为「1.2.1 依赖方向控制；第 12–14 章组件化对 Parnas 判据的现代重述」，属节级/表级面 → 按 G-CRD-1 同型纪律「表级面不下探」不扩张至本行；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）→ 登记 G-DEC-1，待人工裁决补勘后回填（SO-8）
    narrative:
      benefit_cost_analysis: "收益：关注点分离直接落地为单元边界（2.2.1 主导驱动空间列），层间依赖规则可由 dependency_rule / layer_of 谓词机器判定（2.5），守护成本低；风格为单体时 S7 退化、分解可纯逻辑（2.4 接收约束方面 1 行），无需额外部署单元即可获益，引入成本为八策略中最低之一。代价：单个业务变更纵切多层，触达单元数下界 ≥ 2，典型变更的实现成本与前置时间均单调高于语义边界形态（2.2.2 对比结论）；层间契约数随层数平方级增长，X1 登记负担重；层次不是数据所有权边界，纯分层与 W4 的冲突须以 S4 复核（2.4 施→4 硬）；领域复杂度高时不得为唯一主策略（AP1）。"
      typical_scenarios: "技术关注点主导而领域复杂度不高的系统（AP1 的反面）；既有分层架构在案的棕地对齐（0.11 现状锁定）；既有层间契约已登记且不得切割的场合（2.4 接收约束方面 3 行）；风格为单体、不追求按部署边界切分的逻辑分解（2.4 接收约束方面 1 行）；正例 20-1 中 DEC-05 被有出处地排除后的选定策略。"
      common_misuse: "领域复杂度高时以技术分层为唯一主策略（AP1）；层间边界未即契约边界或切割既有契约（AP2，X1 违例）；以层次单元替代数据所有权定案（W4 违例，2.4 施→4）；风格为微服务时仍只做逻辑分层而不映射部署单元（2.4 接收约束方面 1 行：微服务 → S7 强制）；把层次当作可独立验证单元的替代论证（W2 仍逐单元适用，2.4 施→8）。"

