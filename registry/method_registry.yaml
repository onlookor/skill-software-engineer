      - {property_id: X7, role: consumed_by}     # 事件契约命名语义 × 消费者数交叉一致（3.2.1 判别规则的命令侧：祈使语义 → 一对一消费者）
      - {property_id: X2, role: consumed_by}     # 发布态须 has(version) ∧ has(compat_policy)
      - {property_id: Z1, role: consumed_by}     # 3.4 施→5 明文「协调模式中的每条跨单元交互必须有注册契约（Z1 的契约来源）」
    references: []                     # 母本 3.7 书目 28–34 无 3.2.1「异步消息契约」行的行级登记提取面（31 CloudEvents 的行级面为『3.2.1 事件信封元数据规范』→ 事件契约侧，不下探至命令侧）→ 按 G-CRD-1／G-DEC-1 同型纪律「表级/节级面不下探」不扩张；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）→ 登记 G-CTR-1，待人工裁决补勘后回填（SO-9）
    narrative:
      benefit_cost_analysis: "收益：调用方不等待结果 → 削峰与解耦，单跳延迟预算由往返改为投递/驻留/消费三段；机器层天然性为『高』（3.2.1），schema 直接投影为白板谓词（3.4 施→10 硬）；命令类交互一对一消费者使 schema 变更触达面上界为 1（3.2.1 判别规则），演化成本低于事件契约。代价：引入 broker 驻留延迟项与其运维面（3.2.2 发现与注册：schema registry 事件/消息）；不承诺即时结果 → 需即时结果的交互不得以本形态承载；消息元数据四项（消息 ID、时间戳、关联 ID、投递语义声明）任一缺失即使幂等与因果追踪无从判定；命令/事件判别错误属登记违例，须靠 X7 的命名模式 × 消费者数交叉验证捕获（3.2.1 判别规则），意味着守护面必须常驻而非一次性检查。"
      typical_scenarios: "异步消息风格下的命令类交互（3.2.1 适用条件列）；命名含祈使语义、消费者为一对一的场合（同节判别规则：CreateOrder 型）；事件驱动风格下『异步消息/事件契约必选其一』取命令侧的场合（3.4 接收约束方面 1 行）；协调模式（编排者 → 参与者）产生的命令契约登记场合（3.4 接收约束方面 5 行；CRD 批承载协调形态）。"
      common_misuse: "命令类交互以事件契约承载（AP1，『PleaseDoX 事件』反模式 → X7 漂移信号）；消息元数据约定缺项（AP2，投递语义未声明即假定恰好一次）；以异步消息承载需即时结果的交互（3.2.1 适用条件列的反面）；协调模式产生的命令契约不登记（X1/Z1 违例）；把一对多消费者的事实陈述登记为命令（判别规则的反向违例，归属 CTR-004）。"

  - entry_id: CTR-004
