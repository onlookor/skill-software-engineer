      skill_prerequisites: ["团队拓扑建模与认知负荷评估（书目 9 行级登记面『S6 团队认知负荷』）", "0.4 证据门槛判定与 CH-B1 保守界处置（2.2.3 准则二）", "联合可行性校验与阻塞声明（2.6 示例三；CH-A5 同型 → CH-D）", "Conway 事实勘察（2.6 示例一；书目 17 为 narrative_only，事实须另有出处）"]
      aggregation_semantics: itemwise  # 母本未给 DEC 的跨单元聚合式（MJ-19 (iii) 同型）→ 认知负荷按单元/团队逐项评估（MJ-20 (vi)）
    compatibility:
      - peer_entry: DEC-001
        relation: tension
        evidence: {source_type: clause_id, value: "2.6", verified: true}   # 示例一：Conway 事实与领域边界的组合冲突（2.2.1 表前注「组合冲突的处置见 2.6 示例一」）；镜像登记于 DEC-001
    constraints_imposed:               # 交叉表源：2.4「施加约束」表（方面 2 全体七行，DEC 八条逐字相同）
      - {target_aspect: 1, constraint: "分解边界候选 → 部署单元风格可行集（对偶回馈：语义边界不清晰时分布式风格降权）", level: soft}
      - {target_aspect: 3, constraint: "分解边界 = 契约边界；按业务领域分解时，限界上下文间契约必须显式建模（上下文映射）", level: hard}
      - {target_aspect: 4, constraint: "分解边界 = 数据所有权边界（每个数据集合有且仅有一个所有者单元，即 W4）", level: hard}
      - {target_aspect: 5, constraint: "单元内编排自由；跨单元协调必须显式建模（禁止隐式跨单元时序假设）", level: hard}
      - {target_aspect: 6, constraint: "分解粒度 → 一致性/性能/可修改性包络（跨单元事务代价项随跨边界交互数增长）", level: soft}
      - {target_aspect: 8, constraint: "每个分解单元必须是一个可独立验证的单元；否则粒度停止准则违反 → 发回溯约束声明（CH-E）", level: hard}
      - {target_aspect: 10, constraint: "机器层：2.5 边界谓词集；人类层：覆盖谓词子集 {2.5 边界谓词集} 的投影视图（记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: DEC-006-AP1
        description: "容量证据充分时单元规模超出承载团队认知负荷（W3 硬化分支违例）"
        detection_predicate: "∃ M: unit(M) ∧ [capacity_evidence_sufficient(team(M))] ∧ cognitive_load(M) > capacity(team(M))"
        signal_level: P1               # W3 为条件硬——级别由 0.4 证据门槛判定而非注册表预设：证据充分时本项即 W3 硬性质违例（应升 P0；改级属守护规则改级，须走完整 ADR + 批准，MJ-19 (i) 同型）；证据缺失/有争议/不可量化时 W3 自动降软且不阻塞（2.2.3 准则二 CH-B1）→ 本批登记 P1（MJ-4 判据）
      - pattern_id: DEC-006-AP2
        description: "单元数与团队容量联合不可行仍推进（未在方面 8 可行性校验发阻塞声明）"
        detection_predicate: "∃ M: unit(M) ∧ cognitive_load(M) ≤ capacity(team(M)) ∧ [单元数 × 运维负荷模型超出团队容量] ∧ ¬declared([方面 8 可行性校验的阻塞声明])"
        signal_level: P1               # 2.6 示例三的阻塞效果由 CH-D 通道（0.6）承载而非信号级；框架不自动回溯修改任一方决策（0.10）→ 违例面是『未发声明』，无硬性质可绑定 → P1（MJ-4）。本项同时履行 kind 级消费字段「DEC.detection_predicate（单元数/认知负荷上限）」（2.6 示例三）
    formal_anchor:
      - {property_id: W3, role: implements}      # 2.2.1 S6 定义列「每单元规模不超过承载团队的认知负荷」＝2.5 W3 公式 cognitive_load(M) ≤ capacity(team(M)) 的直接操作化；2.3 交付空间驱动第一行使其成为所有策略的过滤器 → role 取 implements（MJ-20 (ii)）
      - {property_id: W1, role: consumed_by}     # ∀M: seam(M)（2.5）
      - {property_id: W2, role: consumed_by}     # 2.4 施→8：每个分解单元必须是一个可独立验证的单元
      - {property_id: W7, role: consumed_by}     # 2.3 双使用者条款：主策略选择走批准路径；保守假设 ADR 另记（2.2.3 准则二）
    references:
      - {bib_id: 9, support_claim: "S6 团队认知负荷；1.3 交付空间硬过滤器（母本 5.7 书目 9 行级登记提取面逐字对应，本条为该行级面的直接承载者）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}   # 本地资源 resources/se 第 2 版 PDF+EPUB（2026-09-15 内容核验）；第 1 版（2019，ISBN 978-1-942788-81-2）依 AGENTS.MD 更新版本规则由第 2 版取代
      - {bib_id: 17, support_claim: "Conway 定律；1.3 交付空间过滤器与 2.6 示例一（母本 5.7 书目 17 登记面逐字对应）——narrative_only：只作叙事佐证，不得充当 applicability/envelope/detection_predicate 的决策性出处（0.17.7 门槛 6）", compile_usage: narrative_only, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：唯一以交付空间为主导驱动的策略（2.2.1 主导驱动空间列），且是所有策略的过滤器（2.3 交付空间驱动第一行）——任何策略产出的单元规模都须过本条；直接操作化 W3（2.5），且有完整的硬化/降软判定与不阻塞出路（2.2.3 准则二 CH-B1）；书目 9 提供行级登记提取面（S6 团队认知负荷；1.3 交付空间硬过滤器），出处链最短。代价：主输入（团队容量数据）须过 0.4 门槛，且母本明文双向防护『防假精确绕过』——编造的精确容量数字不构成硬化依据，使 W3 在多数场景停在软级别；单元边界绑定团队边界后组织变动即架构变动（Conway 面，书目 17 为 narrative_only，事实须另有出处）；与 S1 存在明文组合冲突（2.6 示例一）；单元数与团队容量联合不可行时的三个出路（增团队/合并上下文/豁免物理隔离）均为高成本选项，须人类责任方裁决（2.6 示例三），框架不自动回溯修改任一方决策（0.10）；单人/小团队场景本策略退化为不约束（2.3 交付空间驱动第二行）。"
      typical_scenarios: "多团队并行交付、团队边界稳定且容量数据可核验的场合（2.3 交付空间驱动第一行；W3 硬化分支）；作为其他策略（S1/S3/S4/S5/S7/S8）产出单元规模的过滤器（横切适用）；团队容量数据缺失、有争议或不可量化时的保守界处置（2.2.3 准则二 CH-B1：保守默认值 + 保守假设 ADR + 可推翻指标，不阻塞）；分解与风格联合可行性校验（2.6 示例三：团队容量 × 单元数 × 运维负荷模型）。"
      common_misuse: "容量证据不足仍按硬约束使用 W3（AP1；应自动降软走 CH-B1）；以编造的精确容量数字充当硬化依据（2.2.3 双向防护明文禁止）；把 S6 当作可选策略之一而非所有策略的过滤器（2.3 交付空间驱动第一行）；单人/小团队场景仍强制使用（2.3 第二行；0.10 权力条款第二条）；单元数与团队容量联合不可行仍推进而不发阻塞声明（AP2；2.6 示例三 → CH-A5 同型 → CH-D）；以 Conway 事实替代领域语义判据而不经组合冲突处置（2.6 示例一；书目 17 narrative_only 不得充决策性出处）。"

