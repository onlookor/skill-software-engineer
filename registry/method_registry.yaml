        bound_expr: "lead_time(核心变更) ≤ verify(core) + regression(adapters)，且 verify(core) 可脱离适配器执行（可测试性↑↑ 的量化落点：核心单测不需要外部设施就绪）"   # 骨架源：「可测试性↑↑（核心可脱离适配器单测）」；属性族映射说明见 gaps: G-ENV-1
        source: {source_type: row_id, value: "1.2.1-六边形（端口-适配器）", verified: true}
    cost_profile:
      latency_budget_delta: "+ 每个端口一次间接跳（接口分派/适配转换）；参数：端口数与适配器实现形态"
      failure_modes: ["端口退化为框架接口的转发（抽象未承担翻译职责）", "适配器类型/异常语义泄漏进核心", "间接层数量膨胀导致调用路径难以追踪"]   # 前两项骨架源 1.2.1 反模式列；第三项人工判断（间接层的直接后果）
      consistency_impact: "无直接影响：一致性级别由方面 4 决定；端口边界不改变事务语义"   # 人工判断
      observability_requires: ["端口↔适配器映射可查", "核心边界上的调用可观测（区分核心内与适配器内失败）"]
      ops_cost: "[无独立运维面；成本落在端口契约维护与适配器测试替身建设]"
      skill_prerequisites: ["端口契约设计（抽象粒度与语义边界）", "测试替身与核心脱离适配器的验证能力"]
      aggregation_semantics: itemwise
    compatibility:                     # 骨架源 @1344：「依赖方向控制族（六边形/整洁/洋葱）与任何顶层风格可叠加」——逐一登记已入库的顶层风格对，「任何」的完备化随后续批次推进
      - peer_entry: STY-016
        relation: composable
        evidence: {source_type: clause_id, value: "1.2.1", verified: true}   # 「微服务内部可以是六边形」
      - peer_entry: STY-014
        relation: composable
        evidence: {source_type: clause_id, value: "1.2.1", verified: true}   # 「单体内每一层内部也可以是六边形」（单体形态）
      - peer_entry: STY-015
        relation: composable
        evidence: {source_type: clause_id, value: "1.2.1", verified: true}   # 同上（模块化单体形态：模块边界与端口边界可对齐）
      - peer_entry: STY-007
        relation: composable
        evidence: {source_type: clause_id, value: "1.2.1", verified: true}   # 「单体内每一层内部也可以是六边形」（分层形态）
    constraints_imposed:
      - {target_aspect: 2, constraint: "风格收窄分解策略可行集：核心与外部的边界即分解单元边界候选，端口为 hides 的登记面", level: hard}   # 交叉表源 1.4 施→2 的本风格实例化（措辞人工判断）
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）", level: hard}
      - {target_aspect: 8, constraint: "验证策略适配：核心须存在可脱离适配器执行的测试路径（seam 即端口，0.15 可测试性冻结项的落点）", level: soft}   # 交叉表源 1.4 施→8（软）＋0.15 seam 定义
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集；人类层：投影视图必须表达所选风格（核心/端口/适配器三区须可辨）", level: hard}
    anti_patterns:
      - pattern_id: STY-008-AP1
        description: "端口退化为框架接口的转发（端口未承担翻译职责，核心经端口直接暴露框架语义）"
        detection_predicate: "∃ p, a: [p 为已声明端口] ∧ [a 为 p 的适配器实现] ∧ [a 的实现仅转发至框架接口且不含语义翻译] ∧ [p 的签名同构于框架接口签名]"
        signal_level: P1               # 结构漂移：使「外部技术替换 → touched_units(core)=0」的上界失效，须限期整改（0.14 P1）
      - pattern_id: STY-008-AP2
        description: "适配器泄漏进核心（核心依赖外部技术类型/异常/设施）"
        detection_predicate: "∃ core, ext: [core 属业务核心] ∧ [ext 为外部技术设施] ∧ depends_on(core, ext, call, ·)"
        signal_level: P1               # 人工判断：违反本风格定义性约束「核心不依赖任何外部技术」，但 1.5 未登记端口方向谓词（VG-03）→ 无 V1 可绑定，定 P1；词汇补齐后按 V1 同型升 P0
    formal_anchor:
      - {property_id: V1, role: implements}     # 依赖方向控制族的违例面（词汇缺口 VG-03 补齐前以 depends_on 人工核验）
      - {property_id: V4, role: consumed_by}
      - {property_id: V5, role: implements}
    references:
      - {bib_id: 20, support_claim: "端口-适配器（六边形）风格的源头定义与端口/适配器职责划分（母本登记：1.2.1 端口-适配器源头；本地提取以 2025 专著为准，2005 文章仅作历史出处标注）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：核心可脱离适配器单测（可测试性↑↑）、外部技术可替换（可替换性↑），替换的触达单元数被端口边界收敛；代价：间接层成本（每个端口一次分派与一层契约维护），且端口若退化为框架接口转发，收益即归零。母本将本风格与整洁/洋葱并列为『依赖方向控制族』，并明示该族与任何顶层风格可叠加。"
      typical_scenarios: "外部技术栈易变或多样（存储/消息/第三方 API 可替换）、核心业务规则值得长期保护、需要以测试替身驱动核心验证的场景。"
      common_misuse: "把端口当作框架接口的别名（无语义翻译）；在核心中直接引用适配器类型或其异常；为小型/短生命周期系统引入全量端口-适配器间接层（间接层成本无对应收益）。"

