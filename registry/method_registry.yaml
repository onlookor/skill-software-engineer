    subject: RLP 批十四项判读——非表格清单源不含 row_id、书目 46『等』的概括覆盖与书目 51 目录面的边界、@2477 七项与 @2719 六项／@2730 五项的枚举差异、DFL-001↔RLP-003 的定义面／行为面分工兑现、formal_anchor 20 实例与 Waiver scope、M4 四词六行改写、M9 镜像补登与关系不对称第三例、RLP-005 的上界分配形态、aggregation additive×2、方面 8 conditional 首次成批使用（表源 5.4 非 4.4）、累计 31 词去重口径、书目 46 的 ISBN 与页数两说、32 条 signal_level 定级、本批四处自我纠错的实测教训
    judgment: "(i) **源为非表格陈述 → provenance 一律不含 row_id**：5.2.3（heading @2475）的注册表条目清单在 @2477 以『注册表条目（每条带质量影响卡片）：』引导、分号分隔七项，无 4.2.2／4.2.4／3.2.1 类的表格行列结构 → 七条 provenance 只有 clause_id 与 bib_id 两型（source_pointers 共 77 处＝clause_id 63＋bib_id 14，逐条 12/11/10/11/11/11/11），不虚构 row_id（0.4 禁假精确；MJ-21 (ii) 同型：row_id 型只在表源批次出现）；分块序即清单序（幂等／收件箱（inbox）／发件箱（outbox）／重试 + 指数退避 + 抖动／超时预算／断路器／舱壁 → RLP-001…RLP-007），name 取各项引导词逐字、去粗体标记（MJ-13 (iv)／MJ-20 (i)／MJ-21 (iii) 同型：RLP-004 原形即含两个加号、RLP-002／003 原形含全角括号与拉丁名 → 一律原形登记，不改写为顿号或斜杠）。是否在母本侧改为表格形态以提供 row_id 维度属母本改动（R2／ADR 面）→ 登记 G-RLP-1.route ①，本批不预判。(ii) **书目 46 的『等』概括覆盖重试项；书目 51 目录面不充当母本依据**：5.7 书目 46（@2752）登记面逐字为『→ 5.2.3 断路器、舱壁、超时预算等稳定性模式』，其『等』为概括词 → RLP-004（重试）以书目 46 为工程参照属登记面覆盖内（书目 51 的登记面逐字即把『Retry/Circuit Breaker/Bulkhead 的机制内容』指向书目 46《Release It!》第 2 版为提取锚点），不属下探；而 RLP-001／002（幂等／收件箱）不在该『等』的可确认范围内 → 二者只引书目 44（@2750『→ 5.2.1/5.2.3 消息与协调模式词汇表（跨方面 3/5 的共享源头）』→ 作幂等消费与去重的原始分类面）＋书目 51。书目 51（Azure Cloud design patterns 目录面，2026-10-04 在线复核在位）→ **只作工程参照**，其目录内 Idempotent Consumer 条目与「Combine patterns」段不充当 compatibility／envelope／references 的行级母本依据（本批所有 compatibility 行的 evidence 一律取 clause_id）；该边界可否进一步收紧列 G-RLP-1.route ⑤。compile_usage 一律 metadata_extraction、信任级一律逐字承 5.7 登记面，注册表侧不得改写或降级。(iii) **@2477 七项 vs @2719 六项 vs @2730 五项的枚举差异 → 以 @2477 为准、不本地合并**：5.6 示例七的形式化注释在 @2719 列六项『5.2.3 可靠性模式（幂等/inbox/outbox/超时预算/断路器/舱壁）』（重试未列）、在 @2730 列五项『可靠性模式={幂等+inbox/outbox(Z2), Z4 逐级分配, 断路器, 舱壁}』（幂等与 inbox/outbox 并为两项、重试仍未列），而 @2477 为七项 → 三处枚举不同系母本自身在不同叙述层的简写形态，非注册表可裁决的差异；本批一律以 @2477 的七项为条目面（编号与 name 的权威源），@2719／@2730 只作 formal_anchor 与 compatibility 的佐证面，不据其增减条目（编号永不复用／重排，0.22 承诺一）；差异本身登记 G-RLP-1.route ③ 留人工裁决。示例七的两处逐字引用（『超时预算按 Z4 逐级分配（下游超时 < 上游超时 − 实测传播开销）』『断路器＋舱壁限制故障扩散』）经 python 复核确在 @2710；@2732 另载『Z4 实测传播开销→P99≤800ms 闭合（合同界 1s, 过 0.4）』系该示例的现状测量值 → 按 MJ-23 (viii) 同型边界，不写入任何条目的 bound_expr 或 latency_budget_delta。(iv) **DFL-001 ↔ RLP-003 的定义面／行为面分工在本批兑现**：主指令裁定『定义面归 DFL、行为面归 RLP』→ DFL-001 承载 4.2.4 的机制定义与『性能：资源占用』族界形（发件箱表深度与中继堆积占用），RLP-003 只承载 @2477『生产侧，4.2.4 已定义，行为面消费其投递语义』与 @2479 的投递语义登记纪律面；数据面表现为 **RLP-003 → DFL-001 单向 requires**（DFL-001 属已发布条目 → 不回填镜像，MJ-5／MJ-17 (iii)／MJ-23 (vii) 同型），且 **RLP-003 的 envelope 只 3 族**（27 项逐条 4/4/3/4/4/4/4 中的那个 3）→ 避免同一界形在两侧双重计数（M3 与 0.4 同向）。该三族剖面是否需在 kind_profile_DFL／kind_profile_RLP 侧补明文，列 G-RLP-1.route ⑥。(v) **formal_anchor 20 实例与 WV-RLP-E3-01 的 scope 口径**：七条共 20 实例（逐条 3/3/3/3/3/2/3），引用 Z1／Z2／Z3／Z4／Z5／X1／Y1／Z7 八项性质。scope 只及**硬性质面 5 项 8 实例**（Z2 implements 3、X1 consumed_by 2、Z1／Z3／Y1 consumed_by 各 1）＋**Z4 条件硬 4 实例**（RLP-005 implements 1＋RLP-004／006／007 consumed_by 3；承 WV-CRD-E3-01 把条件硬纳入 scope 的先例，MJ-21 (iv) 同型口径），**明列排除** Z5 软 1 实例（RLP-005 consumed_by）与 Z7 升级型 7 实例（七条各一——Z7 系升级型而非硬性质，其级别面与 W3／X3 同归 s5h 证据门槛裁决口）。E3 守护规则条目尚未建立（既有裁决口）→ 该 Waiver 与前八项同型逐批单独申请，不沿用、不自动生效（WV-STY-E3-01 防扩宽条款 (ii)）；批准状态 pending 不阻断本迁移（C-ST 只查硬检查，seed 资格不以 Waiver 为前提）。(vi) **M4 四词六行改写：不本地扩词汇表**：初稿在 detection_predicate 与 applicability 三空间使用 idempotency_declared／sla_bound／propagation／expiry 四词，predicate_vocabulary.yaml（136 行、已登记 76 名＝predicates 59＋formula_words 7＋clause_defined_predicates 10）均未登记 → check_m4（project.py @726-751）判 hard 失败（逐字『未登记谓词（本地造词，禁）：… → 走 R2 提议并登记 vocabulary_gaps』）。扩词属 R2 提案权限，Agent 与工具不自行扩表（0.10 第一条／1.1 纪律二同型）→ 六行改写为已登记词＋半角方括号事实占位，落点经 python 逐行实测复核为 **@5617**（idempotency_declared(consumer) → idempotency(consumer, ·) ∧ declared(·)，DFL 批同型先例＋MJ-12）、**@5984／@6029／@6090**（sla_bound(path) → [SLA 上界](path)）、**@6086**（propagation → [传播开销]）、**@6204**（expiry(G) → [到期时刻](G)）；改后 RLP 七条 M4 全过（扫描处数逐条 10/9/9/12/13/12/12、合计 77），词汇量 76 未变，entries 77。方括号内文先被 outside_brackets（@208）剥除、PRED_CALL_RE（@221）只在剥除后的串上取候选 → 母本 5.5 Z4 的逐字公式形态得以在行内注中原样保留。**据实记载两处判读边界**：（a）四词中 sla_bound 与 propagation 系 5.5 Z4 公式（@2583-2585）的逐字词却未入 clause_defined_predicates → 其性质与 MJ-19 (i)／MJ-20 (iii)／MJ-21 (v) 的公式内词同型（R2 可提议候选），是否长期以方括号占位表达归 s5g；（b）@6094（detection_predicate 的 propagation／sla_bound）与 @6146（applicability.delivery_space 的 expiry）两处虽落在 M4 扫描面之内，但整体包在半角方括号中、剥除后不产生候选，且系初稿即为该形态而非本批改写落点 → 不改写。(vii) **M9 镜像补登两处与关系不对称累计第三例**：数据复算发现 RLP-007 侧行内注声称与 RLP-004／RLP-005 同批双向登记而该两侧原未回登 → 各补 1 行（compatibility 30 → 32，补登行 evidence 一律 clause_id 5.2.3），复算同批镜像十对全部双侧登记、缺镜像 0；教训固化＝行内注的主张须以数据面复算核验，不可轻信（MJ-22 (vii) 实测优先同型）。**ENUM_RELATION 无 required_by 造成的不对称累计第三例**：本批 RLP-001 → RLP-004 为 composable 而 RLP-004 → RLP-001 为 requires（同批两侧同现，语义为『重试须以幂等为前提』而『幂等不须重试』）→ 前两例为 STP 批两条 requires 与 DEC-007→STY-016；是否补 required_by 值归 s5h，本批不自行扩枚举。补登注释初稿曾误引母本为『舱壁（池/信号量隔离 + 饱和拒绝）』，Read @2477 核对后确认逐字为『舱壁（线程/连接池按消费者隔离，防单点拖垮全局）』→ 两处已修正为母本逐字（纪律固化：任何『母本逐字』引用必须先 Read 母本再落笔）。(viii) **RLP-005 的 latency_budget_delta 取上界分配形态**：kind_profile_RLP 未作 kind_profile_STP 同型的『不降级为选填』明文要求 → 七条据实按 @2477 各项的明文界形填写（界形＋符号＋单调性，不填无出处数字，0.4；理由不平移 STP 措辞，MJ-23 (iii) 同型纪律：剖面未声明者不得以他 kind 的剖面措辞充当依据）。RLP-005 特殊——超时值本身构成路径延迟的**上界分配**而非附加开销（超时机制自身的判定开销可忽略）→ 其 Δlatency 以预算约束形态 Σ timeout_budget(path) ≤ [SLA 上界](path)（5.5 Z4 @2583-2585）表达，而非纯增量形态；源＝@2477 逐字『路径级联超时的预算分配：下游超时 < 上游超时 − 传播开销，全链预算 ≤ SLA 上界』。(ix) **aggregation_semantics 出现 additive×2（本库首次）**：itemwise ×5（RLP-001／002／003／006／007——各为独立可并存的机制，母本未给跨机制聚合式 → 不本地造法，MJ-19 (iii)／MJ-21 (ix) 同型）；**additive ×2**（RLP-004／005）依据为母本明文给出的求和语义——RLP-004 的成本随尝试次数累加（Σ 各次尝试耗时＋Σ 退避等待，@2477『重试 + 指数退避 + 抖动』的机制事实）、RLP-005 的预算沿路径逐级累加（Σ timeout_budget(path)，5.5 Z4 逐字公式＋5.6 示例一 @2598 把重试最坏时长与 SLA 上界直接比较）→ 取 ENUM_AGG 的 additive 而非 itemwise，非本地造法；grouped_max／weighted_avg 二值在本 kind 仍无母本消费路径。(x) **方面 8 的 conditional 首次在本库成批使用，且表源为 5.4 而非 4.4**：constraints_imposed 七条逐字相同七行、共 49 项、级别分布 hard 42／conditional 7；表源系 **5.4『施加约束』表 @2543-2553**（小节标题 @2543、表头 @2545-2546、七行 @2547-2553，方面 1／3／4／6／8／9／10），属方面二＝协调的 5.x 系列，与前八批所引的 **4.4『施加约束』表**（heading @2234、方面 4 七行 @2251-2257）**非同一张表** → 二者 aspect 号重叠而源不同，不得混引（本批台账初稿曾误写 4.4，已按实测更正，见 (xiv)）。方面 8 行（@2551）级别列逐字为『软/硬按风格（事件驱动 → 回放与乱序注入必备，承接 1.4）』＝条件级别 → 取 **conditional**（ENUM_LEVEL 三值中唯一能承载『按条件定级』者；取 hard 会虚构母本未给的无条件性、取 soft 会丢失其可升硬面），与 CTR 批 3.4 施→8（@1987 级别列『软/硬按风格』）同型（MJ-21 (x)），而与 STP／DFL 批的 4.4 施→8（@2255 级别列逐字为『软』）**不同源** → 判读不得平移（MJ-22 (iv) 同型纪律）；其升级条件为风格侧的具体裁定，归口母本 5.4 澄清／s5h，不在注册表侧自行定级。其余六方面一律 hard（禁止性／默认偏离须记录条款，MJ-4 判读）；方面 9 行（@2552）逐字为『协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化』→ 系 expiry 一词在母本的明文出处之一（另见 (vi)）。(xi) **累计未登记词汇候选 31 词的去重口径**：前八批 19 词（MJ-19 (i) 4＋MJ-20 (iii) 7＋MJ-21 (v) 8）＋本批方括号占位 10 机制词（backoff／bulkhead／circuit_breaker／dedup_table／dedup_window／fallback／half_open／inbox／jitter／retry）＋本批改写四词中属新候选的 **2 词**（propagation／expiry）＝ **31 词**；去重两面据实——sla_bound 已在 MJ-19 (i) 四词内故不重复计数，idempotency_declared 经 MJ-12 以 `idempotency(x, ·) ∧ declared(·)` 表达故不入候选（MJ-23 (v) 同型口径）。一并归 s5g 独立 R2 词汇批次，与 SO-4 补齐动作同批裁决；**不新增 VG 编号**（VG-01…VG-04 已覆盖该处置形态）。不扩词的理由仍是后果而非资格：登记将触发相关 anti_patterns 的 signal_level 改级，按 0.14＋SO-2／G-STY-4 须走完整 ADR＋批准，不在数据批次内自行执行。(xii) **书目 46 的 ISBN 连字符分组差异与页数两说 → 据实登记不改写**：母本著录 ISBN 978-1-68050-239-8 与另一形态 978-1-680-50239-8 的连字符分组不同（同一 ISBN-13 的两种分组书写）、页数有 350 与 376 两说；本地 resources/se PDF 已内容核验，ISBN 9781680502398 与著录一致，而文件名携带的 9781680500387 系第 1 版残留元数据 → 一律据实登记、不改写母本（0.22 承诺一＋母本零改动前提），裁决口归 G-RLP-1.route ④／s5h。书目 44 的本地 EPUB 自述 isbn13 9780133065091 与母本著录 978-0-321-20068-6 的两说仍归 G-DFL-1.route ④／SO-11，本批不裁决（MJ-23 (ix) 同型）。(xiii) **32 条 signal_level 的定级（P0 11／P1 13／P2 8；逐条 4/4/4/5/5/5/5）**：pattern_id 严格为 RLP-00N-APi（M2），逐条的 pattern_id↔signal_level↔description 已建立全映射以对位核验（见 (xiv)(d)）。P0 十一条＝有 5.5／4.5 硬性质可绑定（多为 Z2 的投递语义面）或属机制的定义性判据；**P1 十三条中有五项以 Z4 为条件硬**（5.5 逐字『过 0.4 证据门槛时为硬；否则降软 + 保守界』）为定级依据 → 门槛未过时不满足 MJ-4 的 P0 判据，定 P1 限期整改：RLP-004-AP3 @5985、RLP-005-AP2 @6091、RLP-005-AP3 @6095（三者直接触发降软分支）、RLP-007-AP2 @6302（池内排队无界使 Σ timeout_budget 无法闭合；@6300 description『池饱和后无拒绝策略（无界排队）』与 @6302 行内注即载此理由，而 AP3 @6303-6306 另以容量无实测出处定级 → 初稿误记为 AP3 已更正）、另 RLP-002-AP3 @5781 以事务持锁时长联动 Z4 预算为由；其余八项一律为『母本明文强制但 4.5／5.5 无可直接绑定的硬性质』（Z7 系升级型而非硬性质、Y6 系冲突信号面、5.2.2 的暂时性失败假设系适用前提）或『0.4 证据门槛偏离』（阈值将成为无出处数字），逐项理由见各行 signal_level 行内注。P1 → P0 的改级只能由 s5g 词汇批次或 s5h 证据门槛裁决触发，本批不自行升级（0.14＋0.22 承诺一）。(xiv) **本批四处自我纠错的实测教训（纪律固化）**：本批台账初稿经逐条 python 实测复核后更正四处，均系『记忆／宽松匹配冒充实测』类错误——（a）**M4 六行改写的落点行号**初稿记 @5981／@6026／@6084／@6080／@6198，实测为 @5984／@6029／@6090／@6086／@6204（旧号分别是 signal