    formal_anchor:
      - {property_id: V5, role: triggers}     # 风格定案属高影响决策（纪律二）；V3 的登记位见块头通用说明七
    references:
      - {bib_id: 13, support_claim: "演进式元方法（1.2.4）；与 CH-B 推迟处置的同构关系——母本登记提取面与本行逐字对应（行级提取面）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 23, support_claim: "1.2.4 演进式元方法的默认起点论证；0.10 临时保守通道条件 (i) 的登记默认值来源——母本登记提取面与本行『默认起点：模块化单体』逐字对应", compile_usage: narrative_only, trust_grade: "[已核验]"}   # compile_usage=narrative_only 依母本登记（概念性引用，不作为编译字段填充来源）
    narrative:
      benefit_cost_analysis: "收益：在需求不确定性高、团队规模小的场景下，把『错误代价最高、最难逆转』的风格决策（1.1）拆成可回退的小步——从最小可行架构出发，显式预留演化路径与切换点，推迟不可逆决定；母本明示它与 CH-B 的推迟处置同构，即演进式就是『推迟模式』在风格层的实例，因此它天然带一套已定义的纪律（参数化切换点、LRM、可推翻指标、保守假设 ADR）。默认起点选『模块化单体』不是偏好而是登记默认值：它保留了未来拆分选项（@1353），使切换点的迁移代价有上界。代价：推迟不等于免除——切换点重审与迁移执行的成本随既成结构固化而上升；『显式预留』是硬要求，未参数化切换点的演进式只是拖延；且默认起点不免检（0.18.3 纪律 4），S1–S4 全步骤照跑，本方法省不掉选择过程本身。"
      typical_scenarios: "初创团队与早期产品（需求不确定性高）、棕地改造的分阶段推进、需要在合规/预算约束下先上线再演化的系统、作为 @1391 典型链的落地环节（约束排除 → 质量属性驱动 → 模式匹配排序 → 演进式落地）、任何以 CH-B 推迟处置的架构决策点在风格层的对应场合。"
      common_misuse: "以『演进式』为名不做选择（无切换点、无 LRM、无可推翻指标 → 退化为无据拖延）；把默认起点当免检通道（跳过 S1–S4，违反 0.18.3 纪律 4）；偏离登记默认值而不记录（0.10 临时保守通道条件不满足）；切换点到达后不执行切换（结构固化，『保留未来拆分选项』失效）；把演进式等同于『先写大泥球以后再说』（默认起点是模块化单体，模块边界与依赖方向从第一天起就是守护面，见 STY-015-AP1）。"

