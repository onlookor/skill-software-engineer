        bound_expr: "接口变更触达的调用方单元数 上界 = 该接口内部调用方集合的基数；跨边界契约变更数 = 0（3.2.1 适用条件列限定于模块边界与单元内部）→ > 0 即本形态被越界使用（3.4 接收约束方面 1 行：微服务 → 跨单元禁止以进程内调用为主手段）"
        source: {source_type: row_id, value: "3.2.1-进程内接口", verified: true}
      - metric: "性能：延迟分位数（P50/P99，P99 = 延迟分布第 99 百分位数）"
        bound_expr: "进程内调用的延迟增量 下界为 0（无网络往返与跨进程序列化项）；同接口 P99 随调用方数量单调不减 → 跨单元延迟预算项归属方面 1 风格包络，本条不重复计入（0.8）"
        source: {source_type: clause_id, value: "6.2.1", verified: true}
    cost_profile:
      latency_budget_delta: "无网络项——进程内调用的延迟增量为函数调用与序列化开销，下界为 0；跨单元延迟预算项属方面 1 风格包络（0.8），本条不重复计入"
      failure_modes: ["跨单元以进程内调用为主手段（3.4 接收约束方面 1 行明文禁止 → 分布式单体信号，1.2.2 反模式；触发向方面 1 的重审提议）", "接口面未经静态分析提取即声称『无契约面』（机器层天然性列为『中』：缺工具即盲区，unknown 被当作 false，0.18.6 M15）", "以进程内接口承载跨边界数据流动、绕过数据契约（3.4 施→4 硬：数据契约的 schema 与语义条款是数据流动的唯一合法路径定义）", "接口变更未走 3.4 施→2 的边界冻结纪律（切割需求 → 弃用窗口＋绞杀者迁移）"]
      consistency_impact: "同进程内调用天然共享事务边界 → 一致性级别由方面 4 的 Y 系列判定（CSL 批承载），本条不引入跨单元一致性代价项；一旦以进程内接口承载跨单元事务语义即违反 3.2.3 条件 3（不承载跨单元事务语义）→ X6 违例、分布式单体信号"
      observability_requires: ["接口清单与调用方集合可查（静态分析提取面，3.2.1 机器层天然性列）", "接口所属单元与模块边界在案（2.5 seam 谓词的可验证投影）", "跨单元调用点的存在性可观测（3.4 接收约束方面 1 行的违例检测面）"]
      ops_cost: "无独立运维面——进程内接口不产生独立部署/独立监控单元，运维成本随所属单元计入（0.8 包络不重复计项）"
      skill_prerequisites: ["语言级接口设计与静态分析提取（3.2.1 机器层天然性列『中（需静态分析提取）』）", "seam 识别与可验证投影（2.5；方面 2 联动）", "契约边界与分解边界的对齐核验（3.4 接收约束方面 2 行：分解边界 = 契约边界＋上下文映射）"]
      aggregation_semantics: itemwise  # 母本未给 CTR 的跨契约聚合式（MJ-19 (iii) 同型：不本地造法）→ 代价按接口逐项评估（MJ-20 (vi) 同型；MJ-21 (ix)）
    compatibility:
      - peer_entry: STY-016
        relation: hard_conflict
        evidence: {source_type: clause_id, value: "3.4", verified: true}   # 接收约束方面 1 行明文「微服务 → 跨单元禁止以进程内调用为主手段」（级别＝硬）。hard_conflict 为对称关系、本可镜像，但 STY-016 属已批准条目 → 不擅改，镜像回填留待人工裁决（MJ-20 (vii) 同型；MJ-21 (viii)）
      - peer_entry: STY-014
        relation: composable
        evidence: {source_type: clause_id, value: "3.4", verified: true}   # 接收约束方面 1 行明文「单体 → 进程内接口可用」
      - peer_entry: STY-015
        relation: composable
        evidence: {source_type: row_id, value: "3.2.1-进程内接口", verified: true}   # 适用条件列明文「单体/模块化单体的模块边界」
    constraints_imposed:               # 交叉表源：3.4「施加约束」表（方面 3 全体六行，CTR 十二条逐字相同）
      - {target_aspect: 2, constraint: "已发布契约的边界冻结——分解不得切割既有契约（切割需求 → 走弃用窗口 + 绞杀者迁移）", level: hard}
      - {target_aspect: 4, constraint: "数据契约的 schema 与语义条款是数据流动的唯一合法路径定义", level: hard}
      - {target_aspect: 5, constraint: "协调模式中的每条跨单元交互必须有注册契约（Z1 的契约来源）", level: hard}
      - {target_aspect: 8, constraint: "契约测试是验证计划的组成部分；微服务风格 → CDC 必备；事件驱动 → 事件 schema 演化测试必备", level: conditional}   # 级别列原文「软/硬按风格」→ 本条为单元内部形态：契约测试取硬（seam 的可验证投影即测试面），CDC 与事件 schema 演化两项不适用（MJ-4 同型判读；MJ-21 (x)）
      - {target_aspect: 9, constraint: "契约漂移（运行时实际流量与注册契约的偏离）是守护对象；漂移检测规则参数按 0.13 注册", level: hard}
      - {target_aspect: 10, constraint: "契约是机器层的天然工件：IDL/schema/OpenAPI 文档直接投影为白板谓词，禁止双重维护（0.9 同源生成原则在契约域最强适用）", level: hard}
    anti_patterns:
      - pattern_id: CTR-001-AP1
        description: "跨单元以进程内调用为主手段（分布式单体信号）"
        detection_predicate: "∃ u1, u2: unit(u1) ∧ unit(u2) ∧ connects(u1, u2, ·) ∧ [interaction(u1,u2) 以进程内调用为主手段] ∧ ¬[u1 与 u2 同属一个部署单元]"
        signal_level: P0               # 3.4 接收约束方面 1 行级别＝硬，违例即 1.2.2 分布式单体反模式并触发向方面 1 的重审提议（3.2.3 同型处置）；落在 X1（硬）量化域内 → P0（MJ-4 判据）
      - pattern_id: CTR-001-AP2
        description: "接口面未经静态分析提取即声称无契约面（机器层盲区充作不存在）"
        detection_predicate: "∃ u: unit(u) ∧ [u 的对外接口集合被声明为空] ∧ ¬[静态分析提取记录在案] ∧ ¬[接口清单在案]"
        signal_level: P1               # 违反 3.2.1 机器层天然性列的提取要求与 0.18.6 M15（unknown ≠ false），但无 X 系列硬性质可直接绑定 → P1（MJ-4 判据）
    formal_anchor:
      - {property_id: W1, role: implements}      # 3.2.1 定义列明文「方面 2 的 seam 是其可验证投影」→ ∀M: seam(M)（2.5）的承载形态
      - {property_id: X1, role: consumed_by}     # ∀ interaction ∈ connects: ∃C ∈ registry: covers(C,u1,u2)——单元内部交互不在 X1 量化域（跨单元），本形态是 3.4 接收约束方面 1 行的可行集成员
      - {property_id: X2, role: consumed_by}     # ∀C: lifecycle_state = published → has(version) ∧ has(compat_policy)（3.2.2 版本化/兼容性两维度适用于全体形态）
      - {property_id: X6, role: consumed_by}     # 3.2.3 条件 4「访问路径经数据契约暴露，禁止直连物理表/存储引擎」→ 以进程内接口直连他单元存储即违例
    references: []                     # 母本 3.7 书目 28–34 无 3.2.1「进程内接口」行的行级登记提取面（28/29 → 3.2.2 CDC 与契约测试区分；30 → 同步 API 契约机器层格式；31 → 3.2.1 事件信封；32 → API 契约设计方法；33 → 3.2.2 schema registry 与兼容性规则；34 → 3.4 绞杀者迁移）→ 按 G-CRD-1／G-DEC-1 同型纪律「表级/节级面不下探」不扩张；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）→ 登记 G-CTR-1，待人工裁决补勘后回填（SO-9）
    narrative:
      benefit_cost_analysis: "收益：延迟增量下界为 0（无网络往返与跨进程序列化），机器层可由静态分析直接提取，且与方面 2 的 seam 谓词同源（3.2.1 定义列）→ 0.9 双层表达无需双重维护；单体/模块化单体的模块边界与任何风格的单元内部均可用（3.2.1 适用条件列），是 3.4 接收约束方面 1 行明示的『单体 → 进程内接口可用』通道。代价：跨单元使用即触发 3.4 接收约束方面 1 行的硬禁止（微服务 → 跨单元禁止以进程内调用为主手段），违例即分布式单体信号并须向方面 1 发重审提议；机器层天然性仅为『中』（须静态分析提取），工具链缺位时接口面成为盲区；已发布接口同样受 3.4 施→2 边界冻结约束，重划须走弃用窗口＋绞杀者迁移，不因『内部接口』而豁免。"
      typical_scenarios: "单体或模块化单体的模块边界（3.2.1 适用条件列）；任何风格的单元内部接口（同列）；棕地逆向勘察须以静态分析从代码提取现状契约清单的场合（3.3 现状空间驱动第一行）；纯内部、非第三方开放且消费者与提供者同团队的场合（3.3 问题空间驱动第一行＋交付空间驱动第一行）。"
      common_misuse: "跨单元以进程内调用为主手段（AP1，3.4 接收约束方面 1 行硬禁止 → 分布式单体）；以进程内接口承载跨边界数据流动、绕过数据契约（3.4 施→4 硬 → X6/Y1 违例面）；未经静态分析提取即声称无契约面（AP2，机器层盲区充作不存在）；把『内部接口』读作不受边界冻结约束（3.4 施→2 硬不区分内外）；以进程内接口承载跨单元事务语义（3.2.3 条件 3 违反）。"

