    remediation_plan: "闭合路径同前五项：(1) project.py 自检全过（本批，见 ST-CTR-01 evidence）→ (2) 编译器对 seed 条目执行『人工条目 vs 编译条目』重验证，差异按 0.17.6(3) 三分类处置 → (3) 建立 FVR 条目并为 X1/X2/X3/X5/X6/W1/W4/Y1/Z1 接线，首次全量运行留证（E3 的 first_full_run has evidence）→ (4) 逐条 seed→active（diff 为空 = 低影响简记；diff 非空按三分类分别定级）。本 Waiver 在 (3) 完成时闭合。本批特有前置：(a) **X3 先定级再接线**——X3 为条件硬，(3) 的接线范围取决于 slowest_consumer_migration(C) 的迁移时长估计是否过 0.4 证据门槛（可观测、可验证、有出处且无争议）；门槛未过则 X3 降软＋保守假设 ADR＋保守默认窗口取注册表登记上限（母本 @2012 明文，**不阻塞**），本项 scope 内 X3 的 4 个实例随之出栈，不需接线，该出栈以简记留痕而非静默缩减；母本 @2020 的双向防护（『防止 Agent 编造「消费者迁移时长」假精确数字绕过弃用窗口』）一并适用，本批不以自撰数值充当硬化证据（CTR-007-AP2／CTR-010-AP3／CTR-011-AP1 三处行内注已挂该复核口）。(b) **母本 3.5 面谓词的 R2 登记**——本批 34 条 detection_predicate 内以半角方括号占位的未登记词共 9 个（contract／sla_clause／breaking_change／deprecation_window／cdc_suite／covers／interaction／shared_data_access／slowest_consumer_migration），九词均逐字见于母本 3.5：前六词在机器层谓词块（@1997-2002；同块 context_map @2003 本批未用），interaction 于 X1 公式（@2009）、shared_data_access 于 X6 公式（@2016）、slowest_consumer_migration 于 X3 公式（@2011）；而 predicate_vocabulary.yaml 的 predicates 节只投影 1.5／2.5／4.5／5.5／6.5／0.17.8／0.18.6 七处，**3.5 面整节未投影**，clause_defined_predicates 十项亦无上述任一词 → X1/X2/X3/X5/X6 面在词汇补齐前无法机器求值，(3) 的全量运行证据只能覆盖已登记谓词面（seam／owned_by／owner／dataset／has／approved／declared 已登记；covers／interaction／shared_data_access／contract 等未登记）。另记：X6 公式内的 satisfies 与 explicitly_recorded（@2016）本批以中文事实占位表达（CTR-005-AP1『¬[a 满足 3.2.3 四条件]』）而未以谓词调用形态出现，故不计入本批 9 词，但同属 3.5 面未投影的词汇缺口，一并列入候选面。裁决与理由见 MJ-21 (v)：本批不扩词，因扩词将触发相关 detection_predicate 的 signal_level 由 P1 改级 P0（守护规则改级），按 0.14＋SO-2／G-STY-4 须走完整 ADR＋批准；本批 9 词中 covers 已系 MJ-19 (i) 四词之一，故新增候选 8 词，与 MJ-19 (i) 四词、MJ-20 (iii) 七词合计 **19 词**，宜与 SO-4 补齐动作合并为独立 R2 词汇批次统一裁决，不在本批执行，亦不以本 Waiver 的批准为前提。(c) **compatibility 的方向与镜像问题不影响接线**——CTR-002/003/004 → STY-001/002/003 的三条 requires 由一侧单方承载（MJ-17 (iii)：ENUM_RELATION 无 required_by），CTR-001 → STY-016 的 hard_conflict 镜像不擅改已批准的 STY-016（回填与否留人工裁决，见 ST-CTR-01 condition）；CTR-011 → DEC-005 的 tension 为单侧登记（对侧 DEC-005 属已批准条目，MJ-21 (viii) 纪律）。三者均属 compatibility 面，与 (3) 的性质接线相互独立，方向裁决属注册表变更。"
    risk_quantification: "触及面：12 条 × formal_anchor 引用的硬性质，共 8 项 24 个硬性质实例（X2 8、X1 7、X5 3、X6 2、W1 1、W4 1、Y1 1、Z1 1）＋ X3 条件硬 4 个实例。利息形态：硬性质违例的检出时机从『运行时/编译期自动检出』退化为『评审期人工核验』，检出延迟 = 一个决策周期；漏检后果按性质分级——X1 漏检 = 跨单元交互未进契约注册表即定案（1.5/3.5 硬，契约密度不足；本批 7 个实例覆盖四种契约形态的 implements 面与进程内/端/注册三面的 consumed_by 面，漏检即『无契约的交互』在方面 3 失去唯一硬闸门）；X2 漏检 = 已发布契约缺 version 或 compat_policy（3.5 @2010 硬），破坏性变更判定（X3）失去输入前提，版本化策略与兼容性规则两维度的治理面整体失效；X5 漏检 = 契约进入 published/deprecated 而无已批准 ADR（@2015 硬），3.3 双使用者条款与 0.10 权力条款的机器面失守（契约发布属高影响决策，人类保留批准权）；X6 漏检 = 共享数据访问未满足 3.2.3 四条件或未显式登记（@2016 硬），数据契约形态退化为隐式共享写，Y1/W4 的数据单一所有者面被绕过；W1 漏检 = 进程内接口无可测试 seam（0.15 冻结项，方面 6 → 方面 2/3 硬约束，母本明文『双方不得单方面撤销』@294／@2863）；W4/Y1 漏检 = 数据契约对应的数据集合出现多所有者或无已批准共享写例外（2.4 施→4、4.5 @2279-2280 硬）；Z1 漏检 = 异步消息契约对应的跨单元交互未显式建模或契约不在册（5.5 @2575-2576 硬，承接方面 3）；X3 漏检 = 破坏性变更未闭合弃用窗口（t ≥ 最慢消费者迁移时长），消费者被静默断裂，级别待 0.4 证据门槛判定。缓解：(i) 0.17.5 强制 ADR 附注『依据种子条目，待重验证』；(ii) 本批 P0/P1/P2 信号级判读带 3.5/2.5/4.5/5.5 性质指针与 MJ-4 判据留痕，可逐条人工复核（34 条 detection_predicate 全部标级，其中未登记谓词面按 MJ-12 取 P1 并留方括号占位，明记『补齐后升 P0』）；(iii) compatibility 面按 MJ-9 只登记母本有明文依据的对（25 对：composable 20／requires 3／hard_conflict 1／tension 1；同批内 7 对全双向闭合，其中 CTR-004 侧两条与 CTR-011 侧一条系本批入库时的镜像回填、依据与对侧同源），无明文依据者留空（CTR-006／CTR-012）并在 ST-CTR-01 condition 留痕，不静默造规范；(iv) project.py 的 M9/C-ST/C-ENV/M2/M3/M4/M6 静态自检覆盖 peer 存在性、状态资格、CTR 剖面 envelope 非空义务、pattern_id 与 target_aspect 形态、bound_expr 参数化（28 项）、谓词词汇封闭、references 分级七项可机器判定面（本批 CTR 十二条 envelope 全部非空，M3 全过；六条 references 空列表以 G-CTR-1＋SO-9 显式登记，不以本地造引充数）；(v) 累计口径——本项与前五项合计覆盖 **61** 条 seed 条目（STY 24＋OWN 4＋CSL 5＋CRD 8＋DEC 8＋CTR 12），六项 scope 互不重叠，豁免面按批次逐项登记，不合并、不互相援引。"
