        signal_level: P1               # 0.4 禁假精确＋6.6 示例四明文『出处＝现状消息基础设施基线测量，非编造精确值』；无 V/Y/Z 硬性质可绑定 → 不满足 MJ-4 的 P0 判据，定 P1 限期整改
      - pattern_id: DFL-005-AP5
        description: "刷新链路滞后无告警阈值（陈旧读窗口不可观测）"
        detection_predicate: "∃ V: data_lineage(V, ·, ·) ∧ ¬[刷新滞后阈值与告警已登记]"
        signal_level: P2               # 不构成 4.5/5.5 性质违例，而是新鲜度/陈旧窗口的漂移信号（须以滞后阈值 + 趋势双判据核定）→ P2（MJ-4 判据；与 DFL-002-AP4 同型）
    formal_anchor:                     # 交叉表源：4.5 可验证性质（本行第四列明文『重建能力是登记项（Y 系列检查）』→ 五行中唯一明文挂钩 Y 系列者）
      - {property_id: Y1, role: implements}   # 4.2.4 第四列『视图是**派生物不是所有者**』＝Y1「单一所有者」（硬）在派生面的机制侧落实 → AP1 的性质面（与 STP-003 formal_anchor 的 Y1 implements 同型）
      - {property_id: Y2, role: consumed_by}  # 视图作为读侧访问路径以 path_kind=view 登记（4.5 access_path）→ 受 Y2「无绕过所有者与契约的访问路径」（硬）检查 → AP3 的性质面
      - {property_id: Y7, role: implements}   # 4.2.4 第四列『重建能力是登记项（Y 系列检查）』→ Y7「∀ D_derived: data_lineage(D_derived, sources, rebuildable=true)」（软 P2）的机制侧落实 → AP2 的性质面（与 STP-003 formal_anchor 的 Y7 implements 同型）
      - {property_id: Y4, role: consumed_by}  # 流动机制与风格的自洽性由 Y4 检查（4.2.4 尾注；4.5 级别列为软 → 偏离标记评审，过度工程信号）
      # Y3（一致性级别显式声明，硬）不登记：声明义务归权威数据所有者，视图侧只承担新鲜度条款（见 consistency_impact）→ 本行非该性质的机制面，按「不下探」纪律不扩张
    references: []                     # G-DFL-1：4.7 书目中无 4.2.4「物化视图」行的行级登记面——书目 40（Helland, Immutability）登记面为「Y7 可重建性理论基础」＝节级面；书目 5（Richardson, Microservices Patterns）为「部署×通信组合模式（Saga、CQRS、事件驱动）」；书目 35（DDIA）为 4.2.3 谱系与复制/分区权威内联源；书目 42/43 为发件箱与 CDC → 均按「表级/节级面不下探」纪律不扩张；可否下探为行级出处留 G-DFL-1.route 裁决口①②③待人工裁决。留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）
    narrative:
      benefit_cost_analysis: "收益：4.2.4 第二列把本机制定性为「由权威数据派生、可重建的本地化读模型」——读侧可按查询形态自由优化（1.2.3「事件溯源 + CQRS」行第四列『读模型自由优化』），跨单元查询聚合得以在不引入共享库的前提下满足（第三列；STP-001 的 typical_scenarios 明文以派生读模型替代共享库）；本地化使权威源不可用时视图仍可读，构成 6.6 示例四中「事件投影读模型」这一候选路径。代价：第四列明记「视图是**派生物不是所有者**——重建能力是登记项（Y 系列检查）」→ 血缘与可重建性是登记义务（Y7 软 P2），把视图当权威源即 Y1 硬违例；刷新延迟构成可见性下界，母本未给通用量化界，6.6 示例四的实例（P99 界 = 800ms）明记『出处＝现状消息基础设施基线测量，非编造精确值』→ 数值须实测补入（0.4）；存储面为数据复制成本；源 schema 变更沿视图定义与刷新路径传播至全体消费方（4.4 施→9）；视图一致性不优于最终一致，跨所有者强一致需求仍为 Y6 冲突信号；访问路径须经所有者授权登记，否则 Y2 违例。"
      typical_scenarios: "CQRS 读侧（4.2.4 第三列原文；1.2.3 该行第四列『读模型自由优化』）；跨单元查询聚合（同行第三列；STP-001 明文引本行为共享库的替代路径）；事件日志为权威状态时的派生读模型（4.2.2「事件日志为权威状态」行第二列『状态以事件日志为准，物化视图为派生』）；读经所有者授权的副本形态（4.2.2「所有者 + 授权读副本」行第二列，第四列要求『副本新鲜度条款写入数据契约』）；6.6 示例四质量目标不可达时的建议重审范围之一（『追加 CDC 或物化视图投资并补刷新延迟出处』）。"
      common_misuse: "向视图直写或把视图当权威状态源（AP1，Y1 硬违例；与 STP-003-AP1 同型）；重建能力与血缘未登记（AP2，Y7 软 P2）；视图访问路径未经所有者授权与契约登记即开放（AP3，Y2 硬违例）；刷新延迟界无出处即写入 SLO 或以编造精确值充当现状基线（AP4，0.4＋6.6 示例四）；刷新滞后无告警阈值（AP5，陈旧读窗口不可观测）；把 CQRS 当作默认选择用在不需要的场景（1.2.3 该行第五列反模式原文）；以视图承担跨所有者强一致读（Y6 冲突信号不消解）；把本行读作对 STY-004 的 requires（1.2.3 与术语表均明记 CQRS **不必然**绑定事件溯源）。"

