        source: {source_type: row_id, value: "2.2.1-S5 按变更频率", verified: true}
      - metric: "可修改性：变更前置时间"
        bound_expr: "稳定单元的变更前置时间 单调不增于分离前 → 分离不得把易变性成本转嫁给稳定单元（2.2.2 信息隐藏判据的反面）；下界为单一易变点内变更"
        source: {source_type: clause_id, value: "6.2.1", verified: true}
    cost_profile:
