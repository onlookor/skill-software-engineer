        source: {source_type: row_id, value: "5.2.2-预扣/预留（reservation）", verified: true}
    cost_profile:
      latency_budget_delta: "= 预扣操作 + 确认/释放操作两次本地原子操作之和（5.2.5 明文：每个行为/协调模式条目必须携带卡片；无跨单元协调跳）"
      failure_modes: ["预扣无超时自动释放（资源泄漏 → 5.2.2 关键设计规则列「防泄漏」违例，Z3 每步有出路失效）", "预扣超时值留在实现里而不入契约条款（可见性损失失去有界性依据，4.6 示例二）", "确认/释放路径缺失导致预扣永久占用（Z3 违例）", "以预扣替代所有权定案（跨所有者强一致需求未经 Y6 审查）"]
      consistency_impact: "预扣记录是数据集合，受 Y1–Y8 全约束，其所有者 = 资源所有者单元（5.4 施→4 硬：流程状态的所有者 = 协调者单元，本条目协调者即资源所有者）；窗口期内被预扣资源对展示层不可用（4.6 示例二的牺牲），硬规则满足（超卖在存储层不可能）；级别选择的逆转成本由 CSL-005 承载，本条目不重复计入"
      observability_requires: ["预扣记录、超时值与释放事件可查（saga / timeout_budget 谓词在案，5.5）", "可见性损失窗口可度量（窗口 ≤ 预扣超时值界的前提）", "卡片 observability_requires 不得退化（5.4 施→9）"]
      ops_cost: "[随预扣资源种类上升；须承担泄漏巡检与对账的常态成本（5.2.2 关键设计规则列「防泄漏」）]"
      skill_prerequisites: ["预扣/预留模式的业务建模（超时值作为契约条款，4.6 示例二）", "超时自动释放的定时与幂等设计（Z3）", "可见性损失的有界性论证（下限合法性来源）"]
      aggregation_semantics: itemwise  # 两次本地原子操作按项独立评估，无跨单元累加点（5.2.5 Σ 的两步特例，不做加和聚合）
    compatibility:
      - peer_entry: CSL-005
        relation: requires
        evidence: {source_type: row_id, value: "4.2.3-补偿一致（业务级）", verified: true}   # 5.4 接收约束方面 4 行「跨所有者强一致 → Saga/预扣或回溯方面 1」把预扣与 Saga 并列为补偿一致（业务级）的达成手段；4.2.3 实现手段列明文「预扣/预留模式」→ requires 关系由 CRD 侧承载（MJ-17 (iii)），CSL-005 侧按 MJ-5 镜像纪律不重复登记
    constraints_imposed:               # 交叉表源：5.4「施加约束」表（方面 5 全体七行，CRD 八条逐字相同）
      - {target_aspect: 1, constraint: "协调需求在既定风格下不可行 → 回溯约束声明（CH-E 原型通道，阻塞式）", level: hard}
      - {target_aspect: 3, constraint: "协调模式产生的新交互 → 契约登记需求（编排者与参与者间的命令契约、事件契约）", level: hard}
      - {target_aspect: 4, constraint: "流程状态（协调者状态机、Saga 日志、预扣记录）是数据集合，受 Y1–Y8 全约束——流程状态的所有者 = 协调者单元", level: hard}
      - {target_aspect: 6, constraint: "质量影响卡片 → 行为级包络校验输入；卡片是方面 6 的强制消费项（Q 系列将引用）", level: hard}
      - {target_aspect: 8, constraint: "行为验证要求：事件回放、乱序/重复/丢失注入、补偿路径测试、超时与断路行为测试、（风格允许时）混沌注入", level: conditional}   # 5.4 级别列原文「软/硬按风格（事件驱动 → 回放与乱序注入必备，承接 1.4）」；本条目 → 超时行为测试与释放路径（补偿路径）测试取硬，事件回放项按所依赖的通信风格定（MJ-4 同型判读）
      - {target_aspect: 9, constraint: "协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化", level: hard}
      - {target_aspect: 10, constraint: "机器层：Z 谓词集；人类层：覆盖谓词子集 {Z 谓词集} 的投影视图（受众问题 = 行为与协调的时序、事件流与流程状态；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: CRD-008-AP1
        description: "预扣无超时自动释放（资源泄漏）"
        detection_predicate: "∃ D, s: dataset(D) ∧ saga(D, s) ∧ [s 为预扣/预留语义] ∧ ¬[s 有超时自动释放]"
        signal_level: P0               # Z3 硬性质（长流程每步有出路）＋ 5.2.2 关键设计规则列「防泄漏」双据 → 检出即阻塞（MJ-4 P0 判据）
      - pattern_id: CRD-008-AP2
        description: "预扣超时值留在实现里而不入契约条款"
