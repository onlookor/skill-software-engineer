    applicability:
      problem_space:                   # 骨架源：2.2.1「定义」列＋「主导驱动空间」列＋2.3 问题空间驱动
        - "领域复杂度与概念丰富度高 → S1/S3 主导（2.3 问题空间驱动第一行）；单元 = 领域子域/限界上下文，如订单、库存、支付（2.2.1 定义列）"
        - "[Conway 事实：组织结构与领域边界的错位程度（2.6 示例一消费字段 problem_space『Conway 事实』；书目 17 Conway 为 narrative_only，不得充决策性出处，事实须另过 0.4 门槛）]"
      current_space:                   # 骨架源：2.3 现状空间驱动＋0.11
        - "既有领域模型/限界上下文在案 → 对齐或显式声明迁移路径（2.3 现状空间驱动第一行）；迁移声明本身是重审提议级材料"
        - "0.11 现状锁定：棕地『理想分解』必须以『现状分解 + 演化序列』表达"
      delivery_space:                  # 骨架源：2.3 交付空间驱动（S6 为所有策略的过滤器）
        - "团队拓扑与认知负荷是所有策略的过滤器：任何策略产出的单元规模不得超过承载团队认知负荷上界（W3，按 2.2.3 条件硬化）（2.3 交付空间驱动第一行）"
        - "[单人/小团队场景 S6 退化为不约束，不强制使用（2.3 交付空间驱动第二行；0.10 权力条款第二条）]"
    envelope:
      - metric: "可修改性：典型变更的实现成本（触达单元数、跨边界契约变更数）"
        bound_expr: "触达单元数（典型领域变更） ≤ 1 → 限界上下文内聚使单侧领域变更不跨单元传播；> 1 即语义边界划错的反向信号（2.2.2 语义边界判据）"
        source: {source_type: row_id, value: "2.2.1-S1 按业务领域", verified: true}
      - metric: "可修改性：DSM 密度（2.2.4 通道二的消费端之一）"
        bound_expr: "cross_density（DSM） ≤ 注册阈值 → 阈值是 2.2.4 的注册参数（2.6 示例一消费字段『DSM.cross_density 阈值』）；越阈则按 2.6 示例一走组合冲突处置，单调越阈即界外"
        source: {source_type: clause_id, value: "2.2.4", verified: true}
      - metric: "可修改性：变更前置时间"
        bound_expr: "变更前置时间 随跨边界契约变更数单调不减 → 上下文映射（2.4 施→3 硬）是前置时间的支配项，下界为单上下文内变更"
        source: {source_type: clause_id, value: "6.2.1", verified: true}
    cost_profile:
      latency_budget_delta: "无直接项——分解策略的延迟影响经由部署/通信风格间接产生，跨单元调用延迟项属 STY 包络（0.8），本条目不重复计入（kind_profile_DEC.optional 理由）"
      failure_modes: ["语义边界不清即以 S1 切分（部署单元与语义单元错位是分布式单体/纳米服务的根源，2.4 接收约束方面 1 行）", "按流程步骤而非『什么会变』切分（2.2.2 信息隐藏判据违例）", "限界上下文间契约未显式建模（2.4 施→3 硬 → X1 违例）", "S1 输出空集（2.6 示例五：FM-3 → 0.13 缺口声明＋CH-D；注册表现有 DEC 条目全部预设单一法人账套边界）"]
      consistency_impact: "分解边界 = 数据所有权边界（2.4 施→4 硬，即 W4）：每个数据集合有且仅有一个所有者单元；跨上下文一致性需求经方面 4 的 Y 系列判定（CSL/CRD 批承载，本条目不重复登记）"
      observability_requires: ["单元与限界上下文的映射可查（boundary_type 谓词实参取 bounded_context，2.5）", "跨边界依赖可观测（depends_on 的 kind/weight 在案，为 2.2.4 DSM 通道二的输入）", "上下文映射（契约边界）在契约注册表可查（X1）"]
      ops_cost: "[随限界上下文数上升：每上下文的独立验证与部署面带来运维单元数增长；单元数与认知负荷上限的联合可行性须先校验（2.6 示例三）]"
      skill_prerequisites: ["领域建模与子域划分（2.2.1 定义列；书目 7 登记面『S1 领域驱动分解』）", "事件风暴识别限界上下文（书目 24 登记面『S1 的操作化技术』，提取以 2019-08-23 本地存档版为准）", "上下文映射与契约显式建模（2.4 施→3 硬）", "粒度停止准则应用（2.2.3）"]
      aggregation_semantics: itemwise  # 母本未给 DEC 的跨单元聚合式（MJ-19 (iii) 同型：不本地造法）→ 代价按单元逐项评估，显式声明缺口（MJ-20 (vi)）
    compatibility:
      - peer_entry: DEC-006
        relation: tension
        evidence: {source_type: clause_id, value: "2.6", verified: true}   # 示例一：Conway 事实与领域边界的组合冲突（2.2.1 表前注「组合冲突的处置见 2.6 示例一」）；镜像登记于 DEC-006
      - peer_entry: DEC-002
        relation: tension
        evidence: {source_type: clause_id, value: "2.2.2", verified: true}   # 语义边界判据：分解跟随领域语义而非纯技术分层；镜像登记于 DEC-002
    constraints_imposed:               # 交叉表源：2.4「施加约束」表（方面 2 全体七行，DEC 八条逐字相同）
      - {target_aspect: 1, constraint: "分解边界候选 → 部署单元风格可行集（对偶回馈：语义边界不清晰时分布式风格降权）", level: soft}
      - {target_aspect: 3, constraint: "分解边界 = 契约边界；按业务领域分解时，限界上下文间契约必须显式建模（上下文映射）", level: hard}
      - {target_aspect: 4, constraint: "分解边界 = 数据所有权边界（每个数据集合有且仅有一个所有者单元，即 W4）", level: hard}
      - {target_aspect: 5, constraint: "单元内编排自由；跨单元协调必须显式建模（禁止隐式跨单元时序假设）", level: hard}
      - {target_aspect: 6, constraint: "分解粒度 → 一致性/性能/可修改性包络（跨单元事务代价项随跨边界交互数增长）", level: soft}
      - {target_aspect: 8, constraint: "每个分解单元必须是一个可独立验证的单元；否则粒度停止准则违反 → 发回溯约束声明（CH-E）", level: hard}
      - {target_aspect: 10, constraint: "机器层：2.5 边界谓词集；人类层：覆盖谓词子集 {2.5 边界谓词集} 的投影视图（记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: DEC-001-AP1
        description: "语义边界不清即以 S1 切分（切出的『上下文』不能独立陈述领域语义）"
        detection_predicate: "∃ M1, M2: unit(M1) ∧ unit(M2) ∧ boundary_type(M1, bounded_context) ∧ depends_on(M1, M2, call, ·) ∧ ¬[M1 与 M2 的领域语义可独立陈述]"
        signal_level: P1               # 违反 2.2.2 语义边界判据（定义性判据），但无 W 系列硬性质可绑定 → P1（MJ-4 判据）；后果面见 2.4 接收约束方面 1 行理由列（分布式单体/纳米服务根源）
      - pattern_id: DEC-001-AP2
        description: "按流程步骤而非『什么会变』切分（信息隐藏判据违例）"
        detection_predicate: "∃ M, D: unit(M) ∧ responsibility(M, ·) ∧ ¬∃ D: hides(M, D) ∧ [M 的职责陈述为流程步骤序列]"
        signal_level: P1               # 2.2.2 信息隐藏行明文「按『什么会变』封装，而非按『流程步骤』切分」为禁止性规定，但无硬性质直接绑定 → P1（MJ-4 判据）
    formal_anchor:
      - {property_id: W1, role: consumed_by}     # ∀M: seam(M)——量化域覆盖任一策略产出的单元（2.5；0.15 冻结项经方面 6 接收约束）
      - {property_id: W2, role: consumed_by}     # ∀M: independently_verifiable(M)——2.4 施→8「每个分解单元必须是一个可独立验证的单元」
      - {property_id: W3, role: consumed_by}     # 2.3 交付空间驱动：S6 是所有策略的过滤器（条件硬，级别由 0.4 证据门槛判定）
      - {property_id: W7, role: consumed_by}     # 2.3 双使用者条款：主策略选择与组合冲突解决属高影响 → 记完整 ADR 并走批准路径
      - {property_id: W5, role: consumed_by}     # 2.2.2 语义边界判据 ＋ 2.6 示例一消费字段（DSM 最优但语义不内聚 → flag_for_review）
      - {property_id: X1, role: consumed_by}     # 2.4 施→3 行明文点名本策略：「按业务领域分解时，限界上下文间契约必须显式建模（上下文映射）」
    references:
      - {bib_id: 7, support_claim: "S1 领域驱动分解；2.2.2 语义边界判据（母本 5.7 书目 7 行级登记提取面逐字对应，本条为该行级面的直接承载者）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 24, support_claim: "事件风暴识别限界上下文（S1 的操作化技术；提取以 2019-08-23 本地存档版为准）（母本 5.7 书目 24 行级登记提取面逐字对应）", compile_usage: metadata_extraction, trust_grade: "[已核验（联网核验时间 2026-09-13）；出版形态澄清：Leanpub 迭代出版无单一出版年——官方页面最新更新 2021-08-26（416 页），著录出版年以引用时所据版本为准；本地资源＝resources/se《Introducing EventStorming - Alberto Brandolini - 20190823.pdf》345 页，2026-09-15 内容核验]"}
    narrative:
      benefit_cost_analysis: "收益：领域复杂度高的系统获得与业务语言对齐的语义边界（2.2.1 定义列），典型领域变更的触达单元数上界为 1，跨边界契约变更数随之收敛；限界上下文即契约边界（2.4 施→3 硬），契约面天然显式；与 S3 并列为问题空间驱动的主导策略（2.3）。代价：领域建模与事件风暴的技能前提重（书目 7/24）；上下文数上升使运维单元数与认知负荷压力同步上升，须过 S6 过滤器（2.3 交付空间驱动）；语义边界不清时强行切分即产出分布式单体/纳米服务（2.4 接收约束方面 1 行理由列）；S1 可能输出空集（2.6 示例五：单一法人账套边界预设失效），此时走 FM-3 → 0.13 缺口声明＋CH-D，不得静默降级为其他策略。"
      typical_scenarios: "领域复杂度与概念丰富度高的业务系统（2.3 问题空间驱动第一行）；既有领域模型/限界上下文在案的棕地对齐（2.3 现状空间驱动第一行）；需与业务方语言对齐且契约须显式治理的场合；与 S6 组合时须先解 Conway 事实冲突（2.6 示例一）。"
      common_misuse: "语义边界不清即以 S1 切分（AP1）；按流程步骤而非『什么会变』切分（AP2，违 2.2.2 信息隐藏判据）；限界上下文间契约不显式建模（X1 违例，2.4 施→3）；以 S1 输出为最终分解而跳过 S6 认知负荷过滤（2.3 交付空间驱动为硬过滤器）；S1 输出空集时静默改选其他策略而不立案（违 M15 unknown ≠ false 与 2.6 示例五悬置禁令）。"

  - entry_id: DEC-002
    kind: DEC
    name: "S2 按技术层次"
