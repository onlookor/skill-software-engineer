        - "[流程状态机需显式建模且步骤超时须纳入延迟预算（5.2.2 关键设计规则列）]"
      current_space:                   # 骨架源：5.2.2「实现手段」列（工作流引擎 + 状态机）
        - "[工作流引擎或状态机运行时在案且支持状态持久化（Z8 的现状前提）]"
        - "[人工步骤的执行者与代理规则在组织上可指定（5.2.2 关键设计规则列的组织前提）]"
      delivery_space:                  # 骨架源：1.2.5 冲突矩阵（Serverless × 长时运行有状态流程）
