        - "[预扣记录的对账与泄漏巡检能力在案（5.2.2 关键设计规则列「防泄漏」的运维前提）]"
    envelope:
      - metric: "可观测性：追踪覆盖率"
        bound_expr: "可见性损失窗口 ≤ 预扣超时值 → 超时自动释放使窗口有界（4.6 示例二的下限合法性来源：预扣使超卖在存储层不可能 ∧ 可见性损失有界）"
        source: {source_type: clause_id, value: "4.6", verified: true}
      - metric: "延迟分位数 P99"
        bound_expr: "P99（预扣 + 确认/释放） = 两次本地原子操作之和 → 无跨单元事务协调开销，延迟界优于分布式提交形态（5.2.5 Σ 消费路径的两步特例）"
        source: {source_type: clause_id, value: "5.2.5", verified: true}
