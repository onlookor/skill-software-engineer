    envelope:
      - metric: "延迟分位数 P99"
        bound_expr: "Σ timeout_budget(path) ≤ sla_bound(path) ∧ ∀ 相邻级: t_downstream < t_upstream − propagation（5.5 Z4 逐字）→ P99(路径) 的上界由 SLA 上界给出，任一跳超时值上调须由其他跳下调或 SLA 上界放宽补偿（预算守恒）；母本未给数值 → 只登记界形与守恒关系（0.4）"
        source: {source_type: clause_id, value: "5.5", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "可用性(路径) 随超时值非单调：过短 → 正常长尾被误杀为失败（可用性下降）；过长 → 故障传播窗口拉长、在途占用累积（上游先耗尽资源）→ 存在使可用性最大的区间，其位置由实测传播延迟与长尾分布决定，母本未给 → 不填数值（0.4）"
        source: {source_type: clause_id, value: "5.2.3", verified: true}
      - metric: "性能：资源占用"
        bound_expr: "资源占用(等待期) = 并发在途请求数 × 超时时长 → 随超时时长线性不减；级联路径上各级同时持有等待占用 → 总占用随跳数（5.5 Z5 的 sync_chain_depth）单调不减"
        source: {source_type: clause_id, value: "5.2.3", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "触达单元数(Δ 任一级超时) ≥ 该级上游全体跳（预算守恒要求上游重算）+ SLA 论证登记处 → 随路径跳数单调不减；路径拓扑变更（增/减跳）触达面 = 全路径"
        source: {source_type: clause_id, value: "5.4", verified: true}
    cost_profile:
      latency_budget_delta: "Δlatency = 各级超时值本身构成路径延迟的**上界分配**而非附加开销（超时机制自身的判定开销可忽略）；其预算意义在于 5.2.5 Σ 消费路径：流程延迟预算 = Σ 各步骤卡片 latency_budget_delta + 步骤自身业务耗时，超 SLA → 冲突信号走 CH-C。本项按加和聚合（aggregation_semantics: additive，5.5 Z4 明文 Σ）。母本未给任何数值 → 只登记界形、守恒关系与聚合口径（0.4）"
      failure_modes: ["各级独立取默认超时（不逐级分配）→ Σ 超 SLA 上界，Z4 不闭合（5.6 示例一的成因面）", "下游超时 ≥ 上游超时 − 传播开销 → 上游先超时，下游工作成为无效负载且错误归因错乱（@2477 逐字界形违例）", "传播开销按便利常数估计而无实测 → Z4 降软 + 保守界，预算判定失去硬约束力（5.5 Z4 括注）", "超时后无处置面（无快速失败/降级/断路）→ 超时只界定延迟而不界定失败语义，调用方行为未定义", "重试最坏时长未计入 Σ → 预算表面闭合而实际不闭合（与 RLP-004 联动，5.6 示例一）", "路径拓扑变更（增跳/改级联）而预算未重算 → 僵尸超时配置（5.4 施→9 守护对象同型漂移）"]
      consistency_impact: "超时预算不改变一致性级别：它是延迟与失败判定的预算面，跨单元一致性仍由 CSL 条目与 Y6 约束决定；但超时触发点决定补偿/预扣的释放时机（CRD-008 的超时释放、5.2.2 compensable 的补偿窗口）→ 预算变更会改变中间状态的可见时长，须与数据契约新鲜度条款联动（CSL-002/004 侧承载）"
      observability_requires: ["各级实测耗时分布与传播延迟可观测（Z4 括注『可推翻指标 = 实测传播延迟』的取证面）", "超时触发率按级分列可观测（误杀与预算不足的分判据）", "路径 Σ timeout_budget 与 sla_bound 的闭合状态可机器求值（5.5 timeout_budget(path, allocations) 在册）", "质量影响卡片五字段齐备且被方面 6 消费可核验（Z7）"]
      ops_cost: "[随路径跳数与拓扑变更频率上升：每级超时值须实测核定、拓扑变更须重算全路径预算、超时告警须按级分列；高于重试（多一层路径级核算），低于舱壁（不引入独立资源池）]"   # 18-B S5 消费字段
      skill_prerequisites: ["路径拓扑与级联关系的显式建模（5.5 interaction_flow／timeout_budget 谓词的取证前提）", "传播开销的实测取样与 0.4 证据门槛判定（决定 Z4 取硬还是降软 + 保守界）", "预算守恒的逐级分配计算（下游超时 < 上游超时 − 传播开销）", "超时后处置面的选择（快速失败／降级／断路／纳入重试预算，与 RLP-004／RLP-006 联动）"]
      aggregation_semantics: additive  # 5.5 Z4 逐字以 Σ 表述（Σ timeout_budget(path) ≤ sla_bound(path)）＋5.2.5 Σ 消费路径 → 本项沿路径加和（与 RLP-004 同侧）
    compatibility:
      - peer_entry: RLP-004            # 5.6 示例一 @2598 逐字（SLA 上界 < 捕获重试的最坏时长）＋示例七 @2710『超时预算按 Z4 逐级分配』与重试同处一套落地清单 → 重试最坏时长是 Σ 的被加项（同批内双向登记）
        relation: composable
        evidence: {source_type: clause_id, value: "5.6", verified: true}
      - peer_entry: RLP-006            # @2477 逐字『断路器（失败率越阈时快速失败 + 半开探测）』→ 超时触发后的快速失败处置面由断路器承载；5.4 施→8『超时与断路行为测试』并列（同批内双向登记）
        relation: composable
        evidence: {source_type: clause_id, value: "5.4", verified: true}
      - peer_entry: RLP-007            # @2477 逐字『舱壁（线程/连接池按消费者隔离，防单点拖垮全局）』→ 池内排队等待是该级耗时的组成部分，须计入 Σ timeout_budget(path)；池饱和时的快速拒绝是预算耗尽的处置面之一（同批内双向登记，与 RLP-007 侧一致）
        relation: composable
        evidence: {source_type: clause_id, value: "5.2.3", verified: true}
      - peer_entry: CRD-003            # CRD-003 已登记『链深与超时分配可逐跳调整』（@2493）＋5.5 Z5 sync_chain_depth ≤ registered_max_depth → 同步调用链是本预算的主要适用路径（CRD-003 已发布 → 按 MJ-5 不回填）
        relation: composable
        evidence: {source_type: clause_id, value: "5.5", verified: true}
      - peer_entry: CRD-008            # 5.2.2 compensable 的补偿窗口与预扣超时释放由预算给出时机（CRD-008 已发布 → 不回填）
        relation: composable
        evidence: {source_type: clause_id, value: "5.2.2", verified: true}
    constraints_imposed:               # 交叉表源：5.4「施加约束」表（方面 5 全体七行，与 CRD/DFL 批逐字相同）
      - {target_aspect: 1, constraint: "协调需求在既定风格下不可行 → 回溯约束声明（CH-E 原型通道，阻塞式）", level: hard}
      - {target_aspect: 3, constraint: "协调模式产生的新交互 → 契约登记需求（编排者与参与者间的命令契约、事件契约）", level: hard}
      - {target_aspect: 4, constraint: "流程状态（协调者状态机、Saga 日志、预扣记录）是数据集合，受 Y1–Y8 全约束——流程状态的所有者 = 协调者单元", level: hard}
      - {target_aspect: 6, constraint: "质量影响卡片 → 行为级包络校验输入；卡片是方面 6 的强制消费项（Q 系列将引用）", level: hard}
      - {target_aspect: 8, constraint: "行为验证要求：事件回放、乱序/重复/丢失注入、补偿路径测试、超时与断路行为测试、（风格允许时）混沌注入", level: conditional}   # 5.4 级别列原文「软/硬按风格」；本条正对『超时与断路行为测试』一项；ENUM_LEVEL 无复合取值 → 取 conditional（MJ-4 同型判读）
      - {target_aspect: 9, constraint: "协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化", level: hard}
      - {target_aspect: 10, constraint: "机器层：Z 谓词集；人类层：覆盖谓词子集 {Z 谓词集} 的投影视图（受众问题 = 行为与协调的时序、事件流与流程状态；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: RLP-005-AP1
        description: "下游超时 ≥ 上游超时 − 传播开销（逐级分配界形违例）"
        detection_predicate: "∃ 相邻级 (u, d): t_d ≥ t_u − [传播开销](u, d)"
        signal_level: P0               # @2477 括号内逐字给出该界形（机制定义性判据）→ 违例即模式未按定义落地（MJ-4 判据第一支）；后果是上游先超时、下游工作成为无效负载
      - pattern_id: RLP-005-AP2
        description: "全链预算不闭合（Σ timeout_budget(path) > sla_bound(path)）"
        detection_predicate: "∃ path: Σ timeout_budget(path) > [SLA 上界](path)"
        signal_level: P1               # 5.5 Z4 为条件硬（过 0.4 门槛时为硬；否则降软 + 保守界）→ 门槛未过时不满足 MJ-4 的 P0 判据；但 5.6 示例一明记其为 CH-C 冲突信号源 → P1 限期整改（门槛已过时该信号按 Z4 硬性质升级 P0，MJ-4 判据）
      - pattern_id: RLP-005-AP3
        description: "传播开销与 SLA 上界无实测/无出处即取便利常数（Z4 被迫降软）"
        detection_predicate: "∃ path: ¬[propagation 有实测或过 0.4 门槛的估计](path) ∨ ¬[sla_bound 有出处](path)"
        signal_level: P1               # 直接触发 5.5 Z4 括注的降软分支（保守界）→ 硬约束力丧失属证据纪律偏离（0.4）而非性质违例 → P1（MJ-4 判据）
      - pattern_id: RLP-005-AP4
        description: "超时后无处置面（无快速失败/降级/断路，调用方行为未定义）"
        detection_predicate: "∃ 级: timeout_budget(·) 已登记 ∧ ¬[fallback](·) ∧ ¬[circuit_breaker](·)"
        signal_level: P1               # 5.4 施→8『超时与断路行为测试』要求超时行为可验证；处置面缺失使该验证无对象 → 选择纪律偏离，无 Z 硬性质可直接绑定 → P1（MJ-4 判据）
      - pattern_id: RLP-005-AP5
        description: "路径拓扑变更而预算未重算（僵尸超时配置）"
        detection_predicate: "∃ path: [拓扑已变更](path) ∧ ¬[Σ timeout_budget 已重算](path)"
        signal_level: P2               # 5.4 施→9『协调漂移守护对象：僵尸开关（expiry 超期）』同型漂移信号，须以阈值 + 趋势双判据核定 → P2（MJ-4 判据）
    formal_anchor:                     # 交叉表源：5.5 可验证性质（Z4 条件硬／Z5 软／Z7 升级型）
      - {property_id: Z4, role: implements}     # 5.5 Z4 逐字『超时预算闭合』（条件硬）＋@2477 括号内明文标 Z4 → 本条目是 Z4 的实现面（timeout_budget(path, allocations) 谓词在册）
      - {property_id: Z5, role: consumed_by}    # 5.5 Z5『sync_chain_depth(F) ≤ registered_max_depth』（软，P2 漂移信号）→ 链深决定 Σ 的被加项数，是预算规模的上游约束
      - {property_id: Z7, role: consumed_by}    # @2477 逐字『每条带质量影响卡片』＋5.2.5 Σ 消费路径 → 卡片交方面 6 做行为级包络校验（Z7 明文『超 SLA → 冲突信号走 CH-C』）
    references:
      - {bib_id: 46, support_claim: "5.2.3 断路器、舱壁、超时预算等稳定性模式（母本 5.7 书目 46 登记面逐字明列『超时预算』→ 本条机制内容的提取锚点）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-10-04 在线复核：官方 PDF 抽取页记 ISBN-13 978-1-68050-239-8／Book version P1.0—January 2018／作者 Michael T. Nygard，数字串与母本著录 978-1-680-50239-8 相同而连字符分组位置不同；书商页数两说 350 vs 376。差异据实登记入 MJ-24，不改写母本）"}
      - {bib_id: 51, support_claim: "5.2.3 可靠性模式的工程参照（超时与重试/断路的组合工程面）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-10-04 在线复核在位，页面标注 Last updated on 06/04/2026；母本 5.7 逐字『Retry/Circuit Breaker/Bulkhead 的机制内容以书目 46《Release It!》第 2 版为提取锚点』→ 本条机制内容以 @2477 明文与书目 46 为提取锚点，51 只作工程参照；compile_usage 依 5.7 逐字为 metadata_extraction，不得在注册表侧降级）"}
    narrative:
      benefit_cost_analysis: "收益：把『各跳自行取超时默认值』的隐式假设变为显式的预算分配问题，使 Z4 可机器求值（timeout_budget(path, allocations) 在册）——@2477 括号内给出两条界形：逐级关系（下游超时 < 上游超时 − 传播开销）与全链关系（Σ ≤ SLA 上界）。前者保证失败归因正确（下游先于上游超时，上游看到的是下游的明确失败而非自身等待耗尽），后者保证对外承诺可兑现。5.6 示例一逐字展示其价值：预算不闭合不是抽象风险，而是走查中可定位的具体冲突（SLA 要求的用户等待上界 < 捕获重试的最坏时长），并给出确定通道（CH-C）。代价：预算是守恒量——任一级放宽须由其他级收紧或 SLA 上界放宽补偿，故超时值的变更触达面是上游全体跳与 SLA 论证登记处，随路径跳数单调不减；预算的有效性依赖实测传播开销，未过 0.4 门槛时 Z4 降软 + 取保守界，约束力显著减弱；等待期资源占用随超时时长线性增长，过长超时把延迟问题转化为资源耗尽问题；拓扑每次变更都要求全路径重算，否则形成僵尸配置（5.4 施→9 守护对象同型）。母本未给任何数值（默认超时、传播开销、SLA 上界均未给）→ 一律只登记界形、守恒关系与聚合口径，数值须按实例经 0.4 门槛核定（0.4＋6.2.1）。"
      typical_scenarios: "同步调用链（CRD-003）的逐级超时分配；有对外 SLA/SLO 承诺的用户可见路径（5.4 接收约束方面 6 行『延迟预算、可用性目标、错误预算』）；含重试的路径（最坏重试时长须计入 Σ，5.6 示例一）；含预扣/预留的长流程（补偿窗口与超时释放时机由预算给出，CRD-008）；5.6 示例七 @2710『超时预算按 Z4 逐级分配（下游超时 < 上游超时 − 实测传播开销）』的成套落地场合；需要以方面 8『超时与断路行为测试』验证超时行为的场合（5.4 施→8）。"
      common_misuse: "各级独立取默认超时而不逐级分配（AP1／AP2，Z4 不闭合）；下游超时不小于上游超时减传播开销（AP1，@2477 界形违例）；以便利常数充当传播开销或 SLA 上界（AP3，Z4 被迫降软，0.4 证据门槛未过）；重试最坏时长不计入 Σ（与 RLP-004 联动失守，5.6 示例一）；超时后无处置面（AP4，超时只界定延迟不界定失败语义）；拓扑变更后不重算（AP5，僵尸超时配置）；把超时当作可用性手段而无视等待期资源占用线性增长；为超时值与传播开销填无出处数值（0.4＋6.2.1 量化纪律）。"

  - entry_id: RLP-006
    kind: RLP
    name: "断路器"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-RLP-01）
    provenance:
      origin: hybrid                   # 骨架=5.2.3 @2477 行内加粗清单项（括号内机制逐字：失败率越阈时快速失败 + 半开探测）；阈值参数化与谓词转写（manual，MJ-2 同型）
      source_pointers:
        - {source_type: clause_id, value: "5.2.3", verified: true}   # @2477 第六项「**断路器**（失败率越阈时快速失败 + 半开探测）」
        - {source_type: clause_id, value: "5.2.5", verified: true}   # 质量影响卡片五字段与 Σ 消费路径
        - {source_type: clause_id, value: "5.3", verified: true}     # 交付空间驱动：值班/on-call 能力 → 断路状态与恢复的处置前提
        - {source_type: clause_id, value: "5.4", verified: true}     # 施加约束方面 8 行（『超时与断路行为测试』逐字点名）＋方面 9 行（僵尸开关 expiry 超期）＋全体七行
        - {source_type: clause_id, value: "5.5", verified: true}     # Z4 条件硬（断路是超时预算的处置面）＋Z6（expiry 治理同型）＋Z7 升级型
        - {source_type: clause_id, value: "5.6", verified: true}     # 示例七 @2710『断路器＋舱壁限制故障扩散』
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.4", verified: true}     # 证据门槛：失败率阈值与统计窗口须有实测出处
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: 46, verified: true}
        - {source_type: bib_id, value: 51, verified: true}
    typical_reversibility: bounded     # 人工判断：阈值、统计窗口与半开探测参数属策略配置面可调整；但断路后的降级面（[fallback] 语义）一经对消费者承诺即形成依赖，撤销须协调消费者 → 取 bounded 而非 free。18-B S5 消费字段
    applicability:
      problem_space:                   # 骨架源：@2477 括号内机制逐字
        - "下游失败率可统计且失败会向上游传播（等待耗尽、资源占用累积）的调用点——@2477 逐字『失败率越阈时快速失败』"
        - "需要把故障限制在局部而非全局拖垮的场合（5.6 示例七 @2710『断路器＋舱壁限制故障扩散』）"
        - "存在可定义降级面的交互（快速失败后调用方有确定行为；无降级面时断路只是把超时失败提前）"
      current_space:                   # 交叉表源：5.4 施→8（断路行为测试）＋5.5 Z4 处置面
        - "[失败判定口径已在册（何为一次失败：超时、5xx、异常分类）——口径不明即失败率不可统计]"
        - "[失败率阈值与统计窗口有实测出处（未过 0.4 门槛即取保守值并登记为待推翻）]"
        - "[半开探测的放量策略已定（@2477 逐字含『半开探测』→ 缺失即机制不完整）]"
      delivery_space:                  # 交叉表源：5.3 交付空间驱动
        - "[值班能力可承载断路状态告警与恢复核定（长期开启须有 expiry 与清理登记，5.4 施→9 僵尸开关同型）]"
    envelope:
      - metric: "延迟分位数 P99"
        bound_expr: "断路开启时 P99(调用点) 的上界 = 断路判定开销（快速失败）→ 显著低于等待超时形态（RLP-005 的 t_timeout）；关闭态 P99 不变（仅增一次状态判定）→ 附加项恒 ≥ 0 且有界；母本未给数值 → 只登记界形与两态差异（0.4）"
        source: {source_type: clause_id, value: "5.2.3", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "可用性(上游) 不再被下游可用性支配（故障扩散被截断）→ 上游可用性上界提升；代价：被断路的下游功能可用性 = 0（无降级面时）或 = 降级面可用性 → 全局 SLO 的达成取决于降级面是否覆盖该功能的必要性"
        source: {source_type: clause_id, value: "5.6", verified: true}
      - metric: "性能：资源占用"
        bound_expr: "资源占用(等待期) 在断路开启时归零（不再持有在途等待）→ 占用上界由『阈值 × 统计窗口内的失败请求数』给出；关闭态增一份状态与计数占用（常数阶）"
        source: {source_type: clause_id, value: "5.2.3", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "触达单元数(Δ 阈值/窗口) = 调用方单元内 1（策略配置面）；触达单元数(Δ 降级面语义) ≥ 全体消费者单元（降级结果是对外可见行为，属契约面）→ 两类变更的触达面不同阶，须分别登记"
        source: {source_type: clause_id, value: "5.4", verified: true}
    cost_profile:
      latency_budget_delta: "Δlatency = 断路状态判定开销（关闭态与开启态均存在，常数阶）− 开启态免去的等待时长 → 关闭态恒 ≥ 0 且可忽略；开启态为负增量（快速失败早于超时），但该负增量的前提是降级面存在，否则只是把失败提前而非省下预算。本项按 5.2.5 Σ 消费路径逐步骤计入卡片，聚合按 itemwise（逐调用点成立，非路径加和量）。母本未给数值 → 只登记符号与两态界形（0.4）"
      failure_modes: ["失败判定口径不明（超时/5xx/业务异常混计）→ 失败率失真，断路误开或不开", "无半开探测 → 断路后不自动恢复，须人工介入（@2477 机制面缺失）", "半开探测放量过猛 → 下游未恢复即被再次打满（恢复期抖动）", "无降级面 → 快速失败成为对用户的裸失败，可用性收益不成立", "阈值与统计窗口无实测依据 → 断路成为噪声源（频繁开关）", "断路长期开启而无 expiry 与清理登记 → 功能永久降级成为既成事实（5.4 施→9 僵尸开关同型）", "以断路器替代根因整改 → 下游缺陷被常态化掩盖"]
      consistency_impact: "断路器不改变一致性级别；但断路点的选择决定长流程中哪一步成为失败点，进而决定补偿/重试路径（5.2.2 三分类：断路使该步成为 retriable 或触发 compensable）→ 断路须与流程步骤分类联动登记；被断路的写操作若已提交而响应丢失，其效果由消费侧幂等承担（Z2），断路不免除幂等义务"
      observability_requires: ["断路状态（关闭/开启/半开）与其转换时刻可观测且可告警", "失败率与统计窗口的实时值可观测（阈值核定的取证面）", "降级面被触发的次数与其结果可观测（可用性收益是否成立的判据）", "开启时长可观测（长期开启 = 僵尸开关信号，5.4 施→9）", "质量影响卡片五字段齐备且被方面 6 消费可核验（Z7）"]
      ops_cost: "[随被保护的调用点数上升：每处须核定失败口径、阈值、窗口与降级面，并维护状态告警与恢复核定；高于重试与超时预算（多一层状态机与降级面），与舱壁同级（后者多一层容量核定）]"   # 18-B S5 消费字段
      skill_prerequisites: ["失败判定口径的定义与异常分类（何为一次失败的注册）", "失败率阈值与统计窗口的实测核定（0.4 证据门槛）", "半开探测的放量策略设计（逐步放量而非全量试探）", "降级面设计（[fallback] 语义须对消费者可预期，属契约面）", "与 RLP-004 重试的联动核定（重试放大失败计数 → 阈值须按含重试的尝试次数计）"]
      aggregation_semantics: itemwise  # 逐调用点成立（断路状态是调用点局部状态，不沿路径加和）；其对路径 Σ 的影响经由各步骤卡片的 latency_budget_delta 在方面 6 侧汇入（5.2.5）
    compatibility:
      - peer_entry: RLP-007            # 5.6 示例七 @2710 逐字『断路器＋舱壁限制故障扩散』→ 两者成套落地（同批内双向登记）
        relation: composable
        evidence: {source_type: clause_id, value: "5.6", verified: true}
      - peer_entry: RLP-005            # 5.4 施→8 逐字『超时与断路行为测试』并列＋Z4 的处置面 → 超时触发后的快速失败由本模式承载（同批内双向登记）
        relation: composable
        evidence: {source_type: clause_id, value: "5.4", verified: true}
      - peer_entry: RLP-004            # 重试放大与快速失败互为处置面（@2477 同处一份可靠性清单）；失败计数口径须与重试联动 → 可组合但阈值核定相互约束（同批内双向登记）
        relation: composable
        evidence: {source_type: clause_id, value: "5.2.3", verified: true}
      - peer_entry: CRD-003            # 同步调用链是断路器的主要适用路径（失败沿链传播；CRD-003 已发布 → 按 MJ-5 镜像纪律不回填，0.22 承诺一）
        relation: composable
        evidence: {source_type: clause_id, value: "5.4", verified: true}
    constraints_imposed:               # 交叉表源：5.4「施加约束」表（方面 5 全体七行，与 CRD/DFL 批逐字相同）
      - {target_aspect: 1, constraint: "协调需求在既定风格下不可行 → 回溯约束声明（CH-E 原型通道，阻塞式）", level: hard}
      - {target_aspect: 3, constraint: "协调模式产生的新交互 → 契约登记需求（编排者与参与者间的命令契约、事件契约）", level: hard}
      - {target_aspect: 4, constraint: "流程状态（协调者状态机、Saga 日志、预扣记录）是数据集合，受 Y1–Y8 全约束——流程状态的所有者 = 协调者单元", level: hard}
      - {target_aspect: 6, constraint: "质量影响卡片 → 行为级包络校验输入；卡片是方面 6 的强制消费项（Q 系列将引用）", level: hard}
      - {target_aspect: 8, constraint: "行为验证要求：事件回放、乱序/重复/丢失注入、补偿路径测试、超时与断路行为测试、（风格允许时）混沌注入", level: conditional}   # 5.4 级别列原文「软/硬按风格」；本条正对『断路行为测试』一项；ENUM_LEVEL 无复合取值 → 取 conditional（MJ-4 同型判读）
      - {target_aspect: 9, constraint: "协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化", level: hard}
      - {target_aspect: 10, constraint: "机器层：Z 谓词集；人类层：覆盖谓词子集 {Z 谓词集} 的投影视图（受众问题 = 行为与协调的时序、事件流与流程状态；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: RLP-006-AP1
        description: "无半开探测（断路后不自动恢复，或恢复须人工重启）"
        detection_predicate: "∃ 调用点: [circuit_breaker](·) ∧ ¬[half_open](·)"
        signal_level: P0               # @2477 括号内逐字含『半开探测』→ 缺失即机制定义性判据缺失（MJ-4 判据第一支）；后果是断路成为需人工干预的停机面
      - pattern_id: RLP-006-AP2
        description: "无降级面即启用断路（快速失败成为对消费者的裸失败）"
        detection_predicate: "∃ 调用点: [circuit_breaker](·) ∧ ¬[fallback](·) ∧ [该调用点的失败对消费者不可预期]"
        signal_level: P1               # 5.4 施→3『新交互 → 契约登记需求』：降级结果是对外可见行为属契约面，未登记即契约缺口；无 Z 硬性质直接绑定 → P1（MJ-4 判据）
      - pattern_id: RLP-006-AP3
        description: "失败率阈值与统计窗口无实测出处（或失败判定口径混计）"
        detection_predicate: "∃ 调用点: [circuit_breaker](·) ∧ (¬[阈值有实测出处] ∨ ¬[失败判定口径已注册])"
        signal_level: P1               # 0.4 证据门槛偏离（阈值成为无出处数字）→ 证据纪律问题而非性质违例；后果是断路成为噪声源 → P1（MJ-4 判据）
      - pattern_id: RLP-006-AP4
        description: "断路长期开启而无 expiry 与清理登记（功能永久降级成为既成事实）"
        detection_predicate: "∃ G: [断路开启时长] > [登记上限] ∧ (¬declared([到期时刻](G)) ∨ now > [到期时刻](G)) ∧ ¬cleanup_filed"
        signal_level: P2               # 5.4 施→9 守护对象『僵尸开关（expiry 超期）』同型漂移信号（5.5 Z6 的判据形态借用于断路状态）；须以阈值 + 趋势双判据核定 → P2（MJ-4 判据）
      - pattern_id: RLP-006-AP5
        description: "断路状态与转换不可观测（无告警，恢复无从核定）"
        detection_predicate: "∃ 调用点: [circuit_breaker](·) ∧ ¬[状态与转换可观测](·)"
        signal_level: P2               # 5.2.5『observability_requires 未满足而模式已选用 = 选了但养不起』→ Z7 升级型的输入缺失；属可观测性漂移信号 → P2（MJ-4 判据）
    formal_anchor:                     # 交叉表源：5.5 可验证性质（Z4 条件硬／Z7 升级型）
      - {property_id: Z4, role: consumed_by}    # 5.5 Z4『Σ timeout_budget(path) ≤ sla_bound(path)』→ 断路是超时预算的处置面：开启态把该级的实际耗时收敛到判定开销，使 Σ 在故障期仍可闭合
      - {property_id: Z7, role: consumed_by}    # @2477 逐字『每条带质量影响卡片』＋5.2.5『observability_requires 未满足而模式已选用 = 选了但养不起』→ 卡片交方面 6 做行为级包络校验
    references:
      - {bib_id: 46, support_claim: "5.2.3 断路器、舱壁、超时预算等稳定性模式（母本 5.7 书目 46 登记面逐字明列『断路器』→ 本条机制内容的提取锚点）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-10-04 在线复核：官方 PDF 抽取页记 ISBN-13 978-1-68050-239-8／Book version P1.0—January 2018／作者 Michael T. Nygard，数字串与母本著录 978-1-680-50239-8 相同而连字符分组位置不同；书商页数两说 350 vs 376。差异据实登记入 MJ-24，不改写母本）"}
      - {bib_id: 51, support_claim: "5.2.3 可靠性模式的工程参照（2026-10-04 复核目录含 Circuit Breaker 条目；『Combine patterns』段明文 Pair Retry with Circuit Breaker——该段为书目侧陈述，不充当本注册表 compatibility 的母本依据）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-10-04 在线复核在位，页面标注 Last updated on 06/04/2026；母本 5.7 逐字『Retry/Circuit Breaker/Bulkhead 的机制内容以书目 46《Release It!》第 2 版为提取锚点』→ 本条机制内容以书目 46 为提取锚点，51 只作工程参照；compile_usage 依 5.7 逐字为 metadata_extraction，不得在注册表侧降级）"}
    narrative:
      benefit_cost_analysis: "收益：把『下游故障 → 上游等待耗尽 → 全局拖垮』的传播链在调用点截断——@2477 逐字给出两个机制要件：失败率越阈时快速失败、半开探测恢复。前者使故障期的延迟上界从 t_timeout 收敛到判定开销、等待期资源占用归零；后者使恢复不依赖人工介入。5.6 示例七 @2710 将其与舱壁并列为『限制故障扩散』的成套手段。代价：断路的可用性收益以降级面为前提——无 [fallback] 时快速失败只是把超时失败提前，对用户仍是失败，故降级语义属契约面（5.4 施→3），其变更触达全体消费者；阈值与统计窗口须实测核定，否则断路成为噪声源（频繁开关反而放大抖动）；失败判定口径必须先注册（超时/5xx/业务异常混计即失败率失真）；半开探测的放量策略不当会在恢复期二次打满下游；断路状态是新的可观测义务（5.2.5『选了但养不起』正对此项），且长期开启即僵尸开关（5.4 施→9 守护对象）。母本未给阈值、窗口与放量参数的任何数值 → 一律只登记机制要件、界形与两态差异，数值须按实例过 0.4 门槛（0.4＋6.2.1）。"
      typical_scenarios: "同步调用链上失败会沿链传播的调用点（CRD-003；5.6 示例七 @2710 成套落地）；下游过载或限流期需要保护上游资源的场合（与 RLP-004 重试互为处置：重试放大负载，断路截断负载）；超时触发后需要确定失败语义的场合（RLP-005 的处置面，5.4 施→8『超时与断路行为测试』）；有可定义降级面（缓存值、默认响应、功能降级）的交互；需要以方面 8 的断路行为测试与混沌注入验证故障隔离的场合（5.4 施→8）。"
      common_misuse: "无半开探测（AP1，@2477 机制要件缺失，恢复须人工介入）；无降级面即启用（AP2，快速失败成为裸失败，可用性收益不成立）；阈值与统计窗口取便利常数、失败口径混计（AP3，0.4 门槛未过 → 断路成为噪声源）；半开期全量放量（下游未恢复即被再次打满）；断路长期开启而无 expiry 与清理登记（AP4，功能永久降级成为既成事实，5.4 施→9）；断路状态不可观测（AP5，Z7 输入缺失，『选了但养不起』）；以断路器替代根因整改（下游缺陷被常态化掩盖）；把断路当作一致性手段（断路不免除 Z2 的幂等义务）；为阈值与窗口填无出处数值（0.4＋6.2.1 量化纪律）。"

  - entry_id: RLP-007
    kind: RLP
    name: "舱壁"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-RLP-01）
    provenance:
      origin: hybrid                   # 骨架=5.2.3 @2477 行内加粗清单项（括号内机制逐字：线程/连接池按消费者隔离，防单点拖垮全局）；池容量参数化与谓词转写（manual，MJ-2 同型）
      source_pointers:
        - {source_type: clause_id, value: "5.2.3", verified: true}   # @2477 第七项「**舱壁**（线程/连接池按消费者隔离，防单点拖垮全局）」
        - {source_type: clause_id, value: "5.2.5", verified: true}   # 质量影响卡片五字段与 Σ 消费路径
        - {source_type: clause_id, value: "5.3", verified: true}     # 交付空间驱动：容量核定与部署配置能力 → 池划分的运维前提
        - {source_type: clause_id, value: "5.4", verified: true}     # 施加约束方面 8 行（行为验证）＋方面 9 行（漂移守护）＋全体七行
        - {source_type: clause_id, value: "5.5", verified: true}     # Z1（消费者划分须与已建模交互一致）＋Z4 条件硬（池内排队纳入 Σ）＋Z7 升级型
        - {source_type: clause_id, value: "5.6", verified: true}     # 示例七 @2710『断路器＋舱壁限制故障扩散』
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.4", verified: true}     # 证据门槛：池容量与排队上限须有实测出处
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: 46, verified: true}
        - {source_type: bib_id, value: 51, verified: true}
    typical_reversibility: bounded     # 人工判断：池容量与排队上限属配置面可调整；但池划分一经与部署资源预留、容量核定和消费者绑定即形成结构性依赖（重新划分须重做核定并触及部署），且拒绝策略对消费者可见属契约面 → 取 bounded 而非 free。18-B S5 消费字段
    applicability:
      problem_space:                   # 骨架源：@2477 括号内机制逐字
        - "多个消费者共享同一线程/连接池，任一消费者的慢响应或故障会耗尽共享资源从而拖垮其余消费者的场合——@2477 逐字『线程/连接池按消费者隔离，防单点拖垮全局』"
        - "需要把故障限制在局部而非全局扩散的场合（5.6 示例七 @2710『断路器＋舱壁限制故障扩散』）"
        - "消费者之间的流量配比与重要性可区分，且可为其各自核定容量上限的场合"
      current_space:                   # 交叉表源：5.4 施→8（行为验证）＋5.5 Z1（交互已建模）
        - "[消费者划分已在册（隔离边界的依据 = 5.5 Z1 已显式建模的 inter_unit_interaction；未建模的交互无隔离边界可划）]"
        - "[各池容量与排队上限有实测出处（未过 0.4 门槛即取保守值并登记为待推翻）]"
        - "[池饱和时的拒绝策略已定（快速拒绝或有界排队；无处置面时舱壁只是把全局拖垮换成局部无界饥饿）]"
      delivery_space:                  # 交叉表源：5.3 交付空间驱动
        - "[部署与容量核定能力可承载按池预留资源（碎片化预留的运维成本）与饱和度告警]"
    envelope:
      - metric: "延迟分位数 P99"
        bound_expr: "P99(消费者 i) 的上界 = 该池排队等待 + 服务时长，且排队等待受该池排队上限约束（有界）→ 局部 P99 随该池饱和度上升；其余消费者的 P99 不受该池故障影响（外溢被阻止）→ 隔离使局部 P99 恶化而全局 P99 上界改善，非单调；母本未给数值 → 只登记界形与非单调性（0.4）"
        source: {source_type: clause_id, value: "5.2.3", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "单点故障被限制在其所属池内（@2477『防单点拖垮全局』）→ 全局可用性上界不再被最弱消费者支配；代价：被隔离消费者的可用性上界 = 其池容量可承载的吞吐上限（池满即拒绝）→ 全局 SLO 的达成取决于池划分与各池容量核定是否覆盖该消费者的必要性"
        source: {source_type: clause_id, value: "5.6", verified: true}
      - metric: "性能：资源占用"
        bound_expr: "每池独立预留 → 总预留 = Σ_i 池容量_i ≥ 共享池形态下的峰值需求（碎片化对价），且空闲池的预留不产生吞吐 → 资源占用上界由池划分给出而非由实际负载给出，整体利用率下降；占用随被隔离消费者数单调上升"
        source: {source_type: clause_id, value: "5.2.3", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "触达单元数(Δ 池容量/排队上限) = 该池配置面 1；触达单元数(Δ 池划分：新增或合并消费者) ≥ 容量核定处 + 部署与资源预留配置处 + 该消费者的调用方单元 → 划分变更与容量变更不同阶，须分别登记"
        source: {source_type: clause_id, value: "5.4", verified: true}
    cost_profile:
      latency_budget_delta: "Δlatency = 池内排队等待（该池饱和时 > 0，随饱和度上升，受排队上限约束）+ 池获取与归还开销（常数阶）→ 附加项恒 ≥ 0；隔离不缩短单请求服务时长，其收益体现为『其余消费者的 Δlatency 不因该池故障而上升』（外溢被阻止）。本项按 5.2.5 Σ 消费路径逐步骤计入卡片，聚合按 itemwise（逐池成立，非路径加和量）。母本未给数值 → 只登记符号与界形（0.4）"
      failure_modes: ["消费者划分与实际故障域不一致（隔离边界划在非故障传播路径上）→ 舱壁不承载隔离收益，只付出碎片化成本", "池容量与排队上限无实测依据 → 过小则正常流量被拒，过大则隔离形同共享", "池饱和后无拒绝策略（无界排队）→ 局部饥饿无界，全局拖垮被换成局部拖垮", "空闲池预留不可回收 → 总预留随消费者数上升而利用率下降（碎片化对价失控）", "池边界与部署/调度配置脱钩 → 拓扑或流量配比变更后池容量失真（5.4 施→9 漂移守护对象）", "以逻辑命名区分而物理共享同一池 → 隔离面不成立（AP1）", "舱壁被当作限流手段替代容量规划 → 峰值需求长期超出总预留"]
      consistency_impact: "舱壁不改变一致性级别；但池拒绝产生的失败点决定长流程中哪一步失败，进而决定补偿/重试路径（5.2.2 三分类：被拒绝的写操作是否已提交须可判定）→ 拒绝语义须与流程步骤分类联动登记；池隔离不免除幂等义务——被拒绝后重试的写操作仍由消费侧幂等承担（Z2）"
      observability_requires: ["各池的利用率、排队深度与拒绝次数可观测且可告警（容量核定的取证面）", "池边界与消费者的映射可核验（隔离面是否成立）", "各池容量核定依据可追溯（实测出处，0.4 门槛）", "总预留与实际峰值需求的差额可观测（碎片化对价是否失控）", "质量影响卡片五字段齐备且被方面 6 消费可核验（Z7）"]
      ops_cost: "[随被隔离的消费者数上升：每池须核定容量、排队上限与拒绝策略，并维护饱和度告警与容量复核定；与断路器同级（后者多一层状态机与降级面，本条多一层容量核定与部署绑定），高于超时预算（后者为单点配置）]"   # 18-B S5 消费字段
      skill_prerequisites: ["消费者划分与故障域识别（隔离边界须落在故障传播路径上）", "各池容量与排队上限的实测核定（0.4 证据门槛）", "拒绝策略设计（快速拒绝 vs 有界排队；与 RLP-005 超时预算、RLP-006 断路器联动）", "池预留与部署/调度配置的绑定（资源碎片化的容量规划能力）", "饱和度可观测面建设（利用率、排队深度、拒绝计数）"]
      aggregation_semantics: itemwise  # 逐池成立（池容量与饱和度是池的局部属性，不沿路径加和）；其对路径 Σ 的影响经由各步骤卡片的 latency_budget_delta（含池内排队）在方面 6 侧汇入（5.2.5）
    compatibility:
      - peer_entry: RLP-006            # 5.6 示例七 @2710 逐字『断路器＋舱壁限制故障扩散』→ 两者成套落地（同批内双向登记，与 RLP-006 侧一致）
        relation: composable
        evidence: {source_type: clause_id, value: "5.6", verified: true}
      - peer_entry: RLP-005            # 池内排队等待是该级耗时的组成部分 → 须纳入 Z4 的 Σ timeout_budget(path)；池饱和时的拒绝是超时预算的处置面之一（同批内双向登记）
        relation: composable
        evidence: {source_type: clause_id, value: "5.2.3", verified: true}
      - peer_entry: RLP-004            # 重试占用池配额 → 重试放大池饱和度，池容量核定须按含重试的尝试次数计（同批内双向登记）
        relation: composable
        evidence: {source_type: clause_id, value: "5.2.3", verified: true}
      - peer_entry: CRD-003            # 同步调用链是线程/连接池按消费者隔离的主要适用面（链上等待直接占用池资源；CRD-003 已发布 → 按 MJ-5 镜像纪律不回填，0.22 承诺一）
        relation: composable
        evidence: {source_type: clause_id, value: "5.4", verified: true}
    constraints_imposed:               # 交叉表源：5.4「施加约束」表（方面 5 全体七行，与 CRD/DFL 批逐字相同）
      - {target_aspect: 1, constraint: "协调需求在既定风格下不可行 → 回溯约束声明（CH-E 原型通道，阻塞式）", level: hard}
      - {target_aspect: 3, constraint: "协调模式产生的新交互 → 契约登记需求（编排者与参与者间的命令契约、事件契约）", level: hard}
      - {target_aspect: 4, constraint: "流程状态（协调者状态机、Saga 日志、预扣记录）是数据集合，受 Y1–Y8 全约束——流程状态的所有者 = 协调者单元", level: hard}
      - {target_aspect: 6, constraint: "质量影响卡片 → 行为级包络校验输入；卡片是方面 6 的强制消费项（Q 系列将引用）", level: hard}
      - {target_aspect: 8, constraint: "行为验证要求：事件回放、乱序/重复/丢失注入、补偿路径测试、超时与断路行为测试、（风格允许时）混沌注入", level: conditional}   # 5.4 级别列原文「软/硬按风格」；本条正对『混沌注入』与故障隔离验证一项；ENUM_LEVEL 无复合取值 → 取 conditional（MJ-4 同型判读）
      - {target_aspect: 9, constraint: "协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化", level: hard}
      - {target_aspect: 10, constraint: "机器层：Z 谓词集；人类层：覆盖谓词子集 {Z 谓词集} 的投影视图（受众问题 = 行为与协调的时序、事件流与流程状态；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: RLP-007-AP1
        description: "以逻辑命名区分消费者而物理共享同一线程/连接池（隔离面不成立）"
        detection_predicate: "∃ 消费者组: [bulkhead](·) ∧ ¬[池边界物理独立](·)"
        signal_level: P0               # @2477 括号内逐字『线程/连接池按消费者隔离』→ 物理共享即机制定义性判据缺失（MJ-4 判据第一支）；后果是声明的隔离收益完全不成立而碎片化成本已付出
      - pattern_id: RLP-007-AP2
        description: "池饱和后无拒绝策略（无界排队）"
        detection_predicate: "∃ 池: [bulkhead](·) ∧ ¬[排队上限已登记](·) ∧ ¬[快速拒绝](·)"
        signal_level: P1               # 无 Z 硬性质直接绑定，但池内排队无界使 Z4 的 Σ timeout_budget 无法闭合（5.5 Z4 条件硬的上游前提缺失）→ 契约与预算面缺口 → P1（MJ-4 判据）
      - pattern_id: RLP-007-AP3
        description: "池容量与排队上限无实测出处（或消费者划分与实际故障域不一致）"
        detection_predicate: "∃ 池: [bulkhead](·) ∧ (¬[容量有实测出处] ∨ ¬[划分依据 = 已建模交互](·))"
        signal_level: P1               # 0.4 证据门槛偏离＋5.5 Z1『inter_unit_interaction: explicitly_modeled』的边界依据缺失 → 证据与建模纪律问题而非性质违例 → P1（MJ-4 判据）
      - pattern_id: RLP-007-AP4
        description: "池划分与部署/容量核定脱钩，流量配比或拓扑变更后未重算（长期漂移）"
        detection_predicate: "∃ 池: [拓扑或流量配比快照] ≠ [池容量核定所依据的快照] ∧ ¬[重算登记]"
        signal_level: P2               # 5.4 施→9 协调漂移守护对象同型（须以阈值 + 趋势双判据核定）→ P2（MJ-4 判据）
      - pattern_id: RLP-007-AP5
        description: "池利用率、排队深度与拒绝次数不可观测（容量核定与饱和告警无从取证）"
        detection_predicate: "∃ 池: [bulkhead](·) ∧ ¬[利用率与拒绝计数可观测](·)"
        signal_level: P2               # 5.2.5『observability_requires 未满足而模式已选用 = 选了但养不起』→ Z7 升级型的输入缺失；属可观测性漂移信号 → P2（MJ-4 判据）
    formal_anchor:                     # 交叉表源：5.5 可验证性质（Z1 硬／Z4 条件硬／Z7 升级型）
      - {property_id: Z1, role: consumed_by}    # 5.5 Z1『∀ inter_unit_interaction: explicitly_modeled ∧ ∃C ∈ registry: covers(C,·,·)』→ 舱壁的隔离边界按消费者划分，消费者即已建模的交互单元；未显式建模的交互无隔离边界可划（AP3 第二支的依据）
      - {property_id: Z4, role: consumed_by}    # 5.5 Z4『Σ timeout_budget(path) ≤ sla_bound(path)』→ 池内排队等待是该级耗时的组成部分，须计入 Σ；无界排队（AP2）使 Σ 无法闭合
      - {property_id: Z7, role: consumed_by}    # @2477 逐字『每条带质量影响卡片』＋5.2.5『observability_requires 未满足而模式已选用 = 选了但养不起』→ 卡片交方面 6 做行为级包络校验
    references:
      - {bib_id: 46, support_claim: "5.2.3 断路器、舱壁、超时预算等稳定性模式（母本 5.7 书目 46 登记面逐字明列『舱壁』→ 本条机制内容的提取锚点）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-10-04 在线复核：官方 PDF 抽取页记 ISBN-13 978-1-68050-239-8／Book version P1.0—January 2018／作者 Michael T. Nygard，数字串与母本著录 978-1-680-50239-8 相同而连字符分组位置不同；书商页数两说 350 vs 376。差异据实登记入 MJ-24，不改写母本）"}
      - {bib_id: 51, support_claim: "5.2.3 可靠性模式的工程参照（2026-10-04 复核目录含 Bulkhead 条目）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-10-04 在线复核在位，页面标注 Last updated on 06/04/2026；母本 5.7 逐字『Retry/Circuit Breaker/Bulkhead 的机制内容以书目 46《Release It!》第 2 版为提取锚点』→ 本条机制内容以书目 46 为提取锚点，51 只作工程参照；compile_usage 依 5.7 逐字为 metadata_extraction，不得在注册表侧降级）"}
    narrative:
      benefit_cost_analysis: "收益：把『单个消费者的慢响应或故障耗尽共享线程/连接池 → 拖垮其余全部消费者』的传播路径在资源层截断——@2477 逐字给出机制要件（线程/连接池按消费者隔离）与其目的（防单点拖垮全局）。隔离后，任一池的饱和与故障只影响该池对应的消费者，其余消费者的延迟与可用性不再被最弱消费者支配；5.6 示例七 @2710 将其与断路器并列为『限制故障扩散』的成套手段（断路器在调用点截断传播，舱壁在资源层截断传播）。代价：碎片化——每池独立预留使总预留 = Σ 池容量 ≥ 共享池形态下的峰值需求，空闲池的预留不产生吞吐，整体利用率下降；池划分是结构性决策，与部署资源预留和容量核定绑定，重新划分须重做核定（typical_reversibility: bounded）；拒绝策略对消费者可见，属契约面（5.4 施→3）；池内排队等待须计入 Z4 的 Σ timeout_budget，无界排队会使预算无法闭合；池饱和度是新的可观测义务（5.2.5『选了但养不起』正对此项），划分依据还须回溯 Z1 已建模的交互（否则隔离边界划在非故障传播路径上，只付成本不获收益）。母本未给池容量、排队上限与预留比例的任何数值 → 一律只登记机制要件、界形与对价方向，数值须按实例过 0.4 门槛（0.4＋6.2.1）。"
      typical_scenarios: "多租户或多消费者共享同一后端连接池、其中任一消费者可能慢响应的场合（@2477 逐字面）；同步调用链上等待直接占用线程资源的调用点（CRD-003；5.6 示例七 @2710 与断路器成套落地）；需要为高优先级消费者保住容量、防止低优先级流量挤占的场合（池划分即优先级表达）；批量任务与在线请求混部而须隔离资源以免批量拖垮在线的场合；需要以方面 8 的混沌注入验证故障隔离边界的场合（5.4 施→8）。"
      common_misuse: "以逻辑命名区分而物理共享同一池（AP1，@2477 机制要件缺失，隔离面不成立）；池划分与实际故障域不一致（边界划在非传播路径上 → 只付碎片化成本）；池容量与排队上限取便利常数（AP3，0.4 门槛未过 → 过小误拒、过大形同共享）；池饱和后无界排队（AP2，全局拖垮被换成局部无界饥饿，且 Z4 的 Σ 无法闭合）；无拒绝语义登记即启用（拒绝是对外可见行为，属契约面）；池划分与部署配置脱钩、流量变更后不重算（AP4，5.4 施→9 漂移）；利用率与拒绝计数不可观测（AP5，Z7 输入缺失）；以舱壁替代容量规划与限流（峰值长期超出总预留）；把舱壁当作一致性手段（不免除 Z2 的幂等义务）；为池容量填无出处数值（0.4＋6.2.1 量化纪律）。"

