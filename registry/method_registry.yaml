      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "触达单元数(Δ 幂等键口径) ≥ 生产者单元 + 全体消费者单元：键口径是跨单元契约条款（5.4 接收约束方面 3 行『投递语义是契约条款』同型）→ 随消费者数单调不减"
        source: {source_type: clause_id, value: "5.4", verified: true}
    cost_profile:
      latency_budget_delta: "Δlatency = 幂等键计算 + 去重状态查询（去重表读写或窗口查询），置于业务效果生效之前 → 恒 ≥ 0，随去重状态规模单调不减（@2477 括号内机制『幂等键 + 去重表/去重窗口』的界形）。具体数值母本未给 → 只登记界形、符号与单调性，不填无出处数字（0.4）"
      failure_modes: ["幂等键口径不稳定（同一业务事实产生不同键）→ 去重失效，业务效果重复", "去重判定与业务写不在同一本地事务 → 崩溃窗口内出现『业务已写、去重未记』或反向（RLP-002 收件箱为此而设）", "去重窗口短于上游最坏重投递间隔 → 超窗重投递不再被吸收（与 RLP-004 的重试策略联动）", "去重表无清理策略 → 存储无界增长（性能：资源占用族）", "以中间件 exactly-once 配置替代消费侧幂等声明（@2479 明文『非中间件魔法』→ Z2 违例）"]
      consistency_impact: "去重状态（幂等键 + 去重表/窗口）是数据集合，其所有者 = 消费者单元（5.4 施→4 同型）；本模式**不提升**跨单元一致性级别——它使 at-least-once 投递在效果上等价于恰好一次（5.5 delivery_semantics 的 effectively_once 取值），级别声明仍归方面 4 的 CSL 条目，跨所有者强一致需求仍为 Y6 冲突信号；键口径变更属契约条款变更（5.4 接收约束方面 3 行 → X1）"
      observability_requires: ["同键命中次数（重复投递检出率）可观测——幂等面是否在实际吸收重复的判据", "去重表深度与最旧记录时龄可观测（窗口口径与清理策略的核验面）", "delivery_semantics 与 idempotency(I, mechanism) 在注册表登记可查（Z2 的机器判定面）"]
      ops_cost: "[随消费者数与被去重的业务事实数上升：每处消费者一份去重状态的部署、清理与告警；高于无幂等面（多一类状态存储与清理治理），低于 RLP-002 收件箱形态（不要求去重与业务写同事务的事务设计）]"   # 18-B S5 保守界消费字段
      skill_prerequisites: ["幂等键口径设计（从业务事实稳定导出且跨单元一致）", "去重窗口长度与上游最坏重投递间隔的匹配核定（联动 RLP-004）", "去重状态的清理、容量与所有权治理（5.4 施→4／Y1）"]
      aggregation_semantics: itemwise  # 幂等是逐交互成立的性质（5.5 Z2 的 ∀ async interaction 逐条判定），不沿路径加和；与 DFL-001 同值
    compatibility:
      - peer_entry: RLP-002            # @2477 首两项同列一处清单：收件箱＝『消费侧去重与业务写同事务』，是幂等的一种落地形态 → 可组合（同批内双向登记，另一侧见 RLP-002）
        relation: composable
        evidence: {source_type: clause_id, value: "5.2.3", verified: true}
      - peer_entry: RLP-004            # 方向：重试 → 幂等（5.2.2 三分类纪律 retriable 逐字『幂等 + 暂时性失败假设成立，重试至成功』→ 重试以幂等为前提）。ENUM_RELATION 无 required_by → 在被施侧以 composable 登记，要求侧 RLP-004 登记 requires（MJ-22 (iii)／DFL-001 @5107 同型）
        relation: composable
        evidence: {source_type: clause_id, value: "5.2.2", verified: true}
      - peer_entry: RLP-003            # 5.6 示例七逐字『幂等键＋inbox/outbox（赔付捕获的有效恰好一次语义，Z2 必答）』→ 生产侧发件箱与消费侧幂等成套落地
        relation: composable
        evidence: {source_type: clause_id, value: "5.6", verified: true}
      - peer_entry: CRD-005            # 5.2.2 三分类纪律 compensable 逐字『存在语义逆操作，补偿已设计且幂等』→ 补偿操作的幂等由本模式承载（CRD-005 已发布 → 按 MJ-5 镜像纪律不回填，0.22 承诺一）
        relation: composable
        evidence: {source_type: clause_id, value: "5.2.2", verified: true}
      - peer_entry: STY-003            # 5.4 接收约束方面 1 行『事件驱动 → 协同默认』＋@2479 纪律针对每条异步交互 → 事件驱动风格下本模式为消费侧标配（STY-003 已发布 → 不回填）
        relation: composable
        evidence: {source_type: clause_id, value: "5.4", verified: true}
    constraints_imposed:               # 交叉表源：5.4「施加约束」表（方面 5 全体七行，与 CRD/DFL 批逐字相同）
      - {target_aspect: 1, constraint: "协调需求在既定风格下不可行 → 回溯约束声明（CH-E 原型通道，阻塞式）", level: hard}
      - {target_aspect: 3, constraint: "协调模式产生的新交互 → 契约登记需求（编排者与参与者间的命令契约、事件契约）", level: hard}
      - {target_aspect: 4, constraint: "流程状态（协调者状态机、Saga 日志、预扣记录）是数据集合，受 Y1–Y8 全约束——流程状态的所有者 = 协调者单元", level: hard}
      - {target_aspect: 6, constraint: "质量影响卡片 → 行为级包络校验输入；卡片是方面 6 的强制消费项（Q 系列将引用）", level: hard}
      - {target_aspect: 8, constraint: "行为验证要求：事件回放、乱序/重复/丢失注入、补偿路径测试、超时与断路行为测试、（风格允许时）混沌注入", level: conditional}   # 5.4 级别列原文「软/硬按风格（事件驱动 → 回放与乱序注入必备，承接 1.4）」；ENUM_LEVEL 无复合取值 → 取 conditional（MJ-4 同型判读）
      - {target_aspect: 9, constraint: "协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化", level: hard}
      - {target_aspect: 10, constraint: "机器层：Z 谓词集；人类层：覆盖谓词子集 {Z 谓词集} 的投影视图（受众问题 = 行为与协调的时序、事件流与流程状态；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: RLP-001-AP1
        description: "投递语义 ≠ at-most-once 而消费者未声明幂等机制（含以中间件 exactly-once 配置替代声明）"
        detection_predicate: "∃ I, c: delivery_semantics(I, at_least_once) ∧ [c 为 I 的消费者] ∧ ¬idempotency(c, ·)"
        signal_level: P0               # 5.5 Z2 硬（semantics ≠ at_most_once → idempotency_declared(consumer)）＋@2479『未声明 = Z2 违例』→ P0（MJ-4 判据；与 DFL-001-AP3 同型）
      - pattern_id: RLP-001-AP2
        description: "幂等键不由业务事实稳定导出（以消息 ID／投递序号充当键，重投递携新 ID 即失效）"
        detection_predicate: "∃ I: idempotency(I, ·) ∧ ¬[键由业务事实导出 ∧ 生产侧与消费侧口径一致]"
        signal_level: P0               # 键口径失效即 Z2 的 idempotency_declared 形同虚设（声明在案而效果不成立）→ 绑定 Z2 硬性质，P0（MJ-4 判据）
      - pattern_id: RLP-001-AP3
        description: "去重窗口短于上游最坏重投递间隔，或去重判定与业务写跨事务"
        detection_predicate: "∃ I: idempotency(I, [dedup_window]) ∧ ([窗口长度] < [上游最坏重投递间隔] ∨ ¬[去重与业务写在同一本地事务内提交])"
        signal_level: P1               # 偏离 @2477 机制面的选择纪律，但无 Z 系列硬性质可直接绑定（Z2 只要求 declared）→ P1 限期整改（MJ-4 判据）
      - pattern_id: RLP-001-AP4
        description: "去重表无清理策略与堆积告警（深度与最旧记录时龄不可观测）"
        detection_predicate: "∃ I: idempotency(I, [dedup_table]) ∧ ¬[清理策略已登记] ∧ ¬[深度/最旧记录时龄可观测]"
        signal_level: P2               # 不构成 4.5/5.5 性质违例，而是「性能：资源占用」族的漂移信号（须以阈值 + 趋势双判据核定）→ P2（MJ-4 判据；与 DFL-001-AP4 同型）
    formal_anchor:                     # 交叉表源：5.5 可验证性质（Z2 硬／Z7 升级型）
      - {property_id: Z2, role: implements}     # 5.5 Z2 逐字『投递语义与幂等必答』（硬）→ 本模式是 Z2 的消费侧实现面
      - {property_id: Z7, role: consumed_by}    # @2477 逐字『注册表条目（每条带质量影响卡片）』＋5.2.5 卡片消费路径 → 卡片交方面 6 做行为级包络校验
      - {property_id: X1, role: consumed_by}    # 5.4 接收约束方面 3 行『投递语义是契约条款』→ 键口径与投递语义进入契约注册
    references:
      - {bib_id: 44, support_claim: "5.2.3 消息与协调模式词汇表（幂等消费与去重的原始分类面；5.7 书目 44 登记面逐字明列 5.2.3）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-10-04 在线复核：作者官网记 with Bobby Woolf／ISBN 0321200683〔ISBN-10 形态〕／2003, Addison-Wesley，数字串与母本著录 978-0-321-20068-6 一致；本地 EPUB 自述 isbn13 9780133065091 的差异仍归 G-DFL-1.route 裁决口④／SO-11，开放，本批不裁决）"}
      - {bib_id: 51, support_claim: "5.2.3 可靠性模式的工程参照（2026-10-04 复核目录另含 Idempotent Consumer 条目：Handle duplicate message deliveries so that processing a message multiple times has the same effect as processing it once）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-10-04 在线复核在位，页面标注 Last updated on 06/04/2026；母本 5.7 逐字『Retry/Circuit Breaker/Bulkhead 的机制内容以书目 46《Release It!》第 2 版为提取锚点』→ 本条（幂等）的机制内容以 @2477 母本明文与书目 44 词汇面为提取锚点，51 只作工程参照；compile_usage 依 5.7 逐字为 metadata_extraction，不得在注册表侧降级）"}
    narrative:
      benefit_cost_analysis: "收益：把 at-least-once 投递的重复副作用消解为可判定的去重问题——@2479 明文的『有效恰好一次』（幂等消费达成的效果等价）只能由本模式达成，中间件配置不提供（『非中间件魔法』）；Z2 因此从『必答』变为『可机器验证』（idempotency_declared(consumer)）；上游得以自由采用重试（RLP-004）而不担心效果重复，5.2.2 三分类的 compensable 与 retriable 两类步骤均以幂等为前提。代价：每次处理前增一次键计算与去重状态查询（延迟附加项恒 ≥ 0，随状态规模单调不减）；每消费者一份去重状态成为新的数据集合，须登记所有权（Y1）、清理策略与容量（性能：资源占用族）；键口径是跨单元契约条款，变更须生产侧与全体消费侧同步（可修改性族的触达单元数随消费者数单调不减）；去重窗口短于最坏重投递间隔即失效，窗口口径须与上游重试策略联动核定；去重状态不可用时幂等判定不可得，可用性收紧为 min（消费者, 去重存储）。母本未给任何量化增量 → 一律只登记界形与单调性（0.4）。"
      typical_scenarios: "at-least-once 投递的消费侧（4.2.4 发件箱行第四列『投递语义 at-least-once → 消费者幂等（Z2 联动）』；5.6 示例七『幂等键＋inbox/outbox（赔付捕获的有效恰好一次语义，Z2 必答）』）；含 retriable 或 compensable 步骤的 Saga（5.2.2 三分类纪律逐字以幂等为条件）；关键步（pivot）之后的重试路径（5.2.2：关键步之后全部可重试 → 重试以幂等为前提）；去重与业务写可置于同一本地事务时升级为 RLP-002 收件箱形态。"
      common_misuse: "以中间件 exactly-once 配置替代消费侧幂等声明（AP1，@2479『非中间件魔法』；Z2 违例）；以消息 ID 或投递序号充当幂等键（AP2，重投递可携新 ID → 去重失效）；去重窗口按便利设定而不核对上游最坏重投递间隔（AP3）；去重表无清理与堆积告警（AP4，资源占用漂移）；把幂等当作跨单元强一致手段（Y6 冲突信号不因本模式消解，级别声明归 CSL 条目）；去重状态未登记所有权即被多方直写（Y1/Y2）；为 Δdedup 填无出处数值（0.4＋6.2.1 量化纪律）。"

  - entry_id: RLP-002
    kind: RLP
    name: "收件箱（inbox）"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-RLP-01）
    provenance:
      origin: hybrid                   # 骨架=5.2.3 @2477 行内加粗清单项（消费侧去重与业务写同事务）＋界形参数化与谓词转写（manual，MJ-2 同型）
      source_pointers:
        - {source_type: clause_id, value: "5.2.3", verified: true}   # @2477 第二项「**收件箱（inbox）**（消费侧去重与业务写同事务）」
        - {source_type: clause_id, value: "5.2.5", verified: true}   # 质量影响卡片五字段与 Σ 消费路径
        - {source_type: clause_id, value: "5.3", verified: true}     # 交付空间驱动：值班/on-call 能力 → failure_modes 运维前提
        - {source_type: clause_id, value: "5.4", verified: true}     # 施加约束方面 4 行（收件箱表是数据集合，所有者 = 消费者单元）＋全体七行
        - {source_type: clause_id, value: "5.5", verified: true}     # Z2 硬＋ idempotency/delivery_semantics 谓词
        - {source_type: clause_id, value: "5.6", verified: true}     # 示例七：幂等键＋inbox/outbox 成套落地（Z2 必答）
        - {source_type: clause_id, value: "4.2.4", verified: true}   # 发件箱行的消费侧对应面（同一清单内成对出现）
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: 44, verified: true}
        - {source_type: bib_id, value: 51, verified: true}
    typical_reversibility: bounded     # 人工判断：收件箱表可停用且无数据搬迁，但事务边界设计（业务写与去重同事务）一经投产即成为消费者写路径的既有事实，回退须重设事务边界 → 取 bounded（与 RLP-001 同值同型）。18-B S5 消费字段
    applicability:
      problem_space:                   # 骨架源：@2477 第二项括号内机制逐字
        - "消费侧去重须与业务写原子生效的场合（@2477 机制逐字『消费侧去重与业务写同事务』）——消除 RLP-001 中『业务已写、去重未记』的崩溃窗口"
        - "投递语义 ≠ at-most-once 且业务效果不可重复的消费者（5.5 Z2 硬；@2479『有效恰好一次』的效果等价由本形态在单库事务内达成）"
      current_space:                   # 交叉表源：5.4 施→4（收件箱表是数据集合）＋4.2.4 定义面同型前提
        - "[收件箱表与业务表同库同存储实例，去重写入与业务写可由同一本地事务覆盖（不成立即退化为 RLP-001 的跨事务去重）]"
        - "[收件箱表已登记所有权（= 消费者单元）与清理策略（5.4 施→4：受 Y1–Y8 全约束）]"
      delivery_space:                  # 交叉表源：5.3 交付空间驱动
        - "[事务内额外读写带来的锁竞争与吞吐影响可被现有容量吸收（值班能力可承载清理作业与堆积告警）]"
    envelope:
      - metric: "延迟分位数 P99"
        bound_expr: "P99(消费处理) ≥ P99(业务写单独) + Δinbox：去重判定与业务写在同一本地事务内 → 事务持锁时长增加，附加项恒 ≥ 0 且随收件箱表深度单调不减；母本未给量化增量 → 只登记界形与单调性（0.4）"
        source: {source_type: clause_id, value: "5.2.3", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "可用性(消费处理) = 业务表可用性 ∧ 收件箱表可用性（同事务 → 任一侧不可用即处理失败）→ 可用性上界不优于业务写单独形态；换取的收益是重复副作用被原子吸收（Z2 的效果面）"
        source: {source_type: clause_id, value: "5.2.3", verified: true}
      - metric: "性能：资源占用"
        bound_expr: "资源占用 = 每消费者 1 张收件箱表 + 每消息 1 次事务内读写 → 存储随已处理消息数同阶增长；清理策略给出表深度上界（未登记清理策略即无上界）"
        source: {source_type: clause_id, value: "5.2.3", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "触达单元数(Δ 去重口径) = 消费者单元内 1（同事务内闭合，不外溢至生产侧）→ 优于 RLP-001 的跨单元键口径变更（后者的触达单元数随消费者数单调不减）"
        source: {source_type: clause_id, value: "5.4", verified: true}
    cost_profile:
      latency_budget_delta: "Δlatency = 事务内去重读写（收件箱表插入/查询）+ 由此增加的事务持锁时长 → 恒 ≥ 0，随表深度与并发单调不减（@2477『消费侧去重与业务写同事务』的界形）。具体数值母本未给 → 只登记界形、符号与单调性，不填无出处数字（0.4）"
      failure_modes: ["收件箱表与业务表不同库/不同事务 → 机制前提消失，退化为 RLP-001 的跨事务去重（崩溃窗口重现）", "收件箱表无清理策略 → 存储无界增长（性能：资源占用族）", "事务内额外读写放大锁竞争 → 消费吞吐下降、积压上升（消息可见延迟无上界）", "以收件箱替代投递语义声明 → 5.2.3『未声明 = Z2 违例』不因本机制免除", "同事务内混入跨单元调用（远程调用置于事务内）→ 持锁时长受下游延迟支配，Z4 预算与事务边界互相侵蚀"]
      consistency_impact: "收件箱表是数据集合，其所有者 = 消费者单元（5.4 施→4 同型）；本模式把去重状态与业务状态的一致性收束到**单库本地事务**内，不提升跨单元一致性级别（跨所有者强一致需求仍为 Y6 冲突信号，级别声明归 CSL 条目）；对上游而言投递语义仍为 at-least-once，效果等价由消费侧承担（5.5 delivery_semantics 的 effectively_once）"
      observability_requires: ["收件箱表深度与最旧记录时龄可观测（清理策略与堆积的核验面）", "同事务内去重命中率可观测（重复投递是否被吸收的判据）", "消费积压与处理时延可观测（锁竞争放大时的早期信号）"]
      ops_cost: "[随消费者数与消息量上升：每处消费者一张收件箱表的部署、清理作业与堆积告警；高于 RLP-001（多一类事务内写路径与清理作业），低于生产侧发件箱 + 中继（不引入常驻中继作业）]"   # 18-B S5 消费字段
      skill_prerequisites: ["以本地事务边界判定机制前提是否成立（收件箱表与业务表是否同库同实例）", "事务内读写与锁竞争的容量核定（含不得在事务内引入远程调用）", "收件箱表的清理与保留期治理（保留期须覆盖最坏重投递间隔）"]
      aggregation_semantics: itemwise  # 逐消费者成立（同 RLP-001：Z2 的 ∀ async interaction 逐条判定），不沿路径加和
    compatibility:
      - peer_entry: RLP-001            # @2477 首两项同列一处清单：本模式是幂等在同事务约束下的落地形态 → 可组合（同批内双向登记，另一侧见 RLP-001）
        relation: composable
        evidence: {source_type: clause_id, value: "5.2.3", verified: true}
      - peer_entry: RLP-003            # 5.6 示例七逐字『幂等键＋inbox/outbox（赔付捕获的有效恰好一次语义，Z2 必答）』→ 消费侧收件箱与生产侧发件箱成套落地
        relation: composable
        evidence: {source_type: clause_id, value: "5.6", verified: true}
      - peer_entry: DFL-001            # 4.2.4 发件箱行第四列『投递语义 at-least-once → 消费者幂等（Z2 联动）』→ 生产侧发件箱的重复投递由消费侧收件箱吸收（DFL-001 已发布 → 按 MJ-5 镜像纪律不回填）
        relation: composable
        evidence: {source_type: clause_id, value: "4.2.4", verified: true}
      - peer_entry: STY-003            # 5.4 接收约束方面 1 行『事件驱动 → 协同默认』＋1.4 施→4 事件驱动行『事件日志为一等数据模型』→ 事件驱动风格下的消费侧标配（STY-003 已发布 → 不回填）
        relation: composable
        evidence: {source_type: clause_id, value: "5.4", verified: true}
    constraints_imposed:               # 交叉表源：5.4「施加约束」表（方面 5 全体七行，与 CRD/DFL 批逐字相同）
      - {target_aspect: 1, constraint: "协调需求在既定风格下不可行 → 回溯约束声明（CH-E 原型通道，阻塞式）", level: hard}
      - {target_aspect: 3, constraint: "协调模式产生的新交互 → 契约登记需求（编排者与参与者间的命令契约、事件契约）", level: hard}
      - {target_aspect: 4, constraint: "流程状态（协调者状态机、Saga 日志、预扣记录）是数据集合，受 Y1–Y8 全约束——流程状态的所有者 = 协调者单元", level: hard}
      - {target_aspect: 6, constraint: "质量影响卡片 → 行为级包络校验输入；卡片是方面 6 的强制消费项（Q 系列将引用）", level: hard}
      - {target_aspect: 8, constraint: "行为验证要求：事件回放、乱序/重复/丢失注入、补偿路径测试、超时与断路行为测试、（风格允许时）混沌注入", level: conditional}   # 5.4 级别列原文「软/硬按风格（事件驱动 → 回放与乱序注入必备，承接 1.4）」；ENUM_LEVEL 无复合取值 → 取 conditional（MJ-4 同型判读）
      - {target_aspect: 9, constraint: "协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化", level: hard}
      - {target_aspect: 10, constraint: "机器层：Z 谓词集；人类层：覆盖谓词子集 {Z 谓词集} 的投影视图（受众问题 = 行为与协调的时序、事件流与流程状态；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: RLP-002-AP1
        description: "收件箱表与业务写不在同一本地事务（跨库或跨服务），却声称达成有效恰好一次"
        detection_predicate: "∃ c: idempotency(c, [inbox]) ∧ ¬[收件箱写与业务写在同一本地事务内提交]"
        signal_level: P0               # @2477 把『与业务写同事务』写进机制定义 → 定义性判据缺失即机制不成立，其后果正是 Z2 要求吸收的重复副作用 → P0（MJ-4 判据；与 DFL-001-AP1 同型）
      - pattern_id: RLP-002-AP2
        description: "以收件箱机制替代投递语义声明（未在注册表登记 delivery_semantics）"
        detection_predicate: "∃ I: [I 为经收件箱消费的异步交互] ∧ ¬declared(delivery_semantics(I))"
        signal_level: P0               # @2479 明文『未声明 = Z2 违例』＋5.5 Z2 列为硬 → P0（MJ-4 判据；与 DFL-001-AP2 同型）
      - pattern_id: RLP-002-AP3
        description: "在收件箱事务内引入跨单元远程调用（持锁时长受下游延迟支配）"
        detection_predicate: "∃ c, t: idempotency(c, [inbox]) ∧ [t 为该消费者的本地事务] ∧ ∃ call ∈ t: [call 为跨单元远程调用]"
        signal_level: P1               # 侵蚀 @2477 的同事务前提并联动 Z4 预算（超时值进入事务持锁时长），但 Z 系列无直接硬性质可绑定 → P1 限期整改（MJ-4 判据）
      - pattern_id: RLP-002-AP4
        description: "收件箱表无清理策略与保留期核定（表深度与最旧记录时龄不可观测）"
        detection_predicate: "∃ c: idempotency(c, [inbox]) ∧ ¬[清理策略与保留期已登记] ∧ ¬[表深度/时龄可观测]"
        signal_level: P2               # 「性能：资源占用」族的漂移信号（须以表深度阈值 + 趋势双判据核定）→ P2（MJ-4 判据；与 DFL-001-AP4 同型）
    formal_anchor:
      - {property_id: Z2, role: implements}     # 5.5 Z2『投递语义与幂等必答』（硬）→ 本模式是 Z2 在消费侧的原子化实现面（@2477『消费侧去重与业务写同事务』）
      - {property_id: Y1, role: consumed_by}    # 5.4 施→4：收件箱表是数据集合 → 受 Y1「单一所有者」检查（所有者 = 消费者单元）
      - {property_id: Z7, role: consumed_by}    # @2477『每条带质量影响卡片』＋5.2.5 卡片消费路径 → 卡片交方面 6 做行为级包络校验
    references:
      - {bib_id: 44, support_claim: "5.2.3 消息与协调模式词汇表（收件箱/去重的消费侧原始分类面；5.7 书目 44 登记面逐字明列 5.2.3）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-10-04 在线复核：作者官网记 ISBN 0321200683〔ISBN-10 形态〕，数字串与母本著录一致；本地 EPUB 自述 isbn13 9780133065091 的差异仍归 G-DFL-1.route 裁决口④／SO-11，开放，本批不裁决）"}
      - {bib_id: 51, support_claim: "5.2.3 可靠性模式的工程参照（消费侧去重与 Idempotent Consumer 条目的工程实现面）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-10-04 在线复核在位；母本 5.7 逐字载明 Retry/Circuit Breaker/Bulkhead 的机制内容以书目 46 为提取锚点 → 本条机制内容以 @2477 母本明文为提取锚点，51 只作工程参照，compile_usage 不得在注册表侧降级）"}
    narrative:
      benefit_cost_analysis: "收益：把去重判定与业务写收束进同一本地事务，消除 RLP-001 跨事务形态的崩溃窗口（『业务已写、去重未记』或反向）——@2479 的『有效恰好一次』因此在单库事务内可证成；去重口径变更闭合在消费者单元内（触达单元数 = 1），不外溢为跨单元契约变更；与生产侧发件箱（RLP-003/DFL-001）成套即 5.6 示例七的落地形态。代价：事务持锁时长增加（延迟附加项恒 ≥ 0，随表深度与并发单调不减），消费吞吐受锁竞争约束；可用性收束为业务表 ∧ 收件箱表（同事务 → 任一侧不可用即处理失败），不优于业务写单独形态；每消费者一张收件箱表带来存储与清理治理面，保留期须覆盖上游最坏重投递间隔；机制前提强（同库同实例），不成立即退化；事务内不得引入远程调用，否则持锁时长受下游延迟支配并与 Z4 预算互相侵蚀。母本未给量化增量 → 一律只登记界形与单调性（0.4）。"
      typical_scenarios: "投递语义为 at-least-once 且业务效果不可重复的消费侧（4.2.4 发件箱行第四列 Z2 联动；5.6 示例七赔付捕获）；消费者已有单库本地事务边界、收件箱表可与业务表同库部署的场合（@2477 机制前提）；与生产侧发件箱成套落地以达成有效恰好一次的场合（5.6 示例七『幂等键＋inbox/outbox』）；去重口径需在消费者单元内独立演化的场合（触达单元数 = 1，对比 RLP-001 的跨单元键口径）。"
      common_misuse: "收件箱表跨库/跨服务却声称有效恰好一次（AP1，@2477 同事务前提缺失）；以机制存在替代 delivery_semantics 声明（AP2，@2479『未声明 = Z2 违例』）；在收件箱事务内做远程调用（AP3，持锁时长受下游支配）；收件箱表无清理与保留期核定（AP4，资源占用漂移）；保留期短于上游最坏重投递间隔（超期重投递不再被吸收）；把收件箱当作跨单元一致性手段（Y6 冲突信号不消解）；为 Δinbox 填无出处数值（0.4＋6.2.1 量化纪律）。"

  - entry_id: RLP-003
    kind: RLP
    name: "发件箱（outbox）"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-RLP-01）
    provenance:
      origin: hybrid                   # 骨架=5.2.3 @2477 行内加粗清单项（生产侧，4.2.4 已定义，行为面消费其投递语义）＋界形参数化与谓词转写（manual，MJ-2 同型）
      source_pointers:
        - {source_type: clause_id, value: "5.2.3", verified: true}   # @2477 第三项「**发件箱（outbox）**（生产侧，4.2.4 已定义，行为面消费其投递语义）」＋@2479 投递语义登记纪律
        - {source_type: clause_id, value: "4.2.4", verified: true}   # 定义面出处（DFL-001 承载；本条目只登记行为面，判读见块头注）
        - {source_type: clause_id, value: "5.2.5", verified: true}   # 质量影响卡片五字段与 Σ 消费路径
        - {source_type: clause_id, value: "5.4", verified: true}     # 接收约束方面 3 行「投递语义是契约条款」＋施加约束全体七行
        - {source_type: clause_id, value: "5.5", verified: true}     # Z2 硬＋ delivery_semantics/quality_impact_card 谓词
        - {source_type: clause_id, value: "5.6", verified: true}     # 示例七：幂等键＋inbox/outbox 成套落地（Z2 必答）
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: 44, verified: true}
        - {source_type: bib_id, value: 51, verified: true}
    typical_reversibility: bounded     # 人工判断：行为面（卡片、幂等/重试/去重纪律）可随投递语义声明一并修订，但已按 at-least-once 建成的消费侧幂等面属既有事实（与 DFL-001 同值同型）。18-B S5 消费字段
    applicability:
      problem_space:                   # 骨架源：@2477 第三项括号内逐字（生产侧；行为面消费其投递语义）
        - "生产侧可靠发布的**行为面**：投递语义声明、质量影响卡片、消费侧幂等/去重纪律（@2477 逐字『生产侧，4.2.4 已定义，行为面消费其投递语义』）"
        - "定义面（业务写与事件写同本地事务、异步中继投递）归 DFL-001，本条目不重复登记定义面界形（0.17.1：条目为准；重叠处置见块头注与 MJ-24）"
      current_space:                   # 交叉表源：DFL-001 定义面前提＋5.4 接收约束方面 3 行
        - "[DFL-001 的机制前提已成立（发件箱表与业务表同库同事务、异步中继可部署且堆积可观测）——本条目 requires DFL-001]"
        - "[投递语义已按 5.5 谓词词汇登记为 delivery_semantics(interaction, at_least_once)，且消费侧幂等前提已声明（Z2 硬；@2479 未声明 = 违例）]"
      delivery_space:                  # 交叉表源：5.3 交付空间驱动
        - "[消费侧可承载去重状态（RLP-001/002）的部署与清理运维能力在案——at-least-once 的义务面落在消费者]"
    envelope:                          # 只登记**行为面**界形；定义面界形见 DFL-001（不重复计入，避免与 DFL-001 双重计数）
      - metric: "延迟分位数 P99"
        bound_expr: "P99(端到端) = Δrelay（定义面，见 DFL-001）+ Σ 消费侧卡片 latency_budget_delta（去重判定等，RLP-001/002）+ 消费处理耗时 → 按 5.2.5 Σ 消费路径加和；本条目只登记消费侧附加项，不重复登记 Δrelay（0.17.1 条目为准）"
        source: {source_type: clause_id, value: "5.2.5", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "可用性(有效恰好一次效果) = min(生产侧中继可用性, 消费侧幂等面可用性) → 任一侧缺失即 at-least-once 退化为可重复副作用（5.5 Z2 硬）；生产侧业务写可用性 ⊥ 中间件可用性属定义面（DFL-001），本条目不重复登记"
        source: {source_type: clause_id, value: "5.2.3", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "触达单元数(Δ 投递语义声明) ≥ 生产者单元 + 全体消费者单元：投递语义是契约条款（5.4 接收约束方面 3 行『投递语义是契约条款』）→ 变更须同步至消费侧幂等面，随消费者数单调不减"
        source: {source_type: clause_id, value: "5.4", verified: true}
    cost_profile:
      latency_budget_delta: "行为面 Δlatency = 消费侧去重判定（RLP-001 的 Δdedup 或 RLP-002 的 Δinbox）+ 投递语义声明与卡片登记的治理开销（非运行时项）→ 运行时附加项恒 ≥ 0；生产侧 Δrelay 归 DFL-001 定义面，本字段不重复计入（避免双重计数）。具体数值母本未给 → 只登记界形与符号（0.4）"
      failure_modes: ["生产侧已用发件箱而消费侧无幂等面 → 重复投递的业务效果重复（Z2 违例；@2477『行为面消费其投递语义』的义务面缺失）", "投递语义未显式声明即上线（@2479『未声明 = Z2 违例』）", "以中间件 exactly-once 声称替代消费侧幂等（@2479『后者仅指有效恰好一次……非中间件魔法』）", "行为面与定义面分裂登记 → 质量影响卡片缺项，Z7 的行为级包络校验出现盲区（5.2.5『质量预算旁路』漏洞形态）", "把发件箱当作跨单元强一致手段（Y6 冲突信号不消解，级别声明归 CSL 条目）"]
      consistency_impact: "行为面不改变一致性级别：生产侧写一致性由本地事务保证（定义面，DFL-001），跨单元仍为最终一致（1.2.3 事件驱动行『最终一致为默认』）；重复投递的效果等价性由消费侧幂等承担（Z2）→ 登记为 effectively_once 时其含义仅是效果等价（@2479 逐字）；投递语义作为契约条款进入 X1（5.4 接收约束方面 3 行）"
      observability_requires: ["投递语义声明与消费侧幂等机制在注册表登记可查（Z2 的机器判定面）", "重复投递率与消费侧去重命中率可观测（行为面是否在吸收重复的判据）", "质量影响卡片五字段齐备且被方面 6 消费可核验（Z7 的『card consumed_by(aspect6)』）"]
      ops_cost: "[行为面运维增量 = 消费侧去重状态的部署与清理（RLP-001/002）+ 投递语义与卡片的登记治理；生产侧发件箱表与常驻中继作业的运维成本归 DFL-001，本条目不重复计入]"   # 18-B S5 消费字段
