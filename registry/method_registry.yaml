    typical_reversibility: free      # 人工判断：同 STY-020/021（改选/重跑匹配无结构性回退代价；0.18.3 纪律 3 禁止静默重跑）
    applicability:
      problem_space:                 # 母本「适用条件」列给的不是三空间触发条件，而是执行位序与强制性 → 位序在此登记为条件、强制性落 constraints_imposed（块头通用说明六）
        - "[作为 STY-020/021/022/023 的子步骤统一执行（母本原文『作为以上各方法的子步骤统一执行』；无独立触发的三空间条件 → G-STY-1）]"
      current_space: []
      delivery_space:
        - "[执行者为 Agent（母本原文『对 Agent 是强制步骤（纪律一）』→ 使用者为 Agent 时本步骤不可省略，0.10 权力条款同旨）]"
    envelope: []                     # 剖面豁免：kind_profile_STY.entry_level_exemptions（STY-020…STY-024，check C-ENV）
    cost_profile:
      latency_budget_delta: "不适用（元方法不进入运行时路径，无延迟项）；运行时面由被匹配的风格条目承载"   # MJ-11
      failure_modes: ["问题特征向量含未过出处门槛的事实（0.4 → FM-1 证据缺口，该事实须剔除；剔除致决策不可达 → FM-3）", "适用条件谓词的缺失值按『假』处理 → 沉默排除幻觉（0.18.2 S1 明示『未知 ≠ 假』：事实缺失时标 unknown，候选保留并附勘察义务）", "以匹配度排序替代包络判定与批准（跳过 S4 三值判定与 S5 不可区分处置 → 假精确；跳过纪律二批准 → V5 违例）", "候选非来自注册表条目（开放生成 → 纪律一违例，防幻觉第一守卫失效）", "不可区分时按名义分择一（|Δscore| ≤ 传导不确定区间 → 母本明示禁止，须走 CH-B 三择）"]   # 五项人工判断（前两项源自 S1 判定纪律，第三/五项源自 S4/S5，第四项源自纪律一原文）
      consistency_impact: "不适用（无运行时一致性面）；匹配产出的风格组合决定一致性形态，属方面 4 输入"   # MJ-11
      observability_requires: ["逐候选 applicability 求值记录可查（哪些谓词真/假/未知，未知项附勘察义务）", "问题特征向量逐条带出处可查（0.4）", "匹配度得分、权重及其来源可查（6.2.3：外部指定权重无带宽；业务推导权重 ±20%）", "不可区分判定结果与 CH-B 三择裁决留痕"]
      ops_cost: "[无独立运维面；成本落在问题特征向量的装配与出处核验、适用条件谓词的求值记录维护]"
      skill_prerequisites: ["问题特征向量装配（三空间事实 + 出处门槛）", "适用条件谓词求值与三值记录（真/假/未知，禁沉默排除）", "匹配度排序与不可区分判定（|Δscore| ≤ 传导不确定区间，0.18.2 S5）"]
      aggregation_semantics: itemwise
    compatibility:
      - {peer_entry: STY-020, relation: composable, evidence: "1.2.4 @1391 典型链『质量属性驱动 → 模式匹配排序』：本条为链中后继（镜像登记于 STY-020）"}
      - {peer_entry: STY-023, relation: composable, evidence: "1.2.4 @1391 典型链『模式匹配排序 → 演进式落地』：本条为链中前驱（镜像登记于 STY-023）"}
    constraints_imposed:
      - {target_aspect: 1, constraint: "对 Agent 为强制步骤（纪律一，@1312）：每一个候选必须来自方法注册表中登记的风格条目（带适用条件元数据），**禁止开放生成**；每一个入选/落选必须引用三空间事实（公理 A2）", level: hard}
      - {target_aspect: 1, constraint: "匹配度排序不得替代规程其余步骤：不得增步、跳步、改序、在步骤内引入规程外判据（0.18.3 纪律 1，规程偏离 = FM-14）；排序结果仍须过 S4 包络校验、S5 不可区分处置与纪律二批准", level: hard}
      - {target_aspect: 10, constraint: "机器层：逐候选求值记录与得分入 selection_log / step_log（偏离检测 = 步骤序列 vs 规程 schema 静态比对）；人类层：排序表与被拒候选须可投影（ADR 被拒候选节引用）", level: hard}
    anti_patterns: []                # 母本 1.2.4 表无「典型反模式」列（块头通用说明一）；纪律一违例（开放生成）为规程级守护对象，不在本条目重复登记（禁造规范）
    formal_anchor:
      - {property_id: V5, role: triggers}     # 风格定案属高影响决策（纪律二）；V3 的登记位见块头通用说明七
    references: []                   # 母本未给本行登记提取面：书目 12/13 的登记面分别限定于「质量属性驱动的风格选择元方法（1.2.4）」与「演进式元方法（1.2.4）」；书目 1 的登记面为 1.2.1 词汇表；均不含模式匹配。候选书目 2（登记面「风格对比与架构决策方法」，未限定行）母本未指向 1.2.4 → 不擅自扩张解释面（M6）；与 STY-021 同登记为文献缺口 → gaps: G-STY-5
    narrative:
      benefit_cost_analysis: "收益：把风格选择变成可机器执行的匹配问题——问题特征向量 × 各风格条目的适用条件谓词 → 匹配度排序，使『候选从何而来』有唯一合法答案（注册表条目），从而封死 Agent 凭训练语料流行度自由提案的路径；这也是纪律一（防幻觉第一守卫）在方法层的执行形态。作为其他四个元方法的子步骤统一执行，它让约束排除、质量属性驱动、领域驱动、演进式的候选筛选共用同一套求值与留痕机制。代价：结论质量完全取决于两个输入面——特征向量的事实必须过出处门槛，适用条件谓词必须可求值；谓词所需事实缺失时只能标 unknown（候选保留 + 勘察义务），因此本方法常产出『待定』而非『定案』；匹配度排序不是可达性判定，包络校验（S4）与批准（纪律二）一步都省不掉；权重带不确定区间，得分接近时禁止按名义分择一。"
      typical_scenarios: "任何风格选型决策点（0.18.1 全覆盖）的候选装配与排序、Agent 执行的选型（强制步骤）、作为 @1391 典型链的第三步（属性求交后的匹配度排序）、需要为 ADR 被拒候选节提供逐候选求值记录的场合、注册表条目扩充后的候选面复核（0.17.6 种子重验证联动）。"
      common_misuse: "开放生成候选或引入注册表外风格（纪律一违例）；把 unknown 当 false 处理造成沉默排除（S1 明示『未知 ≠ 假』）；特征向量混入无出处事实（FM-1）；以匹配度最高即定案（跳过 S4/S5 与纪律二批准）；得分差在传导不确定区间内仍按名义分择一（假精确，须走 CH-B 三择）；在步骤内引入规程外判据或改序（FM-14）。"

