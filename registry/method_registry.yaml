    narrative:
      benefit_cost_analysis: "收益：各单元自治演进、无中央单点，可用性界由 ∧ 参与者给出而单调优于编排形态（5.2.1 质量影响列「耦合度低」）；事件驱动风格下为默认协调形态（5.4 接收约束方面 1 行），无需额外引入中央组件。代价：可观测性分散，追踪覆盖率上界受跨单元追踪链可拼接性限制，无分布式追踪能力时不可运维（硬降权）；流程隐式化，故障定位与合规留痕均无集中落点；每条异步交互必须声明投递语义且消费端声明幂等（Z2 硬），事件契约的多方订阅使逆转须协调全部消费者；常态化承担事件回放与乱序/重复/丢失注入的验证成本（5.4 施→8：事件驱动 → 必备）。"
      typical_scenarios: "事件驱动（发布订阅）风格下的跨单元协作（5.4 接收约束方面 1 行：事件驱动 → 协同默认）；步骤少而各单元演进节奏独立的场合；无需集中留痕的域（合规域外的开放域）；单元数多而交互稀疏的分布形态。"
      common_misuse: "以协同承载步骤多或需集中留痕的流程（AP2，流程隐式化不可维护）；异步交互不声明投递语义或消费端不声明幂等（Z2 违例，AP1）；无分布式追踪能力即上线协同流程（可观测性分散无补偿手段）；以隐式时序假设替代显式建模（Z1 违例，5.4 施→9 守护对象）；把「无编排者」误读为「无流程状态」（有本地流程状态者仍受 5.4 施→4 全约束）。"

  - entry_id: CRD-003
    kind: CRD
    name: "同步调用链"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-CRD-01）
    provenance:
      origin: hybrid                   # 骨架=5.2.1 表行＋界形参数化与谓词转写（manual，MJ-2 同型）
      source_pointers:
        - {source_type: row_id, value: "5.2.1-同步调用链", verified: true}
        - {source_type: clause_id, value: "5.2.1", verified: true}
        - {source_type: clause_id, value: "5.2.5", verified: true}
        - {source_type: clause_id, value: "5.3", verified: true}
        - {source_type: clause_id, value: "5.4", verified: true}
        - {source_type: clause_id, value: "5.5", verified: true}     # Z1/Z4/Z5/Z7 与 timeout_budget 谓词来源
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "0.14", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: 44, verified: true}
    typical_reversibility: bounded     # 人工判断：链深与超时分配可逐跳调整而不改动单元职责与数据归属，逆转成本有界（改动面限于调用方超时配置与链路拓扑）
    applicability:
      problem_space:                   # 骨架源：5.2.1「适用条件」列原文
        - "调用方需即时结果、链路短且时序确定的跨单元交互（5.2.1 适用条件列）"
        - "[请求-响应语义足以表达交互且无需异步解耦（5.2.1 质量影响列：延迟可预算）]"
      current_space:                   # 骨架源：5.4 接收约束方面 1 行＋方面 3 行
        - "同步请求-响应通信风格在案（5.4 接收约束方面 1 行：风格决定协调可行集）"
        - "[链上各跳的注册契约在案（5.4 接收约束方面 3 行：每条跨单元交互有注册契约，投递语义是契约条款，硬）]"
      delivery_space:                  # 骨架源：5.4 接收约束方面 6 行（延迟预算、可用性目标、错误预算）
        - "[链上各跳的延迟预算与超时值可观测（Z4 条件硬界的度量前提）]"
        - "[链深注册上限的漂移观测能力在案（Z5 软界为 P2 信号，需阈值 + 趋势双判据）]"
    envelope:
      - metric: "延迟分位数 P99"
        bound_expr: "Σ timeout_budget（path） ≤ sla_bound（path） ∧ ∀ 相邻级: t_downstream < t_upstream − propagation（Z4 逐字界形）→ 链延迟按跳加和，超时预算必须闭合且不得倒挂"
        source: {source_type: clause_id, value: "5.5", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "可用性（链） = Π 各跳可用性 → 单调不增于链深（每增一跳乘一因子），链深是可用性的直接决定量"
        source: {source_type: row_id, value: "5.2.1-同步调用链", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "sync_chain_depth（F） ≤ registered_max_depth（Z5 软界） → 链深越阈为 P2 漂移信号，越阈 + 趋势上升双判据方告警"
        source: {source_type: clause_id, value: "5.5", verified: true}
    cost_profile:
      latency_budget_delta: "= Σ 各步骤卡片 latency_budget_delta + 各跳网络与序列化开销（5.2.5 明文：每个行为/协调模式条目必须携带卡片；同步链的延迟按跳严格加和）"
      failure_modes: ["超时预算不闭合或相邻级倒挂（Z4 违例，上游先超时 → 重试风暴）", "链深越注册上限（Z5 软界，可用性乘积下降 + 变更触达面扩大）", "调用方阻塞等待导致线程/连接资源耗尽（同步语义的固有面）", "链上某跳无注册契约（X1 违例，5.4 接收约束方面 3 行）"]
      consistency_impact: "不引入流程状态（无协调者状态机、无 Saga 日志）→ 5.4 施→4 的流程状态所有权条款在本条目上无落点；跨单元一致性由调用方按返回码处置，各单元本地一致性级别声明不变（CSL 批不重复承载）"
      observability_requires: ["逐跳延迟与超时值可观测（Z4 界的度量前提）", "链深可度量且与注册上限可比（Z5 漂移信号的前提）", "跨单元追踪链贯通（同步链的追踪覆盖率天然较高，5.2.1 质量影响列）"]
      ops_cost: "[随链深上升；须承担超时值治理与链深漂移观测的常态成本（Z4/Z5）]"
      skill_prerequisites: ["超时预算分配（逐跳递减与传播余量，Z4）", "链深治理与注册上限登记（Z5）", "同步调用的断路与降级设计（5.4 施→8 超时与断路行为测试）"]
      aggregation_semantics: additive  # 5.2.5 Σ 消费路径：逐跳延迟严格加和
    compatibility:
      - peer_entry: STY-001
        relation: requires
        evidence: {source_type: row_id, value: "5.2.1-同步调用链", verified: true}   # 定义列以同步请求-响应为界面 → 本条目须以同步请求-响应通信风格为前提（kind_profile_CRD.narrative.note 明文：compatibility 须登记对上游 STY 条目的 requires 关系）
    constraints_imposed:               # 交叉表源：5.4「施加约束」表（方面 5 全体七行，CRD 八条逐字相同）
      - {target_aspect: 1, constraint: "协调需求在既定风格下不可行 → 回溯约束声明（CH-E 原型通道，阻塞式）", level: hard}
      - {target_aspect: 3, constraint: "协调模式产生的新交互 → 契约登记需求（编排者与参与者间的命令契约、事件契约）", level: hard}
      - {target_aspect: 4, constraint: "流程状态（协调者状态机、Saga 日志、预扣记录）是数据集合，受 Y1–Y8 全约束——流程状态的所有者 = 协调者单元", level: hard}
      - {target_aspect: 6, constraint: "质量影响卡片 → 行为级包络校验输入；卡片是方面 6 的强制消费项（Q 系列将引用）", level: hard}
      - {target_aspect: 8, constraint: "行为验证要求：事件回放、乱序/重复/丢失注入、补偿路径测试、超时与断路行为测试、（风格允许时）混沌注入", level: conditional}   # 5.4 级别列原文「软/硬按风格（事件驱动 → 回放与乱序注入必备，承接 1.4）」；本条目为同步形态 → 超时与断路行为测试在本条目上取硬，事件回放项不适用（MJ-4 同型判读）
      - {target_aspect: 9, constraint: "协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化", level: hard}
      - {target_aspect: 10, constraint: "机器层：Z 谓词集；人类层：覆盖谓词子集 {Z 谓词集} 的投影视图（受众问题 = 行为与协调的时序、事件流与流程状态；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: CRD-003-AP1
        description: "链深超注册上限而无漂移观测（越阈 + 趋势双判据缺失）"
        detection_predicate: "∃ F: interaction_flow(F, ·, sync_chain) ∧ [F 的链深 > registered_max_depth] ∧ [链深趋势上升]"
        signal_level: P2               # Z5 软性质（sync_chain_depth(F) ≤ registered_max_depth）→ P2 漂移信号，须阈值 + 趋势双判据方告警（MJ-4 P2 判据，母本 5.5 Z5 明文）
      - pattern_id: CRD-003-AP2
        description: "超时预算不闭合或相邻级超时倒挂"
        detection_predicate: "∃ p: timeout_budget(p, ·) ∧ (¬[Σ timeout_budget（p） ≤ sla_bound（p）] ∨ ∃ 相邻级: ¬[t_downstream < t_upstream − propagation])"
        signal_level: P1               # Z4 为条件硬性质（有 SLA 声明时生效）→ 无硬性质违例的无条件来源，取 P1（MJ-4 判据：违反风格定义性约束但无硬性质可绑定）
    formal_anchor:
      - {property_id: Z5, role: implements}      # 链深不越注册上限（软界，漂移信号）
      - {property_id: Z1, role: implements}      # 跨单元交互显式建模（链上各跳有注册契约）
      - {property_id: Z4, role: consumed_by}     # 超时预算闭合界消费本条目的逐跳超时分配
      - {property_id: Z7, role: consumed_by}     # 卡片被方面 6 消费且不得违反包络
    references:
      - {bib_id: 44, support_claim: "同步请求-响应通道与调用链的原始分类面（母本登记提取面）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
    narrative:
      benefit_cost_analysis: "收益：调用方获得即时结果，语义最简、无需引入中央协调组件或事件基础设施；追踪覆盖率天然较高（同步链逐跳可串接，5.2.1 质量影响列）；不产生流程状态，5.4 施→4 的所有权约束无落点，治理面最小。代价：可用性按 Π 各跳单调不增于链深，链深成为可用性与变更触达面的直接决定量（Z5 软界）；超时预算必须逐跳闭合且相邻级不得倒挂（Z4 条件硬），治理不当即上游先超时引发重试风暴；调用方阻塞等待占用线程/连接资源，长链路下资源耗尽风险上升；链深与超时值的调整虽为有界逆转，但须以注册上限登记与漂移观测为前提。"
      typical_scenarios: "查询类跨单元交互（调用方需即时结果）；链路短且时序确定的场合（5.2.1 适用条件列）；同步请求-响应风格已定案的项目（5.4 接收约束方面 1 行）；无需异步解耦且不产生长流程状态的交互。"
      common_misuse: "以同步调用链承载长流程或多分支流程（应回溯方面 5 选型，AP2 同型风险）；超时值逐跳等值设置或倒挂（Z4 违例，AP2）；链深增长无注册上限与漂移观测（Z5 违例，AP1）；链上某跳无注册契约即上线（X1 违例，5.4 接收约束方面 3 行）；以重试替代断路设计（5.4 施→8 超时与断路行为测试缺项）。"

