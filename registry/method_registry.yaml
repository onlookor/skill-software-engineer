        evidence: {source_type: row_id, value: "5.4-方面 1（风格）", verified: true}   # 接收约束方面 1 行「单体 → 进程内编排 + 本地事务可用」；措辞为许可性「可用」→ composable 而非 requires（MJ-4 判据，与 STY-018→STY-003 先例同型）
    constraints_imposed:               # 交叉表源：5.4「施加约束」表（方面 5 全体七行，CRD 八条逐字相同）
      - {target_aspect: 1, constraint: "协调需求在既定风格下不可行 → 回溯约束声明（CH-E 原型通道，阻塞式）", level: hard}
      - {target_aspect: 3, constraint: "协调模式产生的新交互 → 契约登记需求（编排者与参与者间的命令契约、事件契约）", level: hard}
      - {target_aspect: 4, constraint: "流程状态（协调者状态机、Saga 日志、预扣记录）是数据集合，受 Y1–Y8 全约束——流程状态的所有者 = 协调者单元", level: hard}
      - {target_aspect: 6, constraint: "质量影响卡片 → 行为级包络校验输入；卡片是方面 6 的强制消费项（Q 系列将引用）", level: hard}
      - {target_aspect: 8, constraint: "行为验证要求：事件回放、乱序/重复/丢失注入、补偿路径测试、超时与断路行为测试、（风格允许时）混沌注入", level: conditional}   # 5.4 级别列原文「软/硬按风格（事件驱动 → 回放与乱序注入必备，承接 1.4）」；ENUM_LEVEL 无复合取值 → 取 conditional（MJ-4 同型判读）
      - {target_aspect: 9, constraint: "协调漂移守护对象：隐式时序假设再现、僵尸开关（expiry 超期）、卡片 observability_requires 退化", level: hard}
      - {target_aspect: 10, constraint: "机器层：Z 谓词集；人类层：覆盖谓词子集 {Z 谓词集} 的投影视图（受众问题 = 行为与协调的时序、事件流与流程状态；记法按实例注册，0.9）", level: hard}
    anti_patterns:
      - pattern_id: CRD-001-AP1
        description: "协调者状态未持久化即承载长流程（崩溃即流程丢失）"
        detection_predicate: "∃ F, M: interaction_flow(F, ·, orchestrated) ∧ orchestrator(F, M) ∧ ¬[M 的流程状态持久化 ∧ 崩溃可恢复]"
        signal_level: P0               # Z8 硬性质（∀ orchestrated flow: orchestrator_state durable ∧ recoverable）违例的直接来源 → 0.14 P0 检出即阻塞（MJ-4 P0 判据）
      - pattern_id: CRD-001-AP2
        description: "以编排承载步骤少而稳定的流程（无谓引入中央组件）"
        detection_predicate: "∃ F: interaction_flow(F, ·, orchestrated) ∧ [F 的步骤数少且流程稳定] ∧ ¬[F 需集中留痕]"
        signal_level: P1               # 违反 5.2.1 适用条件列的选择纪律（步骤多、需集中留痕），但无 Z 系列硬性质可绑定 → P1（MJ-4 判据）
    formal_anchor:
      - {property_id: Z1, role: implements}      # 跨单元交互显式建模（编排者是显式建模的载体）
      - {property_id: Z8, role: implements}      # 编排流程的协调者状态持久化 ∧ 可恢复
      - {property_id: X1, role: consumed_by}     # 5.4 施→3：编排者与参与者间的命令契约进入契约注册
      - {property_id: Z7, role: consumed_by}     # 卡片被方面 6 消费且不得违反包络
    references:
      - {bib_id: 44, support_claim: "企业集成模式（编排/流程管理器与消息通道的原始分类面）", compile_usage: metadata_extraction, trust_grade: "[已核验]"}
      - {bib_id: 45, support_claim: "5.2.1 协调风格二分（母本 5.7 书目 45 行级登记提取面，本条为二分的『编排』一极）", compile_usage: metadata_extraction, trust_grade: "[已核验]（2026-09-20 在线复核在位；本文本地无存档，二分内容由书目 4《Building Microservices》第 2 版第 4 章本地承载，编译提取以书目 4 为本地来源——母本 5.7 逐字，不得在注册表侧降级为存疑/narrative_only）"}
    narrative:
      benefit_cost_analysis: "收益：步骤多且需集中留痕的流程获得单一集中观测点（5.2.1 质量影响列「可观测性集中」），追踪覆盖率单调优于协同形态；流程分支/并行/人工步骤可在编排者内显式建模，合规审计轨迹（5.4 外部强加行）有天然落点。代价：编排者是新增可用性单点，可用性界收紧为 min（编排者, ∧ 参与者）；每跳经编排者中转，延迟按 Σ 步骤卡片加编排者开销累积（5.2.5）；编排者状态必须持久化且崩溃可恢复（Z8 硬），运维成本随之上升；编排者与参与者间的命令契约形成双向依赖（5.4 施→3），逆转成本高。"
      typical_scenarios: "跨单元长流程需集中监控与审计（合规域，如支付类流程）；含分支/并行/人工步骤的业务流程；既有集成形态已为集中式（0.11 现状锁定）时的自然延伸；步骤多且流程易变的场合（变更集中在编排者而非散落于各参与者）。"
      common_misuse: "以编排承载步骤少而稳定的流程（引入无谓单点，AP2）；编排者状态只存内存（Z8 违例，AP1）；把编排者当作绕过单元所有权的直写通道（违 Y2/5.4 施→4：流程状态所有者 = 协调者单元，业务数据仍归各自所有者）；参与者契约未登记（X1 违例，5.4 施→3）；卡片 observability_requires 随迭代退化（5.4 施→9 协调漂移守护对象）。"

