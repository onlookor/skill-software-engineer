        source: {source_type: row_id, value: "4.2.2-事件日志为权威状态", verified: true}
      - metric: "延迟分位数 P99"
        bound_expr: "P99_read(派生视图) 与写后立即可读不可同时成立：读模型自由优化（1.2.3 包络列）压低读侧 P99，但读侧相对权威日志存在投影延迟窗口 → 强同步查询语义不可得（1.2.5 张力行「事件溯源 × 强同步查询语义 → 张力（读模型最终一致）」）"
        source: {source_type: row_id, value: "4.2.2-事件日志为权威状态", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "RPO(派生视图) ≥ RPO(事件日志)：权威状态在日志侧，日志持久化即业务状态不丢；派生视图可按 Y7 重算 → 其 SLO 承诺可低于日志侧（4.2.4 物化视图行「视图是派生物不是所有者」）"
        source: {source_type: row_id, value: "4.2.2-事件日志为权威状态", verified: true}
    cost_profile:
      latency_budget_delta: "Δlatency(读侧) = 投影延迟(事件 → 派生视图) ≥ 0，随流处理拓扑与批量窗口单调不减；Δlatency(写侧) = 事件追加 + 快照重建开销 ≥ 0。数值母本未给 → 只登记界形、符号与单调性（0.4）；新鲜度窗口须落为数据契约条款（4.2.3 最终一致行「窗口时长是契约条款」；4.2.5 新鲜度字段）"
      failure_modes: ["事件 schema 演化无版本治理 → 历史事件不可重放（1.2.3 包络列「事件 schema 演化难」）", "派生视图被当作权威源写入 → 权威状态双源（Y1 违例）", "投影失败或滞后无告警 → 读侧静默陈旧（新鲜度条款失效）", "完整历史无归档/压缩策略 → 存储与重放成本单调上升（1.2.3 包络列「完整历史↑」）", "把 CQRS 当作默认选择用在不需要的场景（1.2.3 反模式列明文）", "事件基础设施本身成为重运维面（1.3 交付空间驱动列为排除项）"]
      consistency_impact: "写侧：事件追加为唯一权威写路径，单元内可取本地事务（4.2.3 强一致行）；读侧：派生视图相对权威日志为最终一致（1.2.5 张力行明文），级别声明归 CSL 条目、窗口时长落为契约新鲜度条款（4.2.3／4.2.5）；跨单元强同步查询语义在本拓扑下不可得，需求出现即回溯方面 1（4.4 施→5）"
      observability_requires: ["投影延迟与滞后量可观测（新鲜度条款的核查面）", "已持久化事件版本分布可查（schema 演化的影响面）", "重放/重建作业可追溯（Y7 可重建性的执行留痕）", "事件流分区与消费滞后（lag）可观测（方面 5 流处理联动）"]
      ops_cost: "[四行中最高：事件基础设施（日志存储、流处理、投影作业、快照与重放）＋完整历史保留（1.2.3 包络列「复杂度↑↑」；1.3 交付空间驱动将其列为重运维风格，低运维能力即排除）]"   # 18-B S5 保守界消费字段
      skill_prerequisites: ["事件建模与事件 schema 版本治理（1.2.3 包络列）", "投影/重放作业设计与幂等消费（Z2 联动，方面 5）", "读写模型分离边界划定（CQRS 不必然绑定事件溯源，1.2.3 定义列）", "新鲜度窗口的业务语义论证（4.2.3 降级纪律末句）"]
