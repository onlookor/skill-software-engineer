    anti_patterns:
      - pattern_id: OWN-002-AP1
        description: "写权旁落：经授权读副本/物化视图的直写流量"
        detection_predicate: "∃ D, c: access_path(D, c, replica, ·) ∧ [该访问路径存在写流量]"
        signal_level: P0               # Y1/Y2 硬性质违例的直接来源（MJ-4 P0 判据；4.5 触发条件含 access_path 谓词变更）
    formal_anchor:
      - {property_id: Y1, role: implements}     # 写权仍单一
      - {property_id: Y2, role: implements}     # 副本读路径亦须契约化（access_path 登记 path_kind）
      - {property_id: Y7, role: triggers}       # 副本为派生物 → 可重建性登记义务（软性质，P2）
      - {property_id: W4, role: consumed_by}
    references: []                     # G-OWN-1 同型（书目 41 登记面不含本行）
    narrative:
      benefit_cost_analysis: "收益：读负载分流而写权仍单点——一致性协调成本不增，只增副本新鲜度一项契约条款；是 OWN-001 在读扩展受限时的唯一合法演进步（4.2.1 行 1 备注「读可扩展（副本/视图），写不可共享」）。代价：副本是派生物，重建能力（Y7）与新鲜度窗口都必须登记，否则退化为隐式权威；新鲜度不可核验时 S4 只能标 unknown + 勘察义务（18-B S4 推荐侧即此形态）。"
      typical_scenarios: "读负载高且消费方可容忍副本延迟（4.2.1 适用条件列）；18-B 正例 S4/S5 中与 OWN-001 加权得分不可区分的对照候选（落选于 CH-B 保守界）。"
      common_misuse: "把副本当第二权威（直写）；新鲜度窗口口头承诺不入数据契约；以「读副本」名义掩盖共享写例外（应走 OWN-004 并附退出计划）。"

