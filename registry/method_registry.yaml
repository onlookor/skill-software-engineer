      - pattern_id: CTR-006-AP2
        description: "同一语义条款在聚合层（BFF）与后端契约两处维护（双重维护）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ [C 登记为 UI/端契约] ∧ [同一语义条款另有一处后端契约登记] ∧ ¬[两处由同一工件同源生成]"
        signal_level: P1               # 3.4 施→10 级别列为硬（禁止双重维护），但机器层天然性列对本行为『中』（3.2.1）→ 同源生成不总可行；母本未将其列入 X 系列硬性质 → P1，同源生成可行时按施→10 升硬（MJ-4 判据）
    formal_anchor:
      - {property_id: X1, role: consumed_by}     # 端形态单元与后端单元间的交互同样须 ∃C: [covers(C,u1,u2)]（3.4 施→5：每条跨单元交互必须有注册契约）
      - {property_id: X2, role: consumed_by}     # 发布态须 has(version) ∧ has(compat_policy)；母本未给本形态的版本化默认值（3.2.2 版本化策略默认值列只列同步 API 与事件）→ 取值须逐案登记，覆盖默认值需 ADR
    references: []                     # 母本 3.7 书目 28–34 无 3.2.1「UI/端契约」行的行级登记提取面（28/29 → 3.2.2 CDC 与契约测试区分；30 → 同步 API 契约机器层格式；31 → 3.2.1 事件信封；32 → API 契约设计方法；33 → 3.2.2 schema registry 与兼容性规则；34 → 3.4 绞杀者迁移）→ 按 G-CRD-1／G-DEC-1 同型纪律「表级/节级面不下探」不扩张；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）→ 登记 G-CTR-1，待人工裁决补勘后回填（SO-9）
    narrative:
      benefit_cost_analysis: "收益：把前端与后端间的约定从端代码与口头惯例收回到注册表，使 X1『无未登记跨单元交互』在端侧同样可判定；BFF 作为面向特定前端形态定制的聚合服务层，使端特有聚合逻辑不污染后端通用接口（3.2.1 定义列）；第三方端在场时有明确分级依据（3.3 问题空间驱动第一行：full 兼容 + 长弃用窗口 + 对外 SLA 条款）。代价：机器层天然性仅为『中』（3.2.1），端契约面不能像 IDL/OpenAPI 那样直接投影为谓词 → 施→10 的禁止双重维护在本形态最难满足（AP2）；每端各持一份契约面使跨边界契约变更数按端形态数放大；聚合层引入额外一跳与其后端扇出项，前端可见延迟预算被三层分食；母本未给本形态的版本化与兼容性默认值（3.2.2 两个默认值列均不涉端契约）→ 取值须逐案登记，选型面宽于其他形态。"
      typical_scenarios: "多端形态（Web/移动/第三方）并存、各端聚合需求不同的场合（3.2.1 适用条件列）；须为特定前端形态定制聚合服务层（BFF）的场合（3.2.1 定义列）；第三方端接入、须按对外 API 分级登记的场合（3.3 问题空间驱动第一行）；公司 API 网关标准强加南北向流量、而端内聚合层是否在强加范围内须逐案解包的场合（3.6 示例一；0.3）；分布式单体排查中须确认端侧交互是否已登记契约的场合（X1；3.4 施→5）。"
      common_misuse: "端侧约定不登记为契约（AP1，X1 硬违例）；同一语义条款在 BFF 与后端契约双重维护（AP2，3.4 施→10）；多端共用一份未定制的契约面而把聚合职责推到端上（3.2.1 定义列以 BFF 为组织模式）；第三方端按纯内部 API 放宽兼容性与弃用窗口（3.3 问题空间驱动第一行）；把南北向网关标准泛化到端内聚合层（3.6 示例一幻觉之一）；以端契约的字段约定替代一致性定案（一致性属方面 4 的 Y 系列）；因机器层天然性为『中』即放弃同源生成而不登记偏离理由（0.4 证据门槛）。"

  - entry_id: CTR-007
    kind: CTR
    name: "版本化策略"
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-CTR-01）
    provenance:
      origin: hybrid                   # 骨架=3.2.2 表行「版本化策略」（内容列三载体＋事件契约推荐项；默认值列两条）＋谓词转写（manual）；母本对本行仅给一行表数据，无独立小节 → 不扩张（G-CRD-1 同型纪律）
      source_pointers:
        - {source_type: row_id, value: "3.2.2-版本化策略", verified: true}
        - {source_type: clause_id, value: "3.2.2", verified: true}   # 表头「默认值（注册表登记，可覆盖需 ADR）」
        - {source_type: clause_id, value: "3.3", verified: true}     # 问题空间驱动第一行（第三方开放 → full 兼容 + 长弃用窗口）＋现状空间驱动第二行（无文档隐式契约）＋交付空间驱动两行
        - {source_type: clause_id, value: "3.4", verified: true}     # 接收约束方面 1/6 行＋施→2（边界冻结）/8/9/10
        - {source_type: clause_id, value: "3.5", verified: true}     # X2（has(version)）／X3（breaking_change → deprecation_window）
        - {source_type: clause_id, value: "3.6", verified: true}     # 示例二（additive-only + schema registry 发布 v1；参数化项 = 兼容性策略字段）
        - {source_type: clause_id, value: "0.4", verified: true}     # 覆盖默认值的 ADR 须过证据门槛
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}   # 可修改性族（跨边界契约变更数）＋可观测性族（覆盖率）
        - {source_type: bib_id, value: 33, verified: true}
    typical_reversibility: bounded     # 人工判断：版本载体一经 published 即对既有消费者生效，无声撤回违 X5（发布即批准）→ 非 free；但 3.6 示例二明文「参数化项 = 兼容性策略字段（切换成本有界）」→ 策略字段可在有界成本内切换，非 costly
    applicability:
      problem_space:                   # 骨架源：3.2.2「内容」列＋3.3 问题空间驱动
        - "URI 版本 / 头部版本 / schema registry 版本三载体（3.2.2 内容列逐字）；事件契约推荐『仅增量演化』（additive-only：只加可选字段，不改不删既有字段）（同列逐字）"
        - "第三方开放 → full 兼容 + 长弃用窗口 + 对外 SLA 条款（3.3 问题空间驱动第一行）；合规/监管接口 → 走 CH-A＋0.5 必登类目（同节第二行）→ 两类场合的版本载体与演化严格度均高于内部 API"
      current_space:                   # 骨架源：3.3 现状空间驱动
        - "现状契约清单是版本化策略的起点：既有契约的实际版本载体（URI 段 / 头部字段 / registry subject）须先逆向登记；无文档隐式契约以流量观测 + 消费者代码分析为准，文档仅作线索（3.3 现状空间驱动第二行；公理 A1）"
        - "已发布契约的边界冻结（3.4 施→2 硬）→ 现状版本化策略不得以重排既有版本号的方式收回；切割需求走弃用窗口 + 绞杀者迁移（同行）"
      delivery_space:                  # 骨架源：3.3 交付空间驱动
        - "CI 成熟度 → CDC 可行集；能力不足降软 + 保守假设 ADR，可推翻指标 = CI 能力建立（3.3 交付空间驱动第二行）→ schema registry 版本载体以 CI 中可执行兼容性检查为前提，能力不足时该载体的可行性下降"
        - "消费者多且异构 → full；单消费者同团队 → backward 可接受（3.3 交付空间驱动第一行）→ 版本化策略的演化严格度随消费者集合基数上升"
    envelope:
      - metric: "可修改性：典型变更的实现成本（触达单元数、跨边界契约变更数）"
        bound_expr: "additive-only 演化下既有字段的改动数 = 0 → 单次演化的跨边界契约变更数 上界 = 新增可选字段数；非 additive-only 演化的变更数 随 consumer_set 基数 单调不减（每个消费者各需一次适配，3.2.2 内容列的推荐项即为此设）"
        source: {source_type: clause_id, value: "3.2.2", verified: true}
      - metric: "可观测性：卡片 observability_requires（5.2.5）满足率、追踪覆盖率"
        bound_expr: "已登记版本载体的 published 契约数 / published 契约总数 上界为 1（X2：∀C(lifecycle_state=published): has(version) ∧ has(compat_policy) —— 硬）→ 缺口 = 未登记者数，随 published 契约数增加 单调不减"
        source: {source_type: clause_id, value: "3.5", verified: true}
    cost_profile:
      latency_budget_delta: "版本化策略不改变调用路径 → 运行时延迟预算增量为 0；多版本并存使网关路由与序列化面增加分支、schema registry 载体引入解析项，母本均未给量化增量 → 由方面 6 目标值经 3.4 接收约束方面 6 行下发，四类合法出处之外不得填值（6.2.1 量化纪律＋0.4 证据门槛）"
      failure_modes: ["published 态契约缺 version 或 compat_policy（X2 硬违例）", "事件契约改动或删除既有字段（3.2.2 内容列推荐项 additive-only：只加可选字段，不改不删既有字段）", "契约类型不在默认值列两类（同步 API / 事件）之内却径行套用默认载体而无 ADR（3.2.2 表头『注册表登记，可覆盖需 ADR』）", "以重排既有版本号的方式收回已发布契约（3.4 施→2 硬：已发布契约的边界冻结）", "同一契约在 URI 与头部两处各持一个版本载体（3.4 施→10 硬：禁止双重维护）"]
      consistency_impact: "版本化策略不承载跨单元事务语义；多版本并存期的一致性级别由方面 4 的 Y 系列判定（CSL 批承载）；schema registry 的 schema 兼容不等于数据一致性定案，additive-only 演化不改变既有字段语义 → 不得以此替代语义条款变更登记（3.2.1 数据契约行）"
      observability_requires: ["每份 published 契约的 version 与 compat_policy 在注册表可查（X2 硬；3.4 施→5）", "在网版本分布与并存版本数可度量（X3 弃用窗口闭合判定所需）", "schema registry 的兼容性检查结果在提供者 CI 中留痕（3.3 交付空间驱动第二行：CI 成熟度 → CDC 可行集）", "契约漂移检测规则参数已按 0.13 注册（3.4 施→9 硬）"]
      ops_cost: "[schema registry / API 网关版本路由 / 服务目录三类注册面的部署与运维项（3.2.2 发现与注册行）→ 运维项随契约数与并存版本数上升；母本未给单位运维成本 → 方括号占位（MJ-20 (iii) 同型）]"
      skill_prerequisites: ["三种版本载体的取舍（URI 版本 / 头部版本 / schema registry 版本）（3.2.2 内容列）", "additive-only 演化的字段级纪律（同列：只加可选字段，不改不删既有字段）", "覆盖默认值的 ADR 撰写（3.2.2 表头；0.4 证据门槛）", "版本化策略与兼容性规则的联动登记（3.2.2 相邻两行；3.6 示例二的参数化项）"]
      aggregation_semantics: itemwise  # 母本未给 CTR 的跨契约聚合式（MJ-19 (iii) 同型）→ 版本载体按契约逐项登记（与 3.2.2 兼容性规则行「每契约登记其一」同型）（MJ-21 (ix)）
    compatibility:
      - peer_entry: CTR-002
        relation: composable
        evidence: {source_type: clause_id, value: "3.2.2", verified: true}   # 默认值列明文「同步 API：URI 版本」→ 同步 API 契约的默认版本载体为 URI 版本；**回填 CTR-002 侧已声明的镜像**（CTR-002 行内注原文「镜像登记于 CTR-007」）；ENUM_RELATION 无 required_by 且方向为契约形态 → 治理维度 → 本侧记 composable（MJ-20 (vii) 同型；MJ-21 (viii)：CTR-002 属本批 seed 条目、非已批准条目 → 双向登记）
      - peer_entry: CTR-004
        relation: composable
        evidence: {source_type: clause_id, value: "3.2.2", verified: true}   # 默认值列明文「事件：additive-only + schema registry」＋内容列「事件契约推荐『仅增量演化』」→ 事件契约的默认版本化策略为 additive-only 演化 + schema registry 载体；3.6 示例二以本组合发布 v1（保留候选集：未来消费者无论出现多少都可低成本接入）
    constraints_imposed:               # 交叉表源：3.4「施加约束」表（方面 3 全体六行，CTR 十二条逐字相同）
      - {target_aspect: 2, constraint: "已发布契约的边界冻结——分解不得切割既有契约（切割需求 → 走弃用窗口 + 绞杀者迁移）", level: hard}
      - {target_aspect: 4, constraint: "数据契约的 schema 与语义条款是数据流动的唯一合法路径定义", level: hard}
      - {target_aspect: 5, constraint: "协调模式中的每条跨单元交互必须有注册契约（Z1 的契约来源）", level: hard}
      - {target_aspect: 8, constraint: "契约测试是验证计划的组成部分；微服务风格 → CDC 必备；事件驱动 → 事件 schema 演化测试必备", level: conditional}   # 级别列原文「软/硬按风格」→ 版本化策略不绑定单一风格：契约测试项取硬，CDC 按 X4 分级（微服务风格下升硬），事件 schema 演化测试项在 additive-only 演化下为必备（3.2.2 内容列推荐项）（MJ-4 同型判读；MJ-21 (x)）
      - {target_aspect: 9, constraint: "契约漂移（运行时实际流量与注册契约的偏离）是守护对象；漂移检测规则参数按 0.13 注册", level: hard}
      - {target_aspect: 10, constraint: "契约是机器层的天然工件：IDL/schema/OpenAPI 文档直接投影为白板谓词，禁止双重维护（0.9 同源生成原则在契约域最强适用）", level: hard}
    anti_patterns:
      - pattern_id: CTR-007-AP1
        description: "published 态契约未登记版本载体（缺 version 或缺 compat_policy）"
        detection_predicate: "∃ C: [contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state)] ∧ [lifecycle_state = published] ∧ ¬(has(version) ∧ has(compat_policy))"
        signal_level: P0               # X2 明文「∀C(lifecycle_state=published): has(version) ∧ has(compat_policy) —— 版本与兼容策略齐备 —— 硬」；3.2.2 表头同旨（注册表登记）→ P0（MJ-4 判据）
      - pattern_id: CTR-007-AP2
        description: "事件契约改动或删除既有字段（违反 additive-only 推荐）而未登记为破坏性变更"
        detection_predicate: "∃ C, v1, v2: [contract(C, ·, ·, ·, version, ·, ·)] ∧ [C 登记为事件契约] ∧ [v1→v2 含既有字段的改动或删除] ∧ ¬[breaking_change(C, v1, v2)]"
        signal_level: P1               # 3.2.2 内容列对事件契约的 additive-only 为『推荐』而非硬性质 → 未按 P0 登记；但改/删既有字段使 v1→v2 构成破坏性变更而未登记者落入 X3 违例面（条件硬）→ 级别待 W3/X3 条件硬裁决口（s5h 既有）落定后复核（MJ-4 判据）
      - pattern_id: CTR-007-AP3
        description: "同一契约在 URI 与头部两处各持一个版本载体（版本载体双重维护）"
        detection_predicate: "∃ C: [contract(C, ·, ·, ·, version, ·, ·)] ∧ [version 同时由 URI 段与头部字段承载] ∧ ¬[两处由同一工件同源生成]"
        signal_level: P1               # 3.4 施→10 级别列为硬（禁止双重维护），但机器层天然性对同步 API 为『高』（3.2.1）→ 同源生成可行时应升硬；母本未将其列入 X 系列 → P1（MJ-4 判据）
    formal_anchor:
      - {property_id: X2, role: implements}      # 版本化策略是 has(version) 的登记来源：三种版本载体给出 version 字段的合法取值形态（3.2.2 内容列）
      - {property_id: X3, role: consumed_by}     # 版本载体决定 v1→v2 是否构成 breaking_change(C,v1,v2) → X3 要求 deprecation_window(C,v1,t) ∧ t ≥ slowest_consumer_migration(C)
    references:
      - {bib_id: 33, support_claim: "3.2.2 schema registry 与兼容性规则的工程参照（母本 3.7 书目 33 行级登记提取面逐字对应；三种版本载体中 schema registry 选项的提取以本地两份专页级存档为准——《Confluent - Schema Registry for Confluent Platform.epub》概览/概念页＋《Confluent - Schema Evolution and Compatibility for Schema Registry.epub》兼容性规则专页全文，Platform current＝8.3）", compile_usage: metadata_extraction, trust_grade: "[已核验（在线在位：2026-09-18 复核，Platform 8.3 当前文档可获取）]"}
    narrative:
      benefit_cost_analysis: "收益：把版本载体的选择从口头惯例收回到注册表，使 X2『发布态版本与兼容策略齐备』可逐契约判定；additive-only 使事件契约的既有字段改动数为 0，消费者无需同步升级即可继续读取（3.2.2 内容列）；3.6 示例二显示版本化策略与兼容性策略可一并参数化推迟（保留候选集 + 最后负责时刻），切换成本有界。代价：默认值列只覆盖同步 API 与事件两类 → 其余契约形态（异步消息、数据、UI/端）的版本载体须逐案登记并各附 ADR，登记面最宽；多版本并存使网关路由与序列化分支上升，并存版本数随弃用窗口拉长而增加；schema registry 载体以 CI 中可执行兼容性检查为前提，CI 成熟度不足时该选项不可行（3.3 交付空间驱动第二行）；版本载体双重维护（AP3）在机器层天然性为『高』的同步 API 上最不该发生，却因 URI 与头部两种载体并存而易发。"
      typical_scenarios: "新契约发布前须选定版本载体的场合（3.2.2 内容列三选项）；事件契约演化、须按 additive-only 纪律只加可选字段的场合（同列推荐项）；消费者集合结构性未知、须以 additive-only + schema registry 发布 v1 并设定最后负责时刻的场合（3.6 示例二，CH-B 推迟）；既有契约无文档、须以流量观测逆向登记版本载体的场合（3.3 现状空间驱动第二行）；第三方开放或合规/监管接口、版本与弃用窗口须同时加严的场合（3.3 问题空间驱动两行）；方面 2 拆分诉求与已发布契约冻结冲突、须制定契约 v2 的场合（3.6 示例三，CH-E）。"
      common_misuse: "published 态缺 version 或 compat_policy（AP1，X2 硬违例）；事件契约改/删既有字段却不登记为破坏性变更（AP2，X3 违例面）；URI 与头部两处各持版本载体（AP3，3.4 施→10）；契约类型不在默认值列两类之内而径行套用默认载体、无 ADR（3.2.2 表头）；以重排既有版本号收回已发布契约（3.4 施→2 硬）；把 schema 兼容当作数据一致性定案（一致性属方面 4 的 Y 系列）；CI 能力不足即静默放弃 schema registry 载体而不记保守假设 ADR（3.3 交付空间驱动第二行）；为版本载体填无出处的并存版本数或解析开销数值（0.4 证据门槛）。"

