    anti_patterns:
      - pattern_id: RLP-004-AP1
        description: "对未声明幂等的操作重试（含对关键步 pivot 重试）"
        detection_predicate: "∃ s: step_class(s, retriable) ∧ ¬idempotent(s) ∨ ∃ s: step_class(s, pivot) ∧ [retry](s)"
        signal_level: P0               # 5.5 Z2 硬（幂等必答）＋Z3 硬（pivot_ordering_valid：关键步之后全部可重试 → 关键步本身不得重试）→ P0（MJ-4 判据）
      - pattern_id: RLP-004-AP2
        description: "无上限次数或无退避的重试（含固定间隔紧密重试）"
        detection_predicate: "∃ I: [retry](I) ∧ (¬[上限次数已登记] ∨ ¬[backoff](I) ∨ [backoff](I) = 常数 ∧ ¬[jitter](I))"
        signal_level: P0               # @2477 逐字把『指数退避 + 抖动』写入模式名 → 缺失即机制定义性判据缺失（MJ-4 判据第一支）；且重试风暴使 Z4 的 Σ 预算失去上界
      - pattern_id: RLP-004-AP3
        description: "最坏重试时长未纳入上游超时预算／SLA 论证（Z4 预算不闭合）"
        detection_predicate: "∃ path: [retry 最坏时长](path) + Σ timeout_budget(path) > [SLA 上界](path)"
        signal_level: P1               # 5.5 Z4 为条件硬（『过 0.4 证据门槛时为硬；否则降软 + 保守界』）→ 门槛未过时不满足 MJ-4 的 P0 判据；但 5.6 示例一明记其为 CH-C 冲突信号源 → P1 限期整改
      - pattern_id: RLP-004-AP4
        description: "对确定性失败重试（失败原因不可分类即一律重试）"
        detection_predicate: "∃ I: [retry](I) ∧ ¬[失败原因分类可观测](I)"
        signal_level: P1               # 5.2.2『暂时性失败假设』为适用前提而非 Z 系列硬性质；假设不成立的后果是可用性与负载双输（选择纪律偏离）→ P1（MJ-4 判据）
      - pattern_id: RLP-004-AP5
        description: "退避无抖动导致多实例重试同步化（重试尖峰）"
        detection_predicate: "∃ I: [backoff](I) ∧ ¬[jitter](I) ∧ [并发实例数] > 1"
        signal_level: P2               # 「性能：资源占用」族的漂移信号（须以阈值 + 趋势双判据核定），不直接构成 Z 性质违例 → P2（MJ-4 判据；与 RLP-001-AP4 同型）
    formal_anchor:                     # 交叉表源：5.5 可验证性质（Z3 硬／Z4 条件硬／Z7 升级型）
      - {property_id: Z3, role: consumed_by}    # 5.5 Z3『∀ saga step: step_class ∈ {compensable, retriable, pivot} ∧ pivot_ordering_valid』（硬）→ 本模式是 retriable 类的执行手段，其可用范围由 Z3 的分类与关键步次序判定给出
      - {property_id: Z4, role: consumed_by}    # 5.5 Z4『Σ timeout_budget(path) ≤ sla_bound(path)』（条件硬）＋5.6 示例一→ 最坏重试时长是 Σ 的被加项，须进入预算闭合判定
