        - "[领域未充分理解但需保留演进选项]（人工判断：@1353「保留未来拆分选项」+ 1.2.4 演进式默认起点 @1388 的合取读法）"
      current_space: []                # 母本本行未给现状空间条件（G-STY-1）
      delivery_space:
        - "[中小团队]（1.3 交付空间：团队规模与认知负荷；归类为人工判断，母本列未标空间）"
    envelope:                          # 骨架源：「单体的性能/事务优势 + 接近微服务的可修改性；保留未来拆分选项」三个分句 → 三项界（MJ-2）
      - metric: "延迟分位数 P99"
        bound_expr: "P99(req) = Σ 单元内调用开销，跨单元网络跳数 = 0（「单体的性能优势」：与 STY-014 同型，模块边界不引入网络项）；参数：模块间调用路径长度、边界契约的转发开销"
        source: {source_type: row_id, value: "1.2.2-模块化单体", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "模块内变更 → touched_units ≤ |units(m)| + |boundary_contracts(m)|（「接近微服务的可修改性」的参数化落点）；前提：模块边界经 boundary_type 登记且穿透受门禁约束——AP1 成立时该上界退化为 STY-014 形态（无边界收敛）"
        source: {source_type: row_id, value: "1.2.2-模块化单体", verified: true}
      - metric: "可修改性：典型变更的实现成本（跨边界契约变更数）"
        bound_expr: "模块 → 部署单元的迁移成本上界 = |boundary_contracts(m)|（「保留未来拆分选项」的参数化落点：拆分红利取决于既有边界契约面，内部无需重切分）；参数：模块间穿透依赖数（AP1 成立时该项发散）"
        source: {source_type: row_id, value: "1.2.2-模块化单体", verified: true}
    cost_profile:
      latency_budget_delta: "无跨单元网络项；+ 模块边界契约的一次分派/校验开销（参数：边界数与契约实现形态）"
      failure_modes: ["模块边界只在文档里、代码里随意穿透（AP1）→ 可修改性与拆分选项两个上界同时失效", "单元级故障影响面 = 全部流量（与 STY-014 同型：一次故障全局倒）", "模块划分与实际变更热点错位（边界未对齐 volatility）"]   # 第一项骨架源 1.2.2 反模式列；第二项源自单一部署单元定义；第三项人工判断
      consistency_impact: "ACID 事务可用（「单体的性能/事务优势」的事务侧）：跨模块的强一致可经本地事务满足，无需分布式协调"
      observability_requires: ["模块归属与边界穿透可查（boundary_type/depends_on 登记面）", "模块级变更触达面计量（拆分决策的事实源，联动 9.4 演化观测）"]
      ops_cost: "[单一制品、单一发布通道（与 STY-014 同型）；额外成本落在边界门禁工具与模块级度量建设]"
      skill_prerequisites: ["模块边界设计（对齐语义边界与变更率）", "边界穿透的自动化门禁（依赖规则校验）"]
      aggregation_semantics: itemwise
    compatibility:                     # 对侧已登记不重复（MJ-5/MJ-9）：STY-008（@611 段）、STY-009 均已登记本条目为 peer（evidence 1.2.1 @1344）
      - peer_entry: STY-014
        relation: composable
        evidence: {source_type: row_id, value: "1.2.2-模块化单体", verified: true}   # 骨架源：本行定义 =「单部署单元 + 内部强制模块边界（方面 2 的逻辑单元）」→ 单体的部署形态与模块边界叠加（镜像行见 STY-014）
      - peer_entry: STY-023
        relation: composable
        evidence: {source_type: clause_id, value: "1.2.4", verified: true}      # 骨架源 @1388/@1391：演进式元方法「默认起点：模块化单体」，且该默认值是 0.10 临时保守通道条件 (i) 所指的登记默认值之一；relation 取 composable（枚举无「提名/推荐」语义，方向性说明为本注释）
    constraints_imposed:               # 交叉表源：1.4 施加表（单体行适用——本风格为单部署单元）+ 本行定义的强制模块边界
      - {target_aspect: 2, constraint: "分解可纯逻辑边界（1.4 施→2 单体行），且内部模块边界须强制：模块为方面 2 的逻辑单元，边界须可登记（boundary_type）并可校验", level: hard}   # 后半句骨架源本行定义「内部强制模块边界」
      - {target_aspect: 3, constraint: "进程内调用可用（1.4 施→3 单体行）；模块间契约仍须显式声明（方面 3 消费，为未来拆分预留边界契约面）", level: soft}   # 前半交叉表源，后半人工判断
      - {target_aspect: 4, constraint: "共享数据库可用（1.4 施→4 单体行）；模块对表的访问宜经模块自有接口收敛（拆分选项的前提）", level: soft}   # 前半交叉表源，后半人工判断
      - {target_aspect: 5, constraint: "进程内编排、本地事务可用（1.4 施→5 单体行）", level: soft}
      - {target_aspect: 6, constraint: "本条目 envelope = 质量目标可达性上界（V4 消费）", level: hard}
      - {target_aspect: 10, constraint: "机器层：1.5 拓扑谓词集（style/deployed_on + 模块边界经 2.5 boundary_type 表达）；人类层：投影视图必须表达所选风格（模块边界须可辨）", level: hard}
    anti_patterns:                     # 骨架源：1.2.2「典型反模式」列（本行一项，不增补）
      - pattern_id: STY-015-AP1
        description: "模块边界只在文档里，代码里随意穿透"
        detection_predicate: "∃ m1, m2, c1, c2: unit(m1) ∧ unit(m2) ∧ boundary_type(m1, ·) ∧ boundary_type(m2, ·) ∧ [c1 属 m1] ∧ [c2 属 m2] ∧ depends_on(c1, c2, call, ·) ∧ ¬[该依赖经 m1/m2 声明的边界契约]"
        signal_level: P1               # 人工判断（MJ-4）：违反本风格定义性约束「内部强制模块边界」，但 1.2.5 无涉本风格的冲突行、1.5 未登记模块边界方向谓词（VG-03）→ 无 V1 可绑定，定 P1；若在 dependency_rule 登记模块间禁止穿透，则构成 V1 违例直接来源，升 P0（登记义务见 gaps: G-STY-4）
    formal_anchor:
