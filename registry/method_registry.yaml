  - id: MJ-12
    subject: M4 自检暴露的本地造词修正（compat_policy / schema / error_handling）
    judgment: "投影脚本规格预检（M4 词汇封闭自检）暴露三处 detection_predicate 使用了母本 x.5 谓词表未登记的谓词形态，属本地造词（README §3.1 / 编译规范 2.3 封闭集纪律明令禁止）。逐个溯源：(i) compat_policy 在母本仅为 3.5 contract(C, provider, consumer_set, kind, version, compat_policy, lifecycle_state) 的实参槽名（@1996），以实参槽名充当谓词不成立；(ii) schema 在母本为契约工件名（3.2.1『schema + 语义条款』），非谓词；(iii) error_handling 母本全无登记（1.2.1 管道行仅自然语言反模式名）。处置：三处 ¬declared(X(y)) 形态统一改为方括号事实占位符（如 [ep 的契约未登记版本化/兼容策略]），语义按 M15 转勘察义务（unknown → 候选保留 + 勘察义务，禁沉默排除）；词汇缺口登记 VG-04，走 R2 提议候选。"
    basis: "README §3.1 词汇封闭；编译规范 2.3 封闭集纪律（发现缺失 → 不得本地造词）；0.17.8 M4；母本 3.5 contract 谓词签名（@1996）；3.2.1；1.2.1 管道行"
    affected: "STY-010-AP1、STY-011-AP1、STY-013-AP2 的 detection_predicate"
    provenance: manual

  - id: MJ-13
    subject: DEC/OWN/CSL/CRD 四批 entry_id 与母本源表行序的映射裁决（既有已发布引用解耦）
    judgment: "四批编号裁决（裁决来源＝评审点五人类裁决人两次答复；判断全文见 README §4.2）：(i) OWN-001…004 = 4.2.1 表行序，与正例 18-B 已发布候选集 {OWN-01 单一所有者, OWN-02 所有者+授权读副本, OWN-03 数据产品, OWN-04 共享写例外} 1:1 一致，无矛盾，母本零改动。(ii) CRD-001…008 = 分块序：5.2.1 四行 = CRD-001…004、5.2.2 四行 = CRD-005…008；CRD-002 = 协同（choreography），与母本已发布 CRD-02（事件协同）一致（等同判断见 MJ-14），母本零改动。(iii) CSL-001…005 = 4.2.3 表行序，最终一致 = CSL-004；母本反例 18-A 已发布引用经 R2 修订对齐（见 MJ-15）。(iv) DEC-001…008 = 2.2.1 八策略表行序（S1…S8 ↔ DEC-001…008），DEC-005 = S5 按变更频率；母本正例 20-1 已发布引用经 R2 修订对齐（见 MJ-15）。书写形态统一三位数字，母本两位数形态为同一 entry_id 的既有书写形态（同 STY 批先例，README §4.1）。"
    basis: "0.22 承诺一（编号永不复用/重排）；2.2.1/4.2.1/4.2.3/5.2.1/5.2.2 源表；母本正例 18-B（@620-641）、反例 18-A（@646）、正例 20-1（@866-886）、承诺三举例（@1159）；README §4.1 STY 先例"
    affected: "kind_profile_DEC/OWN/CSL/CRD 的 seed_source.entry_id_range；四批全部条目 entry_id 规划"
    provenance: manual

  - id: MJ-14
    subject: 母本已发布引用 CRD-02（事件协同）与 5.2.1 表行「协同（choreography）」的等同判断
    judgment: "母本 5.2.1 混合模式行叙述「域内响应用事件协同」（@2460），正例 18-B 已发布候选集含 CRD-02（事件协同）。勘察判读：「事件协同」与 5.2.1 表行「协同（choreography）」为同一行的两种称呼，非独立方法——CRD kind 下不存在区别于协同的事件协同条目；故表序入库时 CRD-002 = 协同（choreography）即直接满足既有已发布引用，无需 R2 修订母本。该等同关系属人工判断（母本未显式登记映射），登记于此。另：profiles.yaml 所记叙述式「CRD-Saga」为 5.2.2 长流程模式表 Saga 行的叙述式称呼，非 entry_id，不参与编号；其行序对应（落 CRD-005…008 区间）于 CRD 批入库时按源表确认并另行登记。"
    basis: "5.2.1 表与混合模式行（@2460）；5.2.2 表；正例 18-B（@625）"
    affected: "kind_profile_CRD 的 seed_source；CRD-002；CRD 批入库时的 Saga 行对应登记"
    provenance: manual

  - id: MJ-15
    subject: 母本已发布引用与源表行不一致的两处同型缺陷（CSL-03/DEC-05）——FM-12 通道登记与 R2 修订执行记录
    judgment: "缺陷一（CSL）：反例 18-A @646 原发布 `CSL-03（最终一致流动机制）`；4.2.3 表行序下 CSL-03 = 因果一致、最终一致 = CSL-04；「流动机制」系 DFL kind（4.2.4 数据流动机制）跨用语；示例场景（事件溯源 × 账务 × 逐笔可重算）语义指向最终一致。缺陷二（DEC）：正例 20-1 @870 原发布 `DEC-05（事件驱动分解）`；2.2.1 八策略表无「事件驱动分解」行，该词全文仅此示例一处；表序下 DEC-05 = S5 按变更频率（判据输入 = 问题空间的需求易变性评估）。两处均属表格与已发布引用不一致 = FM-12 同型（README §7：冲突登记为成文法缺陷）。处置（评审点五人类裁决两次答复）：CSL 批 = 选项 b 立即 R2 修订反例——@646 改为 `CSL-04（最终一致）`；DEC 批 = 选项 c 表序入库 + 立即 R2 修订母本示例，改写幅度 = 选项 A 最小自洽改写（策略语境由「事件基础设施运维能力」整体换为「变更频率 × 易变性数据」，保留全部结构要素：S0 事实与 FM-1 触发、S1 重入谓词、S3 可推翻佐证、注释块、消费字段，共 @868/870/872/877/883 五处）。改写幅度判定依据：仅替换描述符会使示例内部失洽（事实/勘察/消费字段均围绕事件基础设施，而 S5 判据输入是问题空间易变性评估）；「改引用 ID」路径经核实不可行（S1…S8 无一行承载事件基础设施谓词）。修订纪律 = 0.22.3 R2 措辞澄清通道，零新增规范命题、编号不重排；单行本（机械抽印本）按出处头纪律以同文替换同步 6 处，抽印记录追加 changlog。波及面核查（不改动）：archieve/revise.md 为历史档案不改；编译规范 @678 `DEC-5` 系故意构造的不存在反例不改；承诺三 @1159「按 DEC-03 执行」举例不受影响（表序下 DEC-03 = S3 条目存在，引用自洽）；母本行数 4426 与围栏 216 不变。"
    basis: "0.22.3 R2 通道；FM-12（0.20）；README §7；4.2.3/4.2.4/2.2.1 源表；反例 18-A（@646）；正例 20-1（@866-886）；单行本出处头（@1-5）"
    affected: "母本 @646/@868/@870/@872/@877/@883；单行本对应 6 处；PCR-2 blocking；kind_profile_CSL/DEC 的 seed_source"
    provenance: manual

  - id: MJ-16
    subject: OWN 批三项形式面对齐裁决——18-B 消费字段的 0 基索引、简记 scope 全集口径、索引产物文案与非 STY 卡片投影覆盖的处置
    judgment: "(i) **18-B 消费字段按 0 基索引对齐**：母本正例 18-B 的消费字段清单（@640-641）以 `OWN-03.applicability.delivery_space[1]; OWN-01.cost_profile.ops_cost; OWN-01/02.typical_reversibility; OWN-04.applicability.problem_space[1]` 形式发布，索引为 0 基（脚本求值口径）。本批逐一对齐——OWN-003.delivery_space 的第 2 项（[1]）为平台团队存在性事实（∃ platform_team）、OWN-004.problem_space 的第 2 项（[1]）为遗留迁移过渡期占位、OWN-001.cost_profile.ops_cost 为『四行中最低』的保守界、OWN-001/OWN-002.typical_reversibility 同为 free（S5 排序消费面）。纪律：清单以索引指称，故**列表项顺序不得调换**（调换即改指称对象）；后续批次若需重排某条目列表项，须同步核对全部已发布消费字段并留痕。(ii) **简记 scope 全集口径**：check_ledgers 对每条状态迁移简记独立要求 scope 与『全部 status=to 条目集』双向相等（project.py @1032-1044），故 ST-STY-01 的 scope 由 24 条扩至 28 条、ST-OWN-01 同口径登记全集。此为检查器口径的形式面，不改变迁移事实：STY 24 条的迁移事实与日期仍由 ST-STY-01 承载、OWN 四条由 ST-OWN-01 承载，两条 note 分别注明本批实际迁移对象；scope 字段随注册表全集演进而同步，不构成对既有简记历史记录的重写（编号与已发布引用不动，0.22 承诺一）。(iii) **索引产物陈旧文案与卡片投影覆盖不在本批改**：projections/索引.md 产物表的『STY 24 条』为 project.py @1473 硬编码字面量；另 `render_sty` 只渲 1.2.x 子维度，故 OWN 四条在人类层只以 索引.md 条目清单行与 自检报告.md 逐条矩阵呈现，**无 STY.md 同型的卡片视图**（0.9/E2 的人类层同源投影对非 STY kind 尚缺卡片级产物）。两项均属投影器（脚本）侧改动，须与后续批次合并为独立的脚本改动批次（含注入测试重跑），本批不动脚本。条目数的权威载体 = method_registry.yaml meta.entry_count（check_meta 与实际条目数强校验），读者不应以该文案为计数权威。"
    basis: "母本正例 18-B（@621-641，消费字段 @640-641）；project.py check_ledgers（@1032-1044）、render_index 产物表（@1473）、check_meta entry_count 强校验（@910-961）；0.22 承诺一（编号与已发布引用不复用/不重排）；README §2（注册表级信息一律入顶层台账节，不进条目）"
    affected: "OWN-001…OWN-004 的 typical_reversibility 与 applicability/cost_profile 列表项顺序；ST-STY-01 与 ST-OWN-01 的 scope；projections/索引.md 产物表文案（留待脚本改动批次）"
    provenance: manual

