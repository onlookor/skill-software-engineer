    narrative:
      benefit_cost_analysis: "收益：把『业务状态已提交』与『事件待投递』收束进同一本地事务，消除生产侧的丢失窗口与双写不一致（业务写成功而消息未发，或反之）——@2477 逐字将其定位为『生产侧，4.2.4 已定义，行为面消费其投递语义』，故本条只登记行为面：投递语义的声明义务与消费侧幂等前提；定义面（发件箱表结构、常驻中继作业、与 4.2.4 数据面的一致性论证）归 DFL-001，两侧不重复计入同一延迟附加项以避免双重计数。与消费侧收件箱（RLP-002）或去重（RLP-001）成套即 5.6 示例七『幂等键＋inbox/outbox（赔付捕获的有效恰好一次语义，Z2 必答）』的落地形态。代价：投递由同步变为异步中继 → 端到端可见延迟附加项恒 ≥ 0（中继轮询间隔或 CDC 滞后），且随中继积压单调不减；可用性收束为 min(生产侧中继可用性, 消费侧幂等面可用性)，任一侧缺失即 at-least-once 退化为可重复副作用（Z2 硬）；投递语义一旦登记即为契约条款（5.4 接收约束方面 3 行），变更触达单元数 ≥ 生产者单元 + 全体消费者单元；行为面与定义面若分裂登记，质量影响卡片即缺项，方面 6 的行为级包络校验出现盲区（5.2.5『质量预算旁路』漏洞形态）。母本未给量化增量 → 一律只登记界形与单调性（0.4）。"
      typical_scenarios: "业务写与对外事件须原子可见的生产侧（4.2.4 发件箱行的适用面）；投递语义登记为 at-least-once 且消费侧已具备幂等面的异步交互（@2479＋5.4 接收约束方面 3 行）；事件驱动风格下的协同默认形态（5.4 接收约束方面 1 行『事件驱动 → 协同默认』）；与消费侧收件箱成套以达成有效恰好一次的场合（5.6 示例七）；需要以注册表条目承载 Z2 行为面义务、供方面 8 做重复/乱序注入验证的场合（5.4 施加约束方面 8 行）。"
      common_misuse: "生产侧用发件箱而消费侧无幂等面（AP1，Z2 硬违例，@2477『行为面消费其投递语义』的义务面缺失）；未显式声明投递语义即上线，或以中间件 exactly-once 声称替代声明（AP2，@2479『未声明 = Z2 违例』『非中间件魔法』）；行为面与定义面分裂登记致卡片缺项（AP3，Z7 升级型 → 0.15 升级路径）；把发件箱的投递语义读作跨单元一致性保证（AP4，Y6 冲突信号不消解，级别声明归 CSL 条目）；在本条重复计入生产侧 Δrelay（与 DFL-001 双重计数，违反 5.2.5 Σ 消费路径的加和口径）；为延迟附加项填无出处数值（0.4＋6.2.1 量化纪律）。"

  - entry_id: RLP-004
    kind: RLP
    name: "重试 + 指数退避 + 抖动"          # @2477 第四项原形含两个加号 → 按 MJ-21 (iii) 原形登记，不改写为「重试、指数退避与抖动」
    version: {major: 1, minor: 0, patch: 0}
    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-RLP-01）
    provenance:
      origin: hybrid                   # 骨架=5.2.3 @2477 行内加粗清单项＋5.2.2 @2473 retriable 定义；界形参数化与谓词转写（manual，MJ-2 同型）
      source_pointers:
        - {source_type: clause_id, value: "5.2.3", verified: true}   # @2477 第四项「**重试 + 指数退避 + 抖动**」（母本未给参数与量化增量）
        - {source_type: clause_id, value: "5.2.2", verified: true}   # @2473 三分类纪律：可重试（幂等 + 暂时性失败假设成立，重试至成功）；关键步之后全部可重试
        - {source_type: clause_id, value: "5.2.5", verified: true}   # 质量影响卡片五字段与 Σ 消费路径（本条按加和进入路径预算）
        - {source_type: clause_id, value: "5.3", verified: true}     # 交付空间驱动：值班/on-call 能力 → 重试风暴的观测与处置前提
        - {source_type: clause_id, value: "5.4", verified: true}     # 施加约束方面 6 行（卡片为方面 6 强制消费项）＋方面 8 行（超时与断路行为测试）＋全体七行
        - {source_type: clause_id, value: "5.5", verified: true}     # Z3（pivot_ordering_valid）＋Z4（Σ timeout_budget ≤ sla_bound）＋Z7
        - {source_type: clause_id, value: "5.6", verified: true}     # 示例一 @2598『SLA 要求的用户等待上界 < 捕获重试的最坏时长』；示例七 @2710 成套落地
        - {source_type: clause_id, value: "0.8", verified: true}
        - {source_type: clause_id, value: "6.2.1", verified: true}
        - {source_type: bib_id, value: 46, verified: true}
        - {source_type: bib_id, value: 51, verified: true}
    typical_reversibility: bounded     # 人工判断：重试上限次数、退避基数与抖动属策略配置面，可逐跳调整而不改动单元职责；但最坏重试时长一经被上游 Z4 预算吸收即成为 SLA 论证前提，收紧须重算路径预算 → 取 bounded（与 CRD-003 @2493 同型判据）。18-B S5 消费字段
    applicability:
      problem_space:                   # 骨架源：5.2.2 @2473 retriable 定义逐字＋@2477 第四项
        - "失败为暂时性且被重试操作幂等的交互（5.2.2 @2473 逐字『可重试（幂等 + 暂时性失败假设成立，重试至成功）』——两个前提缺一即不适用）"
        - "关键步（pivot）之后的步骤（5.2.2 @2473『之后的步骤全部可重试』；关键步本身既不可补偿也不宜重试）"
        - "同步调用链的瞬时失败面与 at-least-once 异步交互的重投递面（@2477 与 5.6 示例七 @2710 的成套落地语境）"
      current_space:                   # 交叉表源：5.2.2 前提＋5.4 施→6（卡片为方面 6 强制消费项）
        - "[消费侧/被调侧已声明幂等（RLP-001 或 RLP-002 之一在册）——5.2.2 明文以幂等为可重试前提]"
        - "[失败可分类为暂时性（网络抖动、限流、下游过载）而非确定性业务拒绝；分类不明 = Z3 违例 = 阻塞（5.2.2 @2473）]"
        - "[重试上限次数与退避参数已登记，且最坏重试时长已被上游超时预算（RLP-005）吸收]"
      delivery_space:                  # 交叉表源：5.3 交付空间驱动
        - "[重试放大后的峰值负载可被下游容量吸收（值班能力可承载重试风暴的观测、告警与断路处置）]"
    envelope:
      - metric: "延迟分位数 P99"
        bound_expr: "P99(带重试) 的上界 = Σ_{k=1..N}（第 k 次尝试耗时 + backoff_k），N = 登记的重试上限次数 → 最坏时长随 N 与退避基数单调不减；5.6 示例一逐字将其作为 Z4 预算不闭合的成因（『SLA 要求的用户等待上界 < 捕获重试的最坏时长』）；母本未给量化值 → 只登记界形与单调性（0.4）"
        source: {source_type: clause_id, value: "5.6", verified: true}
      - metric: "可用性目标（SLO）"
        bound_expr: "可用性(交互) 的上界受『暂时性失败假设』支配：假设成立时随尝试次数单调不减；假设不成立（确定性失败）时可用性无提升而延迟与负载全额付出 → 收益非无条件，须以失败分类可观测为前提"
        source: {source_type: clause_id, value: "5.2.2", verified: true}
      - metric: "性能：资源占用"
        bound_expr: "资源占用 = 每次在途尝试一份占用（连接/线程/队列位）+ 退避等待期的状态保持 → 随 N 与并发交互数同阶增长；抖动缺失时多实例重试同步化 → 瞬时占用出现尖峰（@2477 逐字列出『抖动』即为此项的封堵）"
        source: {source_type: clause_id, value: "5.2.3", verified: true}
      - metric: "可修改性：典型变更的实现成本（触达单元数）"
        bound_expr: "触达单元数(Δ 重试参数) = 调用方单元内 1（策略配置面）；但 Δ 最坏重试时长须同步至路径超时预算与 SLA 论证（RLP-005／Z4）→ 有效触达面 = 调用方 + 路径预算登记处"
        source: {source_type: clause_id, value: "5.4", verified: true}
    cost_profile:
      latency_budget_delta: "Δlatency = Σ 各次尝试耗时 + Σ 退避等待（指数退避 + 抖动）→ 恒 ≥ 0，随重试上限次数 N 与退避基数单调不减；本项按 5.2.5 Σ 消费路径**加和**进入路径延迟预算（aggregation_semantics: additive），5.6 示例一逐字称之为『捕获重试的最坏时长』并以其与 SLA 上界比较判定 Z4 是否闭合。具体数值母本未给 → 只登记界形、符号与单调性，不填无出处数字（0.4）"
      failure_modes: ["对非幂等操作重试 → 业务效果重复（5.2.2『幂等』前提缺失，Z2 的效果面失守）", "对确定性失败（业务规则拒绝、契约不兼容）重试 → 无效负载放大且延迟全额付出，可用性无提升", "无上限次数或无退避 → 重试风暴，下游过载自我强化（与 RLP-006 的快速失败面互为处置）", "退避无抖动 → 多实例重试同步化，瞬时负载尖峰（@2477 逐字列出『抖动』的成因面）", "最坏重试时长未纳入上游超时预算 → Z4 预算不闭合（5.6 示例一：用户等待上界 < 捕获重试的最坏时长 → 冲突信号走 CH-C）", "重试跨越关键步（pivot）→ 终局操作被重复执行（5.2.2：关键步既不可补偿也不宜重试；Z3 的 pivot_ordering_valid 违例）"]
      consistency_impact: "重试不改变一致性级别：跨单元仍为最终一致（1.2.3 事件驱动行）；其一致性效果完全由被重试操作的幂等性承担（5.2.2『幂等 + 暂时性失败假设』）→ 未声明幂等即重试会把 at-least-once 的重复投递放大为重复副作用（Z2 硬）；重试期间的中间状态可见性由预扣/隔离语义决定（CRD-008 与 CSL 条目承载），本模式不承载"
      observability_requires: ["每次尝试的结果与失败原因分类（暂时性 vs 确定性）可观测——不可分类即无法核验重试前提是否成立", "重试次数分布与退避等待时长可观测（最坏重试时长的实测面 = Z4 预算复核依据，5.5 Z4 括注『可推翻指标 = 实测传播延迟』同型）", "重试导致的下游负载放大可观测（重试风暴的早期信号）", "质量影响卡片五字段齐备且被方面 6 消费可核验（Z7）"]
      ops_cost: "[随重试上限次数与交互数上升：下游容量须按放大后的峰值负载核定（含重试风暴余量）、失败分类与告警须维护、最坏时长须纳入 SLA 论证；低于断路器＋舱壁（不引入新的隔离资源池），高于单次调用形态]"   # 18-B S5 消费字段
      skill_prerequisites: ["暂时性失败与确定性失败的分类判定（重试前提；分类不明 = Z3 违例 = 阻塞，5.2.2 @2473）", "幂等前提核验（RLP-001／RLP-002 之一已在册且键口径由业务事实稳定导出）", "指数退避与抖动参数核定，并把最坏重试时长纳入 Z4 路径预算（与 RLP-005 联动）", "关键步（pivot）识别——关键步及其之前的补偿步不得以重试处置（5.2.2）"]
      aggregation_semantics: additive  # 5.2.5 Σ 消费路径＋5.6 示例一逐字『捕获重试的最坏时长』与 SLA 上界直接比较 → 本项沿路径加和（与 RLP-005 的 Z4 Σ 同侧；对比 RLP-001/002/003 的 itemwise）
