    references: []                     # 母本 5.7 书目无 2.2.1 S4 行的行级登记提取面；书目 8（Vernon）的行级面为「限界上下文识别与上下文映射的操作化（2.4 施加给方面 3 的约束）」，属条款级面 → 按 G-CRD-1 同型纪律不下探至本行；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）→ 登记 G-DEC-1，待人工裁决补勘后回填（SO-8）
    narrative:
      benefit_cost_analysis: "收益：唯一直接操作化 W4 的策略（2.4 施→4 明文「即 W4」），数据变更的触达单元数上界为 1，跨边界数据依赖单调不增；把最难的现状事实（遗留数据归属，2.3 硬输入）转为主驱动，棕地场景的可行性排序有明文依据（2.4 接收约束方面 4 行）。代价：数据迁移是重运维项，迁移窗口内须双写与对账；现状数据不可干净归属时本策略受约束（软），拆分序列须按迁移可行性排序，否则失序即产出不可回退的中间态；共享写例外须批准 + 退出计划（4.5 Y1），治理成本高；归属清晰不等于语义内聚，仍须与 S1/S3 组合并过 2.2.2 判据；逆转成本高（数据迁移 + 契约变更双面）。"
      typical_scenarios: "遗留数据归属复杂、须以现状事实为主驱动的棕地分解（2.2.1 主导驱动空间列含现状空间；2.3 现状空间驱动第二行）；与 S3 组合处理能力项横跨数据写路径的冲突（2.6 示例四）；数据变更频繁且须收敛触达面的场合；跨所有者强一致需求须先定归属再走 Y6 判定的场合（方面 4）。"
