manual_judgments:
  - id: MJ-1
    subject: STY 批编号裁决（分块序）
    judgment: "母本反例 18-A 已发布引用 STY-04（事件溯源）。按 0.22 承诺一（编号一经发布永不复用、不重排），STY 批不按母本表序连续编号，而采分块序：子维度三（1.2.3）= STY-001…006，使『事件溯源 + CQRS』= STY-004；子维度一（1.2.1）= STY-007…013；子维度二（1.2.2）= STY-014…019；子维度四（1.2.4）= STY-020…024。书写统一为三位数字，母本 STY-04 与 STY-004 为同一 entry_id 的两种书写形态，母本零改动。"
    basis: "0.22 承诺一；README §4 裁决表；用户裁决（AskUserQuestion，选项『分块序，锚定 STY-004』）"
    affected: "全部 24 条的 entry_id"
    provenance: manual

  - id: MJ-2
    subject: 方向性摘要 → 参数化界的转写规则
    judgment: "母本包络要点列只有方向（↑/↓/↑↑）与代价描述，无参数化公式。转写规则：(i) metric 取 6.2.1 封闭词汇（映射见 G-ENV-1）；(ii) bound_expr 写成含参数的不等式或等式，参数名显式（如 overhead_L、N、freshness_window），禁填无出处的具体数值（0.17.7 门槛 2：无出处的性能宣称 = 假精确，拒绝准入）；(iii) 母本一句多分句时拆为多项界（如 STY-015 三分句 → 三项）；(iv) source 指向母本行（row_id）+ 条款（clause_id），文献佐证按各条 references 登记面。"
    basis: "0.8 包络定义；0.17.7 门槛 2；6.2.1 指标封闭词汇；0.17.6(1) 骨架源限定（『包络只有 ↑/↓ 方向、无参数化公式』）"
    affected: "STY-001…STY-019 的 envelope（子维度四条目豁免，见 profiles.yaml entry_level_exemptions）"
    provenance: manual

  - id: MJ-3
    subject: 1.2.5 冲突行术语 → 条目的映射
    judgment: "1.2.5『事件溯源 × 强同步查询语义 → 张力（读模型最终一致）』的对侧『强同步查询语义』不是 1.2.1–1.2.3 表中的风格行名，而是问题空间要求。映射：在本批内以 STY-001（请求-响应/同步调用风格）为 peer 登记 tension，evidence 引 1.2.5 原行并注明映射为人工判断。1.2.5『严格分层 × 高性能内层直访』的对侧『高性能内层直访』同型处理（登记于 STY-007，peer 指向其自身松弛分层变体的处置措辞）。"
