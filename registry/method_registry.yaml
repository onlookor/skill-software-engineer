        signal_level: P1               # 2.4 接收约束方面 1 行「单体 → S7 退化，分解可纯逻辑」为许可性规定（MJ-4：许可性 → soft）→ 误用为强制不构成硬性质违例，无 W/X/Y/Z 硬性质可绑定 → P1
    formal_anchor:
      - {property_id: W1, role: consumed_by}     # ∀M: seam(M)（2.5）
      - {property_id: W2, role: consumed_by}     # 2.4 施→8：每个分解单元必须是一个可独立验证的单元
      - {property_id: W3, role: consumed_by}     # 2.3 交付空间驱动：S6 过滤器横切适用（条件硬）；部署单元数与分解单元数同增使其成为本策略的实际约束
      - {property_id: W7, role: consumed_by}     # 2.3 双使用者条款：主策略选择走批准路径
    references: []                     # 母本 5.7 书目无 2.2.1 S7 行的行级登记提取面（书目 6/5/3 的行级面为 1.2.x 风格表行，书目 10 的行级面为「组件化判据，2.2.3 seam 概念的理论基础」属节级面）→ 按 G-CRD-1 同型纪律「表级/节级面不下探」不扩张；留空不得被读作『该行无外部文献支撑』（unknown ≠ false，0.18.6 M15）→ 登记 G-DEC-1，待人工裁决补勘后回填（SO-8）
    narrative:
      benefit_cost_analysis: "收益：单元与部署单元一一映射，消除部署单元与语义单元错位（2.4 接收约束方面 1 行理由列：错位是分布式单体/纳米服务的根源），独立部署与独立发布的边界天然清晰；主导驱动为现状空间 + 方面 1 硬约束（2.2.1），在风格已定的场合可直接落地，无需额外的问题空间输入；deploy 类依赖在 DSM 中可显式建模（2.2.4 依赖种类含 deploy），反馈环可观测。代价：本策略的可用性由方面 1 的风格决定——微服务 → S7 强制，单体 → S7 退化，分解可纯逻辑（2.4 接收约束方面 1 行，硬），不能独立于风格选型使用；一一映射把部署单元数与分解单元数锁定为同增，运维单元数与团队容量压力同步上升，须过 S6 过滤器（2.3 交付空间驱动第一行）与 2.2.3 停止准则；跨部署单元的契约变更成本进入包络（2.4 施→6 软）；母本 5.7 书目无本行的行级登记提取面 → references 留空并登记 G-DEC-1（SO-8）。"
      typical_scenarios: "方面 1 已选定微服务/分布式部署风格的场合（2.4 接收约束方面 1 行：微服务 → S7 强制）；现状已有物理部署边界、须以现状为主驱动的棕地分解（2.2.1 主导驱动空间列含现状空间；0.11 现状锁定）；须以 deploy 类依赖做反馈环治理的场合（2.2.4 通道二）；单体风格下需把分解表达为纯逻辑边界的场合（S7 退化分支）。"
      common_misuse: "微服务风格下分解单元与部署单元错位（AP1；分布式单体/纳米服务的根源）；单体风格下仍强制物理拆分而不表达为纯逻辑边界（AP2；退化分支被误用为强制）；以部署边界替代语义边界判据（2.2.2 横切适用）；把「微服务 → S7 强制」反读为『S7 要求微服务』（母本方向为风格 → 策略；ENUM_RELATION 无 required_by，本侧只登记 composable，方向问题留待人工裁决，MJ-20 (vii)）；跳过 S6 过滤器与 2.2.3 停止准则即按部署单元数定分解粒度。"

