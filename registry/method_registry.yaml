    subject: STP 批七项判读——三列源表的字段归类、latency_budget_delta 一律填实的依据、compatibility 方向与两条 tension 不升级、4.4 施加表七行的级别分布、行级书目定性、谓词面精确事实与母本 4.5 公式七词缺口、Read 工具行号偏一的据实记载
    judgment: "(i) **4.2.2 源表只有三列 → 字段归类判读**：母本 4.2.2『存储拓扑』（heading @2171）的表头（@2173）为『拓扑｜定义｜与风格的关系』三列、四行 @2175-2178，不含 3.2.1／3.2.2 的『机器层天然性』『默认值』列，也不含 2.2.1 的『主导驱动空间』列 → 注册表各字段无法一对一取自本表，须按下列归类取源（每项登记均指回具体列或交叉表源，0.17.7 门槛 2）：name 取首列逐字（去粗体标记，MJ-13 (iv)／MJ-20 (i) 同型）；applicability.problem_space 取第三列的风格挂钩明文，current_space／delivery_space 只在母本有明文时填（STP-004 的交付空间硬过滤器系末行第三列明文，其余三条据实为空列表而非 null）；envelope 取第二列『定义』中可机器化的界形（P99 关系式、故障域上界、触达单元数上界）＋4.5 Y 系列界形，metric 一律限于 G-ENV-1 已登记四族的短形态；cost_profile.latency_budget_delta 取第二列＋第三列（判读见 (ii)）；anti_patterns 取 4.5 违例形态（Y 系列的否定面）＋4.6 示例一／示例三的拒绝理由；constraints_imposed 取 4.4『施加约束』表方面 4 七行（判读见 (iv)）；compatibility 取 1.2.2／1.2.3／1.2.5／1.4 的交叉表明文（判读见 (iii)）；references 取 4.7 的行级登记面（判读见 (v)）。**归类纪律两面**：一面是不得以『三列表未给』为由留空可由交叉源推导的字段（envelope／constraints_imposed／compatibility 的可推导性来自 4.4／4.5／1.2.x／1.4，非本表），另一面是不得以交叉源填补本表未给的定性——typical_reversibility 只按母本明文分级（costly 3＝STP-001／STP-003／STP-004；bounded 1＝STP-002，schema 级隔离形态的迁移代价低于实例级重绑），不引入母本未给的度量（0.4 禁假精确）。(ii) **latency_budget_delta 四条一律填实、不照抄 OWN／CSL 批的『不适用』**：依据＝kind_profile_STP.narrative.note（profiles.yaml @221）逐字明文『存储拓扑直接决定访问延迟与一致性可达界，故 cost_profile.latency_budget_delta 与 envelope 均不降级为选填』；OWN／CSL 批的『不适用』系其剖面未作同型要求 → 该措辞不得平移（剖面 narrative.note 是 kind 级口径，非条目级可选）。四条一律只登记**界形＋符号＋单调性**、不填无出处数字（0.4）：STP-001『Δlatency(跨单元访问) = P99_via_owner(D) − P99_in_unit(D) ≥ 0，随访问路径跳数单调不减』；STP-002『≤ 0（负向节约）』并附**该节约不得计入 S4 得分**的判读（1.2.3 共享数据行『时间耦合与隐式契约是默认代价』→ 延迟节约不抵偿该代价，否则将以本表未给的收益项影响 2.2.1 策略打分）；STP-003 读侧『投影延迟 ≥ 0，随流处理拓扑与批量窗口单调不减』＋写侧『事件追加 + 快照重建开销 ≥ 0』，并挂钩新鲜度窗口须落为数据契约条款（4.2.3 最终一致行『窗口时长是契约条款』＋4.2.5 新鲜度字段）；STP-004『逐查询类』符号的**条件性**（引擎与访问模式匹配 → ≤ 0；错配 → ≥ 0）→ 只登记判定面（逐查询类实测 P99 对照注册表阈值）与符号条件性，不预定符号方向（4.6 示例三可推翻指标同旨）。(iii) **compatibility 七行的方向与级别判读**：（a）两条 requires 一律由下游侧（本批 STP 侧）承载——STP-001 → OWN-001（4.2.2 首行第三列判据句『判据是访问路径是否唯一经所有者』＝ OWN-001 的 Y1／Y2 实现面）、STP-003 → STY-004（同行第三列『事件溯源风格的存储形态（1.2.3）』＋1.2.3 定义列『状态以事件日志为准（溯源）』）；ENUM_RELATION 无 required_by 且两对侧均属**已发布**条目 → 单侧登记、不回填镜像（MJ-17 (iii)／MJ-21 (viii) 同型）。（b）三条 composable 系许可性／推荐性条款 → 不升 requires：STP-002 → STY-014（『单体风格可用』＝许可性）、STP-002 → STY-015（『模块化单体推荐 schema 级隔离（为未来拆分保留缝）』＝推荐性）、STP-001 → STY-016（1.4 施→4 微服务行『每服务自有数据库为默认』；方向为风格 → 存储拓扑，在被施侧以 composable 登记）；STP-001 → STY-016 不取 requires 的理由＝第三列明文『私有 schema 或私有实例均可』→『默认 + 偏离须显式记录』不构成构成性必需（MJ-4 同型判读）。（c）**两条 tension 均不升 hard_conflict**：STP-002 → STY-006（1.2.3 共享数据行反模式明文『以共享数据库实现服务间集成（分布式单体信号）』＋该行适用条件限定『仅限批处理交接、配置分发等弱耦合场景』）、STP-002 → STY-016（1.2.2 微服务行定义列含『独立数据』→ 单一存储实例与该定义性约束相左）；级别依据＝1.2.5 硬冲突清单**未列**『共享数据 × 共享数据库』与『微服务 × 共享数据库』两对（该清单在方面 1 只到『微服务 × 跨单元 2PC 作为默认一致性手段』＝已由 STY-016↔CSL-001 承载）→ 按 MJ-9『无母本明文不登记更强级别』只记 tension；是否应在母本 1.2.5 补列属 R2／ADR 面，本项不预判、不在数据批次内执行。（d）**与既有镜像裁决口的关系**：STP-002 → STY-016 为 tension，而 DEC-007↔STY-016、CTR-001↔STY-016 两处的镜像方向系 s5h 既有裁决口 → 三者同 peer 而 relation 不同，不合并、不互相带动。（e）STP-004 的 compatibility 为空列表系**有据的空集**：4.2.2 末行只给运维面扩张、交付空间硬过滤器与负载证据纪律，未登记与任何已入库条目的互斥／依赖／叠加明文 → 不凑数登记（MJ-9）；此与 (v) 的 references 空集性质不同——前者是母本明确无对（不产生勘察义务），后者是母本有面而未下探到行（产生 SO-10）。（f）**M9 不承载镜像纪律**：project.py 的 check_m9 只查 peer 存在性 → 七行单侧登记不触发硬失败，镜像纪律以 ST-STP-01 的 condition 与本项为承载载体（MJ-21 (viii) 同型）。(iv) **constraints_imposed 四条逐字相同七行、级别分布 hard 16／soft 12**：源＝4.4『施加约束』表（heading @2234、小节标题 @2247、表头 @2249-2250、方面 4 七行 @2251-2257），四条各 7 项 → 合计 28 项。级别取母本级别列逐字：施→2 软（数据归属现状回馈分解：S4 策略受约束、拆分序列须按数据迁移可行性排序）、施→3 硬（数据契约的 schema 与语义条款由本方面供给）、施→5 硬（一致性模型 → 协调模式可行集，Y6 的下游消费路径）、施→6 软（一致性级别声明与新鲜度条款 → 质量判定的代价计入项）、施→8 软（不变式 → 对账验证项；血缘 → 派生数据可重建性测试；边界校验 → 契约测试的数据面）、施→9 硬（数据漂移守护对象三项）、施→10 硬（机器层 Y 谓词集＋血缘图；人类层覆盖子集的投影视图）→ 每条 hard 4＋soft 3，四条合计 hard 16／soft 12。判据承 MJ-4（禁止性／默认偏离须记录条款 → 硬，许可性／代价计入类条款 → 软），级别不自行升降。**与 CTR 批施→8 取 conditional 的差异据实记载**：CTR 批的施→8（3.4 施加表 @1987）级别列原文为『软/硬按风格』＝条件级别 → 取 conditional（MJ-21 (x)）；本批的施→8（4.4 施加表 @2255）级别列原文为『软』＝无条件级别 → 取 soft；两表同 aspect 号而不同源、级别列措辞不同 → **不得把 CTR 的 conditional 判读平移到 4.4**。(v) **references 的行级／性质级定性**：4.7（heading @2427、书目 35–43 于 @2429-2437）中与方面四相关的九项登记面里，行级指向 4.2.2 表行者仅两项——书目 37（Fowler, Event Sourcing, 2005）＝『4.2.2 事件日志权威状态』→ STP-003 已引；书目 38（Fowler, Polyglot Persistence, 2011）＝『4.2.2 多语言持久化及其适用纪律』→ STP-004 已引；两者 compile_usage 一律 metadata_extraction、信任级一律 [已核验]，逐字承母本，注册表侧不得改写或降级；两书目各自的『本地展开锚点』（37：PoEAA 2003＋Exploring CQRS and Event Sourcing 2012；38：NoSQL Distilled 2012）系母本明文标注的展开参照，不产生独立 bib_id、不充作额外出处（G-CTR-1 尾注书目 4 同型处置）。其余七项的登记面均非本表行级面：35＝4.2.3 一致性模型谱系与复制/分区机制、36＝补偿一致原始论文（CSL-005 已承载）、39＝4.2.3 降级纪律（CSL-003 已引）、40＝**4.5 性质级**（Y7 可重建性理论基础）、41＝4.2.1 数据产品（OWN-001 已引）、42＝4.2.4 发件箱、43＝4.2.4 CDC（narrative_only）→ 按 G-CRD-1／G-DEC-1／G-CTR-1 同型纪律『节级／表级／性质级面不下探』不扩张，四处具体裁定（35 不充 STP-001／STP-002、39 不下探至 4.2.2 两行、41 不充 STP-001、40 不下探至 STP-003）载于 G-STP-1.impact。**据实认定一处实测事实**：书目 35 与书目 40 现全库无任何条目引用（OWN 批对 Y7 的两实例系 formal_anchor 引用而非 references 引用）→ 该两项的『无消费者』状态是登记面事实，不构成本批的补引义务，亦不得被读作『该两书目无用』（unknown ≠ false，0.18.6 M15）。故 STP-001／STP-002 的 references 以空列表＋行内注显式登记即满足 M2（has_path 口径：空列表＝字段在案，project.py @170-177），不以本地造引充数（0.4）；补勘义务登记为 G-STP-1／SO-10，其 route 的三个下探口一律留人工裁决，本批不自行裁决、不本地扩张解释面。(vi) **谓词面精确事实与母本 4.5 公式七词缺口（两面不同源、不合并计数）**：（a）**4.2.2 侧七词不入 M4 扫描面**——storage_instance／schema_isolation／event_log／materialized_view／query_class／engine_set／load_evidence 实测只出现在 cost_profile.latency_budget_delta 与 envelope 的 bound_expr（及块头注释 @4662-4665）中，而 M4（PRED_CALL_RE 先经 outside_brackets 剔半角方括号）只扫 anti_patterns.detection_predicate 与 applicability 三空间 → 七词不产生未登记候选；本批 detection_predicate 剥方括号后的调用词只有 access_path／data_lineage／dataset／has_approved_exception／owner／shared_write_exception 六词，全部已登记 → **本批谓词面零新增候选，累计仍为 19 词**（MJ-19 (i) 4＋MJ-20 (iii) 7＋MJ-21 (v) 8，归 s5g）。块头注释 @4662-4665 的『方括号占位』措辞与实测不符（七词实际落 bound_expr、未以方括号占位形态出现）→ 按 0.22 承诺一（已发布登记不改写）**不改写该注释**，精确事实以 ST-STP-01 的 note 与本项为承载载体（MJ-18 (ii) 同型：以新增登记留痕而不改写历史文本）。（b）**母本 4.5 公式自身有七词缺口**（脚本按 76 个已登记名逐条比对：predicates 59＋formula_words 7＋clause_defined_predicates 10）：Y1（@2279-2280）缺 has_approved（登记形态为三元 has_approved_exception，母本用一元 has_approved(shared_write_exception(D))）；Y2（@2281-2282）缺 provider；Y3（@2283-2285）缺 aspect6_target（其 level 系 consistency_level 的实参槽名 @2267，以槽名充当谓词属本地造词、VG-04 同型纪律 → 不作为候选登记）；Y6（@2290-2291）**整条公式无一登记谓词**，缺 cross_owner_strong_consistency_requirement／conflict_signal／saga_candidate／reopen（saga 已登记于 5.5 面，saga_candidate 未登记）；W4（@1717）只用 owned_by（已登记）→ **W4 是当前唯一可机器求值的接线面**。该七词系母本公式侧缺口，与 (a) 的 19 词（detection_predicate 侧）不同源、不合并计数；处置＝按 predicate_vocabulary.yaml 的 meta.note『新增谓词名 = R2 提议，不得在本文件本地扩词』一律不在本批扩词，登记为 WV-STP-E3-01 的 remediation_plan (a) 前置条件（七词须先经 R2 核定，W4 面可先行接线），归 s5g。（c）**G-ENV-1 的规避口径**——本批 envelope 的 metric 一律取 G-ENV-1 已登记四族的短形态，不引『可观测性』『安全』『合规』三族 → 不触 G-ENV-1（四族 vs 母本 6.2.1 七族）的争议面；该差异仍系待人工裁决口，本批不预设其结论。（d）**MJ-20 (iii)／MJ-21 (v) 的 basis 出处误指据实记载**——两项的 basis 均写『profiles.yaml … ENUM_*』，而 ENUM_RELATION／ENUM_LEVEL／ENUM_SIGNAL／ENUM_AGG 四组常量的真身在 project.py @57-62（profiles.yaml 侧无该四组定义）→ 按 0.22 承诺一不改写两项已发布登记，更正以本项留痕，全库 basis 的出处核验并入 (vii) 的 s5h 一致性核验口。(vii) **Read 工具行号偏一的据实记载与权威口径**：（a）**成因**——以 Read 工具读取文件时，若 offset=N 指向的第 N 行为**空行**，该空行被丢弃而行号未作补偿 → 其后显示行号比真实行号**小 1**；起始行为非空行时编号正确。（b）**实测复现**——母本第 4005 行为空行、第 4006 行为围栏行：Read(offset=4006) 编号正确，Read(offset=4005) 把 4006 的围栏行标为 4005；python 行序（split）与 ripgrep -n 两侧一致给出真实编号（Y1 @2279、Y2 @2281、Y6 @2290、E1 @4007／E2 @4008／E3 @4009／E4 @4010-4011）。（c）**权威口径**——自本批起，一切入档的 @行号 引用一律以 Grep -n（ripgrep）或 python 行序为权威，不得以 Read 的显示号入档。（d）**受影响面（据实）**——前六项 Waiver（WV-STY／WV-OWN／WV-CSL／WV-CRD／WV-DEC／WV-CTR-E3-01）的 rule 字段均写『E3（母本 @4008）』，而 @4008 实测为 E2（同源生成）、E3 在 @4009；另『纪律一 @1312』实测真身在 @1313。（e）**未受影响面（实测正确）**——4.4 施加表 @2251-2257、2.5 W4 @1717、4.7 书目 @2429-2437、registry 块头注释 @4662-4665、project.py @170-177 等经本批逐一复核者编号正确 → 属**混合状态**（取决于当时 Read 的 offset 是否落在空行），非全局偏一，故不得以『整体位移 1』的方式批量修正。（f）**处置**——按 0.22 承诺一（编号永不复用／重排、已发布登记不改写）＋用户既往裁决（不得改写既有登记文本，更正以新增登记留痕），六项已批准 Waiver 与既有台账文本**一律不改写**；WV-STP-E3-01 的 rule 按实测行号登记为 @4009 并附行内注指向本项。（g）**待裁决口**——全库 @行号 引用的一致性核验（含 (d) 两处与 (vi)(d) 的 basis 出处误指）列为 s5h 待裁决事项；核验如确认偏一处，修正方式须以新增登记留痕，是否对已批准 Waiver 作勘误性改写属**人的裁决**，Agent 不自行执行。"
