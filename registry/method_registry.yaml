    status: seed                       # draft→seed 简记见顶层 status_transitions（ST-OWN-01）
    provenance:
      origin: hybrid                   # 骨架=4.2.1 表行＋谓词转写与界形参数化（manual，MJ-2 同型）
      source_pointers:
        - {source_type: row_id, value: "4.2.1-所有者 + 授权读副本", verified: true}
        - {source_type: clause_id, value: "4.2.1", verified: true}
        - {source_type: clause_id, value: "4.3", verified: true}
