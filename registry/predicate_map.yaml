# 卡片谓词覆盖与豁免台账（TD-SE-PRED-001 关闭判据 5）
#
# 权威方向：卡片 outputs.predicate_writes / predicate_expr 是表达式与写入面的
# 权威源；本表只登记覆盖与豁免，不复制表达式正文，不改卡片。
#
# 漂移判定：卡片表达式或名字集合与台账的 expr_sha256 / name 不一致即漂移。
# 漂移检测：计划由 registry/checks/ 下的 D2 覆盖检查执行并汇总进
# project.py --check；检查器落地前 --check 不读本表，本表只作人工核对依据，
# 不宣称机检已消费（见 DATA-SPEC.md D3.18）。
#
# D4（2026-11-19）填充 33 名：mapped 30 名，exempt 3 名（豁免上限 3 由人类核定）。
# 生成型 pact 不得进入 exempt；exempt 必须带 owner／due／approved_by／reason。
# predicate_writes 位于卡片 outputs 层，故 expr_refs 的 step_id 统一写 outputs。

