whiteboard:
  deployment: "pilot-pact-dsh"
  schema_ref: "0.7 谓词集 / 0.21.6 sm_state 正名"
  pattern_version: "pv-1.1"      # 母本 0.7 定义模式版本语义、同处声明现行值；D-10 已闭合；2026-11-14 因 0.18.6 补登记 selection_context 升 MINOR
  version_vector:
    aspect_1: 1                  # +1：style(pact-dsh, …) 写入
    aspect_2: 1                  # 批 A：module_inventory / unit_test_inventory
    aspect_3: 1                  # 批 A：connects / contract / shared_data_access
    aspect_6: 1                  # +1：verdict_table 写入
    aspect_8: 1                  # 批 A：契约测试与单元测试登记面
    aspect_9: 1                  # 批 A：deploy_strategy
    aspect_10: 0                 # 无投影物化（D-11）
  artifact_version: "pilot-20261112.12"
  target_repo: "/home/user/projects/pact-dsh"   # 机械校验读取的源码根；pilot 本地事实

  committed:                     # 已写入（有 step_log 指针）
    - expr: "selection_context(DP-1-STYLE, F, C)"
      written_at: "S0"
      note: "[escalate] 该谓词在母本 0.18.2 有正文，不在 0.18.6 机器层谓词块"
    - expr: "selection_procedure(DP-1-STYLE, S0, C0)"
      written_at: "S0"
    - expr: "selection_procedure(DP-1-STYLE, S1, C1)"
      written_at: "S1"
    - expr: "step_log(DP-1-STYLE, S1, In, Evals, candidate_set, T, Executor)"
      written_at: "S1"
    - expr: "exclusion_record(DP-1-STYLE, STY-002, applicability.problem_space)"
      written_at: "S1"
    - expr: "selection_procedure(DP-1-STYLE, S2, C2)"
      written_at: "S2"
    - expr: "step_log(DP-1-STYLE, S2, In, Evals, survivor_set, T, Executor)"
      written_at: "S2"
    - expr: "selection_procedure(DP-1-STYLE, S3, C3)"
      written_at: "S3"
    - expr: "step_log(DP-1-STYLE, S3, In, Evals, feasible_set, T, Executor)"
      written_at: "S3"
    - expr: "selection_procedure(DP-1-STYLE, S4, C4)"
      written_at: "S4"
      evidence: "s4-verdict-pact-dsh.yaml v1.0.0"
    - expr: "step_log(DP-1-STYLE, S4, In, Evals, verdicts, T, Executor)"
      written_at: "S4"
      evidence: "s4-verdict-pact-dsh.yaml#step_log"
    - expr: "verdict_table(DP-1-STYLE, STY-001, {G-LAT-01, G-AVL-01, G-LT-01, G-CON-01}, reachable_with_cost)"
      written_at: "S4"
      evidence: "s4-verdict-pact-dsh.yaml#verdict_table；目标集 TS-PACT-DSH-001 v1.0.0；包络绑定 EB-PACT-DSH-STY-001 v1.0.0"
    - expr: "selection_procedure(DP-1-STYLE, S5, C5)"
      written_at: "S5"
    - expr: "step_log(DP-1-STYLE, S5, In, Evals, selected_entry=STY-001, T, Executor)"
      written_at: "S5"
    - expr: "selection_procedure(DP-1-STYLE, S6, C6)"
      written_at: "S6"
      evidence: "ADR-DP1-STYLE.md；批准人 user 2026-11-12T21:29:21+08:00"
    - expr: "style(pact-dsh, (·, ·, 同步请求-响应, ·))"
      written_at: "S6"
      derived_by: "编译规范 5.7 P1–P3（R-1）"
      state: "approved"
      note: "决策记录 approved：10.2.5 6/6（v1.6.0）；2026-11-13 经 SM-DR provisional → approved（retro_approve，human user）追认"

  domain_data:                   # 批 A 登记（D-A/D-D）；键名取母本硬性质原文
    module_inventory:
      - {id: index, path: index.js, role: "DSH host 插件装配入口（审计镜像）"}
      - {id: loop-entry, path: loop.js, role: "agent-loop 行覆盖入口，组装 backendFor"}
      - {id: config, path: src/config.js, role: "环境变量加载与配置校验"}
      - {id: govern, path: src/govern.js, role: "PACT govern 钩子（preset/participant 路由）"}
      - {id: loop-core, path: src/loop.js, role: "AgentLoop 子类，按 backendFor(key) 调用后端"}
      - {id: names, path: src/names.js, role: "名称校验与 instance key 派生"}
      - {id: observer, path: src/observer.js, role: "审计事件 JSONL 追加写入"}
      - {id: pact-backend, path: src/pact-backend.js, role: "backend 契约定义＋内存 double"}
      - {id: wasm-backend, path: src/wasm-backend.js, role: "pact-wasm host 适配器"}
    unit_test_inventory:
      - {unit: config, test_files: [test/config.test.js]}
      - {unit: govern, test_files: [test/govern.test.js]}
      - {unit: names, test_files: [test/names.test.js]}
      - {unit: observer, test_files: [test/observer.test.js]}
      - {unit: pact-backend, test_files: [test/fake-backend.test.js]}
      - {unit: wasm-backend, test_files: [test/wasm-backend.test.js]}
      - {unit: loop-core, test_files: [test/loop-routing.test.js]}
      - {unit: index, test_files: [test/index.test.js]}
      - {unit: loop-entry, test_files: [test/loop-entry.test.js]}
    connects:
      - from: loop-core
        to: pact-backend
        protocol: "同步请求-响应"
        channel: "进程内函数调用（backendFor(key) → enabled/gates/seed/produce/consume/status）"
        evidence: "src/loop.js 调用 backend 方法；src/pact-backend.js#L1-L8 契约注释"
    contract:
      - id: "CT-PACT-BACKEND-01"
        provider: pact-backend
        consumers: [loop-core]
        version: "0.1.2"
        compat_policy: "契约版本与包版本解耦（CT-PACT-BACKEND-01@<major>，当前 @1 对应包 0.1.2）；加性变更升 minor；破坏性变更升 major，并保留旧契约面至少一个小版本或 30 天（取较长者），窗口内不得删除；窗口未满删除旧面或未升 major 视为违约（ADR-0002）"
        lifecycle: published
        adr: "adr/ADR-0002-CT-PACT-BACKEND-01.md"
        evidence: "src/pact-backend.js#L1-L8（backend contract）；FakePactBackend 与 wasm-backend 同形实现；package.json version 0.1.2（已发布 npm）；adr/ADR-0002-CT-PACT-BACKEND-01.md（2026-11-14 人类批准）"
    contract_tests:
      - {contract: "CT-PACT-BACKEND-01", file: "test/contract.test.js", in_ci: true, note: "覆盖七方法、错误码与「只增不删／旧面保留」；CI 的 npm test 会执行"}   # 非空集
    deploy_strategy:
      - id: "DEP-PACT-DSH-01"
        mechanism: "npm 包发布（release.yml：tag + OIDC）＋ cordis.patch.yml 覆盖 agent-loop 行"
        rollback: "发补丁版回退为主（revert + 升补丁号，如 0.1.3，由现有 tag 触发流程发布）＋对缺陷版本执行 npm deprecate 指向新版本；已发布版本不可真正撤回，同号不可重发"
        compatible_with_style: true
        style_conformance:
          - {constraint: "STY-001 同步请求-响应", status: conforms, evidence: "backend 判定在 pre-step/pre-tool 内同步 await，无消息中间件或队列"}
          - {constraint: "不注册 AgentFactory", status: conforms, evidence: "index.js#L8-L9：本行不注册 AgentFactory，factory 归 cordis.patch.yml 覆盖的 agent-loop 行所有"}
          - {constraint: "仅按 id 覆盖 cordis.patch.yml 行", status: conforms, evidence: "cordis.patch.yml：disabled 原 agent-loop 行并 insert pact-agent-loop / dsh-pact-observe"}
          - {constraint: "不新增故障域（G-AVL-01）", status: conforms, evidence: "backend 默认进程内 FakePactBackend；wasm 为本地惰性导入，无远端依赖"}
          - {constraint: "单可部署单元（G-LT-01）", status: conforms, evidence: "npm 单包发布，release.yml 一次 tag 产出单个可部署单元"}
        evidence: ".github/workflows/release.yml；cordis.patch.yml；README.md「契约版本与兼容策略」"
    shared_data_access: []       # 显式空集：跨单元无共享数据结构；审计 JSONL 的所有权见 owned_by
    # V1 分层（2026-11-14 人类批准；当轮为弱校验，本轮已升级为机械校验）
    layer_of:
      - {component: index, layer: L0-entry}
      - {component: loop-entry, layer: L0-entry}
      - {component: config, layer: L1-core}
      - {component: govern, layer: L1-core}
      - {component: loop-core, layer: L1-core}
      - {component: names, layer: L2-foundation}
      - {component: observer, layer: L2-foundation}
      - {component: pact-backend, layer: L2-foundation}
      - {component: wasm-backend, layer: L2-foundation}
    dependency_rule:
      - {from: L1-core, to: L0-entry, relation: forbidden}
      - {from: L2-foundation, to: L0-entry, relation: forbidden}
      - {from: L2-foundation, to: L1-core, relation: forbidden}
    # W4 所有权（2026-11-14 人类批准；本轮已升级为机械校验，human_review 仅作历史证据）
    owned_by:
      - {owner: observer, object: events.jsonl, right: write,
         evidence: "src/observer.js:16 appendFileSync（唯一写点）；默认文件名 src/observer.js:9",
         human_review: {approved_by: user, approver_kind: human, approved_at: "2026-11-14",
                        note: "单一所有者已由人类确认：observer 持写入权；本轮已升级为机械校验"}}
      - {owner: index, object: events.jsonl, right: create_and_configure,
         evidence: "index.js:13 创建 FileSink；路径由 config.mirrorDir 决定，null 时不创建",
         human_review: {approved_by: user, approver_kind: human, approved_at: "2026-11-14",
                        note: "同一确认：index 持创建/配置权，与写入权分离；本轮已升级为机械校验"}}
    # W1 接缝封闭（2026-11-14 人类裁定方案 A：人工核结论）
    human_review:
      - {property: W1, approved_by: user, approver_kind: human, approved_at: "2026-11-14",
         conclusion: "W1 接缝封闭：覆盖面为 module_inventory 全部 9 个单元（index、loop-entry、config、govern、loop-core、names、observer、pact-backend、wasm-backend）。逐一核对模块间调用与 import，未发现经由未声明接口的跨模块访问，无例外。"}
    # G7 P2 信号（2026-11-15 按 ADR-GUARD-02 改为无值声明：值属运行时产物，未约定即 cannot_evaluate）
    p2_signals:
      - id: GR-005
        source: "registry/guard_registry.yaml"
        level: P2
        alarm_threshold: "漂移只登记不追"
        trend_window:                 # 只声明形态，不含值（不得补默认值／示例值）
          metric: {type: "enum: count|time", values: [count, time], required: true, unconfigured: "cannot_evaluate"}
          value: {type: number, range: ">= 1", required: true, unconfigured: "cannot_evaluate"}
        value_state: "not_agreed"      # 值未约定：本部署尚未与项目用户约定，未约定即 cannot_evaluate
        note: "趋势窗为无值声明：metric 取 count（次数）/time（天），取值与长度仅在挂载期约定并留快照指纹。本条目只证明声明形态齐备，不代表趋势检测已实现，也不构成对任何运行时窗口取值的验证。"

  absent:                        # 按规程应写而未写
    - expr: "（无）"
      reason: "本轮 S4 verdict_table 与 S6 selection_procedure 均已写入；见 resolved_this_round"

  resolved_this_round:
