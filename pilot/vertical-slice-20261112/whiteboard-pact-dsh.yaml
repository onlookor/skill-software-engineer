# 白板状态（试跑：pact-dsh / DP-1-STYLE）——2026-11-14 第七轮
#
# 依据：母本 0.7（白板谓词集）＋0.21（五状态机）＋0.21.6（机器层谓词）
# 性质：pilot 记录，不是部署实例的正式白板。
# 本轮变更（2026-11-14，人类批准，登记人 user）：
#   V1 登记 layer_of 9 条＋dependency_rule 3 条（口径甲，弱校验：不展开 layer_of）；
#   W4 登记 owned_by 2 条（events.jsonl 拆分「创建/配置」与「写入」；人类 user 2026-11-14 确认为
#   人工核依据，W4 转 pass，但属人工核结论而非机械校验）；
#   本轮再收 W1/W2/G7：W1 登记人工核结论（方案 A，pass，人工核非机械校验）；
#   W2 按机械口径判 fail（index/loop-entry 无独立测试）；G7 登记 GR-005 后判 fail（缺 trend_window）。
#   进程级单例与只读配置不计入共享数据对象。
# 前轮变更（D-C/D-D 裁定）：基线同步（artifact .8→.9、style/SM-DR provisional→approved、
#   10.2.5 1/6→6/6（现行真实分布 pass 32 / fail 7 / escalate 0 / vacuous 9））；登记批 A 域数据（module_inventory、unit_test_inventory、
#   contract、connects、deploy_strategy、shared_data_access 显式空集）。
whiteboard:
  deployment: "pilot-pact-dsh"
  schema_ref: "0.7 谓词集 / 0.21.6 sm_state 正名"
  pattern_version: "pv-1.0"      # 母本 0.7 定义模式版本语义、0.21.6 声明现行值；D-10 已闭合
  version_vector:
    aspect_1: 1                  # +1：style(pact-dsh, …) 写入
    aspect_2: 1                  # 批 A：module_inventory / unit_test_inventory
    aspect_3: 1                  # 批 A：connects / contract / shared_data_access
    aspect_6: 1                  # +1：verdict_table 写入
    aspect_8: 1                  # 批 A：契约测试与单元测试登记面
    aspect_9: 1                  # 批 A：deploy_strategy
    aspect_10: 0                 # 无投影物化（D-11）
  artifact_version: "pilot-20261112.9"

  committed:                     # 已写入（有 step_log 指针）
