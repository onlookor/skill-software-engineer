      resolved_at: "S4"
      evidence: "s4-verdict-pact-dsh.yaml"
      prev_reason: "S4 缺方面 6 目标集与场景参数"
      resolution: "目标集 TS-PACT-DSH-001 v1.0.0 + 包络绑定 EB-PACT-DSH-STY-001 v1.0.0"
    - expr: "selection_procedure(DP-1-STYLE, S6, C6)"
      resolved_at: "S6"
      evidence: "ADR-DP1-STYLE.md"
      prev_reason: "S6 (v) 批准不可达"
      resolution: "批准角色注册表 registry/approval_registry.yaml v1.1.0；主批准人 user 批准"

  pending_projection:
