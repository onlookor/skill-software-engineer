      decision: "ADR-DP1-STYLE"
      state: "approved"
      transitions:
        - {from: "blocked", to: "under_review", trigger: "re_review", actor: "human(user)", at: "2026-11-12T21:29:21+08:00", basis: "障碍消除：批准角色注册表已登记"}
        - {from: "under_review", to: "approved", trigger: "approve", actor: "human(user)", at: "2026-11-12T21:29:21+08:00", basis: "R1 闭环：完整 ADR + 批准"}
        - {from: "approved", to: "provisional", trigger: "grounding_fail", actor: "system", at: "2026-11-12T21:29:21+08:00", basis: "10.2.5 未过（1/6），母本 10.2.5 末段"}
        - {from: "provisional", to: "approved", trigger: "retro_approve", actor: "human(user)", at: "2026-11-13", basis: "10.2.5 达 6/6，临时保守通道经人类事后追认"}
      governance_risk: "GOV-PACT-001（备选链为空）"
    SM-CA:
      artifact: "pilot-20261112.13"
      state: "valid"
      version_vector: {framework_version: "sha256:469d64c0…", registry_version: "1.2.0", artifact_seq: 13}
      transitions:
        - {from: "compiling", to: "valid", trigger: "compile_success ∧ fidelity_pass", actor: "system", at: "2026-11-15", basis: "CA-01；E3 全量 39/39、E4 match=true（18/18）；C7 predicate_satisfied=true（.12 重编译）"}
        - {from: "valid", to: "stale", trigger: "registry_change", actor: "system", at: "2026-11-15", basis: "CA-03：production_schedule 0.4.0→0.6.0（pager=none、INT-D16-9.3-SCOPE-01）与 grounding 1.19.0→1.21.0；版本监听，非人工判定"}
        - {from: "valid", to: "stale", trigger: "registry_change", actor: "system", at: "2026-11-15", basis: "CA-03：guard_registry 1.1.0→1.2.0（GR-005 趋势窗改为无值声明，ADR-GUARD-02；9.2.2 注册表变更）"}
        - {from: "compiling", to: "valid", trigger: "compile_success ∧ fidelity_pass", actor: "system", at: "2026-11-15", basis: "CA-01；E3 全量 39/39、E4 match=true（18/18）、check-card --all fail_count=0；C7 predicate_satisfied=true（.13 重编译）"}
      supersedes: "pilot-20261112.12"
      note: "本状态为 .13 重编译后的 valid。前序 .12 因 guard_registry 1.1.0→1.2.0 按 CA-03 记 stale；.11 因 production_schedule／grounding 变更亦曾记 stale；.10 因注册面变更、.9 因 H-1 后 framework_version 失配亦曾记 stale。重编译映射行见 artifact.yaml recompile_map。.13 未发布（release.artifact_version 仍指 .10）。"

