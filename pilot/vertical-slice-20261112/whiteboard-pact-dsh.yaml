  grounding_status: "10.2.5-verdict-pact-dsh.yaml v1.14.0（6 pass / 0 fail；真实分布 pass 39 / fail 0 / escalate 0 / vacuous 9；判据四：39 条硬性质 FVR 接线＋全量执行；pattern_version=pv-1.1）；批 A 域数据与契约/部署策略声明已于 2026-11-14 登记"
