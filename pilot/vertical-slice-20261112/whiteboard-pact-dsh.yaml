#   「一个小版本或 30 天，取较长者」）；X5：ADR-0002-CT-PACT-BACKEND-01 经人类批准迁入
#   pact-dsh/adr/（approved_by=user、approver_kind=human、approved_at=2026-11-14，Agent 未自批）；
#   T6：contract_tests 登记 pact-dsh/test/contract.test.js（in_ci: true，覆盖七方法/错误码/
#   只增不删）；G3：deploy_strategy 登记回滚（发补丁版回退＋对缺陷版 deprecate）与 5 条
#   style_conformance（逐条对上 ADR-DP1-STYLE 约束）。
# 前轮变更（2026-11-14 第八轮，人类批准，登记人 user）：
