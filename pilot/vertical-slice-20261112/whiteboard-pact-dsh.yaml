        - {from: "under_review", to: "approved", trigger: "approve", actor: "human(user)", at: "2026-11-12T21:29:21+08:00", basis: "R1 闭环：完整 ADR + 批准"}
        - {from: "approved", to: "provisional", trigger: "grounding_fail", actor: "system", at: "2026-11-12T21:29:21+08:00", basis: "10.2.5 未过（1/6），母本 10.2.5 末段"}
        - {from: "provisional", to: "approved", trigger: "retro_approve", actor: "human(user)", at: "2026-11-13", basis: "10.2.5 达 6/6，临时保守通道经人类事后追认"}
