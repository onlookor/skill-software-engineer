# 黄金样本集清单（P0 第 4 批已标注，40 文件已齐；冻结是人类门，status 仍 in_progress）
schema_version: 1
kind: golden_manifest
status: in_progress
frozen_at: null

# 字段位置说明（记账 2）：target_total 位于 quotas 之下、cases_per_batch 位于
# batch_policy 之下；早期外部脚本若读顶层同名字段会落空，须改读嵌套路径。

batch_policy:
  cases_per_batch: 12
  last_batch_may_be_remainder: true    # 第 4 批 4 条；不扩批、不削减桶
  design_revision_per_batch: true      # 每批回改 plans/predicate-ization-design.md 一次
  annotator_reviewer_separate: true

annotation_method:
  mode: single_annotator
  annotator: 标注席（Agent，单席）
  sampling: independent_review_seat
  sampling_ratio_min: 0.20
  # sampling_status 枚举定义：pending＝尚无任何批次的抽检结论登记；partial＝部分已执行
  # 抽检的批次结论已登记、其余已执行批次待登记；complete＝已执行抽检的全部批次结论均已
  # 登记、无悬置结果（当前第 1–3 批均已登记）。该值不主张全部样本均已抽检——第 4 批
  # （收尾批）抽检尚未执行，其结论由独立复核席仓外执行后另行追加登记。抽检一律由
  # 独立复核席在仓外执行，仓内只登记结论，不是仓内签署。
  sampling_status: complete
  inter_annotator_agreement: not_estimable
  note: 按 plans/predicate-ization-execution-plan.md 第 3 节第 2 项的降级口径；这不是双人独立标注，Cohen's κ 不可估计，不得作为任何结论依据。
  sampling_note: 第 1 批抽检 5 条一致、第 2 批抽检 6 条一致、第 3 批抽检 12 条全覆盖一致，合计 23 条一致、0 不一致、0 条无法判定。抽检一律由独立复核席在仓外执行，仓内只登记结论，不是仓内签署；第 4 批（收尾批 4 条）抽检尚未执行。

quotas:
  # 三层口径（人类 2026-11-19 裁定）：① 桶数；② unqualified 单列配额；③ 文件总数 = ① + ②。
  bucket_total: 36
  by_aspect:
    '4': 10
    '5': 10
    '9': 10
  process_record: 6
  unqualified_min: 4          # 一律 aspect=0，不占桶
  no_op_min: 6                # 第 4 批后共 7（GC-0003／0007／0017／0022／0028／0035／0039）
  min_distinct_names: 20
  # 覆盖进度（记账 2）：第 2 批后 19／33；第 3 批引入 8 个新名字后 27／33，min_distinct_names 20
  # 已满足；第 4 批（收尾批）再引入 2 个新名字（exclusion_record／selection_procedure），
  # 覆盖 29／33；仍 uncovered 4 名见文末列表。
  expected_files: 40          # = bucket_total 36 + unqualified_min 4；第 4 批后已达成（40 文件齐）。status 仍 in_progress、frozen_at 仍 null——冻结是人类门，执行方不得自行冻结。
  target_total: 36            # 与 bucket_total 同义，保留旧名避免外部脚本落空；以 bucket_total 为准
  target_total_note: target_total 是桶数（方面 4／5／9 各 10 ＋ process_record 6），不是文件总数；文件总数见 expected_files。
  unqualified_note: 任何 unqualified 一律 aspect=0、不占桶；不存在「带方面语境的 unqualified」这一中间态——被判不合格即无方面主张，给它记方面等于把「本来想写哪个方面」混进「实际产出了什么」。当前 4 条（GC-0012／GC-0015／GC-0018／GC-0040）全部计入本配额；GC-0015／GC-0018／GC-0040 原本指向的方面记在该条 notes 里，不进任何统计。counts.unqualified 与配额进度单列：前者数全部 outcome_kind=unqualified，后者只数已达配额口径的条目；此刻两者都是 4，但定义不同，不得混用或互相替代。
  unqualified_progress: 4      # 已达配额口径的条数（aspect=0 的 unqualified）
  remaining_gap: 已归零：40 文件齐＝桶 36 满（4／5／9 = 10／10／10 ＋ process_record 6）＋ aspect=0 的 unqualified 4 满。expected_files 已达成；status 仍 in_progress、frozen_at 仍 null——冻结是人类门，执行方不得自行冻结。

counts:
  total: 40
  new: 29
  no_op: 7
  unqualified: 4
  undecidable: 0
  by_aspect: {'4': 10, '5': 10, '9': 10, 'process_record': 6, '0': 4}
  by_aspect_basis: cases[].aspect 表示案例所属方面：方面样本取源卡 _aspect（4／5／9）；过程记录写 0，记入 process_record 桶；unqualified 一律写 0，记入 '0' 桶。4／5／9 直接取该字段，process_record 取 d3_disposition=process_record 的条数，'0' 只收 aspect=0 且非 process_record 的条目。五项相加等于 total；桶数 = 4／5／9／process_record 四项之和 = 36。

