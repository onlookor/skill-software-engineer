repo_path: work
test_command: "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py'"
repro_runs: 2
repro_timeout_seconds: 30
allowed_scope:
  - calc.py
cache_cleanup_policy: "S3 第②段与第③段前各清空一次 work 内 __pycache__；测试命令以 PYTHONDONTWRITEBYTECODE=1 运行，不使用其它缓存或构建产物。"
# 以下两项是快照元数据，不属于七项，也不参与「缺一即无法判定」。
agreed_at: 2026-11-16
